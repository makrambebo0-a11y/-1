 the heavens, and say, “Our Father ....”\n** je hina qen ouhyt efouab `ntenertolman qen ouparrycia `naterho] `ews oube Pekiwt e;ouab etqen nivyou`i ouoh `ejwc@ je Peniwt...\nأنت هو الله الرحوم مخلص كل أحد الذي تجسد لأجل خلاصنا الذي أضاء لنا نحن الخطاة، الذي صام عنا أربعين يومًا وأربعين ليلة بسر لا ينطق به، الذي أنقذنا من الموت وأعطانا جسده المقدس ودمه الكريم لغفران خطايانا الذي كلم الجمع وتلاميذه القديسين ورسله الأطهار قائلًا: هذا هو خبز الحياة الذي نزل من السماء ليس كما أكل آباؤكم المن في البرية وماتوا. من يأكل جسدي ويشرب دمي يحيا إلى الأبد وأنا أقيمه في اليوم الأخير فلهذا نسأل ونطلب من صلاحك يا محب البشر طهر نفوسنا وأجسادنا وأرواحنا لكي بقلب طاهر نجرؤ بدالة بغير خوف أن نصرخ نحو أبيك القدوس الذي في السموات ونقول: يا أبانا الذي في السموات....\nأنت هو الله الرحيم مخلص كل أحد الذي تجسد لأجل خلاصنا الذي أضاء لنا نحن الخطاة. الذي صام عنا أربعين يوما وأربعين ليله بسر لا ينطق به. الذي أنقذنا من الموت وأعطانا جسده المقدس ودمه الكريم لغفران خطايانا. الذي كلم الجمع وتلاميذه القديسين ورسله الأطهار قائلًا: هذا هو خبز الحياة الذي نزل من السماء, ليس كما أكل آباؤكم المن في البرية وماتوا. من يأكل جسدي ويشرب دمى يحيا إلى الأبد وأن أقيمة في اليوم الأخير. فلهذا نسأل ونطلب من صلاحك يا محب البشر طهر نفوسنا وأجسادنا وأرواحنا. لكي بقلب طاهر نجرأ بدالة بغير خوف أن نصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات..........\nصلاة القسمة\nالخولاجي\nقسمة للأب في احد الشعانين\nقسمة للآب في الصوم الكبير\n"},{"n":"8- قسمه للآب تقال في عيد أحد الشعانين وسنوي","t":"أيها الرب ربنا، مثل عجب صار اسمك على الأرض كلها.\n** O Lord, our Lord, how wonderful has became Your name in all the earth.\n** `P[oic Pen[oic `m`vry] `nou`svyri afswpi `nje pekran hijen pikahi tyrf.\nلأنه قد ارتفع عِظَم بهائك فوق السموات.\n** For the greatness of Your beauty is exalted above the heavens.\n** Je ac[ici `nje `;metnis] `nte tekmetcaie ca`pswi `nnivyou`i.\nمن أفواه الأطفال والرضعان هيأت سُبحاً.\n** Out of the mouth of little children and sucklings You have prepared praise.\n** `Ebol qen rwou `nhankouji `n`alwou`i nem nye;ouem[i akcebte pi`cmou.\nفهيئ أيضاً يا رب نفوسنا لنسبحك، ونرتل لك، ونباركك، ونخدمك، ونسجد لك، ونمجدك، ونشكرك كل يوم وكل ساعة.\n** Prepare also, O Lord, our souls for praising You, chanting to You, blessing You, serving You, worshipping You, glorifying You, giving thanks to You, every day and every hour.\n** Cob] de on `P[oic `nny`ete noun `m'u,y@ `e`pjinhwc `erok `eerhumnoc `erok@ `e`cmou `erok@ `esemsi `mmok@ `eouwst `mmok@ `e]`wou nak@ `esep`hmot `ntotk@ kata `ehoou niben nem kata ounou niben.\nلكي نعترف لك، ونصرخ نحوك أيها الآب القدوس الذي في السموات، ونقول: \"يا أبانا...\"\n** That we may confess to You and cry out to You, O holy Father, who is in the heavens, and say, \"Our Father...\"\n** Hwcte `ntenouwnh nak `ebol@ ouoh `ntenws `e`pswi harok@ `Viwt e;ouab et qen nivyou`i@ ouoh `ntenjoc@ je Peniwt....\nأيها الرب ربنا لقد صار اسمك عجيبًا على الأرض كلها، لأنه قد أرتفع عظم بهائك فوق السموات من أفواه الأطفال والرضعان هيأت سبحًا فهيئ أيضًا يا رب نفوسنا لنسبحك ونرتل لك ونباركك ونخدمك ونسجد لك ونمجدك ونشكرك كل يوم وكل ساعة لكي نعترف لك ونصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nأيها الرب ربنا مثل عجب صار اسمك على الأرض كلها. لأنة قد ارتفع عظم بهائك فوق السموات. من أفواه الأطفال والرضعان هيأت سبحا. فهيئ أيضا يا رب نفوسنا لنسبحك ونرتل لك ونباركك ونخدمك ونسجد لك ونمجدك ونشكرك كل يوم وكل ساعة. لكي نعترف لك ونصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات..........\nصلاة القسمة\nالخولاجي\nقسمة للآب في خميس العهد\nقسمه للأبن في صوم الاربعين المقدسة\n"},{"n":"9- قسمة للآب على ذبح إسحق (تقال في يوم خميس العهد وفي أي وقت)[1]","t":"وحدث في الأيام التي أراد اللّه أن يجرب إبراهيم ويعلم قلبه ومحبته فيه.\n** And it came to pass in the days when God wanted to test Abraham and know his heart and His love for Him,\n** Acswpi de qen ni`ehoou `eta `Vnou] ouws `e[wnt `nAbraam ouoh `ntef`emi `epefhyt nem pefmei eqoun `erof ouoh pejaf naf je Abraam Abraam [i `mpekmenryt `nsyri Icaak ouoh `anitf nyi `nou`[lil hijen pitwou e]natamok erof.\nأنه قال له: إبراهيم إبراهيم خذ ابنك الحبيب إسحق وقدمه لي محرقة على الجبل الذي أعلمك به.\n** That He said to him, “Abraham, Abraham, take your beloved son, Isaac, and offer him to Me as a burnt offering, upon the mountain of which I tell you.”\n** Aftwnf de `nje Abraam `ntoou`i ouoh afjwk `ntef`e`w af[i de `n`alou =b nem Icaak pefsyri af[i `noujor] nem ou`,rwm afmosi `ebol hijen pikahi ouoh afnau `epima hi `vouei `eta `P=o=c tamof `erof.\nفقام إبراهيم باكراً وأسرج دابته، وأخذ غلامين وإسحق ابنه. وأخذ سكيناً وناراً. ومشى على الأرض فرأى الموضع من بعيد الذي أعلمه به الرب.\n** And Abraham rose up in the morning and saddled his donkey, took two servants and Isaac his son. And he took a knife and fire, walked on the earth, and saw from afar the place of which the Lord had told him.\n** Ouoh pejaf `nnefalwou`i je hemci `n;wten `mpai ma nem ]`e`w `anok de nem Icaak pasyri tennasenan `ntenouwst ouoh `ntentac;o harwten. Af[i de `nje Abraam `nnirwkh `nte pi`[lil ouoh aftalwou `ejen Icaak pefsyri af[i de `mpi`,rwm qen tefjij nem ]jor].\nفقال لغلاميه: اجلسا أنتما ههنا مع الدابة. وأما أنا وإسحق ابني فنذهب ونسجد ثم نرجع إليكما.\n** And he said to his servants, “You remain in this place with the donkey. I and Isaac, my son, shall go to worship, and return to you.”\n** Peje Icaak de `mpefiwt je paiwt hyppe ic pi`,rwm nem pirwkh af;wn pi`ecwou `etennaenf `epi[lil peje Abraam de naf je v] vy`etafouahcahni nan `etalo naf `nou;uci`a `n;of e;nanau eou`ecwou naf `ep`[lil pasyri\nوأخذ إبراهيم حطب المحرقة ووضعه على إسحق ابنه، وأخذ بيده النار والسكين. فقال إسحق لأبيه: يا أبتاه، هوذا النار والحطب، وأين الخروف الذي نقدمه للمحرقة؟\n** And Abraham took the firewood for the burnt offering, and laid it upon Isaac, his son, and took fire in his hand, and the knife. And Isaac spoke to his father, saying, “My father, behold the fire and the wood, but where is the lamb which we shall offer as a burnt offering?”\n** Af[i de `nhan`wni `nje Abraam afkwt `nouma`nerwousi af[i `nnirwkh aftalwou hijen pima`nerswousi ouoh af[i `nIcaak pefsyri afconhf aftalof `ehryi ejen pimanerswousi af[i `n]jor] `eqelqwlf.\nفقال له إبراهيم: إن اللّه الذي أمرنا أن نرفع له ذبيحة هو يرى حملاً له للمحرقة يا ابني.\n** And Abraham said to him, “God, who commanded us to offer Him a sacrifice, will provide for Himself the lamb for a burnt offering, my son.”\n** Ouoh `apiaggeloc `nte `P=o=c mou] e;be Abraam efjw `mmoc naf je Abraam Abraam `anau `mper[oh `epekalou oude `mper`iri naf `noupethwou.\nوأخذ إبراهيم حجارة وبنى مذبحاً. وأخذ الحطب ورفعه على المذبح، وأخذ إسحق ابنه وربطه ووضعه على المذبح، وأخذ السكين ليذبحه.\n** And Abraham took stones and built an altar, and took the firewood and laid it upon the altar, and took Isaac, his son, bound him and laid him on the altar, and took the knife to slay him.\n** `Etafnau `nje `P=o=c `epekmei `eqoun `erof ouoh pejaf je `anok pe `P=o=c Peknou] aiwrk `mmoi je qen ou`cmou qen ou`asai ei `e`;re pek`jroj `asai.\nوان ملاك الرب نادى إبراهيم قائلاً: إبراهيم إبراهيم، أنظر لا تلمس فتاك ولا تصنع به شراً. لما نظر الرب محبتك فيه فقال: إني إنا هو الرب إلهك، أقسمت بذاتي إني بالبركة أباركك، وبالكثرة أكثر نسلك.\n** And the Angel of the Lord called to Abraham, saying to him, “Abraham, Abraham, Behold, do touch not your hand on your lad, or do him any harm. When the Lord saw your love for Him, He said, ‘I am the Lord your God. By Myself I have sworn that in blessing I will bless you, and in multiplying I will multiply your seed.’\n** Ouoh affai `nnefbal `nje Abraam afnau `eou`ecwou ef,y hijen pi`ssyn efmyr qen peftap=b ouoh af,w `nIcaak pefsyri af[i `mpi`ecwou ouoh afenf `e`hryi `nou`[lil `ntefsebiw.\nفرفع إبراهيم عينيه فنظر خروفا عند الشجرة موثقاً بقرنيه، فترك إسحق ابنه وأخذ الخروف وأصعده محرقة عوضاً عنه.\n** And Abraham lifted up his eyes and saw a ram laid upon the tree, caught by its horns. So he left Isaac, his son, and took the ram, and offered it up as a burnt offering-instead of him.\n** `Pqolqel de `nIcaak ne ou[wrem pe `epivwn `ebol `m`p`cnof `nte P=,=c `Psyri `m`Vnou] hijen pi`ctauroc e;be `poujai `mpikocmoc.\nفذبح إسحق كان إشارة إلى هرق دم المسيح إبن اللّه على الصليب عن خلاص العالم. وكما حمل إسحق حطب المحرقة، كذلك حمل المسيح خشبة الصليب. وكما رجع إسحق حياً هكذا أيضا قام المسيح حيا من الأموات، وظهر لتلاميذه القديسين.\n** Thus, the slaying of Isaac was a type of the shedding of the Blood of Christ, the Son of God, on the Cross for the salvation of the world. And as Isaac carried the firewood for the burnt offering, likewise Christ carried the wood of the Cross. And as Isaac returned alive, likewise Christ rose alive, from the dead and appeared to His Holy disciples.\n** Ouoh kata `vry] `eta Icaak `wli `nnirwkh `nte pi[lil pairy] af`wli `nje P=,=c `mpise `nte pi`ctauroc.\nاللهم الذي قبل ذبيحة أبينا إبراهيم، اقبل هذه الذبيحة منا في هذه الساعة. بارك هذه القرابين، بارك الذين قدمت عنهم. نيح نفوس الراقدين.\n** O God, who received the sacrifice of our father Abraham, receive this sacrifice from our hands in this hour. Bless these gifts. Bless those on whose behalf they have been offered, and repose the souls of those who have died.\n** Ouoh kata `vry] `eta Icaak tac;o efwnq pairy] hwf P=,=c aftwnf efonq `ebolqen nye;mwout ouoh afouonhf `nnef`agioc `mma;ytyc.\nفليبارك المسيح على جميع قلوبنا وأرواحنا. لكي بقلب طاهر، ونفس مستنيرة، ووجه غير مخزي، وإيمان بلا رياء، ومحبة كاملة، ورجاء ثابت. نجسر بدالة بغير خوف، أن ندعوك يا الله الآب القدوس الذي في السموات، ونقول:\n** May Christ bless the hearts and spirits of us all, so that with a pure heart, an enlightened soul, an unashamed face, a faith unfeigned, a perfect love, and a firm hope, we may dare with boldness, without fear, to pray to You, O God, the Holy Father who is in the heavens, and say,\n** `Vnou] vy`etaf[i `n];uci`a `nte peniwt Abraam [i `ntai ;ucia `ntoten qen tai ounou ;ai `cmou `enai dwron nai `cmou `eny`etau`enou `ejwou ma`mton `nni'u,y `nny`etaumou maref`cmou `nje P=,=c `ejen nenhyt tyrou nem nen`pneuma.\n** Je hina qen ouhyt efouab.\nوحدث في الأيام التي أراد الله فيها أن يجرب إبراهيم ويعلم قلبه ومحبته فيه، أن قال له إبراهيم إبراهيم، خذ ابنك الحبيب إسحق وقدمه لي محرقة على الجبل الذي أعلمك به، فقام إبراهيم باكرًا وأسرج دابته، وأخذ غلامين وإسحق ابنه، وأخذ سكينًا ونارًا ومشي على الأرض، فرأي الموضع بعيد الذي أعلمه به الرب، فقال لغلاميه أجلسا أنتما ههنا مع الدابة، وأما أنا وإسحق ابني فنذهب ونسجد ثم نرجع إليكما وأخذ إبراهيم حطب المحرقة ووضعه على إسحق ابنه، وأخذ بيده النار والسكين، فقال إسحق لأبيه: يا أبتاه، هوذا النار والحطب، وأين الخروف الذي نقدمه للمحرقة؟ فقال له إبراهيم: إن الله الذي أمرنا أن نقدم له ذبيحة هو يري حملًا له للمحرقة يا ابني وأخذ إبراهيم حجارة وبني مذبحًا وأخذ الحطب ورفعه على المذبح. وأخذ إسحق ابنه وربطة ووضعه على المذبح وأخذ السكين ليذبحه ونادي ملاك الرب إبراهيم قائلًا له: إبراهيم إبراهيم، أنظر لا تلمس فتاك ولا تصنع به شرًا فلما نظر الرب محبتك فيه قال: إني أنا هو الرب إلهك أقسمت بذاتي إني بالبركة أباركك وبالكثرة أكثر نسلك فرفع إبراهيم عينية فنظر خروفًا عند الشجرة موثقًا بقرنيه فترك إسحق ابنه وأخذ الخروف وأصعده محرقة عوضًا عنه فذبح إسحق كان إشارة إلى هرق دم المسيح ابن الله على الصليب عن خلاص العالم وكما حمل إسحق حطب المحرقة كذلك حمل المسيح خشبة الصليب وكما رجع إسحق حيًا هكذا أيضًا المسيح قام حيًا من الأموات وظهر لتلاميذه القديسين اللهم يا من قبل ذبيحة أبينا إبراهيم اقبل هذه الذبيحة منا في هذه الساعة([2]) بارك هذه القرابين بارك الذين قدمت عنهم نيح نفوس الأموات فليبارك المسيح على قلوبنا وأرواحنا لكي بقلب طاهر ونفس مستنيرة وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nو حدث في الأيام التي أراد الله أن يجرب إبراهيم ويعلم قلبه ومحبته فيه. أنه قال له, إبراهيم إبراهيم خذ ابنك الحبيب اسحق وقدمه لي محرقة على الجبل الذي أعلمك به. فقام إبراهيم باكرًا وأسرج دابته وأخذ غلامين واسحق ابنة, وأخذ سكينا ونارا, ومشى على الأرض, فرأى الموضع من بعيد الذي أعلمه به الرب. فقال لغلاميه اجلسا أنتما ههنا مع الدابة. وأما أنا واسحق ابني فنذهب ونسجد ثم نرجع إليكما. وأخذ إبراهيم حطب المحرقة ووضعه على اسحق ابنة, وأخذ بيده النار والسكين. فقال اسحق لأبيه يا أبتاه هوذا النار والحطب وأين الخروف الذي تقدمه للمحرقة, فقال له إبراهيم إن الله الذي أمرنا أن نرفع له ذبيحة هو يرى حملا له للمحرقة يا ابني. وأخذ إبراهيم حجارة وبنى مذبحا, وأخذ الحطب ورفعه على المذبح, وأخذ اسحق ابنة وربطه ووضعه على المذبح, وأخذ السكين ليذبحه. وان ملاك الرب نادى إبراهيم قائلا له: إبراهيم إبراهيم انظر لا تلمس فتاك ولا تصنع به شرا. لما نظر الرب محبتك فيه فقال إني أنا هو الرب إلهك أقسمت بذاتي إني بالبركة أباركك وبالكثرة أكثر نسلك. فرفع إبراهيم عينية فنظر خروفًا عند الشجرة موثقا بقرنية, فترك اسحق ابنة وأخذ الخروف وأصعده محرقه عوضا عنه. فذبح اسحق كان إشارة إلى هرق دم المسيح ابن الله على الصليب عن خلاص العالم. وكما حمل اسحق حطب المحرقة كذلك حمل المسيح خشبة الصليب. وكما رجع اسحق حيا هكذا أيضا المسيح قام حيا من الأموات وظهر لتلاميذه القديسين. اللهم الذي قبل ذبيحة أبينا إبراهيم, اقبل هذه الذبيحة منا في هذه الساعة. بارك هذه القرابين بارك الذين قدمت عنهم. نيح نفوس الأموات. فليبارك المسيح على قلوبنا جميعا وأرواحنا. لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت. نجسر بداله بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات........\n"},{"n":"10- قسمة للابن تُقال في سبت الفرح | سبت النور","t":"يا يسوع المسيح ذا الاسم المخلص، الذي بكثرة رحمته نزل إلى الجحيم وأبطل عِز الموت.\n** O Jesus Christ, to whom belongs the name of salvation, who according to the multitude of His mercy descended into Hades and destroyed the power of death.\n** Iycouc Pi`,rictoc va piran `noujai@ vy`ete kata `p`asai `nte pefnai afsenaf `epecyt `e`Amen] afkwrf `m`p`amahi `m`vmou.\nأنت هو ملك الدهور، غير المائت، الأبدي، كلمة الله الذي على الكل، راعي الخراف الناطقة.\n** You are the King of ages, the Immortal, the Everlasting, the Logos of God who are above all, the Shepherd of the rational sheep,\n** `N;ok pe `Pouro `nte ni`ewn@ Pia;mou Pisa`eneh@ Pilogoc `nte `Vnou] et hijen pi`e`ptyrf@ Piman`ecwou `nte ni`ecwou `nlogikon.\nرئيس كهنة الخيرات العتيدة، الذي صعد إلى السموات وصار فوق السموات.\n** the High Priest of the good things to come, who ascended into the heavens and has become higher than the heavens.\n** Piar,y`ereuc `nte ni`aga;on e;naswpi@ vy`etafsenaf `e`pswi `enivyou`i@ aferca`pswi `nnivyou`i.\nودخل داخل الحجاب، موضع قدس الأقداس، الموضع الذي لا يدخل إليه ذو طبيعة بشرية.\n** And He went within the veil to the place of the Holy of Holies, the place into which no one of man's nature can enter.\n** Afsenaf caqoun `mpikatapetacma@ pima e;ouab `nte nye;ouab@ pima `ete `mpare `hli `mvucic `nrwmi hwl `eqoun `erof.\nوسار سابقاً عنا، صائراً رئيس كهنة إلى الأبد على رتبة ملكي صادق.\n** He became a forerunner on our behalf, having become high priest forever according to the order of Melchizedek.\n** Afswpi efoi `m`prodromoc `e`hryi `ejwn@ `eafswpi efoi `nar,y`ereuc sa `eneh kata `ttaxic `mMel,icedek.\nأنت هو الذي تنبأ من أجلك أشعياء النبي قائلاً: \"مثل خروف سيق إلى الذبح، ومثل حمل بلا صوت أمام الذي يجزه، هكذا لا يفتح فاه. رُفِع حُكمُه في تواضعه، وجيله من يقدر أن يَقُصَّه؟\"\n** You are He, concerning whom the prophet Isaiah, prophesied, saying, \"As a sheep, He was led to the slaughter. And as a lamb silent before His shearer, so He opened not His mouth. In His humiliation His judgment was taken away, and who shall declare His generation?\"\n** `N;ok pe `eta `Yca`yac pi`provytyc er`provyteuin e;bytk efjw `mmoc@ je `m`vry] `nou`ecwou auenf `e`pqolqel@ ouoh `m`vry] `nouhiyb `mpe`m;o `mvyetqwk `mmof efoi `nat`cmy@ pairy] `n`fouwn `nrwf an@ au`wli `mpefhap qen pef;ebio@ tefgene`a de nim pe;na`sviri `eroc.\nجُرحت لأجل خطايانا، وتوجعت لأجل آثامنا، تأديب سلامنا عليك، وبجراحاتك شفينا، كنا كلنا ضالين مثل خراف.\n** You were wounded on account of our sins and were weakened for our iniquities. The chastisement of our peace was upon You, and with Your bruises, we were healed. All we like sheep have gone astray.\n** Ak[i erqot e;be nennobi@ ouoh akswni e;be nen`anomia `t`cbw `ntenhiryny `e`hryi `ejwk@ qen neklele,ymi anoujai@ nancwrem tyren pe `m`vry] `nhan`ecwou.\nأتيت يا سيدنا وأنقذتنا بمعرفة صليبك الحقيقية. وأنعمت لنا بشجرة الحياة التي هي جسدك الإلهي ودمك الحقيقي.\n** You have come, O our Master, and saved us through the true knowledge of Your Cross, and granted us the tree of life, which is Your divine Body and true Blood.\n** Ak`i Pennyb aknahmen `eqoun `epi`emi `mmyi `nte Pek`ctauroc@ aker`hmot nan `mpi`ssyn `nte `pwnq@ `ete Pekcwma `nnou] pe nem Pek`cnof `n`aly;inon.\nمن أجل هذا نسبحك، ونباركك، ونخدمك، ونسجد لك، ونمجدك، ونشكرك كل حين.\n** Therefore, we praise You, we bless You, we serve You, we worship You, we glorify You, and we give thanks to You at all times.\n** E;be vai tenhwc `erok ten`cmou `erok tensemsi `mmok tenouwst `mmok ten]`wou nak tensep`hmot `ntotk `ncyou niben.\nنسأل ونطلب إليك يا محب البشر، أللهم اقبل ذبيحتنا منا يا سيدنا، كما قبلت قرابين وبخورات وسؤالات رؤساء الآباء والأنبياء والرسل وجميع قديسيك.\n** We ask and entreat You, O God, the Lover of mankind, receive our sacrifice from our hands, O our Master, as You have received the gifts, the incense, and the supplications of the patriarchs, the prophets, the Apostles, and all Your saints.\n** Ten]ho ouoh tentwbh `mmok Pimairwmi `Vnou]@ sep pensouswousi `ntoten Pennyb@ `m`vry] `etakswp `erok `nnidwron nem ni`c;oinoufi nem ni]ho `nnipatriar,yc nem ni`provytyc nem ni`apoctoloc nem nye;ouab tyrou `ntak.\nطهر نفوسنا، وأجسادنا، وأرواحنا، ونياتنا.\n** Purify our souls, our bodies, our spirits, and our consciences,\n** Matoubo `nnen'u,y nem nencwma nem nen`pneuma nem nencunidycic.\nلكي بقلب طاهر، ونفس مستنيرة، ووجه غير مخزي، وإيمان بغير رياء، ومحبة كاملة، ورجاء ثابت.\n** so that with a pure heart, an enlightened soul, an unashamed face, a faith unfeigned, a perfect love, and a firm hope,\n** Hopwc qen ouhyt efouab@ nem ou'u,y `eac[iouwini@ nem ouho `nat[isipi@ nem ounah] `natmetsobi@ nem ou`agapy ecjyk `ebol@ nem ouhelpic ectajryout.\nنجسر بدالة بغير خوف أن نقول الصلاة المقدسة التي سلمتها لتلاميذك القديسين، ورسلك الأطهار قائلاً لهم: \"متى صليتم فأطلبوا هكذا، وقولوا: أبانا الذي...\"\n** we may dare with boldness, without fear, to say the holy prayer, which You have given to Your holy Disciples and saintly Apostles, saying to them, \"Whenever you pray, entreat in this manner and say, Our Father....\"\n** `Ntenertolman qen ouparrycia `naterho] `ejw `n]eu,y e;ouab@ ;y`etaktyic `etotou `nny`ete nouk `n`agioc `mma;ytyc ouoh `n`apoctoloc e;ouab ekjw `mmoc nwou@ je `eswp `aretensaner`proceu,ec;e twbh `mpairy] ouoh `ajoc@ je Peniwt....\nيا يسوع المسيح ذا الاسم المخلص الذي بكثرة رحمته نزل إلى الجحيم وأبطل عز الموت أنت هو ملك الدهور غير المائت الأبدي كلمة الله الذي على الكل راعي الخراف الناطقة رئيس كهنة الخيرات العتيدة الذي صعد إلى السموات وصار فوق السموات ودخل داخل الحجاب موضع قدس الأقداس الموضع الذي لا يدخل إليه ذو طبيعة بشرية وسار سابقًا عنا صائرًا رئيس كهنة إلى الأبد على رتبة ملكي صادق أنت هو الذي تنبأ من أجلك إشعياء النبي قائلًا: مثل خروف سيق إلى الذبح ومثل حمل بلا صوت أمام الذي يجزه هكذا لا يفتح فاه رفع حكمه في تواضعه وجيله من يقدر أن يقصه جرحت لأجل خطايانا وتوجعت لأجل آثامنا تأديب سلامنا عليك وبجراحاتك شفينا كنا ضالين مثل خراف أتيت يا سيدنا وأنقذتنا بمعرفة صليبك الحقيقية وأنعمت لنا بشجرة الحياة التي هي جسدك الإلهي ودمك الحقيقي وأنعمت لنا بشجرة الحياة التي هي جسدك الإلهي ودمك الحقيقي من أجل هذا نسبحك ونباركك ونخدمك ونسجد لك ونمجدك ونشكرك كل حين نسأل ونطلب إليك يا محب البشر اللهم اقبل ذبيحتنا منا يا سيدنا كما قبلت قرابين وبخور وسؤالات رؤساء الآباء والأنبياء والرسل وجميع قديسيك طهر نفوسنا وأجسادنا وأرواحنا ونياتنا لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن نقول الصلاة المقدسة التي سلمتها لتلاميذك القديسين ورسلك الأطهار قائلًا لهم إذا صليتم فاطلبوا هكذا وقولا يا أبانا الذي في السموات.... إلخ.\nيا يسوع المسيح ذو الاسم المخلص الذي بكثرة رحمته نزل إلى الجحيم وأبطل عز الموت. أنت هو ملك الدهور غير المائت الأبدي كلمة الله الذي على الكل, راعى الخراف الناطقة. رئيس كهنة الخيرات العتيدة الذي صعد إلى السموات وصار فوق السموات. ودخل داخل الحجاب, موضع قدس الأقداس الموضع الذي يدخل إليه ذو طبيعة بشرية. وصار سابقا عنا صائرا رئيس كهنة إلى الأبد على رتبة ملكي صادق. أنت الذي إشعياء النبي تنبأ من أجلك قائلًا: مثل خروف سيق إلى الذبح, ومثل حمل بلا صوت أمام الذي يجزه, هكذا لا يفتح فاه, رفع حكمة في تواضعه وجيله من يقدر أن يقصه. جرحت لأجل خطايانا وتوجعت لأجل آثامنا, تأديب سلامنا عليك. وبجراحاتك شفينا, كنا كلنا ضالين مثل خراف. أتيت يا سيدنا وأنقذتنا بمعرفه صليبك الحقيقية وأنعمت لنا بشجرة الحياة التي هي جسدك الإلهي ودمك الحقيقي. من أجل هذا نسبحك ونباركك ونخدمك ونسجد لك ونمجدك ونشكرك كل حين. نسأل ونطلب إليك يا محب البشر, اللهم اقبل ذبيحتنا منا يا سيدنا, كما قبلت قرابين وبخورات وسؤالات رؤساء الآباء والأنبياء والرسل وجميع قديسيك. طهر نفوسنا وأجسادنا وأرواحنا ونياتنا. لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بغير رياء ومحبة كاملة ورجاء ثابت. نجسر بدالة بغير خوف أن نقول الصلاة المقدسة التي سلمتها لتلاميذك القديسين ورسلك الأطهار قائلا لهم: إذا ما صليتم فاطلبوا هكذا وقولوا: أبانا الذي في السموات....\nصلاة القسمة\nالخولاجي\nقسمه للابن في عيد القيامه\nقسمة للآب في خميس العهد\n"},{"n":"11- قسمة للإبن تُقال في عيد القيامة المجيد","t":"أيها المسيح إلهنا رئيس كهنة الخيرات العتيدة، ملك الدهور، الغير المائت، الأبدي، كلمة الله الذي على الكل.\n** O Christ our God, the High Priest of the good things to come, King of the ages, the Immortal, the Everlasting, the Logos of the Father who are above all,\n** Pi`,rictoc Pennou]@ Piar,y`ereuc `nte ni`aga;on e;naswpi@ `Pouro `nte ni`ewn@ Pia;mou Pisa`eneh@ Pilogoc `nte `Vnou] et hijen pi`e`ptyrf.\nالذي أنعم لنا بهذا السر العظيم، الذي هو جسده المقدس ودمه الكريم لغفران خطايانا.\n** who granted us this great Mystery which is His holy Body and His precious Blood for the forgiveness of our sins.\n** Vy`etafer`hmot nan `mpainis] `mmuctyrion@ `ete Pefcwma e;ouab nem Pef`cnof ettaiyout@ `e`p,w `ebol `nte nennobi.\nهذا هو الجسد الذي أخده من سيدتنا وملكتنا كلنا القديسة مريم، وجعله واحداً مع لاهوته.\n** This is the Body which He took from our Lady, the Lady of us all, Saint Mary, and made one with His divinity.\n** Vai pe Picwma `etaf[itf `ebol qen ten[oic `nnyb tyren ]`agia Maria@ ouoh afaif `nouai nem tefme;nou].\nهذا هو الذي نزل إلى الجحيم، وأبطل عِز الموت، وسبى سبياً، وأعطى الناس كرامات.\n** This is He who descended into Hades, abolished the power of death, led captivity captive, and gave honors to men.\n** Vai pe vy`etafsenaf `epecyt `e`Amen]@ afkwrf `m`p`amahi `m`vmou@ afere,malwteuin `noue,malwcia af] `nhantaio `nnirwmi.\nرفعة قديسيه إلى العلي معه، أعطاهم قرباناً لأبيه، بذوقه الموت عنا خلص الأحياء، وأعطي النياح للذين رقدوا.\n** He lifted His saints up with Him and gave them as a gift to His Father. Through His tasting of death for us, He saved those who are alive and reposed those who have died.\n** Nye;ouab `ntaf af`olou `e`p[ici nemaf@ aftyitou `nhandwron `ePefiwt@ hiten pefjem]pi `m`vmou qaron afnohem `nnyetonq ouoh af]`mton `nny`etaumou.\nونحن أيضاً الجلوس في الظلمة زمناً، أنعم لنا بنور قيامته من قِبَل تجسده الطاهر.\n** And we too, who were sitting in darkness for a season, He granted us the light of His Resurrection through His holy Incarnation.\n** `Anon de hwn qa nyethemci qen `p,aki `noucyou@ afer`hmot nan `m`vouwini `nTef`anactacic@ `ebol hiten pefjin[icarx e;ouab.\nفليضئ علينا نور معرفتك الحقيقية لنضئ بشكلك المحيي.\n** May the light of Your true knowledge shine upon us, that we may shine with Your living image\n** Mareferouwini `eron `nje `vouwini `nte pek`emi `mmyi@ e;ren]mou`e qen pek`cmot `nwnq.\nونجسر بداله بغير خوف أن نصرخ نحو أبيك الذي في السموات، ونقول: \"يا أبانا...\"\n** and may dare with boldness, without fear, to cry to Your Father who is in the heavens, and say, “Our Father....”\n** Ouoh `ntenertolman qen ouparrycia `naterho]@ `ews oube Pekiwt et qen nivyou`i@ ouoh `ejoc@ je Peniwt....\nأيها المسيح إلهنا رئيس كهنة الخيرات العتيدة ملك الدهور غير المائت الأبدي كلمة الله الذي على الكل الذي أنعم علينا بهذا السر العظيم الذي هو جسده المقدس ودمه الكريم لغفران خطايانا هذا هو الجسد الذي أخذه من سيدتنا وملكتنا كلنا القديسة مريم وجعله واحدًا مع لاهوته هذا هو الذي نزل إلى الجحيم وأبطل عز الموت وسبى سبيًا وأعطي الناس كرامات رفع قديسيه إلى العلا معه وأعطاهم قربانًا لأبيه بذوقه الموت عنا خلص الأحياء وأعطي النياح للذين ماتوا ونحن أيضًا الجلوس في الظلمة زمانًا أنعم علينا بنور قيامته من قبل تجسده الطاهر فليضئ علينا نور معرفتك الحقيقية لنضيء بشكلك المحيي ونجسر بدالة بغير خوف أن نصرخ نحو أبيك الذي في السموات ونقول يا أبانا الذي في السموات.. إلخ.\nأيها المسيح إلهنا رئيس كهنة الخيرات العتيدة ملك الدهور, الغير المائت الأبدي, كلمة الله الذي على الكل. الذي أنعم علينا بهذا السر العظيم الذي هو جسده المقدس ودمه الكريم لغفران خطايانا. هذا هو الجسد الذي أخذه من سيدتنا وملكتنا كلنا القديسة مريم وجعلته واحدا مع لاهوته. هذا هو الذي نزل إلى الجحيم وأبطل عز الموت, وسبى سبيا وأعطى الناس كرامات. رفع قديسيه إلى العلى معه, أعطاهم قربانا لأبية, بذوقه الموت عنا خلص الأحياء وأعطى النياح للذين ماتوا. ونحن أيضا الجلوس في الظلمة زمانا, أنعم علينا بنور قيامته من قبل تجسده الطاهر. فليضيء علينا نور معرفتك الحقيقية لنضيء بشكلك المحيي. ونجسر بدالة بغير خوف أن نصرخ نحو أبيك الذي في السموات ونقول: أبانا الذي في السموات...\nصلاة القسمة\nالخولاجي\nقسمة في عيد القيامة والخماسين\nقسمه للابن في ليلة أبو غالامسيس\n"},{"n":"12- قسمة للآب تُقال في عيد القيامه والخمسين","t":"أيها السيد الرب الإله ضابط الكل، أبو ربنا وإلهنا ومخلصنا يسوع المسيح.\n** O Master, Lord, God the Pantocrator, the Father of our Lord, God and Savior, Jesus Christ,\n** `Vnyb `P[oic `Vnou] Pipantokratwr@ `Viwt `mPen[oic ouoh Pennou] ouoh Pencwtyr Iycouc Pi`,rictoc.\nالذي من قبل صليبه نزل إلى الجحيم، ورد أبانا آدم وبنيه إلى الفردوس.\n** who through His Cross descended to Hades and restored our father Adam and his children to Paradise.\n** Vy`ete `ebol hiten Pef`ctauroc af`i `epecyt `e`Amen]@ aftac;o `mpeniwt `Adam nem nefsyri `eqoun `ePiparadicoc.\nودفننا معه، بموته أبطل عز الموت، وفي ثالث يوم قام من بين الأموات.\n** He buried us with Himself, and through His death He abolished the power of death, and on the third day He rose from the dead.\n** Af;omcen nemaf@ qen pefmou afkwrf `mpi`amahi `m`vmou@ ouoh qen pimahsomt `n`ehoou aftwnf `ebol qen nye;mwout.\nوظهر لمريم المجدلية وكلمها هكذا قائلا: اٍعلمي إخوتي أن يذهبوا إلى الجليل هناك يرونني.\n** He appeared to Mary Magdalene and spoke with her in this manner, saying, “Tell My brethren to go to Galilee, and there they will see Me.”\n** Afouonhf `eMaria }magdaliny@ afcaji nemac `mpairy] efjw `mmoc@ je matame na`cnyou hina `ntousenwou `e}galile`a@ cenanau `eroi `mmau.\nرئيس الملائكة نزل من السماء، ودحرج الحجر عن فم القبر وبشر النسوة حاملات الطيب قائلا:\n** The archangel descended from Heaven and rolled back the stone from the door of the tomb, and proclaimed the good news to the women carrying the spices, saying,\n** Piar,yaggeloc af`i `epecyt `ebol qen `tve@ af`ckerker `mpi`wni `ebol hi rwf `mpi`mhau afhisennoufi `nnihiomi `mfaicojen efjw `mmoc.\nالمسيح قام من بين الأموات. بالموت داس الموت، والذين في القبور أنعم عليهم بالحياة الأبدية.\n** “Christ is risen from the dead”, trampling down death by death, and upon those in the tombs bestowing life.”\n** Je `<rictoc `anecty ek nekrwn@ ;anatw ;anaton patycac@ ke tic en tic `mnymaci zwyn ,aricamenoc.\nونفخ في وجه تلاميذه القديسين، ورسله الأطهار قائلا:\n** He breathed into the face of His Holy disciples and Saintly apostles, saying,\n** Afnifi `eqoun qen `pho `nnef`agioc `mma;ytyc ouoh `n`apoctoloc e;ouab efjw `mmoc.\nاقبلوا الروح القدس، من غفرتم لهم خطاياهم غفرت، ومن أمسكتموها عليهم أمسكت.\n** “Receive the Holy Spirit. If you forgive the sins of any, they are forgiven; if you retain the sins of any, they are retained.”\n** Je [i nwten `nOu`pneuma Efouab@ ny`etetenna,a nounobi nwou `ebol ce,y nwou `ebol@ ouoh ny`etetenna`amoni `mmwou cena`amoni `mmwou.\nمن عيد الصعود إلى العنصرة يضيف الكاهن الآتي:\n** From Ascension to Pentecost, the Priest adds the following:\nوبعد أربعين يوماً صعد إٍلى السموات، وجلس عن يمين أبيه الصالح، وأرسل لنا المعزى روح الحق مثل ألسنة نار.\n** And after forty days, He ascended in to the Heavens and sat at the right hand of His Good Father, and sent us the Paraclete, the Spirit of Truth, in the likeness of tongues of fire.\n** Ouoh menenca =m (`hme) `n`ehoou afsenaf `e`pswi `enivyou`i@ afhemci caou`inam `mPefiwt `n`aga;oc@ afouwrp nan `mPiparaklyton Pi`pneuma `nte ]me;myi `m`vry] `nhanlac `n`,rwm.\nثم يكمل الكاهن :\n** The Priest then continues:\nمن أجل هذا نسألك يا سيدنا طهرنا من كل رياء، لكي بقلب طاهر نجرأ بدالة بغير خوف، أن نطلب إليك يا اللّه الآب الذي في السموات، ونقول:\n** Therefore, we ask You, O our Master, purify us from all hypocrisy, that with a pure heart we may dare with boldness, without fear, to entreat You, O God, the Father who is in the heavens, and say,\n** E;be vai ten]ho `erok Pennyb@ matoubon `ebol ha sobi niben@ je hina qen ouhyt efouab@ `ntenertolman qen ouparrycia `naterho]@ `etwbh `mmok `Vnou] `Viwt et qen nivyou`i ouoh `ejoc@ je Peniwt....\nأيها السيد الرب الإله ضابط الكل أبو ربنا وإلهنا ومخلصنا يسوع المسيح الذي من قبل صليبه نزل إلى الجحيم ورد أبانا آدم وبنيه إلى الفردوس ودفننا معه بموته أبطل عز الموت وفي ثالث يوم قام من الأموات وظهر لمريم المجدلية وكلمها هكذا قائلًا أعلمي إخوتي أن يذهبوا إلى الجليل هناك يرونني ميخائيل رئيس الملائكة نزل من السماء ودحرج الحجر عن باب القبر وبشر النسوة حاملات الطيب قائلًا: إخرستوس آنستي إكنيكرون \"المسيح قام من الأموات بالموت داس الموت والذين في القبور أنعم عليهم بالحياة الأبدية ونفخ في وجه تلاميذه القديسين ورسله الأطهار قائلًا: اقبلوا الروح القدس من غفرتم لهم خطاياهم غفرت، ومن أمسكتموها عليهم أمسكت.\n(يقال الجزء الآتي من عيد الصعود إلى العنصرة):\nوبعد أربعين يومًا صعد إلى السموات وجلس على يمينه أبيه الصالح وأرسل لنا المعزي روح الحق مثل ألسنة نار\n(ثم يكمل):\nمن أجل هذا نسألك يا سيدنا طهرنا من كل رياء لكي بقلب طاهر نجسر بدالة بغير خوف أن نطلب إليك يا الله الآب الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\n** أيها السيد الرب الإله ضابط الكل أبو ربنا وإلهنا ومخلصنا يسوع المسيح. الذي من قبل صليبه نزل إلى الجحيم ورد أبانا آدم وبنية إلى الفردوس. ودفننا معه, وبموته أبطل عز الموت, وفي ثالث يوم قام من الأموات. وظهر لمريم المجدلية وكلمها هكذا قائلا: اعلمي أخوتي أن يذهبوا إلى الجليل هناك يرونني. رئيس الملائكة نزل من السماء ودحرج الحجر عن فم القبر وبشر النسوة حاملات الطيب قائلا: المسيح قام من الأموات, بالموت داس الموت, والذين في القبور أنعم عليهم بالحياة الأبدية. ونفخ في وجه تلاميذه القديسين ورسله الأطهار قائلا: اقبلوا الروح القدس, من غفرتم لهم خطاياهم غفرت لهم ومن أمسكتموها عليهم أمسكت.\n** هذا الربع يقال هنا من عيد الصعود إلى عيد العنصرة:\n** و بعد أربعين يوما صعد إلى السموات وجلس عن يمين أبيه الصالح وأرسل لنا المعزى روح الحق مثل ألسنة نار (انتهى الربع).\nمن أجل هذا نسألك يا سيدنا طهرنا من كل رياء لكي بقلب طاهر نجسر بدالة بغير خوف أن نطلب إليك يا الله الآب الذي في السموات ونقول: أبانا الذي في السموات..........\nصلاة القسمة\nالخولاجي\nقسمة للابن في صوم الرسل\nقسمه للابن في عيد القيامه\n"},{"n":"13- قسمة للأبن تقال في صوم الرسل","t":"أنت هو كلمة الآب،الإله الذي قبل الدهور، رئيس الكهنة الأعظم.\n** You are the Logos of the Father, God who are before the ages, the great High Priest,\n** `N;ok gar pe Pilogoc `nte `Viwt@ `Vnou] et qajwou `nni`eneh@ pinis] `nar,y`ereuc.\nالذي تجسد وتأنس من أجل خلاص جنس البشر.\n** who were incarnate and became man for the salvation of mankind.\n** Ouoh af;whem naf `ebol qen nie;noc tyrou@ `nougenoc efcwtp@ oumetouro oumetouyb@ ou`slol efouab@ oulaoc eu`;maiof.\nودعا له من جميع الأمم جنساً مختاراً، مملكة وكهنوتاً وأمة مقدسة وشعباً مبرراً.\n** Out of all the nations, He called to Himself a chosen generation, a kingdom, a priesthood, a holy nation, and a justified people.\n** Vy`etaf[icarx ouoh aferrwmi@ e;be `poujai `m`pgenoc `nnirwmi.\nإذ أرسلت الروح القدس على الرسل يوم البنطيقسطي.\n** You have sent the Holy Spirit upon the apostles on the day of Pentecost.\n** `Eakouwrp `mPi`pneuma E;ouab `ejen ni`apoctoloc@ qen pi`ehoou `nte }pentykocty.\nوحل عليهم مثل ألسنة نار منقسمة على كل واحد منهم.\n** He came upon each one of them like divided tongues of fire\n** Ouoh af`i `e`hryi `ejwou `m`vry] `nhanlac `n`,rwm@ euvys `ejen `vouai `vouai `mmwou.\nوملأهم من كل معرفة وكل فهم وكل حكمة روحية كوعدك الصادق.\n** and filled them with all knowledge, all understanding, and all spiritual wisdom, according to Your faithful promise.\n** Ouoh afmahou `ebol qen `emi niben nem ka] niben nem covia niben `m`pneumatiky@ kata pekws `etenhot.\nوتكلموا بكل اللغات، وبشروا باسمك القدوس في جميع الأمم.\n** And they spoke in every language and they preached Your holy name to all the nations.\n** Ouoh aucaji qen acpi niben@ ouoh auhiwis `mpekran e;ouab `n`hryi qen nie;noc tyrou.\nأما بطرس وبولس الرسولان، فكان ظل أحدهما يشفى الأمراض، وكانت مناديل وعصائب الآخر تذهب الأمراض، وتخرج الأرواح الشريرة.\n** As for Peter and Paul, foremost among the apostles, the shadow of the one was healing the sick, whereas the handkerchiefs and aprons of the other were causing diseases to leave and evil spirits to come out.\n** Petroc de nem Pauloc `panjwj `cnau (=b) `nni`apoctoloc@ ne sare `tqyibi `mpiouai `mmwou tal[o `nniswni@ ouoh nicoudarion nem nicimikun;inon `mpikeouai ne sau`;re niswni senwou@ ouoh `nte ni`pneuma ethwou `i `ebol.\nوبعدما كرزا باٍنجيل الملكوت وعلما الأمم، سفكا دمهما من أجل اسمك، ونالا إكليل الرسولية وإكليل الشهادة.\n** And after they preached the Gospel of the kingdom and taught the nations, they shed their blood for Your name’s sake and received the crown of apostleship and of martyrdom.\n** Ouoh menenca `;rouhiwis `mpieuaggelion `nte ]metouro@ ouoh `ntou]`cbw `nnie;noc@ auvwn `mpou`cnof e;be pekran@ ouoh au[i `mpi`,lom `nte ]met`apoctoloc nem va ]metmarturoc.\nفيا مَن أنعم على تلاميذه القديسين ورسله المكرمين بحلول الروح المعزى عليهم، وأعطاهم السلطان أن يصنعوا الأشفية والآيات والعجائب.\n** O You who have granted His holy Disciples and honored Apostles the descent of the Spirit, the Paraclete, upon them and gave them authority to work healings, signs, and wonders—\n** `W vy`etafer`hmot `nnef`agioc `mma;ytyc ouoh `n`apoctoloc ettaiyout@ `m`pjin`i `e`qryi `ejwou `nte Pi`pneuma `mparaklyton@ ouoh af] `mpiersisi nwou `e`iri `nnital[o nem nimyini nem ni`svyri.\nوبشرونا باسمه القدوس، وردونا إلى الإيمان الحقيقي بالثالوث القدوس.\n** they proclaimed to us the good news of His holy name and restored us to the true faith of the Holy Trinity.\n** Auhisennoufi nan `mpefran e;ouab@ ouoh autac;on `epinah] `mmyi `nte }`triac e;ouab.\nنسبحك ونباركك ونمجدك ونشكرك لأجل هذه النعم العظيمة.\n** We praise You, we bless You, we glorify You, and we give thanks to You on account of these great gifts.\n** Tenhwc `erok ten`cmou `erok ten]`wou nak tenouwnh nak `ebol@ e;be nainis] `n`hmot.\nونسألك يا سيدنا أن تنعم علينا بغفران خطايانا.\n** And we ask You, O our Master, to also grant us the forgiveness of our sins,\n** Ouoh ten]ho `erok Pennyb@ e;reker,arizec;e nan on `m`p,w `ebol `nte nennobi.\nوتطهر قلوبنا ونفوسنا وأجسادنا وأرواحنا.\n** and to purify our hearts, our souls, our bodies, and our spirits,\n** Ouoh `ntektoubo `nnenhyt nem nen'u,y nem nencwma nem nen`pneuma.\nلكي بقلب طاهر نجرأ بدالة بغير خوف، أن نصرخ نحو أبيك القدوس الذي في السموات، ونقول \"أبانا الذي...\"\n** so that with a pure heart, we may dare with boldness, without fear, to cry to Your holy Father who is in the heavens, and say, “Our Father....”\n** Je hina qen ouhyt efouab@ `ntenertolman qen ouparrycia `naterho]@ `ews oube Pekiwt e;ouab etqen nivyou`i ouoh `ejoc@ je Peniwt....\nأنت هو كلمة الرب الإله الذي قبل الدهور رئيس الكهنة الأعظم الذي تجسد وتأنس من أجل خلاص جنس البشر ودعا له من جميع الأمم جنسًا مختارًا مملكة وكهنوتًا وأمَّة مقدسة وشعبًا مبررًا إذ أرسلت الروح القدس على الرسل في يوم الخمسين وحل عليهم مثل ألسنة نار منقسمة على كل واحد منهم وملأهم من كل معرفة وكل فهم وكل حكمة روحية كوعدك الصادق وتكلموا بكل اللغات وبشروا باسمك القدوس في جميع الأمم أما بطرس وبولس الرسولان فكان ظل أحدهما يشفي الأمراض وكانت مناديل وعصائب الآخر تذهب الأمراض وتخرج الأرواح الشريرة، وبعدما كرزا بإنجيل الملكوت وعلما الأمم سفكا دمهما من أجل اسمك ونالا إكليل الرسولية وإكليل الشهادة فيا من أنعم على تلاميذه القديسين ورسله المكرمين بحلول الروح المعزي عليهم وأعطاهم السلطان أن يصنعوا الأشفية والآيات والعجائب وبشرونا باسمه القدوس وردونا الإيمان الحقيقي بالثالوث المقدس نسبحك ونباركك ونمجدك ونشكرك لأجل هذه النعم العظيمة نسألك يا سيدنا أن تنعمن علينا بغفران خطايانا وتطهر قلوبنا وأنفسنا وأجسادنا وأرواحنا لكي بقلب طاهر نجسر بدالة بغير خوف أن نصرخ نحو أبيك القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nأنت هو كلمة الآب الإله الذي قبل الدهور, رئيس الكهنة الأعظم. الذي تجسد وتأنس من أجل خلاص جنس البشر. ودعا له من جميع الأمم جنسا مختارا, مملكة وكهنوتا وأمة مقدسة وشعبا مبررا. إذ أرسلت الروح القدس على الرسل في يوم البنطقسيطي. وحل عليهم مثل ألسنة نار منقسمة على كل واحد منهم. وملأهم من كل معرفه وكل فهم وكل حكمة روحية كوعدك الصادق. وتكلموا بكل اللغات وبشروا باسمك القدوس في جميع الأمم. أما بطرس وبولس الرسولان فكان ظل أحدهما يشفى الأمراض, وكانت مناديل وعصائب الآخر تذهب الأمراض وتخرج الأرواح الشريرة. وبعد ما كرزا بانجيل الملكوت وعلما الأمم, سفكا دمهما من أجل اسمك, ونالا إكليل الرسولية وإكليل الشهادة. فيا من أنعم على تلاميذ القديسين ورسله المكرمين بحلول الروح المعزى عليهم وأعطاهم السلطان أن يصنعوا الأشفية والآيات والعجائب. وبشرونا باسمة القدوس وردونا إلى الإيمان الحقيقي بالثالوث القدوس. نسبحك ونباركك ونمجدك ونشكرك لأجل هذه النعم العظيمة. ونسألك يا سيدنا أن تنعم علينا أيضا بغفران خطايانا. وتطهر قلوبنا وأنفسنا وأجسادنا وأرواحنا. لكي بقلب طاهر نجسر بدالة بغير خوف أن نصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات.......\nصلاة القسمة\nالخولاجي\nقسمة للابن في الاعياد السيديه\nقسمة في عيد القيامة والخماسين\n"},{"n":"14- قسمة للابن تقال في الأعياد السيدية وسنوي وعيد التجلي وال29 من كل شهر قبطي","t":"نسبح ونمجد إله الآلهة ورب الأرباب، الذي تجسد من القديسة مريم العذراء، ولدته في بيت لحم.\n** We praise and glorify the God of gods and the Lord of lords, who was incarnate of Saint Mary who gave birth to Him in Bethlehem.\n** Tenhwc ten]`wou `m`Vnou] `nte ninou] ouoh `P[oic `nte ni[oic@ vy`etaf[icarx `ebol qen ;ye;ouab Mariam@ ouoh acmici `mmof qen By;leem.\nوإذا ملاك الرب قد ظهر للرعاة، وبشرهم بميلاده العجيب فأتوا ونظروه.\n** And lo, the angel of the Lord appeared to the shepherds and proclaimed the good news of His wonderful Nativity to them, and they came and beheld Him;\n** Ouoh ic `paggeloc `nte `P[oic afouonhf `eniman`ecwou@ afhisennoufi nwou `mpefjinmici etoi `n`svyri@ ouoh au`i aunau `erof.\nالذي رأى المجوس نجمه، فأتوا وسجدوا له وقدموا له هدايا.\n** whose star the Magi saw. They came and worshiped Him, and presented gifts to Him;\n** Vy`etaunau `nje nimagoc `epefciou@ ouoh au`i auouwst `mmof@ au`ini naf `nhandwron.\nالذي أتى إلى أرض مصر، ثم عاد وسكن في ناصرة الجليل.\n** who came to the land of Egypt, and then returned and dwelt in Nazareth of Galilee;\n** Vy`etaf`i `e`pkahi `n<ymi@ ouoh aftac;of afswpi qen Nazare; `nte }galile`a.\nالذي نما قليلاً قليلاً بشبه البشر، بغير خطية وحده.\n** who grew little by little, according to the form of men, yet He alone was without sin;\n** Vy`etafaiai `noukouji kouji kata `p`cmot `nnirwmi@ at[ne nobi `mmauatf.\nالذي أتى إلى الأردن، واعتمد من يوحنا السابق.\n** who came to the Jordan and was baptized by John the Forerunner;\n** Vy`etaf`i `ePiiordanyc@ af[iwmc `ntotf `nIwannyc pi`prodromoc.\nالذي صام عنا أربعين يوماً وأربعين ليلة، بسر لا يُنطق به.\n** who fasted on our behalf forty days and forty nights in a mystery ineffable;\n** Vy`etafernycteuin `e`hryi `ejwn `n`hme `n`ehoou nem `hme `n`ejwrh@ qen oumuctyrion `nat`scaji `mmof.\nالذي صيَّر الماء خمراً بقوة لاهوته في عرس قانا الجليل.\n** who made the water wine by the power of His divinity at the wedding of Cana of Galilee;\n** Vy`etaf`;re pimwou eryrp hiten `tjom `nte tefme;nou]@ qen `phop `n}kana `nte }galile`a.\nالذي أعطى النظر للعميان. وجعل العرج يمشون، والشُّل يصِّحون، والبُرص يطهرون، والصم يسمعون، والخرس يتكلمون، والشياطين يخرجون.\n** who gave sight to the blind, made the lame to walk, the maimed whole, the lepers pure, the deaf to hear, the mute to speak, and the demons to depart;\n** Vy`etaf] `m`vnau `mbol `nnibelleu@ ouoh af`;re ni[aleu mosi@ nija[eu `ntououjai@ nikakceht `ntoutoubo@ nikour `ntoucwtem@ ni`ebwou `ntoucaji@ nidemwn `ntou`i `ebol.\nالذي أقام إبن الأرملة بنايين، وابنة يايروس.\n** who raised the son of the widow of Nain and the daughter of Jairus;\n** Vy`etaftounoc `psyri `nte ],yra et qen Nain@ nem `tseri `nIairoc.\nالذي تجلى على جبل طابور قدام تلاميذه القديسين، وأضاء وجهه كالشمس.\n** who was transfigured on Mount Tabor before His holy disciples, and His face shone like the sun;\n** Vy`etafsobtf `ejen pitwou `n;abwr `mpe`m;o `nnef`agioc `mma;ytyc@ ouoh `a pefho erouwini `m`vry] `m`vry.\nالذي أقام لعازر من القبر بعد أربعة أيام.\n** who raised Lazarus from the tomb after four days;\n** Vy`etaftounoc Lazaroc `ebol qen pi`mhau menenca `ftou (=d) `n`ehoou.\nالذي دخل أورشليم راكباً على أتان وجحش إبن أتان مثل ملك.\n** who entered into Jerusalem, riding on a colt and the foal of a colt, as a King;\n** Vy`etafse `eqoun `eIeroucalym eftalyout `eou`e`w nem oucyj `psyri `nou`e`w `m`vry] `nOuouro.\nالذي عاهد تلاميذه القديسين، وأعطاهم جسده المقدس ودمه الكريم، لغفران خطايانا.\n** who established a covenant with His holy disciples and gave them His holy Body and His precious Blood for the forgiveness of our sins;\n** Vy`etafcemni `noudia;ykynem nef`agioc `mma;ytyc ouoh aftyitou `mPefcwma e;ouab nem Pef`cnof ettaiyout@ `e`p,w `ebol `nte nennobi.\nالذي صلب على الصليب، وسحق الشيطان، ووضع في القبر، وبعد ثلاثة أيام قام من الأموات.\n** who was crucified on the Cross and trampled down Satan, and was placed in the tomb, and after three days He rose from the dead;\n** Vy`etauasf `ePi`ctauroc@ afqomqem `m`Pcatanac@ ouoh au,af qen pi`mhau@ menenca somt (=g) `n`ehoou aftwnf `ebol qen nye;mwout.\nالذي رآه تلاميذه المختارون على بحر طبرية بعد قيامته المقدسة.\n** whom His chosen disciples saw on the Sea of Tiberias after His holy Resurrection,\n** Vy`etaunau `erof `nje nefcwtp `mma;ytyc@ hijen `viom `nte }beriadoc@ menenca Tef`anactacic e;ouab.\nوبعد أربعين يوماً صعد إلى السموات، وجلس عن يمين أبيه الصالح، وأرسل لنا البارقليط المعزي مثل ألسنة نار.\n** and after forty days He ascended into the heavens, and sat at the right hand of His good Father, and sent us the Paraclete in the likeness of tongues of fire;\n** Ouoh menenca `hme (=m) `n`ehoou afsenaf `e`pswi `enivyou`i@ afhemci caou`inam `mPefiwt `n`aga;oc@ afouwrp nan `mPiparaklyton `m`vry] `nhanlac `n`,rwm.\nالذي علَّم خواصه التلاميذ ورسله القديسين قائلا لهم : \"متى صليتم فاطلبوا هكذا وقولوا: أبانا الذي في السموات...\"\n** who taught His chosen disciples and holy apostles, saying, “Whenever you pray, entreat in this manner and say, ‘Our Father....’”\n** Vy`etaf]`cbw `nnefcwtp `mma;ytyc ouoh `n`apoctoloc e;ouab efjw `mmoc@ je `eswp `aretensaner`proceu,ec;e twbh `mpairy] ouoh `ajoc@ je Peniwt...\nنسبح ونمجد إله الآلهة ورب الأرباب، الذي تجسد من القديسة مريم، ولدته في بيت لحم، وإذا ملاك الرب فأتوا قد ظهر للرعاة وبشرهم بميلاده العجيب الذي أتي إلى أرض مصر ثم عاد وسكن في ناصرة الجليل الذي نما قليلًا قليلًا بشبه البشر بغير خطية وحده الذي أتي إلى الأردن واعتمد من يوحنا السابق الذي صام عنا أربعين يوما وأربعين ليلة بسر لا ينطق به الذي صير الماء خمرًا بقوة لاهوته في عرس قانا الجليل الذي أعطي النظر للعميان وجعل العرج يمشون والشل يصحون والبرصى يطهرون والصم يسمعون والخرس يتكلمون والشياطين يخرجون الذي أقام إبن الأرملة بنايين وابنة يايروس الذي تجلي على جبل طابور قدام تلاميذه القديسين وأضاء وجهه كالشمس الذي أقام لعازر من القبر بعد أربعة أيام الذي دخل أورشليم راكبًا على جحش إبن أتان مثل ملك الذي عاهد تلاميذه القديسين وأعطاهم جسده المقدس ودمه الكريم لغفران خطايانا الذي صلب على الصليب وسحق الشيطان ووضع في القبر وبعد ثلاثة أيام قام من الأموات الذي رآه تلاميذه المختارون على بحيرة طبرية بعد قيامته المقدسة وبعد أربعين يومًا صعد إلى السموات وجلس عن يمينه أبيه الصالح وأرسل لنا الروح المعزي مثل ألسنة نار الذي علم تلاميذه المختارين والرسل القديسين قائلًا لهم: متي صليتم فأطلبوا هكذا وقولوا يا أبانا الذي في السموات.. إلخ.\nنسبح ونمجد إله الآلهة ورب الأرباب, الذي تجسد من القديسة مريم وولدته في بيت لحم. وإذا ملاك الرب قد ظهر للرعاة وبشرهم بميلاده العجيب فأتوا ونظروه. الذي رأى المجوس نجمة فأتوا وسجدوا له وقدموا له هدايا. الذي أتى إلى أرض مصر ثم عاد وسكن في ناصرة الجليل. الذي نما قليلا قليلا بشبة البشر بغير خطية وحدة. الذي أتى إلى الأردن واعتمد من يوحنا السابق. الذي صام عنا أربعين يوما وأربعين ليلة بسر لا ينطق به. الذي صير الماء خمرا بقوة لاهوته في عرس قانا الجليل. الذي أعطى النظر للعميان, وجعل العرج يمشون والشل يصحون والبرص يطهرون والصم يسمعون والخرس يتكلمون والشياطين يخرجون. الذي أقام ابن الأرملة بنايين , وابنة يايرس. الذي تجلى على جبل تابور قدام تلاميذه القديسين وأضاء وجهه كالشمس. الذي أقام لعازر من القبر بعد أربعة أيام. الذي دخل إلى أورشليم راكبا على أتان وجحش ابن أتان مثل ملك. الذي عاهد تلاميذه القديسين وأعطاهم جسده المقدس ودمه الكريم لغفران خطايانا. الذي صلب على الصليب وسحق الشيطان, ووضع في القبر وبعد ثلاثة أيام قام من الأموات. الذي رآه تلاميذه المختارون على بحر طبرية بعد قيامته المقدسة. وبعد أربعين يوما صعد إلى السموات وجلس عن يمين أبيه الصالح وأرسل لنا الباراقليط مثل ألسنة نار. الذي علم صفوته التلاميذ والرسل والقديسين قائلا: إذا صليتم فاطلبوا هكذا وقولوا: أبانا الذي في السموات........\nقسمة للآب سنوي\nصلاة القسمة\nالخولاجي\nقسمة للإبن في صوم الرسل\n"},{"n":"15- قسمة للأب سنوي","t":"اللهم والد النور، ورئيس الحياة، واهب المعرفة، صانع النعمة، المحسن لنفوسنا، كنز الحكمة، معلم الطهارة، مؤسس الدهور، قابل الصلوات النقية، معطي المتوكلين عليه من كل قلوبهم الأشياء التي تشتهي الملائكة أن تراها، الذي أصعدنا من العمق إلى النور الذي أعطانا الحياة من الموت الذي أنعم علينا بالعتق من العبودية الذي جعل ظلمة الضلال التي فينا تضيء من قبل إتيان ابنك الوحيد بالجسد، أنت الآن أيضًا يا سيدنا أنر عيون قلوبنا وطهرنا كاملين في النفس والجسد والروح لكي بقلب طاهر وشفتين نفيتين نجسر بدالة أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nاللهم والد النور ورئيس الحياة , واهب المعرفة. صانع النعمة, المحسن لنفونا, كنز الحكمة. معلم الطهارة, مؤسس الدهور, قابل الصلوات النقية. معطى المتوكلين علية من كل قلوبهم الأشياء التي تشتهى الملائكة أن تراها. الذي أصعدنا من العمق إلى النور, الذي أعطانا الحياة من الموت. الذي أنعم علينا بالعتق من العبودية. الذي جعل ظلمة الضلال التي فينا تضيء من قبل إتيان ابنك الوحيد بالجسد. أنت الآن أيضا يا سيدنا أنر عيون قلوبنا, وطهرنا كاملين في النفس والجسد والروح. لكي بقلب طاهر وشفتين نقيتين ونجسر أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات........\nقسمة للابن سنوي\nصلاة القسمة\nالخولاجي\nقسمة للابن في الاعياد السيديه\n"},{"n":"16- قسمه تقال للابن سنوي","t":"أنت هو كلمة الآب الإله الذي قبل الدهور رئيس الكهنة الأعظم الذي تجسد وتأنس من أجل خلاص جنس البشر ودعا له من جميع الأمم جنسا مختارًا مملكة وكهنوتًا وأمة مقدسة وشعبًا مبررًا فلهذا نسأل ونطلب من صلاحك يا محب البشر أن لا تكون هذه الذبيحة تبكيتا لخطايانا وعارًا لآثامنا لأننا قدمناها لك عن ضعفنا بل كما أن هذه القرابين طاهرة في كل شيء إذ قد تفضلت وأفعمتها من كل شيء طاهر بحلول روحك القدوس عليها وهكذا نحن أيضًا الخطاة تفضل قدس أنفسنا وأجسادنا وأرواحنا ونياتنا لكي بنفس مستنيرة ووجه غير مخزي بقلب طاهر وإيمان بلا رياء بمحبة كاملة ورجاء ثابت نجرؤ بدالة بغير خوف أن نقول الصلاة المقدسة التي أعطيتها لتلاميذك القديسين والرسل الأطهار قائلًا متى صليتم فقولوا هكذا أبانا الذي في السموات.. إلخ.\nأنت هو كلمة الآب الإله الذي قبل الدهور , رئيس الكهنة الأعظم. الذي تجسد وتأنس من أجل خلاص جنس البشر. ودعا له من جميع الأمم جنسا مختارًا, مملكة وكهنوتا وأمة مقدسة وشعبا مبررا. فلهذا نسأل ونطلب من صلاحك يا محب البشر. أن لا تكون هذه الذبيحة تبكيتا لخطايانا وعارا لآثامنا لأننا قدمناها لك عن ضعفنا. بل كما أن هذه القرابين طاهرة في كل شيء. إذ قد تفضلت وأفعمتها من كل شيء طاهر, بحلول روحك القدوس عليها. هكذا نحن أيضا الخطاة تفضل قدس أنفسنا وأجسادنا وأرواحنا وسرائرنا. لكي بنفس مستنيرة ووجه غير مخزي, بقلب طاهر وإيمان بغير مراياه, بمحبة كاملة ورجاء ثابت. نجرؤ بداله بغير خوف أن نقول الصلاة المقدسة التي أعطيتها لتلاميذك القديسين والرسل الأطهار قائلا: إذا صليتم فاطلبوا هكذا وقولوا: أبانا الذي في السموات........\nقسمة للآب سنوى\nصلاة القسمة\nالخولاجي\n"},{"n":"17- قسمه للآب سنوي","t":"أيها الرب إلهنا العظيم والذي أسمه عظيم، أبو الرأفات وإله كل عزاء الذي قبل إليه من أيدينا نحن الضعفاء الخطاة هذه الذبيحة العقلية والحقيقية غير الدموية أنت أيضًا يا سيدنا الصالح محب البشر طهرنا من كل دنس الجسد والروح اجعلنا مستحقين أن ننال من خيراتك غير الموصوفة خلاصًا لأنفسنا وأجسادنا وأرواحنا وجوابًا أمام منبرك المخوف ولنستحق أن نجسر بدالة ان نصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.. إلخ.\nأيها الرب إلهنا العظيم والذي اسمه عظيم أبو الرأفات وإله كل عزاء. الذي قبل إليه من أيدينا نحن الضعفاء الخطاة هذه الذبيحة العقلية والحقيقية غير الدموية. أنت أيضًا يا سيدنا الصالح ومحب البشر طهرنا من كل دنس الجسد والروح. واجعلنا مستحقين أن ننال من خيراتك غير الموصوفة. خلاصنا لأنفسنا وأجسادنا وأرواحنا , وجوابا أمام منبرك المخوف. ولنستحق أن نجسر بدالة أن نصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.....\nالقسمه السريانيه\nصلاة القسمة\nالخولاجي\nقسمة للابن سنوي\n"},{"n":"18- القسمة السريانية","t":"هكذا بالحقيقة تألم كلمة الله بالجسد وذبح وانحني بالصليب وانفصلت نفسه من جسده إذ لاهوته لم ينفصل قط لا من نفسه ولا من جسده وطعن في جنبه بالحربة وجري منه دم وماء غفرانا لكل العالم وتخضبت بهما جسده وأتت نفسه واتحدت بجسده وعوض الخطبة المحيطة بالعالم مات الابن بالصليب وردنا من التدبير الشمالي إلى اليميني وأمننا بدم صليبه ووحد وألف السمائيين مع الأرضيين والشعب مع الشعوب والنفس مع الجسد وفي اليوم الثالث قام من القبر.\nواحد هو عمانوئيل وغير مفترق من بعد الإتحاد، وغير منقسم إلى طبيعتين هكذا نؤمن وهكذا نعترف وهكذا نصدق أن هذا الجسد لهذا الدم وهذا الدم لهذا الجسد([1]).\nأنت هو المسيح إلهنا الذي طعن في جنبه بالحربة فوق الجلجثة بأورشليم لأجلنا أنت هو حمل الله حامل خطية العالم اغفر ذنوبنا وأترك خطايانا وأقمنا عن جانبك اليمين.\nيا الله أبا ربنا وإلهنا يسوع المسيح الذي من الكاروبيم يتبارك ومن السيرافيم يتقدس ومن ألوف ألوف وربوات ربوات الخدام الناطقين يتعظم الذي يقدس ويكمل القرابين وتكميل الأثمار التي قدمت لك رائحة لذيذة قدس أيضًا أجسادنا وأنفسنا وأرواحنا كلنا لكي بقلب طاهر ووجه غير مخزي ندعوك يا الله الأب السماوي ونصلي قائلين أبانا الذي في السموات.. إلخ.\n"},{"n":"19- قسمة للابن سنوي","t":"أيها الكائن الذي كان، الذاتي، الأزلي قبل الأكوان، الجليس مع الآب، الوحيد معه في الربوبية، عُنصر المراحم، الذي شاء بإرادته أن يتألم عِوَض الخطاة الذين أولهم أنا.\n** O You, THE BEING, who were, the Eternal, who exists before all ages, the co-enthroned with the Father, the only One with Him in lordship, the Originator of mercies, who desired by His will to suffer for the sake of the sinners of whom I am chief.\nلأنك لما أردت أن تخلصني، لم ترسل لي ملاكاً ولا رئيس ملائكة ولا كاروبيم ولا نبياً، بل أنت وحدك نزلت من حضن أبيك إلى بطن البتول، وصرت كحقير، ومشيت على الأرض كإنسان، وهذا هو العجب في اتضاعك.\n** For when You willed to save me, You did not send an angel, nor an archangel, neither a cherub, nor a prophet. But You alone, descended from Your Father's bosom to the womb of the Virgin and became as the despised, and walked upon the earth as a man; and this is the wonder of Your humility.\nالمزود حملك كمسكينٍ والخِرَق لفَّتك، الأذرع حملتك، ورُكَب البتول عظَّمتك، الفم قبَّلك، اللبن غذَّاك، أنت الذي تقوت كافة الخليقة من نعمتك.\n** The manger carried You like a poor person, and the swaddling clothes wrapped You; the arms carried You, and the knees of the Virgin exalted You; the mouth kissed You, and the milk nourished You, O You who nourish the whole creation with Your grace.\nمن أجلي يا سيدي قبلت العار والتجديف، وقبلت الهوان والسبَّ والتهديد واللطم. ظَلَمك الشعب العنيد، ولم يعرفوا أن أنت مخلص العالم. أخرجوا القضية أنك مستحق الموت وصرخوا في وجهك أن تُصلب عن شعبك، الشعب القاسي حمَّلك خشبة الصليب، من أجلي أنا الحامل قضية الموت بإرادتي.\n** For my sake, O my Master, You accepted disgrace and blasphemy; and accepted shame, insults, intimidation and smiting. The stubborn people oppressed You, and they did not know that You are the Savior of the world. They passed judgment that You deserved death, and shouted in Your face to be crucified for Your people. The cruel people burdened You with the wood of the Cross, for my sake; I who am carrying the judgment of death with my own will.\nضربك الآثمة على رأسك، نفضوا البصاق في وجهك من أجلي (يا سيدي)، وضعوا إكليل شوك على رأسك وقصبة في يمينك، ألبسوك ثوباً من بَرْفير، وصاروا يستهزئون بك، وأنت بإتضاعك حملت هذا كله من أجلي.\n** The transgressors strike You on Your head, and spat in Your face for my sake (O my Master). They placed a crown of thorns on Your head and a rod in Your right hand. They dressed You in purple, and humiliated You. And You, in Your humility, suffered all this for my sake.\nرفعوك على العود، أنت الرافع كافة الجهات بقوتك. وفي وقت عطشك سقوك خلاً، أنت الساقي جميع الخليقة من نعمتك.\n** They lifted You up on the tree, O You who lifts up all the universe with Your power. In the time of Your thirst they gave You vinegar, O You who quenches the whole creation with Your grace.\nأوقفوك في الحُكم كحقير، لطموك على خدك من أجلي. جلدوك على ظهرك بالسياط، ودُفنت في القبر كالأموات لكي تدفن آثامي.\n** They brought You to judgment as a despised person, and slapped Your cheek for my sake. They whipped Your back with scourge. You were buried in the grave like the dead, so that You could bury my iniquities.\nحرسوا قبرك وخافوك، لأنك بالحقيقة مخوفٌ جداً على كل الآلهة. قُمت يا مخلصي بالجبروت، كسرت شوكة الجحيم عني.\n** They guarded Your tomb and feared You, for truly You are awesome over all gods. You rose, O my Savior, with might, and broke the thorn of Hades for me.\nوأعطيتني جسدك ودمك لأحيا بهما، وأسمعتني صوتك قائلاً: \"مَنْ يأكل جسدي ويشرب دمي يثبت فيَّ وأنا فيه، لأن جسدي مأكل حقٌ ودمي مشرب حقٌ، مَنْ يأكلني يحيا بي.\"\n** You gave me Your Body and Blood to live through, and let me hear Your voice saying, \"He who eats My Flesh and drinks My Blood abides in Me, and I in him\" (John 6:56). \"For My Flesh is food indeed, and My Blood is drink indeed. He who eats My Flesh and drinks My Blood abides in Me, and I in him\" (John 6:55-56).\nعلمتني حِفظ وصاياك ودرس ناموسك وصحت خلفي قائلاً: \"تعال واقترب مني لكي تتبرر من خطاياك.\" ها قد أتيتُ يا سيدي قارعاً باب تعطُّفك.\n** You taught me to keep Your commandments and study Your Law. You cried out and called me saying: \"Come and draw near to Me, that You may be justified from your sins.\" Behold, O my Master, here I come knocking at the door of Your sympathy.\nاقبل مني هذه الذبيحة فِدْية عن خطاياي وجهالات شعبك. حل فينا بروحك القدوس، وطهرنا من كل إثم ورياء، وأجعل لنا جسدك ودمك كفارة وفداءً وتمحيصاً لكل ذنوبنا، لأني تقدَّمت للمس جسدك ودمك لشوقي في محبتك، فلا تحرقني بهما يا جابلي، بل أحرق كافة الأشواك الخانقة لنفسي.\n** Receive from me this sacrifice as a ransom for my sins and the ignorance of Your people. Dwell in us with Your Holy Spirit and purify us from every iniquity and hypocrisy. Let Your Body and Blood be as a propitiation, redemption and refinement of all our trespasses because I have approached forward to touch Your Body and Blood longing for Your love. So do not burn me with them, O my Creator, but burn all of the thorns which are choking my soul.\nاقبل هذه الذبيحة من أجل والدتك، لكي نأتي إليك وأنت تأتي وتحل فينا بروحك القدوس وبدالة ندعو الله أباك أبا لنا، ونرفع أصواتنا ونقول: \"أبانا الذي في السموات...\"\n** Accept this sacrifice for the sake of Your Mother, so that we may come to You, and You may come and dwell in us with Your Holy Spirit and we dare to call God Your Father, to be our Father, and raise our voices and say, \"Our Father...\"\nأيها الكائن الذي كان، الذاتي الأزلي قبل الأكوان، الجليس مع الآب، الوحيد معه في الربوبية، عنصر المراحم الذي شاء بإراداته أن يتألم عوض الخطاة الذين أولهم أنا، لأنك لما أردت أن تخلصني لم ترسل لي ملاكًا ولا رئيس ملائكة ولا كاروبيم ولا نبيًا بل أنت وحدك نزلت من حضن أبيك إلى بطن البتول، وصرت كحقير ومشيت على الأرض كإنسان، وهذا هو العجب في اتضاعك المزود حملك كمسكين والخرق لفتك الأذرع حملتك وركب البتول عظمتك، الفم قبلك، اللبن غذاك أنت الذي تقوت كافة الخليقة من نعمتك من أجلي يا سيدي قبلت العار والتجديف وقبلت الهوان والسب والتهديد واللطم ظلمك الشعب العنيد ولم يعرفوا أنك أنت مخلص العالم أخرجوا القضية أنك مستحق الموت وصرخوا في وجهك أن تصلب عن شعبك الشعب القاسي حملك خشبة الصليب من أجلي أنا الحامل قضية الموت بإراداتي ضربك الآثمة على رأسك نفضوا البصاق في وجهك من أجلي وضعوا إكليل شوك على رأسك وقصبة في يمينك ألبسوك ثوبًا من برفير([1]) وصاروا يستهزئون بك وأنت الرافع كافة الجهات بقوتك، وفي وقت عطشك سقوك خلا، أنت الساقي جميع الخليقة من نعمتك، أوقفوك في احكم كحقير لطموك على خدك من أجلي جلدوك على ظهرك بالسياط ودفنت في القبر كالأموات لكي تدفن آثامي حرسوا قبرك وخافوك، لأنك بالحقيقية مخوف جدًا على كل الآلهة، قمت يا مخلصي بالجبروت كسرت شوكة الجحيم عني وأعطيتني جسدك ودمك لأحيا بهما وأسمعتني صوتك قائلًا: من يأكل جسدي ويشرب دمي يثبت في وأنا فيه، لأن جسدي مأكل حق ودمي مشرب حق، من يأكلني يحيا بي، علمتني حفظ وصاياك ودرس ناموسك وصحت خلفي قائلًا: تعال واقترب مني لكي تتبرر من خطاياك. ها قد أتيت يا سيدي قارعًا باب تعطفك اقبل مني هذه الذبيحة فدية عن خطاياي وجهالات شعبك حل فينا بروحك القدوس، وطهرنا من كل إثم ورياء، وأجعل لنا جسدك ودمك كفارة وفداءًا وتمحيصًا لكل ذنوبنا، لأني تقدمت للمس جسدك ودمك لشوقي في محبتك فلا تحرقني بهما يا جابلي ([2]) بل أحرق كافة الأشواك الخانقة لنفسي، اقبل هذه الذبيحة من أجل والدتك، لكي نأتي إليك وأنت تأتي وتحل فينا بروحك القدوس وبدالة ندعو الله أباك أبا لنا ونرفع أصواتنا ونقول: أبانا الذي في السموات.. إلخ.\n"},{"n":"20- قسمة أخرى للقديس كيرلس تُقال في أي وقت *","t":"يا حمل الله الذي بأوجاعك حملت خطايا العالم، بتحننك امح آثامنا يا وحيد الله الذي بآلامك طهرت أدناس المسكونة بمراحمك طهر أدناس نفوسنا يا مسيح الله الذي بموتك قتلت الموت الذي قتل الجميع بقوتك أقم موت نفوسنا يا قابل القرابين الذي بدلًا عن الخطاة قدمت ذاتك، أقبل توبتنا نحن الخطاة، لأننا بدون دالة تقدمنا إلى حضرتك قارعين باب تعطفك، فهب لنا يا غنيًا بالمراحم البرء من كنوز أدويتك اشف(1) أيها الرؤوف نفوسنا الشقية بمراحم أسرارك المحيية طهر أجسادنا اغسلنا من آثامنا، اجعلنا أهلًا لحلول روحك الطاهر في نفوسنا أنر عقولنا لنعاين سبحك نق أفكارنا وأخلطنا بمجدك حبك أنزلك إلى هبوطنا نعمتك تصعدنا إلى علوك. تحننك غصبك وتجسمت بلحمنا. أظهرت استنارك للعيان. أظهر في نفوس عبيدك مجد أسرارك الخفية، وعند إصعاد الذبيحة على مذبحك تضمحل الخطية من أعضائنا بنعمتك. عند نزول مجدك على أسرارك ترفع عقولنا لمشاهدة جلالك عند استحالة الخبز والخمر إلى جسدك ودمك تتحول نفوسنا إلى مشاركة مجدك وتتحد نفوسنا بألوهيتك أخلق فينا يا ربنا وإلهنا قلبًا طاهرًا وأسكن روحك في باطننا جدد حواسنا بقوتك وصيرنا أهلًا لموهبتك من كأس دمك نشرب أعطنا مذاقه روحية لنستطعم مذاقة أسرارك المحيية. نتقدم إلى حضرتك واثقين برحمتك وأنت تحل داخلنا بالمحبة املأنا من خوفك وألهب قلوبنا بشوقك ألق فينا نعمتك طهر حواسنا برحمتك هب لنا دموعًا نقية واغسلنا من أدناس الخطية صيرنا هياكل مقدسة لحلولك وأواني مطهرة لقبولك لكي بذوق لحمك نؤهل لذوق نعمتك وبشرب دمك نؤهل لحلاوة محبتك وهبت لنا أن نأكل لحمك علانية أهلنا للإتحاد بك خفية وهبت لنا أن نشرب كأس دمك طاهرًا أهلنا أن نمتزج بطهارتك سرًا وكما أنك واحد في أبيك وروحك القدوس نتحد نحن بك وأنت فينا ويكمل قولك ويكون الجميع واحدًا فينا لكي بدالة ندعو الله أباك أبًا لنا ونقول بصوت جهوري: أبانا الذي في السموات.. إلخ.\n** يا حمل الله الذي بأوجاعك حملت خطايا العالم، بتحننك أمح آثامنا. يا وحيد الله الذي بآلامك طهرت أجناس المسكونة بمراحمك طهر أدناس نفوسنا يا مسيح الله الذي بموتك قتلت الموت الذي قتل الجميع بقوتك أقم موت نفوسنا. يا قابل القرابين الذي بدلا عن الخطاة قدمت ذاتك أقبل توبتنا نحن الخطاة، لأننا بدون دالة تقدمنا إلى حضرتك قارعين باب تعطفك، فهب لنا يا غنيا بالمراحم البرء من كنوز أدويتك. أشف أيها الرؤوف نفوسنا الشقية بمراهم أسرارك المحيية. طهر أجسامنا. أغسلنا من آثامنا. اجعلنا أهلا لحلول روحك الطاهر في نفوسنا. أنر عقولنا لنعاين سبحك. نق أفكارنا وأخلطنا بمجدك. حبك أنزلك إلى هبوطنا. نعمتك تصعدنا إلى علوك. تحننك غصبك وتجسمت بلحمنا، أظهرت إستنارك للعيان. أظهر في نفوس عبيدك مجد أسرارك الخفية، وعند أصعاد الذبيحة على مذبحك تضمحل الخطية من أعضائنا بنعمتك، عند نزول مجدك على أسرارك ترفع عقولنا لمشاهدة جلالك، عند استحالة الخبز والخمر إلى جسدك ودمك تتحول نفوسنا إلى مشاركة مجدك وتتحد نفوسنا بألوهيتك أخلق فينا يا ربنا وإلهنا قلبًا طاهرًا وأسكن روحك في باطننا، جدد حواسنا بقوتك، وصيرنا أهلا لموهبتك. من كاس دمك نشرب، أعطنا مذاقة روحية لنستطعم مذاقة أسرارك المحيية.\n** نتقدم إلى حضرتك واثقين برحمتك وأنت تحل داخلنا المحبة، إملأنا من خوفك، والهب قلوبنا بشوقك، الق فينا نعمتك، طهر حواسنا برحمتك، هب لنا دموعا نقية وإغسلنا من أدناس الخطية، صيرنا هياكل مقدسة لحلولك وأواني مطهرة لقبولك، لكي بذوق لحمك نؤهل لذوق نعمتك، وبشرب دمك نؤهل لحلاوة محبتك، وهب لنا أن نأكل لحمك علانية، أهلنا للإتحاد بك خفية، وهب لنا أن نشرب كاس دمك طاهرًا، أهلنا أن نمتزج بطهارتك سرًا. وكما أنك واحد مع أبيك وروحك القدوس نتحد بك وأنت فينا ويكمل قولك ويكون الجميع واحد فيما، لكي بدالة ندعو الله أباك أبًا لنا ونقول بصوت جهورى: أبانا الذي..\n** الحواشي والمراجع لهذه الصفحة هنا في موقع الأنبا تكلاهيمانوت:\n(1) إن كنت أؤمن بأن أشجار القداس الإلهي تثمر كل ما هو للشفاء والشبع والقداسة والفرح فإن الأشواك التي يزرعها عدو والخير قد تخنق هذه الثمار وقد تقتلها ما لم نتمسك بالذي قال\"يا سيد أتركها هذه السنة أيضًا حتى أنقب حولها وأضع زبلًا.. فإن صنعت ثمرًا وإلا ففيما بعد تقطعها\".\n** يقول الأب أثناسيوس إسكندر، كاهن كنيسة السيدة العذراء، كيتشنر، كندا عن هذه القسمة: ان هذه القسمة غير موجودة في خولاجي الثلاثة قداسات الذي طُبِعَ في عهد البابا كيرلس ولا في خولاجيات جمعية المحبة التي طبعت في عهد البابا كيرلس. وأول خولاجي ظهرت به هذه القسمة هو خولاجي الثلاثة قداسات طبعة دير المحرق والذي طبع في عهد قداسة البابا شنودة وطُبِعَت تحت عنوان قسمة للابن تقال في كل وقت؛ وقد ترجمها من العربية إلى القبطية حضرة الشماس يسى عبد المسيح أمين مكتبة المتحف القبطي وراجعها حضرة الأب القمص عبد المسيح المسعودى البراموسي، إذن هذه القسمة قد كُتِبَت في السبعينيات وهى ليست من قسم الكنيسة القديمة بدليل أنها ليست موجودة في الطبعات القديمة وليس لها اصل قبطى بدليل انها ترجمت من العربية إلى القبطية. ويُقال انها من نظم القمص بيشوي كامل.\n** ربما السبب هو بعض الألفاظ الغريبة المذكورة فيها مثل \"تتحد نفوسنا بألوهيتك\".. ربما يفيدك مراجعة كتاب \"بدع حديثة\" لقداسة البابا شنوده الثالث، الجزء الخاص بـ\"تأليه الإنسان\".\nقسمه للأبن سنوى\nصلاة القسمة\nالخولاجي\n"},{"n":"21- قسمه للابن سنوي","t":"أيها الإبن الوحيد الإله الكلمة الذي أحبنا وبحبه أراد أن يخلصنا من الهلاك الأبدي.\n** O only-begotten Son, God, the Logos who loved us, and through His love, He desired to redeem us from eternal perdition.\nولما كان الموت في طريق خلاصنا، إشتهى أن يجوز فيه حُباً بِنا وهكذا إرتفع على الصليب ليحمل عقاب خطايانا.\n** And since death was in the way of our redemption, He desired to go through it out of His love for us. And thus, He ascended upon the Cross that He may bear the punishment of our sins.\nنحن الذين أخطأنا وهو الذي تألم.\n** We are the ones who sinned, and He is the One who suffered.\nنحن الذين صرنا مديونين للعدل الإلهي بذنوبنا وهو الذي دفع الديون عنا.\n** We are the ones who were indebted to divine justice because of our sins, and He was the One who paid off the debts on our behalf.\nلأجلنا فضَّل التألَّم على التنعَّم والشقاء على الراحة والهوان على المجد والصليب على العرش الذي يحمله الكاروبيم.\n** For our sake, He preferred suffering over joy, toil over rest, contempt over glory, and the Cross over the throne which is carried by the cherubim.\nقَبَل أن يُربط بالحبال ليحلنا من رباطات خطايانا وتواضع ليرفعنا وجاع ليُشبعنا وعطش ليروينا.\n** He consented to be tied by ropes that He may loose us from the bonds of our sins. He humbled Himself that He may lift us up. He hungered to satiate us, and thirsted to quench our thirst.\nوصعد إلى الصليب عُرياناً ليكسونا بثوب بره وفتح جنبه بالحربة لكي ندخل إليه ونسكن في عرش نعمته ولكي يسيل الدم من جسده لنغتسل من آثامنا.\n** And He ascended upon the Cross naked that He might clothe us with the garment of His righteousness. And He opened His side by the spear that we might enter into Him and dwell in the throne of His grace, and that the Blood might flow from His Body that we might wash ourselves from our iniquities.\nوأخيراً مات ودُفن في القبر ليقيمنا من موت الخطية ويحيينا حياة أبدية.\n** Indeed, He died and was buried in the tomb, then He arose that He might raise us from the death of sin, and give us life unto life eternal.\nفيا إلهي، أن خطاياي هي الشوك الذي يوخز رأسك المقدسة. أنا الذي أحزنت قلبك بسروري بملاذ الدنيا الباطلة.\n** My sins, O my God, are the thorns that pierce your holy head; I, who have saddened Your heart by my rejoicing in the vain pleasures of the world.\nوما هذه الطريق المؤدية للموت التي أنت سائر فيها يا إلهي ومخلصي؟\n** What is this road that leads to death in which You are walking, O my God and my Savior?\nأي شئ تحمل على منكبيك؟ هو صليب العار الذي حملته عوضاً عني.\n** What is it that You are carrying upon Your shoulders? This is the cross of shame which You have carried on my behalf.\nما هذا أيها الفادي؟ ما الذي جعلك ترضي بذلك؟\n** What is this, O Redeemer? What has caused You to consent to this?\nأيُهان العظيم؟ أيُذل الممجد؟ أيُوضع المرتفع؟! يا لِعِظَم حُبك.\n** Shall the Great One be despised? Shall the Glorified One be afflicted? Shall the Exalted One be humbled? Oh! The greatness of Your love.\nنعم هو حُبك العظيم الذي جعلك تقبل إحتمال كل ذلك العذاب من أجلي.\n** Yes, it is Your great love that made You accept with endurance all these sufferings for my sake.\nأشكرك يا إلهي وتشكرك عني ملائكتك وخليقتك جميعاً لأني عاجز عن القيام بحمدك كما يستحق حُبك. فهل رأينا حباً أعظم من هذا؟\n** I give thanks to You, O my God, and Your angels, with all Your creation, give thanks to You on my behalf, for I am unable to present Your praise as befits Your love. Have we ever seen a greater love?\nفأحزني يا نفسي على خطاياك التي سببت لفاديك الحنون هذه الآلام. إرسمي جرحه أمامك وإحتمي فيه عندما يهيج عليك العدو.\n** So be sorrowful, O my soul, for your sins that caused these sufferings to Your compassionate Redeemer. Portray His wound before you, and hope in Him when the enemy rages against you.\nأعطني يا مخلصي أن أعتبر عذابك كنزي وإكليل الشوك مجدي وأوجاعك تنَعُمي ومرارتك حلاوتي ودمك حياتي ومحبتك فخري وشكري.\n** Grant me, O my Savior, to consider Your suffering my treasure, the crown of thorns my glory, Your sorrows my joy, Your bitterness my sweetness, Your blood my life, and Your love my pride and my thanksgiving.\nيا جراح المسيح، إجرحيني بحربة الحب الإلهي. يا موت المسيح، إسكرني بحب مَنْ مات من أجلي. يا دم المسيح، طهرني من كل خطية.\n** O my Lord Jesus Christ, who was wounded on account of our sins, and by Your bruises we were healed, wound me by the spear of Your healing divine love. And by the blood of your Cross, purify me from my sins. Cheer me also by Your love, O You who accepted death for my sake, that You may redeem me and give me life.\nيا يسوع حبيبي، إذا رأيتني عضواً يابساً رطبني بزيت نعمتك وثبتني فيك غصناً حياً أيها الكرمة الحقيقية.\n** O my Lord Jesus, my beloved, if You see me as a withered organ, soften me with the oil of Your grace, and confirm me in You as a living branch, O true Vine.\nوحينما أتقدم لتناول أسرارك إجعلني مستحقاً لذلك ومؤهلاً للإتحاد بك، لكي أناديك أيها الآب السماوي بنعمة البنين قائلاً: \"أبانا الذي في السموات...\"\n** And when I come forth to partake of Your mysteries, make me worthy of Them, and fit for communion with You, so that I may dare with boldness without fear to call on Your holy Father, who is in the heavens, with the voice of children, saying, Our \"Father....\"\nأيها الابن الوحيد الإله الكلمة الذي أحبنا وبحبه أراد أن يخلصنا من الهلاك الأبدي ولما كان الموت في طريق خلاصنا إشتهي أن يجوز فيه حبًا بنا وهكذا ارتفع على الصليب ليحمل عقاب خطايانا نحن الذي أخطأنا وهو الذي تألم نحن الذين صرنا مديونين للعدل الإلهلي بذنوبنا وهو الذي دفع الديون عنا لأجلنا فضل التألم على التنعم والشقاء على الراحة والهوان على المجد والصليب على العرش الذي يحمله الكاروبيم. قبل أن يربط بالحبال ليحلنا من رباطات خطايانا وتواضع ليرفعنا وجاع ليشبعنا وعطش ليروينا وصعد إلى الصليب عريانًا ليكسونا بثوب بره وفتح جنبه بالحربة لكل ندخل إليه ونسكن في عرش نعمته ولكي يسيل الدم من جسده لنغتسل من آثامنا وأخيرًا مات ودفن في القبر ليقيمنا من موت الخطية ويحيينا حياة أبدية. فيا إلهي أن خطاياي هي الشوك الذي يوخز رأسك المقدسة أنا الذي أحزنت قلبك بسروري بملاذ الدنيا الباطلة وما هذه الطريق المؤدية للموت التي انت سائر فيها يا إلهي ومخلصي أى شيء تحمل على منكبيك؟ هو صليب العار الذي حملته عوضًا عني ما هذا أيها الفادي؟ ما الذي جعلك ترضي بذلك ؟! أيهام العظيم أيذل الممجد. أيوضع المرتفع؟! يا لعظم حبك !! نعم هو حبك العظيم الذي جعلك تقبل إحتمال كل ذلك العذاب من أجلي أشكرك يا إلهي وتشكرك عني ملائكتك وخليقتك جميعًا لأني عاجز عن القيام بحمدك كما يستحق حبك فهل رأينا حبًا اعظم من هذا؟ فأحزني يا نفسي على خطاياك التي سببت لفاديك الحنون هذه الآلام إرسمي جرحه أمامك وإحتمي فيه عندما يهيج عليك العدو. أعطني يا مخلصي أن أعتبر عذابك كنزي وإكليل الشوك مجدي وأوجاعك تنعمي ومرارتك حلاوتي ودمك حياتي ومحبتك فخري وشكري يا جراح المسيح إجرحيني بحربة الحب الإلهي يا موت المسيح إسكرني بحب من مات من أجلي يا دم المسيح طهرني من كل خطية يا يسوع حبيبي إذا رأيتني عضوًا يابسًا رطبني بزيت نعمتك وثبتني فيك غصنًا حيًا أيها الكرمة الحقيقية وحينما أتقدم لتناول أسرارك إجعلني مستحقًا لذلك ومؤهلًا للاتحاد بك، لكي أناديك أيها الآب السماوي بنعمة البنين قائلًا: أبانا الذي في السموات.. إلخ.\nقسمة ميلاد الابن والاعياد السيدية\nصلاة القسمة\nالخولاجي\nقسمه القديس كيرلس\n"},{"n":"22- صلاة قسمة تقال لميلاد الابن وفي الأعياد السيدية الكبار","t":"اللهم المعتني بكل أحد الذي أخرج الروح من لا شيء وحمله في الجسد إلى الزمان الذي إختار أن ينقله إلى مظاله الأبدية هذا الذي إشعياء العظيم الصوت في الأنبياء تنبأ من أجله قائلًا هوذا العذراء تحبل وتلد إبنًا ويدعي إسمه عمانوئيل الذي تفسيره الله معنا وأيضًا أضاف إشعياء النبي قائلًا أن ولدًا يولد لنا ونعطي إبنًا الذي الرئاسة تكون على منكبيه (إش 9: 6) الله القوي المتسلط وملاك المشورة العظمي الصديق والمشير غير المبتدئ الكائن مع الله الآب قبل كل شيء إرمياء النبي العظيم تنبأ قائلًا: من أجل صهيون لا أسكت ومن أجل أورشليم لا أمل وعاد هذا النبي العفيف قائلًا: أن ترياقًا في جعلاد يداوي إبنة شعبي، فلنمض إلى جلعاد لننال الدواء من ذلك الموضع (إر 8: 21) جلعاد هي الجامعة الرسولية البيعة الترياق الذي فيها هو جسد ودم عمانوئيل، وإبنة شعبي هي العروس الحقانية التي نالت الطهر من إبنها الحبيب يسوع المسيح، حزقيال أيضًا العظيم في الأنبياء تنبأ قائلًا: رأيت بابًا في المشارق ومختومًا بخاتم عجيب ولم يدخله إلا رب القوات دخل وخرج وهو مغلق كما كان بحاله (حز 44: 2) وعاد هذا النبي الحكيم حزقيال قائلًا: هوذا إنني أبصرت مركبة مرفوعة في السماء وأربعة اوجه حول المركبة. وجه أسد ووجه ثور ووجه إنسان ووجه نسر بالموضع الذي تتوجه إليه المركبة والبكرات تسير في اتجاه المركبة. ويد إنسان من تحت المركبة (حز 1-2) سمعت صوتهم فوق الشاروبيم صرخ قائلًا: تعال تعال يا رجل الله تنبأ (حز: 10) وأن ذلك الصوت يشبه صوت رب الصاباؤوت الذي سمعته لأول مرة على نهر خوبار قائلًا لي: يا رجل الله، أيضًا دانيال عظيم الأنبياء تنبأ قائلًا: إنني أبصرت جبلًا مرتفعًا وقد قطع منه إذ لم تلمسه يد إنسان البتة (دا 2: 34) وعاد هنا النبي الحكيم قائلًا: أنني أبصرت بعيني رب الصاباؤوت على سحاب السماء يشبه ابن الإنسان وثيابه حمر من بوصار. هذا الذي أعطي الرئاسة والسلطان والقوة والغلبة من بعد ما تأنس وسلطانه سلطان الأبد. وسنوه لا تفني وابتع القول محب الحكمة النبي إشعياء قائلًا: ليس هو ملاكًا ولا رئيس ملائكة بل هو واحد مع الله الآب الذي قبل الدهعور هذا هو يسوع المسيح الصديق والمشير الأزلي مع الله الآب بالحقيقة هذا هو يسوع المسيح ورئيس كهنة كطقس ملكي صادق الذي تسجد وصار إنسانًا من أجل خلاص جنس البشر هذا بإراداته وحده ومسرة أبيه والروح القدس طأطأ سماء السموات وتجسد من العذراء وتعمد من يوحنا وصعد على خشبة الصليب ونزل إلى الجحيم وسبي سبيًا وقام من بين الأموات وصعد إلى السموات وخرج لاستقباله ملائكته يرتلون له وقد صار ملكًا علينا من أجل هذا نسأل ونتضرع إليك يا محب البشر باركنا أظهر لنا قدس هذه القرابين الموضوعة بحول روح قدسك عليها لكي بقلب طاهر نجسر أن نصرخ إلى الله القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nقسمة عيد الغطاس ويوحنا المعمدان\nصلاة القسمة\nالخولاجي\nقسمه للأبن سنوى\n"},{"n":"23- قسمه تُقال في عيد الغطاس وعيد الشهيد يوحنا المعمدان وفي كل وقت","t":"يا الله الذي أنعم على زكريا من بعد الكبر وعلى أليصابات من بعد الشيخوخة والعُقم.\n** O God, who granted Zacharias a son in old age and Elizabeth in old age and childlessness.(Luke 1:7)\n** `Vnou] vy`etafer`hmot `nZa,ariac `nousyri menenca ]metqello@ ouoh `n`Elicabet menenca ]metqellw nem ]metat[ryn.\nفنطق لسانه من بعد البُكم وتكلم بتسابيح وتماجيد وعظائم.\n** His tongue spoke after being speechless; and he spoke in hymns and doxologies and of great things. (Luke 1:64)\n** Afcaji `nje peflac menenca pi,arwf ouoh afcaji qen hanhwc nem handoxologia nem hanmetnis].\nوتهللت أليصابات قائلة: \"مُبارك الرب الإله الذي نزع عاري من بين الناس.\"\n** Elizabeth rejoiced saying, \"Blessed be the Lord God, who has taken away my reproach among men.\"(Luke 1:25)\n** Ouoh `Elicabet ac;elyl ecjw `mmoc je@ `f`cmarwout `nje `P[oic `Vnou] vy`etaf`wli `mpasws `ebol qen nirwmi.\nيا الذي ليس في مواليد النساء أعظم منه. الذي شهد عنه وشهادته حق هي.\n** This is he—among those born of women none is greater than him. H
