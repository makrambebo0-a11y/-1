يها الكائن السيد الرب","t":"الكاهن:\nأيها الكائن السيد الرب، الإله الحق من الإله الحق. الذي أظهر لنا نور الآب. الذي أنعم علينا بمعرفة الروح القدس الحقيقية.\n** Priest:\n** O You, THE BEING, Master, Lord, true God of true God, who have manifested to us the light of the Father, who have granted us the true knowledge of the Holy Spirit.\n** Pi`precbuteroc@\n** Vyetsop `vnyb P=o=c V] `nta`vmyi `ebolqen ounou] `nta`vmyi. Vyetafouwnh nan `ebol `m`vouwini `m`Viwt. Vyetafer`hmot nan `mpi`emi `mmyi `nte pi`Pneuma =e=;=u.\nالذي أظهر لنا هذا السر العظيم الذي للحياة. الذي ثبت قيام صفوف غير المتجسدين في البشر. الذي أعطي الذين علي الأرض تسبيح السارافيم.\n** Who have manifested to us this mystery of life, who have established the rising of choir of the incorporeal among men, who have given to the earthly the praising of the Seraphim.\n** Vyetafouwnh nan `ebol `mpainis] `mmuctyrion `nte `pwnq. Vy`etaftajro `n]metref`ohi `eratf `nte `p,oroc `nte ni`acwmatoc qen nirwmi. Vy`etaf] `nnyethijen pikahi `n]metrefhwc `nte niCeravim.\nاقبل منا أيضاً أصواتنا مع غير المرئيين. إحسبنا مع القوات السمائية.\n** Receive from us also our voices, together with the invisible. Count us with the heavenly hosts.\n** {i `ntoten hwn `nten`cmy nem nia;nau `erwou. Opten nem nidunamic etqen nivyoui.\nولنقل نحن أيضاً مع أولئك، إذ قد طرحنا عنا كل أفكار الخواطر الشريرة.\n** Let us also say with them, having cast away from us all the thoughts of evil imagination.\n** Marenjoc hwn nem ny`ete `mmau@ `eanhioui cabol `mmon `mmeu`i niben `nte nilogicmoc `n`atopon.\nونصرخ بما يرسله اولئك، بأصوات لا تسكت، وأفواه لا تفتر، ونبارك عظمتك.\n** And proclaim that which they send up with unceasing voices and unfailing lips, and praise Your greatness.\n** Ntenws `ebol `nny`enare ny`ete `mmau taou`o `mmwou@ qen han`cmy `nat,arwou@ nem hanrwf `na;mounk@ ouoh `nten`cmou `etekmetnis].\nالشماس:\nوإلي الشرق أنظروا.\n** Deacon:\n** Look towards the East.\n** Pidiakwn@\n** Ic `anatolac `ble'ate.\nيقول الكاهن\n\"أيها الكائن السيد الرب، الإله الحق من الإله الحق، الذي أظهر لنا نور الآب، الذي أنعم علينا بمعرفة الروح القدس الحقيقة، الذي أظهر لنا هذا السر العظيم الذي للحياة، الذي ثبت قيام صفوف غير المتجسدين في البشر،الذي أعطي الذين على الأرض تسبيح السيرافيم، إقبل منا نحن أيضًا أصواتنا مع غير المرئيين، إحسبنا مع القوات السمائية ولنقل نحن إيضًا مع أولئك إذ قد طرحنا عنا كل أفكار الخواطر الشريرة، ونصرخ بما يرسله أولئك بأصوات لا تسكت وأفواه لا تفتر ونبارك عظمتك\".\nيقول الشماس: وإلى الشرق أنظروا\nالقداس الغريغوري\nالخولاجي\nانت هو القيام حولك / قدوس قدوس\nمستحق و عادل\n"},{"n":"7- أنت هو القيام حولك / قدوس قدوس","t":"الكاهن:\nأنت هو القيام حولك الشاروبيم والسيرافيم، ستة أجنحة للواحد، وستة أجنحة للآخر. فبجناحين يغطون وجوههم.\n** Priest:\n** You are He around whom stand the Cherubim and the Seraphim, six wings to the one and six wings to the other, with two they cover their faces.\n** Pi`precbuteroc@\n** N;ok gar ne `etou`ohi `eratou `mpekkw]@ `nje ni<eroubim nem niCeravim@ ere coou `ntenh `mpiouai@ ouoh coou `ntenh `mpikeouai. Qen `cnau men `ntenh euhwbc `nnouho.\nوباثنين يغطون أرجلهم، ويطيرون باثنين، ويصرخون واحد قبالة واحد منهم. يرسلون تسبحة الغلبة والخلاص الذي لنا بصوت ممتلئ مجداً.\n** And with two they cover their feet, and with two they fly. And one cries to another. They send up the hymn of victory and salvation which is ours, with a voice full of glory.\n** Qen `cnau de euhwbc `nnou[alauj@ euhyl de qen nike`cnau@ euws `ebol ouai oube ouai `mmwou. Eutaou`o `mpihumnoc `nte pi`[ro ouoh `noujai `ntan@ qen ou`cmy ecmeh `n`wou.\nيسبحون، وينشدون. ويصرخون، ويصوتون قائلين:\n** They praise, they sing, they proclaim, they cry out, saying:\n** Euhwc eujw@ euws `ebol eu] `qrwou eujw `mmoc.\nالشماس:\nننصت.\n** Deacon:\n** Let us attend.\n** Pidiakwn@\n** `Proc,wmen.\n** (The people may chant the Aspasmos Watos)\nالشعب:\nقدوس. قدوس. قدوس. رب الصاباؤت. السماء والأرض مملوءتان من مجدك الاقدس.\n** People:\n** \"Holy, holy, holy, Lord of Hosts. Heaven and earth are full of Your holy glory.\"\n** Pilaoc@\n** `Agioc `agioc `agioc@ Kurioc cabaw;@ `plyryc `o ouranoc ke `y gy@ tyc `agiac cou doxyc.\nاجيوس اجيوس اجيوس. قدوس قدوس، أنت أيها الرب، وقدوس في كل شيء، وبالأكثر مختار هو نور جوهريتك. وغير موصوفة هي قوة حكمتك، وليس شيء من النطق يستطيع أن يحد لجة محبتك للبشر. خلقتني إنساناً كمحب للبشر، ولم تكن أنت محتاجاً إلي عبوديتي، بل أنا المحتاج إلي ربوبيتك.\n** Agios Agios, Agios. Holy, holy, O Lord, and holy are you in everything, and most excellent is the light of Your essence. Ineffable is the power of your wisdom, and no manner of speech can measure the depth of Your love towards mankind. You, as Lover of Mankind, have created me, as man. You had no need of my servitude, but rather I had need of Your lordship.\n** Agioc `agioc `agioc. <ouab `,ouab P=o=c ouoh `,ouab qen hwb niben@ `nhou`o de `fcwtp `nje `vouwini `nte tekoucia. Ouat`scaji `mmoc te `tjom `nte tekcovi`a@ `mmon `hli `ncaji na`s]si `epipelagoc `nte tekmetmairwmi. Ak;amioi `nrwmi hwc mairwmi@ naker`,ria `n;ok an pe `ntametbwk alla `anok de naier`,ria `ntekmet=o=c.\nمن أجل تعطفاتك الجزيلة، كوَنتني أذ لم أكن. أقمت السماء لي سقفاً. وثبت لي الأرض لأمشي عليها. من أجلي ألجمت البحر.\n** Because of the multitude of Your tender mercies, You have brought me into existence when I was not. You have raised heaven as a roof for me, and established the earth for me to walk upon. For my sake, you have bound the sea.\n** E;be nekmetsan`;maqt etos ak`;riswpi `enaisop an pe. Aktaho `n`tve `eratc nyi `eouahcoi. Aktajro `mpikahi nyi e;rimosi hijwf. `E;byt akma`s;am `m`viom.\nمن أجلي أظهرت طبيعة الحيوان. اخضعت كل شيء تحت قدميَّ. لم تدعني معوزاً شيئاً من أعمال كرامتك. أنت الذي جبلتني. ووضعت يدك عليَّ.\n** For my sake, You have manifested the nature of animals. You have subjected all things under my feet. You have not left me in need of any of the works of Your honor. You are He who formed me, and laid Your hand upon me.\n** E;byt akouwnh `ebol `n`tvucic `nnizwon. Ak;ebio `nen,ai niben capecyt `nna[alauj. Mpek,at eisat `n`hli qen ni`hbyou`i`nte pektaio. N;ok pe `etaker`plazip `mmoi. Ak,w `ntekjij `e`hryi `ejwi.\nوكتبت فيَّ صورة سلطانك. ووضعت فيَّ موهبة النطق. وفتحت لي الفردوس لأتنعم. واعطيتني علم معرفتك. أظهرت لي شجرة الحياة. وعرفتني شوكة الموت.\n** And inscribed in me the image of Your authority. You have placed in me the gift of speech, and opened for me paradise to enjoy, and have given to me the learning of Your knowledge. You have manifested to me the tree of life, and made known to me the sting of death.\n** Ak`cqai `nqyt `n]hikwn `nte tekexouci`a. Ak,w `mpidwron `nqyt `nte picaji. Akouwn `mpiparadicoc nyi eounof. Ak] etot `n]metref]`cbw `nte pek`emi. Akouwnh nyi `ebol `mpi`ssyn `nte `pwpq@ aktamoi `e`tcouri `m`vou.\nغرسٌ واحدٌ نهيتني أن أكل منه. هذا الذي قلت لي لا تأكل منه وحده. فأكلت بإرادتي.\n** Of one plant have You forbidden me to eat, that of which You have said to me, “Of it only do not eat.” But according to my will, I did eat.\n** Outwji `nouwt pe `etaksast `e`stemouwm `ebol `nqytf. Vai `etakjoc nyi je `mperouwm `ebol `nqytf `mmauatf. Aiouwm qen paouws.\nوتركت عني ناموسك برأيي. وتكاسلت عن وصاياك. أنا اختطفت لي قضية الموت.\n** I put Your law behind me by my own counsel, and became slothful towards Your commandments. I plucked for myself the sentence of death.\n** Ai,w `ncwi `mpeknomoc qen ta`gnwmy@ aier`amelyc `enekentoly. Anok aihwlem nyi `n]`apovacic `nte `vmou.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nيقول الكاهن\n\"أنت هو القيام حولك الشاروبيم والسيرافيم، ستة أجنحة للواحد، وستة أجنحة للأخر، فبجناحين يغطون وجوههم، وبإثنين يسترون أرجلهم ويطيرون بإثنين ويصرخون واحد قبالة واحد منهم، يرسلون تسبيح الغلبة والخلاص الذي لنا بصوت ممتلئ مجدًا يسبحون وينشدون ويصرخون هاتفين قائلين:\"\nيقول الشماس: فننصت.\n\"قدوس قدوس قدوس رب الصاباؤوت، السماء والأرض مملوءتان من مجدك الأقدس\"\nثم يرشم الكاهن ذاته باللفافة التي على الكأس أولًا والخدام ثانيًا ثم الشعب غربًا – وفي كل مرة يقول \" آجيوس.. ثم يكمل بعد ذلك:\n\"قدوس قدوس أنت أيها الرب وقدوس في كل شيء، وبالأكثر مختار هو نور جوهريتك، وغير موصوفة هي قوة حكمتك وليس شيء من النطق يستطيع أن يحد عمق([1]) محبتك للبشر، خلقتني إنسانًا كمحب للبشر، ولم تكن أنت محتاجًا إلى عبوديتي بل أنا المحتاج إلى ربوبيتك، من أجل تعطفاتك الجزيلة كونني إذ لم أكن ([2]) أقمت السماء لي سقفًا، وثبت لي الأرض لأمشي عليها من أجلي ألجمت البحر، من أجلي أظهرت طبيعة الحيوان، أخضعت كل شيئ تحت قدمي لم تدعني معوزًا شيئًا من أعمال كرامتك أنت الذي جبلتني ووضعت يدك علي، ورسمت في صورة سلطانك ووضعت في موهبة النطق، وفتحت لي الفردوس لأتنعم و أعطيتني علم معرفتك اظهرت لي شجرة الحياة وعرفتني شوكة الموت.\nغرس واحد نهيتني ان آكل منه هذا الذي قلت لا تأكل منه وحده فأكلت بإرادتي وتركت عني ناموسك برأيي وتكاسلت عن وصاياك أنا أختطفت لي قضية الموت\"\nيقول الشعب: يا رب ارحم \"بلحنها المعروف\"\n"},{"n":"8- حَوَّلت لِيَ العقوبة خلاصًا","t":"الكاهن:\nأنت يا سيدي حولت لي العقوبة خلاصاً. كراعٍ صالح سعيت في طلب الضال. كأبٍ حقيقي تعبت معي أنا الذي سقط.\n** Priest:\n** You, O my Master, have turned for me the punishment into salvation. As a good shepherd, You have sought after that which had gone astray. As a true father, you have labored with me, I who had fallen.\n** Pi`precbuteroc@\n** N;ok panyb akvwnh nyi `n]timwria `eououjai. Hwc man`ecwou `enanef ak[oji `ekw] `nca vyetafcwrem. Hwc iwt `mmyi aksepqici nemyi `anok qa vy`etafhei.\nربتطني بكل الأدوية المؤدية إلي الحياة. أنت الذي ارسلت لي الأنبياء من أجلي أنا المريض. أعطيتني الناموس عوناً.\n** You have bound me with all the remedies that lead to life. You are He who have sent to me the prophets for my sake, I the sick. You have given me the Law as a help.\n** Akmort qen nivaqri tyrou et[i `eqoun `e`pwnq. N;ok pe `etakouwrp nyi `nni`provytyc e;byt `anok qa vyetswni. Ak] `m`vnomoc nyi `eoubo`y;ia.\nأنت الذي خدمت لي الخلاص لما خالفت ناموسك. كنورٍ حقيقيٍ أشرقت للضالين وغير العارفين.\n** You are He who ministered salvation to me when I disobeyed Your Law. As true light, You have shone upon the lost and the ignorant.\n** `N;ok pe `etakerdiakonin nyi `mpioujai `eaierparabenin `mpeknomoc. Hwc ouwini `mmyi@ aksai `nnyetcwrem nem nyetoi `nat`emi.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nأنت الكائن في كل زمان، أتيت إلينا علي الارض، اتيت إلي بطن العذراء. أيها الغير المحوي، إذ أنت الإله لم تُضمِر اختطافاً أن تكون مساوياً لله.\n** You, who are THE BEING at all times, have come to us on earth. You have come into the womb of the Virgin. You, the Infinite, being God, did not consider equality with God a thing to be grasped.\n** `N;ok pe vy`etsop `ncyou niben@ ak`i nan hijen pikahi@ ak`i `e`;mytra `n]par;enoc. Piatsopf ekoi `nnou]@ `nouhwlem an pe `etakmeu`i `erof@ e;renswpi `nhucoc nem V].\nلكن وضعت ذاتك. وأخذت شكل العبد. وباركت طبيعتي فيك. وأكملت ناموسك عني. وعرفتني القيام من سقطتي. أعطيت إطلاقاً لمن قُبِضَ عليهم في الجحيم.\n** But emptied Yourself, and took the form of a servant, and blessed my nature in Yourself, and fulfilled your law on my behalf You have shown me the rising up from my fall.\n** Alla aksouwk `ebol `mmin `mmok. Ak[i `noumorvy `mbwk. Ak`cmou `etavucic `nqytk. Akjek peknomoc `ebol qaroi. Aktamoi `e`pjintwoun `nte pahei. Ak] `m`p,w `ebol `nny`etou`amahi `ejwou hiten `amen].\nأزلت لعنة الناموس. ابطلت الخطية بالجسد. عرفتني قوة سلطانك. وهبت النظر للعميان. أقمت الموتي من القبور. أقمت الطبيعة بالكلمة.\n** You have lifted the curse of the Law. You have abolished sin in the flesh. You have shown me the power of Your authority. You have given sight to the blind. You have raised the dead from the tombs. You have established nature by the word.\n** Akhioui `ebol `m`pcahoui `nte pipomoc@ akkwrf `m`vnobi qen `tcarx. Aktamoi `e`tjom `nte tekexoucia. Ak] `m`vnau `mbol `nnibelleu. Aktounoc nirefmwout `ebolqen ni`mhau. Aktaho `n]vucic `eratc qen `pcaji.\nأظهرت ليَّ تدبير تعطفك. إحتملت ظلم الأشرار. بذلت ظهرك للسياط. وخديك أهملتهما للَّطم.\n** You have manifested to me the economy of your tender mercy. You have borne the oppression of the wicked. You have given Your back to the scourge. Your cheeks You have left open to those who smite.\n** Akouwnh nyi `ebol `n]oikonomia `nte tekmetsan`;maqt. Akfai qa `p[i`njonc `nte niponyroc. Ak] `ntek[ici `ehanmactiggoc. Nekou`oji ak,au `ehansepkour.\nلأجلي يا سيدي، لم ترد وجهك عن خزي البصاق.\n** For my sake, O my Master, You have not hidden Your face from the shame of spitting.\n** E;byt panyb `mpektac;o `mpekho `ebolha `psipi `nte han;af.\nيقول الكاهن\n\"أنت يا سيدي حولت لي العقوبة خلاصًا كراع صالح سعيت في طلب الضال، كأب حقيقي تعبت معي أنا الذي سقطت، أدبتني بكل التأديبات المؤية إلى الحياة([1]) أنت الذي أرسلت لي الأنبياء من أجلي أنا المريض، أعطيتني الناموس عونًا أنت الذي خدمت لي الخلاص لما خالفت ناموسك، كنور حقيقي أشرقت للضالين وغير العارفين\"\nيقول الشعب: يا رب ارحم\n\" أنت الكائن في كل زمان، أتيت إلينا على الأرض، أتيت إلى بطن العذراء، أيها الغير المحوي إذ أنت الإله لم تضمر إختطافًا أن تكون مساويًا لله، لكن وضعت ذاتك وأخذت شكل العبد، وباركت طبيعتي فيك وأكملت ناموسك عني، وأريتني القيام من سقطتي أعطيت إطلاقًا لمن قبض عليهم في الجحيم، أزلت لعنة الناموس، أبطلت الخطيئة بالجسد([2]) أريتني قوة سلطانك وهبت النظر للعميان، أقمت الموتي من القبور، أخضعت الطبيعة بالكلمة، أظهرت لي تدبير تعطفك أحتملت ظلم الأشرار، بذلت ظهرك للسياط وخديك أهملتهما للطم، لأجلي يا سيدي لم ترد وجهك عن خزي البصاق\"\n"},{"n":"9- أتيت إلى الذبح مثل حمل","t":"الكاهن:\nأتيت إلي الذبح مثل حمل، حتي إلي الصليب.\n** Priest:\n** You have come to the slaughter as a lamb, even to the Cross.\n** Pi`precbuteroc@\n** Ak`i `e`pqolqel `m`vry] `nou`ecwou sa `e`qryi eou`ctauroc.\nأظهرت عظم اهتمامك بي. قتلت خطيتي بقبرك. أصعدت باكورتي إلي السماء. أظهرت لي إعلان مجيئك.\n** You have manifested the greatness of Your care for me. You have slain my sin in Your tomb. You have brought my first fruit up to heaven. You have shown me the manifestation of Your Coming.\n** Akownh `ebol `nteknis] `mmetfairwous qaroi. Akqwteb `mpanobi qen pek`mhau. Ak`wli `nta`aparsy `e`pswi `e`tve. Akouwnh nyi `ebol `n`tparoucia `nte pekjin`i.\nهذا الذي تأتي فيه لتدين الأحياء والأموات، وتعطي كل واحد كأعماله.\n** Wherein You shall come to judge the living and the dead, and give each one according to his deeds.\n** :ai `eteknyou `nqytc `e]hap `enyetonq nem nye;mwout@ ouoh `e] `mpiouai piouai kata nef`hbyoui.\nالشعب:\nكرحمتك يا رب، وليس كخطايانا.\n** People:\n** According to Your mercy, O Lord, and not according to our sins.\n** Pilaoc@\n** Kata to `eleoc cou Kurie@ ke my kata tac `amartiac `ymwn.\nيقول الكاهن\nآكئي إى إبخولخيل إفريتي إن أو\nإيمسو أو شا إى إخري إى أو\nإستافروس آكئوأونه إيفول\nإنتيك نيشتي إمميت فاي\nروؤوش خاروي آكخوتيب إمبا نوفي\nخين بيك إمهاف. آك أولى إنتا\nأبارشي إى إبشوى إى إتفي أب\nأوأونه ني إيقول إن إتباروسيا إنتي\nبيك جينئي. ثاى إيت أكينو\nإنخيتس إيتهياب إى أني إيتئونخ نيم نيئثموؤوت. أووه إيتي إمبي أواى\nبي أواطي كاطا نيف إهفيئوي.\nأتيت إلى الذبح مثل\nحمل حتى إلى\nالصليب أظهرت\nعظم إهتمامك بي\nقتلت خطيئتي بقبرك.\nأصعدت باكورتي\nإلى السماء. أظهرت لي\nإعلان مجيئك هذا الذي\nتأتي فيه\nلتدين الأحياء\nوالأموات. وتعطي كل\nواحد كأعماله.\nيقول الشعب\nكاطا تو إيليئوس سو كيريى كي\nمي كاطا طاس آمرتياس إيمون.\nكرحمتك يا رب\nوليس كخطايانا.\nالقداس الغريغوري\nالخولاجي\nاقدم لك مشورات حريتى\nحولت لى العقوبه خلاص\n"},{"n":"10- أقدم لك مشورات حريتي","t":"الكاهن:\n(اقدم لك يا سيدي)3\nمشورات حريتي. وأكتب أعمالي تبعاً لأقوالك.\n** Priest:\n** I offer You, O my Master, the symbols of my freedom. I write my works according to Your sayings.\n** Pi`precbuteroc@\n** }ini nak `e`hryi panyb (`nnicumboulon `nte tametremhe.)=b }`cqai `nnal`hbyou`i `nca nekcaji.\nأنت الذي أعطيتني هذه الخدمة المملؤة سراً. أعطيتني إصعاد جسدك بخبزٍ وخمرٍ.\n** You are He who has given me this service, full of mystery.\n** You have given me the partaking of Your Flesh, in bread and wine.\n** N;ok pe `etak] `etot `mpaisemsi e;meh `mmuctyrion.\n** Ak] nyi `n`;met`alum'ic `nte tekcarx qen ouwik nem ouyrp.\nالشعب:\nنؤمن.\n** People:\n** We believe.\n** Pilaoc@\n** Aly;oc picteu`omen.\nيرشم الكاهن درج البخور رشمًا واحدًا، ثم يأخذ من البخور ويضعه في المجمرة ويقول..\nتي إيني ناك إى إهري بانيب إنني\nسيمفولون إنتي تاميت ريمهي.\nتي إسخاي إننا إهفيئوي إنسا\nنيكساجي إنثوك بي إيتاكتي إيتوت\nإمباي شيمشي إثميه إم\nميستيريون آكتي ني أن إثميت\nآليم إبسيسي إنتي تيك\nساركس خين أو أويك نيم أو إيرب.\nأقدم لك يا سيدي\nمشورات حريتي ([1]).\nوأكتب أعمالي تبعًا\nلأقوالك. أنت الذي\nأعطيتني هذه الخدمة\nالمملوءة سرًا. أعطيتني\nإصعاد جسدك بخبز\nوخمر.\nيقول الشعب\nبيستيفؤمين\n"},{"n":"11- لأنك في الليلة / أخذت خبزا / الرشومات","t":"الكاهن:\nلأنك في اليلة التي أسلمت فيها ذاتك، بإرادتك وسلطانك وحدك. أخذت خبزا علي يديك الطاهرتين، اللتين بلا عيب ولا دنس، الطوباويتين المحييتين.\n** Priest:\n** For in the same night in which You gave Yourself up of Your own will and authority alone. You took bread into Your holy hands, which are without spot or blemish, blessed, and life-giving.\n** Pi`precbuteroc@\n** `N`hryi gar qen pi`ejwrh `etekyatyik `nqytf@ qen pekouws `mmin `mmok nem tekexoucia `mmauatk. Ak[i `nouwik `ejen nekjij =e=;=u@ ouoh `nata[ni@ ouoh `nat;wleb@ ouoh `mmakarion@ ouoh `nreftanqo.\nالشعب:\nنؤمن أن هذا هو بالحقيقة. آمين.\n** People:\n** We believe that this is true. Amen.\n** Pilaoc@\n** Tennah] je vai pe qen oume;myi@ amyn.\nونظرت إلي فوق، نحو السماء، إلي الله أبيك وسيد كل أحد.\n** You looked up towards heaven to God, who is Your Father and Master of everyone.\n** Akcomc `e`pswi `e`tve ha vy`ete vwk n`iwt V] ouoh `vnyb `nte ouon niben.\nوشكرت.\n** You gave thanks.\n** Etaksep`hmot.\nالشعب:\nآمين.\n** Amen.\n** Amyn.\nوباركته.\n** You blessed it.\n** Ak`cmou `erof.\nوقدسته.\n** You sanctified it.\n** Aker`agiazin `mmof.\nآمين. نؤمن ونعترف ونمجد.\n** Amen. We believe, we confess, and we glorify.\n** Amyn. Picteu`omen ke `omologoumen ke doxazomen.\nوقسمته، وأعطيته لتلاميذه المكرمين القديسين ورسلك الأطهار قائلا:\n** You broke it, and gave it to Your own holy, honorable disciples and saintly apostles, saying:\n** Akvasf aktyif `nny`ete nouk ettaiyout `n`agioc `mma;ytyc@ ouoh `n`apoctoloc =e=;=u ekjw `mmoc.\n\"خذوا كلوا منه كلكم، لأن هذا هو جسدي الذي يقسم عنكم وعن كثيرين، يعطي لمغفرة الخطايا، هذا اصنعوه لذكرى.\"\n** “Take, eat of it, all of you. For this is My Body, which shall be broken for you and for many, to be given for the remission of sins. This do in remembrance of Me.”\n** Je [i ouwm `ebol `nqytf tyrou@ vai gar pe pacwma.`etounavasf `ejen ;ynou nem hankemys@ `ncetyif `e`p,w `ebol `nte ninobi@ vai `aritf `epaer`vmeu`i.\nهذا هو بالحقيقة. آمين.\n** This is true. Amen.\n** Vai pe qen oume;myi@ amyn.\nيبخر الكاهن يديه على المجمرة ثلاث مرات ويقول..\nإن إهري غارخين بي إيجوره\nإيتيك ناتيك إنخيتف خين بيك\nأو أوش إممين إمموك نيم تيك إكسوسيا إممافاتك.\nلأنك في الليلة التي\nأسلمت فيها ذاتك\nبإرادتكم وسلطانك\nوحدك.\nيرفع يديه من على المجمرة، ويأخذ الخبز عليهما، ويرفع اللفافة من الصينية وهو يقول..\n\"أخذت خبزًا على يديك الطاهرتين اللتين بلا عيب ولا دنس الطوباويتين المحييتين\".\nيقول الشعب: \"نؤمن أن هذا هو بالحقيقة آمين\"\nيرفع الكاهن نظر إلى فوق ويقول: \"ونظرت إلى فوق نحو السماء إلى الله أبيك وسيد كل أحد \" ويرشم الخبز ثلاثة رشوم وفي كل مرة يقول\".\nوشكرت، وباركته، وقدسته (ويجاوبه الشعب في كل مرة قائلًا:\n((آمين)) ثم يقولون: \"نؤمن ونعترف ونمجد\"\nيقسم الكاهن القربانة ثلثًا عن اليمين وثلثين عن اليسار بدون أن يفصلهما وينفخ نفخة الروح القدس ويقول:\n\"وقسمته وأعطيته([1]) لتلاميذك المكرمين القديسين ورسلك الأطهار قائلًا: خذوا كلوا منه كلكم لأن هذا هو جسدي (وعندئذ يفرق رأس القربانة أسفلها بدون فصل ويقول) الذي يقسم عنكم وعن كثيرين يعطي لمغفرة الخطايا هذا إصنعوه لذكري.\nيقول الشعب \" هذا هو بالحقيقة آمين\"\n"},{"n":"12- أخذت كأسا و مزجتها","t":"الكاهن:\nهكذا أيضاً بعد أن أكلوا أخذت كأساً ومزجتها من ثمرة الكرمة والماء.\n** Priest:\n** Likewise also, after they had supper, You took the cup and mixed it of the fruit of the vine and water.\n** Pi`precbuteroc@\n** Pairy] on menenca `;rououwm ak[i `nou`avot@ ak;otf `ebol qen `poutah `nte ]bw `n`aloli nem oumwou.\nوشكرت.\n** You gave thanks.\n** Etaksep`hmot.\nالشعب:\nآمين.\n** People:\n** Amen.\n** Pilaoc@\n** Amyn.\nوباركته.\n** You blessed it.\n** Ak`cmou `erof.\nوقدسته.\n** You sanctified it.\n** Aker`agiazin `mmof.\nآمين. وأيضاً نؤمن ونعترف ونمجد.\n** Amen. Again, we believe, we confess, and we glorify.\n** Amyn. Ke palin picteu`omen ke `omologoumen ke doxazomen.\nوذقت وأعطيتها أيضا لتلاميذه المكرمين القديسين ورسله الأطهار قائلا:\n** You tasted and gave it also to Your own holy, honorable disciples and saintly apostles, saying:\n** Akjem]pi aktyif on `nny`ete nouk ettaiyout `n`agioc `mma;ytyc@ ouoh `n`apoctoloc =e=;=u ekjw `mmoc.\n\"خذوا اشربوا منه كلكم. لأن هذا هو دمي الذي للعهد الجديد، الذي يُسفَك عنكم وعن كثيرين يعطي لمغفرة الخطايا. هذا اصنعوه لذكري.\n** “Take, drink of it all of you. For this is My Blood of the New Covenant which is shed for you and for many, to be given for the remission of sins. This do in remembrance of Me.”\n** Je [i cw `ebol `nqytf tyrou@ vai gar pe na`cnof `nte ]dia;yky `mberi@ `etounavonf `ebol `ejen ;ynou nem hankemys@ `ncetyif `e`p,w `ebol `nte ninobi@ vai `aritf `epaer`vmeu`i.\nالشعب:\nهذا هو أيضاً بالحقيقة. آمين.\n** This is also true. Amen.\n** Vai on pe qen oume;myi@ amyn.\nيضع الكاهن يده على حافة الكأس ويقول:\n\"هكذا أيضًا بعد أن أكلوا أخذت كأسًا ومزجتها من ثمرة الكرمة والماء (يرشم الكاهن الكأس ثلاثة رشوم وفي كل رشم يقول) وشكرت وباركتها وقدستها (ويقول الشعب في كل رشم: آمين، وبعد آخر مرة يقولون: وأيضًا: \"نؤمن ونعترف ونمجد\" ثم يمسك الكاهن حافة الكأس ويميلها للأربع جهات مثال الصليب وينفخ نفخة الروح القدس ويقول: \"وذقت وأعطيتها أيضًا لتلاميذك المكرمين القديسين ورسلك الأطهار قائلًا: خذوا إشربوا منها كلكم لأن هذا هو دمي الذي للعهد الجديد الذي يسفك عنكم وعن كثيرين يعطي لمغفرة الخطايا ([1]) هذا إصنعوه لذكري\"\nيقول الشعب: \"وهذا هو أيضًا بالحقيقة آمين\"\n"},{"n":"13- في كل مرة تأكلون / فيما نحن نصنع ذكر","t":"الكاهن:\nلأن كل مرة تأكلون من هذا الخبز، وتشربون من هذه الكأس، تبشرون بموتي وتعترفون بقيامتي، وتذكروني إلي أن أجئ.\n** Priest:\n** “For every time you shall eat of this bread and drink of this cup, you proclaim My Death, confess My Resurrection, and remember Me till I come.”\n** Pi`precbuteroc@\n** Cop gar niben `etetennaouwm `ebolqen paiwik vai@ ouoh `ntetencw `ebolqen pai`avot vai@ `eretenhiwis `mpamou@ `ereten er`omologin `nta`anactacic@ `ereten`iri `mpameu`i sa]`i.\nالشعب:\nآمين. آمين. آمين. بموتك يا رب نبشر، وبقيامتك المقدسة وصعودك إلي السموات، نعترف. نسبحك، نباركك، نشكرك يا رب ونتضرع إليك يا إلهنا.\n** People:\n** Amen. Amen. Amen. Your Death, O Lord, we proclaim; Your Holy Resurrection and Ascension into the heavens, we confess. We praise You, we bless You, we thank You, O Lord, and we entreat You, O our God.\n** Pilaoc@ِ\n** Amyn `amyn `amyn@ ton ;anaton cou Kurie kataggelomen ke tyn `agian cou `anactacin ke tyn `analy'in cou `ntyc ouranic ce `omologoumen@ ce `enoumen ce eulogoumen ce eu,arictoumen Kurie@ ke de`ome;a cou `o :eoc `ymwn.\nفإذاً يا سيدنا فيما نحن نصنع ذكر نزولك علي الأرض، وموتك المحيي، وقبرك ثلاثة أيام.\n** Therefore, O our Master, as we commemorate Your Coming to earth, Your life-giving Death, Your Burial for three days.\n** Hwcte oun pennyb en`iri `m`vmeui `mpekjin`i `epecyt hijen pikahi@ nem pekmou `nreftanqo@ nem pek`mhau `nsomt `n`ehoou.\nوقيامتك من الأموات، وصُعودك إلي السموات، وجلوسك عن يمين أبيك. وظهورك الثاني الآتي من السموات، المخوف المملوء مجداً.\n** Your Resurrection from the dead, Your Ascension into the heavens, Your Sitting at the right hand of Your Father, and Your Second Coming form the heavens, awesome and full of glory.\n** Nem tek`anactacic `ebolqen nye;mwout@ nem pekjinse `e`pswi `enivyoui@ nem pekjinhemci caouinam `mPekiwt. Nem tekmah`cnou] `mparoucia@ e;nyou `ebolqen nivyoui@etoi `nho] ouoh e;meh `n`wou.\n** Tener`procverin nak `nny`ete nouk `ndwron `ebolqen ny`ete nouk@ kata hwb niben nem e;be hwb niben@ nem qen hwb niben.\nنقرب لك قرابينك من الذي لك، علي كل حال، ومن أجل كل حال وفى كل حال.\n** We offer unto You Your gifts from what is Yours, for everything, concerning everything, and in everything.\n** Pidiakwn@\n** Ouwst `mpiHiyb `nLogoc `nte V].\nالشماس:\nأسجدوا للحمل كلمة الله.\n** Deacon:\n** Worship the Lamb, the Logos of God.\n** Tenhwc `erok ten`cmou `erok tensemsi `mmok tenouwst `mmok.\nالشعب:\nنسبحك. نباركك. نخدمك ]يا رب[ نسجد لك.\n** We praise You, we bless You, we serve You, we worship You.\n** `Proc,wmen@ `amyn.\nيشير الكاهن بيديه إلى الجسد والدم ويقول:\nيقول الشعب: \"حقًا حقًا حقًا بموتك يا رب نبشر ([1]) وبقيامتك المقدسة وصعودك إلى السموات نعترف، نسبحك، نباركك، نشكرك يا رب، ونتضرع إليك يا إلهنا\".\nيقول الكاهن\n\"فإذا يا سيدنا فيما نحن نصنع ذكر نزولك على الأرض، وموتك المحيي،و قبرك ثلاثة أيام، وقيامتك من الأموات، وصعودك إلى السموات وجلوسك عن يمين أبيك، وظهورك الثاني الآتي من السموات، المخوف المملوء مجدًا، نقرب لك قرابينك من الذي لك على كل حال ومن أجل كل حال وفي كل حال\"\nيقول الشماس: \"أسجدوا للحمل كلمة الله\"\nيسجد الشعب جميعه لله ويقول:\"نسبحك، نباركك، نخدمك يا رب ونسجد لك\".\nيخضع الكاهن برأسه ويقول سرًا:\n\"أنت يا سيدنا بصوتك وحدك حول هذين الموضوعين، أنت الحال معنا هيئ لنا هذه الخدمة المملوءة سرًا، أنت أغرس فينا ذكر خدمتك المقدسة، أنت أرسل علينا نعمة روحك القدوس، لكي تطهر وتنقل هذه القرابين الموضوعة إلى جسد ودم خلاصنا\"\n"},{"n":"14- صلوات التقديس (سر حلول الروح القدس)","t":"الشماس:\nنُنصت. أمين.\n** Deacon:\n** Let us attend. Amen.\n** Pi`precbuteroc@\n** Ouoh paiwik men `ntefaif `ncwma efouab `ntak.\nالكاهن:\nوهذا الخبز تجعله جسدا مقدسا لك.\n** Priest:\n** And this bread make into Your holy Body.\n** Pilaoc@\n** }nah]@ amyn.\nالشعب:\nأؤمن.\n** People:\n** I believe. Amen.\n** Ouoh pai`avot de on `n`cnof eftaiyout@ `nte ]dia;yky `mberi `ntak.\nوهذه الكأس أيضا دماً كريماً للعهد الجديد.\n** And this cup also, the precious Blood of Your New Covenant.\n** Ke palin ]nah]@ `amyn.\nوأيضاً أؤمن.\n** Again, I believe. Amen.\n** Eu] `mmof `e`p,w `ebol `nte ninobi@ nem ouwnq `n`eneh `nnye;na[i `ebol `nqytf.\nيُعْطَى لغفران الخطايا، وحياة أبدية لمن يتناول منه.\n** Given for the remission of sins and eternal life to those who partake of Him.\n** Amyn. Kurie `ele`ycon@ kurie `ele`ycon@ kurie `ele`ycon.\nآمين. يا ربُ إرحم، يا ربُ إرحم، يا ربُ إرحم.\n** Amen. Lord have mercy, lord have mercy, lord have mercy.\n** يقول الشماس: ننصت آمين\nيرشم الكاهن ثلاثة رشوم سريعًا وهو يقول (وهذا الخبز تجعله جسدًا مقدسًا لك)\n** يقول الشعب: نؤمن حقًا – تيناهتي آمين)\nوأثناء ذلك يقول الكاهن سرًا\n(ربنا وإلهنا ومخلصنا يسوع المسيح يعطى لمغفرة الخطايا وحياة أبدية لمن يتناول منه)\nثم يرشم الكاهن الكأس ثلاثة رشوم سريعًا وهو يقول:\n(وهذه الكأس أيضًا دمًا كريمًا لعهدك الجديد)\n** يقول الشعب: وأيضًا نؤمن حقًا – كي بالين تيناهتي آمين)\nيقول الكاهن (ربنا وإلهنا ومخلصنا يسوع المسيح يُعطى لمغفرة الخطايا وحياة أبدية لمن يتناول منه)\nيقول الشعب (يا رب إرحم يا رب إرحم يا رب إرحم)\nالطلبه: ثبت اساس الكنيسه\nالقداس الغريغوري\nالخولاجي\nفى كل مره تاكلون / فيما نحن نصنع\n"},{"n":"15- الطلبة: ثبت أساس الكنيسة","t":"الكاهن:\nنعم نسألك أيها المسيح إلهنا: ثبت اساس الكنيسة.\n** Priest:\n** Yea, we ask You, O Christ our God: confirm the foundation of the church\n** Pi`precbuteroc@\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc:\n** Kurie `ele`ycon.\nوحدانية القلب التي للمحبة فلتتأصل فينا.\n** The oneness of heart that is of love, may it take root in us.\nلينمُ بر الإيمان، سهِّل لنا طريق التقوي.\n** May the righteousness of faith grow, straighten for us the way of godliness.\nالرعاه إضبطهم، الذين يرعونهم ثبتهم.\n** Control the shepherds, and those whom they shepherd, confirm.\nأعط بهاد للإكليروس، نسكاً للرهبان و الراهبات.\n** Give splendor to the clergy, asceticism to the monks and the nuns.\nطهارةً للذين في البتولية، حياةً صالحة للذين في سر الزيجة.\n** Purity to those in virginity, a life of goodness to those in the sacrament of matrimony.\nرحمةً للذين في التوبة، صلاحاً للأغنياء.\n** Mercy to those in repentance; goodness to the rich.\nدعوة للفُضلاء، معونةً للمساكين.\n** Meekness to the honorable; help to the poor.\nنجاحاً للطلبة عملاً للمُحتاجين.\n** Success for the students, work for the needy.\nالشيوخ قوِّهم، الذين في الحداثة أدبهم.\n** Confirm the elders; chasten those who are young.\nغير المؤمنين ردَّهم، لتنقضي إفتراقات الكنيسة.\n** Restore the unbelievers; may the schisms of the Church cease.\nحل تعاظم أهل البدع، ونحن كلنا إحسبنا في وحدانية التقيى.\n** Strip the vanity of the heretics, and count us all in the unity of godliness.\nيا ربُ إرحم، يا ربُ إرحم، يا ربُ إرحم.\n** Lord have mercy, Lord have mercy, Lord have mercy.\n** Kurie `ele`ycon@ Kurie `ele`ycon@ Kurie `ele`ycon.\nثم يقول الكاهن هذه الطلبة وفي كل ربع منها يجاوبه الشعب قائلين (يا رب إرحم)\nوحدانية القلب التي للمحبة فتتأصل فينا\nالرعاة أضبطهم والذين يرعونهم ثبتهم\n** أعط بهاءًا للإكليروس، نسكًا للرهبان والراهبات\n** طهارة للذين في البتولية، حياة صالحة للمتزوجين\n** رحمة للتائبين، صلاحًا للأغنياء\n** وداعة للفضلاء، معونة للمساكين\n** الشيوخ قؤهم، الذين في الحداثة أدبهم\n** غير المؤمنين ردهم، لتنقض إنقسامات الكنيسة\n** حل تعاظم أهل البدع، ونحن كلنا احسبنا في وحدانية التقوي\nيقول الشعب: يا رب إرحم يا رب إرحم يا رب إرحم\nاوشية السلام\nالقداس الغريغوري\nالخولاجي\nصلوات التقديس\n"},{"n":"16- أوشية السلام","t":"الكاهن:\nأذكر يا رب سلام كنيستك الواحدة، الوحيدة المقدسة، الجامعة الرسولية.\n** Priest:\n** Remember, O Lord, the peace of Your One, Only, Holy, Catholic, and Apostolic Church.\n** Pi`precbuteroc@\n** Ari`vmeu`i P=o=c `n]hiryny `nte tekou`i `mmauatc =e=;=u `nka;oliky `n`apoctoliky `nekklyci`a.\nالشماس:\nصلوا من اجل سلام الواحدة المقدسة الجامعة الرسولية كنيسة الله الارثوذكسية.\n** Deacon:\n** Pray for the peace of the one, holy, catholic, and apostolic Orthodox Church of God.\n** Pidiakwn@\n** Proceuxac;e `uper tyc `irynyc tyc `agiac monyc ka;olikyc ke `apoctolikyc or;odoxou tou :eou ekklyciac.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nهذه الكائنة من أقاصى المسكونة إلى أقاصيها. والذين يفصلون فيها كلمة الحق باستقامة.\n** That which exists from one end of the world to the other. And those who rightly define the word of truth in her.\n** :ai etsop icjen auaryjc `n]oikoumeny sa auryjc. Nem nyetswt `ebol nqytc `m`pcaji `nte ]me;myi qen oucwouten.\nثم يقول الأواشي الآتية\nصلوا من أجل سلام كنيسة الله الواحدة المقدسة الجامعة الرسولية الأرثوذكسية\nيقول الشعب: يا رب إرحم\nيقول الكاهن\nهذه الكائنة من أقاصي المسكونة إلى أقصاها والذين يفصلون فيها كلمة الحق باستقامة\nالطلبه: ثبت اساس الكنيسه\nأوشية الآباء\nالقداس الغريغوري\nالخولاجي\n"},{"n":"17- أوشية الآباء","t":"الكاهن:\nوبالأكثر الأب المكرم بطريركنا أنبا (...).\n** Priest:\n** Most of all our patriarch Abba (...).\n** Pi`precbuteroc@\n** Nhou`o de penpatria,yc `niwt ettaiyout papa abba (...).\nالشماس:\nصلوا من أجل رئيس كهنتنا البابا أنبا (...) بابا وبطريرك ورئيس أساقفة المدينة العظمي الاسكندرية، وسائر أساقفتنا الارثوذكسيين.\n** Deacon:\n** Pray for our high priest, Papa Abba (...), pope and patriarch and archbishop of the great of Alexandria, and for our orthodox bishops.\n** Pidiakwn@\n** Proceuxac;e `uper tou`ar,y `erewc `ymwn papa abba (...) papa ke patriar,ou ke `ar,y `epickopou tyc megalo polewc Alexan`driac@ ke ton `or;odoxwn `ymwn `epickopwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nوعن الكائنين ههنا والذين رقدوا. الأساقفة، والقمامصة، والقسوس، والشمامسة، والإبوذياقونين.\n** And on behalf of those who are in this place, and those who have fallen asleep, the bishops, hegomens, priests, deacons, and subdeacons.\n** Nem `e`hryi `ejen nyetsop `mpaima@ nem ny`etauenkot. Ni`epickopoc@ nihygoumenoc@ ni`precbuteroc@ nidiakwn nihupodiakwn.\nصلوا من أجل القمامصة القسوس والشمامسة والايبوذياكونيين وسبع طغمات كنيسة الله.\n** Pray for the hegumens, priests, deacons, subdeacons, and the seven orders of the Church of God.\n** `Proceuxac;e `uper twn `ygoumenwn ke `precbuterwn ke diakonwn ke `upodiakwnwn epta tagmatwn tou :eou tyc ekklyciac.\nوالأغنسطسيين، والمرتلين، والقرائين، والرهبان، والعذاري، والأرامل، والأيتام، والمتنسكين والعلمانيين، وعن كل إمتلاء كنيستك المقدسة يا إله المؤمنين.\n** And the readers the chanters, the exorcists, the monks, the virgins, the widows, the orphans, the ascetics, the laity, and all the fullness of Your holy Church, O God of the faithful.\n** Ni`anagnwctyc@ ni'altyc@ niexorgictyc@ nimona,oc@ nipar;enoc@ ni,yra@ niorvanoc@ niegkratyc@ nilaikoc@ nem `e`hryi `ejen `vmoh tyrf `nte tekekklycia =e=;=u@ V] `nte nipictoc.\n** ثم يكمل الكاهن الجملة السابقة:\n** وبالأكثر بطريركنا الأب المكرم البابا أنبا (...) وشريكه في الخدمة الرسولية أبينا الأسقف الأنبا (...)\nيقول الشماس\n** (صلوا من أجل رئيس كهنتنا أنبا (...) بابا وبطريريك ورئيس أساقفة المدينة العظمي الإسكندرية وسائر أساقفتنا الأرثوذكسيين)\nيقول الشعب: يا رب إرحم\nيقول الكاهن: أذكر يا رب الكائنين هنا والأساقفة والقمامصة والقسوس والشمامسة والإيبوذياكونيين)\nصلوا من أجل القمامصة والقسوس والشمامسة والإيبوذياكونين وسبع طغمات كنيسة الله)\nيقول الكاهن\n(والأغنسطسين والمرتلين والقارئين والرهبان والعذاري والأرامل والأيتام والنساك وعن كل إمتلاء كنيستك يا إله المؤمنين\nإوشية الملوك والحكام\nالقداس الغريغوري\nالخولاجي\nاوشية السلام\n"},{"n":"18- أوشية الملوك و الحكام","t":"الكاهن:\nأذكر يا رب الذين تملكوا في التقوي والذين هم الآن ملوكٌ (رؤساء).\n** Priest:\n** Remember, O Lord, those who have reigned in godliness and those who are now kings (leaders).\n** Pi`precbuteroc@\n** Ari`vmeu`i P=o=c `nny`etauerouro qen ]meteucebyc@ nem nyetoi `nouro (`nar,y).\nالشماس:\nصلوا من أجل ملوكنا (رؤساتنا) محبي المسيح.\n** Deacon:\n** Pray for our Christ-loving kings (leaders).\n** Pidiakwn@\n** `Proceuxac;e `uper twn vilo`,rictwn `ymwn bacilewn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nاذكر يا رب أخوتنا المؤمنين الأرثوذكسيين الذين في البلاط، وجميع الأجناد.\n** Remember, O Lord, our brethren, the orthodox believers who are in the palace (government), and all the soldiers.\n** Ari`vmeu`i P=o=c `nnen`cnyou `mpictoc ouoh `nor;odoxoc etqen nipalation nem pi`ctrateuma tyrf.\nصلوا من أجل الذين في البلاط من الاخوة المؤمنين الأرثوذكسيين وسائر الأجناد.\n** Pray for those of our brethren, the orthodox believers who are in the palace (government), and all the soldiers.\n** `Proceuxac;e `uper twn entw palatiw `adelvwn pictwn ke or;odoxwn ke pantwn twn `ctratopetwn.\nويكمل الكاهن:\nأذكر يا رب الذين تملكوا في التقوي والذين هم الآن حكام\nيقول الشماس: صلوا من أجل حكامنا محبي المسيح\nيقول الشعب: يا رب إرحم\nيقول الكاهن\nيقول الشماس\nصلوا من أحل الإخوة المؤمنين الأرثوذكسيين الذي في البلاط وسائر الأجناد\nالقداس الغريغوري\nالخولاجي\nآوشية القرابين و الذين فى السبى\nأوشية الآباء\n"},{"n":"19- أوشية القرابين والذين في السبي","t":"الكاهن:\nأذكر يارب الذين قدموا لك هذه القرابين، والذين قدمت عنهم، والذين قدمت بواسطتهم، اعطهم كلهم الأجر السمائي.\n** Priest:\n** Remember, O Lord, those who have brought unto You these gifts, those on whose behalf they have been brought, and those by whom they have been brought. Give them all the heavenly reward.\n** Pi`precbuteroc@\n** Ari`vmeu`i P=o=c `nny`etau`ini nak `eqoun `nnaidwron@ nem ny`etau`enou `ejwou@ nem ny`etau`enou `ebol hitotou@ moi nwou tyrou `mpibe,e pi`ebolqen nivyoui.\nالشماس:\nصلوا من أجل هذه القرابين المقدسة الكريمة، وتقدماتنا، والذين قدموها.\n** Deacon:\n** Pray for these Holy and precious gifts, our Sacrifices and those who have brought them.\n** Pidiakwn@\n** `Proceuxac;e `uper twn `agiwn timiwn dwrwn toutwn ke ;uciwn `ymwn ke `procverontwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nاذكر يا رب الساكنين في الجبال والمغاير، وإخوتنا الذين في السبي.\n** Remember, O Lord, those who dwell in the mountains and the caves, and our brethren who are in captivity.\n** Ari`vmeu`i P=o=c `nnyetsop qen nitwou nem ni`cpyleon@ ouoh nen`cnyou etqen nie,malwcia.\nصلوا من اجل المسبيين.\n** Pray for the captives.\n** Proceuxac;e `uper twn e,malwtwn.\nأنعم عليهم بعودةٍ سالمةٍ إلي منازلهم.\n** Grant them a peaceful return unto their own.\n** Ari`hmot nwou `nhanjintac;o `nhirynikon `eqoun `eny`ete nouou.\n** يشير الكاهن إلى القرابين بيديه ويقول:\nأذكر يا رب الذين قدموا لك هذه القرابين والذين قدمت عنهم والذين قدمت بواسطتهم أعطهم كلهم الأجر السمائي الذي من السموات (بدون اللحن المعروف)\nيقول الشماس\nصلوا من أجل هذه القرابين المقدسة الكريمة وتقدماتنا والذين قدموها (بدون اللحن المعروف)\nيقول الشعب: يا رب إرحم\nيقول الكاهن\nيقول الكاهن (بلحن العتيقة)\nأنعم عليهم بالعودة سالمين إلى منازلهم\nلحن جيه ناى نان / ارحمنا يا الله\nالقداس الغريغوري\nالخولاجي\nإوشية الملوك والحكام\n"},{"n":"20- لحن جي ناي نان / إرحمنا","t":"الشماس:\nإسجدوا لله بخوف.\n** Deacon:\n** Worship God in fear.\n** Pidiakwn@\n** `Klinate :e`w meta vobou.\nأو:\nأسجدوا للحمل كلمة الله.\n** or:\n** Worship the Lamb, the Logos of God.\n** Ouwst `mpiHiyb `nLogoc `nte V].\nيقول الكاهن سراً:\nأذكر يا رب ضعفي أنا أيضاً واغفر لي جميع خطاياي. وحيث كثر الإثم فلتكثر هناك نعمتك. ومن أجل خطاياي خاصة ونجاسات قلبي لا تمنع شعبك نعمة روحك القدوس.\n** Priest:(Inaudibly)\n** Remember, O Lord, my own weakness and forgive weakness and forgive all my sins, and where transgression abounds, let Your grace be multiplied in abundance. Because of my own sins and the abominations of my heart, deprive not Your people of the grace of Your Holy Spirit.\nالشعب:\nأرحمنا يا الله مخلصنا.\nيا رب إرحم.\n** People:\n** Have mercy upon us O God, Our Savior.\n** Lord have mercy.\n** Pilaoc:\n** Ele`ycon `ymac `o :eoc `o Cwtyr `ymwn.\n** Kurie `ele`ycon.\nالكاهن:\nشعُبك وكنيستك يطلبون إليك، وبك إلي الآب قائلين:\n** Priest:\n** For Your people and Your Church ask You, and through You the Father With You saying:\n** Pi`precbuteroc@\n** Peklaoc gar nem tekek`klycia ce]ho `erok@ ouoh `ebol hitotk `eViwt nemak eujw `mmoc.\n** Je nai nan V] penCwtyr.\nيقول الشماس: أسجدوا لله بخوف\nيخضع كل الشعب للرب ويخضع الكاهن برأسه ويقول سرًا:\n(إذكر يا رب ضعفي أنا أيضا وإغفر لي جميع خطاياي وحيثما كثر الإثم فلتكثر هناك نعمتك ومن أجل خطاياي خاصة ونجاسات قلبي لا تمنع عن شعبك نعمة روحك القدوس)\nيقول الشعب باللحن ثلاث مرات (ارحمنا يا الله مخلصنا)\nوفي هذه الأثناء يلف الكاهن يده بلفافة ويلتفت إلى الشعب بغير رشم ويقول باللحن القطعة الآتية (وعند كلمة يطلبون يلتفت إلى الشرق ويكمل)\nبيك لاؤس غارنيم تيك إككليسيا سي تيهو إيروك أووه إيفول هيطوطك إى إفيوت نيماك إفجو إمموس.\nلأن شعبك وكنيستك\nيطلبون إليك وبك إلى الآب\nمعك قائلين\nثم يقول ثلاث مرات\nجي ناي نان إفنوتي بين سوتير\nيجاوبه الشمامسة والشعب في كل مرة قائلين:\nإيليسون إيماس أوثيئوس أو سوتير إيمون.\nوحدانيه القب / شفاءا للمرضي\nالقداس الغريغوري\nالخولاجي\nآوشية القرابين و الذين فى السبى\n"},{"n":"21- وحدانية القلب / الطلبة الثانية (شفاء للمرضى)","t":"الكاهن:\nأنعم علي شعبك بواحدانية القلب. أعط طمأنينة للعالم، ومزاجاً حسناً للهواء. تفضل يا رب، أهوية السماء وثمرات الأرض ومياه الأنهار. والزروع والعشب ونبات الحقل في هذه السنة باركها.\n** Priest:\n** Grant Your people oneness of heart. Give tranquility to the world, good temper to the air. Graciously accord O Lord, the air of heaven, the fruits of the earth, the waters of the rivers, the seeds, the herbs, and the plants of the field this year. Bless them.\n** Pi`precbuteroc@\n** Ari`hmot `mpeklaoc `n]methyt `nouwt@ moi `noucemni `mpikocmoc@ou;wt `enanef `mpi`ayr. Arikataxioin P[oic ni`ayr `nte `tve@ nem nikarpoc `nte `pkahi nem nimwou `nte v`iaro nem nici] nem nicim nem nirwt `nte `tkoi@ etqen tairompi ;ai@ `cmou `erwou.\nالشماس:\nاطلبوا عن أهوية السماء وثمرات الأرض وصعود مياه الأنهار. والزروع والعشب ونبات الحقل في هذه السنة لكي يباركها المسيح إلهنا ويتحنن على جبلته التى صنعتها يداه ويغفر لنا خطايانا.\n** Deacon:\n** Pray for the air of heaven, the fruits of the earth, the rising of the waters of the rivers.The seeds, the herbs, and the plants of the field, that Christ our God may bless them, have compassion on His creation which His hands have made, and forgive us our sins.\n** Pidiakwn@\n** Twbh `ejen ni`ayr `nte `tve nem nikarpoc `nte `pkahi@ `pjinmosi `e`pswi `nte niiarwou `mmwou. Nici] nem nicim nem nirwt `nte `tkoi@ hina `nte P=,=c Pennou] `cmou `erwou@ ouoh `ntefsenhyt qa pef`placma `eta nefjij ;amiof `ntef,a nennobi nan `ebol.\nالشعب:\nيا ربُ إرحم، يا ربُ إرحم، يا ربُ إرحم.\n** People:\n** Lord have mercy, Lord have mercy, Lord have mercy .\n** Pilaoc@\n** Kurie `ele`ycon@ Kurie `ele`ycon@ Kurie `ele`ycon.\nاصعدها كمقدارها كنعمتك، فرح وجه الأرض ليرو حرثها ولتكثر أثمارها.\n** Priest: Raise them to their measure according to Your grace. Give joy to the face of the earth. May its furrows be abundantly watered and its fruits be plentiful.\n** Anitou `e`pswi kata nousi kata vy `ete vwk `n`hmot@ ma`pounof `m`pho `m`pkahi@ marou;iqi `nje nef;lwm@ marou`asai `nje nefoutah.\nأعدها للزرع والحصاد، ودبر حياتنا كما يليق. بارك اكليل السنة بصلاحك من أجل فقراء شعبك، من أجل الارملة واليتيم، والغريب والضيف، ومن أجلنا كلنا نحن الذين نرجوك ونطلب اسمك القدوس. لأن أعين الكل تترجاك ، لأنك أنت الذي تعطيهم طعامهم في حين حسن.\n** Prepare it for sowing and harvesting. Manage our lives as deemed fit. Bless the crown of the year with Your goodness for the sake of the poor of Your people, the widow, the orphan, the traveler, the stranger, and for the sake of us all who entreat You and seek Your Holy Name. For the eyes of everyone wait upon You, for You give them their food in due season.\n** Cebtwtf oujroj nem ouwcq@ ouoh `arioikonomin `mpenjinwnq kata peternofri. `Cmou `epi`,lom `nte ]rompi hiten tekmet`,ryctoc e;be nihyki `nte peklaoc@ e;be ],yra nem piorvanoc nem pisemmo nem pirem`njwili@ nem pirem`njwili@ nem e;byten tyren qa nyeterhelpic `erok ouoh ettwbh `mpekran =e=;=u. Je nenbal `nouon niben ceerhelpic `erok@ je `n;ok et] `ntouqre `nwou qen oucyou enanef.\nاصنع معنا حسب صلاحك، يا معطيا طعاما لكل جسد. املأ قلوبنا فرحا ونعيم، لكي نحن أيضا إذ يكون لنا الكفاية في كل شئ، كل حين نزداد في كل عمل صالح.\n** Deal with us according to Your goodness, O You who give food to all flesh. Fill our hearts with joy and gladness that we too, having sufficiency in every thing always, may abound in every good deed.\n** Ariou`i neman kata tekmetaga;oc> vy et]qre `ncarx niben moh `nnenhyt `nrasi nem ouounof@ hina anon hwn `ere `vrwsi `ntoten qen hwb niben `ncyou niben@ `ntenerhou`o qen hwb niben `naga;on.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nشفاءً للمرضي، راحة للمعوزين.\n** Healing to the sick, rest to the needy.\nإطلاقاً للذين في السبي، قبولاً للأيتام.\n** Release to those in captivity, acceptance to the orphans.\nمساعدة للأرامل، المتضايقين اكفهم بالخيرات.\n** Help to the widows, satisfy the distressed with good things.\nالساقطين اقمهم، القيام ثبتهم.\n** Raise the fallen, confirm the upright.\nالراقدين اذكرهم، المعترفين إقبل إليك إعترافهم.\n** Remember all those who have fallen asleep, accept to Yourself the prayers and the confessions of the confessors.\nالخطاه الذين تابوا عدهم مع مؤمنيك، مؤمنوك أحصِّهم مع شهدائك.\n** The sinners who have repented, count them with Your faithful; Your faithful, count with Your martyrs.\nالذين هَهنا اجعلهم متشبهين بملائكتك.\n** Those who are in this place, conform them to Your angels.\nو نحن أيضاً المدعوين بنعمتك إلي خدمتك و نحن غير مستحقين، اقبلنا إليك.\n** And we also, who have been called be Your grace into You service while unworthy, accept us to Yourself.\nوبعد ذلك يقول الكاهن:\nآري إهموت إمبيك لاؤس إنتي ميتهيت\nإن أوأوت موى إن أوسيمني\nإمبي كوزموس أوثوت إينانيف\nإمبي آإير.\nانعم على شعبك\nبوحدانية القلب\nأعط طمأنينة للعالم\nوإعتدالًا حسنًا للهواء\n** ثم يكمل الكاهن باوشية من الثلاثة حسب زمانها إما المياه أو الزروع أو الأهوية والثمار وفي ختامها يقول الطلبة الثانية وفي أخر كل ربع يرد الشعب قائلين يا رب إرحم:\n** شفاءًا للمرضي، راحة للمعوزين\n** إطلاقًا للمسبيين، قبولًا للأيتام\n** مساعدة للأرامل، المتضايقون أشبعهم بالخيرات\n** الساقطون أقمهم، القيام ثبتهم\n** الراقدون أذكرهم، المعترفون إقبل إليك إعترافهم\n** الخطاة الذين تابوا عدهم مع مؤمنيك، ومؤمنوك عدهم مع شهدائك\nالذي ههنا إجعلنا متشبهين بملائكتك\nونحن أيضًا المدعوين بنعمتك إلى خدمتك ونحن غتير المستحقين إقبلنا إليك\nيقول الشعب: يا رب إرحم يا رب إرحم يا رب إرحم\nالقداس الغريغوري\nالخولاجي\nخلاص هذا الموضع\nلحن جيه ناى نان / ارحمنا يا الله\n"},{"n":"22- أوشية خلاص هذا الموضع","t":"الكاهن:\nاذكر يا رب خلاص هذا الموضع المقدس الذي لك، وكل المواضع، وكل أديرة آبائنا الأرثوذكسيين.\n** Priest:\n** Remember, O Lord, the salvation of this, Your holy place, and every place, and every monastery of our orthodox fathers.\n** Pi`precbuteroc@\n** Ari`vmeui P=o=c `n`tcwtyria `mpaitopoc =e=;=u `ntak vai@ nem topoc niben@ nem monactyrion niben `nte nenio] `nor;odoxoc.\nالشماس:\nصلوا من أجل خلاص العالم، ومدينتنا هذه، وسائر المدن والأقاليم والجزائر والأديرة.\n** Deacon:\n** Pray for the salvation of the world and of this city of ours and of all cities, districts, islands, and monasteries.\n** Pidiakwn@\n** `Proceuxac;e `uper tyc cwtyriac tou kocmou ke tyc polewc `tmwn tautyc ke twn ,wrwn ke nycwn ke monactyrion.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nوكل مدينة، وكل كورة، والقري وكل زينتها. ونجنا كلنا من الغلاء، والفناء، والزلازل، والغرق، والحريق، وسبي البربر، ومن سيف الغريب، ومن قيام الهراطقة.\n** And every city and every region, and the villages and all their adornments. And save us all from famine, plagues, earthquakes, drawings, fire, the captivity of the barbarians, the sword of the stranger, and the rising up of heretics.\n** Nem polic niben@ nem ,wra niben@ nem ni]mi@ nem poucolcel tyrf. Ouoh nahmen tyren `ebolha ou`hbwn nem oumou@ nemoumonmen@ nem oukataponticmoc@ nem ou`,rwm@ nem oue,malwcia `nte hanbarbaroc nem `ebolha `tcyfi `nte pisemmo@ nem `ebolha `pjintwnf `e`pswi `nte hanheretikoc.\nيقول الكاهن:\n** أذكر يا رب خلاص هذا الموضع المقدس الذي كل وكل المواضع وكل أديرة آبائنا الأرثوذكسين\n** يقول الشماس:\nوكل مدينة وكل إقليم والقري وكل زينتها ونجنا من الغلاء والوباء والزلازل والغرق والحريق وسبي البربر ومن سيف الغريب ومن قيام الهراطقة (بلحن العتيقة).\n** Ari`vmeu`i `P=o=c `n`tcwtyria `mpaitopoc =e=;=u `ntak vai nem topoc niben@ nem monactarion niben `nte nenio] `nor;odoxoc.\nصلوا من اجل خلاص هذا العالم ومدينتنا هذه، وسائر المدن والاقاليم والجزائر والاديرة.\n** Pray for the salvation of the world and of this city of ours, and of all cities, districts, island, and monasteries.\n** `Proceuxac;e `uper tyc cwtyrian tou kocmou ke tyc polewc `ymwn tautyc ke pacwn polewn ke twn ,wrwn ke nycwn ke monactyrion.\nوكل مدينة وكل كورة والقري وكل زينتها. ونجنا كلنا من الغلاء والوباء والزلزال.\n** And every city and every region, and the villages and all their adornments. And save us all from famine, plagues, earthquakes.\n** Nem polic niben@ nem ,wra niben@ nem ni]mi@ nem poucolcel tyrf. Ouoh nahmen tyren `ebol ha ou`hbwn nem oumou nem oumonmen.\nوالغرق والحريق وسبي البربر ومن سيف الغريب ومن قيام الهراطقة.\n** Drowning, fire, captivity by barbarians, the sword of the stranger, and the rising up of heretics.\n** Nem oukatanonticmoc nem ou`,rwm nem oue,malwci`a `nte hanbarbaroc@ nem `ebol ha `tcyfi `nte pisemmo. Nem `ebol ha `pjintwnf `e`pswi `nte hanheretikoc.\nأوشيه الموضع\nأرى إفميفئى إبشويس إن إتسوتيريا إمباى توبوس إثؤواب إنتاك فاى نيم توبوس نيفين نيم مونا ستيريون نيفين إنتى نين يوتى إن أورثوذكسوس\nأذكر يارب خلاص هذا\nالموضع المقدس الذي لك\nوكل المواضع وكل أديرة\nآبائنا الأرثوذكسيين\nإبروس إف إكساستى إيبرتيس سوتيرياس طو كوزمو كى تيس بوليئوس إيمون طافتيس كى باسون بوليئون كى طون خورون كى نيسون كى موناستيريون.\nصلوا من اجل خلاص العالم\nومدينتنا (1) هذه وسائر\nالمدن والأقاليم و\nالجزائر والأديرة\nيقول الشعب\nكيريى إليسون\nيكمل الكاهن\nنيم بولس نيفين نيم خورا نيفين نيم نى تيمى نيم بو سولسيل تيرف أووه ناهمين تيرين إيفول ها أو إهفون نيم او مونيم أو منمين نيم أو كاطا بونتسموس نيم او إكروم نيم أو إخمالوسيا إنتى هان فرفاروس نيم إيفول ها إتسيفى إنتى بى شيممو نيم إيفول ها إيجين طنف إى إبشوى إنتى هان هيريتيكوس.\nوكل مدينة وكل\nكورة والقري وكل\nزينتها ونجنا كلنا\nمن الغلاء والوباء\nوالزلازل والغرق والحريق و\nسبي البربر ومن سيف\nالغريب ومن قيام\nالهراطقة\nوفي العشية يُقال قبلها: أوشية الآباء وبعدها أوشية المياه.\nمجمع القديسين\nالقداس الغريغوري\nالخولاجي\nوحدانيه القب / شفاءا للمرضي\n"},{"n":"23- المجمع للقديسين","t":"الكاهن:\nتفضل يا رب، أن تذكر جميع القديسين الذين أرضوك منذ البدء: آباءنا الاطهار رؤساء الآباء والأنبياء، والرسل والمبشرين و الإنجيليين، والشهداء والمعترفين، وكل أرواح الصديقين، الذين كملوا في الايمان. وبالأكثر القديسة المملوءة مجدا، العذراء كل حين والدة الاله القديسة الطاهرة مريم.\n** Priest:\n** Graciously accord, O Lord, to remember all the saints who have pleased You since the beginning: our holy fathers the patriarchs, the prophets, the apostles, the preachers, the evangelists, the martyrs, the confessors, and all the spirits of the righteous perfected in the faith. Most of all, the pure, full-of-glory, ever-virgin, holy Theotokos, Saint Mary.\n** Pi`precbuteroc@\n** Arikataxioin P=o=c `nteker`vmeui `nny=e=;=u tyrou `etauranak icjen `p`eneh. Nenio] =e=;=u nipatriar,yc ni`provytyc@ ni`apoctoloc nirefhiwis nieuaggelictyc@ nimarturoc@ ni`omologityc nem =p=n=a niben `n`;myi `etaujwk `ebol qen `vnah]. `Nhou`o de ;y=e=;=u e;meh `n`wou etoi `mpar;enoc `ncyou niben@ ];eotokoc =e=;=u ]agia Mari`a.\nوالقديس يوحنا السابق المعمدان والشهيد. والقديس استفانوس أول الشمامسة وأول الشهداء. والقديس مرقس الرسول الطاهر الإنجيلي والشهيد. والبطريرك القديس ساويرس، والقديس كيرلس، والقديس باسيليوس، والقديس اغريغوريوس. وأبانا الصديق العظيم أنبا أنطونيوس، والبار أنبا بولا، والثلاثة أنبا مقارات القديسين، وأبانا أنبا يؤأنس، وأبانا أنبا بيشوي،\nوأبوينا القديسين الروميين مكسيموس ودوماديوس، والتسعة والأربعين شهيدا، والقوي أنبا موسى، وأبانا أنبا باخوم أب الشركة، وأبانا أنبا شنودة رئيس المتوحدين، أبانا أنبا نفر السائح. وأبانا أنبا صمؤئيل المعترف\n** And Saint John the forerunner, Baptist, and martyr; Saint Stephen the archdeacon and protomartyr. Saint Mark, the holy apostle. Evangelist, and martyr; The patriarch Saint Severus; Saint Cyril; Saint Basil; Saint Gregory. our righteous father, the great Abba Anthony; the righteous Abba Paul; the three saints Abba Macarii our father Abba John;our father Abba Pishoy, our holy the Roman fathers Saints Maximus and Dometius; the Forty-nine Martyrs; the strong Abba Moses; our father Abba Pachom, the father of the Koinonia, our father Abba Shenoute the archimandrite, our father Abba Nopher the anchorite; and our father Abba Samuel the confessor.\n** Nem pi`agioc Iwannyc pi`prodromoc `mbaptictyc ouoh `mmarturoc. Nem pi`agioc `Ctevanoc pi`ar,idiakonoc ouoh `mprwtomarturoc. Nem pi`agioc Markoc pi`apoctoloc =e=;=u `neuaggelictyc ouoh `mmarturoc. Nem pipatriar,yc =e=;=u Ceuyroc@ nem pi`agioc Kurilloc nem pi`agioc Bacilioc@ nem pi`agioc Grygorioc. Nem peniwt `ndikeoc pinis] abba Antwni@ nem pi`;myi abba Paule@nem pisomt =e=;=u abba Makari. Nem peniwt abba I=w=anem peniwt abba Piswi@ nem nenio] =e=;=u `nrwmeoc Maximoc nem Dometioc@ nem pi`hme 'it `mmarturoc nem pijwri abba Mwcy. Nem Peniwt abba Paqwm `viwt `n]koinwnia@ nem peniwt abba Sepou] piar,iman`dritycnem peniwt abba Noufer pi`ana,writyc@ nem peniwt abba Camouyl pi`omologityc.\nوابانا انبا ابرآم، اسقف الفيوم والجيزة. وكل مصاف قديسيك، هؤلاء الذين بسؤالاتهم وطلباتهم، ارحمنا كلنا معا. وانقذنا من أجل اسمك القدوس الذي دعي علينا.\n** And Abba Abraam the Bishop of Fayom and Giza. And all the choir of Your saints, through whose prayers and supplications have mercy on us all and save us, for the sake of Your holy name, which is called upon us.\n** Nem peniwt =e=;=u Abba Abraam@ pi`epickopoc `nte Viom nem Jiza. Nem `n,oroc tyrf `nte ny=e=;=u `ntak@ nai `ete ebol hiten nou]ho nem noutwbh nai nan tyrou eucop@ ouoh matoujon e;be pekran `e;ouab `etaumou] `mmof `e`hryi `ejwn.\nيقول الكاهن مجمع الآباء القديسين\n(تفضل يا رب أن تذكر جميع القديسين الذين أرضوك منذ البدء آباءنا القديسين رؤساء الآباء والأنبياء والرسل والمبشرين والإنجيليين والشهداء والمعترفين وكل أرواح الصديقين الذين كملوا في الإيمان وبالأكثر القديسة المملوءة مجدًا العذراء كل حين والدة الإله القديسة الطاهرة مريم والقديس يوحنا السابق المعمدان والشهيد والقديس إستيفانوس رئيس الشمامسة واول الشهداء والقديس مرقس الرسول الطاهر الإنجيلي والشهيد والبطريرك القديس ساويرس والقديس كيرلس والقديس باسيليوس والقديس إغريغوريوس وأبانا الصديق العظيم أنبا أنطونيوس والبار انبا بولا والثلاثة أنبا مقارات القديسين وأبانا أنبا يحنس وأبانا أنبا بيشوي وأبوانا القديسان الروميان مكسيموس ودماديوس والتسعة والأربعون شهيدًا والقوي القديس أنبا موسي والقديس إيسيذوروس وأبانا أنبا باخوم أب الشركة وأبانا انبا شنودة رئيس المتوحدين وأبانا انبا نفر السائح وأبانا أنبا صموئيل المعترف وكل مصاف قديسيك هؤلاء الذين بسؤالاتهم وطلباتهم إرحمنا كلنا معًا وانقذنا من أجل إسمك القدوس الذي دعي علينا.\nالقارئون فليقولوا (ترحيم)\nالقداس الغريغوري\nالخولاجي\nخلاص هذا الموضع\n"},{"n":"24- القارئون فليقولوا (الترحيم)","t":"الشماس:\nالقارئون فليقولوا أسماء آبائنا البطاركة القديسين الذين رقدوا. الرب ينيح نفوسهم أجمعين، ويغفر لنا خطايانا.\n** Deacon:\n** Let those who read, recite the names of our Holy Fathers, the patriarchs who have fallen asleep: O Lord, repose their souls and forgive us our sins.\n** Pidiakwn@\n** Nyetws maroutaou`o `nniran@ `nte nenio] =e=;=u `mpatria,yc etauenkot@ P=o=c ma`mton `nnou`'u,y tyrou@ ouoh `ntef,a nennobi nan `ebol.\n** (The priest may pray the the Prayer for the Departed and than the people may chant 'The great Abba Anthony', or just continue with:)\nالشعب:\nبركتهم المقدسة تكون معنا. آمين.\n** People:\n** May their Holy blessings be with us. Amen.\n** Pilaoc@\n** Ere pou`cmou =e=;=u swpi neman@ amyn.\nالمجد لك يارب، يارب لك المجد. يارب ارحم. يارب ارحم. يارب باركنا. يارب نيحهم. آمين.\n** Glory to You, O Lord. Lord have mercy. Lord have mercy. Lord, bless us. Lord, repose them. Amen.\n** Doxa ci Kurie@ Kurie `ele`ycon Kurie `ele`ycon@ Kurie eulogycon@ Kurie `anapaucon@ `amyn.\nالكاهن:\nوهؤلاء وكل أحد، يارب، الذين ذكرنا أسماءهم، والذين لم نذكرهم الذين في فكر كل واحد منا، والذين ليسوا فينا. الذين رقدوا وتنيحوا في الايمان بالمسيح. تفضل يارب اذكر نفوس عبيدك ...\n** Priest:\n** Those, O Lord, and everyone whose names we have mentioned; and those whose names we have not mentioned, those whom each one has in mind and those who are not in our minds; and those who have fallen asleep and reposed in the faith of Christ. Graciously, O Lord, repose the soul of Your servants (departed name(s))\n** Pi`precbuteroc@\n** Ouoh nai nem ouon niben P=o=c ny`etantaou`e nouran@ nem ny`ete `mpentaou`wou. Nyetqen `vmeu`i `mpiouai piouai `mmon@ nem ny`ete `nqyten an. Etauenkot au`mton `mmwou qen `vnah] `mP=,=c.\nتفضل يارب نيح نفوسهم جميعا في حضن آبائنا القديسين، ابراهيم وإسحق ويعقوب. عُلهُم في موضعِ خضرة، علي ماءِ الراحةِ في فردوسِ النعيمِ الموضع الذي هرب منه الحزنُ و الكآبةُ والتنهدُ في نوِر قديسيك.\n** Graciously, O Lord, repose all their souls in the bosom of our Holy fathers, Abraham, Isaac and Jacob, sustain them in a green pasture, by the water of rest in the paradise of joy, the place out of which grief, sorrow and groaning have fled away, in the light of Your saints.\n** Arikataxion P=o==c ma`mton `nnou'u,y tyrou qen kenf `nnenio] =e=;=u Abraam nem Icaak nem Iakwb. Sanousou qen ouma `n`,loy@ hijen `vmwou `nte `pemton@ qen piparadicoc `nte `pounof. Pima `etafvwt `ebol `nqytf `nje pi`mkah `nhyt nem ]lupy nem pifi`ahom@ qen `vouwini `nte ny =e=;=u `ntak.\nاطلبوا عن آبائنا وإخوتنا الذين رقدوا، وتنيحوا في الإيمان بالمسيح منذ البدء. آبائنا القديسين رؤساء الأساقفة، وآبائنا الأساقفة، وآبائنا القمامصة، وآبائنا القسوس وإخوتنا الشمامسة، وآبائنا الرهبان، وآبائنا العلمانيين، وعن نياح كل المسيحيين. لكي المسيح إلهنا ينيح نفوسهم أجمعين في فردوس النعيم، ونحن أيضاً يصنع معنا رحمةً، ويغفر لنا خطايانا.\n** Pray for our fathers and brethren who have fallen asleep and reposed in the faith of Christ since the beginning; our holy fathers, the archbishops, our fathers the bishops, our fathers the hegumens, our fathers the priests, our brethren the deacons, our fathers the monks, and our fathers the laymen, and for the full repose of Christians, that Christ our God may repose all their souls in the paradise of joy, and we too, accord mercy unto us, and forgive us our sins.\n** Twbh ejen nenio] nem nencnyou `etauenkot au`mton `mmwou qen `vnah] mPi`,rictoc icjen `p`eneh@ nenio] `e;ouab nar,y`epickopoc ke nenio] `n`epickopoc@ nenio] `nhygoumenoc ke nenio] `m`precbuteroc nem nen`cnyou `ndi`akwn@ nenio] `mmona,oc@ ke nenio] `nla`ikoc@ nem `ehryi ejen ]anapaucic tyrc `nte ni`,ricti`anoc@ hina `nte P=,=c Pennou] ]`mton `nnou'u,y tyrou qen piparadicoc `nte `pounof@ `anon de hwn `ntefer pinai neman@ `ntef,a nennobi nan `ebol.\nالشعب:\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nيقول الشماس\n(القارئون فليقولوا اسماء آباءنا البطاركة القديسين الذين رقدوا الرب ينيح نفسوهم أجمعين ويغفر لنا خطايانا)\nثم يضع الكاهن يد بخور وهو يقول سرًا:\n(أذكر يا رب أباءنا وأخوتنا الذين سبق رقادهم في الإيمان الأرثوذكسي نيحهم جميعهم مع قديسيك مع هؤلاء الذين نذكر أسمائهم)\nثم يقول الترحيم ويذكر أسماء الراقدين وإذا أراد الشمامسة فليقولوا ترحيم الآباء البطاركة السالفين.\nبصلوات و شفاعات / لحن افتشى كى\nالقداس الغريغوري\nالخولاجي\nمجمع القديسين\n"},{"n":"25- لحن افشي كي ابريسفياس / بصلوات","t":"بصلوات وشفاعات ذات كل قداسة، الممجدة الطاهرة المباركة سيدتنا والدة الإله الدائمة البتولية مريم.\n** Through the prayers and intercessions, of the all-holy, glorified, pure and blessed one, our lady the Mother of God, the ever-Virgin Mary.\n** Eu,ec ke `precbiec@ tyc pan`agiac `uperen doxou@ a,rantou `uper`eulogymenyc@ decpinyc `ymwn@ :e`otokou ke `a`iPar;enou Mariac.\n** Evshes ke epres-veies, tees pan-ageias e-peren zoxo, akranto e-per-evlogi-menees, zesbenis e-mon, Theotoko ke a-e-Partheno Mareias.\nوالقديس النبي السابق المعمدان الشهيد يوحنا.\n** And the holy prophet, forerunner and baptizer, John the martyr.\n** Ke to `agiou `provytou@ ke `prodromou baptictou@ ke marturoc Iwannou.\n** Ke to ageio eprofeto, ke eproz-romo vab-tis-to, ke marteros Yoanno.\nوالقديس إستفانوس رئيس الشمامسة وأول الشهداء.\n** And St. Stephen, the head of deacons, and first martyr.\n** Ke to ageio Estefano, to arshe-zeyakono, ke eproto marteros.\n** Ke to `agio `Ctevanou@ tou ar,ydiakonou@ ke `prwto marturoc.\nوالقديسين الرسل الممجدين والأنبياء والحسني الظفر الشهداء وكل مصاف القديسين.\n** And the holy and glorified Apostles, and the prophets, and the (victorious) martyrs, and all the choirs of the saints.\n** Ke twn `agiwn@ `apoctolwn endoxwn@ `provytwn@ ke kallinikwn@ marturwn ke pantwn twn ,orwn twn `agiwn cou.\n** Ke ton ageion apostolon, en-zoxon epro-feton, ke-kalinikon, marteron ke panton ton, khoron ton agion so.\nأنبا (...) السيد رئيس أساقفة المدينة العظمي الاسكندرية، وأساقفتنا الأرثوذكسيين، المشكورين، ومن أجل الراقدين ونياحتهم وآبائنا القديسين.\n** Abba (...) the lord, the archbishop of the city of Alexandria, and the appreciated Orthodox Bishops, for the sake of the departed and their departure, and our fathers the saints.\n** Abba (...) kuriou@ tou `ar,y`epickopou@ tyc megalo polewc Alexan`driac@ ke twn Or;odoxwn `ymwn `epickopwn twn eu,arictyriwn@ ke `upergumnecewc ke `anapaucewc@ ke twn `agiwn paterwn `ymwn.\n** Avva (...) kereyo, to arshe-episkopos, tees-megalo poleos, Alexan-edrias, ke ton Orthozoxon e-mon episkopo ton evkha-resti-reion, ke e-per-ghemne-seos, ke a-na-pav-seos, ke ton ageion, pateron e-mon.\nالأول، القديس مرقس الرسول الإنجيلي ورئيس الأساقفة والشهيد.\n** First, Saint Mark the Apostle, the evangelist, the archbishop, and martyr.\n** Ouai (=a) Markou tou `agiou `apoctolou@ eu`aggelictou@ `ar,i`epickopou ke marturoc.\n** Owai Marko to ageio apostolo, ev-angelos, arshe-episkopo ke mar-teros.\nوجميع الذين علموا كلمة الحق باستقامة، الأساقفة الارثوذكسيين والقسوس والإكليروس والعلمانيون. هؤلاء وجميع الارثوذكسيين. آمين.\n** And all those who have rightly taught the word of truth: the Orthodox bishops, priests, deacons, clergy, laity, and all the Orthodox people. Amen.\n** Ke pantwn twn or;odidaxantwn@ ton logon@ tyc `aly;iac@ Or;odoxwn@ `epickopwn `precbuterwn@ diakonwn `klyrikwn ky laikwn ke toutwn ke pantwn@ Or;odoxwn@ `amyn.\n** Ke panton ton ortho-zizaxanton, ton loghon, tees alithias, Orthozoxon, epis-kopon ep-resvi-teron, zeia-konon ekli-rekon ke laikon ke to-ton ke pan-ton, Orthozoxon, amen.\nإفشيس كي إبريسفياس تيس بان آجياس إيبيرين ذو كسو أكرانطو إيبير إفلو جيمينيس ذيس بينيس إيمون ثيئوتوكوكي آإى بارثينو مارياس. كيتو آجيو إبروفيتوكي إبروذروموفا بتيستوكي مارتيروس يوأنو كيتو آجيو إستيفانوتو أرشي ذياكونو كي إبروتو مارتيروس كيتون آجيون إبوسطولون إنذوكسون إبروفيتون كي كاللينيكون مارتيرون كي بانطون طون خورون طون آجيون سو. آفا (...) كيريوتو أرشي إبسكوبو تيس ميغالوبوليئوس أليكسندرياس كيتون اورثوذكسون إيمون إبيسكوبون تو إفخارستيريون كي إيبير غيمنيسيءوس كي ىنا بافسيئوس كيتو آجيون باتيرون إيمون أواي ماركو تو آجيو أبوسطولو إيف أنجيليستو أرشي إبيسكوبوكي مارتيروس.\nبصلوات وشفاعات ذات كل\nقداسة الممجدة الطاهرة\nالمباركة سيدتنا والدة الإله\nالدائمة البتولية مريم\nوالقديس النبي السابق\nالمعمدان الشيهد يوحنا\nوالقديس إستفانوس رئيس\nالشمامسة وأول الشهداء\nوالقديسين الرسل الممجدين\nوالأنبياء والحسني الظفر\nالشهداء وكل مصاف\nالقديسين أنبا (...)\nرئيس أساقفة المدينة العظمي\nالأسكندرية وأساقفتنا\nالأرثوذكسيين المشكورين ومن\nأجل الراقدين ونياحتهم\nوآبائنا القديسين القديس\nمرقس الرسول الإنجيلي\nرئيس الأساقفة الشهيد\nالقداس الغريغوري\nالخولاجي\nإذكر يا رب / رى افمفئى\nالقارئون فليقولوا (ترحيم)\n"},{"n":"26- اذكر يا رب / ري افمفئي","t":"الكاهن:\nأذكر يا رب الآخرين الذين ذكرناهم المؤمنين، وأيضاً الذين لم نذكرهم الأرثوذوكسيين. هؤلاء ونحن معهم، يا الله كصالح ومحب للبشر.\n** Priest:\n** Remember, O Lord, the others; those whom we have remembered, the faithful, and those whom we have not remembered, the orthodox- them and us- as a Good One and Lover of Mankind, O God.\n** Pi`precbuteroc@\n** Ari`vmeu`i P=o=c `nnike,wouni@ `etanerpoumeu`i `mpictoc@ nem ny on `ete `mpenerpoumeu`i `nor;odoxoc. Nai `ete `anon nemwou hwc `aga;oc ouoh `mmairwmi V].\nثم يرد الشعب قائلين (بركتهم المقدسة فلتكن معنا آمين المجد لك يا رب يا رب ارحم يا رب إرحم يا رب باركنا يا رب نيحهم أمين) ثم يقول الكاهن بصوت مرتفع ويداه مرتفعتان إلى فوق\nري إفميفئي إبشويس إن ني كيكوؤوني إيتان إيربوميفئي إم بيستوس نيم نيئون إيتي إمبين إيربو ميفئي إن اورثوذكسوس ناي إيتي آنون نيموؤو هوس آغاثوس أووه إم ماى رومي إفنوتي.\nأذكر يا رب المؤمنين\nالآخرين الذين ذكرناهم\nوأيضًا الأرثوذكسين الذين\nلم نذكرهم اذكرنا نحن\nوهم يا الله كصالح\nومحب البشر\nحل واغفر / فول أيفول\nالقداس الغريغوري\nالخولاجي\nبصلوات و شفاعات / لحن افتشى كى\n"},{"n":"27- حل و اغفر / فول إيفول كو ايفول","t":"حل و أغفر و إصفح لنا يا الله عن ذلاتنا التي صنعناها بإرادتنا و التي صنعناها بغير إرادتنا والتي فعلناها بمعرفة و التي فعلناها بغير بمعرفة. الخفية و الظاهرة يا رب اغفر لنا.\n** Loose, remit, and forgive us, O God, our iniquities which we have committed willingly and which we have committed unwillingly, which we have committed knowingly and which we have committed unknowingly; the hidden and the manifest, O Lord, remit for us.\n** Bol `ebol@ ,w `ebol@ `aricun,wrin nan V] `nnenparaptwma@ ny`etanaitou qen\n** penouws nem ny`etanaitou qen penouws an@ ny`etanaitou qen ou`emi nem ny`etanaitou qen oumetat`emi@ nyethyp nem ny`e;ouwnh `ebol@ P[oic ek`e,au nan `ebol.\nالكاهن:\nلأنك أنت هو الله الرحوم الذي لا يشاء موت الخاطئ مثل ما يرجع ويحيا.\n** Priest:\n** For You are God the Merciful, who desire not the death of a sinner, but rather that he returns and lives.\n** Pi`precbuteroc@\n** `N;ok gar pe V] pinayt@ vye;ouws `m`vmou an `mpirefernobi `m`vry] `ntefkotf ouoh `ntefwnq.\nردَّنا يا الله إلي خلاصك، وأصنع معنا كصلاحك، يا من يصنع أكثر مما نسأل أو نفهم.\n** Restore us, O God, to Your salvation. Deal with us according to Your goodness, O You who do more than we ask or understand.\n** Matac;on V] `eqoun `epekoujai@ `arioui neman kata tekmet`aga;oc@ vyet`iri `mpihou`o `eny`eten`eretin `mmwou@ ie ny`etenka] `erwou.\nالشعب:\nكما كان وهكذا يكون، من جيل إلي جيل، وإلي دهر الدهور. آمين.\n** People:\n** As it was so shall it be, from generation to generation, and unto all the ages of the ages. Amen.\n** Pilaoc@\n** Wcper yn ke ecte ectin `apo geneac ic genean ke pantac touc `e`wnac twn `e`wnwn@ `amyn.\nيقول الشعب:\nفول إيفول كو إيفول\nأريسين خورين نان إفنوتي\nإن نين بارابطوما: ني إيتان\nآيتو خين بين أواوش نيم ني إيتان\nآيتو خين بين أوأوش أن. ني إيتان\nآيتو خين أو إيمي نيم ني إيتان\nآيتو خين أو ميت آتئيمي ني إتهيب\nنيم ني إثؤو أونه إيفول إبشويس\nإيك إيكاف نان إيفول.\nحل وأغفر واصفح لنا\nيا الله عن زلاتنا\nالتي صنعناها بإرادتنا\nوالتي صنعناها بغير\nإرادتنا التي فعلناها\nبمعرفة والتي\nفعلناها بغير\nمعرفة، الخفية والظاهرة، يا رب اغفرها لنا.\nيقول الكاهن:\nإنثوك غاربي إفنوتي بي نائيت في إثؤو أوشي إم إفمو آن إم بي ريفئير نوفي إم إفريتي إنتيف كوتف أووه إنتيف اونخ ماطاستون إفنوتي إيخون إيبك أوجاي. آري اوى نيمان كاطاتيك ميت آغاثوس فيئيت إيري إم بي هوؤو إي نيئيتين إريتين إم موؤويى نيئيتين كاتي إيروؤو.\nلأنك أنت هو الله الرحوم\nالذي لا يشاء موت الخاطئ\nمثل ما يرجع ويحيا\nردنا يا الله\nإلى خلاصك واصنع\nمعنا كصلاحك\nيا من يصنع أكثر مما\nنسأل أو نفهم.\nلكى بهذا / هينا نيم خين\nالقداس الغريغوري\nالخولاجي\nإذكر يا رب / رى افمفئى\n"},{"n":"28- لكي بهذا / هينا نيم خين فاي","t":"الكاهن:\nكي بهذا كما أيضا في كل شئ، يتمجد ويتبارك، ويرتفع اسمك العظيم القدوس، في كل شئ كريم ومبارك، مع أبيك الصالح والروح القدس.\n** Priest:\n** That as in this, so also in all things, Your Great and holy name be glorified blessed and exalted in everything, honored and blessed with Your good Father and the Holy Spirit.\n** Pi`precbuteroc@\n** Hina nem qen vai kata `vry] on qen hwb niben `ntef[i`wou ouoh `ntef[i`cmou ouoh `ntef[ici@ `nje peknis] `nran =e=;=u@ qen hwb niben ettaiyout ouoh et`cmarwout@ nem Pekiwt `n`aga;oc@ nem pi`Pneuma =e=;=u.\nالسلام للكل.\n** Peace be with all.\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nيقول الكاهن:\nهينا نيم خين فاى كاطا إفريتي اون خين هوب نيفين غنتيف تشي اوأو أووه إنتيف تشي إزمو أووه إنتيف تشيسي إنجي بيك نشتي إنران إثؤواب خين هوب نيفين إتطايوت أووه إت إزماروؤوت نيم بيك يوت إن آغاثوس نيم بي إبنيفما لإثؤواب. إيريني باسي.\nلكي بهذا كما أيضا\nفي كل شئ يتمجد\nويتبارك ويرتفع\nإسمك العظيم القدوس\nفي كل شيء كريم\nومبارك مع يسوع\nالمسيح إبنك الحبيب\nوالروح القدس السلام للكل\nيقول الشعب:\nكيطو إبنيفماتي سو\nمقدمه القسمه المقدسة\nالقداس الغريغوري\nالخولاجي\nحل واغفر / فول أيفول\n"},{"n":"29- مقدمة القسمة","t":"الكاهن:\nيا سيدنا ومخلصنا محب البشر الصالح محيي أنفسنا. يا الله الذي أسلم ذاته عنا خلاصاً من أجل خطايانا.\n** Priest:\n** O our Master and our Savior, the Good One and Lover of Mankind, Life-giver to our souls, God who gave Himself up for our salvation from sin.\n** Pi`precbuteroc@\n** Pennyb pen=c=w=r@ pimairwmi `n`aga;oc@ pireftanqo `nte nen'u,y. V] vy`etaftyif `mmin `mmof `ncw] qaron e;be nennobi.\nالذي بكثرة رحمتهِ حلَّ عداوة البشر. أيها الإله الوحيد الجنس الذي في حضن أبيه.\n** Who through the multitude of His mercies have loosed the enmity of mankind, the only-begotten God who are in the bosom of His Father,\n** Vy`ete `ebolhiten `p`asai `nte pefnai@ afbwl `ebol `n]metjaji `nte nirwmi. Pimonogenyc `nnou]@ vyet,y qen kenf `mPefiwt.\nيا رب بارك.\n** O Lord, bless.\n** Kurie eulogycon.\nالشعب:\nآمين.\n** People:\n** Amen.\n** Pilaoc@\n** Amyn.\nيقول الكاهن مقدمة القسمة:\nبيننيب بيسنو تيربي ماى رومي إن آغاثوس. بي ريف تانخو إنتي نين إبسيشي إفنوتي فيئيتافتيف إم مين إمموف إنسوتي خارون إثقي نيننوفي. فيئيتي إيفول هيتين إب آشاى إنتي بيف ناي أف فول أيقول إنتي ميتجاجي غنتي ني رومي بي مونوجينيس أن نوتي فيئتكي خين كينف إم بيفيوت كيريي أفلوجيصون.\nيا سيدنا ومخلصنا محب\nالبشر الصالح محيي أنفسنا\nيا الله الذي أسلم ذاته\nعنا خلاصًا\nمن أجل خطايانا\nالذي بكثرة رحمته\nحل عداو البشر\nأيها الإله الوحيد الجنس\nالذي في حضن أبيه\nيقول الشعب: آمين\nلكى بهذا / هينا نيم خين\nيا من بارك في ذلك الزمان / فيئيطاف\nالقداس الغريغوري\nالخولاجي\n"},{"n":"30- يا من بارك / فيئيطاف","t":"الكاهن:\nيا الذي بارك في ذلك الزمان، الآن أيضاً بارك.\n** Priest:\n** O You who did bless at that time, now also bless.\n** Pi`precbuteroc@\n** Vy`etaf`cmou `mpicyou@ ]nou on `cmou.\nالشعب:\nآمين.\n** People:\n** Amen.\n** Pilaoc@\n** Amyn.\nيا الذي قدَّس في ذلك الزمان، الآن أيضاً قدَّس.\n** O You who did sanctify at that time, now also sanctify.\n** Vy`etafer`agiazin `mpicyou@ ]nou on `ari`agiazin.\nيا الذي قسَّم في ذلك الزمان، الآن أيضاً قسَّم.\n** O You who did break at that time, now also break.\n** Vy`etafvws `mpicyou@ ]nou on vws.\nيا الذي أعطي تلاميذه القديسين، ورسله الأطهار في ذلك الزمان، الآن أيضاً يا سيدنا أعطنا وكل شعبك، يا ضابط الكل أيها الرب إلهنا.\n** O You who gave to His holy disciples and saintly apostles at that time, now also give to us and to all Your people, O our Master, the Pantocrator, the Lord our God.\n** Vy`etaf] `etotou `nnef`agioc `mma;ytyc ouoh `n`apoctoloc =e=;=u `mpicyou. }nou on pennyb moi nan nem peklaoc tyrf@ pipantokratwr P=o=c pennou].\nالشماس:\nآمين آمين صلوا.\n** Deacon
