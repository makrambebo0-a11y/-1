روس نيم بي بطريارشيس إثؤواب سيقيروس نيم بينساخ ديوسكورس نيم بي آجيوس اثناسيوس بي آبوسطوليكوس نيم بي آجيوس بيترس يبرومارتيروس بي أرشي إرفس نيم بي آجيوس يوأنس بي إخرزوستوموس نيم بي آجيوس ثيئودوسيوس نيم بي آجيوس ثيئوفيلوس نيم بي آجيوس ديمتريوس نيم لي آجيوس كيرلس نيم بي آجيوس فاسيليوس نيم بي آجيوس أغريغوريوس بي ثيئولوغوس نيم بي آجيوس إغريغوريوس بيثاق ماطورغوس نيم بي آجيوس إغريغوريوس بي أرمينيوس نيم بي شمت شي ميت إشمين إيطاف ثوؤوتي خين نيكيئا نيم بي شي تيقي إنتي كوسطانطينوبوليس نيم بي إسناق شي إنتي إيفيسوس. نيم بينيوت إن ذيكيئوس بينشتي آقا أنطونيوس\nنيم بي إثمي آقا باقلي.\nنيم بي شومت إثؤواب آقا مكاري\nنيم نوشيري\nتيرو إن إسطاقروفورس. نيم بينيوت آقا يؤانس بي هيغومينوس نيم بينوت\nآقا بيشوي بي إثمي بي رومي\nإنتي ليوس بي مينريت إنتي بين سوتير إن آغاثوس.\nلأن هذا يا رب هو أمر\nإبنك الوحيد ان نشترك\nفي تذكار\nقديسيك تفضل\nيا رب أن تذكر\nجميع القديسين الذين\nأرضوك منذ البدء\nآبائنا القديسن رؤساء\nالآباء والأنبياء والرسل\nوالمبشرين والإنجيليين\nوالشهداء والمعترفين وكل\nأرواح الصديقين الذين\nكملوا في الإيمان وبالأكثر\nالقديسة المملوءة مجدًا\nالعذراء كل حين\nوالدة الإله القديسة\nالطاهرة مريم التي ولدت\nالله الكلمة بالحقيقة\nوالقديس يوحنا السابق الصابغ\nوالشهيد والقديس\nإستيفانوس رئيس الشمامسة\nواول الشهداء وناظر\nالإله الإنجيلي مرقس\nالرسول الطاهر\nوالشهيد والبطريرك القديس\nساويرس ومعلمنا\nديوسقوروس والقديس\nأثناسيوس الرسولي\nوالقديس بطرس\nخاتم الشهداء ورئيس\nالكهنة والقديس يوحنا\nذهبي الفم والقديس ثيئودوسيوس\nوالقديس ثيئوفيلوس\nوالقديس ديمتريوس والقديس\nكيرلس والقديس باسيليوس والقديس إغريغوريوس\nالناطق بالإلهيات والقديس\nإغريغوريوس الصانع العجائب\nوالقديس إغريغوريوس الآرمني\nوالثلاثمائة والثمانية عشر المجتمعون\nبنيقية والمائة والخمسون\nبالقسطنطينية والمائتان بأفسس\nوأبانا الصديق العظيم أنبا أنطونيوس\nوالبار انبا بولا والثلاثة\nأنبا مقارات القديسون\nوجميع اولادهم لباس الصليب وأبونا\nأنبا بيشوي البار\nالرجل الكامل حبيب\nمخلصنا الصالح\nوإذا أراد الكاهن فليكمل قائلًا:\nنيم بينيوت آقا باقلي بيريم\nطموه نيم إيزاكيئيل بيف\nماثيتيس نيم ناشويس إنيوتي\nإثؤواب إنروميئوس مكسيموس\nنيم دوميتيوس نيم بي إهمي إبيسيت\nإم مارتيروسنيخللوي إنتي شيهيت\nنيم بي جوري إثؤواب آقا موسي.\nنيم يوانس كامي بي إبريسقيتيروس\nنيم بينيوت أقا دانيئيل بيهيغومينوس\nنيم بينيوت آقا إيسيذوروس\nبي إبريسقيتيروس نيم بينيوت آقا\nشينوتي بي أرشي مان إذريتيس\nنيم آقا فيصابيف ماثيتيس نيم بينيوت\nآقا آقرام بي إبسكوبو إنتي إفيوم\nنيم إبخوروس تيرف إنتي نيئؤواب\nإنطاك ناي إيتي إيقول هيتين\nنو تيهو\nنيم طقه ناي نان تيرو إقسوب\nأووه ماطوجون إثقي بيكران\nإثؤواب إيطاق موتي إمموف\nإي إهري إيجون.\nوأبونا أنبا بولا الطموهي و\nحزقيال تلميذه وسيداي الأبوان\nالقديسان الروميان مكسيموس\nودوماديوس والتسعة\nوالأربعون شهيدا شيوخ\nشيهيت والقوي القديس\nأنبا موسي ويحنس كاما\nالقس وأبونا أنبا دانيال\nالقمص وأبونا أنبا أيسيذوروس\nالقس وأبونا أنبا باخوم أب\nالشركة وتادرس تلميذه\nوأبونا أنبا شنودة رئيس\nالمتوحدين وانبا ويصا\nتلميذه والقديس انبا أبرام\nأسقف الفيوم وكل\nمصاف قديسيك هؤلاء\nالذين بسؤالاتهم و\nطلباتهم إرحمنا كلنا\nمعًا وانقذنا من أجل\nإسمك القدوس الذي\nدعي علينا\nالقارئون فليقولوا (تراحيم)\nالقداس الباسيلي\nالخولاجي\nأوشية القرابين\n"},{"n":"47- القارئون / التراحيم","t":"الشماس:\nالقارئون فليقولوا أسماء آبائنا البطاركة القديسين الذين رقدوا. الرب ينيح نفوسهم أجمعين، ويغفر لنا خطايانا.\n** Deacon:\n** Let those who read, recite the names of our holy fathers, the patriarchs who have fallen asleep: O Lord, repose their souls and forgive us our sins.\n** Pidiakwn@\n** Nyetws maroutaou`o `nniran@ `nte nenio] =e=;=u `mpatria,yc etauenkot@ P=o=c ma`mton `nnou`'u,y tyrou@ ouoh `ntef,a nennobi nan `ebol.\nيقول الشماس:\nنيئتئوش ماروطاؤؤو إن ني ران إنتي نينيوتي إثؤواب إمباطريارشيس إيطاق إنكوت إبشويس ما إمطون إن نؤ إبسيشي تيرو أووه إنتيف كانين نوقي نان إيقول.\nالقارئون فليقولوا إسماء\nآبائنا البطاركة القديسين\nالذين رقدوا الرب ينيح\nنفوسهم أجميعن ويغفر\nلنا خطايانا\nثم إذا أراد الكاهن فليقل هذا الترحيم من قداس القديس كيرلس باللحن المعروف\nالترحيم:\nأووه ناي نيم أوؤن نيقين إبشويس: ني إيطان طا أو إي نوران نيم ني إيتي إمبين طاؤو أوأوني إتخين إفميقئي إمبي أوواي بي أوواي إممون نيم ني إيتي إتخيتين آن إيطاق إنكوت آق إمطون إم موؤخين إفناهتي إم بي إخرستوس.\nوهؤلاء وكل أحد يارب\nالذين ذكرنا أسماؤهم و\nالذين لم نذكرهم الذين في\nفكر كل واحد منا والذين\nليسوا في فكرنا الذي رقدوا\nوتنيحوا في الإيمان\nبالمسيح\nثم يضع بخورًا في المجمرة ويقول سرًا:\nآري إفميقئي إبشويس إن إت إبسيشي إم بيك قوك (...).\nأذكر يا رب نفسي\nعبدك (...)\nلحن بى نشتى / العظيم انبا انطونيوس\nالقداس الباسيلي\nالخولاجي\nمجمع القديسين\n"},{"n":"48- لحن بي نشتي / العظيم","t":"بي نيشتي آقا أنطوني، نيم بي إثمي أقا باقلي، نيم بي شمت إثؤواب مكاريوس، آقا يؤانس بي كولوقوس، أقا بيشوي أقا باقلي، نين يوتي إثواب إنروميوس، ماكسيموس نيم دوميتيوس، أقا موسي، أقا يؤانس كامي، أقا دانييل، أقا اسي ذوروس أقا باخوم، أقا شينوتي، كي أقا بفنوتي، أقا برسوما، أقا تيجي.\nالعظيم أنبا أنطونيوس، والبار أنبا بولا، والقديسون الثلاثة مقارات، أنبا يؤنس القصير، أنبا بيشوي، أنبا بولا، أبوانا القديسان الروميان مكسيموس ودوماديوس، أنبا موسى، أنبا يؤانس كاما، أنبا دانيال، أنبا ايسيذوروس، أنبا باخوم، أنبا شنودة، وأنبا بفنوتى، أنبا برسوم، أنبا رويس.\n** The great Abba Anthony, and the righteous Abba Paul, the three saints Abba Macarii, Abba John the short, Abba Pishoy, Abba Paul, our holy Roman fathers Maximus and Dometius, Abba Moses, Abba John Kame, Abba Daniel, Abba Isidore, Abba Pachom, Abba Shenoute and Abba Paphnoute, Abba Parsoma, Abba Teji.\n** Pinis] abba Antwni@ nem pi`;myi abba Paule@ nem pisomt =e=;=u Makarioc@ abba Iwannyc pikoloboc@ abba Piswi@ abba Paule@ nenio] =e=;=u `nrwmeoc Maximoc nem Dometioc@ abba Mwcy@ abba Iwannyc <amy@ abba Daniyl@ abba Icidwroc@ abba Paqwm@ abba Senou]@ ke abba Pavnou]@ abba Parcwma@ abba Teji.\n** Pinishti avva Antoni, nem pi-esme avva Pavle, nem pi-shomt ethowab Makareios, avva Yoannes pi-kolobos, avva Pishoy, avva Pavle, nenyoti ethowab en-romeos Maximos nem Dometios, avva Mosee, avva Yoannes Kame, avva Daniel, avva Esezoros, avva Pakhom, avva Shenouti, ke avva Paphnouti, avva Parsoma, avva Teji.\nوجميع الذين علموا كلمة الحق باستقامة، الأساقفة الارثوذكسيين والقسوس والإكليروس والعلمانيون. هؤلاء وجميع الارثوذكسيين. آمين.\nكي بأنطون طون، أورثوذيذاكسان طون، طون لوغون، تيبس آليثياس، أورثوذكسون، إبيسكوبون إبريسقيتيرون، ذياكونون إكليريكون كي لائكون كي طوطون كي بانطون، اورثوذوكسون أمين.\n** And all those who have rightly taught the word of truth: the Orthodox bishops, priests, deacons, clergy, laity, and all the Orthodox people. Amen.\n** Ke pantwn twn or;odidaxantwn@ ton logon@ tyc `aly;iac@ Or;odoxwn@ `epickopwn `precbuterwn@ diakonwn `klyrikwn ky laikwn ke toutwn ke pantwn@ Or;odoxwn@ `amyn.\n** Ke panton ton ortho-zizaxanton, ton loghon, tees alithias, Orthozoxon, epis-kopon ep-resvi-teron, zeia-konon ekli-rekon ke laikon ke to-ton ke pan-ton, Orthozoxon, amen.\nالعظيم أنبا أنطونيوس الكامل الصالحات، والبار بولا أول السواح، أنبا مقار اللابس الروح، أنبا مقار الأسقف حبيب المسيح، أنبا مقار القس، أنبا يؤأنس القمص، أنبا بيشوي الرجل الكامل، أنبا ايسيذوروس القس، أبونا القديسان الروميان مكسيموس ودوماديوس، أنبا موسى الجندي القوي، أنبا دانيال القمص، أنبا شنودة رئيس المتوحدين، أنبا صموئيل المعترف، وكل مصاف القديسين، بركاتهم المقدسة تكون معنا أمين.\n** The great Abba Anthony full of goodness, and the righteous Abba Paul the first anchorite, Abba Macari the spiritual, Abba Macari the bishop beloved of Christ, Abba Macari the priest, Abba John the hegumen, Abba Pishoy the perfect man, Abba Isidore the priest, our holy Roman fathers Maximus and Dometius, Abba Moses the strong soldier, Abba Daniel the hegumen, our father Abba Shenoute the archimandrite, Abba Samuel the confessor, and all the choirs of the saints, may their holy blessings be with us all Amen.\n** Pinis] abba Antwni@ pitelioc qen ni`aga;on@ nem pi`;myi abba Paule@ pisorp `n`ana,writyc@ abba Makari pi`pneumatovoroc@ abba Makari pi`epickopoc@ pimenrit `nte P=,=c@ abba Makari pi`precbuteroc@ abba Iwannyc pihygoumenoc@ abba Piswi pirwmi `ntelioc@ abba Icidwroc pi`precbuteroc@ nenio] =e=;=u `nrwmeoc Maximoc nem Dometioc@ abba Mwcy pimatoi `njwri@ abba Daniyl pihygoumenoc@ abba Senou] pi`ar,yman`drityc@ nem abba Camou`yl pi`omologityc@ nem `p,oroc tyrf `nte ni=e=;=u@ `ere pou`cmou =e=;=u swpi neman `amyn.\n** Pi-nishti avva Anotni, pi-teleios khenne-aghathos, nem pi-ethme avva Pavle, pishorb en-ana-khoritees, avva Makari pi-epnevma-toforos, avva Makari pi-epis-kopos, pi-menreet ente Pekhrestos, avva Makari pi-epres-veteros, avva Yoannes pi-heghomenos, avva Pishoy pi-romi ente-leios, ava Esezoros pi-epres-veteros, nenyoti ethowab en-romeos Maximos nem Dometios, avva Mosee pi-matoy en-gori, avva Daniel pi-heghomenos, avva Shenouti pi-arshe-menid-retees, nem avva Samo-eel pi-omologetees, nem epkhores ente ni-ethowab, e-re po-esmo ethowab shobi neman amen.\nيرد الشماس قائلًا:\nبي نيشتي آفا أنطوني نيم بي إثمي آفا\nبافلي نيم بي شمت إثؤواب مكاريوس\nآفا يؤانس بي كولوفوس آفا بيشوي\nآفا بافلي نين يوتي إثواب\nإنروميئوس ماكسيموس نيم دوميتيوس\nآفا موسي آفا يؤانس\nكامي آفا دانيئيل آفا إيسيذوروس آفا باخوم آفا شينوتي\nكي آفا بفنوتي\nآفا برسوما آفا تيجي كي\nبأن طون\nطون أورثوذيذاكسان طون طون\nلوغون تيبس آليثياس\nأورثوذكسون إبيسكوبون\nإبريسقيتيرون ذياكونون\nإكليريكون كي لائكون\nكي طوطون\nكي بانطون\nاورثوذوكسون أمين.\nالعظيم أنبا أنطوني\nوالبار انبا بولا\nوالقديسيون الثلاثة مقارات\nأنبا يوأنس القصير أنبا\nبيشوي أنبا بولا أبوانا\nالقديسان الروميان\nمكسيموس ودوماديوس\nانبا موسي أنبا يؤأنس\nكاما انبا دانيال أنبا\nإيسيذوروس أنبا باخوم\nأنبا شنودة وانبا بفنوتي\nانبا برسوم انبا رويس وجميع\nالذين علموا بكلمة\nالحق باستقامة الأساقفة\nالأرثوذكسيون والقسوس\nوالشمامسة الإكليروس\nوالعلمانيون وهؤلاء وجميع\nالأرثوذكسيون أمين\nبي نشتي الكبيرة:\nبي نشتي آفا أنطوني بي تيليوس\nخين ني آغاثون نيم بي إثمي آفا\nبافلي بي شورب إن آناخوريتيس\nآفا مكاري بي إبنيفماتوفوروس\nآفا مكاري بي إبيسكوبوس\nبي منريت إنتي بي إخرستوس\nآفا مكاري بي إبريسقيتيروس\nآفا يؤانس بي هيغومينوس\nآفا بيشوي بي رومي إنتي ليوس\nآفا إيسيذوروس بي إبريسقيتيروس\nنين يوتي إثؤواب إن روميئوس\nماكسيموس نيم دوميتيوس\nآفا موسي بي ماطوي إن جوري\nآفا دانييل بي هيجومينوس آفا شينوتي بي أرشي مان إذرتيس نيم آفا صموئيل بي أومولوجيتيس نيم إبخوروس تيرف إنتي ني إثؤواب إيربو إزمو إثؤواب شوبي نيمان آمين.\nالعظيم أنبا انطونيوس\nالكامل في الصالحات\nوالبار الأنبا بولا أول السواح\nانبا مقار اللابس الروح أنبا\nمقار الأسقف حبيب المسيح\nانبا مقار القس أنبا يحنس\nالقمص أنبا بيشوي الرجل\nالكامل انبا إيسوذوروس القس\nأبوانا القديسان الروميان\nمكسيموس ودماديوس\nأنبا موسي الجندي\nالقوي انبا دانيال القمص\nانبا شنودة رئيس المتوحدين\nانبا صموئيل المعترف\nوكل مصاف القديسين\nبركاتهم المقدسة تكون\nمعنا آمين\nبركاتهم المقدسه / اريبو ازمو\nالقداس الباسيلي\nالخولاجي\nالقارئون فليقولوا (تراحيم)\n"},{"n":"49- لحن بركتهم المقدسة / إريبو إزمو","t":"الشعب:\nبركتهم المقدسة تكون معنا. آمين.\n** People:\n** May their Holy blessings be with us. Amen.\n** Pilaoc@\n** Ere pou`cmou =e=;=u swpi neman@ amyn.\nالمجد لك يا رب، يا رب لك المجد. يا رب ارحم. يا رب ارحم. يا رب باركنا. يا رب نيحهم. آمين.\n** Glory to You, O Lord. Lord have mercy. Lord have mercy. Lord, bless us. Lord, repose them. Amen.\n** Doxa ci Kurie@ Kurie `ele`ycon Kurie `ele`ycon@ Kurie eulogycon@ Kurie `anapaucon@ amyn.\nوفي هذه الأثناء يرد الشعب:\nإريبو إزمو إثؤواب شوبي نيمان آمين ذوكساسي كيريي كيريي إليسون كيريي إليسون كيريي غقلوجيسون كيريي آناباقصون آمين.\nبركتهم المقدسة فلتكن معنا\nآمين المجد لك يا رب\nيا رب ارحم يا رب\nارحم يا رب باركنا يا رب\nنيحهم آمين\nانظر أيضًا: شرح اللحن وأبعاده الخمسة: جورج كيرلس.\nلحن بى نشتى / العظيم انبا انطونيوس\nاولئك يا رب / كما كان\nالقداس الباسيلي\nالخولاجي\n"},{"n":"50- أولئك يا رب / كما كان","t":"الكاهن:\nأولئك يا رب، الذين أخذت نفوسهم، نيحهم في فردوس النعيم، في كورة الأحياء إلي الأبد، في أورشليم السمائية، في ذلك الموضع.\n** Priest:\n** Those, O Lord, whose souls You have taken, repose them in the paradise of joy, in the region of the living forever, in the heavenly Jerusalem in that place.\n** Pi`precbuteroc@\n** Ny men P=o=c `eak[i `nnou'u,y@ ma`mton nwou@ qen piparadicoc `nte pounof@ qen `t,wra `nte ny etonq sa `eneh@ qen Ieroucalym `nte `tve@ qen pima `ete `mmau.\nونحن أيضاً الغرباء في هذا المكان، احفظنا في ايمانك، وأنعم لنا بسلامك إلى التمام.\n** And we too, who are sojourners in this place, keep us in Your faith, and grant us Your peace unto the end.\n** Anon de hwn qa nyetoi `nrem`njwili `wpaima@ `areh `eron qen peknah]@ `ari`hmot nan `ntekhiryny sa `ebol.\nالشعب:\nكما كان وهكذا يكون، من جيل إلي جيل، وإلي دهر الدهور. آمين.\n** People:\n** As it was and shall be, from generation to generation, and unto all the ages of the ages. Amen.\n** Pilaoc@\n** Wcper yn ke ecte ectin `apo geneac ic genean ke pantac touc `e`wnac twn `e`wnwn@ `amyn.\nيبسط الكاهن يديه ويرفعهما إلى فوق ويقول:\nنيمين إبشويس إي آكتشي إن نو إبسيشي ما إمطون نوؤو خين بي باراذيسوس إنتي إبؤونوف خين إتخورا إنتي نيئيت أونخ شا إبنيه خين يروساليم إنتي إتفي خين بي ما إيتي إمماق أنون ذي هون خانيئتؤوي إنريم إنجويلي إم باي ما آريه إيرون خين بيك ناهتي آريئهموت نان إنتيك هيريني شا أيقول.\nأولئك يا رب الذين\nأخذت نفسوهم نيحهم\nفيفردوس النعيم في كورة\nالأحياء إلى الأبد في\nأورشليم السمائية في ذلك\nالموضع ونحن أيضا الغرباء\nفي هذا العالم إحفظنا في\nإيمانك وإنعم علينا\nبسلامك إلى الإنقضاء\nيقول الشعب:\nاوس بيرين كي إستي إستين آبو جينيآس يسجي ني آن كي بانطاس طوس إيئوناس طون إيئونون آمين.\nكما كان وهكذا يكون\nمن جيل إلى جيل وإلى\nدهر الدهور آمين\nوإهدنا ألى ملكوتك / تشى مويت خاجون\nالقداس الباسيلي\nالخولاجي\nبركاتهم المقدسه / اريبو ازمو\n"},{"n":"51- و اهدنا إلى ملكوتك / تشي مويت خاجون","t":"الكاهن:\nواهدنا إلي ملكوتك. لكي وبهذا، كما أيضا في كل شئ، يتمجد ويتبارك، ويرتفع اسمك العظيم القدوس، في كل شئ، كريم ومبارك، مع يسوع المسيح ابنك الحبيب والروح القدس.\n** Priest:\n** Lead us throughout the way into Your kingdom, that as in this, so also in all things, Your Great and holy name be glorified, blessed and exalted in everything, honored and blessed with Jesus Christ, Your beloved Son, and the Holy Spirit.\n** Pi`precbuteroc@\n** {imwit qajwn `eqoun `etekmetouro@ hina nem qen vai kata `vry] on qen hwb niben `ntef[i`wou ouoh `ntef[i`cmou ouoh `ntef[ici@ `nje peknis] `nran =e=;=u@ qen hwb niben ettaiyout ouoh et`cmarwout@ nem I=y=c P=,=c pekmenrit `nSyri@ nem piP=n=a =e=;=u.\nيقول الكاهن:\nتشي مويت خاجون إيخون إيتيك ميت أوروهينا نيم خين فاي كاطا إفريتي أون خين هوب نيقين إنتيف تشي أوأو أووه إنتيف تشي إزمو أووه إنتيف تشيسي إنجي بيك نشتي إنران إثؤواب خين هوب نيقين إتطايوت أووه إيت إزماروؤت نيم إيسوس بي إخرستوس بيك مينريت إنشيري نيم بي إبنيقما إثؤواب.\nوإهدنا إلى ملكوتك\nلكي بهذا كما أيضا\nفي كل شئ يتمجد\nويتبارك ويرتفع\nإسمك العظيم القدوس\nفي كل شيء كريم\nومبارك مع يسوع\nالمسيح إبنك الحبيب\nوالروح القدس\nوايضا فلنشكر / بالين اون مارين\nالقداس الباسيلي\nالخولاجي\nاولئك يا رب / كما كان\n"},{"n":"52- وأيضًا فلنشكر / بالين أون مارين","t":"السلام للكل.\n** Peace be with You all.\n** Iryny paci.\nالشعب :\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nالكاهن:\nوأيضا فلنشكر الله ضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Priest:\n** Again, let us give thanks to God the Pantocrator, the Father of our Lord, God, and Savior Jesus Christ.\n** Pi`precbuteroc@\n** Palin on marensep`hmot `ntotf `mV] piPantokratwr@ Viwt `mP=o=c ouoh pennou] ouoh pen=c=w=r I=y=c P=,=c.\nلأنه جعلنا أهلا الآن ان نقف في هذا الموضع المقدس، ونرفع أيدينا إلي فوق، ونخدم اسمه القدوس. هو أيضا فلنسأله أن يجعلنا مستحقين لشركة واصعاد أسراره الالهية غير المائتة.\n** For He also has made us worthy now to stand in this Holy Place, to lift up our hands and to serve His holy name. Let us also ask Him to make us worthy of the communion and partaking of His divine and immortal mysteries.\n** Je af`;rener`pem-`psa on ]nou `e`ohi `eraten qen paima =e=;=u vai@ ouoh `efai `nnenjij `e`pswi@ ouoh `esemsi `mpefran =e=;=u. `N;of on maren]ho `erof hopwc `ntefaiten `nem`psa `n]met`svyr nem ]met`alum'ic `nte nefmuctyrion `nnou] ouoh `na;mou.\nالشعب:\nآمين.\n** Amen.\n** Amyn.\nيخضع الكاهن برأسه نحو الكهنة والشمامسة بلا رشم ويقول:\nإيريني باسي\nيقول الشعب:\nكيطو إبنيقماتي سو\nيقول الكاهن:\nبالين أون مارين شيبئهموت إنططق\nإم إفنوتي بي بانطوكراطور إفيوت\nإم بين شويس أووه بيننوتي\nأووه بين سوتير إيسوس\nبي إخرستوس جي آفثرين إيرإبئمبشا\nأو تينو إي أوهي إيراتين خين\nباي ما إثؤواب فاي أووه إيفاي\nإن نين جيج إي إبشوي أووه إي شمشي إمبيف ران إثؤواب إنثوف أون مارين تيهو إيروف هوبوس إنتيف آيتين\nإنئيمئبشا إنتي ميت إشقير نيم\nتي ميت آليميبسيس إنتي نيف ميستيريون إن نوتي أووه إن آثمو.\nوأيضًا فلنشكر الله\nضابط الكل ابا ربنا\nوإلهنا ومخلصنا يسوع\nالمسيح لأنها جلعنا أهلًا\nالان أن نقف في هذا\nالموضع المقدس ونرفع\nأيدينا إلي فوق ونخدم\nإسمه القدوس هو\nأيضًا فلنسأله أن\nيجعلنا مستحقين\nلشركه وصعود\nأسراره الإلهية غير\nالمائتة\nحقًا\nالجسد المقدس والدم الكريم\nالقداس الباسيلي\nالخولاجي\nوإهدنا ألى ملكوتك / تشى مويت خاجون\n"},{"n":"53- الجسد المقدس / الدم الكريم (بي سوما إثؤواب / نيم بي إسنوف إتطايوت)","t":"الكاهن:\nالجسد المقدس.\n** Priest:\n** The holy body.\n** Pi`precbuteroc@\n** Picwma e=;=u.\nالشعب:\nنسجد لجسدك المقدس.\n** People:\n** We worship Your holy body.\n** Pilaoc@\n** Tenouwst `mpekcwma =e=;=u.\nوالدم الكريم.\n** And the precious blood.\n** Nem pi`cnof ettaiyout.\nولدمك الكريم.\n** and Your precious blood.\n** nem pek`cnof ettaiyout.\nاللذين لمسيحه، الضابط الكل الرب إلهنا.\n** of His Christ, the Pantocrator, the Lord our God.\n** `nte Pef=,=c@ `nje piPantokratwr P=o=c pennou].\nالشماس:\nآمين آمين صلوا.\n** Deacon:\n** Amen. Amen. Pray.\n** Pidiakwn@\n** Amyn `amyn `proc`euxac;e.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nيرفع الكاهن الجسد بيده اليمني ويضعه على يده اليسرى ويضع إصبعه السابعة اليمني بجانب الإسباديقون decpotikon من المكان المقسوم ويقول:\nيقول الكاهن:\nبي سوما إثؤواب\nيسجد الشعب قائلًا:\nتين أوأوشت إمبيك سوما إثؤواب\nثم يرفع الكاهن إصبعه من على الجسد ويمده إلى الكأس ويغمس إصبعه بالدم الكريم ويرفعه قليلًا ويرشم داخل الكأس رشمًا واحدًا وهو يقول\nنيم بي إسنوف إتطايوت\nيقول الشعب\nنيم بيك إسنوف إتطايوت\nثم يرشم الجسد بالدم رشمين فوق وأسفل ويقول\nإنتي بيف إخرستوس إنجي بي بانطوكراطور إبشويس بيننوتي\nاللذان لمسيحه الضابط\nالكل الرب إلهنا\nيقول الشماس:\nآمين آمين صلوا\nآمين آمين إبروس إفكساستي\nكيريي إليسون\nصلاة القسمه المقدسه\nالقداس الباسيلي\nالخولاجي\nوايضا فلنشكر / بالين اون مارين\n"},{"n":"54- صلاة القسمة المقدسة","t":"الكاهن:\nالسلام للكل.\n** Priest:\n** Peace be with You all.\n** Pi`precbuteroc@\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nيقول الكاهن:\nإيريني باسي\nينهض الشعب قائلًا:\nكيطوإبنيقماتي سو\nترتيب القسمة:\nيأخذ الكاهن الجسد الطاهر على يديه ويبتدئ بتلاوة صلاة القسمة ويقسم أولًا الجسد ثلثا عن يمينه وثلثين عن يساره كما قسم أولًا (لكنه لم يفصل) عند قوله (وقسمه) بينما يفصلها هنا\nثم ثانيًا ياخذ الثلث الأيمن ويضعه على الثلثين مثال الصليب المقدس وياخذ جوهرة (2) من أعلى الثلثين من الثلث الذي فيه الإسباديقون decpotikon ويضعها في صدر الصينية شرقًا ويأخذ جوهرة من أسفل الثلثين مذل ذلك ويضعها في الصينية غربًا.\nثم يأخذ من جانب الثلث الأيمن عن اليمين جوهرة ويضعها في الصينية يمينا ويأخذ باقي الثلث المذكور ويضعه في جانب الصينية يسارًا ويكون بذلك مثال الصليب\nثم ثالثًا يفصل أحد الثلثين من الآخر من فوق إلى أسفل ويأخذ منهما الثلث الذي فيه الإسباديقون فيضعه في وسط الصينية\nويبتدئ رابعًا بقسمة الثلث الباقي بيده الذي هو الأيسر من القربانة إلى أربعة أجزاء دون فصل وإذا إنتهي من قسمته ياخذ الثلث الذي وضعه أولًا في الصينية يسارًا وهو معظم الثلث الأيمن من القربانة ويضع مكانه الثلث الأيسر الذي كان بيده\nأما الثلث الذي أخذخ من الصينية فيقسمه هو ايضًا إلى ثلاثة أجزاء وإذا انتهي من قسمه يضعه في الصينية يمينًا\nثم يأخذ الثلث الأوسط الذي وضعه قبلًا في وسط الصينية ويفصل منه الإسباديقون خاصة من فوق الوجه ويبقي باقي الثلث المذكور متصلًا بعضه ببعض من فوق إلى أسفل ويحترز على الإسباديقون من أن ينشق او يتفتت ثم يضعه في مكانه وسط الثلث ويضع الثلث في وسط الصينية كما كان\nويجمع حوله جميع الجواهر التي قسمها ويجعلها كما كانت قبل القسمة\n(والكاهن المدقق هو الذي يجمع القربانة كما كانت قبل القسمة ويرفعها بيديه مقسومة صحيحة)\nوإذا تكامل هذا كله يفرك الكاهن يديه داخل الصينية حتى لا يبقي عليها ولا يلتصق بهما أى شيء من الجواهر.\nالقداس الباسيلي\nالخولاجي\nقسمة ايها السيد الرب\nالجسد المقدس والدم الكريم\n"},{"n":"55- قسمة أيها السيد الرب","t":"أيها السيد الرب، إلهنا العظيم الابدى، والمتعجب منه بالمجد.\n** O Master, Lord our God, the great, the eternal, محيي ... إلخ.)\nإبروس خومين ثيئوميطافوقو آمين\nننصت بخوف الله آمين\nيقول الكاهن:\nإيريني باسي\nينهض الشعب قائلًا:\nومع روحك أيضًا\nكيطو إبنيقماتي سو\nيقول الكاهن تحليل الآب سرا\n(أيها السيد الرب الإله ضابط الكل شافي نفوسنا وأجسادنا وأرواحنا أنت الذي قلت أبينا بطرس من فم إبنك الوحيد ربنا وإلهنا ومخلصنا يسوع المسيح أنت هو بطرس وعلى هذه الصخرة أبني كنيستي وأبواب الجحيم لن تقوي عليها وأعطيك مفاتيح ملكوت السموات وما ربطته على الأرض يكون مربوطًا في السماء وما حللته على الأرض يكون محلولا في السموات\nفيكن يا سيدنا عبيدك آبائي وإخوتي وحقارتي محاللين من فمي بروحك القدوس أيها الصالح محب البشر اللهم يا حامل خطية العالم إبدأ بقبول توبة عبيدك منهم نورًا للمعرفة وغفرانًا للخطايا لأنك انت إله رؤوف رحوم أنت طويل الأناة كثير الرحمة وبار وإن كنا قد أخطأنا إليك بالقول أو بالفعل فسامح وإغفر لنا كصالح ومحب للبشر اللهم حاللنا وحالل شعبك من كل خطية ومن كل لعنة ومن كل جحود ومن كل يمين كاذب ومن كل ملاقاة الهراطقة الوثنين أنعم علينا يا سيدنا بعقل وقوة وفهم لنهرب إلى التمام من كل امر ردئ وإمنحنا نصنع مرضاتك كل حين أكتب أسمائنا مع كل صفوف قديسيك في ملكوت السموات بالمسيح يسوع ربنا هذا الذي لك معه المجد.. إلخ.)\nوهنا يذكر الكاهن من يريد أن يصلي من أجلهم ثم يقول الكاهن هذه الصلاة أيضًا سرًا:\n(إذكر يا رب ضعفي أنا أيضا وإغفر لي خطاياي الكثيرة وحيث كثر الإثم فلتكثر هناك نعمتك ومن أجل خطاياي خاصة ونجاسات قلبي لا تمنع شعبك من نعمة روحك القدوس حاللنا وحالل كل شعبك من كل خطية).\nالاواشى\nالقداس الباسيلي\nالخولاجي\nقسمة ايها السيد الرب\n"},{"n":"57- الأواشي","t":"ثم يقول أوشيتي السلام والآباء سرًا ثم يمسك الإسباديقون decpotikon بيده فوق الصينية ويقول جهرًا أوشية الاجتماعات\nآري إفميقئي إبشويس إن نين جينثؤوتي إزمو إيرؤو\nأذكر يا رب\nاجتماعاتنا باركها\nفيرفع الشماس الصليب ويقول:\nسوتيس آمين كيطوإبنيقماتي سو ميتا فوقو ثيؤبروس خومين\nخلصنا حقًا ومع روحك\nأيضا ننصت بخوف الله\nيقول الشعب:\nآمين كيريي إليسون كيريي إليسون كيريي إليسون\nآمين يا رب ارحم يا رب إرحم\nيا رب إرحم\nالقدسات للقديسين / طا اجياتيس\nالقداس الباسيلي\nالخولاجي\nتحليل الآب / أحنوا رؤوسكم / ننصت\n"},{"n":"58- القدسات للقديسين / طا آجياتيس آجيس  إلهنا. آمين.\n** The holy, precious body and the true blood of Jesus Christ, Son of our God. Amen.\n** Agion timion cwma ke `ema aly;inon@ Iycou <rictou tou `Uiou tou :eou `ymwn@ `amyn.\nجسد ودم عمانوئيل إلهنا، هذا هو بالحقيقة. آمين.\n** The body and the blood of Emmanuel our God; this is true. Amen.\n** Picwma nem pi`cnof `nte Emmanouyl pennou] vai pe qen oume;myi@ amyn.\nحقاً أؤمن.\n** Amen. I believe.\n** Amyn. ]nah].\nيقول الكاهن:\nإيريني باسي\nينهض الشعب قائلًا:\nكيطو إبنيقماتي سو\nينزل الكاهن يده بالإسبوديقون ويرشم به الجسد ويقول:\nسوما آجيون كي إيما تيميون آليثينون إيسو خرستوطوإيوطو ثيئو إيمون آمين\nجسد مقدس ودم كريم\nحقيقي ليسوع المسيح\nإبن إلهنا آمين\nيقول الشعب:\nحقًا.\nيرشم الكاهن الجسد ثانية وهو يقول:\nآجيون تيمون سوما كي إيما آليثينون إيسوخرستوطوثيئو إيمون آمين\nمقدس وكريم جسد ودم\nحقيقي ليسوع المسيح إبن\nإلهنا آمين\nيرشم الكاهن الجسد ثالثة بالإسبادقيون ثم يرفع يده ويرشم به الدم ثم يضعه في الكأس وهو يقول:\nبي سوما نيم بي إسنوف إنتي إممانوئيل بيننوتي فاي بي خين أوميتي آمين.\nجسد ودم عمانوئيل إلهنا هذا هو\nبالحقيقة آمين\nأمين تي ناهيتي\nاعتراف الكاهن\nالقداس الباسيلي\nالخولاجي\nالقدسات للقديسين / طا اجياتيس\n"},{"n":"60- الاعتراف (أؤمن)","t":"الكاهن:\nآمين. آمين. آمين. أؤمن. أؤمن. أؤمن. واعترف إلي النفس الاخير. أن هذا هو الجسد المحيي، الذي أخذه ابنك الوحيد الجنس، ربنا وإلهنا ومخلصنا يسوع المسيح من سيدتنا و ملكتنا كلنا والدة الاله القديسة الطاهرة مريم. وجعله واحدا مع لاهوته بغير اختلاط ولا امتزاج ولا تغيير.\n** Priest:\n** Amen. Amen. Amen. I believe, I believe, I believe and confess to the last breath that this is the life-giving Flesh that Your only-begotten Son, our Lord, God, and Savior Jesus Christ, took from our lady, the Lady of us all, the holy Theotokos, Saint Mary. He made It One with His divinity without mingling, without confusion, and without alteration.\n** Pi`precbuteroc@\n** Amyn `amyn `amyn ]nah] ]nah] ]nah] ouoh ]er`omologin sa pinifi `nqa`e. Je ;ai te ]carx `nreftanqo eta pekmonogenyc `nSyri@ pen=o=c ouoh pennou] ouoh pen=c=w=r I=y=c P=,=c [itc `ebolqen ten=o=c `nnyb tyren ];e`otokoc =e=;=u ]agia Mari`a. Afaic `nouai nem tefme;nou] qen oumetatmoujt nem oumetat;wq nem oumetatsib].\nواعترف الاعتراف الحسن أمام بيلاطس البنطي. وسلمه عنا علي خشبة الصليب المقدسة، بإرادته وحده، عنا كلنا. بالحقيقة أؤمن، أن لاهوته لم يفارق ناسوته لحظة واحدة ولا طرفة عين. يعطى عنا خلاصا وغفرانا للخطايا وحياة أبدية لمن يتناول منه. أؤمن. أؤمن. أؤمن. أن هذا هو بالحقيقة. آمين.\n** He confessed the good confession before Pontius Pilate. He gave It up for us upon the holy wood of the Cross, of His own will, for us all. Truly I believe that His divinity parted not from His humanity for a single moment, nor a twinkling of an eye; given for us for salvation, remission of sins, and eternal life to those who partake of Him. I believe, I believe, I believe that this is true. Amen.\n** Eafer`omolgin `n]omologia e;nanec nahren Pontioc Pilatoc. Aftyic `e`hryi `ejwn hijen pise =e=;=u `nte pi`ctauroc qen pefouws `mmin `mmof `e`hryi `ejwn tyren. Aly;wc ]nah] je `mpe tefme;nou] vwrj etefmetrwmi `noucoucou `nouwt oude ouriki `mbal. Eu] `mmoc `ejwn `noucw] nem ou,w `ebol `nte ninobi nem ouwnq `neneh `nnye;na[i `ebol `nqytc. }nah] ]nah] ]nah] je ;ai te qen oume;myi `amyn.\nآمين، آمين، آمين. أؤمن، أؤمن، أؤمن. واعترف إلى النفس الأخير. أن هذا هو الجسد المحيي، الذي أخذه إبنك الوحيد الجنس، ربنا وإلهنا ومخلصنا يسوع المسيح من سيدتنا وملكتنا كلنا والدة الإله القديسة الطاهرة مريم.\n** Amen, Amen, Amen. I believe, I believe, I believe and confess to the last breath that this is the life-giving flesh that Your only-begotten Son, our Lord, God, and Savior Jesus Christ, took from our lady, the lady of us all, the holy Theotokos, Saint Mary.\n** `Amyn `amyn `amyn. }nah] ]nah] ]nah] ouoh ]er`omologin sa pinifi `nqa`e. Je ;ai te ]carx `nreftanqo `eta pekmonogenyc `nSyri@ pen=o=c ouoh penNou] ouoh penCwtyr I=y=c P=,=c@ [itc `ebolqen ten=o=c `nnyb tyren ]:e`otokoc =e=;=u ]`agia Maria.\nوجعله واحداً مع لاهوته بغير إختلاط ولا امتزاج ولا تغيير. واعترف الإعتراف الحسن رب إغفرها لنا من أجل أسمك القدوس الذي دعي علينا، كرحمتك يا رب ولا كخطايانا.\nوأيضًا صلاة قبل التناول\n\"يا رئيس الحياة وملك الدهور، كلمة الله الآب، ربنا وإلهنا ومخلصنا يسوع المسيح، الخبز الحقيقي الذي نزل من السماء واهب الحياة لمن يتناوله. إجعلنا أهلًا، بغير وقوع في دينونة أن نتناول من جسدك المقدس ودمك الكريم وليصبرنا تناولنا من أسرارك المقدسة واحدًا معك إلى الإنقضاء وباركنا أنت هو إبن الله لك المجد معه مع الروح القدس المحيي إلى الأبد آمين\"\nوأيضًا صلاة أخري قبل التناول\n\"إجعلنا مستحقين كلنا يا سيدنا أن تناول من جسدك المقدس ودمك الكريم وطهارة لأنفسنا وأجسادنا وأرواحنا ومغفرة لخطايانا وآثامنا لكي نكون جسدًا واحدًا وروحًا واحدًا معك، المجد لك مع أبيك الصالح والروح القدس إلى الأبد آمين\"\nثم يتناول الكاهن من الجسد المقدس ويناول الشمامسة وبعد مناولتهم من الأسرار المقدسة يكمل مناولة من هم على استعداد من الرجال والسيدات.\nوإذا ناول الجسد الطاهر يقول\nبي سوما إنتي إممانوئيل بيننوتي فاي\nبي خين اوميثمي آمين.\nالجسد الذي لعمانوئيل إلهنا هذا\nهو بالحقيقة آمين.\nوإذا ناول الدم الكريم يقول\nبي إسنوف إنتي إممانوئيل بيننوتي\nفاي بي خين أوميثمي آمين.\nالدم الذي لعمانوئيل إلهنا\nهذا هو بالحقيقة آمين.\nوإذا ناول الجسد مصبوغًا بالدم يقول([1])\nبي سوما نيم بي إسنوف إنتي\nإممانوئيل بيننوتي فاي بي خين\nاوميثمي آمين.\nالجسد والدم اللذان\nلعمانوئيل إلهنا. هذا هو\nبالحقيقة آمين.\nفيقول المتناول في كل مرة: آمين.\n"},{"n":"63- عرض الأسرار على الشعب","t":"عرض الأسرار على الشعب\nيغطي الكاهن الأسرار قبل عرضها على الشعب لأنه ليس من اللائق أن يبصرها الجميع، وهي مكشوفة ثم يعرضها مرتين:\nالعرض الأول: بعد مناولة الشمامسة، حيث يلتفت الكاهن وهو حامل الصينية بلفافتين إلى الغرب وهو يقول \"القدسات للقديسين. مبارك الرب يسوع المسيح إبن الله وقدوس الروح القدس آمين\".. فينحني الشعب برأسه فقط وبخاصة المتناولون، ويهتف الشعب \"مبارك لآتي بإسم الرب\"\nويباركهم الكاهن مثال الصليب، ثم يعود إلى المذبح وهذا العرض إشارة إلى المجيء الأول للسيد المسيح.\nالعرض الثاني: يعود الكاهن وهو حامل الصينية ويقول \" جسد مقدس ودم كريم حقيقي ليسوع المسيح إبن إلهنا آمين\" فينحني الشعب برأسه فقط، وبخاصة المتناولون، ويهتف الشعب \"مبارك الآتي بإسم الرب\" ويباركهم الكاهن بمثال الصليب ويعود بها داخل الهيكل. وعرضها ثانية ثم إخفاؤها إشارة إلى المجيء الثاني للسيد المسيح (لوقا 13: 35).\nمزمور 150 (سبحوا اللة)\nالقداس الباسيلي\nالخولاجي\nالتوزيع\n"},{"n":"64- التوزيع: مز150/ سبحوا الله","t":"وأثناء التوزيع يسبح الشعب بالمزمور الآتي، وهو المزمور (150) ([1])..\nثم يكمل الشعب حسبما يوافق اليوم، أما في الآحاد فتقال هذه الجملة..\nجي إف إزماروؤوت إنجي إفيوت\nنيم إبشيري نيم بي إبنيقما إثؤواب\nتي إترياس إتجيك أيقول تين\nأوأوشت إمموس تين تي أوأوناس.\nلأنه مبارك الآب والإبن\nوالروح القدس الثالوث\nالكامل نسجد له\nونمجده.\nوفي الأيام السنوية تقال هذه الجملة..\nإك إزماروؤوت آليثوس نيم\nبيك يوت إن آغاثوس نيم بي\nإبنيقماإثؤواب جي آك إي آك\nسوتي إممون\nمبارك أنت بالحقيقة\nمع أبيك الصالح\nوالروح القدس لأنك\nأتيت وخلصتنا.\n"},{"n":"65- التوزيع: لحن بي أويك / خبز الحياة","t":"بي اويك انتى ابؤنخ : ايطاف اي ابسيت: نان ايفول خين اتفى : افتي امابؤنخ امبي كوزموس\nخبز الحياة الذى نزل من السماء وهب الحياة للعالم\n** Piwik `nte `pwnq : eta4`i `epec3t : nan ebolqen `tfe : a45 `m`pwnq `mpikocmoc .\nانثو هوي ماريا : اري فاي خين تى نيجي : امبي مانا انو ايطون : ايطاف اي ايفول خين افيوت\nو أنتِ أيضاً يا مريم حملت فى بطنك المن العقلى الذى أتى من الآب .\n** `N0o hwi Maria : are4ai qen tenegi : `mpimanna `nno3ton : eta4`i ebolqen `fiwt .\nاري ماسف اتشني ثوليب : افتي نان امبيف سوما : نيم بيف اسنوف اطايوت : ان اونخ شا اينيه\nولدته بغير دنس وأعطانا جسده و دمه الكريم فحيينا إلى الأبد\n** Aremac4 asne 0wleb : a45 nan `mpe4cwma : nem pe4`cno4 ettai3ovt : anwnq 2a `eneh .\nسيطوؤو نو هاروك : انجى ني شيروفيم : نيم ني سيرافيم : سى اشناف ايروك ان .\nيقوم حولك الشاروبيم والسيرافيم ولا يستطيعون أن ينظروك\n** Cetwovnov harok : `nge nixerovbim : nem nicerafim : ce`2nav `erok an .\nتين ناف ايروك اميني : هيجين بي مان ايرشوؤوشي : تين تشي ايفول خين بيك سوما : نيم بيك اسنوف ايطايوت .\nو نحن ننظرك كل يوم على المذبح ونتناول من جسدك ودمك الكريم .\n** Tennav `erok `mm3ni : higen pima`ner2wov2i : tensi ebolqen pekcwma : nem pek`cno4 ettai3ovt .\nاثفى فاي تين تشيس ن جسدك ودمك\nالكريم.\nإثقي فاي تين تشيسي إممو أكسيوس خين هان إمنولوجيا إم إبروفيتيكون\nمن أجل هذا نعظمك باستحقاق\nبتماجيد نبوية.\nجي آف ساجي إيثفيتي إن هان\nإهفيئوي إتطايوت تيفاكي إثؤواب\nإنتي بي نشتي إن أورو.\nلأنهم تكلموا من\nأجلك باعمال كريمة أيتها\nالمدينة المقدسة التي\nللملك العظيم.\nتين تيهو تين طفه غيثرين شاشني\nإيفناي هيتين ني إبريسفيا إنطوطف\nإمبي ماي رومي.\nنسأل ونطلب أن نفوز\nبرحمة، بشفاعتك عند\nمحب البشر.\nصلاه الكاهن بعد التناول\nالقداس الباسيلي\nالخولاجي\nمزمور 150 (سبحوا اللة)\n"},{"n":"66- صلاة الكاهن بعد التناول","t":"وبعد ذلك يقول الكاهن صلاة الشكر الآتية لله الآب.\n\" فمنا إمتلأ فرحًا ولساننا تهليلًا من أجل تناولنا من أسرارك غير المائتة يا رب. لأن مالم تره عين ولم تسمع به أذن ولم يخطر على قلب بشر، ما أعددته يا الله لمحبي إسمك القدوس، هذا أعلنته للأطفال الصغار الذين لبيعتك المقدسة نعم أيها الآب ان هذه هي المسرة التي كانت أمامك لأنك رحيم ونرسل لك إلى فوق المجد والإكرام أيها الآب والإبن والروح القدس الآن وكل أوان.. إلخ.\"\nيقول الكاهن صلاة وضع يد بعد التناول\n\" عبيدك يا رب هؤلاء الذين يخدمونك ويطلبون إسمك القدوس ويخضعون لك حل فيهم يا رب وسر بينهم ساعدهم في كل عمل صالح أنهض قلوبهم من كل فكر ردئ أرضي إمنحهم أن يحيوا ويفكروا في ما للأحياء ويفهموا ما هو لك بإبنك الوحيد ربنا وإلهنا ومخلصنا يسوع المسيح هذا الذي نحن وكل شعبك نصرخ قائلين: إرحمنا يا الله مخلصنا\".\nلحن بى اويك / خبز الحياه\nيا ملاك هذه الذبيحة\nالقداس الباسيلي\nالخولاجي\n"},{"n":"67- ملاك الذبيحة","t":"الكاهن:\nايها المسيحُ إلهنا.\n** Priest:\n** O Christ our God.\n** Pi`precbuteroc@\n** P=,=c pennou].\nالشعب:\nآمين يكون.\n** People:\n** Amen. So be it.\n** Pilaoc@\n** Amyn ec`eswpi.\nيا ملك السلام. اعطينا سلامك قرر لنا سلامك واغفر لنا خطايانا. لك القوة والمجد والبركة والعزة إلى الآبد آمين.\nاللهم اجعلنا مستحقين أن نقول بشكر:\n** O King of Peace, give us Your peace, establish for us Your peace, and forgive us our sins. For Yours is the power, the glory, the blessing, and the might, forever. Amen.\n** Make us worthy to pray thankfully:\n** `Pouro `nte ]hiryny@ moi nan `ntekhiryny@ cemni nan `ntekhiryny@ ,a nennobi nan `ebol. je ;wk te ]jom nem pi`wou nem pi`cmou nem pi`amahi sa `eneh `amyn.\nالشعب:\nأبانا الذي في السموات...\n** Our Father who art in heaven...\n** Je peniwt etqen nivyou`i ...\nوالآن محبة الله الآب، ونعمة الابن الوحيد، ربنا وإلهنا وملكنا ومخلصنا يسوع المسيح، وشركة وموهبة الروح القدس تكون مع جميعكم،\nامضوا بسلام، سلام الرب مع جميعكم. امين.\n** Priest:\n** And now may the love of God the Father; the grace of the only-begotten Son, our Lord, God, and Savior Jesus Christ; and the communion and gift of the Holy Spirit be with you all. Go in peace. The peace of the Lord be with you all.\nومع روحك ايضاً.\n** And with Your spirit.\nوبعد غسل الآنية يضع الكاهن ماءًا في يديه ويرش منه قليلًا على المائدة ويقول:\n\"يا ملاك هذه الصعيدة الطائر إلى العلو بهذه التسبحة أذكرنا قدام الرب ليغفر لنا خطايانا\". ويمر بيده على وجهه تبركًا وهكذا يصنع مع أخوته الكهنة والشمامسة وجميع الشعب، وأثناء ذلك يتلو البركة.\nثم يطلب الكاهن مصليًا صلاة الختام ويختمها بقوله \" أبانا الذي في السموات.. إلخ. ثم يصرح الكاهن للشعب بالإنصراف قائلًا \" محبة الله الآب ونعمة الإبن الوحيد ربنا وإلهنا ومخلصنا يسوع المسيح وشركة وعطية الروح القدس تكون مع جميعكم إمضوا بسلام الرب معكم\" ويجاوبه الشعب قائلين \"ومع روحك أيضًا \" ويعطي الجميع الإيفلوجيا \"لقمة البركة\" فينصرفون ممجدين الله.\n** وبعد ذلك يطوف الكاهن حول المذبح ويقبل أركانه الأربعة وهو يصفق بيديه ويتلو المزمور([1]) (46).\n\"يا جميع الأمم صفقوا بأيديكم، هللوا لله بصوت الإبتهاج، لأن الرب عال ومرهوب، ملك كبير على كافة الأرض. أخضع الشعوب لنا.، والأمم تحت أقدامنا. إختارنا ميراثًا له، جمال يعقوب الذي أحبه، صعد الله بتهليل، والرب بصوت البوق، رتلوا لإلهنا رتلوا بفهم. فإن الرب ملك على جميع الأمم، الله جلس على كرسيه المقدس. رؤساء الشعوب إجتمعوا مع إله إبراهيم، لأن أعزاء الله قد إرتفعوا في الأرض جدًا.. هلليلويا\" ينزل من الهيكل منصرفًا بسلام..\n"},{"n":"القداس الباسيلي للقديس باسيليوس الكبير 14'- سر الكاثوليكون: أيها الرب إلهنا الذي من قبل رسلك القديسين","t":"أيها الرب إلهنا الذي من قبل\nرسلك القديسين اظهرت لنا سر\nإنجيل مجد مسيحك.\n** O Lord  وصيتّك المقدسة.\n** Who for the sake of goodness only brought man into existence out of nonexistence, and put him in the paradise of joy. And when he fell through the deception of the enemy and the disobedience of Your holy commandment.\n** Vyete e;be oumetaga;oc `mmauatc ebolqen vyete nafsop an ak`;refswpi `nje vrwmi ouoh ak,af qen piparadicoc `nte `pounof. Qen `pjin`;refhei de ebolhiten ]apaty `nte pijaji nem ]metatcwtem `nca tekentoly =e=;=u.\nواردت ان تجدّده، وتردّه إلي رتبة الأولي. لا ملاك ولا رئيس ملائكة ولا آباء ولا نبياً ائتمنته علي خلاصنا. بل أنت بغير استحالة، تجسد وتأنست، وشابهتنا في كلّ شئ ما خلا الخطية وحدها. وصرت لنا وسيطاً لدى الآب، والحاجز المتوسط نقضته، والعداوة القديمة هدمتها.\n** You desired to renew him and to restore him to his first estate. Neither an angel nor an archangel, neither a patriarch nor a prophet, have You entrusted with our salvation, but You, without change, were incarnate and became man and resembled us in everything, except for sin alone, and became for us a mediator with the Father, and the middle wall You have broken down and the old enmity You have abolished.\n** Ouoh eakouws eaif `mberi ouoh eenf eqoun epiaxiwma `nte sorp. Aggeloc an oude ar,iaggeloc oude patriar,yc oude provytyc `mpektenhoutou epenoujai. Alla `n;ok qen oumetatvwnh ak[icarx. Ouoh akswpi `nrwmi ouoh ak`ini `mmon qen hwb niben saten `vnobi `mmauatf.Akswpi nan `mmecityc nem `Viwt ouoh ]jin`;my] `nte ni;wm akbolc ebol ouoh ]metjaji `napac akserswrc.\nواصلحت الارضيين مع السمائيين، وجعلت الإثنين واحداً، وأكملت التدبير بالجسد. وعند صعودك إلي السموات جسدياً، إذ ملأت الكلّ بلاهوتَّك.\n** You have reconciled the earthly with the heavenly and made the two into one, and fulfilled the economy in the flesh. And at Your Ascension into the heavens in the body, having filled all with Your divinity.\n** Akhwtp `nna`pkahi enanivyoui ouoh aker pi`cnau `nouai eakjwk ebol n]oikonomia qen `tcarx. Ouoh eknasenak e`pswi enivyoui cwmatikwc eakmoh `mptyrf qen tekme;nou].\nقلت لتلاميذك ورسلك القديسين:\n”سلامي أعطيكم، سلامي أنا أتركه لكم.“ هذا أيضاً الآن، أنعِم به لنا يا سيدَّنا.\n** You said to Your holy disciples and apostles,\n** \"My peace I give to you; My peace I leave with you.\" The same also, now grant to us, O our Master.\n** Nakjw `mmoc `nnekma;ytyc =e=;=u ouoh `napoctoloc. Je tahiryny ]] `mmoc nwten tahiryny anok ],w `mmoc nemwten. :ai on ]nou ari`hmot `mmoc nan pennyb.\nوطهرنا من كل دنس، ومن كل غش، ومن كل رياء، ومن كل شر، ومن كل مكيدةٍ، ومن تذكار الشر الملبس الموت.\n** And cleanse us from all blemish, all guile, all hypocrisy, all evil, all malice, and the remembrance of evil entailing death.\n** Eaktoubon ebolha ;wleb niben@ nem `,rof niben@ nem metsobi niben@ nem kakia niben@ nem panourgia niben@ nem ]metrefervmeui `nte ]kakia etervorin `mvmou.\nالشماس:\nصلوا من أجل السلام الكامل، والمحبة، والقبلة الطاهرة الرسولية.\n** Deacon:\n** Pray for perfect peace, love, and the holy apostolic kisses.\n** Pidiakwn@\n** Proceuxac;e `uper tyc teliac `irynyc ke `agapyc ke twn `agiwn acpacmwn twn `apoctolwn.\nثم يقول الأواشي الكبار: السلام والآباء والاجتماعات، كما جاء في صفحة سابقا ويقول الشعب: بعد ذلك الأمانة المقدسة.\nويقول الكاهن صلاة الصلح هذه للابن:\n\"أيها الكائن الذي كان الدائم إلى الأبد، الذاتي والمساوي والجليس والخالق الشريك مع الآب، الذي من أجل الصلاح وحده مما لم يكن كونت الإنسان وجعلته في فردوس النعيم، وعندما سقط بغواية العدو ومخالفة وصيتك المقدسة، وأردت ان تجدده وترده إلى رتبته الأولي، لا ملاك ولا رئيس ملائكة ولا رئيس آباء ولا نبي ائتمنته على خلاصنا بل أنت بغير استحالة تجسدت وتأنست وشابهتنا في كل شيء ما خلا الخطية وحدها وصرت لنا وسيطًا لدى الآب والحاجز المتوسط نقضته والعداوة القديمة هدمتها وأصلحت الأرضيين مع السمائيين وجعلت الاثنين واحدًا وأكملت التدبير بالجسد وعند صعودك إلى السموات جسديًا إذ ملأت الكل بلاهوتك قلت لتلاميذك ورسلك القديسين سلامي أعطيكم سلامي أنا أترك لكم هذا أيضًا الآن أنعم به علينا يا سيدنا، وطهرنا من كل دنس ومن كل غش ومن كل رياء ومن كل شر ومن كل مكيدة ومن تذكار الشر الملبس الموت\".\nيقول الشماس\n\"صلوا من أجل السلام الكامل والمحبة والقبلات الطاهرة الرسولية\"\n** صلاة الصلح باللغة اليونانية(4)\n** Εύχή τού άσπασμού.\n** Είρήνη πάσιν.\n** Ο ών, και προών, και διαμένων εις τους αιώνας, ο τω Πατρί συναΐδιος και ομοούσιος, και σύνθρονος και συνδημιουργός.\n** Ο διά μόνην αγαθότητα εκ του μη όντος εις το είναι παραγωγών τον άνθρωπον, και θέμενος αυτόν εν παραδείσω τρυφής.\n** Απάτη δε του εχθρού και παρακοή της σης εντολής παραπεσόντα, ανακαινίσαι βουλόμενος και προς το αρχαίον αναγαγείν αξίωμα, ούκ άγγελος, ουκ άρχάγγελος, ου πατριάρχης, ου προφήτης την ημών ενεχείρησας σωτηρίαν.\n** αλλ' αυτός άτρέπτως σάρξ γενόμενος, και ενηνθρώπησας, κατά πάντα όμοιώθης ημίν, εκτός μόνης της αμαρτίας. μεσίτης ήμών γενόμενος, και του Πατρός, και το μεσότοιχον τού φραγμού, και την χρονίαν έχθραν καθελών, τα επίγεια τοις επουρανίοις συνήψας, και τα αμφότερα εις έν συνήγαγες και την ένσαρκον επλήρωσας οικονομίαν.\n** Και μέλλων σωματικώς ελαύνειν εις τους ουρανούς, θειϊκώς τα πάντα πληρών, τοίς αγίοις σου μαθηταίς, και αποστόλοις έλεγες: Ειρήνην αφίημι υμίν ειρήνην την εμήν δίδωμι υμίν.\n** Ταύτην και νυν ειρήνην ημίν δώρησαι, Δέσποτα: χάρισαι παντός αποκάθαρον μολύσματος, παντός δόλου και πάσης κακίας, και πανουργίας, και της θανατηφόρου μνησικακίας, και καταξίωσον ημάς ασπάσασθαι αλλήλους έν φιλήματι αγίω, εις το μετασχεϊν ακατακρίτως της αθανάτου και επουρανίου σου δωρεάς: χάριτι τη ση, ευδοκία του Παρτός της ευδοκίας του Πατρός, και ενεργεία του αγίου Πνεύματος.\n** Σύ γάρ ει ο χορηγός και δοτήρ πάντων των αγαθών, και σοι την δόξαν, την αΐδιον δοξολογίαν αναπέμπομεν, συν τω ανάρχω σου Πατρί, και τώ αγίω σου Πνεύματι, νυν και αεί.\n** الحواشي والمراجع لهذه الصفحة هنا في موقع الأنبا تكلاهيمانوت:\n(1) الأمانة المقدسة: الأمانة هي قانون الإيمان.\n(2) \"الخالق الشريك مع الآب\": المسيحية تؤمن بإله واحد، واستخدام كلمة «الشريك» (إن إشفير ⲛ̀ϣ̀ⲫⲏⲣ) هنا لا يعني إلهًا يُشارك إلهًا آخر، بل نتحدث عن الله ذاته الواحد. فنقول إن كلمة الله -عقله الناطق- معه منذ الأزل (مثله مثل روحه القدوس)، ومُشترك معه في جميع أعماله (له نفس صفات الآب). فنحن نَتَحَدَّث عن الإله الواحد الذي خلق كل شيء بعقله. كما يتأمل سفر الأمثال في ذلك بقوله: «مُنْذُ الأَزَلِ مُسِحْتُ، مُنْذُ الْبَدْءِ... كُنْتُ عِنْدَهُ صَانِعًا» (أم 8: 23، 30)، وأيضًا \"الرَّبُّ بِالْحِكْمَةِ أَسَّسَ الأَرْضَ\" (أم 3: 19). وقد أشار الكتاب المقدس إلى هذا الأمر في مواضع عديدة، مثل قول السيد المسيح: «أَبِي يَعْمَلُ حَتَّى الآنَ وَأَنَا أَعْمَلُ» (يو 5: 17)، وأنه مهما عمل الآب فهذا يعمله الابن كذلك (يو 5: 19، 21)، وقول الكتاب: «بِالإِيمَانِ نَفْهَمُ أَنَّ الْعَالَمِينَ أُتْقِنَتْ بِكَلِمَةِ اللهِ» (عب 11: 3). فهنا كلمة «شريك» لا يُقصد بها إله يشارك إلهًا آخر (إلهين)، حاشا، بل نقصد بها أن الله وكلمته، الذي هو عقله الناطق، معه منذ الأزل، وقد خلق به كل شيء. هذا هو معنى «الشريك». فنحن نمدح عقل الله الناطق، ونقول له: إنك كنت مع الله منذ الأزل، وشريكًا له في كل عمله؛ لأن الله يعمل كل شيء بحكمته وكلمته، وعقله الناطق ليس إلهًا آخر، بل هو واحد مع الله في الجوهر. والخلاصة: \"كُلُّ شَيْءٍ بِهِ كَانَ، وَبِغَيْرِهِ لَمْ يَكُنْ شَيْءٌ مِمَّا كَانَ\" (يو 1: 3).\nربما يفيدك قراءة مقال: تشبيهات الثالوث التي تُقرب المعنى إلى أذهاننا، من كتاب أسئلة حول حتمية التثليث والتوحيد - أ. حلمي القمص يعقوب.\n(3) \"صرت لنا وسيطًا لدى الآب والحاجز المتوسط نقضته والعداوة القديمة هدمتها وأصلحت الأرضيين مع السمائيين وجعلت الاثنين واحدًا\": من وحي (أف 2: 14-16).\n(4) لم يتم مراجعة النسخة اليونانية جيدًا من جهة علامات التشكيل بعد.\nقبلوا بعضكم بعضا\nالقداس الغريغوري\nالخولاجي\nصلاة الحجاب\n"},{"n":"3- قبلوا بعضكم بعضا","t":"الشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nالكاهن:\nواجعلنا مستحقين كلنا يا سيدنا، أن يُقًّبل بعضُنا بعضاً بقبلةٍ طاهرة. لتناول بغير أنطراح في الحكم، من موهبتك غير المائتة السمائية.\n** Priest:\n** And make us all worthy, O our Master, to greet one another with a holy kiss. That without falling into condemnation, we may partake of Your immortal and heavenly gift.\n** Pi`precbuteroc@\n** Ouoh aritten `nem`psa tyren pennyb@ e;reneracpazec;e `nneneryou qen ouvi e;ouab. E`pjinten[i qen oumetathitten `e`ph  ومسرة الروح القدس المحيي المساوي لك الآن وكل أوان وإلى دهر الدهور كلها آمين\"\nيقول الشماس\n\"قبلوا بعضكم بعضًا بقبلة مقدسة يا رب إرحم يا رب إرحم نعم يا رب الذي هو يسوع المسيح إبن الله اسمعنا وإرحمنا تقدموا على الرسم، قفوا برعدة وإلى الشرق أنظروا فلنقف حسنًا لنقف بتقوي لنقف باتصال لنقف بسلام بطلبة وشكر بهدوء وسكوت إرفعوا عيونكم إلى ناحية المشرق لتنظروا المذبح وجسد ودم عمانوئيل إلهنا موضوعين عليه الملائكة ورؤساء الملائكة قيام السيرافيم ذوو الستة الأجنحة والشاروبيم الممتلئون أعينًا يسترون وجوههم من أجل بهاء عظمة مجده غير المنظور ولا منطوق به يسبحون بصوت واحد صارخين قائلين قدوس قدوس قدوس رب الصاباؤوت السماء والأرض مملوءتان من مجدك الأقدس\"\nوهنا يقبل الكهنة والشعب بعضهم بعضًا\nويقول الشعب\n\"بشفاعات والدة الإله القديسة مريم، يا رب أنعم لنا بمغفرة خطايانا، نسجد لك أيها المسيح مع أبيك الصالح، والروح القدس، لأنك أتيت وخلصتنا رحمة السلام ذبيحة التسبيح\"\nصلاه صلح اخرى\nالقداس الغريغوري\nالخولاجي\nصلاة الصلح\n"},{"n":"4- صلاه صلح أخرى","t":"الكاهن:\nأيها المسيح ألهنا القوة المخوقة، غير المفهومة التي لله الآب. الجالس فوق العرش الملتهب الشاروبيمي، والمخدوم من القوات النارية. وأنت نارٌ آكلةٌ كإله. من أجل تنازلك الغير الموصوف، ومحبتك للبشر، لم تحرق الدافع الغاش عندما دنا منك.\n** Priest:\n** O Christ, our God, the fearful and incomprehensible power of God the Father, who sit upon the flaming throne of the Cherubim who are served by the fiery powers; and You, as God, are a consuming fire. Because of the ineffable condescension and love towards mankind, You did not burn the guileful traitor when he drew near to You.\n** Pi`precbuteroc@\n** P=,=c Pennou] ]jom etoi `nho] ouoh nat`ska] `eroc `nte V] `Viwt Vyethemci ca`pswi `mpi`;ronoc etoi `nsah `nte ni<eroubim@ ouoh `etousemsi `mmof hiten nijom etoi `n`,rwm@ ouoh ekoi `n,rwm efouwm hwc nou]. E;be tekjin`i e`qryi `nat`scaji `mmoc nem tekmetmairwmi@ `mpekrwkh `mpi`prodotyc `nrefer`,rof@ qen `pjin`;refqwnt `erok.\nبل قبّلته قبلة المصاحبة، جاذباً إياه إلي التوبة ومعرفة جسارته. إجعلنا مستحقين نحن أيضاً يا سيدنا في هذه الساعة المخوفة، ب
