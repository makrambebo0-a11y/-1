penjin`i `ebol `nqytf@ hina `nten`sjemjom `e`wsem `nni`co;nef tyrou et[eryout `n`,rwm `nte piDiaboloc. Ouoh nahmen `ebolha pipethwou nem nef`hbyou`i@ qen P=,=c I=y=c pen=o=c.\nصلاة القسمة للآب\nيقول الكاهن قسمة القداس الكيرلسي للآب..\nوأثناء ختام الصلاة الربانية يقول الكاهن هذه الصلاة للآب سرًا:\n(نعم نسألك يا الله الاب ضابط الكل لا تدخلنا في تجربة لكن نجنا من الشرير فالأفعال المتنوعة التي لإبليس إطرحها عنا والسعايات الكائنة بمشورة الناس الأشرار إجعلها كلها كلا شيء وحصنا كل حين بيمينك المحيية لأنك أنت هو معيينا وناصرنا بالمسيح يسوع ربنا هذا الذي من قبله المجد والكرامة والعز والسجود يليق بك معه مع الروح القدس المحيي المساوي لك الآن وكل أوان وإلى دهر الدهور كلها آمين)\n(أو يقول هذه الصلاة بدلًا من السابقة)\n(نعم نسألك أيها الرب إلهنا لا تدخل أحدًا منا في تجربة هذه التي لا نستطيع أن نتحملها من أجل ضعفنا بل والتجربة أيضًا أعطنا ان نخرج لكي نستطيع أن نطفئ جميع السهام المتقدة نارًا التي لإبليس ونجنا من الشرير وأعماله بالمسيح يسوع ربنا هذا الذي من قبله ...)\nالجسد المقدس / بى سوما اثئواب\nيا الله الذى احبنا\nالقداس الكيرلسي\nالخولاجي\n"},{"n":"40- يا الله الذي أحبنا","t":"الشماس:\n** Deacon:\n** Pidiakwn@\nإحنوا رؤوسكم للرب.\n** Bow your heads to the Lord.\n** Tac kevalac `umwn tw Kuriw `klinnate.\nالشعب:\n** People:\n** Pilaoc@\nأمامك يا رب.\n** Before You, O Lord.\n** `Enwpion cou Kurie.\nالكاهن (سراً):\n** Priest Inaudibly:\n** Pi`precbuteroc@\nيا الله الذي أحبنا هكذا وأنعم علينا برتبة البنوة، لكيْ نُدعى أبناء الله. ونحن وارثون لك يا الله الآب، وشركاء في ميراث مسيحك.\n** O God, who loved us so, and granted us the rank of sonship that we may be called the sons of God, and that we may be heirs of You, O God, the Father, and sharers of the inheritance of Your Christ.\n** `V] vy`etafmenriten `mpairy]@ ouoh afer`hmot nan `mpiaxiwma `nte ]metsyri@ hina `ncemou] `eron je nisyri `nte `V]@ ouoh `anon hanouon han`klyronomoc men `ntak `V] `vIwt@ han`svyr `n`klyronomoc de `nte Pek`,rictoc.\nأمل أذنك يا رب، وأسمعنا نحن الخاضعين لك. طهر إنساننا الداخلي كطُهر إبنك الوحيد، هذا الذي نري  وشركاء في الشكل وشركاء في خلافة مسيحك هذا الذي انت مبارك معه مع الروح القدس المحيي المساوي لك الآن وكل اوان ... إلخ.)\nننصت بخوف الله\nيقول الكاهن (جهرًا)\nالسلام للكل\nيقول الكاهن صلاة تحليل الأب سرًا\n(أيها السيد الرب الإله ضابط الكل شافي نفوسنا.. إلى أخره كما جاء في القداس الباسيلي) ثم يكمل كالعادة كما جاء في قداس القديس باسيليوس وإنما بعد التناول من الأسرار المقدسة يغسل يديه وهو يقول الصلاة الآتية:\nيقول الشماس\nصلوا من أجل التناول باستحقاق من الأسرار المقدسة الطاهرة السمائية.\nيا رب إرحم\nصلاه شكر / صرف الشعب\nالقداس الكيرلسي\nالخولاجي\nصلاه القسمه للاب\n"},{"n":"41- صلاة شكر / صرف الشعب","t":"ثم يقول الكاهن صلاة شكر من بعد تناول الأسرار المقدسة:\n(أية بركة وأى تسبيح وأى شكر نستطيع أن نكافئك به يا الله محب البشر لأنك فيما نحن مطروحون لحكم الموت ومغموسون في حفرة خطايانا انعمت لنا بالحرية وأعطيتنا من هذا الطعام غير المائت السمائي واظهرت لنا جميع هذا السر هذا المخفي منذ الدهور والأجيال لكي تظهر الان حكمتك المتنوعة للرؤساء والسلاطين في السماويات من قبل الكنيسة\nيا الله الذي يدبر اعمالنا بحكمة وأكثر من الحد الذي نستطيع أن ندركه ما هذه الرأفة كلها وما هذا الاهتمام العظيم الذي لأبوتك وما هذه اللجة التي لصلاحك بالحقيقة انت الذي ينبغي لك كل المجد والعظمة والعز والسلطان قبل كل الدهور أيها الآب والإبن والروح القدس الآن وكل أوان.)\nيقول الشماس\nاحنوا رؤوسكم للرب\nيقول الشعب\nامامك يا رب\nيقول الكاهن صلاة خضوع بعد القربان ليوحنا المثلث الطوبي\n(أنت الذي وضعنا حياتنا عندك يا رب أيها الرب الذي يملأ الكل إحفظنا في كل موضع نحضر فيه والخشوع الذي صار لنا بالصلاة وطيب القلب في العمر المستقيم إحفظهما لنا بلا سارق ولا ندم لكي في كل زمان وكل مكان لربوبيتك ننظر إليك ونسألك في ما يرضيك وما تهواه لكي لا نخزي في يوم الحكم الحقيقي هذا الذي فيه ينال كل واحد مجازاة إذ تقف الملائكة ويدين إبنك الوحيد ربنا وإلهنا ومخلصنا يسوع المسيح هذا الذي من قبله المجد.. إلخ.)\nيا رب إرحم يا رب إرحم يا رب إرحم\nويعطي الكاهن التسريح للشعب ويقول البركة ويوزع عليهم البركة ويصرفهم بسلام.\nفهرس قداس القديس كيرلس\nالقداس الكيرلسي\nالخولاجي\nيا الله الذى احبنا\n"}]},{"n":"صلوات القسم المقدسة في القداس الإلهي","p":[{"n":"1- القسمة الوجيزة","t":"** `Vnou] vy`etafer`hmot nan `anon qa nirefernobi nou`pro;ecmia `noujai nem ousouswousi `nlogikon ouoh `n`epouranion `ete Picwma `nNou] pe nem Pi`cnof ettaiyout `nte Pek`,rictoc. Vai `etafswpi nan `noutoubo nem ououjai nem ou,aricma nem ou,w `ebol `nte nenobi je hina qen oumetrefsepe`hmot `ntews oubyk `Viwt e;ouab etqen nivyou`i ouoh `ntenjoc. Je Peniwt..\nإفنوتي فيئيتاف إيرإيهموت نان\nأنون خاني ريف إيرنوفي إنؤو\nإبروت إسميا إنؤوجاي نيم اوشو\nشؤوش إنلوجيكون اووه إن إيبورانيون.\nإيتي بي سوما عن نوتي\nبي نيم بي إسنوف أتطايوت إنتي بيك إخرستوس فاى إيطاف شوبي نان\nإن او طوفو نيم أو اوجاي نيم اوخاريسما إن أوطوفونيم أوأوجاي نيم او خاريسما نيم اوكو إيفول إنتي ني نوفي.\nجي هينا خين او ميتريف\nشيبئهموت إنتيى اوشي أوفيك\nإفيوت غثؤواب إيتخين ني فيؤوي\nاووه إنتين جوس جي بينيوت.\nيا الله الذي أنعم\nعلينا نحن الخطاة\nبميقات ([1]) الخلاص\nوذبيحة ناطقة سمائية.\nالتي هي الجسد الإلهي\nوالدم الكريم اللذان\nلمسيحك. هذا الذي\nصار لنا طهرًا وخلاصًا\nونعمة وغفرانًا للخطايا.\nلكي بشكر نصرخ\nنحوك أيها الآب\nالقدوس الذي في\nالسموات ونقول\nيا أبانا الذي في السموات..\nيا الله الذي أنعم علينا نحن الخطاة. بميقات الخلاص وذبيحة ناطقة سمائية. التي هي الجسد الإلهي والدم الكريم اللذان لمسيحك. هذا الذي صار لنا طهرًا وخلاصًا ونعمة وغفرانًا للخطايا. لكي بشكر نصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات....\nقسمه النيروز\nصلاة القسمة\nالخولاجي\nفهرس نص صلوات القسم المقدسة\n"},{"n":"2- قسمة النيروز (تُقال في أعياد رأس السنة القبطية)","t":"فلنسبح الله تسبيحًا تسبيحًا جديدًا ولنبشر بخلاصه كل الأيام، ولنمجده كل حين لأنه هو إلهنا ونحن شعبه وغنم رعيته (+) الذي تحنن علينا وجددنا وأصعدنا من العمق إلى النور، وأعتقنا من الموت وأنعم علينا بالعتق من العبودية وجعل ظلمة الضلالة التي فينا تضيء من قبل إتيان ابنه الوحيد بالجسد. أما يسوع ربنا فإنه جاء إلى الناصرة ودخل إلى المجمع في السبت كعادته وقام ليقرأ ما دفع إليه من سفر إشعياء النبي، فلما فتح السفر وجد الموضع المكتوب فيه أن روح الرب على لأنه مسحني لأبشر المساكين وأرسلني لأشفي منكسري القلوب لأنادي للمأسورين بالإطلاق وللعميان بالبصر، وأرسل المنسحقين في الحرية وأكرز بسنة الرب المقبولة. نؤمن ونصدق يا سيدنا ونسألك أن تنعم علينا بغفران خطايانا وثبتنا في الإيمان الحقيقي بالثالوث القدوس كما كنت مع آبائنا الرسل المكرمين والأبرار والصديقين والشهداء الأطهار الذين سفكوا دماءهم من أجل اسم المسيح ونالوا الأكاليل النورانية ولباس الصليب هكذا نحن أيضًا الخطاة الضعفاء نطلب إليك يا الله محب البشر بارك إكليل هذه السنة بصلاحك وطهرنا من كل دنس الجسد والروح واجعلنا مستحقين أن ننال من خيراتك غير الموصوفة خلاصًا لنفوسنا وأجسادنا وأرواحنا لكي بقلب طاهر ونفس مستنيرة نجسر بدالة بغير خوف أن نصرخ نحوك أيها الآب القدوس الذي في السموات ونقول أبانا الذي في السموات..\nلنسبح الله تسبيحًا جديدًا, ولنبشر بخلاصة كل الأيام ولنمجده كل حين لأنه هو إلهنا ونحن شعبة وغنم رعيته. الذي تحنن علينا وجددنا وأصعدنا من العمق إلى النور وأعطانا الحياة من الموت. وأنعم علينا بالعتق من العبودية, وجعل ظلمة الضلالة التي فينا تضيء من قبل إتيان ابنة الوحيد بالجسد. أما يسوع ربنا فانه جاء إلى الناصرة ودخل إلى المجمع في السبت كعادته, وقام ليقرأ فدفع إليه سفر إشعياء النبي, فلما فتح السفر وجد الموضع المكتوب فيه أن روح الرب على, لهذا مسحني وأرسلني لأبشر المساكين وأنادى للمسبيين بالعتق , وللعميان بالبصر ولأرسل إلى المأسورين بالإطلاق وأكرز بسنة الرب المقبولة. نؤمن ونصدق يا سيدنا ونسألك أن تنعم علينا بغفران خطايانا, وتثبتنا في الإيمان الحقيقي الثالوث القدوس كما كنت مع آبائنا الرسل المكرمين والأبرار والصديقين ولباس الصليب والشهداء الأطهار الذين سفكوا دماؤهم من أجل اسم المسيح ونالوا الأكاليل النورانية. هكذا نحن أيضا الخطاة الضعفاء نطلب إليك يا الله محب البشر بارك إكليل هذه السنة بصلاحك , وطهرنا من كل دنس الجسد والروح واجعلنا مستحقين أن ننال من خيراتك غير الموصوفة خلاصا لنفوسنا وأجسادنا وأرواحنا. لكي بقلب طاهر ونفس مستنيرة نجسر بداله بغير خوف أن نصرخ نحوك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.....\nقسمة اعياد العدراء والملائكه والسمائيين\nصلاة القسمة\nالخولاجي\nالقسمة الوجيزه للآب تقال سنويا\n(+) أنا يا رب غصن في شجرة غنم رعيتك.. أسبحك وتسبيحي لك جديد من قلب يتجدد فيه الفرح كل حين بثباته فيك أيها الكرمة الحقيقية.\n"},{"n":"3- قسمة تقال في أعياد العذراء والملائكة والسمائيين (وتقال في أي وقت)","t":"هوذا كائن معنا على هذه المائدة اليوم عمانوئيل إلهنا، حمل الله الذي يحمل خطية العالم كله.\n** Behold, Emmanuel our God, the Lamb of God who takes away the sin of the whole world, is with us today on this table;\n** Hyppe `f,y neman hijen taitrapeza `mvoou `nje Emmanouyl Pennou]@ Pihiyb `nte `Vnou] vyet`wli `mvnobi `mpikocmoc tyrf.\nالجالس على عرش مجده.\n** who sits on the throne of His glory\n** Vyethemci hijen pi`;ronoc `nte pef`wou.\nالذي تقف أمامه جميع الطغمات السمائية، الذي تسبحه الملائكة بأصوات البركة، ويخر ويسجد له رؤساء الملائكة.\n** and before whom stand all the heavenly orders; whom the angels praise with voices of blessing and before whom the archangels fall down and worship.\n** Vyetou`ohi `eratou nahraf `nje nitagma tyrou `n`epouranion@ vy`etouhwc `erof `nje niaggeloc qen ni`cmy `nte pi`cmou@ ouoh euhitou euouwst `mmof `nje niar,yaggeloc.\nالأربعة الكائنات غير المتجسدين يقولون تسبحة الثلاثة التقديسات.\n** The four incorporeal creatures sing the hymn of the Trisagion.\n** Pi`ftou `nzwon `n`acwmatoc cejw `mpihumnoc `nte pi`tricagioc.\nوالأربعة والعشرون قسيساً جلوس على كراسيهم، وأربعة وعشرون إكليل ذهب على رؤوسهم، وأربعة وعشرون جاماً من ذهب في أيديهم، مملوءة بخوراً الذي هو صلوات القديسين، ويسجدون أمام الحيْ إلى أبد الآبدين.\n** And the twenty-four priests are seated on their thrones, with twenty-four golden crowns upon their heads and in their hands twenty-four golden bowls full of incense, which are the prayers of the saints. They fall down before Him who lives forever and ever.\n** Ouoh pijout `ftou `m`precbuteroc cehemci hijen nou`;ronoc@ `ere jout `ftou `n`,lom `nnoub hijen nou`avyou`i@ `ere jout `ftou `mvu`aly `nnoub qen noujij eumeh `n`c;oinoufi@ `ete ni`proceu,y `nte ni`agioc@ ouoh ceouwst `mpe`m;o `mvyetonq sa `eneh `nte pi`eneh.\nوالمائة وأربعون ألفاً البتولين غير الدنسين يسبحون الرب قائلين: \"قدوس. قدوس. قدوس. آمين. الليلويا.\"\n** And the hundred and forty-four thousand undefiled virgins praise the Lord, saying, “Holy, holy, holy. Amen. Alleluia.”\n** Ouoh pise `hme `ftou `nso (pi=r=m=d) nipar;enoc `nat;wleb cehwc `e`P[oic eujw `mmoc@ je `agioc `agioc `agioc@ `amyn@ allylouia.\nونحن أيضاً نسجد للثالوث القدوس، ونسبحه قائلين:\n** And we also worship the Holy Trinity, praising Him, saying,\n** `Anon de hwn tenouwst `n}`triac e;ouab enhwc `eroc enjw `mmoc.\n\"قدوس الله الآب ضابط الكل. آمين. الليلويا.\n** “Holy is God the Father, the Pantocrator. Amen. Alleluia.\n** Je `fouab `nje `Vnou] `Viwt Pipantokratwr@ `amyn@ allylouia.\nقدوس ابنه الوحيد يسوع المسيح ربنا. آمين. الليلويا.\n** Holy is His only-begotten Son, Jesus Christ our Lord. Amen. Alleluia.\n** `Fouab `nje pefmonogenyc@ `nSyri Iycouc Pi`,rictoc Pen[oic@ `amyn@ allylouia.\nقدوس الروح القدس الباراقليط. آمين الليلويا.\"\n** Holy is the Holy Spirit, the Paraclete. Amen. Alleluia.”\n** `Fouab `nje Pi`pneuma E;ouab `mparaklyton@ `amyn@ allyloua.\nمقدسة ومملوءة مجداً والدة الإله الطاهرة القديسة مريم العذراء. آمين. الليلويا.\n** Holy and full of glory is the holy Theotokos, Saint Mary, the Virgin. Amen. Alleluia.\n** `Couab ouoh `cmeh `n`wou `nje };e`otokoc e;ouab ]`agia Maria }par;enoc@ `amyn allylouia.\nمقدسة ومملوءة مجداً، هذه الذبيحة التي ذبحت عن حياة العالم كله. آمين. الليلويا.\n** Holy and full of glory is this sacrifice, which has been slain for the life of the whole world. Amen. Alleluia.\n** `Couab ouoh `cmeh `n`wou `nje tai;ucia@ ;y`etausatc qa `pwnq `mpikocmoc tyrf@ `amyn allylouia.\nمن أجل هذا صرخ مخلصنا الصالح قائلا: \"إن جسدي هو مأكل حق، ودمي مشرب حق.\n** Therefore, our good Savior proclaimed, saying, “My Body is food indeed and My Blood is drink indeed.\n** E;be vai `a Pencwtyr `n`aga;oc ws `ebol efjw mmoc@ je Pacwma ou`qre `mmyi te@ ouoh Pa`cnof oucw `mmyi pe.\nمَنْ يأكل جسدي ويشرب دمي يكون في وأنا أيضاً أكون فيه.\"\n** He who eats My Body and drinks My Blood dwells in Me, and I in him.”\n** Vye;ouwm `mPacwma ouoh etcw `mPa`cnof ef`eswpi `nqyt@ ouoh `anok hw ei`eswpi `nqytf.\nنسألك يا سيدنا، طهر نفوسنا وأجسادنا، وأرواحنا.\n** We ask You, O our Master, purify our souls, our bodies, and our spirits,\n** Ten]ho `erok Pennyb matoubo `nnen'u,y nem nencwma nem nen`pneuma.\nلكيْ بقلب طاهر، وشفتين نقيتين، ونفس مستنيرة، ووجه غير مخزي، وإيمان بلا رياء، ونية نقية، وصبر كامل، ورجاء ثابت.\n** so that with a pure heart, cleansed lips, an enlightened soul, an unashamed face, a faith unfeigned, a pure conscience, a perfect patience, and a firm hope,\n** Je hina qen ouhyt efouab@ nem han`cvotou eutoubyout@ nem ou'u,y `eac[iouwini@ nem ouho `nat[isipi@ nem ounah] `natmetsobi@ nem oucunidycic ectoubyout@ nem ouhupomony ecjyk ebol@ nem ouhelpic ectajryout.\nنجسر بدالة بغير خوف، أن نطلب إليك يا الله الآب القدوس الذي في السموات، ونقول \"أبانا الذي في السموات...\"\n** we may dare with boldness, without fear, to pray to You, O God the holy Father who are in the heavens, and say, “Our Father....”\n** `Ntenertolman qen ouparrycia naterho] `etwbh `mmok@ `Vnou] `Viwt e;ouab et qen nivyou`i@ ouoh `ejoc@ je Peniwt....\nهوذا كائن معنا على هذه المائدة اليوم عمانوئيل إلهنا حمل الله الذي يحمل خطية العالم كله. الجالس على كرسي مجده الذي يقف أمامه جميع الطغمات السمائية، الذي تسبحه الملائكة بأصوات البركة ويخر ويسجد له رؤساء الملائكة، الأربعة الحيوانات غير المتجسدين يقولون تسبحه الثلاثة التقديسات، والأربعة والعشرون قسيسًا على كراسيهم وأربعة وعشرون إكليل ذهب على رؤوسهم وأربعة وعشرون جامًا من ذهب في أيديهم مملوءة بخورًا الذي هو صلوات القديسين، ويسجدون أمام الحي إلى أبد الآبدين.\nوالمائة وأربعة وأربعون ألفا البتوليون غير الدنسين يسبحون الرب قائلين: قدوس قدوس قدوس آمين الليلويا ([1]) بسم الآب والابن والروح القدس الإله الواحد آمين الليلويا(1) ونحن أيضًا نسجد للثالوث الأقدس ونسبحه قائلين: قدوس الله الآب ضابط الكل آمين الليلويا (1) مقدسة ومملوءة مجدًا والدة الإله الطاهرة القديسة مريم العذراء أمين الليلويا قدوس ابنه الوحيد يسوع المسيح ربنا آمين الليلويا (1) قدوس الروح القدس الباراقليط آمين الليلويا(1) من أجل هذا صرخ مخلصنا الصالح قائلًا: إن جسدي هو مأكل حق، ودمي هو مشرب حق من يأكل جسدي ويشرب دمي يكون في وأنا أيضًا أكون فيه.\nنسألك يا سيدنا طهر أنفسنا وأجسادنا وأرواحنا لكي يقلب طاهر وشفتين نقيتين ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ونية نقية وصبر كامل ورجاء ثابت نجسر بدالة بغير خوف أن نطلب إليك أيها الآب القدوس الذي في السموات ونقول أبانا الذي في السموات.. إلخ.\nهوذا كائن معنا على هذه المائدة اليوم عمانوئيل إلهنا حمل الله الذي يحمل خطية العالم كله. الجالس على كرسي مجدة. الذي تقف أمامه جميع الطغمات السمائية. الذي تسبحة الملائكة بأصوات البركة ويخر ويسجد له رؤساء الملائكة. الأربعة الحيوانات الغير المتجسدين يقولون تسبحة الثلاث تقديسات. والأربعة والعشرون قسيسا جلوس على كراسيهم, وأربعه وعشرون إكليل ذهب على رؤوسهم وأربعه وعشرون جامًا من ذهب في أيديهم, مملوءة بخورًا الذي هو صلوات القديسين ويسجدون أمام الحي إلى أبد الآبدين. والمئة والأربعة والأربعون ألفا البتوليون الغير الدنسين, يسبحون الرب قائلين, قدوس قدوس قدوس آمين الليلويا. ونحن أيضا نسجد للثالوث القدوس ونسبحه قائلين: قدوس الله الآب ضابط الكل, آمين الليلويا. قدوس ابنة الوحيد يسوع المسيح ربنا آمين الليلويا. قدوس الروح القدس البراقليط, آمين الليلويا. مقدسه ومملوءة مجدًا والدة الإله الطاهرة القديسة مريم العذراء, آمين الليلويا. مقدسة ومملوءة مجدا هذه الذبيحة التي ذبحت عن حياة العالم كله, آمين الليلويا. من أجل هذا مخلصنا الصالح صرخ قائلا: إن جسدي هو مأكل حق ودمى هو مشرب حق. من يأكل جسدي ويشرب دمى يكون فيه وأنا أيضا أكون فيه. نسألك يا سيدنا طهر أنفسنا وأجسادنا وأرواحنا. لكي بقلب طاهر وشفتين نقيتين ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ونية نقية وصبر كامل ورجاء ثابت. نجسر بداله بغير خوف أن نطلب إليك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات...\n"},{"n":"4- قسمة تُقال في صوم الميلاد وعيد الميلاد وسنوي","t":"أيها السيد الرب إلهنا الخالق، غير المرئي، غير المحوى، غير المستحيل، غير المفحوص. الذي أرسل نوره الحقيقي، ابنه الوحيد يسوع المسيح، الكلمة الذاتي.\n** O Master, Lord our God, co-creator, the invisible, the infinite, unchangeable, and immeasurable, who has sent His true Light, His only-begotten Son, Jesus Christ the co-eternal Logos.\n** `Vnyb `P[oic Pennou] Pidymiourgoc `n`a`oratoc Pi`a,writoc `natreptoc ke `ametritoc. Vy`etafouwrp `mpefouwini `n`aly;inoc pefmonogenyc `nSyri Iycouc Pi`,rictoc Pilogoc `naidioc.\nالكائن في حضنه الأبوي كل حين، أتي وحل في الحشاء البتولي غير الدنس، ولدته وهي عذراء، وبتوليتها مختومة (وبكوريتها دائمة).\n** He who is in the Fatherly bosom at all times has come down and dwelt in the undefiled virginal womb. She, being virgin, gave birth to Him, and her virginity is sealed.\n** Vyet,y qen kenf `mpatrikon diapantoc af`i afswpi qen ]mytra `mpar;eniky `amoluntoc acmacf ecoi `mpar;enoc ectob `nje tecpar;enia.\nإذ الملائكة تسبحه، وأجناد السموات ترتل له، صارخين قائلين: \"قدوس، قدوس، قدوس. رب الجنود، السماء والأرض مملوءتان من مجدك الأقدس.\"\n** Lo, the angels praise Him, and the heavenly hosts chant to Him, proclaiming and saying, \"Holy, holy, koly, is the Lord of hosts. Heaven and earth are full of Your holy glory.”\n** `Ere niaggeloc hwc `erof nem ni`c`tratia `nte na nivyou`i erhumnoc `erof euws `ebol eujw `mmoc@ je `agioc `agioc `agioc Kurioc cabaw; `o ouranoc ke `ygy meh `ebol qen pek`wou e;ouab.\nهكذا أيضاً نحن الضعفاء، الخطاة، اجعلنا مستحقين معهم يا سيدنا الصالح محب البشر. لكي بقلب طاهر، نسبحك معه مع الروح القدس، الثالوث القدوس المساوي، ونرفع أعيننا إلى فوق، إليك أيها الآب القدوس الذي في السموات ونقول:\n** Likewise, we too, the weak and sinful, make us worthy with them, O our Master, the Good One and Lover of Mankind, that with a pure heart we may praise You, with Him and the Holy Spirit. The co-essential Trinity and raise our eyes towards You, our holy Father, who are in the heavens, and say,\n** Pairy] `anon hwn qa nijwb `nrefernobi `ariten `nem`psa nemwou Pennyb Pi`aga;oc ouoh `mmairwmi. Hina qen ouhyt `fouab `ntenhwc `erok nemaf nem Pi`pneuma E;ouab@ }`triac e;ouab `n`omooucioc ouoh `ntenfai `nnenbal `e`pswi harok `Viwt e;ouab et qen nivyou`i ouoh `ntenjoc.\nأيها السيد الرب إلهنا الخالق غير المرئي غير المحوى غير المستحيل غير المفحوص الذي أرسل نوره الحقيقي ابنه الوحيد يسوع المسيح الكلمة الذاتي الكائن في حضنه الأبوي كل حين أتي وحل في الحشاء البتولي غير الدنس ولدته وهي عذراء وبتوليتها مختومة إذ الملائكة تسبحه وأجناد السموات ترتل له صارخين قائلين: قدوس قدوس قدوس رب الجنود السماء والأرض مملوءتان من مجدك المقدس. هكذا أيضا نحن الضعفاء الخطاة اجعلنا مستحقين معهم يا سيدنا الصالح محب البشر لكي بقلب طاهر نسبحك معه مع الروح القدس الثالوث المقدس المساوي. نرفع أعيننا إلى فوق إليك أيها الآب القدوس الذي في السموات ونقول يا أبانا الذي في السموات.. إلخ.\nأيها السيد الرب إلهنا الخالق الغير المرئي الغير المحوى الغير المستحيل, الغير المفحوص. الذي أرسل نوره الحقيقي ابنة الوحيد يسوع المسيح الكلمة الذاتي. الكائن في حضنه الأبوي كل حين, أتى وحل في الحشا البتولي الغير الدنس, ولدته وهى عذراء وبتوليتها مختومة. إذ الملائكة تسبحة وأجناد السموات ترتل له صارخين قائلين قدوس قدوس قدوس رب الصباؤوت السماء والأرض مملوءتان من مجدك المقدس. هكذا أيضا نحن الضعفاء الخطاة اجعلنا مستحقين معهم يا سيدنا الصالح محب البشر. لكي بقلب طاهر نسبحك معه مع الروح القدس الثالوث القدوس المساوي ونرفع أعيننا إلى فوق إليك أيها الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.....\nقسمة عيد الغطاس وسنوي\nصلاة القسمة\nالخولاجي\nقسمة اعياد العدراء والملائكه والسمائيين\n"},{"n":"5- قسمة عيد الغطاس وسنوي","t":"إذ أعطيتنا نعمة البنوة بحميم الميلاد الجديد، وتجديد الروح القدس.\n** As You have bestowed upon us the grace of sonship through the washing of regeneration and renewing of the Holy Spirit,\n** `Eak] nan `mpi`hmot `nte ]metsyri@ hiten pijwkem `nte piou`ahemmici@ nem ]metberi `nte Pi`pneuma E;ouab.\nالآن أيضاً اجعلنا مستحقين، بغير رياء، وقلب طاهر، ونية مملوءة دالة، وشفتين غير ساقطتين، أن نطلب إليك يا أبا الآب.\n** so make us worthy, now, that without hypocrisy, with a pure heart, a conscience full of boldness, and unerring lips, that we may entreat you, O Abba Father.\n** Ouoh ]nou on `ariten `nem`psa qen oumetatsobi@ nem ouhyt efouab nem oucunidycic ecmeh `mparrycia@ nem han`cvotou `nathei e;rentwbh `mmok abba `Viwt.\nلكي إذ تركنا كثرة كلام الأمم الباطل واستكبار اليهود.\n** So that, having abandoned the excessive vain words of the heathen and the vanity of the Jews,\n** Hina `ean,w `e`qryi `n]met`e`vlyou `nte ]metrefkemys `ncaji `nte nie;noc@ nem ]metrefhi`pho `nte Niioudai.\nنستطيع أن نقدم لك سؤال الصلاة، كشريعة ابنك الوحيد المملوءة خلاصاً.\n** we may be able to offer You the supplication of prayer according to the statute of Your only-begotten Son, which is full of salvation.\n** `Nten`sjemjom `n`ini nak `eqoun `mpi]ho `nte ]`proceu,y@ kata ]nomo;ecia e;meh `noujai `nte pekmonogenyc `nSyri\nفبصوت متواضع يليق بالمسيحيين، وبطهارة النفس والجسد والروح.\n** So with a humble voice befitting Christians, and with purity of soul, body, and spirit,\n** Qen ou`cmy men ec;ebiyout ecer`prepi `nni`,rictianoc qen outoubo de `nte ]'u,y nem picwma nem pi`pneuma.\nنجسر بدالة بغير خوفٍ أن نصرخ إليك أنت غير المخلوق ولا مبتدئ ولا مولود، سيد كل أحد، الله الآب القدوس الذي في السموات، ونقول: \"أبانا الذي...\"\n** we dare without fear to cry to You who are uncreated, without beginning, and unbegotten, the Master of everyone, God the holy Father, who are in the heavens, and say: \"Our Father....\"\n** `Ntenertolman qen oumetatho] `ews oubyk@ `n;ok piatcontf ouoh `natar,y ouoh `nat`jvof@ `Vnyb `nouon niben@ `Vnou] `Viwt e;ouab et qen nivyou`i ouoh `ejoc@ je Peniwt...\nإذ أعطيتنا نعمة البنوة بحميم الميلاد الجديد، وتجديد الروح القدس، الآن أيضًا اجعلنا مستحقين بغير رياء وقلب طاهر ونية مملوءة دالة وشفتين غير ساقطتين أن نطلب إليك يا أبا الآب لكي إذ تركنا كثرة كلام الأمم الباطل واستكبار اليهود نستطيع أن نقدم لك توسل الصلاة كشريعة ابنك الوحيد المملوءة خلاصًا فبصوت متواضع يليق بالمسيحيين وبطهارة النفس والجسد والروح نجسر بغير خوف أن نصرخ إليك أنت غير المخلوق ولا مبتدئ ولا مولود سيد كل احد الله الآب القدوس الذي في السموات ونقول أبانا الذي في السموات.. إلخ.\nإذ أعطيتنا نعمه البنوة بحميم الميلاد الجديد وتجديد الروح القدس. والآن أيضا اجعلنا مستحقين بغير رياء, وقلب طاهر ونية مملوءة دالة وشفتين غير ساقطتين أن نطلب إليك يا آبا الآب. لكي إذ تركنا كثرة كلام الأمم الباطل واستكبار اليهود. نستطيع أن نقدم لك سؤال الصلاة كشريعة ابنك الوحيد المملوءة خلاصًا. فبصوت متواضع يليق بالمسيحيين وبطهارة النفس والجسد والروح. نجسر بغير خوف أن نصرخ إليك أنت الغير المخلوق ولا مبتدئ ولا مولود سيد كل أحد, الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات........\nصلاة القسمة\nالخولاجي\nقسمة للآب في الصوم الكبير\nقسمة صوم الميلاد وعيد الميلاد وسنوى\n"},{"n":"6- قسم للآب تقال في الصوم الكبير","t":"أيها السيد الرب الإله ضابط الكل، الذي أرسل ابنه الوحيد إلى العالم. وعلمنا الناموس والوصايا المكتوبة في الإنجيل المقدس.\n** O Master, Lord God the Pantocrator, who sent His Only-Begotten Son into the world; He taught us the Law and commandments written in the Holy Gospel.\n** `Vnyb `P[oic `Vnou] Pipantokratwr vy`etafouwrp `mpefmonogenyc `nSyri `epikocmoc af`tcabo `mmon `ePinomoc nem nientoly et`cqyout qen pieuaggelion e;ouab.\nوعلمنا أن الصوم والصلاة هما اللذان يخرجان الشياطين، إذ قال: إن هذا الجنس لا يخرج بشيء إلا بالصلاة والصوم.\n** And He taught us that fasting and prayer cast out demons, when He said, “This kind cannot come out by anything, but by prayer and fasting.”\n** Ouoh af`tcabon je ]nyctia nem pi`slyl ne ny`esauhiou`i `nnidemwn `ebol `eafjoc je pai genoc `mpaf`i `ebolqen `hli `ebyl `nou`proceu,y nem ounyctia.\nالصوم والصلاة هما اللذان رفعا إيليا إلى السماء، وخلصا دانيال من جب الأسود.\n** Fasting and prayer are those which raised Elijah to heaven and saved Daniel from the lions’ den.\n** }nyctia nem pi`slyl ne ny`etau`wli `nYliac `e`pswi `e`tve ouoh aunohem `nDaniyl `ebolqen `vlakkoc `nnimou`i.\nالصوم والصلاة هما اللذان عمل بهما موسى، حتى أخذ الناموس والوصايا المكتوبة بأصبع الله.\n** Fasting and prayer are those which Moses pursued until he received the Law and Commandments written with the finger of God.\n** }nyctia nem pi`slyl ne ny`eta Mw`ucyc erhwb `nqytou sa`ntef[i `mPinomoc nem nientoly et`cqyout qen pityb `nte `Vnou].\nالصوم والصلاة هما اللذان عمل بهما أهل نينوى، فرحمهم الله، وغفر لهم خطاياهم، ورفع غضبه عنهم.\n** Fasting and prayer are those which the people of Nineveh pursued until God had mercy on them and forgave them their sins, and lifted His wrath away from them.\n** }nyctia nem pi`slyl ne ny`eta Niremnineu`y erhwb `nqytou afnai nwou `nje `Vnou] ouoh af,a nounobi nwou `ebol af`wli `mpefjwnt `ebolharwou.\nالصوم والصلاة هما اللذان عمل بهم الأنبياء، وتنبأوا من أجل مجيء المسيح قبل مجيئه بأجيال كثيرة.\n** Fasting and prayer are those which the prophets pursued, and prophesied concerning the advent of Christ many generations before His coming.\n** }nyctia nem pi`slyl ne ny`eta ni`provytyc erhwb `nqytou auer`provyteuin e;be `pjin`i `mPi`,rictoc qajwf `mpefjin`i qen hanmys `njwou.\nالصوم والصلاة هما اللذان عمل بهم الرسل، وبشروا في جميع الأمم، وصيروهم مسيحيين، وعمدوهم باسم الآب والابن والروح القدس.\n** Fasting and prayer are those which the apostles pursued, until they preached to all nations and made them Christians, baptizing them in the Name of the Father and the Son and the Holy Spirit.\n** }nyctia nem pi`slyl ne ny`eta ni`apoctoloc erhwb `nqytou auhiwis qen nie;noc tyrou auaitou `n`,rictianoc au]wmc `mmwou qen `vran `m`Viwt nem `Psyri nem Pi`pneuma E;ouab.\nالصوم والصلاة هما اللذان عمل بهما الشهداء، حتى سفكوا دماءهم من أجل اسم المسيح، الذي اعترف الاعتراف الحسن أمام بيلاطس البنطي.\n** Fasting and prayer are those which the martyrs pursued until they shed their blood for the Name of Christ, who confessed the good confession before Pontius Pilate.\n** }nyctia nem pi`slyl ne ny`eta nimartyroc erhwb `nqytou sa`ntouvwn `mpou`cnof `ebol e;be `vran `mPi`,rictoc vy`etafer`omologin `n]`omologia e;nanec nahren Pontioc Pilatoc.\nالصوم والصلاة هما اللذان عمل بهما الأبرار والصديقون ولباس الصليب، وسكنوا في الجبال والبراري وشقوق الأرض، من أجل عظم محبتهم في الملك المسيح.\n** Fasting and prayer are those which the righteous and the just and the cross-bearers pursued until they dwelt in the mountains and deserts and holes of the earth because of their great love for Christ the King.\n** }nycti`a nem pi`slyl ne ny`eta ni`;myi nem nidikeoc nem ni`ctauravoroc erhwb `nqytou auswpi qen nitwou nem nisafeu nem ni,ol `nte `pkahi e;be tounis] `n`agapy eqoun `e`Pouro Pi`,rictoc.\nونحن أيضا فلنصم عن كل شر بطهارة وبر، ونتقدم إلى هذه الذبيحة المقدسة ونتناول منها بشكر. لكي بقلب طاهر، ونفس مستنيرة، ووجه غير مخزي، وإيمان بلا رياء، ومحبة كاملة، ورجاء ثابت.\n** And we too, let us fast from all evil, in purity and righteousness, and let us proceed forth to this Holy Sacrifice and partake of it with thanksgiving, so that with a pure heart, an enlightened soul, an unashamed face, a faith unfeigned, a perfect love, and a firm hope,\n** `Anon hwn marenernycteuin cabol `mpethwou niben qen outoubo nem oume;myi ouoh `nten] `mpenouoi `etai `agia `n;ucia `nten[i `ebol `nqytc qen ousepe`hmot je hina qen ouhyt efouab nem ou'u,y `eac[iouwini nem ouho `nat[isipi nem ounah] `natmetsobi nem ou`agapy ecjyk `ebol nem ouhelpic ectajryout.\nنجسر بدالة بغير خوف، أن ندعوك يا الله الآب القدوس الذي في السموات، ونقول \"يا أبانا...\"\n** we may dare with boldness, without fear, to pray to You, O God, the Holy Father, who are in the heavens, and say, \"Our Father...\"\n** `Ntenertolman qen ouparrycia `naterho] `etwbh `mmok `Vnou] `Viwt e;ouab et qen nivyou`i ouoh ejoc@ je Peniwt...\nأيها السيد الرب الإله ضابط الكل الذي أرسل ابنه الوحيد إلى العالم، علمنا الناموس والوصايا المكتوبة في الإنجيل المقدس، وعلمنا أن الصوم والصلاة هما اللذان يخرجان الشياطين إذ قال إن هذا الجنس لا يخرج بشيء إلا بالصلاة والصوم. الصوم والصلاة هما اللذان رفعا إيليا إلى السماء وخلصا دانيال من جب الأسود الصوم والصلاة هما اللذان عمل بهما موسي حتى أخذ الناموس والوصايا المكتوبة بإصبع الله. الصوم والصلاة هما اللذان عمل بهما أهل نينوى فرحمهم الله وغفر لهم خطاياهم ورفع غضبه عنهم الصوم والصلاة هما اللذان عمل بهما الأنبياء وتنبأوا من أجل مجيء المسيح قبل مجيئه بأجيال كثيرة الصوم والصلاة هما اللذان عمل بهما الرسل وبشروا في جميع الأمم وصيروهم مسيحيين، وعمدوهم باسم الآب والابن والروح القدس الصوم والصلاة هما اللذان عمل بهما الشهداء حتى سفكوا دماءهم من أجل اسم المسيح الذي اعترف الاعتراف الحسن أمام بيلاطس البنطي الصوم والصلاة هما اللذان عمل بهما الأبرار والصديقون ولباس الصليب وسكنوا في الجبال والبراري وشقوق الأرض من أجل عظم محبتهم في الملك المسيح ونحن أيضًا فلنصم عن كل سر بطهارة وبر، ونتقدم إلى هذه الذبيحة المقدسة ونتناول منها بشكر لكي بقلب طاهر، ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: يا أبانا الذي في السموات.... إلخ.\nأيها السيد الرب الإله ضابط الكل الذي أرسل ابنة الوحيد إلى العالم علمنا الناموس والوصايا المكتوبة في الإنجيل المقدس. وعلمنا أن الصوم والصلاة هما اللذان يخرجان الشياطين إذ قال أن هذا الجنس لا يخرج بشيء إلا بالصلاة والصوم. الصلاة والصوم هما اللذان رفعا إيليا إلى السماء وخلصا دانيال من جب الأسود. الصوم والصلاة هما اللذان عمل بهما موسى حتى أخذ الناموس والوصايا المكتوبة بإصبع الله. الصوم والصلاة هما اللذان عمل بهم أهل نينوى فرحمهم الله وغفر لهم خطاياهم ورفع غضبة عنهم. الصوم والصلاة هما اللذان عمل بهم الأنبياء وتنبأوا من أجل مجيء المسيح قبل مجيئه بأجيال كثيرة. الصوم والصلاة هما اللذان عمل بهما الرسل وبشروا في جميع الأمم وصيروهم مسيحيين وعمدوهم باسم الآب والابن والروح القدس. الصوم والصلاة هما اللذان عمل بهما الشهداء حتى سفكوا دماءهم من أجل اسم المسيح الذي اعترف الاعتراف الحسن أمام بيلاطس البنطي. الصوم والصلاة هما اللذان عمل بهما الأبرار والصديقون ولباس الصليب وسكنوا في الجبال والبراري وشقوق الأرض من أجل عظم محبتهم في الملك المسيح. ونحن أيضا فلنصم عن كل شر بطهارة وبر. ونتقدم بهذه الذبيحة المقدسة ونتناول منها بشكر. لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت. نجسر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.........\nصلاة القسمة\nالخولاجي\nقسمه للأبن في صوم الاربعين المقدسة\nقسمة عيد الغطاس وسنوي\n"},{"n":"7- قسم للابن تقال في صوم الأربعين المقدس","t":"أنت هو الله الرحوم مخلص كل أحد. الذي تجسد لأجل خلاصنا.\n** You are the merciful God, Savior of everyone, who were incarnate for our salvation,\n** `N;ok gar pe `Vnou] Pinayt Pirefcw] `nte ouon niben vy`etaf[icarx e;be penoujai.\nالذي أضاء ل
