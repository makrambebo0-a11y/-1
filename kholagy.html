بافلوس نيم إبسيبي إنتي ني ماثيتيس إيري بو إزموإثؤواب شوبي\nنيمان آمين.\nبركة سادتي الآباء\nالرسل أي أبينا بطرس و\nومعلمنا بولس وبقية\nالتلاميذ بركتهم المقدسة\nفلتكن معنا آمين\n** اما في أيام الآحاد فلا تقال أوشية القرابين هنا لأنها قيلت في صلاة باكر وبعد الإنتهاء من قراءة الكاثوليكون عربيًا يرتل الشعب\nمرد الإبركسيس:\nشيري ني ماريا تي إتشرومبي\nإثنيسوس ثي إيطاسميسي نان إم\nإفنوتي بي لوغوس.\nالسلام لك يا مريم\nالحمامة الحسنة التي ولدت\nلنا الله الكلمة\nوتختم هذه القطعة بما يأتي:\nإك إزماروؤوت آليثوس نيم بيك\nيوت إن آغاثوس نيم بي إبنيفما\nإثؤواب جي آك إى آك سوتي\nإممون.\nمبارك أنت بالحقيقة\nمع أبيك الصالح والروح\nالقدس لأنك أتيت\nوخلصتنا\nثم يقرأ الشماس الأبركسيس قبطيًا ويقول في مقدمته:\nإبركسيس إنتي نين يوتي إن آبوسطولوس إيري إزمو إثؤواب شوبي نيمان.\nأعمال آبائنا الرسل بركتهم المقدسة\nتكون معنا\nثم يتلو الجمل القبطي ويختم:\nبي ساجي ذى إنتي إبشويس إفئي آى آى أووه إفئي آشاي إفئي أما هي أووه إفئي تاجرو\nخين تي آجيا إن إككليسيا إنتي إفنوتي آمين.\nكلمة الرب تنمو وتكثر\nوتعزوتثبت في\nكنيسة الله المقدسة آمين\nثم يفسر الإبركسيس عربيًا وتقال مقدمته هكذا:\n(فصل من أعمال آبائنا الرسل الأطهار المشمولين بنعمة الروح القدس بركتهم المقدسة فلتكن معنا آمين)\nويختم الفصل بهذه الجملة\n(لم تزل كلمة الرب تنمو وتزداد في هذه الكنيسة وكل كنيسة آمين).\nالسنكسار و الثلاث تقديسات\nالقداس الباسيلي\nالخولاجي\nسر الكاثوليكون: أيها الرب إلهنا الذي من قبل رسلك القديسين\n"},{"n":"16- السنكسار و الثلاث تقديسات","t":"وأثناء ذلك يعطي الكاهن البخور أمام باب الهيكل وللكهنة وللشعب في الخورس الداخلي ثم يعود إلى باب الهيكل ويقول سر اعتراف الشعب خارج الهيكل ثم يقرأ السنكسار cuna[arion.\nمقدمة السنكسار:\n** (بسم الآب والإبن والروح القدس الإله الواحد آمين اليوم (...) من شهر (...) أحسن الله (من 1-15 يقال) استقباله (من 16-30 يقال) إنقضاءه وأعاده علينا وعليكم ونحن متمتعين بهدوء وإطمئنان مغفوري اخطايا والزلات من قبل مراحم الرب يا آبائي وإخوتي آمين) وفي نهايته يقف جميع الشعب والشمامسة\nويقولون الثلاث التقديسات:\nآجيوس. أوثيئوس. آجيوس\nإس شيروس آجيوس\nأثاناطوس أو إكبار ثينو جينيتيس\nإليسون إيماس.\nقدوس الله قدوس\nالقوي قدوس الذي\nلا يموت يا من ولد من\nالعذراء ارحمنا\nآجيوس. أوثيئوس. آجيوس إس شيروس آجيوس أثاناطوس\nأو إسطفروتيس ذي إيماس إليسون\nإيماس.\nلا يموت يا من صلب\nعنا ارحمنا\nإس شيروس آجيوس أثاناطوس أو أناسطاس إيك طون نيكرون\nكي أنيلثون يسطوس أورانوس\nلا يموت يا من قام من\nالأموات وصعد إلى\nالسموات ارحمنا\nذو كسابتري كي إيوكي آجيو\nإبنيفماتي كي نين كي آإي كي\nإسطوس إى أوناس طون إى أونون آمين. آجيا إترياس\nالمجد للآب والإبن\nوالروح القدس الآن وكل\nاوان وإلى دهر الدهور أمين\nأيها الثالوث\nالمقدس ارحمنا\nما يقال عند حضور أحد الآباء\nالقداس الباسيلي\nالخولاجي\nالابركسيس\n"},{"n":"القداس الباسيلي للقديس باسيليوس الكبير ما يُقال عند حضور أحد الآباء: فليرفعوه في كنيسة شعبه، أقسم الرب، الرب عن يمينك: مارو اتشاسف","t":"فليرفعوه في كنيسة شعبه\nوليباركوه على منابر الشيوخ لأنة\nجعل أبوة مثل الخراف. يُبصِرُ\nالمستقيمون ويفرحون.\n** Let them exalt Him in\n** the church of His people,\n** and praise Him in the seat\n** of the elders, for He has\n** made His families like a\n** flock of sheep, that the\n** upright may see and rejoice.\n** فليرفعوه في كنيسة شعبه\n** Marou[acf qen `tek`klycia `nte\n** peflaoc@ ouoh marou`cmou `erof hi\n** `tka;edra `nte ni`precbuteroc@ je\n** af,w `noumetiwt `m`vry] `nhan`ecwou@\n** eu`enau `nje ny`etcoutwn ouoh\n** eu`eounof@\nأقسم الرب ولن يندم أنك أنت هو\nالكاهن إلى الأبد على طقس ملكي\nصادق. الرب عن يمينك يا أبانا\nالقديس البطريرك البابا المعظم\nالأنبا (...).\n** The Lord has sworn and\n** will not repent, \"You are a\n** priest forever, after the\n** order of Melchizedek.\" The\n** Lord is at your right hand,\n** our saintly father, the\n** patriarch, Pope Abba (...).\n** Afwrk `nje P[oic ouoh\n** `nnefouwm `n`h;yf@ je `n;ok pe `vouyb\n** sa `eneh@ kata `ttaxic `mMel,icedek@\n** P[oic caouinam `mmok peniwt e;ouab\n** `mpatriar,yc papa abba (...).\nوأبينا الأسقف (المطران) الأنبا\n(...). الرب يحفظ حياتكما.\nهلليلويا.\n** And our father the\n** bishop (metropolitan), Abba\n** (...). May the Lord keep\n** your lives. Alleluia.\n** Nem peniwt `nepickopoc\n** (`mmetropolityc) abba (...)@ P[oic\n** ef`e`areh `epetenwnq@ Allyloui`a.\nما يُقال في نهاية المزمور القبطي على مدار السنة عند حضور أحد الآباء من (المزمور 106؛ 109):\nالفرقة الأولى\nمارو إتشاسف خين إبت\nإككليسيا إنتي بيف لاؤس :\nأووه مسارو إزمو إيرون :\nهي إيت كاندرا إنتي ني\nإيريس في تيروس جي\nآفكو إن أو ميت يوت إم\nإفريتي إنهان إسوؤ إيف إي ناف\nإنجييه ني إيت سوتون اووه\nأيف إي أونوف.\nفليرفعوه في\nكنيسة\nشعبه، و\nليباركوه على منابر\nالشيوخ، لأنه\nجعل الأبوة\nمثل الخراف،\nيبصر المستقيمون و\nيفرحون.\nترد الفرقة الثانية\nآف اورك إنجيه إبشويس أووه\nإن نيف أوؤم إنهثيف\nجيه إنثوك بي\nإف أوويب شا إبنيه كاطا إيت\nطاكسيس إم ميلشي صادريك :\nالليلويا .\nأقسم الرب ولن\nيندم إنك أنت\nهو الكاهن إلى\nالأبد على\nطقس ملكي\nصادق هلليلويا\nثم ترد الفرقتان معا\nإبشويس صا أوي نام إمموك\nبينيوت إثؤواب إم\nباتريارشيس بابا\nآفا (...) نيم\nبيك إشفير إن ليتورغوس إن أبوسطولوس.\nبين يوت إن إيبسكويوس\nآقا (...)\nإبشويس إيف أيه آريه إي\nتبتين ميت أونخ آمين الليلويا .\nالرب عن يمينك\nيا ابنا القديس\nالبطريرك البابا\nأنبا (.....) وشريك\nفي الخدمة الرسولية\nأبينا الأسقف\nالأنبا (......) الرب\nيحفظ حياتكما.\nآمين هلليلويا.\nمارو تشاسف خين إت إكليسيا إنتيه بيف لاؤس : اووه مارو إسمو إروف هي إتكاثيذرا إنتيه ني إبريسڤيتيروس : چيه أفكو إن أوميت يوت إم إفريتي إن هان إي سؤو إڤ إيناڤ إنچيه ني إتسوتون اووه إڤ إي أونوف : أف كورف إنچيه بتشويس اووه إن نيف أؤوم إن إهثيف : چيه إنثوك بيه إف أويب شا إينيه : كاطا إت طاكسيس إم ميلشيسيديك : إبشويس صا أوي نام إمموك بينيوت إثؤواب إم باتريارشيس بابا آفا ( . . . ) إبشويس إيف أيه آريه إتيك ميت أونخ .\nفليرفعوه في كنيسة شعبه وليباركوه علي منابر الشيوخ لأنة جعل أبوة مثل الخراف . يُبصِرُ المستقيمون ويفرحون . أقسم الرب و لن يندم أنك أنت هو الكاهن إلي الأبد علي طقس ملشيصادق . الرب عن يمينك يا أبانا القديس البطريرك البابا المعظم الأنبا ( . . . ) . الرب يحفظ حياتك .\n** / Marov sac4 qen `tek`kl3cia `nte pe4laoc : ovoh marov `cmov `ero4 hi`tka0edra `nte ni`precbvteroc : ge a4xw `novmetiwt `m`fr35 `nhan `ecwov ev`enav `nge n3etcovtwn ovoh eveovno4 : A4wrk `nge Pu ovoh `nne4ovwm `n`h034 : ge `n0ok pe `fov3b 2a `eneh : kata `tta7ic `mmelxicedek : Pu caovinam `mmok peniwt e,,,,,,,,,,0ovab `mpatiarxic papa abba ﴾ . . . ﴿ .\n** Pu e14`e`areh `etekmetwn1q .\nانظر أيضًا: ما يُقال في ختام الصلاة في حضور أحد الآباء (نلت نعمة موسى/أكتشي إتخاريس إم مويسيس).\nسر الانجيل\nالقداس الباسيلي\nالخولاجي\nالسنكسار و الثلاث تقديسات\n"},{"n":"17- سر الإنجيل: أيها الطويل الأناة - صلاة الحجاب: يا الله الذي من أجل محبته للبشر / أيها الرب إلهنا الذي خلقنا","t":"** سر الأنجيل\n** يمسك الكاهن المجمرة ويقول أوشية الانجيل الواردة في رفع البخور وأثناء تلاوة الآنجيل قبطيًا يقول الكاهن الشريك هذه الصلاة سرًا:\n(أيها الطويل الأناة الكثير الرحمة الحقيقي إقبل سؤالاتنا وطلباتنا منا إقبل إبتهالاتنا وتوبتنا وإعترافنا على مذبحك المقدس غير الدنس السمائي فلنستحق سماع أناجيلك المقدسة ونحفظ وصاياك وأوامرك ونثمر فيها بمائة وستين وثلاثين بالمسيح يسوع ربنا أذكر يا رب مرضي شعبك إفتقدهم بالمراحم والرأفات إشفهم أذكر يا رب آباءنا وأخوتنا المسافرين ردهم إلى أوطانهم بسلام وعافية أذكر يا رب أهوية السماء وثمرات الأرض باركها (أو يقول: أذكر يا رب مياه النهر باركها أصعدها كمقدارها كنعمتك) او يقول (أذكر يا رب الزروع والعشب ونبات الحقل باركها) اذكر يا رب خلاص الناس والدواب أذكر يا رب خلاص هذا الموضع المقدس الذي لك وكل المواضع وكل أديرة آبائنا الأرثوذكسيين أذكر يا رب عبدك رئيس أرضنا إحفظه في سلام وعدل وقوة أذكر يا رب المسبيين نجهم جميعًا أذكر يا رب آبائنا وإخواتنا الذين رقدوا وتنيحوا في الإيمان الأرثوذكسي نيح نفوسهم أجمعين أذكر يا رب الذين قدموا لك هذه القرابين والذين قدمت عنهم والذين قدمت بواسطتهم أعطهم كلهم الأجر السمائي أذكر يا رب المتضايقين من الشدائد والضيقات خلصهم من جميع شدائدهم اذكر يا رب موعوظي شعبك ارحمهم ثبتهم في الإيمان بك كل بقية عبادة الأوثان إنزعها من قلوبهم ناموسك خوفك وصاياك حقوقك اوامرك المقدسة ثبتها في قلوبهم إمنحهم ان يعرفوا قوة الكلام الذي وعظوا به وفي الزمان المحدد فليستحقوا حميم الميلاد الجديد لغفران خطاياهم إذ تصيرهم هيكلًا لروحك القدوس بالنعمة والرأفات ومحبة البشر اللواتي لإبنك الوحيد ربنا وإلهنا ومخلصنا يسوع المسيح هذا الذي ينبغي إلخ)\nثم يقول الكاهن الخادم صلاة الحجاب سرًا وهو واقف بخشوع متجه إلى الشرق:\n(يا الله الذي من أجل محبته للبشر التي لا ينطق بها أرسلت إبنك إلى العالم ليرد إليه الخروف الضال نسألك يا سيدنا لا تردنا إلى خلف إذ نضع أيدينا على هذه الذبيحة المخوفة غير الدموية لأننا لا نتكل على برنا بل على رحمتك هذه التي بها أحييت جنسنا نسأل ونتضرع إلي صلاحك يا محب البشر أن لا يكون هذا السر الذي دبرته لخلاصنا دينونة لنا ولا لشعبك أجمع ولكن محوا لخطايانا وغفرانًا لتكاسلنا ومجدًا وإكرامًا لإسمك القدوس أيها الآب والإبن والروح القدس الآن وكل أوان وإلى دهر الدهور آمين).\n** The priest stands at the entrance of the sanctuary, looks towards the east, bow his head and says inaudibly\nيا الله الذى من أجل محبته للبشر التى لا ينطق بها أرسلت أبنك إلى العالم ليرد إليه الخروف الضال.\n** O God, who in Thine unspeakable love toward mankind sent Thine Only-Begotten Son into the world, that He might bring the lost sheep home unto Thee.\n** V; veh`ete eqbe tekmetmairwmi `nat`]caji `mmoc> akouwrp `mpekmonogenhc `n}hri `epikocmoc> \\ina `nteftacqo `erok `mpi`ecwou `etafcwrem.\nنسألك يا سيدنا لا تردنا إلى خلف إذ نضع أيدينا على هذه الذبيحة المخوفة غير الدموية.\n** We ask Thee, O our Lord, thrust us not behind Thee when we offer this fearful and bloodless sacrifice.\n** Ten;\\o `erok pennhb> `mpertacqon `eva\\ou> en\\itoten `etaiquci`a etoi `n\\o; ouo\\ `nat`cnof.\nلأننا لا نتكل على برنا بل على رحمتك، هذه التى بها أحييت جنسنا.\n** For we put no trust in our righteousness but in Thy mercy, whereby, Thou hast given life to our race.\n** ~Ntenxw `n`\\qhn an `ejen nenmeqmhi> alla `epeknai> vai `etaktan'o `mpengenoc `ebol\\itotf.\nنسأل ونتضرع إلى صلاحك يا محب البشر أن لا يكون هذا السر الذى دبرته لخلاصنا دينونة لنا ولا لشعبك أجمع.\n** We pray and entreat Thy Goodness, O Lover of mankind, that this mystery which Thou hast appointed unto us for salvation may not be unto condemnation unto us or unto any of Thy people.\n** Ten;\\o ouo\\ tentwb\\ `ntekmet`agaqoc pimairwmi> je \\ina `ntef`]tem]wpi naf eu\\ap nem peklaoc thrf> `nje paimucthrion `etakeroikonomin `mmof nan `eououjai.\nولكن محواً لخطايانا وغفراناً لتكاسلنا.\n** But unto the washing away of our sins and forgiveness of our negligence.\n** Alla `eoufw; `ebol `nte nennobi> nem ouxw `ebol `nte nenmet`amelhc.\nومجداً وإكراماً لأسمك القدوس أيها الآب والابن والروح القدس.\n** And unto the glory and honour of Thine Holy Name, O Father, Son and Holy Spirit.\n** Eou`wou de nem outai`o empekran `eqouab ~Viwt nem ~P]hri nem Pi`pneuma `eqouab.\nالآن وكل أوان وإلى دهر الدهور. آمين.\n** Now, and at all times, and unto the age of all ages. Amen.\n** :nou nem `nchou niben nem ]a `ene\\ `nte ni`ene\\ throu> `amhn.\n** The priest may choose to say the following Prayer for the Veil instead. The priest says inaudibly\nأيها الرب إلهنا الذى خلقنا وأدخلنا إلى هذه الحياة.\n** O Master, our God, Who created us and brought us to this life.\n** ~P_ Pennou; vh`etafconten> ouo\\ afenten `e'oun `epaiwn'.\nالذى كون كل شئ بكلمته وبحكمتك خلقت إنسانا ليكون رئيسا على المخلوقات التى صنعتها من قبلك. ويسوس العالم بقداسه وبر.\n** Who made everything with His word, and with Thy wisdom, Thou hast created man to rule on all the other creatures Thou hast created.\n** Vh`etaf`qre enxai niben ]wpi 'en pefcaji> ouo\\ 'en tekcovi`a akqami`o `nourwmi> je \\ina `nteferarxwn `ejen nicwnt `etakqami`wou `ebol\\itotk> ouo\\ `nteferdioikin `mpekocmoc 'en outoubo nem oumeqmhi.\nأعطنى الحكمة الجالسة عند كرسيك.\n** Give me the wisdom of Thy throne.\n** Moi nhi `n;covi`a et\\emci 'aten pek`qronoc.\nأعطنى فى هذه الساعة قلبا حكيما فهيما.\n** Grant me in this hour a wise and comprehending heart.\n** Moi nhi 'en taiounou `nou\\ht `ncabe ouo\\ `nkat\\ht.\nأعطنى غفران سيئاتى.\n** Grant me the forgiveness of my sins.\n** Moi nhi `nouxw `ebol `nte naparaptwma.\nأعطنى طهارة النفس والجسد.\n** Grant me the purity of my soul and body.\n** Moi nhi `noutoubo `nte ;yuxh nem picwma.\nلكى أستحق أن أقترب إلى مذبحك المقدس.\n** In order to be worthy to come to Thine Holy altar.\n** Je \\ina `ntaer`pem`p]a `e'wnt `e'oun `pekquciacthrion `eqouab.\n nje pi`pneuma `n`agaqon ouo\\ etjhk `ebol `nte pek`\\mot> 'en Pi`xrictoc Ihcouc Pen_.\nهذا الذى أنت مبارك معه ومع الروح القدس المحيى المساوى لك.\n** This, with Whom Thou art blessed, with Him and the Holy Spirit the Life-Giver, Who is of one essence with Thee.\n** Vai `etek`cmarwout nemaf> nem Pi`pneuma `eqouab `nreftan'o ouo\\ `n`omooucioc nemmak.\n** Now, and at all times, and unto the ages of all ages. Amen.\n** After the Gospel is read, the congregation says\nطوباهم بالحقيقة قديسى هذا اليوم كل واحد وواحد باسمه أحباء المسيح.\n** Blessed are they, in truth, the saints of this day. Each one, each one by his name the beloved of the Christ.\n** ~Wouni`a tou 'en oumeqmhi ni`eqouab `nte pai`e\\oou piouai piouai kata pefran nimenra; `nte Pi`xrictoc.\nاشفعى فينا يا سيدتنا كلنا السيدة والدة الإله مريم أم مخلصنا ليغفر لنا خطايانا.\n** Intercede on our behalf, O lady of us all, the mother of God, Mary, the mother of our Saviour, that he may forgive us our sins.\n** Ari`precbeuin `e`\\rhi `ejwn> `w ten_ `nnhb thren ;qe`otokoc> Mari`a `qmau `mpencwthr> `ntefxa nennobi nan `ebol.\n** The congregation may respond with any other response according to the occasion. After any of the Gospel responses, the congregation says\nمبارك الآب والابن والروح القدس الثالوث الكامل نسجد له ونمجده.\n** Blessed be the Father and the Son and the Holy Spirit, the perfect Trinity. We worship Him and glorify Him.\n** Je `f`cmarwout `nje ~Viwt nem ~P]hri nem Pi`pneuma `eqouab>`triac etjhk `ebol> tenouw]t `mmoc ten;`wou nac.\n** Congregation\nخلصت حقا.\n** Saved amen.\n** Cwqic `amhn.\nمرد الأنجيل\nالقداس الباسيلي\nالخولاجي\nما يقال عند حضور أحد الآباء\n"},{"n":"19- أوشية السلام","t":"الكاهن:\nصلو\n** Priest:\n** Pray.\n** Pi`precbuteroc@\n** Slyl.\nالشماس:\nللصلاة قفوا.\n** Deacon:\n** Stand up for prayer.\n** Pidiakwn@\n** Epi `proceu,y `cta;yte.\nالسلام لجميعكم.\n** Peace be with you all.\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nوأيضاً فلنسألُ الله الضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Again, let us ask God the Pantocrator, the Father of our Lord, God, and Savior Jesus Christ.\n** Palin on maren]ho e`V] pipantokratwr@ `Viwt `mPen=o=c ouoh Pennou] ouoh Pencwtyr I=y=c P=,=c.\nنسأل ونطلبُ من صلاحك يا محب البشر، اذكر يا رب سلام كنيستك الواحدة الوحيدة المقدسة الجامعة الرسولية.\n** We ask and entreat Your goodness, O Lover of Mankind, remember, O Lord, the peace of your one, only, holy, catholic, and apostolic Orthodox Church.\n** Ten]ho ouoh tentwbh `ntekmet`aga;oc pimairwmi. Ari`vmeu`i `P=o=c `n]hiryny `nte tekoui `mmauatc `e;ouab `nka;oliky `n`apoctoliky `nekklycia.\nصلوا من اجل سلام الواحدة المقدسة الجامعة الرسولية كنيسة الله الارثوذكسية.\n** Pray for the peace of the one, holy, catholic, and apostolic Orthodox Church of God.\n** Proceuxac;e `uper tyc `irynyc tyc `agiac monyc ka;olikyc ke `apoctolikyc or;odoxou tou :eou ekklyciac.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nهذه الكائنة من أقاصى المسكونة إلى أقاصيها. كل الشعوب وكل القطعان. باركهم. السلامة التى من السموات إنزلها على قلوبنا جميعا. بل وسلامة هذا العمر أنعم بها علينا إنعاما.\n** that which exists from one end of the world to the other. All peoples and all flocks, bless. The heavenly peace, send down into all our hearts; even the peace of this life, graciously grant to us.\n** :ai etsop icjen auaryjc `n]oikoumeny sa auryjc. Nilaoc tyrou nem ni`ohi tyrou `cmou `erwou@ ]hiryny ]`ebol qen nivyou`i@ myic `e`qryi `enenhyt tyrou. Alla nem ]kehiryny `nte paibioc vai@ `ari,arizec;e `mmoc nan `n`hmot.\nالملك (الرئيس) والجند والأراخنة والمشيرين والجموع وجيراننا ومداخلنا ومخارجنا، زينهم بكل سلام.\n** The king [leader], the armies, the chiefs, the counselors, the multitudes, our neighbors, our coming in and our going out, adorn them with all peace.\n** Piouro (Pi`ar,y) nimetmatoi niar,wn nico[ni nimys nen;eseu nenjinmosi `eqoun nem nenjinmosi `ebol@ celcwlou qen hiryny niben.\nيا ملك السلام، أعطنا سلامك، لان كل شئ قد أعطيتنا. اقتننا لك يا الله مخلصنا لاننا لا نعرفُ آخرَ سواك إسمُك القدوس هو الذى نقوله فلتحيا نفوسُنا بروحِّك القدوس.\n** O King of Peace, grant us Your peace; for You have given us all things. Acquire us to Yourself, O God our Savior, for we know none other but You. Your Holy name we utter. May our souls live by Your Holy Spirit.\n** Pouro `nte ]hiryny moi nan `ntekhiryny@ hwb gar niben aktyitou nan. Jvon nak V] pen=c=w=r@ je tencwoun `nkeouai an `ebyl `erok@ Pekran =e=;=u petenjw `mmof. Marouwnq `nje ny`ete noun `m'u,y hiten Pek`pneuma =e=;=u.\nولا تدع موت الخطية يقوى علينا، نحنُ عبيدك، ولا على كلِّ شعِبك.\n** And let not the death of sin have dominion over us, we Your servants, nor over all Your people.\n** Ouoh `mpen`;refjemjom `eron `anon qa nek`ebiaik@ `nje `vmou `nte hannobi@ oude qa peklaoc tyrf.\nثم يسجد الكاهن أمام الهيكل ويصافح أخوته الكهنة ويطلب السماح من الشعب أمام المذبح ويقبله.\nثم يبتدئ الكاهن بالصلاة قائلًا:\nصل\nإشليل\nيجاوبه الشماس:\nإيبي إبروس إفكي إسطاثيتي\nثم يرشم الشعب قائلًا:\nالسلام للكل\nإيريني باسي\nفيجاوبونه قائلين:\nكيطو إبنيفماتي سو\nويبتدئ بالواشي الثلاث الكبار أولها أوشية السلامة:\nبالين أون مارين تيهو إى إفنوتي بي بانطوكراطور إفيوت إم بين شويس أووه بننوتي اووه بينسوتير إيسوس بي إخرستوس تين تي هو أووه تين طفه إنتيك ميت آغاثوس بي ماي رومي. آري\nإفميفئي إبشويس إنتي هيريني إنتي\nتيك أوى إم مافتس إثؤواب إن كاثوليكي\nإن آبوسطوليكي إن إككليسيا.\nوأيضًا فلنسأل الله ضابط\nالكل أبا ربنا وإلهنا\nومخلصنا يسوع المسيح\nنسأل ونطلب من صلاحك\nيا محب البشر أذكر\nيا رب سلام كنيستك\nالواحدة الوحيدة المقدسة الجامعة الرسولية\nيقول الشماس:\nإبروس إفئكساستي إيبرتيس\nإيرينيس تيس آجياس مونيسكاثوليكيس\nكي آبسطوليكيس\nأرثوذكسوطوثيئو إككليسياس\nصلوا من أجل سلام\nكنيسة الله الواحدة\nالمقدسة الجامعة الرسولية\nالأرثوذكسية\nيقول الشعب:\nكيريي إليسون\nيقول الكاهن:\nثاي إتشوب يسجين أفرجس\nإنتي إيكوميني شا أفرجس ني لاوس تيرونيم ني اوهي تيروإزموا إيروؤو تي هيريني تي إيفول خين ني فيئووي\nميس إى إخري إى نين هيت تيروآللانيم\nتي كي هيريني إنتي باي فيوس فاي أري خاريزيستي إمموس نان إن إهموتبي أورو ني ميت ماطوي ني ارخون ني سوتشني\nني ميش نين ثيشيف نيم نين حينموشي إيخون نيم نين جينموشي إيفول سيلسولو خين هيريني نيفين إبؤروإنتي تي\nهيريني موى نان إنتيك هيريني\nهوب غار نيفين أكتيتو نان\nإجفون ناك إفنوتي بينسوتير جي\nتين سوؤون إنكي أواى آن إيفيل\nإيروك بيكران إثؤواب بيتين\nجو إمموف مارو\nأونخ إنجي ني إيتينون إم إبسيشي\nهيتين بيك إبنيفما إثؤواب اووه\nإمبين إثريف جيمجوم إيرون أنون\nخانيك إيفيئيك إنجي إفمو\nإنتي هان نوفي أودي خابيك\nلاؤس تيرف.\nهذه الكائنة من أقاصي\nالمسكونة إلى أقاصيها\nكل الشعوب وكل\nالقطعان باركهم السلام\nالذي من السموات\nأنزله على قلوبنا جميعًا\nبل وسلام هذا العمر\nأنعم به علينا إنعامًا\nالرئيس والجند والرؤساء والوزراء\nوالجموع وجيراننا ومداخلنا\nومخارجنا زينهم\nبكل سلام يا ملك\nالسلام اعطنا سلامك\nلأن كل شي قد أعطيتنا\nإقتتنالك يا الله\nمخلصنا لأننا\nلا نعرف أخر سواك\nاسمك القدوس هو الذي\nنقوله فلتحيا نفوسنا\nبروحك القدوس ولا يقوي علينا\nنحن عبيدك موت\nالخطية ولا على كل\nشعبك\nاوشية الاباء\nالقداس الباسيلي\nالخولاجي\nمرد الأنجيل\n"},{"n":"20- أوشية الآباء","t":"الكاهن:\nوأيضا فلنسأل الله ضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح نسأل ونطلب من صلاحك يا محب البشر.\n** Priest:\n** Again, let us ask God the Pantocrator, the Father of our Lord, God, and Savior Jesus Christ. We ask and entreat Your goodness, O Lover of Mankind.\n** Pi`precbuteroc@\n** Palin on maren]ho `eV] pinantokratwr@ Viwt `mPen=o=c ouoh pennou] ouoh penCwtyr I=y=c P=,=c. Ten]ho ouoh tentwbh `ntekmet`aga;oc pimairwmi.\nاذكر يا رب بطريركنا الأب المكرم رئيس الكهنة البابا المعظم أنبا (...).\n** Remember, O Lord, our blessed and honored father, the archbishop our patriarch, Abba (...).\n** Ari`vmeu`i P[oic `mpenpatria,yc `niwt ettaiyout `nar,i`ereuc papa abba (...).\nفي وجود أسقفً:\nوشريكة في الخدمة الرسولية أبينا الأسقف المكرم الأنبا (...).\n** If a bishop is present:\n** And his partner in the liturgy, our father the bishop, Abba (...)\n** Nem pefke`svyr `nlitourgoc peniwt `nepickopoc abba (...).\nالشماس:\nصلوا من أجل رئيس كهنتنا البابا أنبا (...) بابا وبطريرك ورئيس أساقفة المدينة العظمي الاسكندرية، * وسائر أساقفتنا الارثوذكسيين.\n** Deacon:\n** Pray for our high priest, Papa Abba (...), pope and patriarch and archbishop of the great of Alexandria,* and for our orthodox bishops.\n** Pidiakwn@\n** Proceuxac;e `uper tou`ar,y `erewc `ymwn papa abba (...) papa ke patriar,ou ke `ar,y `epickopou tyc megalo polewc Alexan`driac@ * ke ton `or;odoxwn `ymwn `epickopwn.\nوشريكة في الخدمة الرسولية أبينا الأسقف المكرم الأنبا (...)، وسائر أساقفتنا الارثوذكسيين.\n** And his partner in the liturgy, our father the bishop, Abba (...), and for our orthodox bishops.\n** Nem pefke`svyr `nlitourgoc peniwt `nepickopocabba (nim)\n** ke ton `or;odoxwn `ymwn `epickopwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nحفظاً إحفظهم لنا سنين كثيرة وأزمنة سلامية. مكملين رئاسة الكهنوت المقدسة التي ائتمنتهم عليها من قبلك، كإرادتك المقدسة الطوباوية.\n** In keeping keep them for us for many years and peaceful times. fulfilling that holy high priesthood with which You have entrusted him from Yourself, according to Your holy and blessed will.\n** Qen ou`areh `areh `erwou nan `mhanmys `nrompi nem hancyou `nhirynikon. Efjwk `ebol `n;y=e=;=u `etaktenhoutwou `eroc `ebol hitotk `mmet`ar,y`ereuc@ kata pekouws =e=;=u ouoh `mmakarion.\nمفصلا كلمة الحق باستقامة، راعيا شعبك بطهارة وبر. وجميع الاساقفة الارثوذكسيين، والقمامصة والقسوس والشمامسة، وكل امتلاء كنيستك الواحدة الوحيدة المقدسة الجامعة الرسولية. أنعم عليهم وعلينا بالسلام والعافية في كل موضع. وصلواتهم التي يقدمونها عنا، وعن كل شعبك وصلواتنا نحن أيضا عنهم. إقبلها إليك علي مذبحك المقدس الناطق السمائى رائحة بخور. فسائر أعدائهم الذين يرون والذين لا يرون، اسحقهم وأذلهم تحت أرجلهم سريعا.\n** Rightly dividing the word of truth, shepherding Your people in purity and righteousness, and all the orthodox bishops, hegumens, priests, and deacons, and all the fullness of Your one, only, holy, catholic, and apostolic Church. Grant them and us peace and safety in every place. Th nخين أو آريه آريه إيروف نان\nإنهان ميش إن رومبي نيم هان سيو إنهيرينيكون إفجوك إيفول\nإنثيئثؤواب إيتاك تين هفف إيروس\nإيفول هيططك إمميت أرشي إريفس\nكاطابيك أو أوش إثؤواب أووه إم\nماكاريون إنشوت إيفول إم إبساجي\nإنتي تي ميثمي خين أو سوأوتين إف\nاموني إمبيك لاس خين أوطوفو نيم\nاو ميثمي نيم ني إيبسكوبوس نيم ني أرثوذكسوس نيم بي ني هيغومينوس نيم ني إبريسفيتيروس نيم ني ذياكون نيم إفموه تيرف إنتي تيك اووه إممافتس إثؤواب إنكاثوليكي إن أبوسطوليكي إن\nإككليسيا إيك إى إير خاريزستي نوؤو\nنيمان إن أو هيريني نيم أو أوجاي\nإيقول خين ماي نيفين نو إبروس\nإفكي ذى إيتو إيري إمموؤوإي\nإهري إيجون نيم إيجين\nبيك لاؤس تيرف نيم نونهون\nإى إهري إيجوؤو.\nحفظًا إحفظه لنا سنين\nكثيرة وأزمنة سالمة\nمكملًا رئاسة الكهنوت\nالمقدسة التي إئتمنتيه\nعليها من قبلك كإراداتك\nالمقدسة الطوباوية مفصلًا\nكلمة الحق باستقامته\nراعيًا شعبك بطهارة\nوبر وجميع الأساقفة\nالأرثوذكسيين والقمامصة\nوالقسوس والشمامسة\nوكل امتلاء كنيستك\nالواحدة الوحيدة المقدسة\nالجامعة الرسولية\nانعم عليهم وعلينا\nبالسلام والعافية في\nكل موضع وصلواتهم\nالتي يقدمونها عنا\nوعن كل\nشعبك وصلواتنا\nنحن أيضًا عنهم\nويقدم الشماس المجمرة للكاهن فيضع فيها البخور يدًا واحدة وهو يقول:\nشوبو إيروك إيجين بيك ثيسيا ستيريون إثؤواب إن إيللوجيمون إنتي إتفي أي أو إسطوي إن إسطوى نوفي نوجاجي مين تيرو نيئيطوناف إيروؤو نيم ني إنسيناف إيروؤو آن خيم خومو أووه ماثيفيو سابيسيت إن نوتشالفج إنكوليم إن\nثؤوذي آريه إيروؤو خين أو هيريني\nنيم اوذيكيئوسيني خين تيك\nإككليسيا إثؤواب.\nإقبلها إليك علي\nمذبحك المقدس الناطق\nالسمائي رائحة بخور\nوسائر أعدائهم الذين يرون و\nالذين لا يرون إسحقهم و\nأذلهم تحت أقدامهم سريعًا\nواما هم فإحفظهم في سلام\nوعدل في\nكنيستك المقدسة\nاوشيه الإجتماعات\nالقداس الباسيلي\nالخولاجي\nأوشية السلام\n"},{"n":"21- أوشية الاجتماعات","t":"الكاهن:\nوأيضاً فلنسأل الله ضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح. نسأل ونطلب من صلاحك يا محب البشر، اذكر يا رب اجتماعاتنا.\n** Priest:\n** Again, let us ask God the Pantocrator, the Father of our Lord, God and Savior Jesus Christ. We ask and entreat Your goodness, O Lover of Mankind, remember,O Lord, our ge to come. Amen.\n** Tenjoust `ebol qa`thy `n]anactacic `nte nirefmwout nem piwnq `nte piewn e;nyou amyn.\nالقداس الباسيلي\nالخولاجي\nصلاة الصلح / يا الله العظيم الأبدى\nأوشية السلام\n"},{"n":"22- صلاة الصلح / يا الله العظيم الأبدي","t":"الكاهن:\nصلوا.\n** Priest:\n** Pray.\n** Pi`precbuteroc@\n** Slyl.\nالشماس:\nللصلاة قفوا.\n** Deacon:\n** Stand up for prayer.\n** Pidiakwn@\n** Epi `proceu,y `cta;yte.\nالسلام للكل.\n** Peace be with all.\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nيا الله العظيم الأبدي، الذي جبل الإنسان علي غير فساد. والموت الذي دخل إلي العالم بحسد إبليس هدمته، بالظهور المحيى الذي لابنك الوحيد الجنس ربنا وإلهنا ومخلصنا يسوع المسـيــح. وملأت الأرض من السلام الذي من السموات. هذا الذي أجناد الملائـكــة يمجدونك به قائلين:\n** O God, the Great, the Eternal, who formed man in incorruption, and death, which entered into the world through the envy of the devil, You have destroyed by the life-giving manifestation of Your only-Begotten Son, our Lord, God, and Savior Jesus Christ. You have filled the earth with the heavenly peace by which the hosts of angels glorify You, saying,\n** V] pinis] pisa`eneh@ vy`etafkwt `mpirwmi `e`hryi `ejen ]metattako. Ouoh `vmou `etaf`i `eqoun `epikocmoc@ hiten pi`v;onoc `nte pidiaboloc@ akserswrf hiten piouwnh `ebol `nreftanqo@ `nte pekmonogenyc `nSyri@ Pen=o=c ouoh Pennou] ouoh pen=c=w=r I=y=c P=,=c. Ouoh akmoh `mpikahi `ebolqep ]hiryny ]`ebol qen nivyoui. :ai et`ere ]`ctratia `nte niaggeloc ]`wou nak `nqytc eujw `mmoc.\n\"المجد لله في الأعالي، وعلي الأرض السلام، وفي الناس المسرة.\"\n** \"Glory to God in the highest, peace on earth, and good will towards men.\"\n** Je ou`wou `mV] qen nyet[oci@ nem ouhiryny hijen pikahi@ nem ou]ma] qen nirwmi.\nصلوا من أجل السلام الكامل، والمحبة، والقبلة الطاهرة الرسولية.\n** Pray for perfect peace, love, and the holy apostolic kisses.\n** Proceuxac;e `uper tyc teliac `irynyc ke `agapyc ke twn `agiwn acpacmwn twn `apoctolwn.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nبمسرتك يا الله، إملأ قلوبنا من سلامك.\n** According to Your good will, O God, fill our hearts with Your peace.\n** Qen pek]ma] V] moh `nnenhyt qen tekhiryny.\nوطهرنا من كل دنس، ومن كل غش، ومن كل رياء، ومن كل فعل خبيث، ومن تذكـار الشر الملبس الموت. واجعلنا مستحقين كلنا يا سيدنا، أن نقّبل بعضنا بعضا بقبلة مقدسة. لكي ننال بغير انطراح في دينونة، من موهبتك الغير المائته السمائية، بالمسيح يسوع ربنا.\n** Cleanse us from all blemish, all guile, all hypocrisy, all malice, and the remembrance of evil entailing death. And make us all worthy, O our Master, to greet one another with a holy kiss. That without falling into condemnation we may partake of Your immortal and heavenly gift in Christ Jesus our Lord.\n** Ouoh matoubon `ebol ha ;wleb niben@ nem `,rof niben@ nem metsobi niben@ nem panourgia niben@ nem ]metrefer`vmeu`i `nte ]kakia etervorin `m`vmou. Ouoh `aritten `nem`psa tyren pennyb@ e;ren eracpazec;e `nnen`eryou qen ouvi =e=;=u. E`pjinten[i qen oumetathitten `e`phap `ebolqen tekdwre`a `na;mou ouoh `nepouranion@ qen P=,==c I=y=c Pen=o=c.\n** (The People may chant the Aspasmos Adam)\nقبلوا بعضكم بعضا بقبلة مقدسة. يارب ارحم. يارب ارحم. يارب ارحم. نعم يارب الذي هو يسوع المسيح ابن الله، اسمعنا وارحمنا. تقدموا تقدموا تقدموا على الرسم، قفوا برعدة، والي الشرق أنظروا. ننصت.\n** Greet one another with a Holy kiss. Lord have mercy, Lord have mercy, Lord have mercy, yea, Lord, who are Jesus Christ, the Son of God, hear us and have mercy upon us. Offer in order. Stand with trembling. Look towards the East. Let us attend.\n** Acpazec;e allylouc en vilymati `agi`w. `Kuri`e `ele`ycon Kuri`e `ele`ycon@ ce Kuri`e `ete vai pe Iycouc Pi`,rictoc Psyri `mV] cwtem `eron ouoh nai nan. Procverin kata `tropon@ `cta;yte kata `tromou@ ic `anatolac `ble'ate. `Proc,wmen.\nوأثناء تلاوة قانون الإيمان يغسل الكاهن يديه ثلاث مرات ثم ينفضها وبهذا كأنه يحذر الشعب لئلا ينكر أحدهم إيمانه بالسيد المسيح أو أن يكون قانون الإيمان من الفم فقط ويعلن بنفض يديه براءته من المخالف، وبعد ذلك ينشف يديه جيدًا ويقف أمام المذبح بخشوع:\nيقول الكاهن:\nصل\nإشليل\nيقول الشماس:\nإيبي إبروس إفكي إسطاثيتي\nإيريني باسي\nيقول الشعب:\nكيطوإبنيفماتي سو\nيقول الكاهن صلاة الصلح:\nإفنوتي بي نشتي بي شا إينيه في إبطاف كوت إمبي رومي إى إهري إيجين تي ميت أتطاكو. أووه إفمو إيطاف إي إيخون إي بي كوزموس هيتين بي إفثونوس إنتي بي ذيافولوس آك شير شورف. هيتين بي أو أونه إيفول إنريف تنخو إنتي بيك مونوجينيس إنشيري بين شويس أووه بين نوتي أووه بين سوتير إيسوس بي إخرستوس أووه آك موه إم بي كاهي إيفول خين تي هيريني تي إيفول خين نيفيئووي ثاي إت إيري تي ستراتيا إنتي ني آنجيلوس تي أو اوناك إنخيتس إفجو إمموس جي أوأو أو إم إفنوتي خين ني إتتشوسي نيم أو هيريني هيجين بي كاهي نيم أوتيماتي خين ني رومي.\nيا الله العظيم الأبدي الذي\nجبل الإنسان على غير\nفساد والموت الذي\nدخل إلى العالم بحسد\nإبليس هدمته بالظهور\nالمحيي الذي لإبنك\nالوحيد الجنس ربنا\nوإلهنا ومخلصنا يسوع\nالمسيح وملأت الأرض\nمن السلام الذي من\nالسموات هذا الذي\nأجناد الملائكة يمجدونك\nبه قائلين: المجد لله في\nالأعالي وعلى الأرض السلام\nوفي الناس المسرة.\nإبروس إفكساستي إيبرتيس تيلياس\nإيرينيس كي أغابيس آجيون\nإسباسمون طون آبوسطولون.\nصلوا من أجل السلام\nالكامل والمحبة والقبلة\nالطاهرة الرسولية\nيرفع الكاهن اللفافة الموضوعة فوق الإبروسفارين procverin بيديه ويقول:\nخين بيك تيماتي إفنوتي موه إننهيت\nخين تيك هيريني. أووه ماطوفون\nإيقول هاثوليب نيفين نيم إكروف نيفين\nنيم ميتشوفي نيقين نيم بان أورجيا نيقين\nنيم تي ميت ريف إيبر إفميفئي إنتي تي كاكيا إتئيرفورين إم إفمو. أووه آريتين\nإن إم إبشاتيرين بين نيب إيثرين إير أسبازيستي إنين إيريؤخين أوفي\nإثؤواب. إى إيجين تين تشي خين أو\nميت أت هي تتين إي إبهاب إيفول خين\nتيك ذوريا إن أثمو أووه إن إيبورانيون\nخين بي إخرستوس إيسوس بين\nشويس.\nبمسرتك يا الله إملأ\nقلوبنا من سلامك وطهرنا\nمن كل دنس ومن كل\nغش ومن كل رياء ومن\nكل فعل خبيث ومن\nتذكار الشر الملبس الموت\nوإجعلنا مستحقين كلنا\nيا سيدنا أن نقبل\nبعضنا بعضًا بقبلة\nمقدسة لكي ننال بغير\nوقوع في دينونة من\nموهبتك غير المائتة السمائية\nبالمسيح يسوع ربنا.\nفاي إيتي إيفول هيططف إيري بي\nأوأونيم بي طايو نيم تي إبروس\nكينيسس إير إبريبي ناك نيماف نيم\nبي إبنيفما إثؤواب إنريف تنخو\nاووه إن أومؤوسيوس نيماك تينو نيم\nإنسيو نيفين نيم شاإينيه إنتي ني\nإينيه آمين.\nهذا الذي من قبله\nالمجد والكرامة والعزة\nوالسجود تليق بك\nمعه مع الروح القدس\nالمحيي المساوي لك الآن\nوكل أوان وإلى دهر\nالدهور آمين.\nاسبازيستي الليسوس ان فليماتي اجيو. كيريى ليسون كيريى ليسون كيريى ليسون.\nسي كيريى ايتي فاي بي ايسوس باخرستوس ابشري أم أفنوتي سوتيم ايرون أووه ناي نان.\nابرو سفرين كاطا اطروبو. استاثيتي كاطا اطرو مو. ايس اناطولاسي افل ابساتي ابروس خومين.\nقَبِّلوا بَعضَكُم بَعضًا بقبلةٍ مقدسة يا ربُ ارحم يا ربُ ارحم يا ربُ ارحم.\nنعم يا ربُ الذي هو يسوعُ المسيحُ ابنُ الله الحي إسْمَعنا وإرحمنا.\nتَقَدَّموا على الرسمِ قِفوا بخوفٍ ورعدَةٍ، وإلى الشرقِ انظروا، نُنصِتْ.\nالقداس الباسيلي\nالخولاجي\nاسبسمس آدام / افرحى يا مريم\nاوشية الاجتماعات\n"},{"n":"23- الإسبسمس الآدام سنوي / إفرحي يا مريم / أونوف إممو ماريا","t":"إفرحي يا مريم. العبدة والأم. لأن الذي في حجرك. الملائكة تسبحه.\n** Rejoice O Mary, handmaid and mother, for the angels praise Him who is on your lap.\n** Ounof `mmo Maria@ ]bwki ouoh ]mau@ je vy`etqen pe`amyr@ ni`aggeloc cehwc `erof.\n** Efrahi ya Mariam, al-’abda wa al-omo, le-an-al-lazi fee heg-raki, al-mala-eka tosa-beha-ho.\nوالشاروبيم يسجدون له باستحقاق. السيرافيم بغير فتور.\n** And the Cherubim worthily worship Him, and the Seraphim too, without ceasing.\n** Ouoh ni<erobim@ ce`ouwst `mmof axiwc@ nem niCeravim qen oumet`atmounk.\n** Wa-al-sha-robim yasgodo-na laho be-esteh-qak. Wa al-serafim be-ghair fotor.\nليس لنا دالة عند ربنا يسوع المسيح سوي طلباتك وشفاعتك يا سيدتنا كلنا السيدة والدة الإله.\n** We have no boldness before our Lord Jesus Christ apart from your prayers and intercessions, O our Lady, the lady of us all, the Theotokos.\n** `Mmon `ntan `nouparrycia@ qaten pen=o=c I=y=c P=,=c@ ,wric netwbh nem ne`precbia@ `w ten=o=c `nnyb tyren ];e`otokoc.\n** Laisa lana dalah ‘end rabana Yaso’ al-masseh sewa tel-batoke wa shafa-’atoke, ya saieda-tena kol-ena waledat al-elah.\nلكي نسبحك مع الشاروبيم والسيرافيم، صارخين قائلين:\n** That we may praise You with the Cherubim and the Seraphim, proclaiming and saying:\n** Hina `ntenhwc `erok@ nem ni<eroubim nem niCeravim@ enws `ebol enjw `mmoc.\n** Leekay nosab-behaka ma’a al-sherobim wa al-serafim, saree-khena ka-eleen.\nقدوس قدوس قدوس. ايها الرب الضابط الكل. السماء والارض مملوءتان. من مجدك وكرامتك.\n** Holy, holy, holy, O Lord, the Pantocrator, heaven and earth are full of Your glory and honor.\n** Je `,ouab `,ouab `,ouab@ P=o=c piPantokratwr@ `tve nem `pkahi meh `ebol@ qen pek`wou nem pektai.\n** Kodos, kodos, kodos, ayoha al-rabo al-dabet el-kol. A-sama wa al-ardo mam-lo-atane men mag-deka wa kra-mateka.\nنسألك يا أبن الله. ان تحفظ حياة بطريركنا البابا انبا (...) رئيسُ الكهنة. ثبته علي كرسيه.\n** We ask You, O Son of God, to keep the life of our Patriarch, Abba Shenouda, the high priest. Confirm him upon his throne.\n** Tene]ho `erok `w Uioc :eoc@ e;rek `areh `e`pwnq `mpenpatriar,yc@ papa abba Senouda pi`ar,y`ereuc@ matajrof hijen pef`;ronoc.\n** Nas-alak ya Ebn Allah, an tahfaz haiat bat-reiar-kena al-baba al-anba Shenoda ra-eso al-kahana, sabet-ho ala korseh.\nالأسبسمس الآدام\nأونوف إممو ماريا تى فوكى أووه\nتيماف جى فيئت خين بى آميرنى\nآنجيلوس سيهوس إيروف\nأووه نى شيروفيم سى أوأوشت\nإمموف إكسيوس نيم نى سيرافيم\nخين أوميت آت مونك\nإممون إنتان إنؤو باريسيا\nخاتين بين شويس إيسوس بى\nاخرستوس خوريس نى طوفه\nنيم نى إبريسفيا أوتين شويس إن\nنيب تيرين تى ثيئوطوكوس\nهينا إنتين هوس إيروك نيم\nنى شيروفيم نيم نى سيرافيم إنؤوش\nإيفول إنجو إمموس جى: إكؤواب\nإكؤواب إكؤواب ابشويس بى\nبانطوكراطور إتفى نيم إبكاهى ميه\nإيفول خين بيك أو أو نيم بيك طايو\nتين تيهو إيروك أو إيوس ثيئوس\nإثريك آريه إى إب أونخ أم بين\nبطريارشيس آفا (.......) بى\nأرشى إرفس ماطاجروف هيجين\nبيف إثرونوس\nافرحي يا مريم العبدة\nوالأم لأن الذي في\nحجرك الملائكة تسبحه\nوالشاروبيم يسجدون\nله باستحقاق والسيرافيم\nبغير فتور\nليس لنا دالة عند\nربنا يسوع المسيح\nسوى طلباتك وشفاعتك\nيا سيدتنا كلنا السيدة\nوالدة الإله\nلكي نسبحك مع\nالشاروبيم قائلين:\nقدوس قدوس قدوس\nأيها الرب ضابط الكل\nالسماء والأرض\nمملوءتان من مجدك\nوكرامتك\nنسألك يا ابن الله ان\nتحفظ حياة بطريركنا\nأنبا (......) رئيس الكهنة\nثبته على كرسيه.\nبعد صلاة الصلح، يقول المرتلون بالناقوس\n(الإسبسموس الآدام السنوى الآتي)\nويقال في أعياد السيدة العذراء\nانظر أيضًا: شرح اللحن وأبعاده الخمسة: جورج كيرلس.\nقبلوا بعضكم بعضا / اسبازيستى\nالقداس الباسيلي\nالخولاجي\nصلاة الصلح / يا الله العظيم الأبدي\n"},{"n":"24- قَبِّلُوا بعضكم بعضاَ / إسبازيستي","t":"وبعدها يقول الشماس قبلوا بعضكم كالآتي:\nأسبازيستي الليلوس إن فيليما تي\nآجيو كيريي إليسون (3)\nناي كيريي إيتي فاي بي إيسوس بي إخرستوس إبشيري إم إفنوتي سوتيم إيرون أووه ناي نان.\nقبلوا بعضكم بعضًا بقبلة\nمقدسة يا رب ارحم (3)\nنعم يا رب الذي هو يسوع\nالمسيح ابن الله الحي\nإسمعنا وأرحمنا\nإبروسفرين كاطا إطروبو\nإستاثيتي كاطا إطرومو إيس\nأناطولاس إفليبساتي إبروس خومين.\nتقدموا على عهذا الرسم\nقفوا بخوف ورعدة\nوإلى الشرق أنظروا ننصت\nأو تقال أسبازيستي الكبيرة كالآتي:\nأسبازيستي الليلوس إن فيليماتي آجيوآمين كيريي إليسون. كيريي إليسون. كيريي إليسون إيتي فاي بي إيسوس بي إخرستوس إبشيري إم إفنوتي سوتيم إيرون أووه ناي ناي\nإسطومين كالوس إسطومين إفلافوس، إسطومين إن إيريني إسطومين ميتا فوقو ثيئوكي إطروموكي كاطاني إكسيؤس.\nبي إكليروس نيم بي لاؤس تيرف خين أو طوبه نيم اوشيب إهموت نيم أو سيم ني نيم أووكاروف فاي إن نيتين قال إى إبشوي إي إبسا إنتي أناطولي إنتي تين ناف إيبي ثي سيا ستريون إيري بي سومانيم بي إسنوف إنتي إممانوئيل بين نوتي كي إي إهري إيجوف.\nإيري ني آنجليوس أوهي إيراطونيم ني ارشي آنجيلوس ني سيرافيم نابي سو إنتنه نيمني شيروفيم إثميه إمقال. أف هوفس إن نوهو إثفيه إمميت ساي إى إنتي بيف نشتي إن أوؤ إن آت إش إيرثيؤرين إمموف أووه إن آت اشصاجي إمموف إفهوس خين أو إزمي إن أوؤت إقؤش أيفول إقجو إمموس.\nجي آجيوس ز آجيوس. آجيوس كيريوس سافاؤوت إبليريس أورانوس كي إى جي تيس آجياس سوذوكسيس.\nقبلوا بعضكم بعضًا بقبلة مقدسة\nأمين يا رب إرحم يا ارحم\nيا رب ارحم الذي هو يسوع المسيح\nابن الله اسمعنا وارحمنا.\nفلنقف حسنا، لنقف بتقوى\nنقف باتصال، نقف بسلام، نقف\nبخوف الله ورعدة وخشوع.\nأيها الإكليورس وكل الشعب بطلبة\nوشكر بهدوء وسكوت ارفعوا\nأعينكم إلى ناحية المشرق لتنظروا\nالمذبح وجسد ودم عمانوئيل إلهنا موضوعين عليه.\nوالملائكة ورؤساء الملائكة قيام\nالسيرافيم ذو الستة الأجنحة\nوالشاروبيم الممتلئون أعينا يسترون\nوجوهم من بهاء عظمة مجده غير\nالمنظور ولا منطوق به يسبحون\nبصوت واحد صارخين\nقدوس، قدوس قدوس رب\nالصباؤوت، السماء والأرض مملوءتان\nمن مجدك الأقدس\n← رابط اللحن التالي من قسم آخر بالموقع، وبعده: صلاة الصلح للقديس يوحنا.\nبشفاعة والده الاله / هيتين نى ابريسفيا\nالقداس الباسيلي\nالخولاجي\nاسبسمس آدام / افرحى يا مريم\n"},{"n":"26- صلاة الصلح للقديس يوحنا","t":"الكاهن:\nعالٍ فوق كل قوة النطق، وكل فكر العقل، غني مواهبك يا سيدنا.\n** Priest:\n** Exalted above all the power of speech and all the thoughts of mind is the richness of Your gifts, O our Master.\n** Pi`precbuteroc@\n** C[oci ca`pswi `njom niben `nte oucaji nem jinmokmek niben `nte ounouc@ `nje `;metrama`o `nte nekdwrea `w pennyb.\nلأن ما أخفيته عن الحكماء والفُهماء، هذا اعلنته لنا، نحن الأطفال الصغار. وما اشتهي الانبياء والملوك ان يروه ولم يروا.\n** For that which You have hidden from the wise and the understanding, You have revealed to us little children. And those things which prophets and kings have desired to see and have not.\n** Ny gar `etakhopoy `ebolha hancabeu nem hankathyt@ nai ak[orpou nan `ebol `anon qa nikouji `n`alwoui. Ouoh nyet `a han`provytyc@ nem hanourwou er`epi;umin `enau `erwou ouoh `mpounau.\nهذا أنعمت به لنا نحن الخطاه، لكي نخدمه ونتطهر من قِبله. عندما أقمت لنا تدبير إبنك الوحيد الجنس، والسر الخفي الذي لهذه الذبيحة. هذه التي ليس دم الناموس حولها، ولا بر الجسد. لكن الخروف فروَحي، والسكين فنطقية غير جسمية، هذه الذبيحة التي نقدمها لك.\n** The Same You granted to us, who are sinners, that we may serve It and be purified thereby, when You established for us the economy of Your only-begotten Son and the hidden mystery of this sacrifice, which has neither the blood of the Law nor the righteousness of the flesh round about It. Rather, the lamb is spiritual and the knife is verbal and intangible this sacrifice which we offer unto You.\n** Nai aker,arizec;e `mmwou nan `anon qa nirefernobi@ hina `ntensemsi `mmwou ouoh `ntentoubo `ebolhitotou. Qen `pjen`;rektaho nan `eratc `n]oikonomia `nte pekmonogenyc `nSyri@ nem ]muctagwgi`a `nte tai;ucia. :ai ete `mmon `cnof `mpinomoc `mpecko]@ oude oume;myi `nte ]carx. Alla pi`ecwou men ou`pneumatikon pe@ ]cyifi de oulogiky te ouoh `natcwma@ tai;ucia oun ;ai `eten`iri `mmoc nak `eqoun.\nنسأل ونطلب من صلاحك يا محب البشر. طهر شفاهنا واعتق عقولنا من كل اخلاط الهيولي. وارسل لنا نعمة روحك القدوس. واجعلنا أهلاً، أن يقبل بعضُنا بعضاً بقبلة مقدسة.\n** We ask and entreat You goodness, O Lover of Mankind. Purify our lips and free our minds from all carnal pollution, and send to us the grace of Your Holy Spirit, and make us worthy, to greet one another with a holy kiss.\n** Ten]ho ouoh tentwbh `ntekmet`aga;oc pimairwmi. Matoubo `nnen`cvotou ouoh `e aker pennouc `nremhe@ `ebolha jinmoujt niben `nte ]huly. Ouoh ouwrp nan `e`qryi `mpi`hmot `nte pek`pneuma =e=;=u@ ouoh `ariten@ `nem`psa e;ren`eracpazec;e `nnen`eryou qen ouvi =e=;=u.\nالشماس:\nصلوا من أجل السلام الكامل، والمحبة، والقبلة الطاهرة الرسولية.\n** Deacon:\n** Pray for perfect peace, love, and the holy apostolic kisses.\n** Pidiakwn@\n** Proceuxac;e `uper tyc teliac `irynyc ke `agapyc ke twn `agiwn acpacmwn twn `apoctolwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nلكي ننال بغير وقوعنا في دينونة، من موهبتك غير المائتة السمائية، المسيح يسوع ربنا.\n** That without falling into condemnation, we may partake of Your immortal and heavenly gift in Christ Jesus our Lord.\n** `E`pjenten[i qen oumetathitten `e`phap@ `ebolqen tekdwre`a `na;mou ouoh `nepouranion@ qen P=,=c I=y=c pen=o=c.\n** (The People may chant the Aspasmos Adam)\nقبلوا بعضكم بعضا بقبلة مقدسة. يارب ارحم. يارب ارحم. يارب ارحم. نعم يارب الذي هو يسوع المسيح ابن الله، اسمعنا وارحمنا. تقدموا تقدموا تقدموا على الرسم، قفوا برعدة، والي الشرق أنظروا. ننصت.\n** Greet one another with a Holy kiss. Lord have mercy, Lord have mercy, Lord have mercy, yea, Lord, who are Jesus Christ, the Son of God, hear us and have mercy upon us. Offer in order. Stand with trembling. Look towards the East. Let us attend.\n** Acpazec;e allylouc en vilymati `agi`w. `Kuri`e `ele`ycon Kuri`e `ele`ycon@ ce Kuri`e `ete vai pe Iycouc Pi`,rictoc Psyri `mV] cwtem `eron ouoh nai nan. Procverin kata `tropon@ `cta;yte kata `tromou@ ic `anatolac `ble'ate. `Proc,wmen.\nبشفاعات والدة الاله القديسة مريم، يارب انعم لنا بمغفرة خطايانا.\nنسجد لك أيها المسيح، مع ابيك الصالح، والروح القدس، لأنك (أتيت) وخلصتنا.\n** Through the intercessions of the Theotokos, Saint Mary, O Lord, grant us the forgiveness of our sins.\n** We worship You, O Christ, with Your Good Father and the Holy Spirit, for You have (come) and saved us.\n** Hiten niprecbia `nte ];eotokoc =e=;=u Maria@ P=o=c ari`hmot nan `mpi,w ebol `nte nennobi.\n** Tenouwst `mmok w P=,=c nem Pekiwt `n`aga;oc nem pi`P=n=a =e=;=u@ je (ak`i) akcw] `mmon.\nرحمة السلام، ذبيحة التسبيح.\n** A mercy of peace, a sacrifice of praise.\n** Eleoc `irynyc ;ucia `enecewc.\n** صلاة صلح أخري للآب للقديس يوحنا المثلث الطوبي\n** (عال فوق كل قوة النطق وكل فكر العقل غني مواهبك يا سيدنا لأن ما أخفيته عن الحكماء والفهماء هذا أعلنته لنا نحن الأطفال الصغار وا اشتهي الأنبياء والملوك ان يروا هذا أنعمت به علينا نحن الخطاة لكي نخدمه ونتطهر بواسطته عندما أقمت لنا تدبير إبنك الوحيد الجنس والسر الخفي الذي لهذه الذبيحة هذه التي ليس دم الناموس حولها ولا بر الجسد أما الحمل فروحي والسكين فعقلية وغير جسمية هذه الذبيحة التي نقدمها لك).\nيقول الشماس (صلوا من أجل السلامة..إلخ.)\nيقول الشعب: يا رب ارحم\nيقول الكاهن\n(نسأل ونطلب من صلاحك يامحب البشر طهر شفاهنا وأعتق عقولنا من كل أخلاط الهيولي وأرسل علينا نعمة روحك القدوس وإجعلنا أهلًا أن نقبل بعضنا بعضا بقبلة مقدسة لكي ننال بغير وقعنا في دينونة من موهبتك غير المائتة السمائية بالمسيح يسوع ربنا هذا الذي من قبله المجد والكرامة والعزة والسجود إلخ.).\n← رابط اللحن السابق من قسم آخر بالموقع، وقبله: قبلوا بعضكم بعضا / اسبازيستى.\nبشفاعة والده الاله / هيتين نى ابريسفيا\nمستحق وعادل / اكسيون\nالقداس الباسيلي\nالخولاجي\n"},{"n":"27- مستحق وعادل / أكسيون كي ذيكيئون","t":"الكاهن:\nالرب مع جميعكم.\n** Priest:\n** The Lord be with you all.\n** Pi`precbuteroc@\n** O Kurioc meta pantwn `umwn.\nالشعب:\nومع روحك أيضاً.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke meta tw `pneumatoc cou.\nإرفعوا قلوبكم.\n** Lift up your hearts.\n** Anw `umwn tac kardiac.\nهي عند الرب.\n** We have them with the Lord.\n** E,omen `proc ton Kurion.\nفلنشكر الرب.\n** Let us give thanks to the Lord.\n** Eu,arictycwmen tw Kuriw.\nمستحقٌ وعادل.\n** It is meet and right.\n** Axion ke dikeon.\nمستحقٌ وعادل، مستحقٌ وعادل، لأنه حقاً بالحقيقة مستحقٌ وعادل. أيها الكائن السيد الرب الإله الحق. الكائن قبل الدهور والمالك إلي الأبد.\n** Meet and right, meet and right, truly indeed, it’s meet and right. O You, THE BEING, Master, Lord, God of Truth, being before the ages and reigning forever.\n** Axion ke dikeon@ axion ke dikeon@ `aly;wc gar qen oume;myi@ axion ke dikeon. Vyetsop `vnyb P=o=c V] `nte ]me;myi. Vyetsop qajwou `nni`eneh@ ouoh etoi `nouro sa `eneh.\nالساكن في الأعالي والناظر إلي المتواضعات. الذي خلق السماء والأرض والبحر وكل ما فيها.\n** Who dwell in the highest and look upon the lowly; who have created the heaven, the earth, the sea, and all that is therein.\n** Vy`etsop qen nyet[oci@ ouoh etjoust `ejen nyet;ebiyout. Vy`etaf;amio `n`tve nem `pkahi nem `viom@ nem ny`ete `nqytou tyrou.\nأبو ربنا وإلهنا ومخلصنا يسوع المسيح.\n** The Father of our Lord, God, and Savior Jesus Christ.\n** Viwt `mpen=o=c ouoh pennou] ouoh penCwtyr I=y=c P=,=c.\nهذا الذي خلقت الكل به، ما يري وما لا يري.\n** By whom You have created all things, visible and invisible.\n** Vai `etak;amio `m`ptyrf `ebolhitotf@ ny`etounau `erwou nem ny`ete `ncenau `erwou an.\nالجالس علي كرسى مجده، المسجود له من جميع القوات المقدسة.\n** Who sits upon the throne of His glory; and who is worshipped by all the holy powers.\n** Vyethemci hijen pi`;ronoc `nte pef`wou@ vy`etououwst `mmof hiten jom niben =e=;=u.\nالشماس:\nأيها الجلوس قفوا.\n** Deacon:\n** You who are seated, stand.\n** Pidiakwn@\n** I ka;ymeni `nac;yte.\nالذي يقف أمامه الملائكة ورؤساء الملائكة، والرئاسات والسلطات والكراسى، والربوبيات والقوات.\n** Before whom stand the angels, the archangels, the principalities, the authorities, the thrones, the dominions, and the powers.\n** Vy`etou`ohi `eratou nahraf@ `nje ni`aggeloc@ nem ni`ar,y`aggeloc@ ni`ar,y@\n** niexoucia@ ni`;ronoc@ nimet[oic@ nijom.\nوإلي الشرق أنظروا.\n** Look towards the East.\n** Ic `anatolac `ble'ate.\nأنت هو الذي يقف حولك الشاروبيم الممتلئون أعينا، والسارافيم ذوو الستة الأجنحة، يسبحون على الدوام بغير سكوت قائلين:\n** You are He around whom stand the Cherubim full of eyes, and the Seraphim with six wings, praising continuously, without ceasing, saying:\n** N;ok gar pe `etou`ohi `eratou `mpekkw]@ `nje ni<eroubim e;meh `mbal@ nem niCeravim na picoou `ntenh@ euerhumnoc qen oumoun `ebol `nat,arwou eujw `mmoc.\nننصت.\n** Let us attend.\n** `Proc,wmen.\n** (The people may chant the Aspasmos Watos)\nوبعد إنتهاء صلاة الصلح يرفع الكاهن الإبروسفارين procverin ويسلمه للشمامسة ثم يضع الكاهن اللفافة التي معه على يده اليسري ويأخذ اللفافة التي علي القربانة بيمينه ويرشم بها الشعب أولًا بمثال الصليب ويقول\nأوكيريوس ميطابانطون إيمون\nيقول الشعب:\nكي مي طاطو إبنيقماتو سو\nثم يرشم الخدام إلى جانبي المذبح ويقول:\nآنو إيمون طاس كارذياس\nإيخومين إبروس طون كيريون\nثم يرشم ذاته ويخضع قائلًا:\nإيفخاريس تيسومين طوكيريو\nأكسيون كي ذي كيئون\nيقول الكاهن:\nأكسيون كي ذي كيئون\nآليثوس غارخين اوميثمي أكسيون\nكي ذي كيئون\nفيئتشوب إننيب إبشويس\nإفنوتي إنتي تي ميثمي فيئتشوب\nخاجوؤو إن ني إبنيه أووه إت أوى\nإن أورو شا إينيه. فيئتشوب خين ني إتتشوسي أووه إت جوشت إيجين نيئتثيقيوت فيئيتاف ثاميو إن إتفي نيم إبكاهي نيم إفيوم نيم نيئتي إنخيتو\nتيرو. إفيوت إمبين شويس أووه\nبيننوتي أووه بين سوتير إيسوس بي إخرستوس فاى إيتاك ثاميو إم إبتيرف إيقول هي ططف ني إيتو ناق إيروؤونيم نيئتي إنسيناق إيروؤو آن. فيئت\nهيمسي هيجين بيإثرونوس إنتي\nبيف أوأو فيئيتو أوأوشت إمموف\nهيتين جوم نيفين إثؤواب.\nلأنه حقًا بالحقيقة مستحق\nوعادل أيها الكائن السيد\nالرب إله الحق الكائن\nقبل الدهور والمالك إلى\nالأبد الساكن في\nالعالي والناظر إلى\nالمتواضعين الذي خلق\nالسماء والأرض والبحر\nوكل ما فيها أبو ربنا\nوإلهنا ومخلصنا\nيسوع المسيح\nهذا الذي خلقت\nبه كل شيئ ما يُري\nوما لا يري الجالس\nعلى كرسي مجده\nالمسجود له من جميع\nالقوات المقدسة\nيقول الشماس:\nإيكاثي ميني آناسثيتي.\nفيئتو أو هي إى راتو ناهراف إنجي\nني آنجيلوس نيم ني أرشي\nآنجيلوس نيم أرشي ني إكسوسيا ني إثرونوس ني ميت شويس\nني جوم.\nالذي يقف أمامه الملائكة\nورؤساء الملائكة\nالرئاسات والسلطات\nوالكراسي والأرباب\nوالقوات\nإيس أناطولاس إقليبساتي\nإنثوك غاربي إتؤ أو هي إيراتو إم بيك كوتي إنجي ني شيروفيم إثميه\nإمقال نيم ني سيرافيم نابي سو\nإن تنه. إيقئير هيمنوس خين\nأومون إيقول إن أت كارورو إيقجو إمموس.\nانت هو الذي يقف حولك\nالشاروبيم الممتلئون\nأعينًا والسيرافيم\nذوو الستة الأجنحة\nيسبحون دائمًا بغير\nسكوت قائلين\nإبروس خومين\nالشاروبيم يسجدون لك / نى شيروفيم\nالقداس الباسيلي\nالخولاجي\nصلاة الصلح للقديس يوحنا\n"},{"n":"28- لحن الشاروبيم يسجدون لك / ني شيروبيم","t":"الشعب:\nالشاروبيم يسجدون لك، والسيرافيم يمجدونك، صارخين قائلين:\n** People:\n** The Cherubim worship You, and the Seraphim glorify You, proclaiming and saying:\n** Pilaoc@\n** Ni<eroubim ceouwst `mmok@ nem niCeravim ce]`wou nak@ euws `ebol eujw `mmoc@\n\"قدوس. قدوس. قدوس. رب الصاباؤت. السماء والأرض مملوءتان من مجدك الاقدس.\"\n** \"Holy, holy, holy, Lord of hosts. Heaven and earth are full of Your holy glory.\"\n** Je `agioc `agioc `agioc@ Kurioc cabaw;@ `plyryc `o ouranoc ke `y gy@ tyc `agiac cou doxyc.\nيقول الشعب الاسبسمس السنوى الآتي:\nني شيروبيم سي أو أوشت إمموك نيم\nني سيرافيم سي تيؤواو ناك\nإيف أوش إيقول إقجوإمموس جي\nآجيوس آجيوس آجيوس كيريوس ساقاؤوت إبلي ريس أو أورانوس\nكي إيجي تيس آجياس\nسوذوكسيس.\nالشاروبيم يسجدون\nلك، والسيرافيم يمجدونك\nصارخين قائلين: قدوس\nقدوس، قدوس\nرب الصباؤوت، السماء\nوالأرض مملوءتان من\nمجدك الأقدس\nانظر أيضًا: شرح اللحن وأبعاده الخمسة: جورج كيرلس.\nالقداس الباسيلي\nالخولاجي\nايها الرب اله الوقات / ابشويس افنوتى\nمستحق وعادل / اكسيون\n"},{"n":"29- اسبسمس واطس سنوي: لحن أيها الرب إله القوات / إبشويس إفنوتي","t":"أو يقول الشعب هذا الأسبسمس الواطس:\nإبشويس إفنوتي أنتي نيجوم\nكوتك أووه جوشت إيقول خين أتفي\nآناف أووه جيم إبشيني إنتاي\nقو إن ألولي سيقطوطس أووه\nسيمنتيس ثاي إيطاس إتشوس إنجي\nتيك أوى نام. الليلوياالليلويا الليلويا\nإزمو إيني سيتي نيم ني سيم ماري بيك\nناي نيم تيك هيريني أوى إن سوفت إم\nبيك لاؤس.\nأيها الرب إله القوات\nارجع واطلع من السماء\nانظر وتعهد هذه\nالكرمة، اصلحها وثبتها\nهذه التي غرستها يمينك.\nهلليلويا هلليلويا هلليلويا. بارك\nالزروع والعشب فلتكن\nرحمتك وسلامك حصنا\nلشعبك\nوإذا كان الوقت من 11 طوبة إلى 11 بؤونة فيقال في الأسبسمس:\n** (بارك اهوية السماء: إزمو آإيرإنتي إتفي ومن 12 بؤونة إلي 9 بابه يقال (بارك مياه النهر إزمو ني موؤو إفيارو) وباقي أيام السنة يقال لأجل الزرع كما توضح قبلًا.\nايها الرب أله القوات، إرجع و اطلع من السماء, انظر وتعهد هذه الكرمة، أصلحها و ثبتها، هذه التي غرستها يمينك.\n** O Lord, God of the powers, return and behold from heaven, and look and visit this vine, restore and establish Her, this which Your right hand has planted.\n** P=o=c V] `nte nijom > kotk ouoh joust `ebol qen `tve > `anau ouoh jem`psini `ntaibw `n`aloli > cebtwtc ouoh cemnytc ;ai `etac[oc `nje tekou`inam . ~Allylo`uia `allylo`uia `allylo`uia .\nهلليلويا،هلليلويا،هلليلويا، بارك الزروع و العشب، فلتكن رحمتك و سلامك حصناً لشعبك.\n** Alleluia,Alleluia,Alleluia. Bless the herbs and the plants. May Your mercy and Your peace be a fortress to Your People.\n** `cmou `enici] nem nicim mare peknai nem tekhiryny > oi `ncobt `mpekla`oc .\n\"قدوس.قدوس.قدوس. رب الصاباؤوت. السماء و الأرض مملوءتان من مجدك الاقدس.\"\n** \"Holy,Holy,Holy,Lord of Hosts, heaven and earth are full of Your glory.\"\n** Je `agioc `agioc `agioc > Kurioc cabaw; > `plyryc `o ouranoc kai `y gy > tyc `agiac cou doxyc .\n(يقول المرتلون الأسبسمس الواطس السنوى الآتي)\nكوتك أووه جوشت إيفول خين\nإتفى آناف أووه جيم إبشينى إنتاى\nفو إن ألولى سيفططس أووه\nسيمنتس. ثاى إيطاس إتشوس\nإنجى تيك أوى نام\nالليلويا، الليلويا\nالليلويا\nإزمو إينى سيتى نيم نى سيم\n  the holy Virgin Mary,\n** Hiten pekmonogenyc `nSyri pen=o=c ouoh pennou] ouoh pen=c=w=r I=y=c P=,=c. Vai `ete `ebolqen pi`P=n=a =e=;=u@ nem `ebolqen ]par;enoc =e=;=u Mari`a.\nالشعب:\nآمين.\n** People:\n** Amen.\n** Pilaoc@\n** Amyn.\nثم يمسك الكاهن اللفافة التي على الكأس بيمينه ويرشم بها ثلاثة رشوم: الأول على ذاته والثاني على الخدام والثالث على الشعب وفي كل رشم يقول:\nقدوس\nآجيوس\nثم يستمر في الصلاة قائلًا:\nإكؤواب إكؤواب إكؤواب\nخين أو ميثمي إبشويس بيننوتي.\nفيئيطاف إير إبلازين إممون أووه أفثاميون أووه أفكان خين بي بارذيسوس إنتي إبؤونوف خين إبجين إيثرين\nإيربرافينين ذى إنتيك إنتولي\nهيتين ني آباتي إنتي بيهوف أنهي\nإيقول خين بي كونخ إن إينيه أووه أقئرإكسوريزين إممون إيقول خين بي بارذيسوس إنتي إبؤونوف. إمبيك\nكان إنثوك أون شا إيقول آللا أك\nجيم بين شيني خين أو مون إيقول\nهيتين نيك إبروفيتيس إثؤواب.\nأووه خين إيتخائي إنتي نيئيهوؤو أكؤونه نان إيقول أنون خانيئتهيمسي خين\nإبكاكي نيم إتخيفي إم إفمو هيتين\nبيك مونوجينيس إنشيري بين\nشويس أووه بيننوتي أووه بينسوتير إيسوس بي إخرستوس فاي\nإيتي إيقول خين بي إبنيقما إثؤواب\nنيم إيقول خين تي بارثينوس\nإثؤواب ماريا.\nقدوس قدوس قدوس\nبالحقيقة أيها\nالرب إلهنا الذي جبلنا\nوخلقنا ووضعنا في\nفردوس النعيم وعندما\nخالفنا وصيتك\nبغواية الحية سقطنا\nمن الحياة الأبدية و\nنفينا من فردوس النعيم فلم\nتتركنا عنك أيضًا\nإلى الانقضاء بل تعهدتنا\nدائمًا بأنبيائك القديسين\nوفي أخر الأيام ظهرت\nلنا نحن الجلوس في الظلمة\nوظلال الموت بإبنك\nالوحيد الجنس ربنا\nوإلهنا ومخلصنا يسوع\nالمسيح هذا الذي\nمن الروح\nالقدس ومن\nالعذراء القديسة\nمريم\nيقول الشعب:\nحقًا\nالشاروبيم يسجدون لك / نى شيروفيم\nتجسد وتأنس / افتشى ساركس\nالقداس الباسيلي\nالخولاجي\n"},{"n":"31- تجسد وتأنس / أفتشي ساركس أووه","t":"الكاهن:\nتجسد وتأنس وعلمنا طرق الخلاص. وأنعم علينا بالميلاد الذى من فوق بواسطة الماء والروح. وجعلنا له شعباً مجتمعا، وصيرنا أطهارا بروحك القدوس. هذا الذي أحب خاصته الذين في العالم، وسلم ذاته فداءً عنا، إلي الموت الذي تملك علينا، هذا الذى كنا ممسكين به، مبيعين من قبل خطايانا.\n** Priest:\n** Was incarnate and became man, and taught us the ways of salvation. He granted us the birth from on high through water and Spirit. He made us unto Himself a congregation, and sanctified us by Your Holy Spirit. He loved His own who are in the world, and gave Himself up for our salvation unto death, which reigned over us, whereby we were bound and sold on account of our sins.\n** Pi`precbuteroc@\n** Af[icarx ouoh aferrwmi@ ouoh af`tcabon `ehanmwit `nte pioujai. Eafer,arizec;e nan `mpimici pi`ebol `m`pswi hiten oumwou nem ou`pneuma. Afaiten naf `noulaoc ef;ouyt@ af`;renswpi enouab@ hiten Pek=p=n=a =e=;=u. Vai etafmenre ny`ete nouf etqen pikocmoc@ aftyif `mmin `mmof `ncw] qaron@ `e`vmou etoi `nouro `e`hryi ejwn@ vai `enau`amoni `mmon `ebol hitotf@ entoi `ebol hiten nennobi.\nنزل إلي الجحيم من قبل الصليب.\n** He descended into Hades through the Cross.\n** Afsenaf `epecyt `e`amen] `ebol hiten pi`ctauroc.\nالشعب:\nحقا أؤمن.\n** People:\n** Amen. I believe.\n** Pilaoc@\n** Amyn ]nah].\nيقدم الشماس المجمرة للكاهن فيضع فيها يد يخور ويقول:\nآفتشي ساركس أووه آفئير رومي\nأووه آف إتسافون إيهان مويت إنتي بي أوجاي. إى آفئير خارزستي نان إمبي\nيسي بي إيقول إم إبشوي هيتين أوموؤو\nنيم او إبنيقما. آف أيتين ناف إن أو\nلاؤس إفثويت ىفئيرين شوبي\nإثؤواب هيتين بيك إبنيقما\nإثؤواب فاي إيطاف منري ني\nإيتي نوف إيتخين بي كوزموس\nآفتيف إممين إمموف إن سوتي خارون إيئفمو إت أوي إنئورو إيئهري إيجون\nفاي إبطاف أموني إممون إيقول هيططف إنطوي إيقول هيتين نين نوفي أفشيناف إيبيسيت إى آمنتي إيقول هيتين بي إستافروس.\nتجسد و\nتأنس وعلمنا طرق\nالخلاص وأنعم علينا\nبالميلاد الذي من\nفوق بواسطة الماء\nوالروح وجلعنا له شعبًا\nمجتمعًا وصيرنا أطهارًا\nبروحك القدوس هذا الذي\nأحب خاصته الذين في العالم\nوأسلم ذاته فداءًا عنا إلى\nالموت الذي تملك علينا\nهذا الذي كنا ممسكين\nبه مبيعين من قبل\nخطايانا نزل إلى الجحيم\nعن طريق الصليب\nيقول الشعب:\nآمين تي ناهتي\nالقداس الباسيلي\nالخولاجي\nوقام من بين الاموات / افتونف ايفول\nايها الرب اله الوقات / ابشويس افنوتى\n"},{"n":"32- وقام من بين الأموات / أفطونف إيفول","t":"الكاهن:\nوقام من الأموات في اليوم الثالث. وصعد إلي السموات، وجلس عن يمينك أيها الآب.\n** Priest:\n** He rose from the dead on the third day. He ascended into the heavens and sat at Your right hand, O Father.\n** Pi`precbuteroc@\n** Aftwnf ebolqen ny`e;mwout@ qen pi`ehoou `mmahsomt. Afsenaf `e`pswi `enivyou`i@ afhemci catekou`inam Viwt.\nورسم يوما للمجازاة، هذا الذي يظهر فيه ليدين المسكونة بالعدل، ويعطى كل واحد حسب أعماله.\n** He has appointed a Day for recompense, on which He will appear to judge the world in righteousness, and give each one according to his deeds.\n** Eaf;ws `nou`ehoou `n]sebi`w@ vai `ete `fnaouwnh `ebol `nqytf@ `e]hap `e]oikoumeny qen oudike`ocuny@ ouoh `fna] `mpiouai piouai kata nef`hbyou`i.\nالشعب:\nكرحمتك يا رب، وليس كخطايانا.\n** People:\n** According to Your mercy, O Lord, and not according to our sins.\n** Pilaoc@\n** Kata to `eleoc cou Kurie@ ke my kata tac `amartiac `ymwn.\nيقول الكاهن:\nآفطونف ايفول خين نيئثموؤت خين لي إيهوؤو إم ماه شمت أفشيناف إي إبشوى إبنيفيئوي أفهيمسي ساتيك أوى نام إفيوت إي أفئوش إن أو إيهوؤوإنتي شيقيو فاى إيتي إفناؤونه إيقوةل إنخيتف إيتهاب إتيئيكوميني خين أوذيكيئو سيتي أووه إفناتي إمبي أواي بي أواي كاتا نيف إهفيئوي.\nوقام من بين الأموات\nفي اليوم الثالث وصعد إلى\nالسموات وجلس عن\nيمينك أيها الأب ورسم\nيوما للمجازاة\nهذا الذي يظهر\nفيه ليدين المسكونة\nبالعدل ويعطي كل\nواحد كنحو أعماله (أو بحسب أعماله)\nيقول الشعب:\nكاطا طو إيليؤوس سو كيريي كي مي كاطاطس أمرتياس إيمون.\nكرحمتك يا رب وليس\nكخطايانا\n** According to Your mercey, O Lord, and not according to our sins.\nالقداس الباسيلي\nالخولاجي\nووضع لنا / فيما هو راسم / اخذ خبز\nتجسد وتأنس / افتشى ساركس\n"},{"n":"33- ووضع لنا / فيما هو راسم / أخذ خبزًا","t":"الكاهن:\nووضع لنا هذا السر العظيم الذي للتقوَى. لأنه فيما هو راسم أن يسلم نفسه للموت عن حياة العالم.\n** Priest:\n** He instituted for us this great mystery of godliness. For being determined to give Himself up to death for the life of the world.\n** Pi`precbuteroc@\n** Af,w de nan `e`qryi `mpainis] `mmuctyrion `nte ]meteucebyc@ ef;ys gar `etyif `e`vmou qa `pwnq `mpikocmoc.\nالشعب:\nنؤمن.\n** People ضع الكاهن ثانية ويبسط يديه ويقول سرًا:\nبين شويس أووه بين نوتي اووه بين سوتير إيسوس بي إخرستوس إقتي إمموف إإبكو إيقول إنتي ني نوقي نيم أونخ إن إنيه إن نيئثناتشي إيقول إنخيتف.\nربنا وإلهنا ومخلصنا\nيسوع المسيح يعطى لغفران\nالخطايا وحياة أبدية لمن\nيتناول منه\nثم يرشم الكأس ثلاثًا ويقول جهرًا:\nأووه باى أفوت ذى أون إن إسنوف إتطايوت إنتي تي ذياثيكي إمقيري إنتاف.\nوهذه الكأس أيضًا دمًا\nكريمًا للعهد الجديد الذي له\nيسجد الشعب أيضًا ويقولون:\nكي بالين تي ناهتي آمين\nوأيضًا نؤمن\nثم يخضع الكاهن ثانية ويقول سرًا:\nبين شويس أووه بيننوتي اووه بين سوتير إيسوس بي إخرستوس إقتي إمموف إإبكو إيقول إنتي ني نوقي نيم أوأونخ إن إنيه إن نيئثناتشي إيقول إنخيتف.\nيسوع المسيح يعطى\nلغفران الخطايا وحياة أبدية لمن\nتبشرون بموتى / أمين آمين\nاجعلنا مستحقين / أريتين ان ايم\nالقداس الباسيلي\nالخولاجي\n"},{"n":"38- اجعلنا مستحقين / آريتين إن إيم","t":"الكاهن:\nاجعلنا مستحقين كلنا، يا سيدنا، أن نتناول من قُدساتك طهارةً لأنفسنا وأجسادنا وأرواحنا. لكي نكون جسدا واحدا، وروحا واحدا، ونجد نصيبا وميراثا مع جميع القديسين الذين أرضوك منذ البدء.\n** Priest:\n** Make us all worthy, O our Master, to partake of Your holies, unto the purification of our souls, our bodies, and our spirits, that we may become one body, and one spirit, and may have a share and an inheritance with all the saints who have pleased You since the beginning.\n** Pi`precbuteroc@\n** Ariten `nem`psa tyren pennyb@ `e[i ebolqen ny=e=;=u `ntak@ `eoutoubo `nte nen'u,y nem nencwma nem nen=p=n=a. Hina `n`tenswpi `noucwma `nouwt@ nem ou`pneuma `nouwt@ `ntenjimi `noumeroc nem ou`klyroc@ nem nye;ouab tyrou `etauranak icjen `p`eneh.\nينهض الشعب ويقول:\nكيريي إليسون كيريي إليسون كيريي إليسون\nيا رب ارحم يا رب ارحم يا رب إرحم\nيقف الكاهن ويقول:\nآريتين إن إيم إبشاتيرين بين نيب إتشي إيقول خين نيئثؤواب إنتاك إي أوطوقو إنتي نين إبسيشي نيم نين سوما نيم نين إبنيقما آهينا إنتين شوبي إن اوسوما إن أوأوت نيم أو إبنيقما إن أوأوت إنتين جيمي إن أوميروس نيم أو إكليروس نيم نيئثؤواب تيروإيتافراناك يسجين إبئينيه.\nإجعلنا مستحقين كلنا\nيا سيدنا أن نتناول من\nقدساتك طهارة لأنفسنا\nوأجسادنا وأرواحنا لكي\nنكون جسدًا واحدًا\nوروحًا واحدًا ونجد نصيبًا\nوميراثًا مع جميع\nالقديسين الذين أرضوك\nمنذ البدء\nأوشية سلام الكنيسه\nالقداس الباسيلي\nالخولاجي\nسر حلول الروح القدس\n"},{"n":"39- أوشية سلام الكنيسة","t":"أذكر يا رب سلام كنيستك الواحدة، الوحيدة المقدسة، الجامعة الرسولية.\n** Remember, O Lord, the peace of Your one, only, holy, catholic, and Apostolic Orthodox Church.\n** Ari`vmeu`i P=o=c `n]hiryny `nte tekou`i `mmauatc =e=;=u `nka;oliky `n`apoctoliky `nekklyci`a.\nالشماس:\nصلوا من اجل سلام الواحدة المقدسة الجامعة الرسولية كنيسة الله الارثوذكسية.\n** Deacon:\n** Pray for the peace of the one, holy, catholic, and apostolic Orthodox Church of God.\n** Pidiakwn@\n** Proc`euxac;e `uper tyc `irynyc tyc `agiac monyc ka;olikyc ke `apoctolikyc or;odoxou tou :eou ekklyciac.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nالكاهن:\nهذه التي اقتنيتها لك بالدم الكريم الذي لمسيحك. احفظها بسلام، وكل الأساقفة الأرثوذكسيين الذين فيها.\n** Priest:\n** This, which You have acquired onto Yourself with the precious blood of Your Christ, keep her in peace, with all the orthodox bishops who are in her.\n** Pi`precbuteroc@\n** :ai etak`jvoc nak `ebol hiten pi`cnof ettaiyout `nte Pek=,=c. Areh `eroc qen ouhiryny@ nem ni`epickopoc tyrou `nor;odoxoc `ete `nqytc.\nوأولاً اذكر يا رب بطريركنا الأب المكرم رئيس الكهنة البابا المعظم أنبا (...).\n** Foremost remember, O Lord, our blessed and honored father, the archbishop our patriarch, Abba (...).\n** Nsorp men ari`vmeu`i `P=o=c `mpenpatria,yc `niwt ettaiyout `nar,i`ereuc papa abba (...).\nثم يقول الكاهن السبع أواشي الصغار واولها أوشية السلام\nآري إفميقئي إبشويس إنتي هيريني إنتي تيك أوى إمماقتس إثؤواب إن كاثوليكي إن آبوسطوليكي إن إككليسيا.\nأذكر يا رب سلام كنيستك\nالواحدة الوحيدة المقدسة الجامعة\nالرسولية\nيقول الشماس:\nإبروس إيقئكساستي إيبيرتيس إيريئيس تيس آجياس مونيس كاثوليكي كي ىبوسطوليكيس اورثوذوكسوطوثيئو إككليسياس.\nصلوا من أجل سلام كنيسة\nالله الواحدة المقدسة الجامعة\nالرسولية الأرثوذكسية\nيقول الشعب:\nكيريي إليسون\nيقول الكاهن:\nثاي إيطاك إجفوس ناك إيقول هيتين بي إسنوف إتطايوت إنتي بيك إخرستوس آريه إيروس خين او هيريني نيم ني إبيسكوبوس تيرو إن اورثوذكسوس إيتي إنخيتس إنشورب مين آري إفميقئي إبشويس إمبين مكاريس إنيوت إتطايوت إن أرشي إبيسكوبوس بين بطريارشيس بابا آقا (...)\nهذا التي إقتنيتها\nلك بالدم الكريم\nالذي لمسيحك إحفظها\nبسلام وجميع الأساقفة\nالأرثوذكسيين الذين\nفيها واولًا أذكر\nيا رب ابانا الطوباوي\nالمكرم رئيس\nالأساقفة بطريركنا البابا\nأنبا (...)\nاوشية الاباء\nالقداس الباسيلي\nالخولاجي\nاجعلنا مستحقين / أريتين ان ايم\n"},{"n":"40- أوشية الأباء","t":"الشماس:\nصلوا من أجل رئيس كهنتنا البابا أنبا (...) بابا وبطريرك ورئيس أساقفة المدينة العظمي الاسكندرية، وسائر أساقفتنا الارثوذكسيين.\n** Deacon:\n** Pray for our high priest, Papa Abba (...), pope and patriarch and archbishop of the great of Alexandria, and for our orthodox bishops.\n** Pidiakwn@\n** Proc`euxac;e `uper tou`ar,y `erewc `ymwn papa abba (...) papa ke patriar,ou ke `ar,y `epickopou tyc megalo polewc Alexan`driac@ ke ton `or;odoxwn `ymwn `epickopwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nالكاهن:\nوالذين يفصلون معه كلمة الحق باستقامة. أنعم بهم على كنيستك المقدسة يرعون قطيعك بسلام.\n** Priest:\n** And those who rightly define the word of truth with him, grant them unto Your holy church to shepherd Your flock in peace.\n** Pi`precbuteroc@\n** Nem nyetswt `ebol nemaf `m`pcaji `nte ]me;myi qen oucwouten. Ari,arizec;e `mmwou `ntek`ekklyci`a =e=;=u@ eu`amoni `mpek`ohi qen ouhiryny.\nأذكر يارب القمامصة، والقسوس الأرثوذكسيين والشمامسة.\n** Remember, O Lord, the orthodox hegumens, priests, and deacons.\n** Ari`vmeu`i P=o=c `nnihygoumenoc@ nem ni`precbuteroc `nor;odoxoc@ nem nidiakwn.\nصلوا من أجل القمامصة القسوس والشمامسة والايبوذياكونيين وسبع طغمات كنيسة الله.\n** Pray for the hegumens, priests, deacons, subdeacons, and the seven orders of the Church of God.\n** `Proc`euxac;e `uper twn `ygoumenwn ke `precbuterwn ke diakonwn ke `upodiakwnwn epta tagmatwn tou :eou tyc ekklyciac.\nأوشيه الآباء\nيقول الشماس:\nإبروس إيقئكساستي إيبرتو أرشي إيريئوس إيمون بابا آقا (...) بابا كي باطريارخو يك أرشي إبيسكوبوتيس ميغالو بوليئوس آليكساندرياس كي طون أورثوذوكسون إيمون إبيسكوبون.\nصلوا من أجل رئيس\nكهنتنا البابا أنبا (...)\nبابا وبطريرك ورئيس\nأساقفة المدينة العظمي\nالإسكندرية وسائر أساقفتنا\nالأرثوذكسيين\nيقول الشعب:\nكيريي إليسون\nيقول الكاهن:\nنيم نيئتشوت إيقول نيماف إم إبساجي إنتي تي ميثمي خين أو سوؤتين. آري خاريزيستي إمموؤو إنتيك إككليسيا إثؤواب إيف أموني إمبيك أوهي خين هيريني.\nوالذين يفصلون معه\nكلمة الحق باستقامة أنعم\nبهم على كنيستك\nالمقدسة ليرعوا قطيعك\nبسلام\nأري إفميقئي إبشويس إن ني هيغومينوس نيم ني إبريسقيتيروس إن اورثوذكسوس نيم ني ذياكون.\nأذكر يا رب القمامصة\nوالقسوس الأورثوذوكسيين و\nالشمامسة\nإبروس إيقئكساستي إيبرتون إيغومينون كي إبريسقيتيرون كي ذياكونون كي إيبوذياكنون إبتا طغماتون توثيئوتيس إككليسياس.\nصلوا من أجل\nالقمامصة والقسوس\nوالشمامسة والإيبوذياكونيين\nوسبع طغمات كنيسة الله\nإوشية الموضع\nالقداس الباسيلي\nالخولاجي\nأوشية سلام الكنيسه\n"},{"n":"41- أوشية الموضع","t":"الكاهن:\nاذكر يا رب خلاص هذا الموضع المقدس الذي لك، وكل المواضع، وكل أديرة آبائنا الأرثوذكسيين.\n** Priest:\n** Remember, O Lord, the salvation of this, Your holy place, and every place, every monastery of our orthodox fathers.\n** Pi`precbuteroc@\n** Ari`vmeui P=o=c `n`tcwtyria `mpaitopoc =e=;=u `ntak vai@ nem topoc niben@ nem monactyrion niben `nte nenio] `nor;odoxoc.\nالشماس:\nصلوا من أجل خلاص العالم، ومدينتنا هذه، وسائر المدن والأقاليم والجزائر والأديرة.\n** Deacon:\n** Pray for the salvation of the world and of this city of ours and of all cities, districts, islands, and monasteries.\n** Pidiakwn@\n** `Proc`euxac;e `uper tyc cwtyriac tou kocmou ke tyc polewc `tmwn tautyc ke twn ,wrwn ke nycwn ke monactyrion.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nوالساكنين فيها بإيمان الله.\n** And those who dwell therein in God’s faith.\n** Nem nyetsop `nqytou qen pinah] `nte V].\n** (When outside of Egypt, this response is prayed, combining the 3 litanies)\nيقول الكاهن:\nآري إفميقئي إبشويس إن إتسوتيريا إمباي توبوس إثؤواب إئتاب فاي نيم توبوس نيقين نيم موناستيريون نيقين إنتي نين يوتي إن أورثوذوكسوس.\nأذكر يا رب خلاص\nهذا الموضع الذي لك وكل\nالمواضع وكل أديرة آبائنا\nالأرثوذكسيين\nيقول الشماس:\nإبروس إيقئكساستي إيبرتيس سوتيرياس طوكوزموكي تيس بوليئوس إيمون طاقتيس كي باسون بوليئون كي طون خورون كي نيسون كي باسون كي موناستيريون.\nصلوا من أجل\nخلاص العالم ومدينتنا\nهذه وسائر المدن والأقاليم\nوالجزائر والأديرة\nيقول الشعب:\nكيريي إليسون\nنيم ني إتشوب إنخيتو خين بي ناهتي إنتي إفنوتي\nآوشية الخدام\nالقداس الباسيلي\nالخولاجي\nاوشية الاباء\n"},{"n":"41- أوشية الرحمة: وكل الخدام","t":"الكاهن:\nوكل الخدام، وكل الذين في البتولية وطهارة كل شعبك المؤمن. أذكر يا رب أن ترحمنا كلنا معا.\n** Priest:\n** And all the servants and all who are in virginity, and the purity of all Your faithful people. Remember, O Lord, to have mercy upon us all.\n** Pi`precbuteroc@\n** Nem refsemsi niben@ nem ny tyrou etqen ]par;enia@ nem outoubo `mpeklaoc tyrf `mpictoc. Ari`vmeu`i P=o=c `nteknai nan tyrou eucop.\nالشعب:\nارحمنا يا الله الآب، ضابط الكل.\n** People: Have mercy upon us, O God, the Father, the Pantocrator.\n** Pilaoc@\n** Ele`ycon `ymac `o :eoc `o Patyr `o Pantokratwr.\nيقول الكاهن:\nنيم ريف شمشي نيقين نيم ني تيروإتخين تي بارثي نيا نيم أؤطوقو إمبيك لاؤس تيرف إمبستوس آري إفميقتي إبشويس إنتيك ناي نان تيرو إقسوب.\nوكل الخدام وكل\nالذين في البتولية وطهارة\nكل شعبك المؤمن\nأذكر يا رب أن\nترحمنا كلنا معًا\nيقول الشعب:\nإيليسون إيماس أوثيئوس اوبانطوكراطور\nآوشية المياة\nالقداس الباسيلي\nالخولاجي\nاوشية الموضع\n"},{"n":"43- أوشية الزروع","t":"ومن 10 بابه إلى 10 طوبه تقال أوشيه الزروع\nآري كاطاكسين إبشويس نيسيتي نيم ني سيم نيم ني روت إنتي إتكوي إيت خين تاي رومبي ثاي إزمو إيروؤو.\nتفضل يا رب\nالزروع والعشب ونبات\nالحقل في هذه السنة باركها\nيقول الشماس:\nطقه إيجين ني سيتي نيم مي سيم نيم ني روت إنتي إتكوي خين تاي رومبي ثاي هينا إنتي بي إخرستوس بيننوتي إزمو إيروؤو إنتو آي آي أووه إينتو آشاي شا إنتو جوك إيقول خين أونشتي إن كاربوس أووه إنتيف شينهيت خابيف إبلازما إيتانيف جيج ثاميوف إنتيف كانين نوفي نان إيقول\nأطلبوا عن الزروع\nوالعشب ونبات الحقل\nفي هذه السنة لكي\nيباركها المسيح إلهنا لتنمو و\nتكثر إلى أن تكمل بثمرة\nعظيمة ويتحنن على\nجبلته التي صنعتها يداه\nويغفر لنا خطايانا\nيقول الشعب:\nكيريي إليسون (3 مرات)\nيا رب إرحم (3 مرات)\nإوشيه الآهوية و الثمار\nالقداس الباسيلي\nالخولاجي\nآوشية المياة\n"},{"n":"44- أوشية الأهوية والثمار","t":"الكاهن:\nتفضل يا رب أهوية السماء وثمرات الأرض وصعود مياه الأنهار والزروع والعشب ونبات الحقل في هذه السنة، باركها.\n** Priest:\n** Graciously accord, O Lord to bless the air of heaven, the fruits of the earth, the waters of the rivers, the seeds, the herbs, and the plants of the field this year.\n** Pi`precbuteroc@\n** Arikataxioin P=o=c ni``ayr `nte `tve nem nikarpoc `nte `pkahi@ nem nimwou `nte `viaro@ nem nici] nem nicim nem nirwt `nte `tkoi@ etqen tairompi ;ai@ `cmou `erwou.\nالشماس:\nاطلبوا عن أهوية السماء وثمرات الأرض وصعود مياه الأنهار والزروع والعشب ونبات الحقل في هذه السنة لكي يباركها المسيح إلهنا ويتحنن على جبلته التى صنعتها يداه ويغفر لنا خطايانا.\n** Deacon:\n** Pray for the air of heaven, the fruits of the earth, the rising of the waters of the rivers, the seeds, the herbs, and the plants of the field, that Christ our God may bless them, have compassion on His creation which His Hands have made, and forgive us our sins.\n** Pidiakwn@\n** Twbh `ejen ni`ayr `nte `tve nem nikarpoc `nte `pkahi@ `pjinmosi `e`pswi `nte niiarwou `mmwou@ nici] nem nicim nem nirwt `nte `tkoi@ hina `nte P=,=c pennou] `cmou `erwou ouoh `ntefsenhyt qa pef`placma `eta nefjij ;amiof `ntef,a nennobi nan `ebol.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nاصعدها كمقدارها كنعمتك، فرح وجه الأرض ليرو حرثها ولتكثر أثمارها.\n** Raise them to their measure according to Your grace. Give joy to the face of the earth. May its furrows be abundantly watered and its fruits be plentiful.\n** Anitou `e`pswi kata nousi kata vy `ete vwk `n`hmot@ ma`pounof `m`pho `m`pkahi@ marou;iqi `nje nef;lwm@ marou`asai `nje nefoutah.\nأعدها للزرع والحصاد، ودبر حياتنا كما يليق. بارك اكليل السنة بصلاحك من أجل فقراء شعبك، من أجل الارملة واليتيم والغريب والضيف، ومن أجلنا كلنا نحن الذين نرجوك ونطلب اسمك القدوس.\n** Prepare it for sowing and harvesting. Manage our lives as deemed fit. Bless the crown of the year with Your goodness for the sake of the poor of Your people, the widow, the orphan, the traveler, the stranger, and for the sake of us all who entreat You and seek Your Holy Name.\n** Cebtwtf oujroj nem ouwcq@ ouoh `arioikonomin `mpenjinwnq kata peternofri. `Cmou `epi`,lom `nte ]rompi hiten tekmet`,ryctoc e;be nihyki `nte peklaoc@ e;be ],yra nem piorvanoc nem pisemmo nem pirem`njwili@ nem pirem`njwili@ nem e;byten tyren qa nyeterhelpic `erok ouoh ettwbh `mpekran =e=;=u.\nلأن أعين الكل تترجاك، لأنك أنت الذي، تعطيهم طعامهم في حين حسن. اصنع معنا حسب صلاحك، يا معطيا طعاما لكل جسد. املأ قلوبنا فرحا ونعيما، لكي نحن أيضا إذ يكون لنا الكفاية في كل شئ، كل حين نزداد في كل عمل صالح.\n** For the eyes of everyone wait upon You, for You give them their food in due season. Deal with us according to Your goodness, O You who give food to all flesh. Fill our hearts with joy and gladness that we too, having sufficiency in every thing always, may abound in every good deed.\n** Je nenbal `nouon niben ceerhelpic `erok@ je `n;ok et] `ntouqre `nwou qen oucyou enanef. Ariou`i neman kata tekmetaga;oc@ vy et]qre `ncarx niben moh `nnenhyt `nrasi nem ouounof@ hina anon hwn `ere `vrwsi `ntoten qen hwb niben `ncyou niben@ `ntenerhou`o qen hwb niben `naga;on.\nتفضل يا رب، أهوية السماء وثمرات الأرض ومياه الأنهار والزروع والعشب ونبات الحقل في هذه السنة باركها.\n** Graciously accord, O Lord, to bless the air of heaven, the fruits of the earth, the waters of the rivers, the seeds, the herbs, the plants of the field this year.\n** Arikataxioin P[oic ni`ayr `nte `tve@ nem nikarpoc `nte `pkahi nem nimwou `nte v`iaro nem nici] nem nicim nem nirwt `nte `tkoi@ etqen tairompi ;ai@ `cmou `erwou.\nيا ربُ إرحم، يا ربُ إرحم، يا ربُ إرحم.\n** Lord have mercy, Lord have mercy, Lord have mercy.\n** Kurie `ele`ycon@ Kurie `ele`ycon@ Kurie `ele`ycon.\nأعدها للزرع والحصاد، ودبر حياتنا كما يليق. بارك اكليل السنة بصلاحك من أجل فقراء شعبك، من أجل الارملة واليتيم، والغريب والضيف، ومن أجلنا كلنا نحن الذين نرجوك ونطلب اسمك القدوس. لأن أعين الكل تترجاك، لأنك أنت الذي، تعطيهم طعامهم في حين حسن. اصنع معنا حسب صلاحك، يا معطيا طعاما لكل جسد. املأ قلوبنا فرحا ونعيم، لكي نحن أيضا إذ يكون لنا الكفاية في كل شئ، كل حين نزداد في كل عمل صالح.\n** Prepare it for sowing and harvesting. Manage our lives as deemed fit. Bless the crown of the year with Your goodness for the sake of the poor of Your people, the widow, the orphan, the traveler, the stranger, and for the sake of us all who entreat You and seek Your Holy Name. For the eyes of everyone wait upon You, for You give them their food in due season. Deal with us according to Your goodness, O You who give food to all flesh. Fill our hearts with joy and gladness that we too, having sufficiency in every thing always, may abound in every good deed.\n** Cebtwtf oujroj nem ouwcq@ ouoh `arioikonomin `mpenjinwnq kata peternofri. `Cmou `epi`,lom `nte ]rompi hiten tekmet`,ryctoc e;be nihyki `nte peklaoc@ e;be ],yra nem piorvanoc nem pisemmo nem pirem`njwili@ nem pirem`njwili@ nem e;byten tyren qa nyeterhelpic `erok ouoh ettwbh `mpekran =e=;=u. Je nenbal `nouon niben ceerhelpic `erok@ je `n;ok et] `ntouqre `nwou qen oucyou enanef. Ariou`i neman kata tekmetaga;oc@ vy et]qre `ncarx niben moh `nnenhyt `nrasi nem ouounof@ hina anon hwn `ere `vrwsi `ntoten qen hwb niben `ncyou niben@ `ntenerhou`o qen hwb niben `naga;on.\nومن 11 بابه إلى 11 طوبه تقال اوشية الأهوية والثمار:\nآري كاطاسكين إبشويس ني آإيرإنتي إتفي نيم ني كاربوس إنتي إبكاهي خين تاي رومبي ثاي إزمو إيروؤو.\nتفضل يا رب أهوية السماء\nوثمرات الأرض في هذه السنة\nباركها\nيقول الشماس:\nطقه إيجين ني آإيرإنتي إتفي نيم ني كاربوس إنتي إبكاهي نيم فاي إششين نيم فاني ما إن ألولي نيم إششين نيقين إنريفتي كاربوس إيتخين تي أى كومبني تيرس هينا إنتي بي إخرستوس بين نوتي إزمو إيروؤو إنتيف جوك إيقول خين أو هيريني أتشني إمكاه إنتيف كانين نوفي نان إيقول\nأطلبوا عن أهوية\nالسماء وثمرات الأرض\nوالشجر والكروم وكل\nشجرة مثمرة في كل\nالمسكونة لكي يباركها\nالمسيح إلهنا و\nيكملها سالمة بغير آفة و\nيغفر لنا خطايانا\nيقول الشعب:\nكيريي إليسون (3 مرات)\nيا رب إرحم (3 مرات)\nوفي كل أوشية من هذه الثلاث يكمل الكاهن قائلًا:\nأنيتو إإبشوى كاطانوشي كاطافي إيتي فوك إتئهموتز ما إبؤونوف إم إبهو إم إبكاهي ماروثيخي إنجي نيف إثلوم مارو آشاي إنجي نيف اوطاه.\nسيف ططف إي او إجروج نيم أو أوسخ أووه إريئيكومومين إم بين جين أونخ كاطابيتير نوفري إزمو إي بي إكلوم إنتي تي رومبي هيتين تيك ميت إخرستوس إثقي ني هيكي إنتي بيك لاؤس إتقي تيشيرا نيم بي اورفانوس نيم بي شيممونيم بي ريم إنجويلي نيم إثقيتين تيرين خانئيت إيرهيلبيس إيروك اووه اتطقه إم بيكران إثؤواب جي نين قال إن اؤون نيقين سي إيرهيلبيس إيروك جي إنثوك إت تي إنطو إخري نوؤوخين أوسيو إينانيف. إريئوي نيمان كاطاتيك ميت آغاثوس. في إتتي إخري إن ساركس نيقين. موه إن نينهيت إن راشي نيم أوأونوف هينا أنون هون إري إفروشي إنتو تين خين هوف نيقين إنسيو نيقين إنتين إير هوؤوخين هوف نيقين إن آغاثون.\nأصعدها كمقدارها\nكنعمتك فرح\nوجه الأرض\nليرو حرثها ولتكثر\nأثمارها أعدها\nللزرع والحصاد ودبر\nحياتنا كما يليق\nبارك أكليل السنة\nبصلاحك من أجل\nفقراء شعبك من\nأجل الأرملة واليتيم و\nالغريب والضيق ومن\nأجل كلنا نحن الذين\nنرجوك ونطلب إسمك\nالقدوس لن أعين الكل\nتترجاك لأنك انت الذي\nتعطيهم طعامهم في حين\nحسن إصنع معنا حسب\nصلاحك يا معطيًا طعامًا\nلكل جسد إملأ قلوبنا فرحًا و\nنعيمًا لكي نحن أيضًا إذ يكون لنا\nالكفاف في كل شيء كل حين\nنزداد في كل عمل صالح\nكيريي إليسون\n** Prayer for the Waters, Fruits and Plants\nتفضل يارب أهوية السماء وثمرات الأرض ومياه النهر والزروع والعشب ونبات الحقل فى هذه السنة باركها.\n** Graciously accord, O Lord, the air of heaven, the fruits of the earth, the waters of the rivers, the seeds, the herbs and the plants of the field this year, bless them.\n** Arikata[ioin ~P_ "n":"45- أوشية القرابين","t":"الكاهن:\nأذكر يا رب الذين قدموا لك هذه القرابين، والذين قدمت عنهم، والذين قدمت بواسطتهم، اعطهم كلهم الأجر السمائي.\n** Priest:\n** Remember, O Lord, those who have brought unto You these gifts, those on whose behalf they have been brought, and those by whom they have been brought. Give them all the heavenly reward.\n** Pi`precbuteroc@\n** Ari`vmeu`i P=o=c `nny`etau`ini nak `eqoun `nnaidwron@ nem ny`etau`enou `ejwou@ nem ny`etau`enou `ebol hitotou@ moi nwou tyrou `mpibe,e pi`ebolqen nivyoui.\nالشماس:\nصلوا من أجل هذه القرابين المقدسة الكريمة، وتقدماتنا، والذين قدموها.\n** Deacon:\n** Pray for these holy and precious gifts, our sacrifices and those who have brought them.\n** Pidiakwn@\n** `Proc`euxac;e `uper twn `agiwn timiwn dwrwn toutwn ke ;uciwn `ymwn ke `procverontwn.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nيقول الكاهن أوشية القرابين الصغيرة:\nآري إفميقئي إبشويس إن نيئيطاق إيني ناك إيخون إن ناي ذورون نيم نيئيطاق إينو إيجوؤو نيم نيئيطاق إينو إيقول هيطوطوموي نوؤو تيروإمبي فيكي بي إيقول خين نيفيئوي.\nأذكر يا رب الذين قدموا لك\nهذه القرابين والذين قدمت\nعنهم والذين قدمت بواسطتهم\nاعطيم كلهم الأجر السمائي\nيقول الشماس:\nإبروس إيقئكساستي إيبرتون آجيون تيمون ذورون طوطون كي ثيسيون إيمون كي إبروس فيرون طون.\nصلوا من أجل\nهذه القرابين\nالمقدسة الكريمة وتقدماتنا والذين قدموها\nيقول الشعب:\nكيريي إليسون\nمجمع القديسين\nالقداس الباسيلي\nالخولاجي\nإوشيه الآهوية و الثمار\n"},{"n":"46- المجمع (مجمع القديسين)","t":"الكاهن:\nلأن هذا يا رب هو أمر ابنك الوحيد، أن نشترك في تذكار قديسيك.\nتفضل يا رب، أن تذكر جميع القديسين الذين أرضوك منذ البدء.\n** Priest:\n** As this, O Lord, is the command of Your only-begotten Son, that we share in the commemoration of Your saints, graciously accord, O Lord, to remember all the saints who have pleased You since the beginning.\n** Pi`precbuteroc@\n** Epidy P=o=c ouahcahni pe `nte pekmonogenyc `nSyri@ e;rener`svyr `epier`vmeu`i `nte ny=e=;=u `ntak. Arikataxioin P=o=c nteker`vmeu`i `nny=e=;=u tyrou `etauranak icjen `p`eneh.\nآباءنا الاطهار رؤساء الآباء والأنبياء، والرسل والمبشرين والإنجيليين، والشهداء والمعترفين، وكل أرواح الصديقين، الذين كملوا في الايمان.\n** Our holy fathers the patriarchs, the prophets, the apostles, the preachers, the evangelists, the martyrs, the confessors, and all the spirits of the righteous perfected in the faith.\n** Nenio] =e=;=u@ nipatriar,yc ni`provytyc ni`apoctoloc nirefhiwis nieuaggelictyc nimarturoc ni`omologityc@ nem `pneuma niben `n`;myi `etaujwk `ebol qen `vnah].\nوبالأكثر القديسة المملوءة مجدا، العذراء كل حين والدة الاله القديسة الطاهرة مريم، التي ولدت الله الكلمة بالحقيقة.\n** Most of all, the pure, full-of- glory, ever-virgin, holy Theotokos, Saint Mary, who truly gave birth to God the Logos.\n** `Nhou`o de ;y=e=;=u `;meh `n`wou `etoi `mpar;enoc `ncyou niben@ ];e`otokoc =e=;=u@ ]`agia Mari`a@ ;y`etac`jve V] piLogoc qen oume;myi.\nوالقديس يوحنا السابق الصابغ والشهيد، والقديس استفانوس رئيس الشمامسة وأول الشهداء، وناظر الإله الإنجيلي مرقس الرسول الطاهر والشهيد. والبطريرك القديس ساويرس، ومعلمنا ديوسقورس، والقديس أثناسيوس الرسولي، والقديس بطرس الشهيد ورئيس الكهنة. والقديس يوحنا ذهبي الفم، والقديس ثاودوسيوس، والقديس ثيئوفيلوس، والقديس ديمتريوس، والقديس كيرلس، والقديس باسيليوس، والقديس اغريغوريوس الناطق بالالهيات، والقديس اغريغوريوس صانع العجائب، والقديس اغريغوريوس الارمني. والثلاثمائة والثمانية عشر المجتمعين بنيقية، والمئة والخمسين بالقسطنطينية، والمائتين بأفسس. وأبانا الصديق العظيم أنبا أنطونيوس، والبار أنبا بولا، والثلاثة أنبا مقارات القديسين، وجميع أولادهم لُباس الصليب. وأبانا أنبا يؤأنس القمص، وأبانا أنبا بيشوي البار الرجل الكامل، حبيب مخلصنا الصالح.\n** And Saint John the forerunner, Baptist, and martyr; Saint Stephen the archdeacon and protomartyr; the beholder-of-God Saint Mark the evangelist, the apostle and martyr; the patriarch Saint Severus; our teacher Dioscorus; Saint Athanasius the Apostolic; Saint Peter, the Holy martyr and high priest; Saint John Chrysostom; Saint Theodosius; Saint Theophilus; Saint Demetrius; Saint Cyril; Saint Basil; Saint Gregory the Theologian; Gregory the wonder worker; Saint Gregory the Armenian; the three hundred and eighteen assembled at Nicea; the one hundred and fifty at Constantinople; and the two hundred at Ephesus; our righteous father, the great Abba Anthony; the righteous Abba Paul; the three saints Abba Macarii and all their children, the cross-bearers; our father Abba John the hegumen; our righteous father Abba Pishoy, the perfect man, the beloved of our good Savior.\n** Nem pi`agioc Iwannyc pi`prodromoc `mbaptictyc ouoh `mmarturoc@ nem pi`agioc `Ctevanoc pi`ar,ydiakonoc ouoh `m`prwtomarturoc@ nem pi;e`wrimoc `n`eu`aggelictyc Markoc pi`apoctoloc =e=;=u ouoh `mmarturoc. Nem pipatri`ar,yc =e=;=u Ceuyroc@ nem pencaq Diockoroc@ nem pi`agioc A;anacioc pi`apoctolikoc@ nem pi`agioc Petroc ieromarturoc piar,i`ereuc@ nem pi`agioc Iwannyc pi`,rucoctomoc@ nem pi`agioc :eodocioc@ nem pi`agioc :eoviloc@ nem pi`agioc Dymytrioc@ nem pi`agioc Kurilloc@ nem pi`agioc Bacilioc@ nem pi`agioc Grygorioc pi;e`ologoc@ nem pi`agioc Grygorioc pi;aumatourgoc@ nem pi`agioc Grygorioc pi`armenioc@ nem pisomt se met `smyn `etau;wou] qen Nike`a@ nem pise teui `nte Kwnctantinou-polic@ nem pi`cnau se `nte Evecoc. Nem peniwt `ndikeoc pinis] abba Antwnioc@ nem pi`;myi abba Paule@ nem pi=g =e=;=u abba Makari@ nem nousyri tyrou `n`ctaurovoroc. Nem peniwt abba I=w=a pihygoumenoc@ nem peniwt abba Piswi pi`;myi pirwmi `ntelioc@ pimenrit `nte pen=c=w=r `naga;oc.\nوأبانا أنبا بولا الطموهي، وحزقيال تلميذه ، وسيدي الأبوين القديسين الروميين مكسيموس ودوماديوس، والتسعة والأربعين شهيدا شيوخ شيهيت، والقوي القديس أنبا موسى، ويحنس كاما القس. وأبانا أنبا دانيال القمص، وأبانا أنبا ايسيذوروس القس، وأبانا أنبا باخوم أب الشركة، وتادرس تلميذه، وأبانا أنبا شنودة رئيس المتوحدين، وأنبا ويصا تلميذه.وابانا انبا ابرآم، اسقف الفيوم والجيزة.\n** Our father Abba Paul of Tammoh and Ezekiel his disciple; my masters, the Roman fathers Saints Maximus and Dometius; the Forty-nine Marty
