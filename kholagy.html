aptwma je hina `ntenmou] `erof qen ousep`hmot@ je Peniwt...\nيا الله الذي أنعم على زكريا من بعد الكبر وعلى إليصابات من بعد الشيخوخة والعقم (لو 1:7) فنطق لسانه بعد البكم. وتكلم بتسابيح وتماجيد وعظائم وتهللت إليصابات قائلة مبارك الرب الإله الذي نزع عاري من بين الناس الذي ليس أحد في مواليد النساء أعظم منه الذي شهد عنه وشهادته حق هي. إني لست بالمسيا المنتظر الذي يأتي بعدي هو أعظم مني الذي أعطي نعمة بدل نعمة إذ أتاه سيد الكل معتمدًا منه في نهر الأردن. فرأي السموات مفتوحة والروح القدس نازلًا مثل حمامة وإذا صوت قد حدث من السموات قائلًا: هذا هو ابني الحبيب الذي به سررت. الذي كان لباسه من وبر الأبل وعلي حقوية منطقة من جلد وكان طعامه جرادًا وعسلًا بريًا يا يوحنا يا ابن الموعد شفاعة من أجل خطايانا وذنوبنا لكي ندعوه بشكر قائلين: أبانا الذي في السموات.. إلخ.\nيا الله الذي أنعم على زكريا بابن من بعد الكبر وعلى أليصابات من بعد الشيخوخه والعقم. ونطق لسانه من بعد البكم , وتكلم بتسابيح وتماجيد وبارك الله. وتهللت أليصابات , وباركت الله قائله: مبارك هو الرب الإله الذي رفع عارى من بين الناس. هذا الذي ليس في مواليد النساء أعظم منه , إذ جاءة سيد الكل في الأردن معتمدا منه , وصوت من السماء يقول لة: هذا هو ابنى الحبيب الذي به سررت. فلهذا نسألك يا سيدنا أن تنعم علينا بغفران خطايانا وآثامنا وذلاتنا. لكي بشكر نجسر بداله بغير خوف أن نصرخ إليك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.......\n** الحواشي والمراجع لهذه الصفحة هنا في موقع الأنبا تكلاهيمانوت:\n(1) التنسيق الثالث هو ترجمة مختلفة.\nقسمه صيام ألرسل وسنوى\nصلاة القسمة\nالخولاجي\nقسمة ميلاد الابن والاعياد السيدية\n"},{"n":"24- قسمة تقال في صوم الرسل وسنوي","t":"ما أبعد أحكامك عن الفحص وطرقك عن الاستقصاء كما بعدت (علت) السموات عن الأرض كذلك أيضًا بعدت أفكارك عن بني البشر إذ أخفيت هذه عن حكماء وفهماء وأعلنتها للأطفال الصغار. نعم أيها الآب هكذا قد صارت المسرة أمامك اخترت جهلاء العالم لتخزي بهم الحكماء واخترت ضعفاء العالم لتخزي بهم الأقوياء، اخترت بطرس هذا وكان صيادًا للسمك فصيرته صيادًا للناس. أنت بطرس وعلى هذه الصخرة سأبني كنيستي وأبواب الجحيم لن تقوي عليها هذا الذي عندما سألت تلاميذك الأطهار قائلًا لهم: من يقول الناس أني أنا ؟ صرخ قائلًا: أنت هو المسيح ابن الله الحي مخلص العالم طوباك يا بطرس فإن دمًا ولحمًا لم يعلن لك ذلك لكن روح الله الحال فيك. والذي أنكرك امام الجارية أعترف بك أمام الملوك والولاة أما بولس هذا الذي ظل طاردًا زمانًا طويلًا صيرته إناءًا مختارًا يحمل اسمك القدوس، فيما هو ذاهب إلى دمشق ليقبض على المسيحيين ويعذبهم، بغتة أشرق نور من السماء حوله وسمع صوتًا من السماء يقول به: شاول شاول لماذا تضطهدني، صعب عليك أن ترفس مناخس. لسان العطر هذا الذي كرز وبشر وعلم وأسس كنيستك المقدسة وفي أخر الكل أنعمت على رسوليك بطرس وبولس بما لم تره عين وما لم تسمع به أذن مالم يخطر على قلب بشر فإستشهد بطرس مصلوبًا منكسًا الرأس وبولس بحد السيف فنالا إكليل الرسولية وإكليل الشهادة يا الله الذي أنعم على رسوليه بتلك النعم الجزيلة أنعم علينا نحن الخطاة بغفران خطايانا وذنوبنا وآثامنا كي ندعوك بشكر: ابانا الذي في السماوات.. إلخ.\nصلاة القسمة\nالخولاجي\nقسمة للابن في اي وقت\nقسمة عيد الغطاس ويوحنا المعمدان\n"},{"n":"25- قسمة للابن تقال في أي وقت","t":"لمجد صورة جوهريتك نخضع أيها المسيح إلهنا. أيها الكلمة الذاتي والشخص العجيب الذي لبس صورتنا انت الذي من أجلنا صرت عبدًا للكنيسة الجامعة حملت على هامتك إكليل الشوك من أجلنا أيها السيد وكللتنا بالمجد العجيب يا شعاع مجد الآب. أنت الذي كان بك كل شيء وكونتنا من العدم مما لم يكن أظهرت لنا غوامض حكمتك وخلقت الملائكة من أجلنا، ولأجلنا صنعت كل شيء أبدعتنا على صورتك ومثالك، ورسمت فينا صورة سلطانك ووضعت فينا موهبة النطق، يا كلمة الله، أخضعت تحت إيدينا كل شيء وسلطتنا على جميع حيوانات الحقل قتلت العداوة بالصليب وفي شخصك رسمت صورة المصالحة بيننا وبين إبيك.\nصيرت العبد حرًا وقربته، والصك القديم بجراحاتك مزقته وبالمسامير رسمت اسمي على كفك تذكارًا أبديًا أمام الأب كل حين كراع صالح سعيت ورائي أنا الضال وجملتني على منكبيك فرحًا وأتيت بي إلى مائدة السرور الخلاصية كأس الفرح أسقيني وبدهن الإبتهاج المقدس مسحتني يا من لم يحسب أن يكون معادلًا لله خلسة بل أنت هو الأقنوم الذاتي ويد حكمة الله الآب، حينما وضع للبحر حدًا كنت أنت معه مشيرًا تنازلت من أجلي لشخص العبودية واحتملت ظلم الأشرار أتيت إلى اذبح مثل حمل تأديب سلامي كان عليك وبجراحاتك شفيتني من سم الموت تركت ظهرك للسياط ووجهك لم ترده عن خزي البصاق وخديك للاطمين أظهرت عظيم إهتمامك بي وأكملت ناموسك عني، ربطتني بكمالات الشريعة، وعزيتني بلبان العلم من قبل روحك القدوس، منطقتني بالقوة وإتخذتني لك مسكنًا، صنعت لي وليمة النعمة ومن سم الحية شفيتني وأدوية الخلاص سلمتني لأنه هكذا أيها السيد عندما عدمت نفسي من شجرة الحياة أعطيتني مشتهيات الألوهية،وصيرتني معك واحدًا أعطيتني جسدك ودمك ذلك الذي بذلته عن حياة العالم، وسقيتني من ذلك العصير الخارج من جنبك الينبوع الغير المنقطع ينبوع الحياة، تلك المائدة التي فيها شفاء الأمم، يا شمس البر، وقدمتنا لأبيك أبناءًا وعلمتنا أن ندعو أباك أبا لنا ونقول بصوت مرتفع: أبانا الذي في السموات..إلخ.\nقسمة للآب للقديس اغريغوريوس\nصلاة القسمة\nالخولاجي\nقسمه صيام ألرسل وسنوى\n"},{"n":"26- قسمة للآب من قول القديس إغريغوريوس","t":"يا الله العظيم القدوس المحتجب في مجده، المقتدر في كافة أفعاله. العزيز في عزته. الجزيل الصلاح. العالم بكل شيء. الحاضر في كل مكان. المتنزه عن التعيير. الفريد وحده. الغني بنفسه. القدوس القدير الممجد في جميع الملائكة والقديسين. يا من بآلامك المحيية جددت جبلتنا المائتة التي ماتت بسبب الخطية. لا تطرحنا عنك يا إلهنا. ويا من بصليبك الغالب قتلت الموت الذي كان سائدًا علينا، بحنوك أشفق علينا واحفظنا تحت جناحيك ويا من سمرت بالمسامير في جسدك الطاهر كالمذنبين حبًا بنا نحن الخطاة، بقوتك يا رب مزق مصائد أعدائنا ويا من طعنت بالحربة في جنبك الأقدس بعز سلطانك أثقب كل شباك المقاومين لنا. ويا من بموتك المحيي أمت الموت قاتلنا فلا تجعل له سلطانًا علينا يا سيدنا ويا من من بدفنك في القبر دفنت آثامنا اجعلنا يا الله ألا نجددها مرة ثانية. ويا من بقيامتك المقدسة حطمت مملكة إبليس أقمنا يا رب من سقطات الخطية، ويا من بصعودك المعظم أرسلت الروح القدس على تلاميذك إجعلهما لآثامنا وغسلًا لأدناسنا وإجعلنا يا إلهنا ان نقسم أسرارك القدسية يغر خوف ولا رعب ولا تبكيت ولا وقوع في العقوبة الأبدية، ولا تكن أيضًا سببًا في زيادة الخطية بل لتكن تقديسًا لنفوسنا وأجسادنا وتثقيفًا لعقولنا وقلوبنا ونقاوة وتهذيبًا لأفكارنا وأذهاننا وسورًا رفيعًا تجاه الأعداء المضادة لنا وبرجًا حصينًا قبالة المعاند وعربون حياة للعالم الجديد وملكوت مجدك العتيد.\nولكي تظهرنا يوم حكمك الرهيب لأننا تقدمنا إلى حضرتك معترفين بربوبيتك مقرين أمام تابوت قدسك، ان هذا هو الجسد المقدس نفسه معطي الحياة لكل الذين يأكلون منه وهذا هو دمك الحقيقي المطهر لكل العالم فيا كل العطاش تعالوا وإشربوا من جنب الحمل لتروي نفوسكم إقتربوا إليه لتمحي خطاياكم تقدموا نحوه لتطهروا من آثامكم هذا هو بالحقيقة الموضوع امامنا فلا شك ولا ريب فيه أن هذا الجسد وهذا الدم لعمانوئيل إلهنا الكائن معنا على هذه المائدة فنحن نسأل ونطلب من صلاحك يا محب البشر إقبل صلواتنا نحن المرئيين عبيدك من غير المرئيين وإحسبنا مع الطقوس السمائية لكي نصرخ باستجابة الغلبة والظفر بأصوات لا تسكت وأفواه لا تصمت رافعين أيدينا إليك أيها الآب القدوس في السموات ونقول: ابانا الذي في السماوات.. إلخ.\nقسمه للابن سنوي\nصلاة القسمة\nالخولاجي\nقسمة للابن في اي وقت\n"},{"n":"27- قسمة للابن سنوي","t":"يا مخلصي، هذه هي الرأس التي كللت بإكليل شوك ومالت إلى اليمين عندما أسلمت الروح، يا إلهي، هذا هو الوجه الذي هو أبرع جمالًا من بني البشر الذي تفل عليه العبد لاطمك، وهذا هو الفم المحيي الذي كله حلاوة ومشتيهات الذي ذاق الخل ممزوجًا بمرارة.\nيا سيدي، هذا هو الظهر الذي تعرض لضرب السياط كمذنب أثيم، يا ملكي هذا هو الجنب الذي طعن بالحربة فوق الجلجثة فجري منه دم وماء يا فادي هاتان هما اليدان اللتان أشبعتا كل حي من رضاك، وهاتان هما الرجلان اللتان كانتا تتجولان في كل مكان تصنعان خيرًا وتشفي كل الذين تسلط عليهم إبليس قد سمرتا على الصليب(+) من أجل خلاص العالم كله، من أجل هذا مخلصنا الصالح صرخ قائلًا: أن جسدي هو مأكل حق ودمي هو مشرب حق من يأكل جسدي ويشرب دمي يكون في وأنا أكون فيه، طهر نفوسنا وأجسادنا وأرواحنا لكي بقلب طاهر نناديك بنغمة البنوة قائلين: ابانا الذي في السماوات.. إلخ.\n"},{"n":"28- قسمة سنوي للقديس أبيفانيوس: قسمة الحكمة","t":"يا إلهنا بلاد الحكمة أين مسكنها وأين مواطنها؟ أين آثار طريقها؟ مَنْ عبر البحر وإشتراها بذهب نقي؟ مَنْ صعد فوق السحاب وأنزلها ؟ الإنسان الفاني لا يعرف طريقها، هي منسية من كل البشر، مختفية عن الملائكة. الذين يحصلون ينالون نعمة، الذين يبغضونها يحبون الموت، هي أجمل من الشمس وكل النجوم. هي تشبه نور الآب لأنها كائنة معه منذ الأزل.\n** O our God, where are the lands of Wisdom? Where are the footprints of their ways? Who would pass over the seas to buy them with pure gold? Who can ascend above the clouds and bring them? The mortal man does not know Its way for most men forsake It. Wisdom is hidden, even from the angels. Those who possess Wisdom obtain grace and those who hate It love death. Wisdom is brighter than the sun and all the stars. Wisdom is the Light of the Father existing with Him from eternity. Wisdom has existed from eternity.\nالحكمة مع أنها كائنة منذ القدم ولكنها تجدِّد الجميع في كل زمان. تدخل إلى نفوس الأبرار. هي خير من اللآلئ وكل كرامة لا تساويها. لها المشورة والقدرة والمعرفة. بها يملك الملوك، بها يُكرَّم العظماء وبها يملك الرؤساء الأرض. هي تحب الذين يحبونها وتحفظ الذين يحفظونها والذين يطلبونها يجدون نعمة.\n** She renews everyone. She enters the souls of the righteous through all the ages. Wisdom is more precious than pearls and unequal to all honors. Wisdom has counsel, might, and knowledge. By Wisdom kings reigned, the great men are honored, and the princes of the earth govern. Wisdom loves those who love Her and protects those who keep Her. Those who seek Wisdom find grace.\nالحكمة تتمشى في طريق العدل وتتحرك في سبيل الحق لتهب الذين يعرفونها غنى وتملأ خزائنهم فرحاً.\n** Wisdom walks in the way of justice and moves in the path of truth. Wisdom grants richness to those who acknowledge Her and fills their treasures with joy.\nأعطاها الله لأبينا يعقوب ثم ظهرت على الأرض ومشت كإنسان. هوذا الحكمة قد بنت لها بيتاً وأسست أعمدتها السبعة. ذبحت ذبائحها، سكبت خمرها، وأرست مائدتها. بيتها هو الجامعة الرسولية الكنيسة وأعمدتها السبعة هي أسرار الله المحيية.\n** God granted Wisdom to our father Jacob, and She then appeared and walked on earth as a Man. Wisdom has built Her house. She has hewn (carved) out her seven pillars. She has slaughtered Her meat. She has mixed Her wine. She has also furnished Her table. The house of Wisdom is the universal and apostolic Church, and Her seven pillars are life-giving sacraments of God.\nالحكمة أرسلت عبيدها ينادون على الدوام قائلين: \"مَنْ هو بسيط فتمل إليَّ.\" ولناقص الفهم تقول لهم: \"هلموا كلوا من خبزي وإشربوا من دمي. أتركوا الجهالة عنكم فتحيوا.\"\n** Wisdom sent forth Her servants to say always throughout the ages, \"You who are simple turn to me.\" As to those who lack understanding She says, \"Come eat of My Body and drink of My Blood. Relinquish the ignorance from among you, so that you might live.\"\nأما الحكمة فهي مخلصنا يسوع المسيح الذي فدانا بذبيحة جسده، وإشترانا بسفك دمه، وإختارنا لملكوته الأبدي. لهذا نسألك يا سيدنا أن تعطينا أن نجد الحكمة منك وحدك. وأن تقبل هذه الذبيحة من إيدينا وأن تقبل منا أصوامنا وصلواتنا. لكي بدالة البنين نصرخ إليك يا أبانا السماوي قائلين: \"يا أبانا الذي في السموات...\"\n** Wisdom is our Savior Jesus Christ who redeemed us with the sacrifice of His Body, bought us by His bloodshed, and chose us for His eternal kingdom. We ask You O our Master to grant us to find wisdom in You alone; to accept this sacrifice from our hands. Accept our fasting and prayers, so we may dare as sons to cry to You, our heavenly Father, \"Our Father...\"\nيا إلهنا بلاد الحكمة أين مسكنها وأين مواطنها؟ أين آثار طريقها؟ من عبر البحر وإشتراها بذهب نقي؟ من صعد فوق السحاب وأنزلها ؟ الإنسان الفاني لا يعرف طريقها، هي منسية مل كل البشر، مختفية عن الملائكة الذين يحصلون ينالون نعمة، الذين يبغضونها يحبون الموت، هي أجمل من الشمس وكل النجوم هي تشبه نور الآب لأنها كائنة معه منذ الأزل.\nالحكمة تتشمي في طريق العدل وتتحرك في سبيل الحق لتهب الذين يعرفونها غني وتملأ خزائنهم فرحًا أعطاها الله لأبينا يعقوب ثم ظهرت على الأرض لأرض ومشت كإنسان هوذا الحكمة قد بنت لها بيتًا وأسست أعمدتها السبعة ذبحت ذبائحها سكبت خمرها وأرست مائدتها بيتها هو الجامعة الرسولية الكنيسة وأعمدتها السبعة هي أسرار الله المحيية، الحكمة أرسلت عبيدها ينادون على الدوام قائلين: من هو بسيط فتمل إلى ولناقص الفهم تقول لهم هلموا كلوا من خبزي وإشربوا من دمي – أتركوا الجهالة عنكم فتحيوا.\nاما الحكمة فهي مخلصنا يسوع المسيح الذي فدانا بذبيحة جسده وإشترانا بسفك دمه وإختارنا لملكوته الأبدي لهذا نسألك يا سيدنا أن تعطينا أن نجد الحكمة منك وحدك وأن تقبل هذه الذبيحة من إيدينا وأن تقبل منا أصوامنا وصلواتنا لكي بدالة البنين نصرخ إليك يا أبانا السماوي قائلين: يا أبانا الذي في السموات.. إلخ.\nيا إلهنا بلاد الحكمة أين مسكنها وأين مواطنها؟\nأين آثار طريقها؟\nمن عبر البحر واشتراها بذهب نقي؟\nمن صعد فوق السحاب وأنزلها؟\nالإنسان الفاني لا يعرف طريقها\nهي منسية من كل البشر،\nمختفية عن الملائكة الذين يحصلون ينالون نعمة\nالذين يبغضونها يحبون الموت،\nهي أجمل من الشمس وكل النجوم\nهي تشبه نور الآب لأنها كائنة معه منذ الأزل\nالحكمة مع أنها كائنة منذ القدم ولكنها تجدد الجميع\nفي كل زمان تدخل إلى نفوس الأبرار\nهي خير من اللآلئ\nوكل كرامة لا تساويها\nلها المشورة والقدرة والمعرفة\nبها يملك الملوك\nبها يكرم العظماء\nوبها يملك الرؤساء الأرض\nهي تحب الذين يحبونها\nوتحفظ الذين يحفظونها\nوالذين يطلبونها يجدون نعمة\nالحكمة تتشمي في طريق العدل\nوتتحرك في سبيل الحق\nلتهب الذين يعرفونها غني وتملأ خزائنهم فرحاً\nأعطاها الله لأبينا يعقوب\nثم ظهرت على الأرض ومشت كإنسان\nهوذا الحكمة قد بنت لها بيتاً وأسست أعمدتها السبعة\nذبحت ذبائحها سكبت خمرها وأرست مائدتها\nبيتها هو الجامعة الرسولية الكنيسة\nوأعمدتها السبعة هي أسرار الله المحيية\nالحكمة أرسلت عبيدها ينادون على الدوام قائلين\nمن هو بسيط فليمل إلى\nولناقصي الفهم تقول لهم\nهلموا كلوا من خبزي واشربوا من دمي\nأتركوا الجهالة عنكم فتحيوا\nاما الحكمة فهي مخلصنا يسوع المسيح\nالذي فدانا بذبيحة جسده\nواشترانا بسفك دمه\nواختارنا لملكوته الأبدي\nلهذا نسألك يا سيدنا أن تعطينا أن نجد الحكمة منك وحدك\nوأن تقبل هذه الذبيحة من إيدينا\nوأن تقبل منا أصوامنا وصلواتنا لكي بدالة البنين نصرخ إليك:\nانظر أيضًا: مقال عن التقارب ما بين قسمة الحكمة في القداس وسفري الحكمة والأمثال، القس رافائيل فكري.\nقسمة الآعياد السيدية والميلاد\nصلاة القسمة\nالخولاجي\nقسمه للابن سنوي\n"},{"n":"29- قسمة في الأعياد السيدية وفي الميلاد","t":"اللهم الذي سبق علمه وجود الكائنات، الذي أوجد الروح من لا شيء وحمله في الجسد إلى الزمان الذي يريد فيه أن ينقل إلى المظال الأبدية.\nالذي تنبأ عنه رجال الله الأصفياء فقال يعقوب أبو الأسباط: إنني رأيا رؤيا إذ بسلم منصوب من الأرض إلى السماء، وملائكة الله تصعد وتنزل عليه، والرب واقف عليه ويقول: أنا هو الرب إله إبراهيم أبيك وإله اسحق.\nإشعياء ذو الصوت العظيم في الأنبياء تنبأ قائلًا: هوذا العذراء تحبل وتلد إبنًا ويدعي إسمه عمانوئيل الذي تأويله الله معنا إنه ولد لنا ولد ونعطي إبنا وتكون الرياسة على منكبيه الله القوي المتسلط وملاك المشورة في الرئاسة الأبوية.\nإرميا الصريح في الأنبياء تنبأ قائلًا: من أجل صهيون لا أسكت ومن أجل اورشليم لا أفتر. ترياق جلعاد هو شفاء إبنه شعبي فلنذهب إلى جلعاد ونطلب الشفاء من ذلك الموضع. جلعاد هي الجامعة الرسولية وترياقها هو جسد ودم عمانوئيل، وإبنة شعبي هي العروس الحقيقية التي نالت الطهارة من إبنها الحبيب يسوع المسيح ربنا.\nحزقيال العفيف في الأنبياء تنبأ قائلًا: إنني رأيت بابًا جهة المشرق مختومًا بختم عجيب ولم يدخل منه إلا واحد وهو رب الجنود دخل وخرج وبقي الباب مصونًا بصيانة أزلية ثم رأيت مركبة طائرة نحو السماء وأربعة وجوه تحيط بها وجه أسد ووجه ثور ووجه نسر ووجه إنسان وسمعت صوتهم فوق الكاريبيم قائلًا: يا رجل الله يا رجل الله، يا رجل الله تنبأ!\nدانيال الفصيح في الأنبياء تنبأ قائلًا: إنني رأيت جبلًا عاليًا لم تلمسه يد إنسان قطع منه حجر ثم رأيت ابن الإنسان جالسًا على سحاب السماء بحمرة ثيابه هو وسنوه لا تنقضي بالحقيقة هذا هو يسوع المسيح الذي تجسد من العذراء مريم نسأل ونطلب من صلاحك يا رؤوفًا بالعباد طهر نفوسنا وأجسادنا وأرواحنا لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة نطلب إليك أيها الآب القدوس الذي في السموات ونقول: ابانا الذي في السماوات.. إلخ.\nقسمة عيد الختان ودخول اورشليم\nصلاة القسمة\nالخولاجي\nقسمة القديس ابيفانيوس\n"},{"n":"30- قسم تُقال في عيد الختان ودخول المسيح له المجد إلى أورشليم","t":"نسبح ونمجد إله الآلهة ورب الأرباب، الذي تجسد من القديسة مريم، ولدته في بيت لحم، وإذ ملاك الرب قد ظهر للرعاة وبشرهم بميلاده العجيب فأتوا ونظروه.\nربنا يسوع المسيح إبن الله الحقيقي قبل إليه الختان في اليوم الثامن لميلاده العجيب كعادة الناموس لكي يصيرنا أحرارًا من ختان الجسد ولكي يعطينا روحه القدوس بالكمال.\nهذا الذي دخل إلى الهيكل على يدي أمه القديسة مريم العذراء ويوسف النجار بعد أربعين يومًا من مولده المقدس ليصنعا عنه كما جاء في الناموس.\nوحمله سمعان الشيخ على ذراعيه وبارك الله قائلًا: الآن يا سيدي تطلق عبدك بسلام حسب قولك لأن عيني قد أبصرتا خلاصك الذي أعددته امام جميع الشعوب. (+)\nأنت الآن يا سيدي أنر عيون قلوبنا وطهرنا كاملين في النفس والجسد والروح كلي بقلب طاهر وشفتين نقيتين ونجسر بدالة بغير خوف ان نصرخ نحو أبيك القدوس الذي في السموات ونقول: ابانا الذي في السماوات.. إلخ.\n"},{"n":"31- قسمة عيد البشارة المجيد (29 برمهات)","t":"نسبح ونمجد إله الآلهة ورب الأرباب، الذي تجسد من القديسة مريم، ولدته في بيت لحم.\nنسر بالتماجيد الروحية والتراتيل السماوية لأن الرب أرسل جبرائيل الملاك مبشرًا سيدتنا كلنا مريم العذراء بتجسد كلمة الآب الأزلي الذي هو مخلصنا يسوع المسيح.\nجبرئيل الملاك بشر العذراء مريم وبعد أن منحها السلام ثبتها بهذا الكلام قائلًا: لا تخافي يا مريم لأنك قد وجدت نعمة أمام الله وستلدين إبنًا وتسميه يسوع والقدوس المولود منك يدعي إبن الله.\nالرب الإله الذي على الكل، المبارك إلى الأبد، الغير متجسد تجسد وولد من العذراء ولفته بالخرق ووضعته في المزود وعساكر السماوات ترتل له صارخين المجد لله في الأعالي وعلى الأرض السلام وبالناس المسرة.\nهكذا أيضًا يا سيدنا نحن الضعفاء الخطاة عبيدك الطالبين رحمتك، تفضل أنعم لنا بسلامك وخلصنا كل حين بيمينك المحيية لكي بطهارة نتناول من هذه الأسرار النقية ونتطهر كلنا كاملين في أنفسنا وأجسادنا وأرواحنا ونجسر بدالة بغير خوف أن ندعوك يا الله الآب الذي في السموات ونقول: يا أبانا الذي في السموات.. إلخ.\nنسبح ونمجد اله الآلهة ورب الأرباب الذي تجسد من القديسه مريم العذراء وولدتة في بيت لحم. لأن الرب أرسل جبرائيل الملاك مبشرا سيدتنا كلنا مريم العذراء بتجسد كلمة الآب الأزلى الذي هو مخلصنا يسوع المسيح. جبرائيل رئيس الملائكة بشر مريم العذراء وبعد أن منحها السلام ثبتها بهذا الكلام قائلا: لا تخافى يا مريم لأنك قد وجدت بنعمه أمام الله وستلدين ابنا وتسمينه يسوع , القدوس المولود منك يدعى ابن الله. الرب الإله الذي على الكل , المبارك إلى الأبد الغير متجسد قد تجسد وولد من العذراء ولفتة بالخرق ووضعتة في المزود , وعساكر السموات ترتل له صارخين: المجد لله في الأعالى وعلى الأرض السلام وفي الناس المسره. هكذا أيضا يا سيدنا نحن الضعفاء الخطاه عبيدك الطالبين رحمتك تفضل أنعم لنا بسلامك وحصنا كل يوم بيمينك المحيية لكي بطهارة نتناول من هذه الأسرار النقية ونتطهر كلنا كاملين في أنفسنا وأجسادنا وأرواحنا ونجسر بداله بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات.........\nقسمة آحد الشعانين\nصلاة القسمة\nالخولاجي\nقسمة عيد الختان ودخول اورشليم\n"},{"n":"32- قسمة تُقال في احد الشعانين","t":"أيها الرب مثل ربنا مثل عجيب صار إسمك على الأرض كلها لأنه قد ارتفع عظم بهائك فوق السموات من أفواه الأطفال والرضعان هيأت سبحًا.\nالرب الجالس على الشاروبيم ركب على جحش أتان ودخل إلى أورشليم. بتواضع عظيم لكي يتم ما قيل بالنبي القائل: قولوا لإبنة صهيون هوذا ملكك يأتيك وديعًا راكبًا على أتان وجحش إبن أتان.\nوحمل الأطفال سعفًا من النخل وخرجوا للقائه وكانوا يصرخون أوصنا في الأعالي مبارك الآتي باسم الرب ملك إسرائيل.\nوالجمع الأكثر فرشوا ثيابهم في الطريق وآخرون قطعوا أغصانًا من الشجر وفرشوها في الطريق. والجموع الذين تقدموا والذين تبعوا كانوا يصرخون قائلين: أوصنا لابن داود مبارك الآتي باسم الرب ومباركة مملكة أبينا داود الأتية باسم الرب أوصنا في الأعالي\nولما دخل اورشليم إرتجت المدينة كلها قائلة من هو هذا ؟ فقالت الجموع هذا هو يسوع الذي من ناصرة الجليل.\nفيا ربنا هيئ نفوسنا لنسبحك ونرتل لك ونباركك ونخدمك ونسجد لك ونمجدك ونشكرك كل يوم وكل وقت وكل ساعة لكي بقلب طاهر وشفتين نقيتين نعترف لك ونصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات.. إلخ.\nأيها الرب ربنا مثل عجب صار اسمك على الأرض كلها , لأنه قد ارتفع عظم بهائك فوق السموات , من أفواه الأطفال والرضعان هيأت سبحا. الرب الجالس على الشاروبيم ركب على جحش ابن أتان ودخل إلى أورشليم بتواضع عظيم لكي يتم ما قيل بالنبى القائل: قولوا لابنه صهيون هوذا ملكك يأتيك وديعا راكبا على أتان وجحش ابن أتان. وحمل الأطفال سعفا من النخيل وخرجوا للقائة وكانوا يصرخون أوصنا في الأعالى مبارك الآتى باسم الرب ملك اسرائيل. والجمع الأكثر فرشوا ثيابهم في الطريق , وآخرون قطعوا أغصانا من الشجر وفرشوها في الطريق والجموع الذين تقدموا والذين تبعوا كانوا يصرخون قائلين: أوصنا لابن داود مبارك الآتى باسم الرب , مباركة مملكه أبينا داود الآتيه باسم الرب , أوصنا في الأعالى. ولما دخل أورشليم ارتجت المدينه كلها قائلة: من هو هذا؟ فقالت الجموع: هذا هو يسوع الذي من ناصرة الجليل. فيا ربنا هيىء نفوسنا لنسبحك ونرتل لك ونباركك ونخدمك ونشكرك كل يوم وكل وقت وكل ساعه. لكي بقلب طاهر وشفتين نقيتين نعترف ونصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي.......\nقسمة عيد ألرسل\nصلاة القسمة\nالخولاجي\nقسمه عيد البشاره المجيد\n"},{"n":"33- قسمة لعيد الرسل","t":"يا الله الآب السماوي القادر على كل شيء أبا ربنا وإلهنا ومخلصنا وملكنا يسوع المسيح الذي دعا له إثني عشر رسولًا ليكونا له تلاميذ وسبعين آخرين وأعطاهم السلطان أن يشفوا المرضي ويطهروا البرص ويطردوا الشياطين والأرواح النجسة ويقيموا الموتي، وليكرزوا بالإنجيل للخليقة كلها ويعمدوهم باسم الآب والإبن والروح القدس.\nيا من أقام تلميذه القديسين ورسله الأطهار ليكونوا رؤساء كهنة العهد الجديد يكرزون ويعلمون ويباركون ويقدسون المؤمنين بالروح القدس الذي أعطاهم ويقبلون التائبين ويغفرون لهم خطاياهم ويجعلونهم أهلًا لتناول أسراره المقدسة غذاء لنفوسهم وقوتًا لأرواحهم للحياة الأبدية.\nيا من نفخ في وجه تلاميذه القديسين ورسله الأطهار ومنحهم سلطانًا أن يدرسوا الحيات والعقارب وكل قوة العدو الشيطان، وأن يتعهدوا المؤمنين بوسائط الخلاص وأن يكونوا له وكلاء على الأرض ومستودعًا لمواهبه الخلاصية واستحقاقاته الكفارية يوزعونها على مستحقيها ووكلاء أسراره المحيية.\nيا من سكب على تلاميذه القديسين بعد صعوده إلى السماء مواهب الروح القدس. روح الحق المنبثق من الآب فقدسهم وبررهم وطهرهم وملأهم من كل حكمة وفهم ومشورة وشجاعة وقوة وصيرهم قادرين على أن يتنبأوا ويتكلموا باللغات ويفتنوا بإنجيل الخلاص المسكونة كلها.\nاللهم يا من وكل تلاميذه القديسين ورسله الأطهار أن يقيموا من بين المؤمنين أساقفة وكهنة وشمامسة لخدمة إنجيل الملكوت ورعاية قطيع المسيح وتدبير كنيسته المقدسة.\nوبعد ان كرزوا وعاموا وقدسوا وأقاموا لهم خلفاء ووكلاء وعرفاء لم يحسبوا أنفسهم ثمينة لديهم فبذلوا حياتهم من أجل إسمك القدوس في أسفار وفي أسهار وفي أصوام وفي أتعاب كثيرة وبعد أن قاسوا عذابات أليمة ماتوا رجمًا او حرقًا أو صلبًا أو قطعت رؤوسهم فنالوا إكليل الشهادة وإكليل الرسولية.\nفبطرس الرسول مات مصلوبًا منكسًا وبولس الرسول قطعت رأسه بالسيف ومرقس الرسول سلموه مربوطًا في شوارع الإسكندية فتقطعت أوصاله وتهشمت عظامه وسالت دمائه فكانت بركة لبلادنا المصرية وكنيستنا الأرثوذكسية\nالله إقبلنا نحن أيضًا طاهرين بلا عيب أمامك ونقي بروحك القدوس وبسر القربان المحيي أرواحنا وأنفسنا وأجسادنا بل أيضًا أفكارنًا وقلوبنا ونياتنا حتى نجرؤ بمحبة غير ناقصة ودالة بغير مخادعة أن نصرخ نحو أيها الآب القدوس السماوي بالصلاة التي علمتها لتلاميذك الطهار قائلين: أبانا الذي في السموات... إلخ\nقسمة صوم العذرا واعيادها\nصلاة القسمة\nالخولاجي\nقسمة آحد الشعانين\n"},{"n":"34- قسمة صوم وأعياد القديسة العذراء مريم","t":"يا الله الساكن في الأعالي والناظر من علو سماه إلى قلوب المتواضعين من عبيده، الذي شاء أن يفتقدنا برحمته وأن يجيئ إلينا متجسدًا من الروح القدس ومن القديسة العذراء مريم.\nيا من وعد أبانا آدم بالخلاص وثبت وعده المقدس لجميع الآباء بميلاده البتولي في ملئ الزمان من بكر بتول نقية وعفيفة قدسها وطهرها وملأها نعمة وفضها على نساء العالم. هي العذراء الدائمة البتولية العذراء كل حين مريم – حواء الجديدة فخر جنسنا والسماء الثانية الجسدانية.\nيا من أحبنا وأراد من فيض حبه ورحمته ومن دلائل عدله وبره وثبوت حكمه وقضائه أن يفدينا من موت الخطية الأصلية ويرغ عنا عقوبتها الأبدية بأن يموت بدلًا عنا في جنس البشرية الذي أخذه من العذراء مريم أم الخلاص وكما كانت حواء الأولي أصل البلاء، هكذا صارت حواء الجديدة باب السماء.\nيا من تجسد من البكر البتول، وأكرم بميلاده من العذراء دائمًا وكل حين البتولية الدائمة والعفة الكاملة وهي صورة البهاء الأولية التي خلق الله بها الأبوين الأولين أدم وحواء عندما كانا معًا في فردوس النعيم.\nيا من شرف حواء الثانية بان سكن في أحشائها تسعة أسهر كاملة وكون منها بالروح القدس الذي حل عليها جسدًا بنفس بشرية إتحد به في أقنوم واحد وطبيعة واحدة وولد منها الكلمة الذي كان ولم يزل إلهًا مباركًا إلى الأبد.\nيا من خرج من بطن العذراء وختوم البتولية مختومة يا من رضع من لبن العذراء وهو الساقي الخليقة من نعمته وتربي في حضنها ونام بين يديها وجلس على ركبتيها وهو الجالس على مركبة شاروبيمية وسجدت له الملائكة ورؤساء الملائكة الأطهار.\nيا من شرف مصر بحضوره راكبًا على السحابة السريعة والخفيفة فإرتجت اوثان مصر من وجهه وذاب قلب مصر في داخلها ولم تكن السحابة السريعة الخفيفة إلا العذراء مريم في نقاءها ورقتها وطهارتها كل حين.\nيا من شاء ان يكرم الأمومة في مريم العذراء وكان خاضعًا لها ودائمًا يلبي ندائها ويقبل شفاعتها ويستجيب صلواتها.\nيا من أودع أمه العذراء عند تلميذه يوحنا وجعل لها يوحنا إبنا. وفي يوحنا وهبنا العذراء اما لنا وجعلنا لها بالإيمان أولادًا وبنينًا.\nيا من لم يشأ للعذراء أم الخلاص وقد صارت تابوتًا مقدسًا سكن فيه الرب جسديًا أن يبقي هذا الجسد على الأرض فرفعه بعد موتها إلى السماء على أيدي الملائكة ورؤساء الملائكة القديسين.\nيا من شرفنا وشرف جنسنا بأن إتخذ من العذراء مريم جسدًا وصعد به إلى السماء فوجد فداءًا أبديًا وجلس به على العرش فصرنا فيه جالسين عن يمين الآب.\nيا الله الرحوم إرحمنا وإغفر خطايانا وإقبل شفاعة أمك العهذراء فينا وأجعلنا مستحقين للمس جسدك المقدس ودمك الكريم لكي بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نصرخ نحو أبيك القدوس الذي في السموات ونصلي بشكر: أبانا الذي في السموات.. إلخ.\nقسمة تذكار البشاره والميلاد والقيامه\nصلاة القسمة\nالخولاجي\nقسمة عيد ألرسل\n"},{"n":"35- قسم تُقال في تذكار البشارة والميلاد والقيامة (29 من كل شهر قبطي)","t":"نسبح ونمجد إله الآلهة ورب الأرباب، الذي تجسد من القديسة مريم، ولدته في بيت لحم.\nنسر بالتماجيد الروحية والتراتيل السماوية لأن الرب أرسل جبرائيل الملاك مبشرًا سيدتنا كلنا مريم العذراء بتجسد كلمة الآب الأزلي الذي هو مخلصنا يسوع المسيح.\nجبرئيل الملاك بشر العذراء مريم وبعد أن منحها السلام ثبتها بهذا الكلام قائلًا: لا تخافي يا مريم لأنك قد وجدت نعمة أمام الله وستلدين إبنًا وتسميه يسوع والقدوس المولود منك يدعي إبن الله.\nهذا هو مخلصنا المسيح ابن الله المولود منه قبل كل الدهور الكائن معه والمساوي له في الأزلية والألوهية الذي ولد من مريم وهي عذراء بأمر عجيب.\nالرب الإله الذي على الكل، المبارك إلى الأبد، الغير متجسد قي تجسد وولد من العذراء ولفته بالخرق ووضعته في المزود وعساكر السماوات ترتل له صارخين المجد لله في الأعالي وعلى الأرض السلام وبالناس المسرة.\nالذي نما قليلًا قليلًا بشبه البشر بغير خطية وحده، وهو الكائن بسلطانه وليس له بداية ولا نهاية الذي عوض الخطية المحيطة بالعالم مات بالصليب وفي اليوم الثالث قام من القبر.\nيا كلمة الإله بمحبتك للبشر رفعت الخطايا والآثام أنت الغير خاطئ وحدك صيرت ذاتك خطية لأجلنا ولكنك دست الخطية والموت بقيامتك من بين الأموات.\nلك السموات والأرض وكل ملئها، الأرضيون والمساويون صاروا اليوم واحدًا في التسبيح بقيامتك لأنه قد صار فرح في المسكونة من أجل أن الإله صار مع البشر ومن بعد تأنسه أظهر مجد لاهوته بقيامته من بين الأموات\nنحن أيضًا يا سيدنا نؤمن بربوبيتك ونعترف بتجسدك وتأنسك وقيامتك من بين الأموات فأنعم علينا بغفران خطايانا وآثامنا وطهر قلوبنا وأجسادنا وأرواحنا لكي بقلب طاهر ونفس مستنيرة نصرخ نحو أبيك الذي في السموات ونقول: أبانا الذي في السموات.. إلخ.\nصلاة القسمة\nالخولاجي\nقسمه للآب في كل وقت\nقسمة صوم العذرا واعيادها\n"},{"n":"36- قسمة للآب تُقال في كل وقت","t":"اللهم أبا ربنا وإلهنا ومخلصنا يسوع المسيح الذي سبق بظهور هذا السر العظيم من قبل إشعياء لأنه قاتل فيما أنا قائم في وقت الظهيرة فرأيت رؤيا ووقع على وهن (تعب)\nرأيت السموات مفتوحة ورأيت مركبة نور إبنة هبطت إلى أسفل وأربعة حيوانات يسبحون المركبة.\nومثل إبن الله جالسًا على المركبة ووجهه يضيء مثل النار والنار الحية محيطة به ورأيت الأربعة حيوانات وهذه أشكالهم وجه أسد ووجه عجل ووجه نسر ووجه إنسان.\nعظيم هو مجدهم وكرامتهم. مجدهم لا يوصف وأجسادهم كالشعاع المحرق وأربعة جهاتهم مملوئين أعين من الداخل والخارج يلمعون ببريقًا مضيئًا وصوت أجنحتهم كمثل الخيل.\nورأيت ألوفًا ألوفًا وربوات ربوات ملائكة قيام بخوف ورعدة صارخين قائلين: قدوس قدوس قدوس رب الصباؤوت السماء والأرض مملوءتان من مجدك القدس.\nورأيت أربعة وعشرين كرسيًا حول المركبة وأربعة وعشرين شيخًا جلوس عليهم وهم ملتحفين بحلل نورانية وأكاليل ذهب على رؤوسهم وجامات ذهب في أيديهم مملوءة من بخور مختار وهم يصرخون قائلين: قدوس، قدوس، قدوس رب الصباؤوت السماء والأرض مملوءتان من مجدك الأقدس.\nفإذا ما قالوا التمجيد للجالس على المركبة تصرخ سائر الطغمات السمائية قائلين: آمين الليلويا.\nفلما سمعتهم خفت وسقطت على وجهي فأتي إلى أحد الساروفيم ومسك بيدي وأقامني ونزع عني الخوف وقال: قم يا رجل الله لا تخف وأخذ جمرة بكلابتين من فوق المذبح وطرحها في فمي وقال لي خذ هذه كلها هي ترفع خطاياك وتطهر آثامك.\nفكان لما أكلتها صارت مثل العسل في فمي ونزلت إلى بطني كالمرارة، اما هو فقال لي: هذه الحلاوة التي صارت في فمك هي تمحو آثامك وتطهر خطاياك والمرارة التي في بطنك أنت تعلم أسرار عظيمة وتنظر مناظر عظيمة.\nمن أجل هذا نسأل ونطلب من صلاحك يا محب البشر كما صهرت شفتي عبدك إشعياء النبي طهر نفوسنا وأجسادنا وأرواحنا لنجسر بدالة بغير خوف ان نصرخ إليك يا الله الاب ضابط الكل ونقول الصلاة الربانية التي علمها ابنك الحبيب لخواصه الأطهار وإنه في كل زمان إذا ما صليتم فأطلبوا هكذا وقولوا: أبانا الذي في السموات.... إلخ.\nصلاة قسمة سريانيه\nصلاة القسمة\nالخولاجي\nقسمة تذكار البشاره والميلاد والقيامه\n"},{"n":"37- صلاة قسمة سريانية","t":"أنت هو الإله الأقدس والصالح الواهب السعادة للمختارين، والقداسة للقديسين.\nأنت مجانًا برحمتك ومحبتك وهبت لنا جسدك المطر ودمك الفادي مائدة وعزاء للمؤمنين.\nهذه هي الذبيحة التي صورها هابيل بدمه، وأشار إليها بذبحه هذه هي الذبيحة التي نجت الأبكار من ضربة الملك، هذه هي الذبيحة التي تنبأ كافة النبويين عنها بنبواتهم وإشتهوا لنظرها الأبرار والصديقون في أوقاتهم.\nهاتان هما اليدان اللتان سمرتا على الصليب هذا هو الجنب الذي فتحت الجندي بالحربة وجري منه دم وماء غفرانًا لكل العالم.\nبذوق لحمك أؤهل لحلاوة محبتك وبمشرب دمك أعطيتني مذاقة روحانية تلذذ بمذاقة أسرارك الإلهية.\nكما أنك متحد بالخبز والخمر أنا أتحد بك وأنتي بي ويكمل قولك الجميع واحد وأنت في وانا فيك وأنت في أبيك وأبوك فيك وبدالة أدعو أباك أبًا لي بصوت جهور قائلًا: أبانا الذي في السموات.. إلخ.\nقسمة البابا اثناسيوس الرسول\nصلاة القسمة\nالخولاجي\nقسمه للآب في كل وقت\n"},{"n":"38- صلاة قسمة للقديس أثناسيوس الرسولي","t":"وأيضًا نتضرع إلى الرحمة ونكهن إلى ذلك الذي هو نفسه الكاهن ونقدم الذبيحة إلى ذلك الذي هو نفسه الذبيحة.\nونقدم التقدمة إلى ذاك الذي هو نفسه التقدمة\nليأت ذاك الحمل من الأعالي فنراه بأعيننا ونذبحه بأيدينا ونفرح به.\nليتحد جسده بهذا الخبز ولينسكب دمه في هذه الكأس.\nيجب ألا يفكر أى واحد منا عندما يأكل من هذا الخبز انه يأكل مجرد لحم بدون دمٍ أو روحٍ، ويجب ألا يفكر أي واحدٍ منا عندما يشرب من هذه الكأس، أنه يشرب مجرد دم بدون جسدٍ ولا روح.\nبل واحد هو الجسد والدم والروح كما صار لاهوت الرب إلهنا واحدًا مع ناسوته.\nطهر نفوسنا وأجسادنا وأرواحنا وأفكارنا ونياتنا كلنا بقلب طاهر ونفس مستنيرة ووجه غير مخزي وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول كما علمتنا أبانا الذي في السموات.. إلخ.\n** تنسيق مختلف (1)\nوأيضاً نتضرع إلى إلى الرحمةِ، ونكهن إلى ذلك الذي هو نَفسهُ الكاهن، ونقدم الذبيحة إلى ذلك الذي هو نَفسهُ الذبيحة.\nونقدم التقدمة إلى ذاك الذي هو نفسه التقدمة، ليأت ذاك الحمل من الأعالي فنراه بأعيننا، ونذبحه بأيدينا ونفرح بهِ.\nطهر نفوسنا، وأجسادنا، وأرواحنا، وأفكارنا، ونياتنا كلنا لكي بقلبٍ طاهرٍ، ونفس مستنيرةٍ، ووجهٍ غير مخزي، وإيمانٍ بلا رياء، ومحبة كاملة، ورجاءٍ ثابت، نَجْسُر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات، ونقول كما علَّمتَنا:\nيا أبانا الذي في السموات...\n** الحواشي والمراجع لهذه الصفحة هنا في موقع الأنبا تكلاهيمانوت:\n(1) كتاب صلوات القسمة في القداس الإلهي، للراهب القمص بيجول الأنبا بيشوي، إصدار: كنيسة مارمرقس بالكويت - الطبعة الأولى : مايو 2002 م. - الطبعة الثانية: مايو 2010 م.، ص. 145.\nقسمه عيد عرس قانا الجليل\nصلاة القسمة\nالخولاجي\nصلاة قسمة سريانيه\n"},{"n":"39- قسمة تُقال في عيد عرس قانا الجليل","t":"أنت هو كلمة الآب الإله الذي قبل الدهور رئيس الكهنة الأعظم إلى تجسد وتأنس من أجل خلاص البشر.\nالذي نما قليلًا بشبه البشر بغير خطية وحده الذي أتي وإعتمد من يوحنا السابق.\nالذي أجتمع مع العذراء مريم وآبائنا الرسل الأطهار في العرس بقانا الجليل ولما فرغت الخمر قالت أم يسوع له ليس لهم خمر (+)\nستة أجران ماء حولها إلى خمر مختار بقوة لاهوته هذه بداية الآيات التي فعلها يسوع في قانا الجليل وأظهر مجده فآمن به تلاميذه.\nأنت هو حمل الله الحامل خطية العالم إغفر ذنوبنا وأترك خطايانا وأقمنا عن جانبك اليمين.\nالذي من الشاروبيم يتبارك ومن السارافيم يتقدس ومن ألوف ألوف وربوات ربوات الخدام الناطقين يتعظم الذي يقدس ويكمل القرابين وتكميل الأثمار التي قدمت له رائحة لذيذة قدس أيضًا اجسادنا وأنفسنا وأرواحنا كلنا. لكي بقلب طاهر ووجه غير مخزي نصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات.. إلخ.\n"},{"n":"40- قسمه تُقال في عيد التجلي المجيد (+)","t":"أنت هو كلمة الآب الإله الذي قبل كل الدهور ورئيس الكهنة الأعظم الذي تجسد وتأنس من أجل خلاص جنس البشر ودعا له من جميع الأمم جنسًا مختارًا مملكة وكهنوتًا وامة مقدسة وشعبًا مبررًا.\nالذي صعد فوق جبل تابور وأخذ معه تلاميذه بطرس ويعقوب ويوحنا وتجلي أمامهم وكان وجهه يلمع اكثر من الشمس وثيابه مثل الثلج وظهر لهم النبيان موسي وإيليا وهما يتكلمان معه في أورشليم عن الفداء الذي كان مزمعًا أن يكمله.\nوإذ سحابة منيرة ظللتهم وصوت من السماء قائلًا: هذا هو إبني الحبيب الذي به سررت له إسمعوا.\nفلهذا نسأل ونطلب من صلاحك يا محب البشر أن لا تكون هذه الذبيحة تبكينا لخطايانا وعارًا لآثامنا لأننا قدمناها لك عن ضعفنا. بل قدس أنفسنا وأجسادنا وأرواحنا ونياتنا كلنا.\nلكي بنفس مستنيرة ووجه غير مخزي وقلب طاهر وإيمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن نصلي الصلاة المقدسة التي اعطيتها لتلاميذك القديسين والرسل الأطهار قائلين بشكر: أبانا الذي في السموات.. إلخ.\n"},{"n":"41- قسمة القداس الباسيلي للآب","t":"أيها السيد الرب الهنا العظيم الأبدى والمتعجب منة بالمجد. حافظ عهدة ورحمتة للذين يحبونة بكل قلبهم. الذي أعطانا الخلاص من خطايانا بابنة الوحيد يسوع المسيح ربنا حياة كل أحد. يا معين الملتجئين الية. رجاء الذين يصرخون نحوة. الذي يقف أمامة الوف الوف وربوات ربوات الملائكة ورؤساء الملائكة المقدسين. الشاروبيم والسارافيم وكل الجمع الغير المحصى الذي للقوات السمائية.اللهم الذي قدس هذه القرابين الوضوعه بحلول روحك القدوس عليها وطهرتها. طهرنا نحن يا سيدنا من خطايانا الخفية والظاهرة وكل فكر لا يرضى صلاحك يا الله محب البشر فليبعد عنا.طهر نفوسنا وأجسادنا وأرواحنا وقلوبنا وعيوننا وأفهامنا وأفكارنا ونياتنا. لكي بقلب طاهر ونفس مستنيرة. ووجة غير مخزى. وايمان بلا رياء ومحبة كاملة ورجاء ثابت. نجرأ بدالة بغير خوف أن نطلب إليك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات............\nقسمة القداس الغريغوري للإبن\nصلاة القسمة\nالخولاجي\nقسمة عيد التجلى ألمجيد\n"},{"n":"42- قسمة للابن من القداس الغريغوري","t":"مبارك أنت أيها المسيح الهنا ضابط الكل مخلص بيعتك أيها الكلمة المعقولة والانسان المنظور. الذي من قبل تجسدك غير المدرك أعددت لنا خبزا سمائيا جسدك المقدس هذا السرى والمقدس في كل شىء. ومزجت لنا كأسا من كرمة حقيقية التي هي جنبك الالهى غير الدنس. هذا الذي من بعد أن أسلمت الروح فاض لنا منه ماء ودم هذان الصائران طهرا لكل العالم. اقتننا لك أيها الصالح نحن عبيدك الغير المستحقين. واجعلنا لك شعبا مجتمعا, مملكة وكهنوتا وأمة مقدسة. طهرنا نحن أيضا يا سيدنا كما قدست هذه القرابين الموضوعه, وجعلتها غير مرئية من المرئين وأسرارا معقولة لك. يا ربنا والهنا مخلصنا يسوع المسيح. أنت من أجل تحننك الجزيل جعلتنا أهلا كلنا للبنوة, بالصبغة المقدسة. وعلمتنا أمثلة الصلاة السرية لندعو أباك بها. أنت أيضا الآن يا سيدنا اجعلنا مستحقين بنية طاهرة. وفكر صالح يليق بالبنين. واشتياق ودالة. أن نجرأ ونصرخ نحو الله أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات.............\nقسمة القداس الكيرلسي للآب\nصلاة القسمة\nالخولاجي\nقسمة القداس الباسيلي للآب\n"},{"n":"43- قسمة القداس الكيرلسي للآب","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nيا الله الذي سبق فوسمنا للبنوة بيسوع المسيح ربنا كمسرة إرادتك، كرامة لمجد نعمتك التي أنعمت بها علينا بحبيبك.\n** O God, who foreordained us to sonship through Jesus Christ our Lord, according to the good pleasure of Your will, unto the honor of the glory of Your grace, which You have granted to us through Your Beloved.\n** `V] vy`etafersorp `n;asten `eoumetsyri@ hiten I=y=c P=,=c pen=o=c@ kata `p]ma] `mpekouws@ `eoutaio `nte `p`wou `nte pek`hmot@ vy`etaker`hmot `mmof nan qen Pekmenrit.\nهذا الذي صار لنا به خلاصنا، بدمه الطاهر لغفران الخطايا.\n** This is He by whom we had our salvation, through His holy Blood, unto the forgiveness of our sins.\n** Vai `etafswpi nan `nqytf `nje pencw]@ hiten Pef`cnof =e=;=u@ `e`p,w `ebol `nte ninobi.\nنشكرك أيها الرب الإله ضابط الكل، لأنك جعلتنا مستحقين نحن الخطاة. أن نقف في هذا الموضع المقدس، ونكمل هذا السر المقدس السمائي.\n** We give thanks to You, O Lord God the Pantocrator, for You have made us, who are sinners, worthy to stand in this holy place and fulfill this holy, heavenly Mystery.\n** Tensep`hmot `ntotk `P=o=c `V] piPantokratwr@ je ak`;rener`pem`psa `anon qa nirefernobi. `E`ohi `eraten qen paima =e=;=u vai ouoh `ejwk `mpai`agion `mMuctyrion `nte nivyou`i `ebol.\nلكيْ كما جعلتنا أهلاً أن نكملهما، هكذا أيضاً فلنستحق شركتهما والتناول منهما.\n** So that, as You have made us worthy to fulfill Them, so also may we be worthy of the communion and partaking of Them.\n** Hina kata `vry] `etak`;rener`pem`psa `njokou `ebol pairy] on marener`pem`psa `ntoukoinwnia@ nem pijin[i `ebol `mmwou.\nيا مَنْ فتح أعين العميان افتح عيون قلوبنا. إذ نطرح عنا كل ظلمه الشر، والخبث الذي شبه الدنس. ونستطيع أن نرفع أعيننا إلي فوق نحو بهاء مجدك القدوس.\n** O You, who opened the eyes of the blind, open the eyes of our hearts. So that we may cast away from us all the darkness of evil and malice, which is then likeness of defilement. That we may be able to raise up our eyes towards the splendor of Your holy glory.\n** Vy`etafouwn `nnibal `nte nibelleu `aouwn `nnibal `nte nenhyt. Hwc `eanhioui `ebol haron `n,aki niben `nte ]kakia@ nem ]ponyria `m`p`cmot `nou;wleb. `Nten`sjemjom `efai `nnenbal `e`pswi@ oube ]metcai`e `nte pek`wou =e=;=u.\nوكما طهرت شفتي عبدك إشعياء النبي. إذ أخذ أحد السيرافيم جمرة بملقط من على المذبح وطرحها في فيه وقال له:\n** And even as You have cleansed the lips of Your servant Isaiah the prophet. As one of the Seraphim took an ember with the tongs from the altar, cast it into his mouth, and said to him.\n** Ke kata `vry] `etaktoubo `nnen`cvotou `mpekbwk `Yca`yac pi`provytyc. `Eaf[i `nje ouai `nniCeravim `noujebc@ qen ]e[ou `ebol hijen pima`nerswousi@ `eafhitf `eqoun `erwf ouoh afjoc naf.\n\"إن هذه قد لمست شفتيك ترفع آثامك، وتطهر جميع خطاياك.\"\n** \"Behold, this has touched your lips, it shall take away your iniquities and cleanse all your sins.\"\n** Je ic vai af[inem nek`cvotou@ `fna`wli `nnek`anomia@ ouoh neknobi tyrou `fnatoubwou.\nهكذا نحن أيضاً الضعفاء الخطاة، عبيدك الطالبين رحمتك.\n** Likewise we too, Your weak and sinful servants, who ask for Your mercy.\n** Pairy] `anon hwn qa nijwb `nrefernobi et[i `nounai `erwou `n`ebiaik `ntak.\nتفضل طهِّر أنفسنا، وأجسادنا، وشفاهنا، وقلوبنا. وأعطنا هذه الجمرة الحقيقية المعطية الحياة للنفس والجسد والروح.\n** Graciously cleanse our souls, our bodies, our lips, and our hearts. And give us this true Ember that is life-giving to soul, body, and spirit.\n** `Arikataxioin matoubo `nnen'u,y nem nencwma nem nen`cvotou nem nenhyt. Ouoh moi nan `mpai`aly;inoc `njebc vai@ `nref] `m`pwnq `n]'u,y nem picwma nem pi`pneuma.\nالتي هي الجسد المقدس، والدم الكريم اللذان لمسيحك.\n** Which is the holy Body and the precious Blood of Your Christ.\n** `Ete piCwma =e=;=u pe nem pi`Cnof ettaiyout `nte Pek`,rictoc.\nلا للدينونة ولا للوقوع في الدينونة، ولا خزياً وتبكيتاً لزلاتنا. لئلا إذا تناولنا منهما بغير إستحقاق، نكون مدانين بهما.\n** Not unto judgment, nor unto falling into condemnation, nor unto shame and reproving of our transgressions. Lest, partaking of Them unworthily, we become guilty of Them.\n** `Eouhap an@ oude ouhiou`i `e`phap@ oude `eousws nem oucohi `nte nenparaptwma. Mypwc `ean[i `ebol `nqytou qen oumetat`m`psa@ `nteswpi emoi `n`eno,oc `erwou.\nولئلا يكون لنا كثرة إكرامك يا سيدنا علة ثقل بالأكثر للوقوع في الدينونة، إذ نصير غير شاكرين لك أنت المحسن.\n** So that the multitude of Your graciousness, our Master, may not be for us a cause of excess burden towards falling into condemnation, having become ungrateful towards You, O You, the beneficent One.\n** Hina `nte`stem `phou`o `nte nektaio penNyb@ swpi nan `noulwiji `nte oubaroc `nhou`o `nte ouhiou`i `e`phap@ hwc `eanswpi `natsep`hmot `eqoun `erok@ `n;ok qa piReferpe;nanef.\nبل أنعم علينا بروحك القدوس. لكيْ بقلب طاهر، وسريرة مستنيرة، بوجه غير مخزي، وإيمان بغير رياء، بمحبة كاملة ورجاء ثابت. نجسر بدالة، بغير خوف، أن نقول الصلاة المقدسة.\n** But rather grant us Your Holy Spirit, that with a pure heart, an enlightened conscience, an unashamed face, a faith unfeigned, a perfect love, and a firm hope, we may dare with boldness, without fear, to say the holy prayer.\n** Alla `ari`hmot nan `mPek`pneuma =e=;=u. Hina qen ouhyt efouab nem oucunidycic `eac[iouwini@ qen ouho `nat[isipi nem ounah] `natmetsobi@ qen ou`agapy ecjyk `ebol nem ouhelpic ectajryout. `Ntenertolman qen ouparrycia `naterho] `ejw `n]eu,y =e=;=u.\nالتي أعطاها ابنك الحبيب لتلاميذه القديسين، ورسله الأطهار قائلاً لهم:\n** Which Your beloved Son gave to His holy disciples and saintly apostles, saying to them,\n** :y`eta pekmenrit `nSyri tyic `etotou `nny`ete nouf `n`agioc `mma;ytyc ouoh `n`apoctoloc =e=;=u efjw `mmoc nwou.\n\"إنه في كل زمان إذا صليتم فإطلبوا هكذا وقولوا: أبانا الذي...\"\n** \"At all times, whenever you pray, entreat in this manner, and say, 'Our Father...'\"\n** Je `ncyou men gar niben `eswp `aretensaner`proceu,ec;e@ twbh `mpairy] ouoh `ajoc. Je penIwt...\nيا الله الذي سبق فوسمنا للبنوة بيسوع المسيح ربنا كمسرة ارادتك, كرامة لمجد نعمتك التي أنعمت بها لنا بحبيبك. هذا الذي صار لنا بة بخلاصنا بدمة الطاهر لغفران الخطايا. نشكرك أيها الرب الالة ضابط الكل لأنك جعلتنا مستحقين نحن الخطاة. أن نقف في هذا الموضع المقدس ونكمل هذا السر المقدس السمائى. لكي كما جعلتنا أهلا أن نكملهما هكذا ايضا فلنستحق شركتهما والتناول منهما. يا من فتح أعين العميان افتح عيون قلوبنا. إذ نطرح عنا كل ظلمة الشر والخبث الذي شبة الدنس. ونستطيع أن نرفع أعيننا إلى فوق نحو بهاء مجدك القدوس. وكما طهرت شفتى عبدك اشعياء النبى. إذ أخذ أحد السارافيم جمرة بالكلبتين من على المذبح وطرحها في فيه وقال لة. ان هذه قد لمست شفتيك ترفع آثامك وتطهر جميع خطاياك. هكذا نحن أيضا الضعفاء الخطاة عبيدك الطالبين رحمتك. تفضل طهر أنفسنا وأجسادنا وشفاهنا وقلوبنا. وأعطنا هذه الجمرة الحقيقية المعطية للحياة للنفس والجسد والروح. التي هي الجسد المقدس والدم الكريم اللذان لمسحيك. لا للدينونة ولا للوقوع في الدينونة ولا خزيا وتبكيتا لزلاتنا. لئلا إذ ننال منهما بغير استحقاق نكون مدانين بهما. ولئلا تكون لنا كثرة كراماتك يا سيدنا علة ثقل بالأكثر للوقوع في الدينونة. إذ نصير غير شاكرين لك, أنت المحسن. بل انعم لنا بروحك القدوس. لكي بقلب طاهر وسريرة مستنيرة, بوجة غير مخزى وايمان بلا رياء, بحبة كاملة ورجاء ثابت. نجرأ بدالة بغير خوف أن نقول الصلاة المقدسة. التي أعطاها ابنك الحبيب لتلاميذة القديسين ورسلة الأطهار قائلا لهم: ان في كل زمان اذا صليتم فاطلبوا هكذا وقولوا: أبانا الذي في السموات.............\n((يا الله الذي سبق فوسمنا للبنوة بيسوع المسيح ربنا كمسرة إرادتك كرامة لمجد نعمتك التي انعمت بها لنا بحبيبك هذا الذي صار لنا به خلاصنا بدمه الطاهر لغفران الخطايا نشكرك أيها الرب الإله ضابط الكل لأنك جعلتنا مستحقين نحن الخطاة ان نقف في هذا الموضع المقدس ونكمل هذا السر المقدس السمائي لكي كما جعلتنا أهلًا ان نكملها هكذا أيضًا فلنستحق شركتهما والتناول منهما.\nيا من فتح أعين العميان إفتح عيون قلوبنا إذ نطرح عنا كل ظلمة الشر والخبث الذي شبه الدنس ونستطيع ان نرفع أعيننا إلى فوق نحو بهاء مجدك القدوس وكما طهرت شفتي عبدك إشعياء النبي إذ أخذ السارافيم جمرة من على المذبح وطرحها في فيه وقال له إن هذه قد لمست شفتيك ترفع آثامك وتطهر جميع خطاياك هكذا نحن أيضًا الضعفاء الخطاة عبيدك الطالبون رحمتك.\nتفضل طهر انفسنا وأجسادنا وشفاهنا وقلوبنا وأعطنا هذه الجمرة الحقيقية المعطية الحياة للنفس والجسد والروح التي هي الجسد المقدس والدم الكريم اللذان لمسيحك لا للدينونة ولا للوقوع في الدينونة ولا خزيًا وتبكيتا لزلاتنا لئلا إذ ننال منهما بغير استحقاق نكون مدانين بهما ولئلا تكون لنا كثرة كراماتك يا سيدنا علة ثقل بالأكثر للوقوع في الدينونة إذ نصير غير شاكرين لك أنت المحسن بل أنعم لنا بروحك القدوس لكي بقلب طاهر وسريرة مستنيرة بوجه غير مخزي وإيمان بلا رياء بمحبة كاملة ورجاء ثابت نجرأ بدالة بغير خوف ان نقول الصلاة المقدسة التي اعطاها ابنك الحبيب لتلاميذه القديسين ورسله الأطهار قائلًا لهم في كل زمان إذا صليتم فأطلبوا هكذا وقولوا آبانا..).\n** يا الله الذي سبق وأوسمنا (أى ختمنا) للبنوة بيسوع المسيح ربنا كمسرة إرادتك كرامة لمجد نعمتك الذي أنعمت بها علينا بحبيبك هذا الذي صار لنا به خلاصًا بدمك الطاهر لغفران الخطايا.\n** نشكرك أيها الرب الإله ضابط الكل لأنك جعلتنا مستحقين نحن الخطاة أن نقف في هذا الموضع المقدس ونكمل هذا السر المقدس السمائى وكما جعلتنا أهلًا أن نكملها هكذا أيضا فلنستحق شركتهما والتناول منهما. يا من فتح أعين العميان إفتح عيون قلوبنا إذ تطرح عنا كل ظلمة الشر والخبث الذي هو شبه الدنس ونستطيع أن نرفع أعيننا إلى فوق نحو بهاء مجدك القدوس وكما طهرت شفتى عبدك إشعياء النبي إذ أخذ السيرافيم جمرة بملقط من على المذبح وطرحها في فمه وقال له. إذ هذه قد لمست شفتيك فترفع آثامك وتطهر من جميع خطاياك هكذا نحن أيضا الضعفاء الخطاة عبيدك الطالبون رحمتك تفضل طهر أنفسنا وأجسادنا وشفاهنا وقلوبنا وأعطنا هذه الجمرة ج الحقيقة المعطية حياة للنفس والجسد والروح. التي هي الجسد المقدس والدم الكريم اللذان لمسيحك لا للدينونة ولا للوقوع في الدينونة ولا خزيا وتبكيتًا لزلاتنا لئلا إذا تناولنا منهما بغير إستحقاق نكون مدانين بهما ولكى لا يكون لنا كثرة اكرامك يا سيدنا علة ثقل بالأكثر للوقوع في الدينونة عندما نصير غير شاكرين لك أنت المحسن بل أنعم علينا بروحك القدوس لكي بقلب طاهر وسريرة مستنيرة بوجه غير مخزى وإيمان أنعم علينا بغير رياء، وبمحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن نقول الصلاة المقدسة التي أعطاها ابنك الحبيب لتلاميذه القديسين ورسله الأطهار قائلا لهم أنه في كل زمان إذا صليتم فاطلبوا هكذا وقولوا: أبانا..\nقسمة عيد الغطاس\nصلاة القسمة\nالخولاجي\nقسمة القداس الغريغوري للإبن\n"},{"n":"44- قسمة عيد الغطاس","t":"أنت هو الله الرحوم مخلص كل أحد الذي تجسد من الروح القدس ومن القديسة مريم العذراء ولدتة في بيت لحم. الذي نما قليلا قليلا بشبة البشر بغير خطية وحدة. الذي أتى إلى الأردن واعتمد من يوحنا السابق. الله الجالس على الشاروبيم قد أتى إلى الأردن واعتمد فيه. الذي زين السماء بكثرة النجوم تعرى من ثيابه , والصورة التي فسدت وماتت بالخطية جددها مرة أخرى بعماد الماء. الذي شهد لة يوحنا بن ذكريا قائلا: أن الرب يسوع المسيح لما تعمد وصعد من الماء إذ السموات قد انفتحت لة ورأى روح الله نازلا مثل حمامة وآتيا علية وصوت من السموات قائلا: هذا هو ابنى الحبيب الذي به سررت. وفي الغد نظر يوحنا يسوع مقبلا الية فقال: هوذا حمل الله الذي يرفع خطية العالم. فيا حمل الله حامل خطية العالم اغفر ذنوبنا واترك خطايانا وأقمنا على جانبك اليمين. واذ قد أنعمت علينا يا سيدنا بالميلاد الذي من فوق بواسطة الماء وروحك القدوس, فاجعلنا مستحقين بداله بغير خوف أن ندعو الله أباك أبا لنا ونرفع أصواتنا ونقول: أبانا الذي في السموات.....\nصلاة القسمة\nالخولاجي\nقسمة عيد مجئ المسيح إلى مصر\nقسمة القداس الكيرلسي للآب\n"},{"n":"45- قسمة عيد مجيء السيد المسيح إلى أرض مصر","t":"أيها السيد الرب الهنا الخالق غير المرئى غير المحوى غير المفحوص. الذي أرسل نورة الحقيقى ابنة الوحيد يسوع المسيح الكلمة الذاتى. الكائن في حضنة الأبوى كل حينا أتى وحل في الحشاء البتول غير الدنس ولدتة وهى عذراء وبتوليتها مختومه. إذ الملائكة تسبحه وعساكر السموات ترتل له صارخين قائلين: قدوس قدوس قدوس رب الصباؤوت السماء والأرض مملؤتان من مجدك الأقدس. هذا الذي تسبحه الملائكة جاء اليوم إلى مصر في حضن أمه مريم العذراء السماء الجديدة. والبار يوسف النجار. افرحى وتهللى يا مصر مع كل بنيك وتخومك لأنه أتى إليك محب البشر الكائن قبل كل الدهور. أشعياء النبى العظيم قال في نبؤته: هوذا الرب راكب على سحابة خفيفه وقادم إلى مصر , والسحابة كانت القديسة مريم العذراء. فليبارك المسيح الهنا على قلوبنا وأرواحنا لكي بقلب طاهر ونفس مستنيرة وايمان بلا رياء ومحبة كاملة ورجاء ثابت نجسر بدالة بغير خوف أن ندعوك يا الله الآب القدوس الذي في السموات ونقول: أبانا الذي في السموات........\nصلاة القسمة\nالخولاجي\nقسمة كل يوم 29 من الشهر القبطي\nقسمة عيد الغطاس\n"},{"n":"46- قسمة تُقال كل يوم 29 من الشهر القبطي","t":"نسبح ونمجد الة الالهة ورب الأرباب الذي تجسد من القديسة مريم العذراء وولدتة في بيت لحم. لأن الرب أرسل جبرائيل الملاك مبشرا سيدتنا كلنا مريم العذراء بتجسد كلمة الآب الأزلى الذي هو مخلصنا يسوع المسيح. جبرائيل رئيس الملائكة بشر مريم العذراء وبعد أن منحها السلام ثبتها بهذا الكلام قائلا: لا تخافى يا مريم لأنكى قد وجدت نعمه أمام الله وستلدين ابنا وتسمينة يسوع , القدوس المولود منك يدعى ابن الله. هذا هو مخلصنا المسيح ابن الله المولود منه قبل كل الدهور الكائن معه والمساوى له في الأزلية والألوهية. الذي ولد من مريم وهى عذراء بأمر عجيب. الرب الالة الذي على الكل , المبارك إلى الأبد. الغير المتجسد قد تجسد وولد من العذراء ولفتة بالخرق ووضعته في المزود , وعساكر السموات ترتل له صارخين: المجد لله في الأعالى وعلى الأرض السلام وفي الناس المسرة. الذي نما قليلا قليلا بشبة البشر بغير خطية وحدة وهو الكائن بسلطانة وليس لة بداية ولا نهاية الذي عوض الخطية المحيطة بالعالم مات بالصليب وفي اليوم الثالث قام من القبر. يا كلمة الإله بمحبتك للبشر رفعت الخطايا والآثام أنت الغير خاطى وحدك , صيرت ذاتك خطية لأجلنا ولكنك دست الخطية والموت بقيامتك من بين الأموات. لك السموات والأرض وكل ملئها , الأرضيون والسمائيون صاروا اليوم واحدا في التسبيح بقيامتك لأنه قد صار فرح في المسكونه من أجل أن الإله صار مع البشر ومن بعد تأنسة أظهر مجد لاهوتة بقيامتة من بين الأموات. فنحن أيضا يا سيدنا نؤمن بربوبيتك ونعترف بتجسدك وتأنسك وقيامتك من بين الأموات , فأنعم علينا بغفران خطايانا وآثامنا وطهر قلوبنا وأجسادنا وأرواحنا. لكي بقلب طاهر ونفس مستنيرة ونصرخ نحو أبيك القدوس الذي في السموات ونقول: أبانا الذي في السموات..........\nقسمة الصوم الكبير للحمل\nصلاة القسمة\nالخولاجي\nقسمة عيد مجئ المسيح إلى مصر\n"},{"n":"47- قسمة الصوم الكبير للحمل","t":"يا حمل الله يا حامل خطية العالم، الذي تألم ومات عوض الخطاة الذين أنا أولهم. ماذا أقول وبماذا أتكلم! أخطأت يا أبتاه إلى السماء وقدامك ولست مستحقاً أن أدعى لك إبناً. بل إجعلني كأحد اجرائك ولتدركني مراحمك.\n** O You the Lamb of God who takes away the sin of the world; who suffered and died instead of the sinners of whom I am the first. What can I say or testify. Father I have sinned against heaven and before You and am no longer worthy to be called Your son. Make me one of Your hired servants and apprehend me with Your mercies.\nيا حمل الله يا حامل خطية العالم، أعترف بأنني تجاسرت ودنَّست هيكلك المقدس بخطاياي وأفسدت الصورة الطاهرة التي خلقتني عليها فطهرني من أدناسي.\n** O You the Lamb of God who takes away the sin of the world; I confess that I was bold to defile Your holy temple with my iniquities and I spoiled Your pure image which You created me on, so cleanse me of my blemish.\nيا حمل الله يا حامل خطية العالم، لجأت إلى رحمتك وتحننك لأن مراحمك لا تحصى، وأنت قلت أنك لم تأت لتدعوا أبراراً بل خطاة إلى التوبة وأن الأصحاء لا يحتاجون إلى طبيب بل المرضى وأنك لا ترد خاطئاً أقبل إليك فإقبل توبتي.\n** O You the Lamb of God who takes away the sin of the world; I fled to Your mercy and compassion, for Your mercies are immeasurable, and You said that You did not come to call the righteous but the sinners to repentance. And that those who are healthy need not a physician but they that are sick. You also never reject any sinner coming back to You. Therefore accept now my repentance.\nيا حمل الله يا حامل خطية العالم، أنت الإله الغفور الذي يغفر الذنب والسيئة ولا يحقد إلى الدهر. لأنك إله رؤوف ورحيم بطئ الغضب وكثير الرحمة والإحسان غافر الإثم والمعصية فإغفر لي ذنوبي وإشفق عليَّ.\n** O You the Lamb of God who takes away the sin of the world; You are ready to pardon and forgive sins and guilt. Not keeping anger forever. You are merciful and gracious, abundant in goodness and truth, forgiving iniquities and transgressions. Therefore forgive me my sins and have compassion upon me.\nيا حمل الله يا حامل خطية العالم، أنت لا تسر بموت الخاطئ بل أن يرجع ويحيا وجئت إلى العالم لكي تطلب وتخلص ما قد هلك فخلصني من الهلاك الأبدي.\n** O You the Lamb of God who takes away the sin of the world; You have no pleasure in the death of the wicked but that the wicked turn from his way and lives. And You came to the world to seek and save that which was lost. So save me from the everlasting perdition.\nيا حمل الله يا حامل خطية العالم، أنت هو الراعي الصالح الذي بذل نفسه عن الخراف، وأنت الذي فتش عن الخروف الضال والدرهم المفقود ووجدهما. إرحم شعبك وميراثك وغنم رعيتك.\n** O You the Lamb of God who takes away the sin of the world; You are the Good Shepherd who gave Himself for the sheep. And You are He who seeks for the stray sheep and the lost dram and found them. Have mercy on Your people and Your inheritance and the sheep of Your flock.\nيا حمل الله يا حامل خطية العالم، إرحمني فإني ضعيف إشفني لأن عظامي قد إرتجفت ونفسي قد إرتاعت جداً، عد يا رب ونج نفسي وإسمع تنهدي وأنظر إلى مذلتي. لأنه لن يتبرر قدامك كل حي وإن حاكمتني بعدلك فلن أجد حجة فلا تعاملني كخطاياي ولا تنزعه في نصف أيامي.\n** O You the Lamb of God who takes away the sin of the world; Have mercy upon me O Lord for I am weak, heal me for my bones are vexed, my soul is also distressed. Return O Lord and deliver my soul and listen to my groaning and consider my afflictions. As in Your sight shall no man living be justified. If You condemn me in justice I will have no reason, So deal not with me according to my transgression, and take me not in the midst of my days.\nيا حمل الله يا حامل خطية العالم، لا توبخني بغضبك ولا تؤدبني بغيظك ولا تعاملني بعدلك وأذكر أني عمل يديك وترأف بي ولا تدخل في المحاكمة مع عبدك.\n** O You the Lamb of God who takes away the sin of the world; Rebuke me not in Your anger, neither chasten me in Your hot displeasure nor condemn me in Your justice. Remember that I am the work of Your hands and have compassion on me. Do not enter into judgment with Your servant.\nيا حمل الله يا حامل خطية العالم، إغفر لي وسامحني لأترنم لك قائلاً: \"طوبى لمَنْ غفرت إثمه وسترت خطيته. أعترف لك بخطيتي.\" ولا أكتم إثمي. فإغفر لي وإسترني. لأنه لن يتبرر قدامك كل حي وإن حاكمتني بعدلك فلن أجد حجة. فلا تعاملني كخطاياي ولا تنزعني في نصف أيامي.\n** O You the Lamb of God who takes away the sin of the world; Forgive and pardon me so that I may praise You saying, \"Blessed is he whose transgression is forgiven and whose sin is covered. I confess my sin to You.\" And my iniquity I have not hidden from You. Therefore forgive me and hide me under the shadow of Your wings. As in Your sight shall no man living be justified. If You condemn me in justice I will have no reason, So deal not with me according to my transgression, and take me not in the midst of my days.\nيا حمل الله يا حامل خطية العالم، إغفر لي وسامحني لأترنم لك قائلاً: \"طوبى لمَنْ غفرت إثمه وسترت خطيته. أعترف لك بخطيتي.\" ولا أكتم إثمي. فإغفر لي وإسترني.\n** O You the Lamb of God who takes away the sin of the world; Forgive and pardon me so that I may praise You saying, \"Blessed is he whose transgression is forgiven and whose sin is covered. I confess my sin to You.\" And my iniquity I have not hidden from You. Therefore forgive me and hide me under the shadow of Your wings.\nيا حمل الله يا حامل خطية العالم، أعترف بأن أثامي علت فوق رأسي كحمل ثقيل أثقل مما أحتمل وقد فارقتني قوتي. فأعني وإرحمني من أتعابي.\n** O You the Lamb of God who takes away the sin of the world; I acknowledge that my iniquities are heaped over my head as a heavy burden, they are too heavy for me, and my power was drained away, so help me and comfort me in my passion.\nيا حمل الله يا حامل خطية العالم، خطيتي ووجعي مقابلي في كل حين لأني أخبر بإثمي وأغتم من أجل خطيتي خطايا شبابي وجهالات صباي لا تذكر. اذكرني أنت من أجل صلاحك ولا تهملني يا ربي ولا تتباعد عني.\n** O You the Lamb of God who takes away the sin of the world; My sin and sorrow is continuously before me. I declare my iniquity and I am sorry for my sin. Do not remember the sins of my youth, nor my transgressions; According to Your mercy remember me, For Your goodness' sake, O Lord and do not neglect me neither be far from me.\nيا يسوع المسيح إلهنا، يا حمل الله يا حامل خطية العالم، طهرنا من كل خطية وأغفر ذنوبنا وأترك أثامنا وإصفح عن ذلاتنا من أجل هذه الذبيحة الطاهرة. وقدس نفوسنا وأجسادنا وأرواحنا وقلوبنا وعيوننا وأفهامنا وأفكارنا ونياتنا، لكي بقلب طاهر نستجرئ بدالة بغير خوف أن ندعو الله أبيك الذي في السموات ونقول: أبانا الذي...\n** O Jesus Christ the Lamb of God who takes away the sin of the world; Purify us from every sin, forgive us our trespasses, forget our iniquities, remit our guilt for the sake of this Holy Sacrifice. Bless our souls, our bodies, our spirits, our hearts, our eyes, our understandings, our thoughts and our intentions, that with a pure heart we dare without fear to call Your Father who are in heaven and say, “Our Father...”\nفهرس صلوات القسم المقدسة\nصلاة القسمة\nالخولاجي\nقسمة قسمة تُقال كل يوم 29 من الشهر القبطي\n\n"}]}];

// ============ Coptic transliteration → real Coptic letters ============
const TMAP = {
  'a':'ⲁ','b':'ⲃ','g':'ⲅ','d':'ⲇ','e':'ⲉ','6':'ⲋ','z':'ⲍ',
  'h':'ⲏ',':':'ⲑ','i':'ⲓ','k':'ⲕ','l':'ⲗ','m':'ⲙ','n':'ⲛ',
  'j':'ⲝ','o':'ⲟ','p':'ⲡ','r':'ⲣ','c':'ⲥ','t':'ⲧ','u':'ⲩ',
  'f':'ⲫ','x':'ⲭ','y':'ⲯ','w':'ⲱ',
  ']':'ϣ',"'":'ϫ',';':'ϯ','q':'ϥ','v':'ϥ',
  'A':'ⲁ','B':'ⲃ','G':'ⲅ','D':'ⲇ','E':'ⲉ','Z':'ⲍ',
  'H':'ⲏ','I':'ⲓ','K':'ⲕ','L':'ⲗ','M':'ⲙ','N':'ⲛ',
  'O':'ⲟ','P':'ⲡ','R':'ⲣ','C':'ⲥ','T':'ⲧ','U':'ⲩ',
  'F':'ⲫ','X':'ⲭ','Y':'ⲯ','W':'ⲱ','Q':'ϥ','V':'ϥ',
  'J':'ϫ','3':'ⲏ','5':'ⲋ','2':'ⲋ','0':'ⲟ',
};

function toCopticScript(s) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if ('`~\\'.includes(ch)) continue; // connectors/diacritics: skip
    if (ch === '@' || ch === '>' || ch === '_') { out += ' '; continue; }
    if (ch === '=' ) { out += '\u0304'; continue; } // macron
    if (TMAP[ch]) { out += TMAP[ch]; continue; }
    if (ch === ' ' || ch === '\n' || ch === '.' || ch === ',' || ch === ':') { out += ch; continue; }
    // digits / unknowns: skip silently
  }
  return out.replace(/  +/g,' ').trim();
}

// ============ language detection ============
const EW = new Set(('the of and to us we is be in for our you your thy thou o lord god have mercy amen with who that his him he all from by on as are not but this those they them their let may shall unto art thee thine hast hath was were it its at an a or so then after said show which when now ever forever holy spirit son father saints deliver forgive grant give make my me').split(' '));
const LABEL_RE = /^(the\s+)?(priest|people|deacon|congregation|reader|bishop|choir|celebrant|pilaoc|pricbuteroc|pi`precbuteroc)\s*[:\s]*$/i;
const COP_MARK = /[`@\\~>{}|=]/;

// Arabic text that looks like Coptic transliteration (القبطي بالعربي)
// Lines that are Arabic script but sound like Coptic words
const CPA_INDICATORS = ['إيليسون','إيماس','بينيوت','إيفنوتي','إفنوتي','ماريف','نيفي','إنتي','بيكران','بين شويس','إخرستوس','إيسوس','إثؤواب','إممون','آريتين','إنجوس','تيكميت','شوبي','نيمان','إثليسيس','ميطانيا','نيخوم','إمموك'];

function isCPA(line) {
  // Contains Arabic script but has Coptic phonetics
  if (!/[\u0600-\u06FF]/.test(line)) return false;
  return CPA_INDICATORS.some(w => line.includes(w));
}

function langOf(line) {
  const l = line.trim();
  if (!l || l.startsWith('[if ')) return null;
  
  // Starts with ** → secondary language line
  const isStar = l.startsWith('**');
  const t = isStar ? l.slice(2).trim() : l;
  const isRubric = l.startsWith('**') && /^[\u0600-\u06FF]/.test(t);
  
  // Arabic script
  if (/[\u0600-\u06FF]/.test(t)) {
    if (isCPA(t)) return {lang:'cpa', rubric:false, orig:t};
    return {lang:'ar', rubric:isRubric, orig:t};
  }
  
  // Latin script
  if (!isStar && LABEL_RE.test(t)) return {lang:'label', rubric:false, orig:t};
  const words = t.toLowerCase().match(/[a-z]+/g) || [];
  if (!words.length) return {lang:'cop', rubric:false, orig:t};
  const enRatio = words.filter(w=>EW.has(w)).length / words.length;
  const hasCopMark = COP_MARK.test(t);
  if (enRatio >= 0.15 && !hasCopMark) return {lang:'en', rubric:false, orig:t};
  if (hasCopMark || enRatio < 0.08) return {lang:'cop', rubric:false, orig:t};
  if (words.length >= 4 && enRatio >= 0.08) return {lang:'en', rubric:false, orig:t};
  return {lang:'cop', rubric:false, orig:t};
}

// ============ state ============
let curLangs = ['ar','cpa','cop','en']; // default: show all
try {
  const s = JSON.parse(localStorage.getItem('kholagyLangs4') || 'null');
  if (Array.isArray(s) && s.length) curLangs = s;
} catch(e){}

const hourEl = document.getElementById('hour');
const prayerEl = document.getElementById('prayer');
const textEl = document.getElementById('text');

function fillHours() {
  hourEl.innerHTML = KHOLAGY_DATA.map((h,i)=>`<option value="${i}">${h.n}</option>`).join('');
  fillPrayers();
}

function fillPrayers() {
  const h = KHOLAGY_DATA[+hourEl.value];
  if (!h) return;
  prayerEl.innerHTML = h.p.map((p,i)=>`<option value="${i}">${p.n}</option>`).join('');
  showText();
}

function showText() {
  const h = KHOLAGY_DATA[+hourEl.value];
  if (!h) return;
  const p = h.p[+prayerEl.value];
  textEl.innerHTML = '';
  if (!p || !p.t.trim()) {
    textEl.innerHTML = '<div id="empty">لا يوجد نص لهذه الصلاة.</div>';
    return;
  }
  
  let count = 0;
  const lines = p.t.split('\n');
  
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const stripped = raw.trim();
    if (!stripped) continue;
    
    const info = langOf(stripped);
    if (!info) continue;
    
    const {lang, rubric, orig} = info;
    
    // Check visibility
    const show = (lang === 'label')
      ? (curLangs.includes('en') || curLangs.includes('cop'))
      : curLangs.includes(lang);
    if (!show) continue;
    
    const d = document.createElement('div');
    d.className = 'ln ' + lang + (rubric ? ' rubric' : '');
    d.textContent = (lang === 'cop') ? toCopticScript(orig) : orig;
    textEl.appendChild(d);
    count++;
    
    // Add separator between language blocks for readability
    // peek next visible line
  }
  
  if (!count) {
    textEl.innerHTML = '<div id="empty">لا يوجد نص بهذه اللغة في هذه الصلاة.</div>';
  }
}

function toggleLang(l) {
  const i = curLangs.indexOf(l);
  if (i >= 0) {
    if (curLangs.length === 1) return; // keep at least one
    curLangs.splice(i, 1);
  } else {
    curLangs.push(l);
  }
  try { localStorage.setItem('kholagyLangs4', JSON.stringify(curLangs)); } catch(e){}
  applyLangButtons();
  showText();
}

function applyLangButtons() {
  document.querySelectorAll('#langs button').forEach(b => {
    b.classList.toggle('active', curLangs.includes(b.dataset.lang));
  });
}

document.querySelectorAll('#langs button').forEach(b => b.onclick = () => toggleLang(b.dataset.lang));
hourEl.onchange = () => fillPrayers();
prayerEl.onchange = () => showText();

fillHours();
applyLangButtons();
</script>
