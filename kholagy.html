<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخولاجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Coptic&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#141f73; --blue:#3447a0; --orange:#f08030;
  --bg:#fafafa; --text:#1a1a1a; --card:#fff;
  --border:#d0d8f0; --rubric:#b05000;
  --cop-color:#2244aa; --cpa-color:#127a6a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e0f1a;--text:#e0e0ee;--card:#181924;--border:#2a3060;--rubric:#e08040;--cop-color:#8fa2ff;--cpa-color:#4fd1b8;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:"Traditional Arabic","Amiri","Noto Naskh Arabic",serif;font-size:18px;}
header{background:var(--navy);color:#fff;padding:14px 18px;font-size:20px;font-weight:bold;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
header span{flex:1;}
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 40px;}
.langs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.langs button{flex:1;min-width:100px;height:44px;border:2px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;transition:all .15s;}
.langs button.active{background:var(--blue);color:#fff;border-color:var(--orange);}
.selrow{display:flex;gap:8px;margin-bottom:8px;}
select{flex:1;height:52px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:16px;padding:0 10px;background:var(--card);color:var(--text);}
#text{margin-top:16px;line-height:2.2;font-size:21px;}
.ln{margin:2px 0;}
.ln.ar{direction:rtl;text-align:right;}
.ln.en{direction:ltr;text-align:left;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.9;color:#334;}
@media(prefers-color-scheme:dark){.ln.en{color:#b8c0d8;}}
.ln.cop{direction:ltr;text-align:left;color:var(--cop-color);font-size:21px;font-family:'Noto Sans Coptic','Segoe UI Historic','Segoe UI Symbol',serif;}
.ln.cpa{direction:rtl;text-align:right;color:var(--cpa-color);}
.ln.rubric{font-size:16px;opacity:.85;color:var(--rubric);}
.ln.label{direction:ltr;text-align:left;font-size:15px;opacity:.7;font-style:italic;}
.sep{height:1px;background:var(--border);margin:6px 0;opacity:.4;}
#empty{color:var(--rubric);font-size:16px;padding:10px 0;}
</style>
</head>
<body>
<header><span>الخولاجي</span></header>
<div class="wrap">
  <div class="langs" id="langs">
    <button data-lang="ar">عربي</button>
    <button data-lang="cpa">قبطي بالعربي</button>
    <button data-lang="cop">قبطي</button>
    <button data-lang="en">English</button>
  </div>
  <div class="selrow"><select id="hour"></select></div>
  <div class="selrow"><select id="prayer"></select></div>
  <div id="text"></div>
</div>

 في بخور عشية\n(أيها المسيح إلهنا رجاء خلاصنا الذي حياتنا مخفية فيك من قبل قيامتك المقدسة من الأموات نشكرك يا سيدنا مقدمين لك أيضًا الآن صلواتنا المسائية إذ بلغنا غروب الشمس ونحن عالمون أن ليس أحد نقيًا من خطية أمامك نطلب إليك يا محب البشر ان تستنشق طلباتنا التي نقدمها لك مع البخور مثل ذبيحة نوح وسامحنا لكل خطية أو كل توان صنعناها بإرادتنا او بغير إرادتنا وأسترنا من سهام إبليس وأواجع الجسد ولنستحق أن نكمل صلوات الليل بحاسة متيقظة مجدًا لك ولأبيك الصالح والروح القدس المحيي المساوي لك الآن وكل أوان وإلى دهر الدهور آمين\".\nوفي صلاة بخور باكر يقول الكاهن هذه الأوشية بدل السابقة:\n(يا الله الذي قبلَ إليه قرابين هابيل الصديق وذبيحة نوح وإبراهيم وبخور هارون وزكريا)\nإبروس إيف إكستاسى إيبرتيس ثيسياس إيمون إبروس فيرون طون.\nصلوا من أجل ذبيحتنا والذين قدموها\nثم يكمل الكاهن\n(إقبل إليك هذا البخور من أيدينا نحن الخطاة رائحة بخور غفرانا لخطاينا مع بقية شعبك لأنك مبارك ومملوء مجدًا إسمك القدوس أيها الآب والإبن والروح القدس الآن وكل اوان وإلى دهر الدهور آمين\"\nثمن يبخر الكاهن حول المذبح ويطوف ثلاث دورات ويقول الأواشي الثلاث الصغار ثم ينزل أمام باب الهيكل ويعطي ثلاث أياد بخور شرقًا وفي كل مرة يخضع برأسه يقول\n(اليد الأولي) نسجد لك أيها المسيح أبيك الصالح والروح القدس لأنك أتيت وخلصتنا\n(وفي اليد الثانية) وأنا مثل كثرة رحمتك أدخل بيتك وأسجد نحو هيكلك المقدس\n(وفي اليد الثالثة) أمام الملائكة أرتل لك وأسجد نحو هيكلك المقدس\nثم يبخر لجهة بحري لأجل السيدة العذراء قائلًا \" نعطيك السلام مع جبرائيل الملاك قائلين : السلام لك يا ممتلئة نعمة الرب معك \"\nثم يبخر إلى جهة الغرب ويقول \"السلام ليوحنا بن زكريا وسادتي الآباء الرسل وصفوف الشهداء وجميع القديسين \"\nثم يبخر إلى جهة قللي ويقول\" السلام ليوحنا بن زكريا السلام للكاهن ابن الكاهن\"\nثم يبخر إلى جهة الشرق ويقول\" فلنسجد لمخلصنا محب البشر الصالح لأنه تراءف علينا أتي وخلصنا\"\n(وفي أثناء ذلك يقول الشعب أرباع الناقوس).\nيا لله الذي قبل إليه قرابين هابيل الصديق وذبيحة نوح وإبراهيم وبخور هرون وزكريا\n** F5 f3`eta42wp `ero4 `nni dwron `nte `Abel pi`0m3i : nem 50vci`a `nte Nw`e nem abraam : nempi`c0oinov4i : `nte `A`arwn nem zaxariac.\n** `Pr he beginning; our holy fathers, the archbishops, our fathers the bishops, our fathers the hegumens, our fathers the priests, our brethren the deacons, our fathers the monks, and our fathers the laymen, and for the full repose of Christians. That Christ our God may repose all their souls in the paradise of joy, and we too, accord mercy unto us, and forgive us our sins.\n** Twbh `ejen nenio] nem nen`cnyou `etau`enkot au`mton `mmwou qen `vnah] mP=,=c icjen `p`eneh@ nenio] `e;ouab `n`ar,y`epickopoc ke nenio] `n`epickopoc@ nenio] `nhygoumenoc ke nenio] `m`precbuteroc nem nen`cnyou `ndi`akwn@ nenio] `mmona,oc@ ke nenio] `nla`ikoc@ nem `ehryi ejen ]anapaucic tyrc `nte ni`,ricti`anoc. Hina `nte P=,=c pennou] ]`mton `nnou'u,y tyrou qen piparadicoc `nte `pounof@ `anon de hwn `ntef`er pinai neman@ `ntef,a nennobi nan `ebol.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nتفضل يا ربُ نيح نفوسَهم جميعاً في حضن آبائنا القديسين، إبراهيمَ و اسحقَ و يعقوبَ. عُلهُم في موضعِ خضرة علي ماءِ الراحةِ في فردوسِ النعيمِ. الموضع الذي هرب منه الحزنُ والكآبةُ والتنهدُ في نوِر قديسيك. أقم أجسادهم في اليوم الذي رسمته كمواعيدِكَ الحقيقية غير الكاذبة.\n** Graciously, O Lord, repose all their souls in the bosom of our holy fathers Abraham, Isaac and Jacob, sustain them in a green pasture, by the water of rest in the paradise of joy. The place out of which grief, sorrow and groaning have fled away, in the light of Your saints. Raise up their bodies also, on the Day which You have appointed, according to Your true promises, which are without lie.\n** Arikataxioin `P=o=c ma`mton `nnou'u,y tyrou qen kenf `nnenio] e;ouab Abraam nem Icaak nem Iakwb. Sanousou qen ouma `n`,loy@ hijen `vmwou `nte `pemton@ qen piparadicoc `nte `pounof. Pima `etafvwt `ebol `nqytf `nje pi`mkah `nhyt nem ]lupy nem pifi`ahom@ qen `vouwini `nte ny =e=;=u `ntak. Ek`etounoc `ntoukecarx qen pi`ehoou `etak;asf@ kata nek`epaggeli`a `mmyi ouoh `natme;nouj.\nهب لهم خيرات مواعيدك، ما لم تره عينٌ ولم تسمع به أذنٌ، ولم يخطر علي قلبِ بشرٍ. ما أعددته يا الله لمحبي اسمِكَ القدوسِ.\n** Grant them the good things of Your promises, that which an eye has not seen nor ear heard, neither have come upon the heart of man; the things which You, O God, have prepared for those who love Your holy name.\n** Ek`eer,arizec;e `nwou `nni`aga;on `nte nek`epaggeli`a@ ny `ete `mpe bal nau `erwou@ oude `mpe masj co;mou@ oude `mpou`i `e`hryi `ejen `phyt `nrwmi Ny etakcebtwtou V] `nny e;mei `mpekran `e;ouab. Je `mmon mou sop `nnek`ebiaik alla ououwteb `ebol pe.\nلأنه لا يكون موتٌ لعبيدك، بل هو انتقالٌ. وان كان لحقهم توانٍ، أو تفريطٌ كبشرٍ، وقد لبسوا جسداً. وسكنوا في هذا العالم. فأنت كصالح ومحب البشر، اللهم تفضل عبيدك المسيحيين الأرثوذكسيين الذين في المسكونة كلها، من مشارق الشمس إلي مغارِبها، ومن الشمال إلي الجنوب.\n** For there is no death for Your servants, but a departure. Even if any negligence or heedlessness has overtaken them as men, since they were clothed in flesh and dwelt in this world. O God, as the Good One and Lover of Mankind, graciously accord, O Lord—Your servants, the Orthodox Christians who are in the whole world, from sunrise to sunset and from north to south.\n** Icje de ouon oumet`amelyc [i `erwou@ ie oumetat]`h;yf hwc rwmi `eauervorin `noucarx ouoh auswpi qen paikocomoc. `N;ok de hwc `aga;oc ouoh `mmairwmi V] arikataxioin `P=o=c `nek`ebiaik `n,ricti`anoc `nor;odoxoc etqen ]oikomeny tyrc@ icjen nima `nsai `nte `vry sa nefma `nhwtp nem icjen pemhyt sa `vryc.\nكلَّ واحدٍ باسمِه وكلَّ واحدةٍ باسمها، يا ربُ نيحهم، واغفر لهم. فإنه ليس أحدٌ طاهراً من دنس، ولو كانت حياتُه يومًا واحدًا علي الأرضِ.\n** Each one according to his name and each one according to her name, O Lord repose and forgive them. For no one is pure and without blemish even though his life on earth be a single day.\n** Piouai piouai kata pefran nem ]ou`i ]ou`i kata pecran@ kuri`e ma`mton nwou ,w `nwou `ebol. Je `mmon `hli efouab e;wleb oude kan ouehoou nouwt pe nefwnq hijen pikahi.\nأما هم يا ربُ الذين أخذت نفوسَهم، نيحهم وليستحقوا ملكو والطرق المسلوكه أو الجو أو السالكين بكل نوع، كل أحد بكل موضع،\n** Priest:\n** And those who intend to travel anywhere, straighten all their ways, whether by sea, rivers, lakes, roads, [air] or those who are traveling by any other means, everyone anywhere.\n** Ie nye;meu`i `ese qen mai niben@ coutwn noumwit tyrou@ `ite `ebol hiten `viom@ ie niiarwou@ ie nilumny@ ie nimwit `mmosi (ie nimwit) ie eu`iri `mpoujinmosi `nry] niben.\nردهم الى ميناء هادئة، ميناء الخلاص. تفضل إصحبهم فى الإقلاع، وإصحبهم فى المسير.\n** Lead them into a haven of calm, a haven of safety. Graciously accompany them in their departure and be their companion in their travel.\n** Ouon niben etqen mai niben ma`tvwou `eqoun `eoulumyn `njamy@ `eoulumyn `nte pioujai. Arikataxioin `ari`svyr `n`s[yr nem `svyr `mmosi nemwou.\nردهم الى منازلهم بالفرح فرحين، وبالعافية معافين. إشترك فى العمل مع عبيدك فى كل عمل صالح. ونحن أيضاً يا رب غربتنا التى فى هذا العمر، إحفظها بغير مضرة ولا عاصف ولا قلق الى الانقضاء.\n** Bring them back to their own, rejoicing with joy and safe in security. In work, be a partner with Your servants in every good deed. As for us, O Lord, keep our sojourn in this life without harm, without storm, and undisturbed to the end.\n** Myitou `eny`ete nouou qen ourasi eurasi@ qen outoujo eutoujyout. Ari`svyr `nerhwb nem nek`ebiaik qen hwb niben `n`aga;on. Anon de hwn `P=o=c tenmetrem`njwili etqen paibioc vai@ `areh `eroc `nateblaby nat,imwn `nat`s;orter sa `ebol.\n** Twbh `ejen nenio] nem nen`cnyou `etause `e`psemmo@ ie nye;meu`i `ese qen mai niben@ coutwn noumwit tyrou@ `ite `ebol hiten `viom ie niiarwou ie nilumny ie nimwit `mmosi@ (ie piayr) ie eu`iri `mpoujinmosi `nry] niben@ hina `nte P=,=c pennou] tac;wou `eny`ete nouou `mma`nswni qen ouhiryny@ `ntef,a nennobi nan `ebol.\n** Tovhe-jennen-yoti nem nen-esneio etav-she epshemmo ieni-ethmev-e eshe khen mai niven, soton no-moit teero, e-te evol heten efiom, ieni-iaro-oo, ie-nilemne ie ni-moit emmoshe, (ie pi-a-er) ie ev-ere empo-jenmoshee enriti niven, hina ent Pekhrestos pennouti tas-thoo-o enee-ete no-oo emma-enshoni khen o-herini, entef-qa nennovi nan evol.\nيكمل الكاهن\nبالنعمة والرأفات\nثم يقول أوشية المسافرين\nبالين أو مارين تيهو إى إفنوتى\nبى بانطوكراطور إفيوت إم بين\nشويس أووه بيننوتى اووه بين سوتير إيسوس بى إخرستوس تين تيهو أووه تين طفه إنتيك ميت آغاثوس بى\nماى رومى، آرى إفميفئى إبشويس إن نينوتى نيم نين إسنيو إيطاف شى إى إبشيممو\nوأيضًا فلنسأل الله\nضابط الكل أبا ربنا\nوإلهنا ومخلصنا يسوع\nالمسيح نسأل ونطلب\nمن صلاحك يا محب\nالبشر أذكر يا رب\nآباءنا وإخوتنا المسافرين.\nيقول الشماس\nطفه إيجين نينيوتى نيم نين إسنيو\nإيطاف شى إى إبشيممويى نى إيثميفئى إيشى خين ماى نيفين سوتون نومويت تيرو إيتى إيفول هيتين إفيوم يى نى ياروؤو يى نيليمنى يى نيمويت\nإمموش بى إفئيرى إمبو جنموشى إن ريتى نيفين هينا إنتى بى إخرستوس بيننوتى تاسطوؤو إى نيئتى نؤو إم ما إن شوبى خين أو هيرينى إنتيف كانين\nنوفى نان إيفول.\nأطلبوا عن آباءنا وأخوتنا\nالمسافرين الذين يضمرون\nالسفر في كل موضع لكي\nيسهل طرقهم أجمعين إن\nكان في البحر أو الأنهار أو\nالبحيرات او الرطق المسلوكة أو\nالمسافرين بكل نوع لكي\nالمسيح إلهنا يردهم إي\nمساكنهم سالمين ويغفر\nلنا خطايانا\nيقول الشعب\nكيريى إليسون\nيى نيئثميفئى إيشى خين ماى\nنيفين سوطون نومويت تيرو إيتى\nإيفول هيتين إفيوم بى نى ياروؤو يى نيليمنى يى نى مويت إمموشى يى\nإفئيرى إمبو جنموش. إنريتى نيفين\nأؤون نيفين إتخين ماى نيفين ما\nإتفوؤو إيخون إى أوليمين إنجامى\nإى أوليمين إنتى بى أوجاى\nأريكاطكسين أريئشفير إن إشتير نيم إشفير إم موشى نيموؤوميتو إنى إتى نوؤ خين أوراشى إفراشى خين أوتوجو إفتوجيوت. أرى إشفير إن إرهوب نيم نيك إيفيئيك خين هوب نيفين إن\nأغاثون أنون ذي هون إبشويس تين ميتريم إنجويلى إتخين باى فيوس\nفاى آريه إيروس إن أتفلافى\nإن أتشيمون إن أت إشتورتير\nشا إيفول\nوالذين يضمرون السفر في\nكل مكان سهل طرقهم\nأجمعين إن كان في البحر\nأو الأنهار أو البحيرات أو\nالطرق المسلوكة\nاو السالكين بكل نوع\nكل أحد بكل موضع\nردهم إلى ميناء هادئة ميناء\nالخلاص تفضل إصحبهم في\nالإقلاع وإصحبهم في المسير\nردهم إلى منازلهم بالفرح\nفرحين وبالعافية معافين\nإشترك في العمل مع عبيدك في\nكل عمل صالح ونحن أيضًا\nيا رب غربتنا في هذ fore the prayer of the Praxis. The priest stands before the sanctuary, looks towards the east and says\nأذكر يا رب صعائد وقرابين وشكر الذين يقربون.\n** Remember, O Lord, the sacrifices, the oblations and the thanksgivings of those who have offered.\n** Ari`vmeu`i ~P_ `nniquci`a ni`procvora ni]ep`\\mot `nte nh`etauer`procverin.\nكرامة ومجدا لاسمك القدوس.\n** Honour and glory unto Thine Holy Name.\n** Eoutai`o nem ou`wou `mpekran e/q/u/.\n** Pray for those who have care for the sacrifices, oblations, first fruits, oil, incense, coverings, reading books and altar vessels, that Christ our God reward them in the heavenly Jerusalem, and forgive us our sins.\n** The priest proceeds around the church with the incense\nالذكصولوجيات\nصلاة رفع بخور عشية وباكر\nالخولاجي\nآوشية المسافرين\n"},{"n":"9- الذكصولوجيات","t":"بالمسيح يسوع المسيح.\n** In Christ Jesus our Lord. Amen Alleluia.\n** Qen P=,=c I=y=c pen=o=c. Amyn =a=l.\nالسلام لك نسألك أيتها القديسة الممتلئة مجدا العذراء كل حين. والدة الاله أم المسيح.\n** Hail to you we ask you, O saint full of glory, the ever-Virgin, Mother of God Mother of Christ.\n** <ere ne ten]ho `ero@ `w ;y=e=;=u e;meh `n`wou@ `etoi `mPar;enoc `ncyou niben@ ]macnou] `;mau `mP=,=c.\n** Shere ne tenti-ho e-ro, o thi-ethowab ethmeh en-o-ou, etoi em-parthenos ensio niven, ti-masnouti ethmav empekhrestos.\nاصعدى صلاتنا الى ابنك الحبيب ليغفر لنا خطايانا.\n** Lift our prayers, to your beloved Son, that He may forgive us our sins.\n** Aniou`i `nte`proc`eu,y@ `e`pswi ha peSyri `mmenrit@ `ntef,a nennobi nan `ebol.\n** A-ni-owi enten epros evshi, e-epshoi ha pi-shiri emmenrit, entef ka nen-novi nan evol.\nالسلام للتى ولدت لنا النور الحقيقى المسيح الهنا العذراء القديسة.\n** Hail to her who gave birth, to the true Light, Christ our God, the saintly Virgin.\n** <ere ;y`etacmici nan@ `mpiOuwini `nta`vmyi@ P=,=c penNou]@ ]Par;enoc =e=;=u.\n** Shere thetas-misi nan, empi-ou-oyni enta efmi, Pekhrestos pennouti, ti-parthenos ethowab.\nاسألى الرب عنا ليصنع رحمة مع نفوسنا ويغفر لنا خطايانا.\n** Ask the Lord on our behalf, to have mercy upon our souls, and that He may forgive us our sins.\n** Ma]ho `mP=o=c `e`hryi `ejwn@ `ntef`er ounai nem nen'u,y@ `ntef,a nennobi nan `ebol.\n** Matiho emipshois, e-ehri eigown, entef-er-ou-nai nem nenip-sishi, entef ka nen-novi nan evol.\nأيتها العذراء مريم والدة الاله القديسة الشفيعة الأمينة لجنس البشر.\n** O Virgin Mary, the holy Mother of God, the trusted advocate, of the human race.\n** }Par;enoc Mariam@ ];eotokoc =e=;=u@ ]`proctatyc `etenhot@ `nte `pgenoc `nte ]metrwmi.\n** Ti-parthenos Mariam, ti-Theotokos ethowab, ti-epros-tatis e-ten-hoot, ente epgenos ente ti-metromi.\nاشفعى فينا أمام المسيح الذى ولدته لكى ينعم لنا بمغفرة خطايانا.\n** Intercede on our behalf, before Christ to whom you gave birth, that He may grant us, the forgiveness of our sins.\n** Ari`precbeuin `e`hryi ejwn@ nahren P=,=c@ vy`etar`ejvof@ hopwc `ntef`er`hmot nan@ `m`p,w `ebol `nte nennobi.\n** Arip-res-vevin e-ehri egon, nahren Pekhristos fet-ari egfof hopos, entef-er-ehmot nan, empi-kow evol ente nennovi.\nيقول الشعب\nكيريى إليسون\nيا رب إرحم\n** ثم يقول الشعب تسبحة الملائكة (بالأجبية المقدسة) في باكر أو تفصل يا رب (بالأجبية المقدسة) في عشية ثم قدوس الله وأبانا الذي فالسلام لك ثم يبدأون بمقدمة الذوكصولوجيات ثم الذوكصولوجيات كما يلي:\nالذكصولوجيات\nتقال هذه الأرباع دمجًا\nشيرى نى تين تى هو إرو: أوتى إثؤواب إثميه إن أواو: إتؤى إم بارثينوس إن سيو نيفين: تى ماسنوتى إثماف إم بى إخرستوس. آنيؤوى إنتين إبروس إفكى اإبشوى هابى شيرى. إم مينريت: إنتيف كانين نوفى نان إيفول. شيرى تى إيطاسميسى نان: إم بى أوينى إنتا إفمى: بى إخرستوس بين نوتى تى بارثينوس إثؤواب. ماتى هو إم إبشويس: إإرى إيجون: إنتيف إيرأو ناى نيم نين إبسيشى: إنتيف كانين نوفى نان إيفول.\nالسلام لك نسألك: أيتها\nالقديسة الممتلئة مجدًا العذراء\nكل حين والدة الإله أم المسيح\nأصعدي صلواتنا: إلى إبنك\nالحبيب ليغفر لنا خطايانا\nالسلام للتي ولدت لنا: النور\nالحقيقي المسيح إلهنا العذراء\nالقديسة إسألي\nالرب عنا ليصنع\nرحمة مع نفوسنا ويغفر لنا\nخطايانا\nتى بارثينوس ماريام: تى ثيئو توكوس. إثؤواب:تى إبروستاتيس إنتين هوت:إنتى إبجينوس إنتى تى ميت رومى. أرى\nإبريس فيفين إاهرى إيجون: ناهرين بخرستوس فيئيت ارى إجفوف:هوبوس إنتيف\nإرأهموت نان:إم بى كو إيفول إنتى نين نوفى.\nأيتها العذراء مريم\nوالدة الإله القديسة\nالشفيعة الأمينة لجنس البشر\nإشفعي فينا أمام المسيح\nالذي ولدتيه لكي ينعم لنا\nبمغفرة خطايانا\n** Introduction to the Doxologies\n** Hail to you. We ask you, O saint full of glory, the Ever-Virgin, Mother of God, the Mother of Christ.\n** Xere ne ten;\\o `ero> `w qh`eqouab eqme\\ `n`wou> `etoi `mparqenoc `nchou niben>macnou; `qmau `mPx/c/.\n** Offer our prayers, unto your beloved Son, that He may forgive us our sins.\n** Aniou`i `nten`proceuxh> `e`p]wi \\a pe]hri `mmenrit> `ntefxa nennobi nan `ebol.\n** Hail to whom have brought forth unto us the True Light, Christ our God, the saintly Virgin.\n** Xere qh`etacmici nan> `mpiouwini `nta`vmhi> Px/c/ Pennou;>parqenoc `eqouab.\n** Ma;\\o `m~P_ `e`\\rhi `ejwn> `nteferounai nem nenyuxh> `ntefxa nennobi nan `ebol.\n** O Virgin Mary, the holy Mother of God, the faithful advocate for all mankind.\n** :parqenoc Mari`a> ;qe`otokoc `eqouab>`proctathc `eten\\ot> `nte `pgenoc `nte ;metrwmi.\n** Intercede on our behalf, before Christ, whom you have brought forth, that He may grant us the forgiveness of our sins.\n** Ari`precbeuin `e`\\rhi `ejwn> na\\ren Px/c/ vhetare`jvof> \\opwc `ntefer`\\mot nan> `mpixw `ebol `nte nennobi.\nالسلام لك أيتها العذراء الملكة الحقيقية الحقانية. السلام لفخر جنسنا. ولدت لنا عمانوئيل.\n** Hail to you O Virgin, the very and true Queen. Hail to the pride of our race, who has borne to us Emmanuel.\n** Xere ne `w ;parqenoc> ;ourw `mmhi `n`alhqinh> xere `p]ou]ou `nte pengenoc> `are`jvo nan `nEmmanouhl.\nنسألك أن تذكرينا أيتها الشفيعة المؤتمنة أمام ربنا يسوع المسيح ليغفر لنا خطايانا.\n** We ask you to remember us, O our faithful advocate, before our Lord Jesus Christ, that He may forgive us our sins.\n** Ten;\\o `aripenmeui> `w ;`proctathc `eten\\ot> na\\ren Pen_ Ihcouc Pi`xrictoc> `ntefxa nennobi nan `ebol.\nمقدمه الدكصولوجيات\nصلاة رفع بخور عشية وباكر\nالخولاجي\nإوشية القرابين\n"},{"n":"10- مقدمة الذكصولوجيات","t":"السلام لك أيتها العذراء الملكة الحقيقية الحقانية. السلام لفخر جنسنا. ولدت لنا عمانوئيل.\n** Hail to you O Virgin, the very and true queen, hail to the pride of our race, who gave birth to Emmanuel.\n** <ere ne `w ]Par;enoc@ ]ourw `mmyi `n`aly;iny@ ,ere `psousou `nte pengenoc@ are`jvo nan `nEmmanouyl.\n** Shere ne oti-parthenos, ti-oro emmi en alitheeni, shere epsho-sho ente pengenos, ari egfo nan en Emmanoeel.\nنسألك أن تذكرينا أيتها الشفيعة المؤتمنة أمام ربنا يسوع المسيح ليغفر لنا خطايانا.\n** We ask you to remember us, O our trusted advocate, before our Lord Jesus Christ, that He may forgive us our sins.\n** Ten]ho `arepenmeu`i@ `w ]`proctatyc `etenhot@ nahren pen=o=c I=y=c P=,=c@ `ntef,a nennobi nan `ebol.\n** Ten-tiho ari-pen-mevi, oti-epros-tatis etenhot, nahren penshois Esos Pekhrestos, entef ka nen-novi nan evol.\nمقدمة الذوكصولوجيات\nشيرى نى أوتى بارثينوس: تى أورو إممى إن آليثينى: شيرى إبشوشو إنتى بين جينئوس: آرى إجفونان إن إممانوئيل. تينتى هو آرى بين ميفئى: أوتى إبروس تاتيس إيتين هوت: ناهرين بين شويس إيسوس بخرستوس: إنتيف كانين نوفى نان إيفول.\nالسلام لك أيتها العذراء الملكة\nالحقيقية الحقانية السلام لفخر\nجنسنا ولدت لنا عمانوئيل\nنسألك أن تذكرينا أيتها\nالشفيعة المؤتمنة أمام ربنا يسوع\nالمسيح ليغفر لنا خطايانا\nما يُقال للسيدة العذراء في رفع بخور عشية: زينة مريم في السموات | إيرى إبسول سيل إمماريام\nذكصولوجيه القديسه مريم\nصلاة رفع بخور عشية وباكر\nالخولاجي\nالذكصولوجيات\n"},{"n":"18- ذكصولوجية القديس أنبا إبرآم أسقف الفيوم","t":"المصباح المنير، في الفيوم وكل مصر، من أجل عجائبه وآياته، ومحبته للمسيح.\n** The shining lamp, in Fayoum and all Egypt, because of his signs and miracles, and his love for Christ.\n** Piqybc et`erouwini@ qen `Viom nem <ymi tyrc@ e;be nef`svyri nem nefmyni@ nem pefmei `mP=,=c.\nذو الإكليل الجوهر، صديق السواح، والأبرار والأنبياء، الذي تبع سيدنا.\n** He who has the expensive crown, the friend of the hermits, the righteous and the prophets, who follow our Master.\n** Va pi`,lom `mmargarityc@ pi`svyr `nni`ana,writyc@ nem ni`;myi nem ni`provytyc@ vy`etafmosi nca penDucpotyc.\nمثل أبونا أبرآم، أبونا إسحق ويعقوب، أنت أحببت الرحمة، وأكملت الوصايا.\n** Like our father Abraham, the father of Isaac and Jacob, you loved mercy, and completed the commandments.\n** `M`vry] `mpeniwt Abraam@ `viwt `nIcaak nem Iakwb@ akmenre ]me;na`yt@ ouoh akjwk `ebol `nni`entoly.\nتعودت الشهادة للحق، وتعودت الأكل مع الفقراء، بإتضاع عظيم، أحببت رعيتك.\n** You witnessed the truth, and you ate with the poor, with great humility, you loved your sheep.\n** Sakerme;re `n]me;myi@ sakouwm nem nihyki@ qen ounis] `n;ebio@ akmere nek`ecwou.\nمحبو الأرضيات، بحثوا عن أبنية جديدة، لكنك بنيت في السماء، أبنية سمائية.\n** The lovers of worldly things, sought for new buildings, but you built in heaven, many heavenly buildings.\n** Ny`e;mei `nna `pkahi@ aukw] `nca hanjinkwt `mberi@ alla akkwt qen nivyou`i@ `nnijinkwt `nna nivyou`i.\nكم هي عجائبك، شفيت المرضي، تنبأت بالعظائم، وأخرجت الشياطين.\n** How many are your miracles, you healed the sick, you prophesied great things, and you cast out demons.\n** Ou`yr ne nek`svyri@ aktal[o `nny`etswni@ aker`procvetevin `nni`svyri@ nidemwn akhitou `ebol.\nصرت لنا قدوة، بسيرتك الطاهرة، بالمحبة والرحمة، والشهادة للحق.\n** You became a type for us, by your pure ways, by love and mercy, and testimony of the truth.\n** Akswpi nan `noutupoc@ qen pekjinmosi ettoubyout@ qen ]`agapy nem ]me;nayt@ nem ]metme;re `n]me;myi.\nأطلب من الرب عنا، يا أبانا القديس الأنبا أبرآم، أسقف الفيوم، ليغفر لنا خطايانا.\n** Pray to the Lord on our behalf, our holy father Abba Abraam, the Bishop of Fayoum, that He may forgive us our sins.\n** Twbh `m`P=o=c `e`hryi `ejwn@ peniwt =e=;=u Abba Abraam@ pi`epickopoc `nte `Viom@ ` ntef ,a nennobi nan `ebol.\nللقديس الأنبا إبرام (أسقف الفيوم والجيزة)\nبي خيبس إت إر أى أوينى: خين إفيوم نيم كيمى تيرس: إثفى نيف إشفيرى نيم نيف مينى: نيم بيف مى إم بخرستوس.\nالمصباح المنر في الفيوم وكل مصر من أجل عجائبه وآياته ومحبته للمسيح\nفابى إكلوم إممار غاريتيس: بى إشفير إن نى أنا خوريتيس: نيم نى إثمى نيم نى إبروفيتيس: فيئيتاف موشى إنسا بين ريسبوتيس.\nذو الإكليل الجوهر صديق السواح والأبرار والأنبياء الذي تبع سيدنا المسيح\nإنثوف بى آفا آبرآم: بى إبيسكوبوس إنتى إفيوم: بى مان إسوؤ إنتا إفمى: بى ساخ إنتى نى أريتى.\nهو الأنبا إبرام أسقف الفيوم الراعي الحقيقي معلم الفضائل\nدافيد أفتامون خين أو ميثمى: جى أوؤنى أتف إم في إثناكاتى: إجين أوجوب نيم اوهيكى: أووه أفى تاهميف إنجى إفنوتى.\nداود أعلمنا بالحقيقة أنه طوبي للذي يتفهم في أمر المسكين والفقير والله يخلصه مثل أبونا إبراهيم أبو إسحق ويعقوب\nإم إفريتى إم بينيوت أفرآم: إفيوت إن إيسآك نيم ياكوب: أك مينرى تى ميثنائيت: أووه أكجوك إيفول إن نى إنتولى. شك إرميثرى إنتى ميثمى:\nأحببت الرحمة وأكملت الوصايا تعودت الشهادة للحق وتعودت الأكل مع الفقراء باتضاع عظيم أحببت رعيتك\nشاك أو أوم نيم نى هيكى: خين أونيشتى إن ثيفيوأك مينرىإن نيك إسوؤنىإثمىإن ناإبكاهى: أفكوتىإنساهان جين كوت إم فيرى: اللا أكوت خين نيفيؤوى:إن نى جين كوت إن انيفيوؤي.\nمحبوا الأرضيات بحثوا عن أبنية جديدة لكنك بنيت في السماء أبنية سمائية\nأؤ إرنى نيك إشفيرى: أك طالتشو إن نى إتشونى: أك إر إبروفيتيفين إن نى إشفيرى: نى ريمون أك هيتؤ إيفول.\nكم هي عجائبك شفيت المرضي وتنبأت بالعظائم وأخرجت الشياطين\nأكشوبى نان إن أوتيبوس: خين بيك جين موشى إتوميثنا إيت: نيم تى ميت ميثرى إن تى ميثمى.\nطوفه إم إبشويس إإهرى إيجون: بينيوت إثؤواب آفا ابرآم: بى إبيسكوبوس إنتى إفيوم: إنتيف كانين نوفى نان إيفول.\nذكصولوجية أنبا تكلا هيمانوت\nصلاة رفع بخور عشية وباكر\nالخولاجي\nذكصولوجية الشماس استفانوس\n"},{"n":"19- الذكصولوجيات – ذكصولوجية القديس تكلا هيمانوت الحبشي (بي إبنفما إم باراكليتون / الروح المعزي)","t":"1- بي إبنفما إم باراكليتون: إيتاف إي إبيسيت إفولخين إتفيه: إي جين إفيوت بيماكاريوس: بي آجيوس تكلا هيمانوت\n2- خين بي إهووف إم ماه شومت: إنتى بيف جين ميسي إت إسمارووت: ايف أوش إيفول جي أوواي بي: إف أوت نيم إبشيري نيم بي إبنفما إف أوواب\n3- أوويب إيجين بيف ميت آلو: آفموه إفول خين بى ابنفما إفؤوواب: أوه ني آنجيلوس إنتيه إتفيه: ناف إرخيفي إيه إهري إجوف\n4- ميخائيل إب أرخون إن نا نيفيئوي: إيفكي نيماف إنسيو نيفين: كاتا إفريتي إتافجوس: إنجي دافيد خين بي إبسالموس\n5- آبيخريستوس أوونه ناك ايفول: أووه أفتيناك إم بيرشيشي: بيسونه نيم بي فول إفول: إمفريتي إن نيف آبوستولوس\n6- آكشوبي إنوو ابوستولوس: إفسوتب إن إيسوس بيخريستوس: آرشي إريوس إن ني إيثا أوش: إفيوت إنتيه نيموناخوس\n7- إفهولج إنجي بيكران آفشوبي: خين نينرون نيم بيريم إفافش: جى فتي إمببي آجيوس: تكلا هيمانوت شين خيت خارون\n8- توفه إم ابشويس إي إهري إيجون: بي أبوستولوس إيف افش: بي آجيوس تكلا هيمانوت: إنتيفكي نين نوفي نان إيفول.\n1- الروح المعزي: لما نزل من السماء: على الطوباوي: القديس تكلا هيمانوت\n2- في اليوم الثالث: لميلاده المبارك: صرخ قائلًا: واحد هو الآب والإبن والروح القدس\n3- ومنذ طفوليته إمتلأ: من الروح القدس: وملائكة السماء: كانت تظلل عليه\n4- ميخائيل رئيس السمائيين: كائن معه كل حين: كما قال: داود في المزمور\n5- والمسيح ظهر لك: وأعطاك سلطان: الربط والحل: كمثل رُسُله\n6- وصرت رسولًا: مُختارًا ليسوع المسيح: رئيس كهنة للأحباش: وأبتً للرهبان\n7- صار إسمك حلوٌ: في أفواهنا وأفواه الأحباش: بقولنا يا إله القديس: تكلا هيمانوت ترأف علينا\n8- إطلب من الرب عن: يا رسول الأحباش: القديس تكلا هيمانوت: ويغفر لنا خطايانا\n** \\ Pi=p=n=a `mparakl3ton : eta4`I `epec3t `ebol qen `tfe : `egen `fiwt `mmakarioc : piajioc 0ekla hvmanot> .\n** \\ Qen pi`ehoov `mmah =j : `nte pe4ginmici et`cmarwovt : a4w2 `ebol ge ovai pe : `Fiwt nem `P23ri nem Pi=p=n=a e=0=v .\n** \\ Ovoh icgen te4met alov : A4moh `ebol qen Pi=p=n=a =e=0=v : ovoh niajjeloc `nte `tfe : niaverq3ibi `e`hr3i `egw4 .\n** \\ Mixa3l `parxwn `nnanif3ov`I : e4x3 nema4 `nc3ov niben : kata `fr35 eta4goc : `nge ==d=a=d qen piyalmoc .\n** \\ A P=x=c ovwnh nak `ebol : ovoh a45nak `mpier2i2i : `mpiconh nem pibwl `ebol : `m`fr35 `nne4apoctoloc .\n** \\ Ak2wpi `novapoctoloc : E4cotp `nI=3=c P=x=c piarx3erevc `nni`e0av2 : `fiwt `nte nimonaxoc .\n** \\ 4holg `nge pekran a42wpi : Qen nenrwn nem na ni `E0av2 : ge F5 `mpiajioc : 0ekla Hvmanot 2enh3t qaron .\n** \\ T=w : piapoctoloc `nni E0av2 : piajioc 0ekla Hvmanot : `n=t=e=4 . . .\n1- الروح المعزي\nعلى الطوباوي\n2- في اليوم الثالث\nصرخ قائلًا\n3- ومنذ طفوليته إمتلأ\nوملائكة السماء\n4- ميخائيل رئيس السمائيين\nكما قال\n5- والمسيح ظهر لك\nالربط والحل\n6- وصرت رسولًا\nرئيس كهنة للأحباش\n7- صار إسمك حلوٌ\nبقولنا يا إله القديس\n8- إطلب من الرب عن\nالقديس تكلا هيمانوت\nلما نزل من السماء\nالقديس تكلا هيمانوت\nلميلاده المبارك\nواحد هو الآب والإبن والروح القدس\nمن الروح القدس\nكانت تظلل عليه\nكائن معه كل حين\nداود في المزمور\nوأعطاك سلطان\nكمثل رُسُله\nمُختارًا ليسوع المسيح\nوأبتً للرهبان\nفي أفواهنا وأفواه الأحباش\nتكلا هيمانوت ترأف علينا\nيا رسول الأحباش\nويغفر لنا خطايانا\nالروح المعزى لما نزل من السماء على الطوباوى القديس تكلا هيمانوت.\n** The Spirit of comfort, came down from heaven, upon the blessed father, Saint Takla Haymanout.\n** Pi`Pneuma `mParaklyton@ `etaf`i `epecyt `ebol qen `tve@ `ejen `viwt pimakarioc@ pi`agioc :ekla Humanoc.\nفى اليوم الثالث لميلاده المبارك. صرخ قائلا واحد هو الآب والابن والروح القدس.\n** On the third day, of his blessed birth, he proclaimed \"One is the Father, the Son and the Holy Spirit.\"\n** Qen pi`ehoou `mmah somt (=g)@ `nte pefjinmici et`cmarwout@ efws `ebol je ouai pe@ `Viwt nem `pSyri nem pi`Pneuma =e=;=u.\nومنذ طفوليته امتلأ من الروح القدس وملائكة السماء كانت تظلل عليه.\n** And from his childhood, he was filled with the Holy Spirit, and the angels of heaven, overshadowed him.\n** Ouoh icjen tefmet`alou@ afmoh `ebol qen pi`Pneuma =e=;=u@ ouoh ni`ageloc `nte `tve@ nau erqyibi `e`hryi `ejwf.\nميخائيل رئيس السمائيين كائن معه كل حين. كما قال داود فى المزمور.\n** Michael the head of the heavenly, was always with him, as was said by, David in the Psalms.\n** Mi,ayl `par,wn `nna nivyou`i@ ef,y nemaf `ncyou niben@ kata `v`ry] `etafjoc@ `nje Dauid qen pi'almoc.\nوالمسيح ظهر لك وأعطاك سلطان الربط والحل كمثل رسله.\n** Christ was revealed to you, and He gave you the authority, to loosen and to bind, like the Apostles.\n** AP=,=c ouwnh nak `ebol@ ouoh af] nak `mpi`ersisi@ piconh nem pibwl `ebol@ `m`vry] `nnef`apoctoloc.\nوصرت رسولا مختارا ليسوع المسيح رئيس كهنة للأحباش وأبا للرهبان.\n** You became an apostle, chosen by Jesus Christ, the Patriarch of the Ethiopians, the father of the monks.\n** Akswpi `nou`apoctoloc@ `fcwtp `nIeroucalym P=,=c@ ar,y`ereuc `nni`E;afs@ `viwt `nte nimona,oc.\nصار اسمك حلو فى أفواهنا وأفواه الأحباش بقولنا يااله القديس تكلا هيمانوت تراءف علينا.\n** Your name became sweet, on our lips and the Ethiopians, O God of Saint Takla, the Ethiopian have pity upon us.\n** `Fholj `nje pekran afswpi@ qen nenrwn nem niremE;aus@ je V] `mpi`agioc@ :ekla Humanoc senhyt qaron.\nأطلب من الرب عنا يا رسول الأحباش القديس تكلا هيمانوت ليغفر..\n** Pray to the Lord on our behalf, O Ethiopian Apostle, Saint Takla Haymanout, that He may forgive us our sins.\n** Twbh `mP=o=c `e`hryi `ejwn@ pi`apoctoloc `nniremE;aus@ pi`agioc :ekla Humanoc@ `ntef ,a nennobi nan `ebol.\nالصلوات أثناء وبعد ختام الذكسولوجيات\nصلاة رفع بخور عشية وباكر\nالخولاجي\nذكصولوجية انبا ابرام\n"},{"n":"20- الصلوات بعد ختام الذكصولوجيات","t":"** وأثناء وبعد ختام الذكصولوجيات للسيدة العذراء:\n** يصعد الكاهن إلى الهيكل برجله اليمني ويقبل المذبح ويرشم درج البخور رشمًا واحدًا بمثال الصليب وهو يقول (مجدًا وإكرامًا، إكرامًا ومجدًا. إلخ.) ويضع يد بخور واحدة ويبخر فوق المذبح ثلاث أياد إلى الشرق قائلًا\nفي اليد الأولي\n(نسجد لك أيها المسيح مع أبيك الصالح والروح القدس لأنك أتيت وخلصتنا.)\nفي اليد الثانية\nوأنا كمثل كثرة رحمتك أدخل بيتك وأسجد نحو هيكلك المقدس\nفي اليد الثالثة\nأمام الملائكة أرتل لك وأسجد نحو هيكلك المقدس\nثم يدور حول المذبح دورة واحدة وينزل أمام باب الهيكل فيعطي البخور نحو الشرق ثلاث دفعات ثم يبخر لجهة بحري لأجل السيدة العذراء قائلًا:\n\" نعطيك السلام مع جبرائيل الملاك قائلين: السلام لك يا ممتلئة نعمة الرب معك\"\nثم يبخر إلى جهة الغرب قائلًا:\n\"السلام لمصاف الملائكة وسادتي الآباء الرسل وصفوف الشهداء وجميع القديسين \"\nثم يبخر إلى جهة قبليًا قائلًا:\n\" السلام ليوحنا بن زكريا السلام للكاهن ابن الكاهن\"\nثم يبخر شرقيًا قائلًا:\n\" فلنسجد لمخلصنا محب البشر الصالح لأنه تراءف علينا أتي وخلصنا\"\nبالرجال من بحري باب الهيكل ويطوف يمينًا وهو يقول في بخور عشية: بركة بخور المساء \"بركته المقدسة فلتكن معنا آمين\" وفي بخور باكر يقول \"بركة بخور باكر\" بركته المقدسة فلتكن معنا آمين\" وعند خروجه إلى الخورس الثاني في الكنيسة يقول هذه الخمسة أرباع الخشوعية تمجيدًا للسيد المسيح الذي صلب عنا وقدانا بدمه الكريم\nيسوع المسيح هو هو أمسًا واليوم وإلى الأبد بأقنوم واحد نسجد له ونمجده\nثم يبخر شرقًا ويقول: هذا الذي أصعد ذاته ذبيحة مقبولة على الصليب عن خلاص العالم.\n** ثم يبخر بحريًا ويقول: فاشتمه أبوه الصالح وقت المساء على الجلجثه.\nثم يبخر غربًا ويقول: فتح باب الفردوس ورد أدم إلى رئاسته مرة أخري.\nثم يبخر قبليًا ويقول: من قبل صليبه وقيامته المقدسة رد الإنسان مرة أخري إلى الفردوس\nثم يصعد إلى الهيكل وهو يقول سر الرجعة:\n** (يا الله الذي قبل إليه اعتراف اللص على الصليب المكرم إقبل عليك إعتراف شعبك وإغفر لهم جميع خطاياهم من أجل إسمك القدوس الذي دعي علينا كرحمتك يا رب ولا كخطايانا)\n** ثم يدور حول المذبح دورة واحدة ويخرج أمام باب الهيكل ثلاث أياد وللجهات الأربع كما سبق وللآب البطريرك أو الأسقف ولأخوته الكهنة وكذلك لناحية الشمامسة ثم يعطي المجمرة للشماس ويسجد ثم يقف بجانب المذبح ووجهه إلى الغرب حتى نهاية الذوكصولوجيات.\nكرحمتك يا رب، و ليس كخطايانا.\n** According to Your mercey, O Lord, and not according to our sins.\n** Kata to `eleoc cou Kurie@ ke my kata tac `amartiac `ymwn.\nاللهم إرحمنا / افنوتى ناينان\nصلاة رفع بخور عشية وباكر\nالخولاجي\nذكصولوجية أنبا تكلا هيمانوت\n"},{"n":"21- اللهم ارحمنا / إفنوتي ناي نان","t":"ملاحظة: في لقان عيد الرسل تُقال \"كيرياليسون\" 10 مرات بالكبير بالناقوس في ختام هذا اللحن.\nوننتظر قيامة الأموات وحياة الدهر الآتي. أمين.\n** We look for the resurrection of the dead, and the life of the age to come. Amen.\n** Tenjoust `ebol qa`thy `n]anactacic `nte nirefmwout nem piwnq `nte piewn e;nyou amyn.\nالكاهن:\nاللهم إرحمنا، قرر لنا رحمة تراءف علينا.\n** Priest:\n** O God, have mercy upon us, settle mercy upon us, have compassion upon us-\n** Pi`precbuteroc@\n** V] nai nan ;es ounai `eron senhyt qaron.\nالشعب:\nآمين.\n** People:\n** Amen.\n** Pilaoc@\n** Amyn.\nواسمعنا.\n** hear us-\n** Cwtem `eron.\nوبار d have not heard them.\n** Je \\anmh] `m`provhthc nem \\an`qmhi> auer`epiqumin `enau `enh`etetencwtem `erwou ouo\\ `mpoucwtem.\nأما أنتم فطوبى لأعينكم لأنها تبصر ولآذانكم لأنها تسمع.\n** But blessed are your eyes for they see, and your ears for they hear.”\n** ~Nqwten de `wouni`atou `nnetenbal je cenau> nem netenma]j je cecwtem.\nفلنستحق أن نسمع ونعمل بأناجيلك المقدسة بطلبات قديسيك.\n** May we be worth to hear and to act [according to] Thine Holy Gospels, through the prayers of Thy saits.\n** Marener`pem`p]a `ncwtem ouo\\ `e`iri `nnekeuaggelion `eqouab> 'en nitwb\\ `nte nh`eqouab `ntak.\nصلوا من أجل الإنجيل المقدس.\n** Pray for the Holy Gospel.\n** Proceu[acqe `uper tou `agiou euaggeliou.\nيا رب ارحم.\n** Lord have mercy.\n** Kuri`e `ele`hcon.\n** Priest\nأذكر أيضا يا سيدنا كل الذين أمرونا أن نذكرهم فى تضرعاتنا وطلباتنا التى نرفعها إليك أيها الرب إلهنا.\n** Remember also, O our Master, all those who have bedden us to remember them in our supplications and prayers which we offer up unto Thee, O Lord our God.\n** Ari`vmeu`i de on pennhb> `nouon niben `etau\\on\\en nan `eerpoumeu`i> 'en nen;\\o nem nentwb\\ `eten`iri `mmwou `e`p]wi \\arok ~P_ Pennou;.\nالذين سبقوا فرقدوا نيحهم، المرضى اشفهم.\n** Those who have already fallen asleep, repose them. Those who are sick heal them.\n** Nh`etauer]orp `n`enkot ma`mton nwou> nhet]wni matalswou.\nلأنك أنت هو حياتنا كلنا وخلاصنا كلنا ورجاؤنا كلنا وشفاؤنا كلنا وقيامتنا كلنا.\n** For Thou art the life of us all, the salvation of us all, the hope of us all, the healing of us all and resurrection of us all.\n** Je `nqok gar pe penwn' throu> nem penoujai throu> nem ten\\elpic throu> nem pentalso throu> nem ten`anactacic thren.\nوأنت الذى نرسل لك إلى فوق المجد والإكرام والسجود مع أبيك الصالح والروح القدس المحيى المساوى لك.\n** And Thou art He to whom we ascribe the glory, the honour, and the worship, together with Thy Good Father and the Holy Spirit, the Life-Giver, Who is of One Essence with Thee.\n** Ouo\\ `nqok petenouwrp nak `e`p]wi ak. 5nov nem `nc3ov...\nمقدمة الإنجيل\nصلاة رفع بخور عشية وباكر\nالخولاجي\nطلبه الصوم الكبير و صوم يونان\n"},{"n":"24- مقدمة الإنجيل","t":"** ثم يقرأ المزمور قبطيًا وفي هذه الأثناء يصعد الكاهن إلى الهيكل ويرشم درج البخور بمثال الصليب رشمًا واحدًا ويضع يد بخور في المجمرة ويطوف حول المذبح وأمامه الشماس بالبشارة وهو يقول صلاة سمعان الشيخ:\n(الأن يا سيد تطلق عبدك بسلام كقولك لأن عيني قد أبصرتا خلاصك الذي أعددته قدام جميع الشعوب نور إعلان للأمم ومجدًا لشعبك إسرائيل)\nوبعد انتهاء الدورة ينزل من الهيكل ويعطي البخور للإنجيل وهو يقول:\nأو أوشت إم بى إف آنجيليون إنتى بين شويس إيسوس بى إخرستوس إبشيرى\nإم إفنوتى إتؤنخ بى أو أو ناف شا\nإينيه.\nأسجدوا لإنجيل\nربنا يسوع المسيح\nابن الله الحي له المجد إلى\nالأبد\nثم يقدم البشارة للكهنة فيقبلونها ويعطي المجمرة للكاهن الشريك إذا وجد ويتقدم هو إلى المنجلية لقراءة الإنجيل قبطيًا او المطران إذا كان حاضرًا فيقول الإنجيل قبطيًا على باب الهيكل ووجهه إلى الغرب بينما يبخر الكاهن الخادم للإنجيل ويخاطب الشماس الشعب قائلًا:\nقفوا بخوف الله لسماع الإنجيل المقدس.\n** Stand with the fear of God. Let us hear the Holy Gospel.\n** Cta;yte meta vobou :eou `akoucwmen tou `agiou eu`aggeliou.\n** Sta-thee-te meta fovo Theo, ako-somen to agio evan-geleio.\nإسطاثيتى ميتا فوفو ثيئو آكو سومين طو اجيو إيف آنجيليو\nقفوا بخوف الله لسماع الإنجيل\nالمقدس\nويقول الكاهن\nإف إزمارؤوت إنجى فيئثنيو خين\nإفران إم إبشويس إنتى نى جوم\nكيريى إفلو جيصون إك طو كاطا\n(...)آجيو إيف آنجيليون\nطوآناغوسما.\nمبارك الآتي باسم رب\nالقوات يا رب\nبارك الفصل من\nالإنجيل المقدس من\nثم يعطى الكاهن الشريك البخور للإنجيل وهو يقول سرًا مع قارئ الإنجيل:\nتي أرشي إم بي إيف آنجيليون إثؤواب\n(كاطا ماتثيئون) يي (كاطا ماركون)\nيي (كاطا لوكان) يي (كاطا يوأنن)\nآجيو إف آنجيليو طوآناغنوسما\nبدء الإنجيل المقدس من\n(متى) او من (مرقس) او\n(من لوقا) أو من (يوحنا)\nفصل من الإنجيل المقدس\nيقول الشعب\nذوكساسي كيريى\nالمجد لك يا رب\nالشماس:\nمبارك الآتى باسم الرب. ربنا والهنا\nومخلصنا كلنا. ربنا يسوع المسيح ابن الله\nالحي. الذي له المجد الدائم...إلى الأبد. أمين.\n** Deacon:\n** Blessed is He who comes in the Name of the Lord,\n** our Lord, God, Savior, and King of us all, Jesus Christ the\n** Son of the Living God, for whom is glory forever...\n** Amen.\nمرد الانجيل\nصلاة رفع بخور عشية وباكر\nالخولاجي\nاوشيه الإنجيل\n"},{"n":"25- مرد الإنجيل","t":"ويكمل الكاهن قائلا\nبين شويس أووه بين نوتى أووه بين سوتير اووه بين أورو تيرين إيسوس بى إخرستوس إبشيرى إم إفنوتى إت أونخ بى أوؤو ناف شا اينيه.\nربنا وإلهنا ومخلصنا و\nملكنا كلنا يسوع المسيح\nابن الله الحي له المجد إلى\nالأبد\nيقف الكاهن متجهًا إلى الشرق ويعطي البخور أمام الهيكل ثلاث أياد وهو يقول مع القارئ (بين شويس.. إلخ.) ويلتفت لأخوته الكهنة والشعب جميعًا وهو يقول:\nإنثوتين ذى أوؤونياتو إن نيتين فال\nجى سيناف نيم نيتين ماشج جى\nسيسوتيم مارين إير إب إم إبشا إنسوتيم أووه إى إيرى إن نيك إيف آنجيليون إثؤواب خين نى طفه إنتى نى\nإثؤواب إنتاك.\nأما انتم فطوبي لأعينكم\nلأنها تبصر ولآذانكم لأنها\nتسمع فلنستحق أن\nنسمع ونعمل باناجيلك\nالمقدسة بطلبات\nقديسيك\nوفي هذه الأثناء يستمر قارئ الإنجيل (قبطيًا) بصوت عال وعندما ينتهي من القراءة يقول:\nبى أوؤو فا بيننوتى بى شا إينيه إنتى بى إينيه آمين\nالمجد لإلهنا إلى أبد الآبدين\nيقول الشعب\nذوكساسي كيريى\nالمجد لك يا رب\nثم يعطي البخور للإنجيل ثلاث أياد قائلًا (وأنت الذي ينبغي لك التمجيد بصوت واحد من كل أحد المجد والإكرام والعظمة والسجود لبهائك مع أبيك الصالح والروح القدس المحيي المساوي لك الآن وكل اوان) ثم يقرأ الشماس الإنجيل عربيًا بعد ذلك فيقول (ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح ابن الله الحي له المجد دائمًا) وفي نهايته يقولون (والمجد لله دائمًا).\nأوشيه السلامه\nصلاة رفع بخور عشية وباكر\nالخولاجي\nمقدمة الأنجيل\n"},{"n":"26- أوشية السلامة","t":"الكاهن:\nصلوا\n** Priest:\n** Pray.\n** Pi`precbuteroc@\n** Slyl.\nالشماس:\nللصلاة قفوا.\n** Deacon:\n** Stand up for prayer.\n** Pidiakwn@\n** Epi `proceu,y `cta;yte.\nالسلام لجميعكم.\n** Peace be with you all.\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nوأيضاً فلنسألُ الله الضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Again, let us ask God the Pantocrator, لصليب المحيي بالسؤالات والطلبات التي تصنعها عنا كل حين سيدتنا وملكتنا كلنا والدة الإله القديسة الطاهرة مريم والثلاثة العظماء المنيرون الأطهار ميخائيل وغبريال وروفائيل والأربعة الحيوانات غير المتجسدين والأربعة والعشرون قسيسًا وكل الطغمات السمائية والقديس يوحنا المعمدان والمائة والأربعة والأربعين ألفًا وسادتي الآباء الرسل والثلاثة فتية القديسون والقديس إستفانوس وناظر الإله الإنجيلي مرقس الرسول القديس والشهيد والقديس جورجيوس والقديس تادرس وفيلوباتير مركوريوس والقديس أبامينا وكل مصاف الشهداء وأبونا الصديق العظيم الأنبا أنطونيوس والبار أنبا بولا والثلاثة أنبا مقارات القديسون وأبونا أنبا يوحنا وأبونا أنبا بيشوي وأبونا أنبا بولا الطموهي وأبوانا الرومانيان مكسيموس ودوماديوس وأبونا انبا موسي والقديس إيسيذوروس والتسعة والأربعون شهيدًا وكل مصاف لباس الصليب والأبرار والصديقون وجميع العذاري الحكيمات وملاك هذا اليوم المبارك (وفي وقت القداس يقول ملاك هذه الذبيحة المباركة ويذكر اسم صاحب البيعة) وبركة والدة الإله القديسة الطاهرة مريم أولًا وآخرًا (وإذا كان يوم الأحد يقول:وبركة يوم الأحد الذي لمخلصنا الصالح) بركتهم المقدسة ونعمتهم وقوتهم وهبتهم ومحبتهم ومعونتهم فلتكن معنا كلنا إلى الآبد آمين)\nأو يقول البركة المختصرة\n(الله يترأف علينا ويباركنا ويظهر وجهه علينا ويرحمنا يا رب خلص شعبك بارك ميراثك إرعهم وإرفعهم إلى الأبد أرفع شأن المسيحيين بقوة الصليب المحيي بسؤالات وطلبات سيدتنا كلنا والدة الإله القديسة مريم والثلاثة المنيرين الأطهار ميخائيل وغبريال وروفائيل وجميع مصاف الملائكة وكل الطغمات السمائية وصلوات رؤساء الآباء والنبياء الرسل والشهداء وكل مصاف لباس الصليب الأبرار والصديقين وملاك هذا اليوم المبارك وملاك هذه الكنيسة المباركة وبركة العذراء مريم أولًا وآخرًا بركتهم المقدسة.نعمتهم.قوتهم.هبتهم ومحبتهم ومعونتهم فلتكن معنا كلنا إلى الآبد آمين)\nثم يقول الكاهن\nبى إخرستوس بين نوتى\nأيها المسيح إلهنا\nآمين يكون\nآمين إس إيشوبى\n← تحليل الابن الأول (صلاة خضوع للابن):\nنعم يا رب الذي إعطانا السلطان أن ندوس الحيات والعقارب وكل قوة العدو\n** Ce P=o=c P=o=c f3`eta45 `mpier2i2i nan : `ehwmi `egen niho4 nem ni`sl3 : nem `egen 5gom t3rc `nte pigagi.\nاسحق رؤوسه تحت أقدامنا سريعًا وبدد عنا كل معق الآن يا سيدنا من قبل رسلك الأطهار أنعمت على الذين يعملون في الكهنوت في كل زمان في كنيستك المقدسة أن يغفروا الخطايا على الأرض ويربطوا ويحلوا كل رباطات الظلم. الآن أيضًا نسأل ونطلب من صلاحك يا محب البشر عن عبيدك آبائي وأخواتي وضعفي هؤلاء المنحنين برؤوسهم أمام مجدك المقدس أرزقنا رحمتك واقطع عنا كل رباطات خطايانا وأن كنا قد أخطانا إليك في شيء بعلم أو بغير علم أو بجزع القلب أو بالقول أو بالفعل أو بالفكر أو بصغر النفس فأنت أيها السيد العارف بضعف البشر كصالح ومحب البشر. اللهم أنعم علينا بغفران خطايانا. (ثم يرشم على المعترف ويقول) باركنا. طهرنا. حاللنا (وحالل عبدك فلان) املآنا من مخافتك وقومنا إلى أرادتك الصالحة لأنك أنت هو إلهنا يليق بك المجد والكرامة.....\" إلخ.\nصلاة الختام والبركة والانصراف\nصلاة رفع بخور عشية وباكر\nالخولاجي\nأوشية الأجتماعات\n"},{"n":"34- صلاة الختام و البركة والانصراف: لحن ختام الاجتماعات: الليلويا ذوكصابتري","t":"بيان بختام الصلاة في مناسبات مختلفة\n(الليلويا ذوكصابتري كي نين تين أوش إيقول إن جو إمموس جي أوبين شويس إيسوس بخرسوتس (في أيام الزراعة 10 بابة: 10 طوبة يقال)\n** إزمو إيني سيتي نيم ني سيم ماري بيك ناي نيم تيك هيريني أوى إن سوفت إم بيك لاؤس. (وفي أيم الأثمار 11 طوبة: 11 بؤونة يقال) إزمو إي ني آإير إنتي إتفي ماري (وفي أيام النهر 12 بؤونة: 9 بابة يقال) إمزا إي ني موؤ إم إفيارو ماري (وفي حضور الأب البطريرك أو الأسقف يقال)\n** أك تشى إت خاريس إم مويسيس. تى ميت أوؤيب إنتى ميلشيصايديك. تى ميت خللوى إنتى ياكوب. بى نوج إن أهى إنتى ماتوصالا. بى كاتى إتسوتب إنتى دافيد. تى صوفيا إنتيه سولومون. بى إبنفما إمباراكليتون في ايطافئى إيجين نى ابوسطولوس. إبشويس إفيه آريه إبؤنخ نيم إبطاهو إيراتف يإم بين يوت إتطايوت إن أرشى إيريفيس بابا آفا(...) نيم بينيوت إن إبسكوبوس آقا (...) إفنوتى إنتيه إتفيه إيفيه إيطاجروف هيجين بيف إثرونوس إن هان ميش إنرومبى نيم هان ثيو إن هيريني كون إنتيف ثيفيو إن نيف جاجى تيرو سابيسيت إن نيف إتشالفج إن كوليم طفه إبخرستوس إإهرى إيجون إنتيف كانين نوفى نان إيفول خين او هيرينى كاطا بيف نيشتى إن ناى سوتي.\n** يقول الكاهن:\n((يا ملك السلام اعطنا سلامك قرر لنا سلامك واغفر خطايانا لأن لك القوة والمجد والبركة والعزة إلى الأبد آمين) ثم (أبانا الذي في السموات)\nثم يقبل الشعب الصليب والإنجيل ويصرفهم الكاهن بسلام وهو يقول: (محبة الله الآب ونعمة الإبن الوحيد ربنا وإلهنا ومخصلنا يسوع المسيح وشركة وعطية الروح القدس تكون مع جميعكم إمضوا بسلام الرب معكم جميعًا) فيقول الشعب (ومع روحك أيضًا).\nأما في رفع بخور باكر فلا يصرفهم بل يبدأون في رشم ملابس الخدمة استعدادًا للقداس.\nختام الاجتماعات عيد القيامة\nأمين الليلويا : ذوكصاباتري : كيه إيو : كيه أجيو بنيفما تي: كيه نين كيه أ إي : كيه إستووس إأوناس طون إ أونون أمين تين أوش إفول إنجو إمموس جي : أوبين تشويس إيسوس بيخريستوس .\nاب أوورو انتى اب أوأوو: أفطونف ايفول خين ني ايثموؤت خين بي ايهوأوو امماه شومت .\nسوتي إممون أووه ناي نان : كيري إليسون كيري إليسون : كيري إفلوجيسون أمين إسمو إروي إسمو إروي إس تي ميطانيا كو ني إفول جو إمبي إسموو .\nآمين هلليلويا . المجد للآب والإبن والروح القدس، الآن وكل أوان وإلي دهر الدهور . آمين .\nنصرخ قائلين: يا ربنا يسوع المسيح .\nملك المجد، قام من الأموات في اليوم الثالث .\nخلصنا وإرحمنا . يا رب إرحم، يا رب إرحم، يا رب بارك آمين . باركوا عليّ، باركوا عليّ، ها مطانية، إغفروا لي، قُل البركة .\n** /`Am3n : =a=l Do7a Patri ke `Viw ke `Ajiw `Pnevmati : ke nvn ke `a`i ke ic tovc `e`wnac twn `e`wnwn . `Am3n : Ten`w2 `ebol engw `mmoc : ge `w penu I=3=c P=x=,=c .\n** /P`Ovro `nte `p`wov : a4twn4 `ebolqen n3`e0mw`ovt qen pi`eho`ov `mmah2omt .\n** /Cw5 `mmon ovoh nai nan : Kvrie `ele3con : Kvrie `ele3con : Kvrie evloj3con `am3n . `Cmov `eroi : `cmov `eroi : ic 5metanoia : ,w n3i `ebol : gw `mpi`cmov .\nأمين الليلويا : ذوكصاباتري : كيه إيو : كيه أجيو بنيفما تي\nآمين هلليلويا: المجد للآب والإبن والروح القدس\n** Am3n =al: Do7apatri ke viw ke ajiw `pnevmati :\nكي نين كي أ إي : كي إستوس إأوناس طون إ أونون أمين\nالآن وكل أوان و الى دهر الدهور آمين\n** Ke nvn ke ai ke ictovc `ewnac twn eovnon am3n.\nتين أوش إفول إنجو إمموس جي : أوبين تشويس إيسوس بيخريستوس\nنصرخ قائلين : ربنا يسوع المسيح\n** Tenw2 ebol engw `mmoc ge w Pensoic I=3c P=xc :\nبارك\nإسمو\n** `Cmov\n(ايام النيل من 12 بؤونه الى 9 بابة)\nني مؤو ام افيارو\n(ايام النيل من 12 بؤونه الى 9 بابة)\nمياه الأنهار د الكاهن إلى الهيكل ويمتحن نفسه روحيًا ليكون نقيًا داخلًا وخارجًا ويكون نظيف الجسم والملابس محترسًا ولم يذق طعامًا على الأقل تسع ساعات ويرشم التونية (بدلة الكهنوت) مع ملابس الشمامسة ثلاثة رشوم.\nثم يلبس الملابس الكهنوتية وهو يقول (مز 29) \"أعظمك يا رب\" ثم (مز 92) (الرب قد ملك لبس الجلالة) ثم يصافح أخوته الكهنة ويسألهم الصلاة من أجله ثم يصعد إلى الهيكل ويقبل المذبح ويحل الآنية من رباطها ويبدأ في فرش المذبح وهو يقول صلاة الاستعداد بينما الشعب مازال يرتل لحن البركة ثم يسجد الكاهن أمام الهيكل ويقف على يمين بابه ويبتدئ بتوزيع صلاة المزامير ففي أيام الآحاد بطول السنة تقال مزامير الساعتين الثالثة والسادسة معًا بإنجيلهما وقطعهما وأما في أيام الصوم الأربعاء والجمعة فتقال مزامير الساعة الثالثة بإنجيلهما وقطعهما وتليها مزامير الساعتين السادسة والتاسعة بإنجيلهما وقطعهما والمزامير التي يصليها الكاهن الخديم هي:\nفي الثالثة (يستجيب لك الرب) (أعظمك) (يا جميع الأمم صفقوا).\nفي السادسة (اللهم باسمك خلصني) (رضيت يا رب) (الرب قد ملك).\nفي التاسعة (سبحوا الرب) (قال الرب لربي) (آمنت).\n** وتختم المزامير بالسلام لك (الأجبية) ونعظمك (الأجبية) والأمانة (الأجبية) وكيريي إليسون (41) مرة باللحن وأثناء ذلك يغسل الكاهن يديه ثلاث دفعات وهو يقول في الدفعة الأولي (تنضح على بزوفاك فأطهر تغسلني فأبيض أكثر من الثلج) وفي الدفعة الثانية (تسمعني سرورًا وفرحًا فتبتهج عظامي المتواضعة) وفي الدفعة الثالثة (أغسل يدي بالنقاوة واطوف حول مذبحك يا رب كي أسمع صوت تسبيحك).\nالكاهن:\nيا حمل الله يا حامل خطية العالم، إسمعنا وإرحمنا واغفر لنا خطايانا.\n** Priest:\n** We ask You O Lamb of God who carries the sin of the world, hear us and have mercy on us, and forgive us our sins.\nالشعب:\nكيري لِيسون (41)\n(يا رب ارحم).\n** People:\n** Keria Leison (41)\n** (Lord have mercy.)\n** Pilaoc@\n** Kurie ele`ycon (=m=a).\nتقديم الحمل\nالقداس الباسيلي\nالخولاجي\nفهرس نص القداس الباسيلي\n"},{"n":"2- تقديم الحمل","t":"ثم ينشف يديه ويقف بباب الهيكل متجهًا إلى الغرب وبيده لفافة حرير ويقدم له الحمل وقارورة الأباركة aparxh فيستبرئ ذلك جيدًا ويقف الشماس على يمينه وبيده اليمني لفافة حرير وبيده اليسرى شمعة ويجعل يديه على شكل صليب.\n** وعندما يقدم الكاهن القارورة للشماس ليشمها يقول (جيد وكريم ومبارك) ثم يختار الكاهن الحمل الذي هو خبز التقدمة وقبل الاختيار يرشم الحمل والقارورة ثلاثة رشوم وهو يقول (خين إفران.. إف إزمارؤوت) بكمالها ثم يقول (ليختار الله له حملًا بلا عيب) وبعد اختيار الحمل يرشمه من القارورة وهو يقول (ثيسيا إن أو أوت) ثم باقي الحمل قائلًا (ثيسيا نيم بي إزمو ثيسيا إن آقرام ثيسيا إن إيسآك ثيسيا إن ياكوب) ثم الرشم الأخير على الحمل (ثيسيا إن ملشيصادق).\nثم يبل أطراف أصابعه اليمني ويحمل الحمل على يده اليسري ويمسحه على مثال العماد الطاهر وهو يقول (أعط يا رب) بكمالها من سر الاستعداد ثم يذكر من يريد أن يذكرة من الأحياء والراقدين ثم يلف الحمل بلفافة من الحرير ويضعها على رأسه وأمامه الصليب مائلًا قليلًا على مصال المسيح وهو حامل الصليب في الطريق إلى الجلجثة وكذلك الشماس يلف القارورة ويرفعها بيده خلف الكاهن ويمسك بيده الأخري شمعة ثم يقف الكاهن بباب الهيكل متجهًا للشعب ثم يقول:\nالكاهن:\nمجدا وإكراما إكراما ومجدا للثالوث القدوس الآب والإبن والروح القدس.\n** Priest:\n** Glory and honor, honor and glory to the All-holy Trinity, the Father and the Son and the Holy Spirit.\n** Pi`precbuteroc@\n** Ou`wou nem outai`o@ outai`o nem ou`wou@ `n]pan`agi`a `triac Viwt nem `pSyri nem pi`Pneuma `e;ouab.\nسلاما وبنياناً لكنيسة الله الواحدة الوحيدة المقدسة الجامعة الرسولية. آمين.\n** Peace and edification to the one, only, holy, Catholic, Apostolic Orthodox Church of God. Amen.\n** Ouhiryny nem oukw] `ejen ]ou`i `mmauatc `=e=;=u `nka;oliky `n`apoctoliky `nek`klycia `nte V]@ `amyn.\nأذكر يا رب الذين قدموا لك هذه القرابين والذين قدمت عنهم، والذين قدمت بواسطتهم أعطهم كلهم الأجر السمائي.\n** Remember, O Lord, those who have brought to You these gifts and those on whose behalf they have been brought, and those by whom they have been brought. Give them all the heavenly reward.\n** Ari`vmeu`i P=o=c `nny`etau`ini nak `eqoun `nnai dwron@ nem ny`etau`enou `ejwou@nem ny`etau`enou `ebolhitotou@ moi nwou tyrou `mpibe,e pi`ebolqen nivyou`i.\nأوأو أو نيم أو طايو أوطايو نيم\nأوأو أو إنتى بان آجيا إترياس\nإفيوت نيم إبشيرى نيم بى إبنيفما\nإثؤواب أو هيرينى نيم او كوت إيجين\nتى اوى إممافاتس إثؤواب إن\nكاثوليكى إن أبوسطوليكى إن\nإككليسيا إنتى إفنوتى آمين.\nآرى إفميفئى إبشويس إن نى إيطاف\nإينى ناك إيخون إن ناى ذورون. نيم\nنى إيطاف إينو إيجوؤو نيم نى إيطاف\nإينو إيفول هيطوطو. موى نؤو\nتيرو إمبى فيكى بى إيفول خين\nنى فيئوى.\nمجدًا وإكرامًا\nإكرامًا ومجدًا للثالوث\nالأقدس الآب والإبن\nوالروح القدس سلامًا\nوبنيانًا لكنيسة الله الواحدة\nالوحيدة المقدسة الجامعة\nالرسولية آمين\nأذكر يا رب الذين\nقدموا لك هذه القرابين\nوالذين قدمت عنهم\nوالذين قدمت بواسطتهم\nاعطهم كلهم الجر\nالسمائي\nمرد تقديم الحمل\nالقداس الباسيلي\nالخولاجي\nالاستعداد وصلاة المزامير\n"},{"n":"3- مرد تقديم الحمل","t":"ثم يطوف الكاهن وخلفه الشماس الذي يحمل القارورة حول المذبح وأمامه الشماس يحمل أبريق الماء وشمعة موقدة يدور للخلف معطيًا وجهه للحمل رمزًا ليوحنا المعمدان الذي يهيئ الطريق أمام الرب وأثناء ذلك يقول الشماس:\nالشماس:\nصلوا من أجل هذه القرابين المقدسة الكريمة وتقدماتنا والذين قدموها. يا رب ارحم.\n** Deacon:\n** Pray for these holy and Precious gifts, our sacrifices, and those who have brought them. Lord have mercy.\n** Pidiakwn@\n** Proceuxac;e `uper twn `agiwn timiwn dwron toutwn ke ;uciwn `ymwn ke procverontwn@ Kurie `ele`ycon.\nإبروس إفئكساستى إيبيرتون\nآجيون تيميون ذورون توطون\nكى ثيسيون إيمون كى إبروس فيرون\nطون. كيريى إليسون.\nصلوا من أجل هذه\nالقرابين المقدسة الكريمة\nوتقدماتنا والذين قدموها\nيا رب ارحم\nيقول الشعب في السبوت والآحاد وأيام الإفطار: هللويا فاي بيبي (لحن هذا هو اليوم الذي صنعه الرب)\nوفي أيام الأصوام (الأربعاء والجمعة) (يقولون): هلليلويا إن فكر الإنسان يعترف لك\nرشومات الحمل\nالقداس الباسيلي\nالخولاجي\nتقديم الحمل\n"},{"n":"4- رشومات الحمل","t":"الكاهن:\nباسم الآب والابن والروح القدس إله واحد. مبارك الله الآب ضابط الكل.آمين.\n** Priest:\n** In the name of the Father and the Son and the Holy Spirit, one God. Blessed be God the Father, the Pantocrator. Amen.\n** Pi`precbuteroc@\n** Qen `vran `m`Viwt nem `pSyri nem pi`Pneuma e;ouab ounou] `nouwt. `F`cmarwout `nje V] `Viwt piPantokratwr. Amyn.\nالشماس:\nآمين.\n** Deacon:\n** Amen.\n** Pidiakwn@\n** Amyn.\nمبارك ابنه الوحيد يسوع المسيح ربنا. آمين.\n** Blessed be His only-begotten Son, Jesus Christ our Lord. Amen.\n** `F`cmarwout `nje Pefmonogenyc `nSyri I=y=c P=,=c pen=o=c. `Amyn\nمبارك الروح القدس المعزي. آمين.\n** Blessed be the Holy Spirit, the Paraclete. Amen.\n** `F`cmarwout `nje pi`Pneuma =e=;=u `mParaklyton@ `amyn.\nثم يقف الكاهن أمام المذبح ووجهه نحو الشرق ويضع الحمل على يده اليسرى ويقربه للقارورة ويرشم قائلًا:\nخين إفران إم إفيوت نيم إبشيرى نيم\nبى إبنيفما إثؤواب أونوتى إن\nأوأوت إف إزماروؤوت إنجى\nإفنوتى إفيوت بي بانطوكرارطور آمين.\nباسم الآب والابن\nوالروح القدس إله واحد\nمبارك الله الآب ضابط\nالكل آمين\nيقول الشماس (آمين) ويرشم الكاهن ثانيًا ويقول\nإف إزماروؤت إنجى بيف مونوجينيس إنشيرى إيسوس\nبى إخرستوس بين شويس آمين.\nمبارك إبنه الوحيد يسوع\nالمسيح ربنا آمين\nيقول الشماس (آمين) ويرشم الكاهن ثالثًا ويقول\nإف إزماروؤت إنجى بي إبنيفما\nإثؤواب إمباراكليتون. آمين.\nمبارك الروح القدس\nالمعزي آمين\nثم يضع القربانة في الصينية وتحتها لفافة على أن تكون الثقوب الثلاثة في القربانة إلى اليمين ثم يكمل سرًا:\nأوأو او نيم أوطايو.. إلخ.\nمجدًا وإكرامًا.. إلخ.\nالكاهن:\nباسم الآب والابن والروح القدس إله واحد.\nمبارك الله الآب الضابط الكل. آمين.\nمبارك ابنه الوحيد يسوع المسيح ربنا. آمين.\nمبارك الروح القدس المعزي. آمين.\n** In the Name of the Father and the Son and the\n** Holy Spirit, one God.\n** Blessed be God the Father the Pantocrator. Amen.\n** Blessed be His Only-begotten Son Jesus Christ\n** our Lord. Amen.\n** Blessed be the Holy Spirit the Comforter. Amen.\nمجدًا وإكرامًا، إكرامًا ومجدًا للثالوث القدوس\nالآب والابن والروح القدس. الآن وكل أوان إلى\nدهر الدهور كلها. آمين.\n** Glory and Honor, Honor and Glory unto the Holy\n** Trinity, the Father, and the Son and the Holy Spirit.\n** Now and at all times and unto the age of all ages.\nالقداس الباسيلي\nالخولاجي\nمردات الشماس في التقديم\nمرد تقديم الحمل\n"},{"n":"5- مرد الشماس في تقديم الحمل: لحن واحد هو الآب القدوس","t":"الشماس:\nآمين.\nواحد هو الآب القدوس، واحد هو الابن القدوس، واحد هو الروح القدس. آمين. مبارك الرب الإله إلي الأبد. آمين.\n** Deacon:\n** Amen.\n** One is the holy Father, One is the holy Son, One is the holy Spirit. Amen. Blessed be the Lord God forever. Amen.\n** Pidiakwn@\n** `Amyn.\n** Ic Patyr `agioc@ ic `Uioc `agioc@ en `Pneuma `agion `amyn. Eulogitoc Kurioc` o :eoc ic touc `e`wnac `amyn.\nيا جميع الامم باركوا الرب. ولتباركه جميع الشعوب. لان رحمته ثبتت علينا. وحق الرب يدوم إلي الابد. آمين.هلليلويا.\n** Praise the Lord, all you nations, praise Him all you peoples, for His mercy is confirmed upon us, and the truth of the Lord endures forever. Amen. Alleluia.\n** Nye;noc tyrou `cmou `eP=o=c@ marou`cmou `erof `nje nilaoc tyrou@ je `apefnai tajro `e`hryi `ejwn@ ouoh ]me;myi `nte P=o=c sop sa`eneh@ `amyn `allyloui`a.\nالشعب:\nالمجد للآب والابن والروح القدس، الآن وكل اوان وإلي دهر الدهور. آمين. هلليلويا.\n** People:\n** Glory to the Father and to the Son and to the Holy Spirit, now and ever and unto the ages of the ages. Amen. Alleluia.\n** Pilaoc@\n** Doxa Patri ke Uiw ke `agiw `Pneumati@ ke nun ke `a`i ke ic touc `e`wnac twn `e`wnwn@ `amyn allylouia.\nوهنا يقول الشماس هذا المرد\nإسباتير آجيوس إس إيوس\nآجيوس. إن إبنيفما آجيون\nآمين. إيفلوجيطوس كيريوس\nأوثيئوس إسطوس إيئوناس\nآمين. نيئثنوس تيرو إزمو\nإبشويس. مارو إزمو إيروف\nإنجى نيلاؤس تيرو. جى\nآبيف ناى تاجرو إى إهرى\nإيجون اووه تى ميثمى إنتى\nإبشويس شوب إينيه آمين\nالليلويا.\nواحد هو الآب\nالقدوس واحد هو\nالابن القدوس واحد\nهو الروح القدس\nآمين مبارك الرب الإله\nإلى الأبد يا جميع الأمم\nباركوا الرب ولتباركه\nجميع الشعوب لأن\nرحمته ثبتت علينا و\nحق الرب يدوم إلى\nالآبد آمين هلليلويا\nأو يقول \"آمين إسباتير الكبيرة\"\nآمين. آمين. آمين.\nإسباتير آجيوس إس\nإيوس آجيوس إن إبنيفما\nآجيون آمين\nإس شوب نيماك إنجى تى\nأرشى خين إب إيهو أو\nإنتى تيك جوم خين\nإف أو أوينى إنتى نى\nإثؤواب إيفول خين إثنيجى\nخاجوف إمبى سيو إنتى\nهان أتو أويى آنوك آى\nجفوك آف أورك إنجى\nإبشويس أووه إن نيف أو أوم إن\nإهثيف جى إنثوك\nبى إف أويب\nجى إنثوك بى إف أويب شا إينيه كاتا إتتاكسيس إم ميلشيساديك. إبشويس\nسا أووى نام إمموك بنيوت إثؤواب\nبنيوت إثؤواب بنيوت إثؤواب إن\nأرشى إرفس بابا آفا (...)\nأفنوتى إنتى إتفى إيف إى تاجروف\nهيجين بيف إثرونوس إن هان ميش إنرومبى نيم هان سيو إن هيرينى كون إنتيف ثيفيو إن نيف جاجى تيرو\nسابيسيت إن نيف إتشالفج إنكوليم\nطفه إى بي إخرستوس إى إهرى\nإيجون إنتيف كانين نوفى نان إيفول خين\nأو هيرينى كاتا بيف نيشتى إنناى.\nآمين آمين آمين\nواحد هو الأب القدوس\nواحد هو الابن القدوس\nواحد هو الروح القدس\nمعك الرئاسة\nفييوم قوتك\nفي بهاء القديسين\nمن البطن قبل\nكوكب الصبح\nولدتك أقسم\nالرب ولن\nيندم إنك أنت\nالكاهن إلى\nالأبد على\nطقس ملكي\nالكاهن إلى الأبد على طقس\nملكي صادق الرب عن يمينك\nيا أبانا القديس يا أبانا\nالقديس يا أبانا القديس\nرئيس الكهنة البابا أنبا (...)\nإله السماء يثبته على\nكرسيه سنين عديدة\nوأزمنة سالمة\nويخضع أعداءه جميعًا\nتحت قدميه سريعًا\nأطلب من المسيح عنا\nليغفر لنا خطايانا بسلام\nكعظيم رحمته\n** ثم يصب الخمر في الكأس ويمزجه بقليل من الماء نحو الثلث ثم يصفي القارورة جيدًا ويعطيها للشماس على اللفافة بحيث تكون منكسة لإكمال تصفيتها ويقول سرًا (مجدًا وإكرامًا إلخ.) وفي هذه الأثناء\nيقول الشعب:\nذوكسابترى كى إيو كى آجيو\nإبنيفماتى. كى نين كى آإى كى\nإسطوس إى أوناس طون إى أونون\nآمين الليلويا.\nالمجد للآب والإبن\nوالروح القدس الآن\nوكل أوان وإلى دهر\nالدهور آمين هلليلويا\n(في رشومات الحمل)\n(يقول الشماس في الرشمين الأول الثاني: آمين) وفي الرشم الثالث، إما ان يقول:\nافلوجيتوس كيريوس اوثيه أوس إس طوس إيه أوناس آمين.\nنى اثنوس تيرو أزمو ايه أبشويس\nمارو ازمو ايروف انجيه نى لاؤس\nتيرو جيه أبيف ناى تاجروا ايه اهرى\nايجون أووه تى ميثمى انتيه ابشويس شوب شا ايه نيه آمين الليلويا\nآمين واحد هو الآب القدوس، واحد هو الابن القدوس، واحد هو الروح القدس آمين.\nمبارك الرب الإله إلى الأبد آمين.\nيا جميع الأمم* باركوا الرب، ولتباركه جميع الشعوب لأن رحمته ثبت علينا، وحق الرب يدوم إلى الأبد، آمين هلليلويا.\nوإما أن يقول:\nآمين إس باتير\nاجيوس إس\nإيوس اجيوس\nان ابنفما اجيون\nامين\nإس شوب نيماك انجيه تى أرشى\nخين إب إهوؤ انتيه تيك جوم خين\nاف أوؤينى انتيه نى اثؤواب: ايفول\nخين اثنيه جى خا جوف امبى سيو\nانتيه هان اطو اوى. انوك\nاى اجفوك\nاف أورك انجيه ابشويس أووه إن\nنيف أوؤم ان إهثيف جيه انثوك بيه\nاف اوويب شا إيه نيه. كاطا\nاتطاكسيس ام ميلشى سيه ديك\nبنيوت اثؤواب ان\nآرشى إى ريفس (3)\nبابا أفا........\nأفنوتى انتى اتفى اف إى\nطاجروف هى جين بيف اثرونوس ان\nهانميش انرومبى نيم هان سيو ان\nهيريني كون\nانتيف ثى فيو إن نيف جاجى\nتيرو صابى سيت ان نيف اتشالفج\nإن كوليم\nطوفه ايه بى اخرستوس اى\nإهرى ايجون انتيف كا نين نوفى\nنان إيفول. خين أو هيرينى كاطا\nبيف نيشتى ان ناى\nافلوجى طوس كيريوس\nاوثى اوس... نى\nاثنوس تيرو.....\nأمين واحد هو الآب\nالابن القدوس\nواحد هو الروح القدوس،\nمعك الرئاسة* في\nيوم قوتك في\nبهاء القديسين،\nولدتك.\nأقسم الرب\nولن يندم أنك انت\nالكاهن على طقس\nملكي صادق\nيا أبانا القديس\nرئيس*الكهنة البابا\nأنبا...**\nإله السماء يثبته\nعلى كرسيه سنين\nعديدة وأزمنة\nسالمة\nويخضع أعداءه\nجميعا تحت قديمه\nسريعا\nاطلب من المسيح\nعنا، ليغفر لنا\nخطايانا بسلام\nكعظيم رحمتك\nمبارك الرب\nالإله......\nيا جميع الأمم.\nواحد هو الآب القدوس، واحد هو الابن القدوس، واحد هو الروح القدوس.امين.\n** One is the Holy Father, one is the Holy Son,one is the Holy Spirit.Amen\n** Ic Patyr `agioc@ ic Uioc `agioc@ en Pneuma `agion@ `amyn.\n(او)\n** (OR)\nواحد هو الآب الكلي القدس، واحد هو الابن الكلي القدس، واحد هو الروح الكلي القدس.امين.\n** One is the All-Holy Father,One is the All-Holy Son, One is the All-Holy Spirit.Amen\n** Ic `o pan`agioc Patyr@ ic `o pan`agioc Uioc@ en to pan`agion `Pneuma@ `amyn\n"},{"n":"6- صلاة الشكر","t":"الكاهن:\nصلوا.\n** Priest:\n** Pray.\n** Pi`precbuteroc@\n** Slyl.\nالشماس:\nللصلاة قفوا.\n** Deacon:\n** Stand up for prayer.\n** Pidiakwn@\n** Epi `proceu,y `cta;yte.\nالسلام للكل.\n** Peace be with You all.\n** Iryny paci.\nالشعب:\nولروحك أيضًا.\n** People:\n** And with your spirit.\n** Pilaoc@\n** Ke tw `pneumati cou.\nفلنشكر صانع الخيرات الرحوم الله أبا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Let us give thanks to the Beneficent and Merciful God, the Father of our Lord, God, and Savior Jesus Christ.\n** Marensep`hmot `ntotf `mpiref`erpe;nnef ouoh `nnayt@ V] Viwt `mPen=o=c ouoh Pennou] ouoh pencwtyr I=y=c P=,=c.\nلأنه سترنا وأعاننا وحفظنا وقبلنا إليه. وشفق علينا وعضدنا وأتي بنا إلي هذه الساعة.\n** For He has covered us, helped us, guarded us, accepted us to Himself, spared us, supported us, and has brought us to this hour.\n** Je aferckepazin ejwn@ aferboy;in `eron@ af`areh `eron afsopten `erof af]`aco eron@\n** af]toten afenten sa `e`hryi `etai`ounou ;ai.\nهو أيضا فلنسأله أن يحفظنا في هذا اليوم المقدس، وكل أيام حياتنا بكل سلام، ضابط الكل الرب الهنا.\n** Let us also ask Him, the Lord our God, the Pantocrator, to guard us in all peace this holy day and all the days of our life.\n** `N;of onmaren]ho `erof hopwc `ntef`areh`eron@ qen pai`ehoou e;ouab vai nem ni`ehoou tyrou `nte penwnq@ qen hiryny niben@ `nje piPantokratwr P=o=c pennou].\n** Proceuxac;e.\nيا رب ارحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nأيها السيد الرب الاله ضابط الكل أبو ربنا وإلهنا ومخلصنا يسوع المسيح.\n** O Master, Lord; God the Pantocrator, the Father of our Lord, God, and Savior Jesus Christ.\n** `Vnyb P=o=c V] piPantokratwr@ `Viwt `mpen=o=c ouoh pennou] ouoh penCwtyr I=y=c P=,=c.\nنشكرك علي كل حال ومن أجل كل حال وفي كل حال. لأنك سترتنا وأعنتنا وحفظتنا وقبلتنا إليك وشفقت علينا وعضدتنا، وأتيت بنا إلي هذه الساعة.\n** we thank You for everything, concerning everything, and in everything.\n** For You have covered us, helped, us guarded us, accepted us to Yourself, spared us, supported us, and have brought us to this hour.\n** Tensep`hmot `ntotk kata hwb niben nem e;be hwb niben nem qen hwb niben.\n** Je akerckepazin `ejwn@ akerboy;in `eron@ ak`areh `eron@ aksopten `erok@ `ak]aco `eron@ ak]toten@ akenten sa `e`hryi `etaiounou ;ai.\nأطلبوا لكي يرحمنا الله، ويتراءف علينا، ويسمعنا، ويعيننا، ويقبل سؤالات وطلبات قديسيه منهم بالصلاح عنا في كل حين.\n** Pray that God may have mercy and compassion on us, hear us, help us and accept the supplications and prayers of His saints for that which is good on our behalf at all times.\n** Twbh hina `nte V] nai nan@ `ntefsenhyt qaron@ `ntefcwtem `eron@ `nteferboy;in `eron@ `ntef[i `nni]ho nem nitwbh `nte ny e;ouab `ntaf `ntotou `e`hryi `ejwn `epi`aga;on `ncyou niben.\nويجعلنا مستحقين أن ننال من شركة أسراره المقدسة المباركة، لمغفرة خطايانا.\n** And make us worthy to partake of the communion of His holy and blessed mysteries, for the remission of our sins.\n** `Ntefaiten `nem`psa e;ren[i `ebolqen ]koinwnia `nte nefmuctyrion =e=;=u@ e`t`cmarwout `epi,w `ebol `nte nennobi.\nمن اجل هذا نسأل ونطلب. من صلاحك يا محب البشر امنحنا أن نكمل هذا اليوم المقدس وكل أيام حياتنا، بكل سلام مع مخافتك.\n** Therefore, we ask and entreat Your goodness, O Lover of Mankind, grant us to complete this Holy day and all the days of our life, in all peace with Your fear.\n** E;be vai ten]ho ouohtentwbh `ntekmet`aga;oc pimairwmi@ myic nan e;renjwk `ebol `mpaike`ehoou e;ouab vai@ nem ni`ehoou tyrou `nte penwnq@ qen hiryny niben nem tekho].\nكل حسد وكل تجربة وكل فعل الشيطان ومؤامرة الناس الاشرار وقيام الاعداء الخفيين والظاهرين. انزعها عنا.\n** All envy, all temptation, all the work of Satan, the council of wicked men and the rising up of enemies, hidden and manifest, take them away from us.\n** `V;onoc niben@ piracmoc niben@ `energi`a niben `nte `pcatanac@ `pco[ni `nte hanrwmi `euhwou nem `ptwnf `e`pswi `nte hanjaji ny `ethyp nem ny `e;ouwnh `ebol. Alitou `ebol haron.\nوعن سائر شعبك. وعن هذه الكنيسة. وعن موضعك المقدس هذا. أما الصالحات والنافعات فارزقنا إياها لأنك أنت الذي أعطيتنا السلطان أن ندوس على الحيات والعقارب وكل قوة العدو.\n** And from all Your people, and from this church, and from this, Your holy place. But those things, which are good and profitable do provide for us, for it is You who has given us the authority to tread on serpents and scorpions, and upon all the power of the enemy.\n** Nem `ebol ha peklaoc tyrf nem `ebol ha taiek`klycia ;ai. Nem `ebol ha paima =e=;=u vai. Ny de `e;naneu nem ny `eternofri cahni `mmwou nan@ je `n;ok pe `etak] `mpiersisi nan@ `e hwmi `ejen nihof nem ni[ly@ nem `ejen ]jom tyrc `nte pijaji.\nولا تدخلنا في تجربة لكن نجنا من الشرير...\n** And lead us not into temptation, but deliver us from the evil one...\n** Ouoh `mperenten `eqoun `epiracmoc@ alla nahmen ebol ha pipethwou...\nخلصت حقا ولروحك.\n** (Saved.) Amen. And with your spirit.\n** (Cw);ic `amyn@ ke tw `pneumati cou.\nيقول الكاهن\nصل\nإشليل\nيجاوبه الشماس\nإيبى إبروس إفكى إستاثيتى\nإيرينى باسى\nيجاوبه الشعب\nكيطو إبنيفماتى سو\n** ثم يقول الكاهن صلاة الشكر:\nمارين شيبئهموت إنططف إم بيريف\nإير بيثنا نيف أووه إن نائيت إفنوتي إفيوت إم بين شويس أووه بيننوتي أووه بنسوتير إيسوس بي إخريستوس جي أفئير.\nإسكيبازين إيجون آفئير قويثين إيرون\nأفأريه إيرون آف شوبتين إيروف آف تي\nآسو إيرون آف تيتوتين آف إينتين شا إى إهري إيطاي أو نوثاي.\nفنشكر صانع\nالخيرات الرحوم الله\nأبا ربنا وإلهنا ومخلصنا\nيسوع المسيح لأنه سترنا\nوأعننا وحفظنا وقبلنا\nإليه وأشفق علينا\nوعضدنا وأتي بنا إلى\nهذه الساعة\nإنثوف أون مارين تيهوإيروف\nهوبوس إنتيف آريه إيرون خين باي\nإيهوؤو إثؤواب فاى نيم ني إيهوؤوتيرو\nأنتي بين أونخ خين هيريني نيفين إنجي\nبي بانطوكراطور إبشويس بيننوتي.\nهو أيضًا فلنسأله أن\nيحفظنا في هذا اليوم\nالمقدس وكل أيام حياتنا\nبكل سلام ضابط الكل\nالرب إلهنا\nيقول الشماس:\nإبروس إيف إكساستي.\nيقول الشعب:\nكيريى إليسون\nإفنيب إبشويس إفنوتي بي\nبانطوكراطور إفيوت إمبين شويس أووه بيننوتي أووه بين سوتير إيسوس بي إخرستوس تين شيبئهموت إن توتك\nكاطا هوب نيفين نيم إثفي هوب نيفين\nنيم خين هوب نيفين. جي آك إير\nإسكيبازين إجون آك إيرفويثين\nإيرون أك أريه إيرون أك شوبتين\nإيروك أك تى آسو إيرون أكتى\nتوتين أك إين تين شا إى إهرى\nإيطاى أو نو ثاى.\nأيها السيد الرب\nالإله ضابط الكل\nيسوع المسيح نشكرك\nعلى كل حال ومن أجل\nكل حال وفي كل حال\nلأنك سترتنا واعنتنا\nوحفظتنا وقبلتنا إليك\nأشفقت علينا و\nعضدتنا وأتيت بنا إلى\nطف هينا إنتى إفنوتي ناى نان\nإنتيف شينهيت خارون إنتيف سوتيم\nإيرون إنتيف إيرفويثين إيرون\nإنتيف تشى إن نى تيهو نيم نى طفه إنتى\nنى إثؤواب إنتاف إنطوطو إى\nإهرى إيجون إبي آغاثون إنسيو نيفين\nإنتيف كانين نوفي نان إيفول.\nإطلبوا لكي يرحمنا الله\nويتراءف علينا ويسمعنا\nويعيننا ويقبل سؤالات\nوطلبات قديسيه منهم\nبالصلاح عنا في كل\nحين ويغفر لنا\nخطايانا\nوأثناء رفع الحمل يكمل الشماس\nإنتيف آى تين إن إم إبشا إثرين\nتشى إيفول خين تى كونونيا إنتى نيف مستريون إثؤواب إت إزماروؤت إى\nبى كو إيفول إنتى نين نوفى.\nويجعنا مستحقين\nأن ننال من شركة\nأسراره المقدسة المباركة لمغفرة\nإثفى فاى تين تيهو أووه تين طفه إن\nتيك ميت آغاثوس بى ما رومى ميس\nنان إثرين جوك إيفول إم باى كى\nإيهوؤو إثؤواب فاى نيم نى إيهوؤو\nتيرو إنتى بين أونخ خين هيريني\nنيفين نيم تيك هوتى.\nمن اجل هذا نسأل\nونطلب من صلاحك يا\nمحب البشر إمنحنا أن\nنكمل هذا اليوم المقدس\nوكل أيام حياتنا بكل سلام مع\nخوفك\nإفثونوس نيفين بى راسموس نيفين إن\nإرجيا نيفين إنتى إبساطاناس\nإبسوتشنى إنتى هان رومى إف هوؤو\nنيم إبطونف إى إبشوى إنتى هان جاجي\nنى إتهيب نيم ني إثئوأونه إيفول\nكل حسد وكل تجربة\nوكل فعل الشيطان\nومؤامرة الناس الأشرار وقيام\nالأعداء الخفيين\nوالظاهرين\nيرشم الكاهن ذاته قائلًا:\nآليتو إيفول هارن\nإنزعها عنا\nثم يلتفت إلى الغرب عن يمينه ويرشم الشعب قائلًا\nنيم إيفول ها بيك لاؤس تيرف\nوعن سائر شعبك\nثم يرشم جوانب الهيكل شمالًا ويمينًا ويقول\nنيم إيفول ها باى ما إثؤواب إنتاك فاي\nوعن موضعك المقدس هذا\nوفي الأديرة (بدلًا من السابقة)\nنيم كى تومونا ستريو إيمون طوطو\nوعن ديرنا هذا\nثم يكمل قائلًا\nنى ذى إثنانيف نيم نى إتئر\nنوفرى ساهنى إموؤو نان جي إثنوك\nبى إتاكثى إم بى إير شيشى نان\nإيهومى إيجين نى هوف نيم نى\nإتشيلى نيم إيجين تى جوم تيرس إنتى\nبى جاجى.\nأما الصالحات\nوالنافعات فإرزقنا إياها لأنك\nأنت الذي أعطيتنا\nالسلطان أن ندوس\nالحيات والعقارب وعلي كل\nقوة العدو\nأووه إمبير إنتين إيخون إى بى\nراسموس أللا ناهمين إيفول هابي بيت هوؤو خين بي إهموت نيم ني ميت شنهيت نيم تى ميت ماى رومى إنتى بيك مونو جينيس إنشيرى بين شويس أووه بيننوتى أووه بنسوتير إيسوس بي إخرستوس فاى إيتى إيفول هيطوطف إيرى بى أوؤو نيم بى\nطايو نيم بى آماهى نيم تى إبروس كينيسيس إير إبريبى ناك نيماف نيم بى إبنيفما إثؤواب إثريف تانخو أووه إن أوموسيوس نيماك\nتينو نيم إن سيو نيفين نيم شا إينيه\nإنتى نى إينيه تيرو آمين.\nولا تدخلنا في تجربة لكن\nنجنا من الشرير بالنعمة\nوالرأفات ومحبة البشر اللواتي\nلإبنك الوحيد الجنس\nربنا وإلهنا ومخلصنا يسوع\nالمسيح هذا الذي من\nقبلة المجد والكرامة والعزة\nوالسجود تليق بك مع سلم طرفه الأمامي للكاهن ليغطي به الكأس والصينية ويضع فوق لفافة ويقبل المذبح ويطوف حوله ثم ينزل أمام الهيكل ويسجد ويصلي أحد الكهنة تحليل الخدام او يقف هو أمام الهيكل يقول ووجهه متجه دائمًا نحو الشرق بينما الكل شمامسة وشعب ساجدين).\nتحليل الخدام\nالقداس الباسيلي\nالخولاجي\nيا كل حكماء / نى سافيف تيرو\n"},{"n":"9- تحليل الخدام","t":"الكاهن:\nعبيدك خدام هذا اليوم القمامصة والقسوس والشمامسة والاكليروس وكل الشعب وضعفي يكونون محاللين من فم الثالوث القدوس الآب والابن والروح القدس ومن فم الكنيسة الواحدة الوحيدة المقدسة الجامعة الرسولية.\n** Priest:\n** May Your servants, ministers of this day, the hegomen(s), the priest(s), the deacon(s), the clergy, all the people, and my weak self, be absolved from the mouth of the All- Holy Trinity, the Father and the Son and the Holy Spirit; and from the mouth of the one, only, Holy, Catholic and Apostolic Church.\n** Nek`ebiaik `prefsemsi `nte pai `ehoou vai@ pihygoumenoc, ie pi`precbuteroc@ nem pidi`akwn@ nem pi`klyroc@ nem pilaoc tyrf@ nem tametjwb. Eueswpi euoi `nremhe@ `ebolqen rwc `n]pan`agi`a `Triac@ `Viwt nem `pSyri nem pi`Pneuma =e=;=u. Nem `ebolqen rwc `n]ou`i `mmauatc =e=;=u `nka;oliky `n`apoctoliky `n`ekklyc`ia.\nومن أفواه الاثني عشر رسولا ومن فم ناظر الاله الإنجيلى مرقس الرسول الطاهر والشهيد والبطريرك القديس ساويرس ومعلمنا ديوسقورس والقديس أثناسيوس الرسولي والقديس بطرس خاتم الشهداء رئيس الكهنة والقديس يوحنا ذهبي الفم والقديس كيرلس.\n** And from the mouths of the twelve apostles; and from the mouth of the Beholder of God the Evangelist Saint Mark, the apostle and martyr; the patriarch Saint Severus; our teacher Dioscorus, Saint Athanasius the Apostolic; Saint Peter the holy martyr and the high priest; Saint John Chrysostom; Saint Cyril.\n** Nem `ebolqen rwou `mpimet`cnau `n`apoctoloc. Nem `ebolqen rwf `mpi;e`wrimoc `n`eu`aggelictyc Markoc pi`apoctoloc =e=;=u ouoh `mmarturoc. Nem pipatriar,yc =e=;=u Ceu`yroc@ nem pencaq Diockoroc@ nem pi`agioc `A;anacioc pi`apoctolikoc@ nem pi`agioc Petroc ieromarturoc piar,y`ereuc@ nem pi`agioc Iwannyc pi`,rucoctomoc@ nem pi`agioc Kirilloc.\nوالقديس باسيليوس والقديس اغريغوريوس ومن أفواه الثلاثمائة والثمانية عشر المجتمعين بنيقية والمئة والخمسين بالقسطنطينية والمائتين بأفسس ومن فم أبينا المكرم رئيس الكهنة البابا أنبا (...) ومن فم حقارتي.\n** Saint Basil; and Saint Gregory; and from the mouths of the three hundred and eighteen assembled at Nicea; the one hundred and fifty at Constantinople, and the two hundred at Ephesus; And from the mouth of our Honored father the high priest Pope Abba (...) and from the mouth of my abject self.\n** Nem pi`agioc Bacilioc@ nem pi`agioc Grygorioc. Nem `ebolqen rwou `mpitsomt se met `smyn `etau;wou] qen Nikea@ nem pise teui `nte Kwctantinoupolic @ nem nem pi`cnau se `nte `Evecoc. Nem `ebolqen rwf `mpeniwt ettaiyout `n`ar,y`ereuc abba (...). Nem `ebolqen rwc `ntamet`ela,ictoc.\nانه مبارك مملوء مجدا اسمك القدوس أيها الآب والابن والروح القدس. الآن وكل أوان إلي دهر الدهور كلها آمين.\n** For blessed and full of glory is Your holy Name, O Father and Son and Holy Spirit, now and at all times and unto the age of all ages. Amen.\n** Je `f`cmarwout ouoh `fmeh `n`wou `nje pekran =e=;u `Viwt nem `pSyri nem pi`Pneuma =e=;=u. }nou nem `ncyou niben nem sa `eneh `nte ni`eneh tyrou `amyn.\nتحليل الخدام\nنيك إيفي أيك إنريف شيمشي إنتي باي إيهوؤو فاى ني هيغومينوس نيم ني إبريسفيتيروس نيم ني ذياكون نيم بي إكليروس نيم بي لاؤس تيرف نيم\nتامتجوب إف إبشوبي إف أوى\nإنريمهي إيقول خين روس إنتي بان آجيا إترياس إفيوت نيم إبشيري نيم بي\nإبنيفما إثؤواب نيم إيفول خين روس إنتي أوى إممافاتس إثؤواب إن كاثوليكي عن أبوسطوليكي إن إككليسيا نيم\nإيفول خين روؤوإمبي ميت إسناف إن آبوسطولوس نيم إيقول خين روف إم\nبي ثيؤريموس إن إف آنجيليستيس ماركوس بي أبوسطولوس إثؤواب أووه إم مارتيروس نيم بي بطريارشيس\nإثؤواب سيفيروس نيم بينساخ ديوسكوروس نيم بي آجيوس\nأثاناسيوس بي أبوسطوليكوس نيم بي آجيوس بترس يرومارتيروس\nبي أرشي إرفس نيم آجيوس يوأنس بي إخرسوسطوموس نيم بي آجيوس\nكيرلس نيم بي آجيوس فاسيلوس\nنيم بي آجيوس إغريغوريوس نيم\nإيقول خين روؤو نيم بي شمت شي ميت إشمين إيطاف ثوؤوتي خين نيكيا.\nنيم بي شي تيفي إنتي كوسطانطينوى بوليس نيم بي إسناق شي إنتي إيفيسوس\nنيم إيقول خين روف إم بين يوت\nإتطايوت إن أرشي إيرفس بابا آفا (...). نيم إيقول خين روس إنتاميت\nالإشيسطوس جي إف إزماروؤوت أووه إفميه إن أوؤو إنجي بيكران إثؤواب إفيوت نيم إبشيري نيم بي إبنيفما إثؤواب\nتينو نيم إنسيو.\nعبيدك يا رب خدام هذا\nاليوم القمامصة والقسوس\nوالشمامسة الأكليروس\nوكل الشعب وضعفي\nيكونون محاللين من فم\nالثالوث الأقدس\nالآب والابن والروح\nالقدس ومن فم\nالكنيسة الواحدة الوحيدة\nالمقدسة الجامعة الرسولية\nومن أفواه الإثني\nعشر رسولًا ومن فم\nناظر الإله الإنجيلي\nمرقس الرسول الطاهر\nوالشهيد والبطريرك القديس\nساويرس ومعلمنا\nديوسقوروس والقديس\nأثناسيوس الرسولي\nوالقديس بطرس\nخاتم الشهداء ورئيس\nالكهنة والقديس يوحنا\nذهبي القم والقديس كيرلس\nوالقديس باسيليوس و\nالقديس أغريغوريوس ومن\nأفواه الثلاثمائة والثمانية عشر\nالمجتمعين بنيقية والمئة و\nالخمسين بالقسطنطينية و\nالمائتين بأفسس ومن قم أبينا\nالمكرم رئيس الكهنة البابا أنبا\n(...) ومن فم حقارتي\nلأنه مبارك ومملوء مجدًا\nإسمك القدوس أيها الآب\nوالإبن الروح القدس\nالآن وكل.. إلخ.\nسر بخور الذبيحه\nالقداس الباسيلي\nالخولاجي\nصلاة التقدمه\n"},{"n":"10- سر بخور الذبيحة: وضع أوشية بخور البولس: إفنوتي بي نيشتي بي شا","t":"ثم ينهض الجميع ويصافح الكاهن أخوته ويصعد إلى الهيكل ويقف أمام المذبح ويقدم له الشماس المجمرة فيضع فيها خمس أياد بخور ثم يقول سر بخور الذبيحة:\n(يا الله العظيم الأبدي الذي بلا نهاية العظيم في مشورته والقوى في أفعاله الذي هو في كل مكان وكائن مع كل أحد كن معنا نحن أيضًا يا سيدنا في هذه الساعة وقف في وسطنا كلنا طهر قلوبنا وقدس أنفسنا ونقنا من كل الخطايا التي صنعناها بإرادتنا وبغير إرادتنا وإمنحنا ان نقدم أمامك ذبائح ناطقة وصعائد بركة).\nيقول الشماس\nصلوا من أجل ذبيحتنا والذين قدموها\nيكمل الكاهن\n(وبخورًا روحانيًا يدخل إلى الحجاب في موضع قدس أقداسك نسألك يا سيدنا أذكر يا رب سلام كنيستك الواحدة الوحيدة المقدسة)\nثم يكمل الأواشي الثلاثة الصغار كما تقدم في رفع البخور وينزل من الهيكل ويعطي البخور أمام باب الهيكل كما تقدم في رفع البخور في كل أيام الفطر.\nإفنوتي بي نيشتي بي شا إينيه : بي آت آرشي اووه بي آتجوك : بي نيشتي خين نيف سوتشني اووه بي جوري خين نيف أهﭬيؤوي : في إت خين ماي نيﭬين اووه إتشوب نيم اووه نيﭬين . شوبي نيمان هون بين نيب خين تاي اونوثاي : اووه أوهي إراتك خين تين ميتي تيرو . ماتوﭬو إن نين هيت : اووه اري آجيازين إننين بسيشي : آري كاثاريزين إممون إيﭬول ها نوﭬي نيﭬين : إتان ايتوو خين بين أوؤوش : نيم بين أوؤش آن . أووه ميس نان إي إرإبروس فيرين إمبيك إمثو غن هان شوشوؤوشي إن لوجيكون : نيم هان ثيسيا إن إسمو .\nيقول الشماس++\nإبروس إﭫ إكساثتي إيبير تيس ثيسياس إيمون إبروسفيرون تون\nيكمل الكاهن++\nنيم أو إستوي نوفي إم إبنىﭭماتيكون : إﭭنيو ساخون إمبي كاطا بيت اسما : خين بيما إثؤواب إنتيه ني إثؤواب إنتاك .\nيكمل الثلاث اواشى الصغار++\nثم بعد لحن بى أهموت غار يقول سرا++\nيا الله العظيم الابدي الذي بلا بداية ولا نهاية . العظيم في مشورته والقوي في افعاله . الذي هو في كل مكان و كائن مع كل احد كن معنا نحن ايضا يا سيدنا في هذه الساعة . وقف في وسطنا كلنا طهر قلوبنا وقدس نفسنا . نقنا من كل الخطايا التي صنعناها بارادتنا و بغير ارادتنا و امنحنا ان نقدم امامك ذبائح ناطقة و صعائد البركة .\nو بخورا روحيا يدخل الي الحجاب في موضع قدس اقداسك .\nثم يكمل الثلاث اواشى الصغار ++\nثم بعد لحن بى أهموت غار يقول سرا++\n** /F5 pini25 pi2a`eneh : piatarx3 ovoh piatgwk : pini25 qen ne4cosni ovoh pigwri qen ne4`hb3ov`i : f3et qen mai niben ovoh et2op nem ovon niben .\n** @wpi neman hwn penn3b qen taiovnov 0ai : ovoh `ohi `eratk qen tenm35 t3rov .\n** Matovbo `nnenh3t : ovoh `ari`aji`azin `nnenyvx3 : `arika0arizin `mmon `ebolha nobi niben : `etanaitov qen penovw2 : nem penovw2 an .\n** Ovoh m3ic nan `eer`procferin `mpek`m0o `nhan2ov2wov2i `nlojikon : nem han0vci`a `n`cmov >\n** /Procev7ac0e `vper t3c 0vciac `3mwn `procferontwn\n** /Nem ov`c0oino4i `m`pnevmatikon : evn3ov caqon `mpikatapetacma : qen pima `e0ovab `nte n3`e0ovab `ntak > .\n** /Ovoh ten5ho `erok penn3b . Ari`fmev`I Pu `n5hir3n3\nانظر أيضًا: ما يُقال في البولس.\nالهيتينيات\nالقداس الباسيلي\nالخولاجي\nتحليل الخدام\n"},{"n":"12- أرباع شفاعات القديسين / الهيتنيات","t":"ثم تقال هذه الأرباع لطلب شفاعات القديسين (الهيتينيات)\nللعذراء:\nهيتين ني إبريسفيا إنتي تي ثيؤطوطوس إثؤواب ماريا إبشويس آري إهموت نان إمبي كو إيفول إنتي نين نوفي.\nللملائكة:\nهيتين ني إبريسفيا إنتي بي شاشف إن أرشي آنجيلوس نيم ني طغما إن إيبورانيون إبشويس.\nللرسل:\nهيتين ني إفكي إنتي ناشويس إنيوتي إن آبوسطولوس نيم إبسيبي إنتي ني ماثيتيس إبشويس.\nللقديس إستيفانوس:\nهيتين ني إفكي إنتي بي آرشي ذياكون إتزماروؤت إستيفانوس بي شورب إممارتيروس إبشويس.\nلمارمرقس:\nهيتين ني إفكي إنتي بي ثيئوريموس إن أف آنجيليستيس ماركوس بي آبوسطولوس إبشويس.\nلمارجرجس:\nهيتين ني إفكي إنتي آثلوفوروس إم مارتيروس باشويس إبؤرو جيئورجيوس إبشويس.\nلمارمينا العجائبي:\nهيتين ني إفكي إنتي بي آثلوفوروس إم مارتيروس أفامينا إنتي ني فايات إبشويس.\nلقديس اليوم:\nهيتين ني إفكي إنتي ني إثؤواب إنتي باي إبهوؤوبي أوواي بي أوواي كاطا بيفران إبشويس.\nللأب البطريرك:\nهيتين نو إفكي آريه إبؤنخ إمبين يوت إتطايوت إن أرشي إريفس باباآفا (...) إبشويس. آري إهموت نان إمبي كو إيقول إنتي نين نوفي\nوإن كان أحد الأساقفة حاضرًا:\nهيتين نو إفكي آريه إبؤنخ إم بنيوت إتطايوت إن ذيكيئوس آفا (...) بي إبسكوبوس إبشويس. آري إهموت نان.\nثم يختمون بهذه:\nتين أوأوشت إمموك أوبي\nإخرستوس نيم بيك يوت إن\nآغاثوس نيم بي إبنيفما إثؤواب جي آك\nإى آك سوتي إممون ناي نان.\nنسجد لك أيها\nالمسيح مع أبيك الصالح و\nالروح القدس لأنك أتيت\nوخلصتنا إرحمنا\nالقداس الباسيلي\nالخولاجي\nما يُقال في البولس\nسر بخور الذبيحه\n"},{"n":"13- ما يُقال في البولس","t":"بولس عبد ربنا يسوع المسيح. الرسول المدعو المفرز لكرازة الله.\n** Paul, the servant of our Lord Jesus Christ, called to be an apostle, appointed to the gospel of God.\n** Pauloc `vbwk `mpen=o=c I=y=c P=,=c pi`apoctoloc et;ahem vy`etau;asf `epihisennoufi `nte V].\nتقرأ قراءات اليوم أو يقرأ هذا الربع:\nبولس رسول يسوع المسيح حسب مشيئة الله.\n** The reading of the day is read or this verse is said:\n** Paul the Apostle of Jesus Christ, according to the will of God.\n** (Pauloc pi`apoctoloc `nte I=y=c P=,=c@ `ebolhiten `v`ou`ws `mV].)\nنعمة الله الآب تكون مع جميعكم آمين.\n** The grace of God the Father be with you all. Amen.\n** Pi`hmot gar nemwten nem `thiryny eucop@ je `amyn ec`eswpi.\nويستمر الكاهن في إعطاء البخور للإنجيل وبعده للآب البطريرك إذا كان حاضرًا ولأخوته الكهنة ويطوف على الشعب بالبخور واضِعًا يده بالبركة على رؤوسهم وهو يقول:\nإزمو إمبافلوس بي آبوسطولوس\nإنتي إيسوس بي إخرستوس إري\nبيف إزمو إثؤواب شوبي نيمان آمين.\nبركة بولس رسول يسوع\nالمسيح بركته المقدسة\nفلتكن معنا آمين\nويعود إلي الهيكل ويضع يد بخور ويقول سر اعتراف الشعب ثم يدور حول المذبح دورة واحدة وينزل ويبخر ثانية أمام باب الهيكل شرقًا وغربًا وقبلي ويعطي البخور للكهنة ثم يتقدم أحد الشمامسة إلى المنجلية ويقول البولس قبطيًا وهذه مقدمته:\nبافلوس إف فوك إمبين شويس\nإيسوس بي إخرستوس بي آبوسطولوس\nإيتثاهيم إيئيتاف ثاشف إي بي هي\nشيننوفي إنتي إفنوتي.\nبولس عبد ربنا\nيسوع المسيح الرسول\nالمدعو المفرز لبشارة\nالله\nويكمل بالجمل القبطي المكتوبة في أول رسالة اليوم ويختم بهذه:\nبي إهموت غارنيموتين نيم إتهيريني إفسوب جي آمين إيس إيشوبي.\nالنعمة معكم والسلام\nيكون معنا آمين\nيقول الشعب: نعمة ربنا يسوع \"بي إهموت غار\"\nويقرأ البولس عربياَ: وفي ختامه يقول (نعمة الله الآب تكون مع جميعكم يا آبائي وأخوتي آمين)\nوأثناء قراءة البولس عربيًا يقول الكاهن الخديم او شريكه هذه الصلاة سرًا\n(يا رب المعرفة ورازق الحكمة الذي يكشف الأعماق من الظملة والمعطي كلمة للمبشرين بقوة عظيمة الذي من قبل صلاحك دعوت بولس هذا الذي كان طاردًا زمانًا مختارًا وبهذا سررت أن يكون رسولًا مدعوًا وكارزًا بإنجيل ملكوتك أيها المسيح إلهنا انت الآن أيضًا الصالح محب البشر نسألك أنعم علينا وعلى شعبك كله بعقل مشتغل وفهم نفي لكي نعلم ونفهم ما هي منفعة تعاليمك المقدسة التي قرئت علينا الآن من قبله، وكما تشبه بك أنت يا رئيس الحياة هكذا نحن أيضًا إجعلنا مستحقين أن نكون متشبهين به في العمل والإيمان ممجدين إسمك القدوس ومفترخين بصليبك كل حين وأنت الذي نرسل لك إلى فوق المجد والكرام والسجود مع أبيك الصالح والروح القدس المحيي المساوي لك الآن وكل أوان وإلى دهر الدهور كلها آمين).\n** The priest raises insense and prayes the litany of the Pauline Epistle with kisses\nالنعمة معكم والسلام أيضاً آمين يكون.\n** The grace and peace be with you all. Amen.\n** Pi`\\mot gar nemwten nem `t\\irhnh eucop> je `amhn ec`e]wpi.\n** In the presence of the patriarch, metropoli
