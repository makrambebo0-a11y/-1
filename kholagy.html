ير الدنس.\n** You have mixed for us a cup from a true vine, your unblemished divine side.\n** Ak;wt nan `nou`avot `ebolqen oubw `n`aloli `nta`vmyi@ `ete pek`cvir `nnou] pe ouoh `nat;wleb.\nهذا الذي من بعد أن أسلمت الروح، فاض لنا منه ماء ودم، هذان الصائران طهراً لكل العالم.\n** Which after You had given up the spirit, flowed for us the spirit, flowed for us blood and water, and became purification for the whole world.\n** Vai `ete menenca `;rek] `mpi=p=n=a afqa] nan `ebol `nqytf `nje oumwou nem ou`cnof@ nai etoi `mman`toubo `mpikocmoc tyrf.\nاقتننا لك أيها الصالح، نحن عبيدك غير المستحقين.\n** Acquire us to Yourself, O Good One, we Your undeserving servants.\n** Jvon nak pi`aga;oc qa pek`ebiaik `natem`psa.\nواصنعنا لك شعباً مجتمعاً، مملكة وكهنوتاً وأمة مقدسة.\n** Make us for Yourself an assembled people, a kingdom, a priesthood, and a holy nation.\n** Ma;amion nak `noulaoc ef;ouyt@ oumetouro@ oumetouyb@ ou`slol efouab.\nطهِّرنا نحن أيضاً يا سيدنا كما قدَّست هذه القرابين الموضوعة، وجعلتها غير مرئية من المرئيين، وأسراراً معقولة لك. يا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Purify us also O our Master, as You have sanctified these gifts set forth, which You have made unseen out of those which are seen and (have made them) Your rational Mysteries, o our Lord, God, and Savior Jesus Christ.\n** Matoubon hwn pennyb `m`vry] `etaker`agiazin `nnaidwron nai et,y `e`qryi ouoh ak`;rouswpi `n`aoraton `ebolqen ny`etounau `erwou@ ouoh `mmuctyrion `etouernoin `mmwou `ntak@ Pen=o=c ouoh pennou] ouoh penCwtyr I=y=c P=,=c.\nأنت من أجل تحنُنك الجزيل، جعلتنا أهلاً كلنا للبنوة، بالصبغة المقدسة.\n** You, because of the multitude of Your compassions, have made us all worthy of sonship through holy Baptism.\n** `N;ok gar e;be nekmetsan`;maqt etos@ ak`;rener`pem`psa `n]metsyri tyren hiten piwmc =e=;=u.\nوعلمتنا أمثلة الصلاة السرية لندعو أباك بها.\n** You have taught us types of mystical prayer, so that we may entreat Your Father thereby.\n** Ak]`cbw nan `nnitupoc `nte ]`proceu,y etqen oumuctyrion@ e;rentwbh `mPekiwt `nqytc.\nانت أيضاً الآن يا سيدنا اجعلنا مستحقين بنية طاهرة، وفكر صالح يليق بالبنين، واشتياق وداله.\n** You also now, O our Master, make us worthy, that with a pure conscience and good thoughts that befit sons, and with yearnings and boldness.\n** `N;ok on ]nou pennyb `ariten `nem`psa qen oucunidycic ectoubyout@ nem oumeu`i `enanef efer`prepi `nnisyri@ nem ou[isswou@ nem ouparrycia.\nأن نجرأ و نصرخ نحو الله أبيك القدوس الذي في السموات ونقول:\n** We may dare to cry to God, your holy Father who is in the heavens, and say:\n** E;renertolman `ews oube V] Pekiwt =e=;=u etqen nivyoui ouoh `ejoc:\nأبانا الذى...\n** Our Father....\n** Je peniwt...\nالشعب:\nأبانا الذي في السموات. ليتقدس اسمك. ليأت ملكوتك. لتكن مشيئتك. كما في السماء كذلك على الأرض. خبزنا كفافنا أعطنا اليوم.\n** People:\n** Our Father Who art in heaven; hallowed be Thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread.\n** Pilaoc@\n** Je Peniwt etqen nivyou`i mareftoubo `nje pekran@ marec`i `nje tekmetouro petehnak marefswpi `m`vry] qen `tve nem hijen pikahi@ penwik `nte rac] myif nan `mvoou.\nوأغفر لنا ذنوبنا كما نغفر نحن أيضا للمذنبين إلينا. ولا تدخلنا في تجربة. لكن نجنا من الشرير.\n** And forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation, but deliver us from the evil one.\n** Ouoh ,a nyeteron nan ebol@ `m`vry] hwn `nten,w ebol `nnyete ouon `ntan `erwou@ ouoh `mperenten eqoun `epiracmoc@ alla nahmen ebol ha pipethwou.\nبالمسيح يسوع ربنا.\n** In Christ Jesus our Lord.\n** Qen P=,=c I=y=c pen=o=c.\nيقول الكاهن:\nالسلام للكل\nإيريني باسي.\nيقول الكاهن صلاة القسمة هذه للإبن\n(مبارك أنت أيها المسيح إلهنا ضابط الكل مخلص كنيستك أيها الكلمة المتجسد الذي من قبل تجسدك غير المدرك أعددت لنا خبزًا سمائيًا جسدك المكقدس هذا السري والمقدس في كشل شيء مزجت لنا كأسًا من كرمة حقيقية التي هي جنبك الإلهي غير الدنس هذا الذي من بعد أن أسلمت الروح قاض لنا منه ماء ودم هذان الصائران طهرا لكل العالم إقتنا لك أيها الصالح نحن عبيدك غير المستحقين وإجعلنا لك شعبًا مجتمعًا مملكة وكهنوتًا وامة مقدسة\nطهرنا نحن أيضًا يا سيدنا كما قدست هذه القرابين الموضوعة وجعلتها غير مرئية من المرئيين وأسرارًا معقولة لك يا ربنا وإلهنا ومخلصنا يسوع المسيح أنت من أجل تحننك جعلتنا كلنا أخلًا للبنوة بالمعمدوية المقدسة وعلمتنا امثلة الصلاة السرية لندعو أباك بها\nانت أيضًا الآن يا سيدنا إجعلنا مستحقين بنية طاهرة وفكر صالح يليق بالبنين وإشتياق ودالة أن نجرؤ ونصرخ نحو الله أبيك القدوس الذي في السموات ونقول (أبانا الذي ... إلخ.)\nخلصت حقا\nالقداس الغريغوري\nالخولاجي\nيا من بارك في ذلك الزمان / فيئيطاف\n"},{"n":"32- خلصت حقًا","t":"الشعب:\nبالمسيح يسوع ربنا.\n** People:\n** In Christ Jesus our Lord.\n** Pilaoc:\n** Qen P=,=c I=y=c pen=o=c.\nالشماس:\nإحنوا رؤوسكم للربِ.\n** Deacon:\n** Bow your heads to the Lord.\n** Pidiakwn@\n** Tac kevalac `umwn tw Kuriw `klinnate.\nأمامك يا ربُ.\n** Before You, O Lord\n** Enwpion cou Kurie.\nأنصتوا بخوف الله.آمين.\n** Let us attend in the fear of God. Amen\n** Pidiakwn@ Proc,wmen :eou meta vobou. Amyn\nالكاهن:\nالسلام للكل.\n** Priest:\n** Peace be with all.\n** Pi`precbuteroc@\n** Iryny paci.\nولروحك أيضًا.\n** And with your spirit.\n** Ke tw `pneumati cou.\nأذكر يا رب اجتماعاتنا، باركها.\n** Remember, O Lord, our assemblies; bless them.\n** Ari`vmeui P=o=c `nnenjin;wou] `cmou erwou.\nخلصت حقاً، ومع روحك، ننصت بخوف الله.\n** Saved. Amen. And with your spirit. In the fear of God, let us attend.\n** Cw;ic `amyn@ ke tw `pneumati cou@ meta vobou :eou `proc,wmen.\nآمين يا ربُ إرحم، يا ربُ إرحم، يا ربُ إرحم.\n** Amen Lord have mercy, Lord have mercy, Lord have mercy.\n** Amyn Kurie `ele`ycon@ kurie `ele`ycon@ kurie `ele`ycon.\nالقدسات للقديسين.\nمبارك الرب يسوع المسيح ابن الله، وقدوس الروح القدس. آمين.\n** The Holies for the holy.\n** Blessed be the Lord Jesus Christ, the Son of God; the sanctification is by the Holy Spirit. Amen.\n** Ta agi`a tic `agyc.\n** Eulogytoc Kurioc Iycouc <rictoc `Uioc :eou `agiacmoc Pneuma `agion@ `amyn.\nواحد هو الآب القدوس. واحد هو الابن القدوس. واحد هو الروح القدس. آمين.\n** One is the All-Holy Father, one is the All-Holy Son, one is the All-Holy Spirit. Amen.\n** Ic `o panagioc Patyr@ Ic `o panagioc Uioc@ en to panagion `Pneuma@ `amyn.\nجسد مقدس، ودم كريم حقيقي، ليسوع المسيح ابن إلهنا. آمين.\n** The holy body and the precious, true blood of Jesus Christ, the Son of our God. Amen.\n** Cwma `agion ke `ema timion `aly;inon Iycou <rictou tou `Uiou tou :eou `ymwn@ `amyn.\nالشعب:\nآمين.\n** Amen.\n** Amyn.\nمقدس وكريم، جسد ودم حقيقي، ليسوع المسيح ابن إلهنا. آمين.\n** The holy, precious body and the true blood of Jesus Christ, the Son of our God. Amen.\n** Agion timion cwma ke `ema aly;inon@ Iycou <rictou tou `Uiou tou :eou `ymwn@ `amyn.\nجسد ودم عمانوئيل إلهنا، هذا هو بالحقيقة. آمين.\n** The Body and the Blood of Emmanuel our God; this is true. Amen.\n** Picwma nem pi`cnof `nte Emmanouyl Pennou] vai pe qen oume;myi@ amyn.\nحقاً أؤمن.\n** Amen. I believe.\n** Amyn. ]nah].\nبعد الإنتهاء يقول التحاليل الثلاثة ثم يذكر من يريد من الأحياء والأموات وبعد ذلك يقول:\n(أذكر يا رب عبيدك خدام هذا اليوم وحاللهم وإجعلهم مستحقين أن يكملوا هذه الخدمة الطاهرة كما يرضيك (ثم يقول عن نفسه) أذكر يا رب ضعفي أنا أيضًا وإغفر لي خطاياي الكثيرة وحيث كثر الإثم فلتكثر هناك نعمتك ومن أجل خطاياي خاصة ونجاسات قلبي لا تمنع شعبك نعمة روحك القدوس بل حاللهم أجميعن\nإملأنا من خوفك وقومنا إلى إرادتك المقدسة الصالحة لأنك أنت هو إلهنا الذي يليق بك المجد إلى (ثم يقول) أذكر يارب اجتماعاتنا باركها.)\nيقول الشماس:\nخلصنا حقًا ومع روحك ننصت بخوف الله\nيقول الشعب: يا رب ارحم (3 مرات)\nياخذ الكاهن الإسباديقون decpotikon ويقول بصوت عال (طا آجياتيس إلخ.)\nويسجد الشعب للرب ثم يرشم به الدم الكريم ويغمسه فيه ويرفعه ويرشم الجسد المقدس ثم يعيده الكأس ويتركه فيه كما توضح قبلًا في قداس القديس باسيليوس.\nالإعتراف (آمين آمين آمين)\nالقداس الغريغوري\nالخولاجي\nقسمه للابن\n"},{"n":"33- الاعتراف (أؤمن اؤمن آؤمن)","t":"الكاهن:\nآمين. آمين. آمين. أؤمن. أؤمن. أؤمن. واعترف إلي النفس الاخير. أن هذا هو الجسد المحيي، الذي أخذته أيها المسيح إلهي، من سيدتنا كلنا والدة الاله القديسة الطاهرة مريم.\n** Priest:\n** Amen. Amen. Amen. I believe, I believe, I believe and confess to the last breath that this is the life-giving Flesh that You have taken, O Christ my God, from our Lady, the Lady of us all, the Holy Theotokos, Saint Mary.\n** Pi`precbuteroc@\n** Amyn `amyn `amyn@ ]nah] ]nah] ]nah]@ ouoh ]er`omologin sa pinifi `nqa`e. Je ;ai ]carx `nreftanqo etak[itc `w P=,=c panou]@ `ebolqen ten=o=c tyren ];eotokoc =e=;=u ]agia Maria.\nوجعلته واحداً مع لاهوتك بغير اختلاط ولا امتزاج ولا تغيير. واعترفت الاعتراف الحسن أمام بيلاطس البنطي.\n** You have made It One with Your divinity without mingling, without confusion, and without alteration. You have confessed the good confession before Pontius Pilate.\n** Akaic `nouai nem tefme;nou] qen oumetatmoujt@ nem oumetat;wq@ nem oumetatsib]. Eafer`omologin `n]`omologia e;nanec nahren nahren pontioc Pilatoc.\nوسلمته عنا علي خشبة الصليب المقدسة، بإرادتك وحدك، عنا كلنا. بالحقيقة أؤمن، أن لاهوتك لم يفارق ناسوتك لحظة واحدة ولا طرفة عين.\n** You have given It up for us upon the holy wood of the Cross, of Your own will, for us all. I believe that Your divinity parted not from Your humanity for a single moment, nor a twinkling of an eye.\n** Aktyic `e`hryi `ejwn hijen pise =e=;=u `nte pi`ctauroc@ qen pekouws `mmin `mmok `e`hryi `ejwn tyren. }nah] je `mpe tefme;nou] vwrj `etekmetrwmi@ `noucoucou `nouwt oude ouriki `mbal.\nيعطى عنا خلاصاً وغفراناً للخطايا وحياة أبدية لمن يتناول منه. أؤمن. أن هذا هو بالحقيقة. آمين.\n** Given for us for salvation, remission of sins, and eternal life to those who partake of Him. I believe that this is true. Amen.\n** Eu] `mmoc `ejwn `noucw]@ nem ou,w `ebol `nte ninobi@ nem ouwnq `n`eneh@ `nnye;na[i `ebol `nqytc. }nah] je ;ai te qen oume;myi `amyn.\nالشماس:\nآمين. آمين. آمين. أؤمن. آؤمن. آؤمن. أن هذا هو بالحقيقة. آمين. اطلبواعنا وعن كل المسيحيين الذين قالوا لنا من أجلهم، أذكرونا في بيت الرب.\n** Deacon:\n** Amen. Amen. Amen. I believe, I believe, I believe that this is so in truth. Amen. Pray for us and for all Christians who said to us concerning them, “Remember us in the house of the Lord.”\n** Pidiakwn@\n** Amyn `amyn `amyn ]nah] ]nah] ]nah] je ;ai te qen oume;myi `amyn. Twbh `e`hryi `ejwn nem `ejen `,rictianoc niben `etaujoc nan e;bytou je `aripenmeu`i qen `pyi `mP=o=c.\nسلام ومحبة يسوع المسيح تكون معكم، رتلوا بنشيد: هلليلويا صلوا من أجل التناول باستحقاق من هذه الاسرار المقدسة الطاهرة السمائية.\nيا رب ارحم.\n** The peace and love of Jesus Christ be with you. Sing. Alleluia. Pray for the worthy communion of the immaculate, heavenly, and holy Mysteries.\n** Lord have mercy.\n** Y `iryny ke `agapi Iycou `<rictou me; `umwn 'allate jw `allyloui`a. `Proceuxac;e `uper tyc `axiac metaly'ewc a,rantwn ke `epouraniwn twn `agiwn muctyriwn.\n** Kuri`e `ele`ycon.\nثم يقول الكاهن الاعتراف\n(أمين أمين أمين آؤمن آؤمن آؤمن وأعترف إلى النفس الأخير أن هذا هو الجسد المحيي الذي أخذته أيها المسيح إلهي من سيدتنا كلنا والدة الإله القديسة الطاهرة مريم وجعلته واحدًا مع لاهوتك بغير اختلاط ولا امتزاج ولا تغيير وإعترفت الإعتراف الحسن أمام بيلاطس البنطي وأسلمته عنا علي خشبة الصليب المقدسة بإرادتك وحدك عنا كلنا\nأؤمن أن لاهوتك لم يفارق ناسوتك لحظة واحدة ولا طرفة عين يُعطى عنا خلاصًا وغفرانًا للخطايا وحياة أبدية لمن يتناول منه اؤمن ان هذا هو بالحقيقة آمين)\nيقول الشماس الخديم هذا الاعتراف:\nآمين آمين آمين أؤمن أؤمن أؤمن أن هذا هو بالحقيقة آمين أطلبوا عنا وعن كل المسيحيين الذين قالوا لنا من أجلهم ان نذكرهم في بيت الرب\nيا الله الرحوم إذكرنا نحن وإياهم برحمتك إلى الأبد في ملكوت السموات يا يسوع المسيح ملكنا استجب لنا وإرحمنا صارخين قائلين: هلليلويا صلوا من أجل التناول باستحقاق من هذه الأسرار المقدسة الطاهرة السمائية)\nيقول الشعب: يا رب إرحم\nثم يرد الشعب بما يوافق الألحان كما توضح بالقداس الباسيلي\nبعد التناول و الانصراف\nالقداس الغريغوري\nالخولاجي\nخلصت حقا\n"},{"n":"34- بعد التناول / الانصراف","t":"وبعد ذلك يقول:\nصلاة الشكر بعد التناول\nنشكرك أيها السيد المسيح إلهنا الكلمة الحقيقي الذي هو من جوهر الآب غير الدنس القدوس لأنك أحببتنا وبذلت ذاتك للذبح عن خطايانا شفيتنا بضرباتك وأبرأتنا بجراحاتك وأنعمت علينا بالحياة من قبل جسدك المقدس ودمك الكريم اللذين جعلتنا مستحقين الآن أن نتناول منهما ومن أجل هذا نشكرك يا الله محب جبلته ونرسل لك إلى فوق المجد والكرامة والسجود مع أبيك الصالح والروح القدس المحيي المساوي لك الآن وكل أوان.. إلخ.).\nيقول الكاهن بعد التناول صلاة وضع يد وهي خضوع للإبن (للبطريريك ساويرس)\n((أيها الكائن الذي كان، الذي آتي وأيضًا يأتي الذي تجسر وتأنس وصلب على الصليب من أجلنا تألم بإرادته بالجسد وكان غير متألم كإله ودفن ووضع في القبر وقام من الأموات في اليوم الثالث وصعد إلى السموات وجلس عن يمين عظمة الآب وسيأتي ليدين الأحياء والأموات الذي تباركه الملائكة وتسبحه رؤساء الملائكة الذي تنطق بمجده السيرافيم وتسجد له الشاروبيم الذي تخاف وترتعد منه جميع الطبائع الإبن كلمة الله الآب يسوع المسيح ربنا انت الذي يخضع لك شعبك وميراثك هؤلاء الذين إقتنيتهم لك بدمك الكريم أنظر إلينا كلنا يا رب من سمائك المقدسة ومن مسكنك المستعد بارك عبيدك بكل بركة روحية وإحفظهم بيدك العزيزة وثبتهم في إيمانك أنعم عليهم وعلينا أيضًا بطهارة أنفسنا وأجسادنا وأرواحنا وأعطنا الكمال المسيحي الذي يرضيك لأن ملكوتك نفي ومملوء مجدًا أيها المسيح إلهنا هذا الذي نرجو أن نناله كلنا وأنت الذي نرسل لك إلى فوق المجد والإكرام والسجود مع أبيك الصالح والروح القدس المحيي المساوي لك الآن وكل أوان وإلى دهر الدهور آمين)).\nثم يعطي التسريح للشعب ويقول البركة ويوزع البركة عليهم ويصرفهم بسلام الرب آمين.\n** ولربنا المجد دائمًا.\nالإعتراف (آمين آمين آمين)\nفهرس قداس القديس غريغوريوس\nالقداس الغريغوري\nالخولاجي\n"}]},{"n":"القداس الكيرلسي للقديس كيرلس عمود الدين (رقم 24)","p":[{"n":"1- صلاة الحجاب (يا خالق البرية)","t":"يبدأ الكاهن كما جاء في قداس القديس باسليوس إلى ما بعد قراءة إنجيل القداس وقبل قانون الإيمان ثم يقول صلاة الحجاب لأبينا القديس يوحنا المثلث الطوبي للآب سرًا:\n((يا خالق البرية كلها التي تري والتي لا تري المعتني بكل الأشياء لأنها لك يا سيدنا محب الأنفس استعطفك أيها الرب القادر على كل شيء أنا الضعيف العاجز غير المفلح بين جميع خدامك عندما اتقدم إلى قدس أقداسك وألمس هذا السر الخفي المقدس أعطني يا رب روحك القدوس النار غير الهيولية التي لا يفكر فيها التي تأكل كل الطغمات وتحرق الموجودات الرديئة ليميت حواس الجسد التي على الأرض ويلجم حركات الفهم التي تقوده إلى الخيالات المملوءة اوجاعًا وآلامًا وكما يليق بالكهنة يجعلني فوق كل فكر ميت وليجعل في الكلمات المطهرة لكي أكمل هذا القربان الموضوع الذي هو سر جميع الأسرار بصحبة وشركة مسيحيك هذا الذي يليق بك معه المجد مع الروح القدس المحيي المساوي لك الآن وكل اوان وإلى دهر الدهور آمين))\nالقداس الكيرلسي\nالخولاجي\nصلاة حجاب أخري (ايها الرب)\nفهرس نص القداس الكيرلسي\n"},{"n":"2- صلاة حجاب أخرى (أيها الرب إله القوات)","t":"صلاة أخري للحجاب للآب تقال بدلًا من الأولي متى أراد الكاهن:\n((أيها الرب إله القوات ملك المجد صانع العجائب وحده الصالح الوديع للذين يدعونك بالحق إطلع على سؤالاتنا وأعطنا قوة لهذه الخدمة المخوفة التي للسر العظيم السمائي الذي لهذه الذبيحة الموضوعة غير الدموية والناطقة لكي تكون إرادتك عن خلاص الذين يتقدمون إلى هذه الأسرار المقدسة أنت أيضًا أيها الرب الذي ترحم كل أحد إذ قد تراءفت على ضعفي عرني من الإنسان العتيق وأعماله الرديئة وشهواته وأترك عني كل خطية فعلتها إن كان بإراداتي او بغير إرادتي وإجعلني أهلًا بقلب طاهر وشفتين نقيتين ان أقدم لك هذه الذبيحة المخوفة ولا تطرحني عن عبيدك كعبد للخطية بل أطلب إليك برأفاتك اعطني أن أخدم إسمك القدوس المركم بغير سكوت لكي أجد أجرة الوكيل الأمين الحكيم في الخيرات الأبدية التي وعدت بها محييك بالنعمة والرأفات ومحبة البشر اللواتي لمسيحك هذا الذي انت مبارك معه مع الروح المحيي المساوي لك الآن وكل اوان وإلى دهر الدهور آمين))\nالقداس الكيرلسي\nالخولاجي\nيا رئيس الحياه\nصلاه الحجاب (يا خالق البريه)\n"},{"n":"3- يا رئيس الحياة","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nصلوا.\n** Pray.\n** `Slyl.\nالشماس:\n** Deacon:\n** Pidiakwn@\nللصلاة قفوا.\n** Stand up for prayer.\n** `Epi `proceu,y `cta;yte.\nالسلام لجميعكم.\n** Peace be with all.\n** `Iryny paci.\nالشعب:\n** People:\n** Pilaoc@\nولروحك أيضاً.\n** And with your spirit.\n** Ke tw `pneumati cou.\nيا رئيس الحياة وملك الدهور. أللهم يا مَنْ تجثو له كل ركبة، ما في السموات وما على الأرض وما تحت الأرض.\n** O Author of life and King of the ages. O God, unto whom every knee bows, those in the heavens, those on earth, and those under the earth.\n** `Par,ygoc `nte `pwnq ouoh `pOuro `nte ni`eneh. `V] vyet`ere keli niben kwlj naf@ nyetqen nivyou`i@ nem nyethijen pikahi@ nem nyetcapecyt `m`pkahi.\nالذي الكل مذلول وخاضع بعُنق العبودية تحت خضوع قضيب ملكه.\n** To whom all are humbled and under the yoke of servitude, bowing the head to the scepter of His kingship.\n** Vyetere `ptyrf ;ebiyout@ ouoh `fsop qen oumo] `mmetbwk@ qa `p[nejwf `m`p`sbwt `nte tefmetouro.\nالذي تمجده الأجناد الملائكية، والطغمات السمائية، والطبائع العقلية، بصوت لا يسكت ناطق بألوهيته.\n** Who are glorified by the angelic hosts and the heavenly orders and the rational natures with unceasing voices declaring His godhead.\n** Vy`etou]`wou naf `nje ni`ctratia `naggelikon@ nem nitagma `n`epouranion@ nem nivucic `nno`yron@ qen ou`cmy `nat,rwc `n;e`oligikon.\nوإذ سُررت بنا نحن أيضاً الضعفاء الأرضيين أن نخدمك، لا من أجل نقاوة أيدينا، لأننا لم نفعل الصلاح على الأرض.\n** And You were pleased that we frail earthly men should also serve You, not on account of the purity of our hands, since we have wrought no goodness on earth.\n** Ouoh `eak]ma] `ejwn hwn qa nijwb `nrem`nkahi e;rensemsi nak@ e;be `ptoubo an `nte nenjij@ ou gar `mpen`iri `mpi`aga;on hijen pikahi.\nبل مريداً أن تعطينا نحن البائسين غير المستحقين من طهرك. إقبلنا إليك أيها الصالح محب البشر، إذ ندنو من مذبحك المقدس ككثرة رحمتك.\n** But rather desiring to give to us, we undeserving wretches, of Your purity. Receive us unto Yourself, O good One and Lover of mankind, as we draw near to Your holy altar, according to the multitude of Your mercies.\n** Alla akouws `e] nan `anon qa ni`ebiyn ouoh etoi `nat`m`psa `ebolqen pektoubo. Sopten `erok pi`Aga;oc ouoh `mMairwmi@ enqwnt `mmon `epek;uciactyrion =e=;=u@ kata `p`asai `nte peknai.\nوإجعلنا أهلاً للسلام السمائي اللائق بلاهوتك والمملوء خلاصاً، لنعطيه بعضنا لبعض بمحبة كاملة. ونقبل بعضنا بعضاً بقبلة مقدسة.\n** And make us worthy of the heavenly peace which befits Your divinity and is full of salvation, that we may give the same to one another in perfect love. And greet one another with a holy kiss.\n** Ouoh `ariten `nem`psa `n]hiryny `nte `tve@ eter`prepi `ntekme;nou] ouoh e;meh `noujai@ e;rentyic `nnen`eryou qen ou`agapy ecjyk `ebol. Ouoh `nteneracpaze;ce `nnen`eryou qen ouvi ecouab.\nصلوا من أجل السلام الكامل، والمحبة، والقبلة الطاهرة الرسولية.\n** Pray for perfect peace, love, and the holy apostolic kisses.\n** `Proceuxac;e `uper tyc teliac `irynyc ke `agapyc ke twn `agiwn acpacmwn twn `apoctolwn.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nههنا يقول الشعب قانون الإيمان ثم يقول الكاهن صلاة الصلح لقداس القديس مرقس للبطريرك ساويرس للآب\nيبدأ الكاهن بالصلاة كالعادة ثم يقول:\n((يا رئيس الحياة وملك الدهور اللهم يا من تجثو له كل ركبة ما في السموات وما على الأرض وما تحت الأرض الذي الكل مذلول وخاضع بعنق العبودية تحت خضوع قضيب ملكه الذي تمجده الجناد الملائكية والطغمات السمائية والطبائع العقلية بصوت لا يسكت ناطق بألوهيته\nوإذ سررت بنا نحن الضعفاء الأرضيين أن نخدمك لا من أجل نقاوة أيدينا لأننا لم نفعل الصلاح على الأرض بل مريدًا أن تعطينا نحن البائسين غير المستحقين من ظهرك إقبلنا إليك أيها الصالح محب البشر إذ ندنو من مذبحك المقدس ككثرة رحمتك وإجعلنا أهلًا للسلام السمائي اللائق بلاهوتك والمملوء خلاصًا لنعطيه بعضنا لبعض بمحبة كاملة ونقبل بعضنا بعضًا بقبلة مقدسة))\nيقول الشماس:\nصلوا من أجل السلام الكامل والمحبة والقبلات الطاهرة الرسولية\nيقول الشعب:\nصلاة الصلح (لا بحاسه مرذوله)\nالقداس الكيرلسي\nالخولاجي\nصلاة حجاب أخري (ايها الرب)\n"},{"n":"4- صلاة الصلح للقديس ساويرس الأنطاكي (لا بحاسة مرذولة)","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nلا بحاسة مرذولة رافضة لمخافتك، ولا بفكر غاش مملوء من شر الخائن.\n** Not with a vile sense that defies Your fear, nor with thoughts of guile filled with the wickedness of the traitor.\n** Qen oulogicmoc an efsosf ouoh eferkata`vronin `ntekho]@ qen oumeu`i an `n`,rof ouoh efmeh `ebolqen ]metpethwou `nte pi`podotyc.\nغير متفقة نياتنا في الخبث. بل برغبة نفوسنا وتهليل قلوبنا. إذ لنا العلامة العظيمة الكاملة التي لمحبة إبنك الوحيد.\n** Nor with consciences bent on malice. But rather by the gladness of our souls and the rejoicing of our hearts. Having the great and perfect sign of the love of Your only-begotten Son.\n** Echwtp an `nje tencunidycic qen ]ponyria. Alla qen ourwoutf `nte nen'u,y@ nem ou;elyl `nte nenhyt. `Efentoten `nje pimyini etoi `nnis] ouoh etjyk `ebol@ `nte `t`agapy `mpekmonogenyc `nSyri.\nولا تطرحنا نحن عبيدك من أجل دنس خطايانا. لأنك أنت العارف كخالق جبلتنا، انه ليس مولود إمرأة يتزكي أمامك.\n** And cast us not behind, we Your servants, on account of the defilement of our sins. For You, as a creator, know our form, that no one born of a woman can be justified before You.\n** Ouoh `mperhitten `ebol qa nek`ebiaik@ e;be `p;wleb `nte nennobi. `N;ok gar etcwoun hwc refcwnt@ `mpen`placma@ je `mmon `jvo `n`chim namai `mpek`m;o.\nفإجعلنا إذاً أهلاً يا سيدنا بقلب طاهر ونفس مملوءة من نعمتك، أن نقف أمامك. ونقدم لك هذه الصعيدة المقدسة الناطقة الروحانية غير الدموية.\n** So make us worthy, O our Master, with a holy heart and a soul filled with Your grace, to stand before You. And bring in unto You this holy sacrifice, which is rational, spiritual, and bloodless.\n** `Ariten oun `nem`psa penNyb@ qen ouhyt efouab@ nem ou'u,y ecmeh `ebolqen pek`hmot@ e;ren`ohi `eraten `mpek`m;o. Ouoh `nten`ini nak `eqoun `ntai;ucia =e=;=u `nlogiky ouoh `m`pneumatiky ouoh `nat`cnof.\nصفحاً لزلاتنا، وغفراناً لجهالات شعبك. لأنك أنت إله رؤوف متحنن.\n** Unto the remission of our transgressions and the forgiveness of the ignorances of Your people. For You are a merciful and a compassionate God.\n** `Eoucun,wrycic `nte nenparaptwma@ nem ou,w `ebol `nnimetat`emi `nte peklaoc. Je `n;ok ouNou] `nrefsenhyt ouoh `nnayt.\n(وأنت الذي نرسل لك إلي فوق المجد والكرامة والعز والسجود، أيها الآب والإبن والروح القدس. الآن وكل أوان وإلي دهر الدهور. آمين).\n** (And unto You we send up the glory, the honor, the dominion, and the worship, O Father, Son and Holy Spirit. Now and at all times and unto the age of all ages. Amen.)\n** Ouoh `n;ok petenouwrp nak `e`pswi `mpi`wou@ nem pitaio@ nem pi`amahi@ nem ]`prockunycic@ `vIwt nem `pSyri nem pi`Pneuma =e=;=u. }nou nem `ncyou niben nem sa `eneh `nte ni`eneh tyrou. `Amyn.\nيقول الكاهن\n(لا بحاسة مرذولة رافضة لمخافتك ولا بفكر غاش مملوء من شر الخائن غير متفقة نياتنا في الخبث بل برغبة أنفسنا وتهليل قلوبنا إذ لنا العلامة العظيمة الكاملة التي لمحبة إبنك الوحيد ولا تطرحنا نحن عبيدك من أجل دنس خطايانا لأنك انت العارف كخالق جبلتنا انه ليس مولود إمرأة يتزكي امامك.\nفإجعلنا إذًا أهلًا يا سيدنا بقلب طاهر ونفس مملوءة من نعمتك أن نقف أمامك ونقدم لك هذه الصعيدة المقدسة الناطقة الروحانية غير الدموية صفحًا لزلاتنا وغفرانًا لجهالات شعبك لأنك أنت إله رؤوف متحنن وان تالذي نرسل لك إلى فوق المجد والكرامة والعزة والسجود أيها الآب والإبن والروح القدس الآن وكل اوان..إلخ.)\nالقداس الكيرلسي\nالخولاجي\nصلاه صلح اخري (يا إله المحبة)\nيا رئيس الحياه\n"},{"n":"5- صلاة صلح أخرى: يا إله المحبة","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nيا إله المحبة ومُعطي وحدانية القلب، ورازق الرأيْ الواحد الذي للفضيلة. الذي أنعم علينا بالوصية الجديدة بإبنك الوحيد الجنس.\n** O God of love and Giver of the oneness of heart, Provider of the oneness of mind that is of virtue. Who have granted to us the new commandment through Your only-begotten Son.\n** `V] `nte ]`agapy ouoh `vRyf] `nte ]methyt `nouwt@ ouoh `vRefcahni `nte ]`gnwmy `nouwt `nte ]`arety. Vy`etafer`hmot nan `n]entoly `mberi@ hiten pekmonogenyc `nSyri.\nلكيْ نحب بعضنا بعضاً كما أحببتنا أنت، نحن غير المستحقين الضالين. وبذلت إبنك الحبيب عن حياتنا وخلاصنا.\n** That we should love one another even as You have loved us, we the undeserving and the lost. And gave Your beloved Son for our life and salvation.\n** Hina `ntenmenre nen`eryou@ kata `vry] `n;ok `etakmenriten@ `anon qa niat`m`psa ouoh etcwrem. Ouoh ak] `mpekmenrit `nSyri `e`hryi `ejen penwnq nem penoujai.\nنسألك يا سيدنا، أنعم علينا نحن عبيدك في كل زمان حياتنا التي على الأرض، ولاسيما بالأكثر الآن. بحاسة غير ذاكرة للشرور الأولى، ونية بغير رياء، وأفكار صادقة، وقلب محب للإخوة.\n** We ask You, O our Master, to grant us Your servants, all the days of our life on earth and most particularly now. A sense that remembers not the earlier evils, and a conscience without hypocrisy, and truthful thoughts, and a heart the loves the brethren.\n** Ten]ho `erok penNyb@ `ari`hmot nan qa nek`ebiaik@ `ncyou niben `nte penwnq ethijen pikahi@ `nhou`o de mallon ]nou. `Noulogicmoc ef`iri an `m`vmeu`i `nnimethwou `nte sorp@ nem oucunidycic `natmetsobi hanmeu`i euenhot@ nem ouhyt `mmaicon.\nلكيْ نهرب من شبه يهوذا الخائن، إذ نُعطي قبلة روحية. وإذ صالحنا بعضناً بعضاً بالطهارة مثل تلاميذك القديسين الرسل، بالطهارة نتطهر، ونتقدس من قِبَل وساطة روحك القدوس.\n** That as we give a spiritual kiss, we may flee from the likeness of Judas the traitor. But having been reconciled to one another in the likeness of Your holy disciples and apostles, in purity we are purified, and become purified through the mediation of Your Holy Spirit.\n** Hina `ean] `nouacpacmoc `m`pneumatikon@ `ntenvwt `ebolha `p`ini `nIoudac pi`prodotyc. Kata de nekma;ytyc =e=;=u ouoh `n`apoctoloc@ `eanhwtp `nnen`eryou qen pitoubo entoubo ouoh eutoubo `mmon@ `ebol hiten ]metmecityc `nte Pek`pneuma =e=;=u.\n(بالنعمة والرأفات ومحبة البشر، اللواتي لإبنك الوحيد الجنس ربنا وإلهنا ومخلصنا يسوع المسيح. هذا الذي من قبله المجد والإكرام والعز والسجود تليق بك معه، مع الروح القدس المحيي المساوي لك. الآن وكل أوان وإلى دهر الدهور. آمين).\n** (Through the grace, compassion and love-of-mankind of Your only-begotten Son, our Lord, God and Savior, Jesus Christ. Through whom the glory, the honor, the dominion, and the worship are due unto You, with Him and the Holy Spirit, the Giver of life, who is of one essence with You. Now and at all times, and unto the ages of all ages. Amen.)\n** (Qen pi`hmot nem nimetsenhyt nem ]metmairwmi `nte pekmonogenyc `nSyri@ pen=o=c ouoh penNou] ouoh penCwtyr I=y=c P=,=c. Vai `ete `ebol hitotf `ere pi`wou nem pitaio nem pi`amahi nem ]`prockunycic@ er`prepi nak nemaf@ nem pi`Pneuma =e=;=u `nReftanqo ouoh `n`omooucioc nemak. }nou nem `ncyou niben nem sa `eneh `nte ni`eneh tyrou. `Amyn.)\nالشماس:\n** Deacon:\n** Pidiakwn@\nقبِّلوا بعضكم بعضاً بقُبلة مقدسة. (يا رب إرحم) [3] نعم يا رب الذي هو يسوع المسيح إبن الله، إسمعنا وإرحمنا. تقدموا على هذا الرسم، قفوا برعدة، وإلى الشرق أنظروا. ننصت.\n** Greet one another with a holy kiss. (Lord have mercy) (3) Yea, Lord, who is Jesus Christ the Son of God, hear us and have mercy upon us. Offer in order, stand with trembling, look towards the east. Let us attend.\n** Acpazec;e allylouc en vilymati `agiw. (Kurie `ele`ycon)=g ce Kurie@ `ete vai pe I=y=c P=,=c `pSyri `m`V] cwtem `eron ouoh nai nan. `Procverin kata `tropon@ `cta;yte kata `tromou@ ic `anatolac `ble'ate. `Proc,wmen.\nالشعب:\n** People:\n** Pilaoc@\nبشفاعات والدة الإله القديسة مريم، يا رب إنعم لنا بمغفرة خطايانا.\n** Through the intercessions of the Theotokos, Saint Mary O Lord grant us the forgiveness of our sins.\n** Hiten ni`precbia `nte ]:e`otokoc =e=;=u Maria@ `P=o=c `ari`hmot nan `mpi,w `ebol `nte nennobi.\nنسجد لك أيها المسيح، مع أبيك الصالح، والروح القدس، لأنك أتيت وخلصتنا.\n** We worship You O Christ, with Your good Father, and the Holy Spirit, for You have come and saved us.\n** Tenouwst `mmok `w P=,=c nem Pekiwt `n`aga;oc nem pi`Pneuma =e=;=u@ je ak`i akcw] `mmon.\nرحمة السلام، ذبيحة التسبيح.\n** A mercy of peace, a sacrifice of praise.\n** `Eleoc `irynyc ;ucia `enecewc.\nصلاة صلح أخري ليوحنا المثلث الطوبي للآب\n((يا إله المحبة ومعطي وحدانية القلب ورازق الرأي الواحد الذي للفضيلة الذي أنعم علينا بالوصية الجديدة بإبنك الوحيد الجنس لكي نحب بعضنا بعضًا كما أحببتنا انت نحن غير المستحقين الضالين وبذلت إبنك الحبيب عن حياتنا وخلاصنا نسألك يا سيدنا أنعم علينا نحن عبيدك في كل زمان حياتنا التي على الأرض ولا سيما بالأكثر الآن بحاسة غير ذاكرة للشرور الأولي ونية بغير رياء وأفكار صادقة وقلب محب للإخوة لكي نهرب من شبه يهوذا الخائن إذ نعطي قبلة روحخية وإذا صالحنا بعضنا بعضًا بالطهارة مثل تلاميذك القديسين الرسل نتطهر ونتقدس من قبل وساطة روحك القدوس بالنعمة والرأفات ومحبة البشر ... إلخ.))\nيقول الشماس: قبلوا بعضكم بعضًا بقبلة مقدسة.. إلخ.\nيقول الشعب الأسبسمس الآدام الآتي:\n((عمانوئيل إلهنا في وسطنا الآن بمجد أبيه والروح القدس ليباركنا كلنا ويطهر قلوبنا ويشفى أمراض نفوسنا وأجسادنا نسجد لك أيها المسيح مع ابيك الصالح والروح القدس لأنك أتيت وخلصتنا بشفاعات والدة الإله القديسة مريم يا رب أنعم لنا بمغفرة خطايانا.. رحمة السلام ذبيحة التسبيح.\nمستحق وعادل\nالقداس الكيرلسي\nالخولاجي\nصلاة الصلح (لا بحاسه مرذوله)\n"},{"n":"6- مستحق وعادل","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nالرب مع جميعكم.\n** The Lord be with you all.\n** `O Kurioc meta pantwn `umwn.\nالشعب:\n** People:\n** Pilaoc@\nولروحك أيضاً.\n** And with your spirit.\n** Ke meta tw `pneumatoc cou.\nإرفعوا قلوبكم.\n** Lift up your hearts.\n** `Anw `umwn tac kardiac.\nهي عند الرب.\n** We have them with the Lord.\n** `E,omen `proc ton Kurion.\nفلنشكر الرب.\n** Let us give thanks to the Lord.\n** Eu,arictycwmen tw Kuriw.\nمستحقٌ وعادل.\n** It is meet and right.\n** Axion ke dikeon.\nمستحق وعادل، مستحق وعادل، مستحق وعادل. لأنه بالحقيقة مستحق وعادل. ومقدس ولائق ونافع لنفوسنا وأجسادنا وأرواحنا.\n** Meet and right, meet and right, meet and right. For truly it is fitting and right, and holy and becoming, and profitable to our souls, our bodies, and our spirits.\n** Axion ke dikeon@ axion ke dikeon@ axion ke dikeon. Ke gar `aly;wc `fem`psa ouoh oudikeon pe@ `fouab de ouoh `fer`prepi ouoh `fernofri `nny`ete noun `m'u,y nem nencwma nem nen`pneuma.\nأيها الكائن السيد الرب الله الآب ضابط الكل، في كل زمان وبكل مكان لربوبيتك.\n** O You, THE BEING, Master, Lord, God, the Father, the Pantocrator, at all times and in all places of Your dominion.\n** Vyetsop `vNyb `P=o=c `V] `vIwt piPantokratwr@ `ncyou niben nem qen mai niben `nte tekmetnyb.\nأن نسبحك، ونرتل لك، ونباركك، ونخدمك، ونسجد لك، ونشكرك، ونمجدك. ونعترف لك ليلاً ونهاراً بشفاة غير هادئة، وقلب لا يسكت، وتمجيدات لا تنقطع.\n** To praise You, hymn You, bless You, serve You, worship You, give thanks to You, and glorify You. And confess to You night and day, with unfailing lips, with a heart that keeps not silent, and with unceasing glorifications.\n** `Ehwc `erok@ `eerhumnoc `erok@ `e`cmou `erok@ `esemsi `mmok@ `eouwst `mmok@ `esep`hmot `ntotk@ `e]`wou nak. `Eouwnh nak `ebol `njwrh de nem meri@ qen han`cvotou `nat,atotou `ebol@ nem ouhyt `nat,arwf@ nem hanmetref]`wou `na;mounk.\nأنت الذي خلق السموات وما في السموات٬ والأرض وكل ما فيها. البحار والأنهار والينابيع والبحيرات وما في جميعها.\n** You are He who has created the heavens and that which is in the heavens, the earth and everything that is therein. The seas, the rivers, the springs, the lakes, and that which is in all of them.\n** `N;ok pe vy`etaf;amio `nnivyou`i@ nem nyetqen nivyou`i@ `pkahi de nem hwb niben `ete `nqytf. Ni`amaiou@ niiarwou@ nimoumi@ nilumny@ nem ny`ete `nqytou tyrou.\nأنت هو الذي خلقت الإنسان كصورتك وكشبهك. وخلقت كل الأشياء بحكمتك.\n** You are He who has created man according to Your image and Your likeness. And You have created everything through Your wisdom.\n** `N;ok pe vy`etaf;amio `mpirwmi@ kata ;y`ete ;wk `nhikwn nem kata pek`ini. En,ai de niben ak;amiwou `ebol hiten tekcovia.\nنورك الحقيقي، إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح.\n** Your true Light, Your only-begotten Son, our Lord, God, Savior, and King of us all, Jesus Christ.\n** Pekouwini `mmyi@ pekmonogenyc `nSyri@ pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c.\nهذا الذي من قِبَله نشكر، ونقرب لك معه ومع الروح القدس، الثالوث القدوس المساوي غير المفترق، هذه الذبيحة الناطقة، وهذه الخدمة غير الدموية.\n** Through whom we give thanks and offer unto You, with Him and the Holy Spirit, the holy, co-essential, and undivided Trinity, this rational sacrifice and this bloodless service.\n** Vai `ete `ebol hitotf tensep`hmot tener`procverin nak nemaf nem pi`Pneuma =e=;=u@ ]`Triac =e=;=u `n`omooucioc ouoh `natvwrj@ `mpaisouswousi `nlogikon@ nem paisemsi `nat`cnof.\nهذه التي تقربها لك جميع الأمم. من مشارق الشمس إلي مغاربها، ومن الشمال إلى الجنوب.\n** This, which all nations offer unto You, from the east to the west and from the north to the south.\n** Vai `etouer`procverin `mmof nak `nje nie;noc tyrou. Icjen nima`nsai `nte `vry sa nefmanhwtp@ nem icjen pemhit sa `vryc.\nلأن إسمك عظيم يا رب في جميع الأمم. وفي كل مكان يقدَّم بخور لإسمك القدوس، وصعيدة طاهرة، وعلى هذه الذبيحة وهذا القربان.\n** For great is Your name, O Lord, among all the nations, and in every place incense is offered unto Your holy name, and a pure sacrifice, and upon this sacrifice and this offering.\n** Je ounis] pe pekran `P=o=c qen nie;noc tyrou ouoh qen mai niben ce`ini `nou`c;oinoufi `e`hryi `epekran =e=;=u@ nem ou;ucia ectoubyout@ `e`hryi de `ejen tai;ucia nem tai`procvora.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nيقول الكاهن:\nأو كيريوس ميطابانطون إيمون\nكي ميطاطو إبنيفماتوسو\nانو إيمون تاس كارذياس\nإيخومين إبروس طون كيريون\nإبفخاريستيسومين تو كيريو\nأكسيون كي ذيكيئون\nيقول الكاهن: الرب مع جميعكم\nيقول الشعب: ومع روحك\nيقول الكاهن: أرفعوا قلوبكم\nيقول الشعب: هي عند الرب\nيقول الكاهن: فلنشكر الرب\nيقول الشعب: مستحق وعادل\nمستحق وعادل مستحق وعادل مستحق وعادل لأنه بالحقيقة مستحق وعادل ومقدس ولائق ونافع لنفوسنا وأجسادنا وأرواحنا أيها الكائن السيد الرب الله الآب ضابط الكل في كل زمان وبكل مكان لربوبيتك أن نسبحك ونرتل لك ونباركك ونخدمك ونسجد لك ونشكرك ونمجدك ونعترف لك ليلًا ونهارًا بشفاه غير هادئة وقلب لا يسكت وتمجيدات لا تنقطع أنت هو الذي خلقت السموات ومالئ السموات والأرض وكمل ما فيها البحار والأنهخار والينابيع والبحيرات وما في جميعها انت هو الذي خلقت الإنسان كصورتك وكشبهك وخلقت كل الأشياء بحكمتك نورك الحقيقي إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح هذا الذي من قبله نشكر ونقرب لك معه ومع الروخ القدس الثالوث المقدس المساوي غير المفترق هذه الذبيحة الناطقة وهذه الخدمة غير الدموية (ههنا يرشم الكاهن درج البخور ويضع يد بخور في المجمرة ثم ياخذها بيده ويكمل قائلًا) هذه التي تقربها لك جميع الأمم (ههنا يرشم بالمجمرة على القرابين من الشرق إلى الغرب ومن الشمال إلى اليمين وهو) من مشارق الشمس إلى مغاربها ومن الشمال إلى الجنوب (ههنا يرفع البخور فوق الصينية والكأس وهو يقول) لأن أسمك عظيم يا رب في جميع الأمم وفي كل مكان يقدم بخور لإسمك القدوس وصعيدة طاهرة وعلى هذه الذبيحة وهذا القربان))\nيقول الشعب: يا رب إرحم.\nأوشية السلام\nالقداس الكيرلسي\nالخولاجي\nصلاه صلح اخري (يا إله المحبة)\n"},{"n":"7- أوشية السلام","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nنسأل ونطلب من صلاحك يا محب البشر.\n** We ask and entreat Your goodness, O Lover of mankind.\n** Ten]ho ouoh tentwbh `ntekmet`aga;oc piMairwmi.\nاذكر يا رب سلام كنيستك الواحدة الوحيدة المقدسة الجامعة الرسولية.\n** Remember, O Lord, the peace of Your one, only, holy, catholic, and apostolic Church.\n** `Ari`vmeu`i `P=o=c `n]hiryny `nte tekou`i `mmauatc =e=;=u `nka;oliky `n`apoctoliky `nEkklycia.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن سلام الكنيسة الواحدة الوحيدة المقدسة الجامعة الرسولية، وخلاص الله في الشعوب، والهدوء في كل مكان، ويغفر لنا خطايانا.\n** Pray for the peace of the one, only, holy, catholic, and apostolic Orthodox Church, for God’s salvation among the people, for stability in all places, that He may forgive us our sins.\n** Twbh `ejen ]hiryny `nte ]oui `mmauatc =e=;=u `nka;oliky `n`apoctoliky `nEkklycia@ nem `poujai `m`V] qen nilaoc nem oucemni qen mai niben@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nهذه الكائنة من أقاصي المسكونة إلي أقاصيها. كل الشعوب وكل القطعان. باركهم. السلامة التي من السموات إنزلها على قلوبنا جميعاً.\n** That which exists from one end of the world to the other. All peoples and all flocks, bless. The heavenly peace, send down into all our hearts.\n** :ai etsop icjen auryjc `n]oikoumeny sa auryjc. Nilaoc tyrou nem ni`ohi tyrou `cmou `erwou. }hiryny ]`ebol qen nivyou`i@ myic `e`qryi `enenhyt tyrou.\nبل وسلامة هذا العمر أنعم بها علينا إنعاماً. الرئيس (الملك) والجند والأراخنة والمشيرين والجموع وجيراننا ومداخلنا ومخارجنا، زينهم بكل سلام.\n** Even the peace of this life, graciously grant to us. The leader (king), the armies, the chiefs, the counselors, the multitudes, our neighbors, our coming in and our going out, adorn them with all peace.\n** Alla nem ]kehiryny `nte paibioc vai@ `ari,arizec;e `mmoc nan `n`hmot. Piar,y (piouro) nimetmatoi niar,wn nico[ni nimys nen;eseu@ nenjinmosi `eqoun nem nenjinmosi `ebol@ celcwlou qen hiryny niben.\nيا ملك السلام، أعطنا سلامك، لأن كل شئ قد أعطيتنا. اقتننا لك يا الله مخلصنا لأننا لا نعرف آخر سواك. إسمك القدوس هو الذي نقوله.\n** O King of peace, grant us Your peace; for You have given us all things. Acquire us to Yourself, O God our Savior, for we know none other but You. Your holy name we utter.\n** `Pouro `nte ]hiryny moi nan `ntekhiryny@ hwb gar niben aktyitou nan. `Jvon nak `V] penCwtyr@ je tencwoun `nkeouai an `ebyl `erok. Pekran =e=;=u petenjw `mmof.\nفلتحيا نفوسُنا بروحك القدوس. ولا تدع موت الخطية يقوى علينا، نحن عبيدك، ولا على كل شعبك.\n** May our souls live by Your Holy Spirit. And let not the death of sin have dominion over us, we Your servants, nor over all Your people.\n** Marouwnq `nje ny`ete noun `m'u,y hiten Pek`pneuma =e=;=u. Ouoh `mpen`;refjemjom `eron `anon qa nek`ebiaik@ `nje `vmou `nte hannobi@ oude qa peklaoc tyrf.\nأوشية السلام\nيقول الكاهن ((نسأل ونطلب من صلاحك يا محب البشر أذكر يا رب سلام كنيستك الواحدة الوحيدة المقدسة الجامعة الرسولية))\nيقول الشماس: (إطلبوا عن سلام الكنيسة الواحدة الوحيدة المقدسة الجامعة الرسولية وخلاص الله في الشعوب والهدوء في كل مكان ويغفر لنا خطايانا))\nيقول الشعب: يا رب ارحم\nيقول الكاهن:\nهذه الكائنة من أقاصي المسكونة إلى أقاصيها كل الشعوب وكل القطعان باركهم السلام التي من السموات أنزلها على قلوبنا جميعًا بل وسلامة هذا العمر أنعم بها علينا إنعامًا الملك والجند والرؤساء والوزراء والمبشرين والجموع وجيراننا ومداخلنا ومخارجنا زينهم بكل سلام يا ملك السلام اعطنا سلامك لأن كل شي قد أعطيتنا اقتتنا لك يا الله مخلصنا لأننا لا نعرف أخر سواك اسمك القدوس هو الذي نقوله فلتحيي نفوسنا بروحك القدوس ولا تدع موت الخطايا يقوي يقوي علينا نحن عبيدك ولا على كل شعبك)).\nيقول الشعب:\nاوشية المرضى\nالقداس الكيرلسي\nالخولاجي\nمستحق وعادل\n"},{"n":"8- أوشية المرضى","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nمرضى شعبك.\n** The sick among Your people.\n** Nyetswni `nte peklaoc.\nالشماس:\n** Deacon:\n** Pidiakwn@\nأُطلبوا عن آبائنا وإخوتنا المرضى بكل مرضٍ، إن كان في هذا المسكن أو بكل موضع، لكي المسيح إلهنا ينعم لنا ولهم بالعافية والشفاء، ويغفر لنا خطايانا.\n** Pray for our fathers and our brethren who are sick with any sickness, whether in this place or in any place, that Christ our God may grant us, with them, health and healing, and forgive us our sins.\n** Twbh `ejen nenio] nem nen`cnyou etswni qen jinswni niben@ `ite qen paitopoc `ite qen mai niben@ hina `nte P=,=c penNou] er`hmot nan nemwou `mpioujai nem pital[o@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nتعهَّدهم بالمراحم والرأفات إشفهم. إنزع عنهم وعنا كل مرضٍ وكل سقمٍ، وروح الأمراض أطرده.\n** You have visited them with mercies and compassion, heal them. Take away from them and from us, all sickness and all disease; the spirit of sickness chase away.\n** `Eakjem pousini qen hannai nem hanmetsenhyt matal[wou. `Aliou`i `ebol harwou nem `ebol haron `nswni niben nem iabi niben@ pi`pneuma `nte niswni [oji `ncwf.\nوالذين أبطأوا مطروحين في الأمراض أقمهم وعزهم. والمعذبين من الأرواح النجسة، اعتقهم جميعاً.\n** Those who have long lain in sickness raise up and comfort. Those who are afflicted by unclean spirits, set them all free.\n** Ny`etauwck eu`styout qen niiabi matounocou ouoh manom] nwou. Nyet`themkyout `ntotou `nni=p=n=a `n`aka;rton `aritou tyrou `nremhe.\nالذين في السجون أو المطابق، أو الذين في النفي أو السبي أو المقبوض عليهم في عبودية مرة، يا رب اعتقهم جميعهم وإرحمهم. لأنك أنت الذي تحل المربوطين وتقيم الساقطين.\n** Those who are in prisons or dungeons, those who are in exile or captivity, and those who are held in bitter bondage, O Lord, set them all free and have mercy upon them. For You are He who loosens the bound and uplifts the fallen.\n** Nyet qen ni`stekwou@ ie nimet`alwc@ ie nyet,y qen niexorictia@ ie nie,malwcia@ ie ny `etou`amoni `mmwou qen oumetbwk ecensasi@ `P=o=c `aritou tyrou `nremhe ouoh nai nwou. Je `n;ok petbwl `nnyetcwnh `ebol@ ouoh ettaho `eratou `nny-`etauraqtou `e`qryi.\nرجاء من ليس له رجاء، ومعين من ليس له معين. عزاء صغيري القلوب، ميناء الذين في العاصف. كل الأنفس المتضايقة، والمقبوض عليها.\n** The hope of those who are have no hope and the help of those who have no helper. The comfort of the fainthearted, the harbor of those in the storm. All souls that are distressed or bound, grant them mercy, O Lord.\n** }helpic `nte ny`ete `mmon tou helpic@ ]bo`y;ia `nte ny`ete `mmon tou bo`y;oc. `:nom] `nte nyetoi `nkouji `nhyt@ pilumyn `nte nyet,y qen pi,imwn. \"u,y niben ethejhwj ouoh `etou`amoni `ejwou.\nأعطها يا رب رحمةَ، أعطها نياحاً، أعطها برودة، أعطها نعمة، أعطها معونة، أعطها خلاصاً، أعطها غفران خطاياها وآثامها.\n** Grant them rest, grant them refreshment, grant them grace, grant them help, grant them salvation, grant them the forgiveness of their sins and their iniquities.\n** Moi nwou `P=o=c `nounai@ moi nwou `nou`mton@ moi nwou `nou`,bob@ moi nwou `nou`hmot@ moi nwou `noubo`y;ia@ moi nwou `noucwtyria@ moi nwou `noumetref,w `ebol `nte nounobi nem nou`anomia.\nونحن أيضاً يا رب، أمراض نفوسنا، إشفها والتي لأجسادنا، عافها. أيها الطبيب الحقيقي الذي لأنفسنا، وأجسادنا، يا مدبر كل جسدٍ تعهدنا بخلاصك.\n** As for us also, O Lord, the maladies of our souls, heal; and those of our bodies too, do cure. O You, the true Physician of our souls and our bodies, the Bishop of all flesh, visit us with Your salvation.\n** `Anon de hwn `P=o=c niswni `nte nen'u,y matal[wou@ ouoh na nenkecwma `arivaqri `erwou. Picyini `mmyi `nte nen'u,y nem nencwma@ pi`Epickopoc `nte carx niben@ jempensini qen pekoujai.\nيقول الشماس\n((أطلبوا عن آباءنا وأخوتنا المرضي بكل مرض إن كان في هذا المسكن أو بكل موضع لكي المسيح إلهنا ينعم علينا وعليهم بالعافية والشفاء ويغفر لنا خطايانا.))\nيقول الشعب\nيقول الكاهن\n((تعهدهم بالمراحم والرأفات إشفهم إنزع عنهم وعنا كل مرض وكل سقم وروح الأمراض أطرده والذين أبطأوا مطروحين في الأمراض أقمهم وعزهم والمعذبون من الأرواح النجسة أعتقهم جميعًا الذينت في السجون أو المطابق أو الذين في النفي أو السبي أو المقبوض عليهم في عبودية مرة يا رب إعتقهم جميعًا وإرحمهم أنك أنت الذي تحل المربوطين وتقيم الساقطين رجاء من ليس له معين من ليس له معين عزاء صغيري القلوب ميناء الذين في العاصف كل الأنفس المتضايقة أو المقبوض عليها أعطها يا رب رحمة أعطها راحة أعطها برودة أعطها نعمة أعطها معونة أعطها خلاصًا أعطها غفران خطاياها وآثامها ونحن أيضًا يا رب أمراض نفوسنا إشفها والتي لأجسادنا عافها أيها الطبيب الحقيقي الذي لأنفسنا وأجسادنا يا مدبر كل جسد تعهدنا بخلاصك)).\nبالنعمة والرأفات ومحبة البشر التي لإبنك الوحيد الجنس ربنا وإلهنا ومخلصنا يسوع المسيح.\nآوشية المسافرين\nالقداس الكيرلسي\nالخولاجي\nأوشية السلام\n"},{"n":"9- أوشية المسافرين","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nآباءنا وإخوتنا المسافرون.\n** Our fathers and our brethren who are traveling.\n** Nenio] nem nen`cnyou `etause `e`psemmo.\nالشماس:\n** Deacon:\n** Pidiakwn@\nأُطلبوا عن آبائنا واخوتنا المسافرين، والذين يضمرون السفر في كل موضع، لكي يُسهل طرقهم أجمعين، ان كان في البحر أو الأنهار، أو البحيرات أو الطرق المسلوكة أو الجو أو المسافرين بكل نوع، لكي المسيح إلهنا يردهم إلى مساكنهم سالمين، ويغفر لنا خطايانا.\n** Pray for our fathers and our brethren who are traveling, or those who intend to travel anywhere, that God may straighten all their ways, whether by sea, rivers, lakes, roads, (air) or those who are traveling by any other means, that Christ our God may bring them back to their own homes in peace, and forgive us our sins.\n** Twbh `ejen nenio] nem nen`cnyou `etause `e`psemmo@ ie nye;meu`i `ese qen mai niben@ coutwn noumwit tyrou@ `ite `ebol hiten `viom@ ie niiarwou@ ie nilumny ie nimwit `mmosi@ (ie pi`ayr) ie eu`iri `mpoujinmosi `nry] niben@ hina `nte P=,=c penNou] tac;wou `eny`ete nouou `mmanswni qen ouhiryny@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nوالذين يضمرون السفر في كل مكان سهل طرقهم أجمعين، ان كان في البحر أو الأنهار أو البحيرات أو الطرق المسلوكة،أو الجو أو السالكين بكل نوع، كل أحد بكل موضع، ردهم إلى ميناء هادئة، ميناء الخلاص. تفضل إصحبهم في الإقلاع، وإصحبهم في المسير.\n** And those who intend to travel anywhere, straighten all their ways, whether by sea, rivers, lakes, roads, (air) or those who are traveling by any other means, everyone anywhere. Lead them into a haven of calm, a haven of safety. Graciously accompany them in their departure and be their companion in their travel.\n** Ie nye;meu`i `ese qen mai niben@ coutwn noumwit tyrou@ `ite `ebol hiten `viom@ ie niiarwou@ ie nilumny@ ie nimwit `mmosi@ ie nimwit ie eu`iri `mpoujinmosi `nry] niben@ ouon niben etqen mai niben@ ma`tvwou `eqoun `eoulumyn `njamy@ `eoulumyn `nte pioujai. `Arikataxioin `ari`svyr `n`s[yr nem `svyr `mmosi nemwou.\nردهم إلى منازلهم بالفرح فرحين، وبالعافية معافين. إشترك في العمل مع عبيدك في كل عمل صالح.\n** Bring them back to their own, rejoicing with joy and safe in security. In work, be a partner with Your servants in every good deed.\n** Myitou `eny`ete nouou qen ourasi eurasi@ qen outoujo eutoujyout. `Ari`svyr `nerhwb nem nek`ebiaik qen hwb niben `n`aga;on.\nونحن أيضاً يا رب غربتنا التي في هذا العمر، إحفظها بغير مضرة ولا عاصف ولا قلق إلى الإنقضاء.\n** As for us, O Lord, keep our sojourn in this life without harm, without storm, and undisturbed to the end.\n** `Anon de hwn `P=o=c tenmetrem`njwili etqen paibioc vai@ `areh `eroc `nateblaby `nat,imwn `nat`s;orter sa `ebol.\nيقول الكاهن\nآباؤنا وأخوتنا المسافرين\nيقول الشماس\nأطلبوا عن آباءنا وأخوتنا المسافرين الذين يضمرون السفر في كل موضع لكي\nيسهل طرقهم أجمعين إن كان في البحر أو الأنهار أو البحيرات او الطرق المسلوكة أو المسافرين بكل نوع لكي المسيح إلهنا يردهم إي مساكنهم سالمين ويغفر لنا خطايانا ))\nيقول الشعب:\n((والذين يضمرون السفر في كل مكان سهل طرقهم أجمعين إن كان في البحر\nأو الأنهار أو البحيرات أو الطرق المسلوكة او السالكين بكل نوع كل أحد بكل موضع ردهم إلى ميناء هادئة ميناء الخلاص تفضل إصحبهم في الإقلاع وإصحبهم في المسير ردهم إلى منازلهم بالفرح فرحين وبالعافية معافين\nإشترك في العمل مع عبيدك في كل عمل صالح ونحن أيضًا يا رب غربتنا في هذا العمر إحفظها بغير مضرة ولا عاصف ولا قلق إلى الانقضاء))\nأواشي المياه والزروع والثمار\nالقداس الكيرلسي\nالخولاجي\nاوشية المرضى\n"},{"n":"10- أواشي المياه و الزروع و الثمار","t":"داخل مصر، من 12 بؤونة إلى 9 بابة (19 يونيو - 19/20 أكتوبر)، تقال اوشية المياه:\n** Within Egypt, from 12 Baona to 9 Babah (19 June - 19/20 October), the litany of the waters is said:\nالكاهن:\n** Priest:\n** Pi`precbuteroc@\nتفضل يا رب مياه النهر، باركها.\n** Graciously accord, O Lord, to bless the waters of the river.\n** `Arikataxion `P=o=c nimwou `nte `viaro@ `cmou `erwou.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن صعود مياه الأنهار في هذا السنة، لكيْ يباركها المسيح إلهنا، ويصعدها كمقدارها، ويفَرِّح وجه الأرض، ويعولنا نحن البشر، ويهب النجاة للبهائم، ويغفر لنا خطايانا.\n** Pray for the rising of the waters of the rivers this year, that Christ our God may bless them and raise them according to their measure, that He may give joy to the face of the earth, sustain us, the sons of men, save the cattle, and forgive us our sins.\n** Twbh `ejen `pjinmosi `e`pswi `nte niiarwou `mmwou qen tairompi ;ai@ hina `nte P=,=c penNou] `cmou `erwou@ `ntef`enou `e`pswi kata nousi@ `ntef] `m`pounouf `m`pho `m`pkahi@ `ntefsanousten qa nisyri `nte nirwmi@ `ntef] `m`vnohem `nnitebnwou`i@ `ntef,a nennobi nan `ebol.\nمن 10 بابه إلى 10 طوبة (20/21 أكتوبر - 18/19 يناير)، تقال اوشية الزروع:\n** From 10 Babah to 10 Tobah (20/21 October - 18/19 January), the litany of the plants is said:\nتفضل يا رب الزروع والعشب، ونبات الحقل في هذه السنة، باركها.\n** Graciously accord, O Lord, to bless the seeds, the herbs, and the plants of the field this year.\n** `Arikataxion `P=o=c nici] nem nicim nem nirwt `nte `tkoi etqen tairompi ;ai@ `cmou `erwou.\nاطلبوا عن الزروع والعشب، ونبات الحقل في هذه السنة، لكيْ يباركها المسيح إلهنا لتنمو وتكثر إلى أن تكمل بثمرة عظيمة، ويتحنن على جبلته التي صنعتها يداه، ويغفر لنا خطايانا.\n** Pary for the seed, the herbs, and the plants of the field this year, that Christ our God may bless them to grom and multiply unto perfection with great fruit, have compassion on His creation which His hands have made, and forgive us our sins.\n** Twbh `ejen nici] nem nicim nem nirwt `nte `tkoi qen tairompi ;ai@ hina `nte P=,=c penNou] `cmou `erwou@ `ntouaiai ouoh `ntou`asai sa`ntoujwk `ebol qen ounis] `nkarpoc@ ouoh `ntefsenhyt qa pef`placma `eta nefjij ;amiof@ `ntef,a nennobi nan `ebol.\nمن 11 طوبه إلى 11 بوؤنه (19/20 يناير - 18 يونيو)، تقال أوشية الثمار:\n** From 11 Tobah to 11 Baona (19/20 January - June 18), the litany of the fruits is said:\nتفضل يا رب أهوية السماء، وثمرات الأرض في هذه السنة، باركها.\n** Graciously accord, O Lord, to bless the air of heaven and the fruits of this earth this year.\n** `Arikataxion `P=o=c ni`ayr `nte `tve nem nikarpoc `nte `pkahi qen tairompi ;ai@ `cmou `erwou.\nاطلبوا عن أهوية السماء، وثمرات الأرض، والشجر والكروم وكل شجرة مثمرة في كل المسكونة، لكي يباركها المسيح إلهنا، ويكملها سالمة بغير ألم، ويغفر لنا خطايانا.\n** Pray for the air of the heaven, the fruits of the earth, the trees, the vines, and for every fruit-bearing tree in all the world, that Christ our God may bless them, bring them to perfection in peace without harm, and forgive us our sins.\n** Twbh `ejen ni`ayr `nte `tve@ nem nikarpoc `nte `pkahi@ nem va ni`ssyn nem va nima`n`aloli@ nem `ssyn niben `nref]karpoc etqen ]oikoumeny tyrc@ hina `nte P=,=c penNou] `cmou `erwou@ `ntefjokou `ebolqen ouhiryny a[ne `mkah@ `ntef,a nennobi nan `ebol.\nخارج مصر، تقال الثلاثة أواشي معاً:\n** Outside Egypt, the three litanies are said combined:\nأذكر يا رب أهوية السماء، وثمرات الأرض، ومياه النهر، والزروع والعشب ونبات الحقل في هذه السنة، باركها.\n** Graciously accord, O Lord, to bless the air of heaven, the fruits of the earth, the waters of the river, the seeds, the herbs, and the plants of the field this year.\n** `Arikataxioin `P=o=c ni`ayr `nte `tve nem nikarpoc `nte `pkahi@ nem nimwou `nte `viaro@ nem nici] nem nicim nem nirwt `nte `tkoi@ etqen tairompi ;ai@ `cmou `erwou.\nاطلبوا عن أهوية السماء، وثمرات الأرض، وصعود مياه الأنهار، والزروع والعشب ونبات الحقل، لكي يباركها المسيح إلهنا، ويتحنن على جبلته التي صنعتها يداه، ويغفر لنا خطايانا.\n** Pray for the air of heaven, the fruits of the earth, the rising of the waters of the rivers, the seeds, the herbs, and the plants of the field, that Christ our God may bless them, have compassion on His creation which His hands have made, and forgive us our sins.\n** Twbh `ejen ni`ayr `nte `tve nem nikarpoc `nte `pkahi@ `pjinmosi `e`pswi `nte niiarwou `mmwou@ nici] nem nicim nem nirwt `nte `tkoi@ hina `nte P=,=c penNou] `cmou `erwou@ ouoh `ntefsenhyt qa pef`placma `eta nefjij ;amiof@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم. يا ربُ إرحم. يا ربُ إرحم.\n** Lord have mercy. Lord have mercy. Lord have mercy.\n** Kurie `ele`ycon. Kurie `ele`ycon. Kurie `ele`ycon.\nإصعدها كمقدارها كنعمتك. فرح وجه الأرض. ليرو حرثها ولتكثر أثمارها. أعدها للزرع والحصاد. ودبر حياتنا كما يليق.\n** Raise them to their measure according to Your grace. Give joy to the face of the earth. May its furrows be abundantly watered and its fruits be plentiful. Prepare it for sowing and harvesting. Manage our lives as deemed fit.\n** `Anitou `e`pswi kata nousi kata vy `ete vwk `n`hmot@ ma`pounof `m`pho `m`pkahi. Marou;iqi `nje nef;lwm@ marou`asai `nje nefoutah. Cebtwtf oujroj nem ouwcq. Ouoh `arioikonomin `mpenjinwnq kata peternofri.\nبارك إكليل السنة بصلاحك من أجل فقراء شعبك، من أجل الأرملة واليتيم، والغريب والضيف، ومن أجلنا كلنا نحن الذين نرجوك ونطلب إسمك القدوس. لأن أعين الكل تترجاك، لأنك أنت الذي تعطيهم طعامهم في حين حسن.\n** Bless the crown of the year with Your goodness for the sake of the poor of Your people, the widow, the orphan, the traveler, the stranger, and for the sake of us all who entreat You and seek Your holy name. For the eyes of everyone wait upon You, for You give them their food in due season.\n** `Cmou `epi`,lom `nte ]rompi hiten tekmet`,ryctoc@ e;be nihyki `nte peklaoc@ e;be ],yra nem piorvanoc nem pisemmo nem pirem`njwili@ nem e;byten tyren qa nyeterhelpic `erok ouoh ettwbh `mpekran =e=;=u. Je nenbal `nouon niben ceerhelpic `erok@ je `N;ok et] `ntou`qre nwou qen oucyou `enanef.\nإصنع معنا حسب صلاحك، يا معطياً طعاماً لكل جسد. املأ قلوبنا فرحاً ونعيم، لكي نحن أيضاً إذ يكون لنا الكفاية في كل شئ، كل حين نزداد في كل عمل صالح.\n** Deal with us according to Your goodness, O You who give food to all flesh. Fill our hearts with joy and gladness that we too, having sufficiency in every thing always, may abound in every good deed.\n** `Ariou`i neman kata tekmet`aga;oc@ vy et]`qre `ncarx niben moh `nnenhyt `nrasi nem ouounof@ hina `anon hwn `ere `vrwsi `ntoten qen hwb niben `ncyou niben@ `ntenerhou`o qen hwb niben `n`aga;on.\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nيقول الكاهن\nاواشي المياه والزروع والثمار كل أوان بأوانه أى من ثاني عشر بؤونة إلى تاسع بابه يقول أوشية المياه هذه (تفضل يا رب مياه النهر باركها))\nيقول الشماس\n((أطلبوا عن صعود مياه الأنهار في هذه السنة لكي يباركها المسيح إلهنا ويصعدها\nكمقدارها ويفرح وجه الأرض ويعولنا نحن البشر ويهب النجاة للحيوان ويغفر لنا خطايانا))\nيقول الشعب\nومن عاشر بابه إلى عاشر طوبة يقول الكاهن أوشية الزروع هذه (تفضل يا رب الزروع والعشب ونبات الحقل في هذه السنة باركها))\n((أطلبوا عن الزروع والعشب ونبات الحقل في هذه النسة لكي يباركها المسيح إلهنا لتنمو وتكثر إلى أن تكمل بثمرة عظيمة ويتحنن على جبلته التي صنعتها يداه\nويغفر لنا خطايانا))\nومن حادي عشر طوبة إلى حادي عشر بؤونة يقول الكاهن أوشية الثمار هذه (تفضل يا رب أهوية السماء وثمرات الأرض في هذه السنة باركها))\n((أطلبوا عن أهوية السماء وثمرات الأرض والشجر والكروم وكل شجرة مثمرة في كل المسكونة لكي يباركها المسيح إلهنا ويكملها سالمة بغير آفة ويغفر لنا خطايانا))\nوفي كل أوشية من هذه الثلاث يكمل الكاهن قائلًا:\n((أصعدها حسب مقدارها كنعمتك فرح وجه الأرض ليرو حرثها ولتكثراثمارها أعدها\nللزرع والحصاد ودبر حياتنا كما يليق بارك أكليل السنة بصلاحك من أجل فقراء شعبك من أجل الأرملة واليتيم والغريب والضيق ومن أجل كلنا نحن الذين نرجوك ونطلب إسمك القدوس لأن أعين الكل تترجاك لأنك انت الذي تعطيهم طعامهم في حين\nحسن إصنع معنا حسب صلاحك يا معطيًا طعامًا لكل جسد إملأ قلوبنا فرحًا و\nنعيمًا لكي نحن أيضًا إذ يكون لنا الكفاف في كل شيء كل حين نزداد في كل عمل صالح))\nإوشية الملك أو الرئيس\nالقداس الكيرلسي\nالخولاجي\nآوشية المسافرين\n"},{"n":"11- أوشية الملك أو الرئيس","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nرئيس (ملك) أرضنا عبدك.\n** The leader (king) of our land, Your servant.\n** Piar,y (piouro) `nte penkahi pekbwk.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا لكي المسيح إلهنا يعطينا رحمة ورأفة أمام الرؤساء الأعزاء، ويعطف قلوبهم علينا بالصلاح في كل حين، ويغفر لنا خطايانا.\n** Pray that Christ our God may grant us mercy and compassion before the mighty sovereigns, and soften their hearts towards us for that which is good at all times, and forgive us our sins.\n** Twbh hina `nte P=,=c penNou] tyiten `nhannai nem hanmetsenhyt `mpe`m;o `nniexoucia et`amahi@ `ntefermalazin `mpouhyt `eqoun `eron `epi`aga;on `ncyou niben@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nأحفظه بسلام وعدل وجبروت. ولتخضع له كل الأمم الذين يريدون الحرب في جميع ما لنا من الخصب.\n** Keep him in peace, truth, and strength. Subject under him all the barbarians, the nations that desire war against all our fertile lands.\n** `Areh `erof qen ouhiryny nem oume;myi nem oumetjwri. Marou[nejwou naf tyrou `nje nibarbaroc@ nie;noc nye;ouws `nnibwtc@ `proc ;y`ete ;wn tyrou `neu;enia.\nتكلم في قلبه من أجل سلام كنيستك الواحدة الوحيدة المقدسة الجامعة الرسولية. أعطه أن يفكر بالسلام فينا وفي إسمك القدوس.\n** Speak to his heart concerning the peace of Your one, only, holy, catholic, and apostolic Church. Grant to him that he may think peaceably towards us and towards I Your holy name.\n** Caji `e`qryi `epefhyt e;be ]hiryny `nte tekou`i `mmauatc =e=;=u `nka;oliky `n`apoctoliky `nEkklycia. Myic naf `emeu`i `ehanhirynikon `eqoun `eron nem
