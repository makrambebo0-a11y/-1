he prophets, the apostles, the preachers, the evangelists, the martyrs, the confessors, and all the spirits of the righteous perfected in the faith.\n** Nenio] =e=;=u@ nipatrar,yc ni`provytyc ni`apoctoloc nirefhiwis nieuaggelictyc nimarturoc ni`omologityc@ nem `pneuma niben `n`;myi `etaujwk `ebol qen `vnah].\nوبالأكثر القديسة المملوءة مجداً العذراء كل حين، والدة الإله الطاهرة القديسة مريم. والقديس يوحنا السابق المعمدان والشهيد.\n** Most of all, the pure, full-of-glory, ever-Virgin, holy Theotokos, Saint Mary. And Saint John the forerunner, baptist, and martyr.\n** `Nhou`o de ;y=e=;=u `;meh `n`wou etoi `mPar;enoc `ncyou niben@ ]:e`otokoc =e=;=u@ ]`agia Maria. Nem pi`agioc Iwannyc pi`prodromoc `mbaptictyc ouoh `mmarturoc.\nوالقديس إسطفانوس أول الشمامسة وأول الشهداء. والقديس مرقس الرسول الطاهر الإنجيلي والشهيد. والبطريرك القديس ساويرس. والقديس كيرلس، والقديس باسيليوس. والقديس إغريغوريوس.\n** Saint Stephen the protodeacon and protomartyr. Saint Mark the holy apostle, Evangelist, and martyr. The patriarch Saint Severus, Saint Cyril, Saint Basil, Saint Gregory.\n** Nem pi`agioc `Ctevanoc pi`prwtodiakonoc ouoh `m`prwtomarturoc. Nem pi`agioc Markoc pi`apoctoloc =e=;=u `neuaggelictyc ouoh `mmarturoc. Nem pipatriar,yc =e=;=u Ceuyroc@ nem pi`agioc Kurilloc@ nem pi`agioc Bacilioc@ nem pi`agioc `Grygorioc.\nوأبانا الصديق العظيم أنبا أنطونيوس، والبار أنبا بولا، والثلاثة أنبا مقارات القديسين.\n** Our righteous father, the great Abba Anthony, the righteous Abba Paul, the three saints Abba Macarii.\n** Nem peniwt `ndikeoc pinis] abba Antwni@ nem pi`;myi abba Paule@ nem pisomt =e=;=u abba Makari.\nوأبانا أنبا يحنس، وأبانا أنبا بيشوي، وأبوينا القديسين الروميين مكسيموس ودوماديوس. والتسعة والأربعين شهيداً، والقوي أنبا موسى.\n** Our father Abba John, our father Abba Pishoy, our holy Roman fathers Maximus and Dometius, the forty-nine martyrs, the strong saint Abba Moses.\n** Nem peniwt abba Iwannyc@ nem peniwt abba Piswi@ nem nenio] =e=;=u `nRwmeoc Maximoc nem Dometioc@ nem pi`hme 'it (=m=;) `mmarturoc@ nem pijwri abba Mwcy.\nوأبانا أنبا باخوم أبا الشركة، وأبانا أنبا شنودة رئيس المتوحدين، وأبانا أنبا نُفِر السائح، وأبانا أنبا صموئيل المعترف. (وأبانا أنبا أبرآم، أسقف الفيوم والجيزة.)\n** Our father Abba Pachom of the Koinonia, our father Abba Shenoute the archmandrite, our father Abba Nopher the anchorite, and our father Abba Samuel the confessor. (And Abba Abraam the Bishop of Fayom and Giza.)\n** Nem peniwt abba Paqwm `viwt `n]koinwnia@ nem peniwt abba Senou] piar,yman`drityc@ nem peniwt abba Noufer pi`ana,writyc@ nem peniwt abba Camouyl pi`omologityc. (Nem peniwt =e=;=u abba Abraam@ pi`epickopoc `nte Viom nem Jiza.)\nوكل مصاف قديسيك.\n** And all the choir of Your saints.\n** Nem `p,oroc tyrf `nte ny=e=;=u `ntak.\nإننا يا سيدنا لسنا أهلاً أن نتشفع في طوباوية أولئك. بل هم قيام أمام منبر إبنك الوحيد.\n** Not that we are worthy, O our Master, of the intercession for the blessedness of those saints, but rather they are standing before the throne of Your only-begotten Son.\n** Ou, `oti je `anon `vNyb etem`psa `ner`precbeuin `e`hryi `ejen `;metmakarioc `nte ny`ete `mmau. Alla je `n;wou eu`ohi `eratou nahren pibyma `nte pekmonogenyc `nSyri.\nليكونوا عوضاً عنا، يشفعون في مسكنتنا وضعفنا.\n** That they may be in our stead, interceding for our poverty and our frailty.\n** `Ntouswpi `nsebiw `ner`precbeuin@ `e`hryi `ejen tenmethyki nem tenmetjw.\nكُن غافراً لأثامنا، من أجل طلباتهم المقدسة، ومن أجل إسمك المبارك الذي دعي علينا.\n** May You be a forgiver of our iniquities, for the sake of their holy prayers and for the sake of Your holy name which is called upon us.\n** Swpi `nref,w `ebol `nnen`anomia@ e;be nou]ho =e=;=u@ nem e;be pekran et`cmarwout@ `etaumou] `mmof `e`hryi `ejwn.\nالمجمع\nيقول الكاهن\n((أباؤنا وأخوتنا الذين رقدوا إذ قبضت نفوسهم نيحهم ذاكرًا أيضًا جميع القديسين الذين أرضوك منذ البدء أباءنا الأطهار رؤساء الآباء والأنبياء والرسل والمبشرين والإنجيليين والشهداء والمعترفين وكل أرواح الصديقين الذين كملوا في الإيمان، وبالأكثر القديسة المملوءة مجدًا العذراء كل حين والدة الإله الطاهرة القديسة مريم والقديس يوحنا السابق المعمدان والشهيد والقديس إستيفانوس أول الشمامسة واول الشهداء والقديس مرقس الرسول الطاهر الإنجيلي والشهيد والبطريرك القديس ساويرس والقديس كيرلس والقديس باسيليوس والقديس إغريغوريوس وأبونا الصديق العظيم أنبا أنطونيوس والبار انبا بولا والثلاثة أنبا مقارات القديسين وأبانا أنبا يحنس وأبونا أنبا بيشوي وأبوانا القديسان الروميان مكسيموس ودماديوس والتسعة والأربعون شهيدًا والقوي أنبا موسي والقديس إيسيذوروس وأبونا أنبا باخوم أبو الشركة وأبونا انبا شنودة رئيس المتوحدين وأبانا انبا نوفر السائح وأبونا أنبا صموئيل المعترف وكل مصاف قديسيك))\nثم يقول الكاهن بلحن أيوب (بلحن الحزن)\n((إننا يا سيدنا لسنا أهلًا أن نتشفع في طوباوية اولئك القديسين بل هم القيام أمام منبر إبنك الوحيد ليكونوا هم عوضًا عنا يتشفعون في مسكنتنا وضعفنا (يصرخ هنا ويقول) كن غافرًا لخطايانا تاركًا لآثامنا من أجل طلباتهم المقدسة ومن أجل إسمك العظيم المبارك الذي دعي علينا))\nالقارئون فليقولوا (الترحيم)\nالقداس الكيرلسي\nالخولاجي\nإوشية الملك أو الرئيس\n"},{"n":"13- القارئون / الترحيم","t":"الشماس:\n** Deacon:\n** Pidiakwn@\nالقارئون فليقولوا أسماء آبائنا البطاركة القديسين الذين رقدوا. الرب ينيح نفوسهم أجمعين، ويغفر لنا خطايانا.\n** Let those who read, recite the names of our holy fathers, the patriarchs who have fallen asleep. O Lord repose their souls and forgive us our sins.\n** Nyetws maroutaouo `nniran@ `nte nenio] =e=;=u `mpatria,yc `etauenkot. `P=o=c ma`mton `nnou'u,y tyrou@ ouoh `ntef,a nennobi nan `ebol.\nالكاهن (سراً):\n** Priest (inaudibly):\n** Pi`precbuteroc@\nاذكر يا رب آبائنا القديسين الأرثوذكسيين رؤساء الأساقفة الذين سبقوا فرقدوا، هؤلاء الذين سبقوا فرقدوا، هؤلاء الذين فصلوا كلمة الحق بإستقامة.\n** Remember, O Lord, out holy fathers the orthodox archbishops who have already fallen asleep, those who have rightly divided the word of truth.\n** `Ari`vmeu`i `P=o=c `nnenkeio] =e=;=u `nor;odoxoc ouoh `nar,y`epickopoc `etauersorp `nenkot@ nai `etauswt `ebol `m`pcaji `nte ]me;myi qen oucwouten.\nوأعطنا نحن أيضاً حظاً ونصيباً معهم، ذاكراً أيضاً هؤلاء الذين نذكرهم في يومنا هذا.\n** And give us, we too, a share and an inheritance with them, remembering also those whom we mention this very day.\n** Ouoh moi nan hwn `noumeroc nem ou`klyroc nemwou@ ek`iri on `m`vmeu`i `nnai `eten`iri `mpoumeu`i qen pai`ehoou `nte voou.\nلبطريرك محدد يقال:\n** For a Specific Patriarch, this prayer is said instead of the previous, audibly:\nالكاهن:\n** Priest:\nاذكر يا رب نفس أبينا البطريرك البابا الأنبا (كيرلس السادس).\n** Remember, O Lord, the soul of our father the patriarch Papa Abba (Kerrelos VI).\n** `Ari`vmeu`i `P=o=c `t'u,y `mpeniwt `mpatriar,yc papa abba (Kurilloc pimahcoou).\nاطلبوا عن نفس الأب المكرم، البابا أنبا (كيرلس السادس)، لكيْ الرب الإله ينيح نفسه في حضن آبائنا القديسين، إبراهيم وإسحق ويعقوب في فردوس النعيم، ويغفر لنا خطايانا.\n** Pray for the soul of our blessed and honored father Papa Abba (Kerrelos VI), that the Lord God may repose his soul in the bosom of our holy fathers, Abraham, Isaac and Jacob, in the Paradise of joy, and forgive us our sins.\n** Twbh `ejen `t`'u,y `mpenmakarioc `niwt ettaiyout papa abba (Kurilloc pimahcoou)@ hina `nte `P=o=c `V] ]`mton nac qen kenf `nnenio] =e=;=u Abraam nem `Icaak nem Iakwb qen piParadicoc `nte `pounof@ `ntef,a nennobi nan `ebol.\n** `Arikataxion `P=o=c ]`mton nac nem ny=e=;=u@ ek`eer,arizec;e e;rek taho nan `eratf `n`wma `n`ecwou `enane@ e;ref`amoni `mpeklaoc@ qen outoubo nem oume;myi.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nوهؤلاء وكل أحد، يا رب، الذين ذكرنا أسماءهم، والذين لم نذكرهم الذين في فكر كل واحد منا، والذين ليسوا فينا. الذين رقدوا وتنيحوا في الايمان بالمسيح. تفضل يارب اذكر نفوس عبيدك...\n** Priest:\n** Those, O Lord, and everyone whose names we have mentioned; and those whose names we have not mentioned, those whom each one has in mind and those who are not in our minds; and those who have fallen asleep and reposed in the faith of Christ. Graciously, O Lord, repose the soul of Your servants...\n** Ouoh nai nem ouon niben P=o=c ny`etantaou`e nouran@ nem ny`ete `mpentaou`wou. Nyetqen `vmeu`i `mpiouai piouai `mmon@ nem ny`ete `nqyten an etauenkot au`mton `mmwou qen `vnah] `mP=,=c.\nتفضل يا رب نيح نفوسهم جميعا في حضن آبائنا القديسين، ابراهيم وإسحق ويعقوب. عُلهُم في موضعِ خضرة، علي ماءِ الراحةِ في فردوسِ النعيمِ الموضع الذي هرب منه الحزنُ و الكآبةُ والتنهدُ في نوِر قديسيك.\n** Graciously, O Lord, repose all their souls in the bosom of our Holy fathers, Abraham, Isaac and Jacob, sustain them in a green pasture, by the water of rest in the paradise of joy, the place out of which grief, sorrow and groaning have fled away, in the light of Your saints.\n** Arikataxion P=o==c ma`mton `nnou'u,y tyrou qen kenf `nnenio] =e=;=u Abraam nem Icaak nem Iakwb. Sanousou qen ouma `n`,loy@ hijen `vmwou `nte `pemton@ qen piparadicoc `nte `pounof. Pima `etafvwt `ebol `nqytf `nje pi`mkah `nhyt nem ]lupy nem pifi`ahom@ qen `vouwini `nte ny =e=;=u `ntak.\nاطلبوا عن آبائنا وإخوتنا الذين رقدوا، وتنيحوا في الإيمان بالمسيح منذ البدء. آبائنا القديسين رؤساء الأساقفة، وآبائنا الأساقفة، وآبائنا القمامصة، وآبائنا القسوس وإخوتنا الشمامسة، وآبائنا الرهبان، وآبائنا العلمانيين، وعن نياح كل المسيحيين.\n** Pray for our fathers and brethren who have fallen asleep and reposed in the faith of Christ since the beginning; our holy fathers, the archbishops, our fathers the bishops, our fathers the hegumens, our fathers the priests, our brethren the deacons, our fathers the monks, and our fathers the laymen, and for the full repose of Christians.\n** Twbh `ejen nenio] nem nen`cnyou `etau`enkot au`mton `mmwou qen `vnah] mP=,=c icjen `p`eneh@ nenio] `e;ouab `n`ar,y`epickopoc ke nenio] `n`epickopoc@ nenio] `nhygoumenoc ke nenio] `m`precbuteroc nem nen`cnyou `ndiakwn@ nenio] `mmona,oc@ ke nenio] `nlaikoc@ nem `ehryi ejen ]`anapaucic tyrc `nte ni`,rictianoc.\nلكي المسيح إلهنا ينيح نفوسهم أجمعين في فردوس النعيم، ونحن أيضاً يصنع معنا رحمةً، ويغفر لنا خطايانا.\n** That Christ our God may repose all their souls in the paradise of joy, and we too, accord mercy unto us, and forgive us our sins.\n** Hina `nte P=,=c pennou] ]`mton `nnou'u,y tyrou qen piparadicoc `nte `pounof@ `anon de hwn `ntef`er pinai neman@ `ntef,a nennobi nan `ebol.\nيقول الشماس\n(القارئون فليقولوا اسماء آباءنا القديسين البطاركة الذين رقدوا الرب ينيح نفسوهم أجمعين ويغفر لنا خطايانا)\nوأثناء ذلك يقول الكاهن سرًا:\n(أذكر يا رب أباءنا القديسين الأرثوذكسيين رؤساء الأساقفة الذين سبقوا فرقدوا هؤلاء الذين فصلوا كلمة الحق باستقامة وأعطنا نحن أيضاَ حظًا ونصيبًا معهم ذاكرًا أيضًا هؤلاء الذين نذكرهم في يومنا هذا)\nالترحيم\nيقول الكاهن\n((وهؤلاء وكل أحد يارب الذين ذكرنا أسماؤهم والذين لم نذكرهم الذين في فكر كل واحد منا والذين ليسوا في فكرنا الذي رقدوا وتنيحوا في الإيمان بالمسيح))\nثم يضع الكاهن بخورًا في المجمرة ويقول:\n((أذكر يا رب نفس عبدك..))\nوأثناء ذلك يقول الشماس\n((أطلبوا عن آباءنا وأخوتنا الذين رقدوا وتنيحوا في الإيمان بالمسيح منذ البدء آباءنا القديسين رؤساء الأساقفة وآباءنا الأساقفة آبائنا القمامصة وآبائنا القسوس وإخوتنا الشمامسة آبائنا الرهبان وآباءنا العلمانيين وعن نياح كل المسيحيين لكي المسيح إلهنا ينيح نفسوهم أجمعين في فردوس النعيم ونحن أيضًا يصنع معنا رحمة ويغفر لنا خطايانا))\nلحن بي نيشتي / العظيم الانبا انطونى\nالقداس الكيرلسي\nالخولاجي\nمجمع القديسين\n"},{"n":"14- لحن العظيم أنبا أنطونيوس / بي نشتي","t":"ثم يقول الكاهن البركة حسب ترتيبها كل أوان باوانه وفي ضمن ذلك يقول الشمامسة الترحيم للآباء البطاركة السالفين إلى آخره وبعده يقول الشماس:\n((العظيم أنبا أنطوني والبار انبا بولا والقديسيون الثلاثة مقارات أنبا يوأنس القصير أنبا بيشوي أنبا بولا أبوانا القديسان الروميان مكسيموس ودوماديوس انبا موسي أنبا يؤأنس كاما انبا دانيال أنبا إيسيذوروس أنبا باخوم أنبا شنودة وانبا بفنوتي انبا برسوم انبا رويس وجميع الذين علموا بكلمة الحق باستقامة الأساقفة الأرثوذكسيون والقسوس والشمامسة الإكليروس والعلمانيون وهؤلاء وجميع الأرثوذكسيون)).\nالقداس الكيرلسي\nالخولاجي\nالذين ذكرنا اسمائهم\nالقارئون فليقولوا (الترحيم)\n"},{"n":"15- الذين ذكرنا أسماؤهم","t":"الكاهن:\nوهؤلاء وكل أحد، يا رب، الذين ذكرنا أسماءهم، والذين لم نذكرهم الذين في فكر كل واحد منا، والذين ليسوا فينا. الذين رقدوا وتنيحوا في الايمان بالمسيح. تفضل يارب اذكر نفوس عبيدك...\n** Priest:\n** Those, O Lord, and everyone whose names we have mentioned; and those whose names we have not mentioned, those whom each one has in mind and those who are not in our minds; and those who have fallen asleep and reposed in the faith of Christ. Graciously, O Lord, repose the soul of Your servants...\n** Pi`precbuteroc@\n** Ouoh nai nem ouon niben P=o=c ny`etantaou`e nouran@ nem ny`ete `mpentaou`wou. Nyetqen `vmeu`i `mpiouai piouai `mmon@ nem ny`ete `nqyten an etauenkot au`mton `mmwou qen `vnah] `mP=,=c.\nتفضل يا رب نيح نفوسهم جميعا في حضن آبائنا القديسين، ابراهيم وإسحق ويعقوب. عُلهُم في موضعِ خضرة، علي ماءِ الراحةِ في فردوسِ النعيمِ الموضع الذي هرب منه الحزنُ و الكآبةُ والتنهدُ في نوِر قديسيك.\n** Graciously, O Lord, repose all their souls in the bosom of our Holy fathers, Abraham, Isaac and Jacob, sustain them in a green pasture, by the water of rest in the paradise of joy, the place out of which grief, sorrow and groaning have fled away, in the light of Your saints.\n** Arikataxion P=o==c ma`mton `nnou'u,y tyrou qen kenf `nnenio] =e=;=u Abraam nem Icaak nem Iakwb. Sanousou qen ouma `n`,loy@ hijen `vmwou `nte `pemton@ qen piparadicoc `nte `pounof. Pima `etafvwt `ebol `nqytf `nje pi`mkah `nhyt nem ]lupy nem pifi`ahom@ qen `vouwini `nte ny =e=;=u `ntak.\nالشعب:\nيا ربُ إرحم.\n** People:\n** Lord have mercy.\n** Pilaoc@\n** Kurie `ele`ycon.\nالشماس:\nاطلبوا عن آبائنا وإخوتنا الذين رقدوا، وتنيحوا في الإيمان بالمسيح منذ البدء. آبائنا القديسين رؤساء الأساقفة، وآبائنا الأساقفة، وآبائنا القمامصة، وآبائنا القسوس وإخوتنا الشمامسة، وآبائنا الرهبان، وآبائنا العلمانيين، وعن نياح كل المسيحيين.\n** Deacon:\n** Pray for our fathers and brethren who have fallen asleep and reposed in the faith of Christ since the beginning; our holy fathers, the archbishops, our fathers the bishops, our fathers the hegumens, our fathers the priests, our brethren the deacons, our fathers the monks, and our fathers the laymen, and for the full repose of Christians.\n** Pidiakwn@\n** Twbh `ejen nenio] nem nen`cnyou `etau`enkot au`mton `mmwou qen `vnah] mP=,=c icjen `p`eneh@ nenio] `e;ouab `n`ar,y`epickopoc ke nenio] `n`epickopoc@ nenio] `nhygoumenoc ke nenio] `m`precbuteroc nem nen`cnyou `ndiakwn@ nenio] `mmona,oc@ ke nenio] `nlaikoc@ nem `ehryi ejen ]`anapaucic tyrc `nte ni`,rictianoc.\nلكي المسيح إلهنا ينيح نفوسهم أجمعين في فردوس النعيم، ونحن أيضاً يصنع معنا رحمةً، ويغفر لنا خطايانا.\n** That Christ our God may repose all their souls in the paradise of joy, and we too, accord mercy unto us, and forgive us our sins.\n** Hina `nte P=,=c pennou] ]`mton `nnou'u,y tyrou qen piparadicoc `nte `pounof@ `anon de hwn `ntef`er pinai neman@ `ntef,a nennobi nan `ebol.\nثم يقول الكاهن بعد الترحيم\nوهؤلاء وكل أحد يارب الذين ذكرنا أسماؤهم والذين لم نذكرهم الذين في فكر كل واحد منا والذين ليسوا في فكرنا الذي رقدوا وتنيحوا في الإيمان بالمسيح تفضل نيح نفوسهم أجميعن في حضن آبائنا القديسين إبراهيم وإسحق ويعقوب علهم في موضع خضرة على ماء الراحة في فردوس النعيم الموضع الذي هرب منه الحزن والكآبة والتنهد في نور قديسيك أقم أجسادهم في اليوم الذي رسمته كمواعيدك الحقيقية غير الكاذبة هب لهم خيرات مواهيدك مالم تره عين ولم تسمع به أذن ولم يخطر علي قلب بشر ما أعددته يا الله لمحبي اسمك القدوس لأنه لا يكون موت لعبيدك بل هو انتقال وإن كان لحقهم توان أو تفريط كبشر وقد لبسوا جسدًا وسكنوا في هذا العالم فأنت كصالح ومحب البشر اللهم إغفر لهم فأنه ليس أحد طاهرًا من دنس ولو كانت حياته يومًا واحدًا على الأرض فاما هم يا رب الذين أخذت نفوسهم نيحهم وليستحقوا ملكوت السموات وأما نحن كلنا فهب لنا أمامك كمالنا المسيحي الذي يرضيك وأعطنا وإياهم نصيبًا وميراثًا مع كافة قديسيك))\nيقول الشعب:\n** Priest:\nوهؤلاء وكل أحد، يا رب، الذين ذكرنا أسماءهم، والذين لم نذكرهم الذين في فكر كل واحد منا، والذين ليسوا فينا. الذين رقدوا، وتنيحوا في الإيمان بالمسيح.\n** Those, O Lord, and everyone whose names we have mentioned; and those whose names we have not mentioned, those whom each one has in mind and those who are not in our minds; and those who have fallen asleep and reposed, in the faith of Christ.\nتفضل يا رب نيح نفوسهم جميعا في حضن آبائنا القديسين، إبراهيم وإسحق ويعقوب. عُلهُم في موضع خضرة، على ماء الراحة في فردوس النعيم.\n** Graciously, O Lord, repose all their souls in the bosom of our holy fathers, Abraham, Isaac and Jacob. Sustain them in a green pasture, by the water of rest in the Paradise of joy.\n** `Arikataxion `P=o==c ma`mton `nnou'u,y tyrou qen kenf `nnenio] =e=;=u Abraam nem Icaak nem Iakwb. Sanousou qen ouma `n`,lo`y@ hijen `vmwou `nte `pemton@ qen piParadicoc `nte `pounof.\nالموضع الذي هرب منه الحزن والكآبة والتنهد في نور قديسيك. أقم أجسادهم في اليوم الذي رسمته كمواعيدِكَ الحقيقية غير الكاذبة.\n** The place out of which grief, sorrow and groaning have fled away, in the light of Your saints. Raise up their bodies also, on the Day which You have appointed, according to Your true promises, which are without lie.\n** Pima `etafvwt `ebol `nqytf `nje pi`mkah `nhyt nem ]lupy nem pifiahom@ qen `vouwini `nte ny=e=;=u `ntak. Ek`etounoc `ntoukecarx qen pi`Ehoou `etak;asf@ kata nek`epaggelia `mmyi ouoh `natme;nouj.\nهب لهم خيرات مواعيدك، ما لم تره عين ولم تسمع به اذن، ولم يخطر على قلب بشر. ما أعددته يا الله لمحبي إسمك القدوس.\n** Grant them the good things of Your promises, that which an eye has not seen nor ear heard, neither have come upon the heart of man. The things which You, O God, have prepared for those who love Your holy name.\n** Ek`eer,arizec;e nwou `nni`aga;on `nte nek`epaggelia@ ny`ete `mpe bal nau `erwou@ oude `mpe masj co;mou@ oude `mpou`i `e`hryi `ejen `phyt `nrwmi. Ny`etakcebtwtou `V] `nnye;mei `mpekran =e=;=u.\nلأنه لا يكون موت لعبيدك، بل هو إنتقال. وان كان لحقهم توانٍ، أو تفريط كبشر، وقد لبسوا جسداً. وسكنوا في هذا العالم.\n** For there is no death for Your servants, but a departure. Even if any negligence or heedlessness has overtaken them as men, since they were clothed in flesh and dwelt in this world.\n** Je `mmon mou sop `nnek`ebiaik alla ououwteb `ebol pe. Icje de ouon oumet`amelyc [i `erwou@ ie oumetat]`h;yf hwc rwmi `eauervorin `noucarx ouoh auswpi qen paikocmoc.\nفأنت كصالح ومحب البشر، أللهم تفضل عبيدك المسيحيين الأرثوذكسيين الذين في المسكونة كلها، من مشارق الشمس إلى مغارِبها، ومن الشمال إلى الجنوب.\n** O God, as the good One and Lover of mankind, graciously accord, O Lord, Your servants, the orthodox Christians who are in the whole world, from sunrise to sunset and from north to south.\n** `N;ok de hwc `Aga;oc ouoh `mMairwmi `V] `arikataxioin `P=o=c `nek`ebiaik `n`<rictianoc `nor;odoxoc etqen ]oikomeny tyrc@ icjen nima `nsai `nte `vry sa nefma `nhwtp nem icjen pemhyt sa `vryc.\nكل واحدٍ بإسمِه وكل واحدةٍ بإسمها، يا ربُ نيحهم، وإغفر لهم. فانه ليس أحدٌ طاهراً من دنس، ولو كانت حياتُه يوماً واحداً على الأرض.\n** Each one according to his name and each one according to her name, O Lord repose and forgive them. For no one is pure and without blemish even though his life on earth be a single day.\n** Piouai piouai kata pefran nem ]ou`i ]ou`i kata pecran@ Kurie ma`mton nwou ,w `nwou `ebol. Je `mmon `hli efouab e;wleb oude kan ou`ehoou `nouwt pe nefwnq hijen pikahi.\nأما هم يا ربُ الذين أخذت نفوسَهم، نيحهم وليستحقوا ملكوت السموات.\n** As for those, O Lord, whose souls You have taken, repose them, and may they be worthy of the kingdom of the heavens.\n** `N;wou men hamny `P=o=c `eak[i `nnou'u,y ma`mton nwou@ ouoh marouer `pem`psa `n]metouro `nte nivyou`i.\nوأما نحن كلنا فهب لنا كماَلنا المسيحي الذي يرضيك أمامك. وأعطهم وإيانا نصيباً وميراثاً مع كافة قديسيك.\n** As for us all, grant us our Christian perfection that would be pleasing to You, and give them and us a share and an inheritance with all Your saints.\n** `Anon de tyren `ari,arizec;e nan `mpenjwk `n`<rictianoc efranak `mpek`m;o=p=n=a@ ouoh moi nwou neman `noumeroc nem ou`klyroc@ nem ny=e=;=u tyrou `ntak.\nلحن بي نيشتي / العظيم الانبا انطونى\nاوشيه القرابين\nالقداس الكيرلسي\nالخولاجي\n"},{"n":"16- أوشية القرابين","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nالصعائد والقرابين.\n** The sacrifices, the offerings.\n** Ni;ucia ni`procvora.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن المهتمين بالصعائد، والقرابين، والبكور، والزيت، والبخور، والستور، وكتب القراءة، وأواني المذبح، لكيْ المسيح إلهنا يكافئهم في أورشليم السمائية، ويغفر لنا خطايانا.\n** Pray for those who tend to the sacrifices, offerings, first-fruits, oil, incense, coverings, reading books, and altar vessels, that Christ our God may reward them in the heavenly Jerusalem, and forgive us our sins.\n** Twbh `ejen nyetfi `m`vrwous `nni;ucia ni`procvora ni`apar,y nineh ni`c;oinoufi ni`ckepacma nijwm `nws nikumillion `nte pima`nerswousi@ hina `nte P=,=c penNou] ]sebiw nwou qen Ieroucalym `nte `tve@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nوشُكر الذين يقربون، كرامة ومجداً لإسمك القدوس.\n** And the thanksgivings of those who have offered to the honor and glory to Your holy name.\n** Nisep`hmot `nte ny`etauer`procverin@ `eoutaio nem ou`wou `mpekran =e=;=u.\nإقبلها إليك على مذبحك المقدس، الناطق السمائي رائحة بخور، تدخل إلى عظمتك التي في السموات. بواسطة خدمة ملائكتك ورؤساء ملائكتك المقديسين. وكما قبلت إليك قرابين هابيل الصديق وذبيحة أبينا إبراهيم وفلسي الأرملة.\n** Receive them upon Your holy, rational altar of heaven as a sweet savor of incense before Your greatness in the heavens, through the service of Your holy angels and archangels. And as You have received the gifts of the righteous Abel, the sacrifice of our father Abraham, and the two mites of the widow.\n** Sopou `erok `ejen pek;uciatyrion =e=;=u `nellogimon `nte `tve@ `eou`c;oi `n`c;oinoufi@ `eqoun `etekmetnis] etqen nivyou`i@ `ebolhiten `psemsi `nte nekaggeloc nem nekar,yaggeloc =e=;=u. `M`vry] `etakswp `erok `nnidwron `nte pi`;myi `Abel@ nem ];ucia `nte peniwt Abraam nem ]tebi `cnou] `nte ],yra.\nهكذا أيضاً نذور عبيدك، إقبلها إليك، أصحاب الكثير وأصحاب القليل، الخفيات والظاهرات.\n** So also receive the thanks of Your servants, those in abundance or those in scarcity, hidden or manifest.\n** Pairy] on nikeeu,arictyrion@ sopou `erok@ na pihou`o nem na pikouji@ nyethyp nem nye;ouwnh `ebol.\nوالذين يريدون أن يقدموا لك وليس لهم، والذين قدموا لك في هذا اليوم هذه القرابين. أعطهم الباقيات عوضاً عن الفانيات، السمائيات عِوَض الأرضيات، الأبديات عِوَض الزمنيات، بيوتهم ومخازنهم إملأها من كل الخيرات.\n** Those who desire to offer to You but have none, and those who have offered these gifts to You this very day. Give them the incorruptible instead of the corruptible, the heavenly instead of the earthly, and the eternal instead of the temporal. Their houses and their stores, fill them with every good thing.\n** Nye;ouws `e`ini nak `eqoun ouoh `mmon `ntwou@ nem ny`etau`ini nak `eqoun qen pai`ehoou `nte voou `nnaidwron nai. Moi nwou `nniattako `n`tsebiw `nnye;natako@ na nivyou`i `n`tsebiw `nna`pkahi@ nisa`eneh `n`tsebiw `nni`procoucyou. Nou`you noutamion mahou `ebol qen `aga;on niben.\nأحطهم يا رب بقوة ملائكتك، ورؤساء ملائكتك الأطهار.\n** Surround them, O Lord, by the power of Your holy angels and archangels.\n** Matakto `erwou `P=o=c `n`tjom `nte nekaggeloc nem nekar,yaggeloc =e=;=u.\nوكما ذكروا إسمك القدوس على الأرض أذكرهم هم أيضاً يا رب في ملكوتك، وفي هذا الدهر لا تتركهم عنك.\n** And as they remembered Your holy name on earth, remember them also, O Lord, in Your kingdom, and in this age too, leave them not behind.\n** `M`vry] `etauer`vmeu`i `mpekran =e=;=u hijen pikahi@ `aripoumeu`i hwou `P=o=c qen tekmetouro@ ouoh qen pai ke `ewn vai `mper,au `ncwk.\nاوشية القرابين\nيقول الكاهن وهو يضع البخور في المجمرة ويبخر فوق الصينية والكأس: (الصعائد والقرابين)\nيقول الشماس:\n((اطلبوا عن المهتمين بالصعائد والقرابين والبكور والزيت والبخور والستور وكتب القراءة وأواني المذبح لكي المسيح إلهنا يكافئهم في أورشليم السمائية\nويغفر لنا خطايانا ))\nيقول الشعب\nيقول الكاهن\n((وتشكرات الذين يقربون كرامة ومجدًا لإسمك القدوس إقبلها إليك على مذابحك المقدس الناطق السمائي رائحة بخور تدخل إلى عظمتك التي في السموات بواسطة خدمة ملائكتك ورؤساء ملائكتك المقدسين وكما قبلت إليك قرابين هابيل الصديق وذبيحة أبينا إبراهيم وفلسي الأرملة هكذا أيضا نذورعبيدك إقبلها إليك أصحاب الكثير وأصحاب القليل الخفيات والظاهرات والذين يريدون أن يقدموا لك وليس لهم والذين قدموا لك في هذا اليوم هذه القرابين أعطهم مالًا يفسد عوضًا عن الفاسدات السمائيات عوض الأرضيات الأبديات عوض الزمنيات بيوتهم ومخازنهم إملأها من كل الخيرات (ههنا يحول وجهه إلى الغرب ويبخر الشعب قائلًا) أحفظهم يا رب بقوة ملائكتك ورؤساء ملائكتك الأطهار وكما ذكروا إسمك القدوس على الأرض أذكرهم هم أيضًا يا رب في ملكوتك وفي هذا الدهر لا تتركهم عنك (بلحن العتيقة))\nأوشيه البابا البطرك\nالقداس الكيرلسي\nالخولاجي\nالذين ذكرنا اسمائهم\n"},{"n":"17- أوشية البابا البطريرك","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nبطريركنا الأب المكرم رئيس الكهنة البابا المعظم أنبا (...).\n** Our blessed and honored father, the archbishop our patriarch, Abba (...).\n** Penmakarioc `niwt ettaiyout `nar,y`ereuc penpatriar,yc abba (...) pimahsomt.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن حياة وقيام أبينا المكرم رئيس الكهنة البابا أنبا (...)، لكيْ المسيح إلهنا يحفظ لنا حياته سنين عديدة وأزمنة سلامية ويغفر لنا خطايانا.\n** Pray for the life and standing of our honored father the high priest, Papa Abba (...), that Christ our God may keep his life for us for many years and peaceful times, and forgive us our sins.\n** Twbh `ejen `pwnq nem `ptaho `eratf `mpeniwt ettaiyout `nar,y`ereuc papa abba (...) pimahsomt@ hina `nte P=,=c penNou] `areh `epefwnq nan `nhanmys `nrompi nem hancyou `nhirynikon@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nحفظاً إحفظه لنا سنين كثيرة وأزمنة سلامية. مُكمل رئاسة الكهنوت المقدسة، التي ائتمنته عليها من قِبَلك، كإرادتك المقدسة الطوباوية.\n** In keeping, keep him for us for many years and peaceful times. Fulfilling that holy high priesthood, with which You have entrusted him from Yourself, according to Your holy and blessed will.\n** Qen ou`areh `areh `erof nan `nhanmys `nrompi nem hancyou `nhirynikon. Efjwk `ebol `n;y=e=;=u `etaktenhoutf `eroc `ebol hitotk `mpetar,y`ereuc@ kata pekouws =e=;=u ouoh `mmakarion.\nمُفصل كلمة الحق بإستقامة، راعي شعبك بطهارة وبر. أنعم عليه وعلينا بالسلامة، والعافية في كل موضع.\n** Rightly dividing the word of truth, shepherding Your people in purity and righteousness. Grant him and us peace and safety in every place.\n** Efswt `ebol `m`pcaji `nte ]me;myi qen oucwouten@ ef`amoni `mpeklaoc qen outoubo nem oume;myi. Ek`eer,arizec;e naf neman `nouhiryny nem ououjai `ebol qen mai niben.\nوصلواته التي يصنعها عنا، وعن كل شعبك وصلواتنا نحن أيضاً عنه. إقبلها إليك على مذبحك المقدس الناطق السمائي رائحة بخور.\n** His prayers which he offers on our behalf, and on behalf of all Your people, as well as ours on his behalf, receive upon Your holy, heavenly, and rational altar as a sweet savor of incense.\n** Nef`proceu,y de `etef`iri `mmwou `e`hryi `ejwn@ nem `ejen peklaoc tyrf@ nem noun hwn `e`hryi `ejwf. Sopou `erok `ejen pek;uciactyrion =e=;=u `nellogimon `nte `tve@ `eou`c;oi `n`c;oinoufi.\nوسائر أعدائه الذين يرون والذين لا يرون، اسحقهم وأذلهم تحت أرجله سريعاً. وأما هو فإحفظه في سلام وعدل في كنيستك المقدسة.\n** All his enemies, visible and invisible, trample and humiliate under his feet speedily. As for them, keep him in peace and righteousness in Your holy Church.\n** Nafjaji men tyrou ny`etounau `erwou@ nem ny`ete `ncenau `erwou an@ qemqwmwou ouoh ma;ebiwou capecyt `nnef[alauj `n`,wlem. `N;of de `areh `erof qen ouhiryny nem oudike`ocuny@ qen Tekekklycia =e=;=u.\nأوشية البابا (البطريرك)\nيقول الكاهن\nبطريركنا الآب المكرم أنبا (...)\nيقول الشماس\n((أطلبوا عن حياة وقيام أبينا المكرم رئيس الكهنة البابا أنبا.. لكي يحفظ لنا المسيح إلهنا حياته سنين عديدة وأزمنة سالمة ويغفر لنا خطايانا))\nيقول الشعب\n((حفظًا إحفظه لنا سنين كثيرة وأزمنة سالمة مكملًا رئاسة الكهنوت المقدسة التي إئتمنتيه عليها من قبلك كإراداتك المقدسة الطوباوية مفصلًا كلمة الحق باستقامته راعيًا شعبك بطهارة وبر انعم عليه وعلينا بالسلام والعافية من كل موضع وصلواته التي يصنعها عنا وعن كل شعبك وصلواتنا نحن أيضًا عنه إقبلها إليك على مذبحك الناطق السمائي رائحة البخور وسائر أعدائه الذين يرون والذين لا يرون إسحقهم وأذلهم تحت رجليه سريعًا وأما هو فإحفظه بسلامة وعدل في كنيستك المقدسة))\nآوشيه الاساقفه\nالقداس الكيرلسي\nالخولاجي\nاوشيه القرابين\n"},{"n":"18- أوشية الأساقفة","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأذكر يا رب (أبينا الأسقف المكرم الأنبا ... وكل) الأساقفة الأرثوذكسيين الذين في كل موضع.\n** Remember, O Lord, (our father the bishop Abba ... and) the orthodox bishops in every place.\n** `Ari`vmeu`i `P=o=c (peniwt `n`epickopoc `abba (---)) `nnike`epickopoc `nor;odoxoc et qen mai niben.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن (أبينا الأسقف المكرم الأنبا ... وعن كل) آبائنا الأساقفة الأرثوذكسيين الذين في كل مواضع المسكونة، والقمامصة والقسوس والشمامسة، وكل طغمات الكنيسة، لكيْ يحفظهم المسيح إلهنا من كل شر، ويغفر لنا خطايانا.\n** Pray for our (our father the bishop Abba ... and our) fathers the orthodox bishops in every place of the whole world, and the hegumens, the priests, the deacons, and all the orders of the Church, that Christ our God may keep them from every evil, and forgive us our sin.\n** Twbh `ejen (peniwt `n`epickopoc `abba (---))@ nenio] `n`epickopoc `nor;odoxoc et qen mai niben `nte ]oikoumeny tyrc@ nem nihygoumenoc nem ni`precbuteroc nem nidiakwn@ nem `ptagma tyrf `nte ]Ekklycia@ hina `nte P=,=c penNou] `areh `erwou `ebolha pethwou niben@ `ntef,a nennobi nan `ebol.\nأوشية الأساقفة\nيقول الكاهن:\n((أذكر يا رب الأساقفة الأرثوذكسيين الذي في كل موضع))\nيقول الشماس:\n((أطلبوا عن آبائنا الأساقفة الأرثوذكسيين الذين في كل مواضع المسكونة كلها القمامصة والقسوس والشمامسة وكل طغمات الكنيسة لكي يحفظهم المسيح إلهنا من كل شر ويغفر لنا خطايانا))\nيقول الشعب\nيا رب إرحم\nإوشيه القسوس\nالقداس الكيرلسي\nالخولاجي\nأوشيه البابا البطرك\n"},{"n":"19- أوشية القسوس","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nوالقسوس، والشمامسة، والابوذياكونيين، والاغنسطسين، والمرتلين، والقُرَّاء، والرهبان، والعذارى، والأرامل، والأيتام، والنُساك، والعِلمانيين.\n** And the priests, the deacons, the subdeacons, the readers, the chanters, the exorcists, the monks, the virgins, the widows, the orphans, the ascetics, the laity.\n** Ni`precbuteroc nidiakwn@ nihupodiakwn ni`anagnwctyc@ ni'altyc niexorgictyc@ nimona,oc nipar;enoc@ ni,yra niorvanoc@ nieg`kratyc nilaikoc.\nوالمتزوجين ومربي الأولاد. والذين قالوا لنا أذكرونا والذين لم يقولوا. الذين نعرفهم والذين لا نعرفهم. أعداءنا وأحباءنا، أللهم أرحمهم.\n** Those who are bound by wedlock and those who rear children. Those who said to us, \"Remember us,\" and those who said not. Those who we know and those who we know not. Our enemies and our loved ones, O God, have mercy upon them.\n** Nyethwtp qen pigamoc@ nem nyetsanessyri. Ny`etaujoc nan je `aripenmeu`i@ nem ny`ete `mpoujoc. Ny`etencwoun `mmwou@ nem ny`etencwoun `mmwou an. Nenjaji nem nenmenra]@ `V] nai nwou.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nاوشية القسوس\nيقول الكاهن\n((والقسوس والشمامسة والإيبوذياكونيين والأغنسطسين والمرتلين والقراء والرهبان والعذاري والأرامل والأيتام والنساك والعلمانيين المتحدين بالزيجة ومربي الولاد الذين قالوا لنا أذكرونا والذين لم يقولوا الذين نعرفهم والذين لا نعرفهم أعدائنا وأحباءنا اللهم أرحمهم))\nيقول الشعب\nأوشية بقيه الارثوذكسيين\nالقداس الكيرلسي\nالخولاجي\nآوشيه الاساقفه\n"},{"n":"20- أوشية بقية الأرثوذكسيين","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأذكر يا رب باقي الأرثوذكسيين الذين في كل موضع من المسكونة.\n** Remember, O Lord, the rest of the orthodox in every place of the world.\n** `Ari`vmeu`i `P=o=c `m`pcwjp `nnior;odoxoc qen mai niben `nte ]oikoumeny.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن باقي الأرثوذكسيين الذين في كل مواضع المسكونة كلها، لكي المسيح إلهنا يثبتهم في الإيمان الأرثوذكسي، ويحفظهم من كل شر جميع أيام حياتهم، ويغفر لنا خطايانا.\n** Pray for the rest of the orthodox in every place of the whole world, that Christ our God may confirm them in the orthodox faith and keep them from every evil all the days of their lives, and forgive us our sins.\n** Twbh `ejen `pcwjp `nnior;odoxoc etqen mai niben `nte ]oikoumeny tyrc@ hina `nte P=,=c penNou] tajrwou qen pinah] `nor;odoxoc@ ouoh `ntef`areh `erwou `ebolha pethwou niben `nni`ehoou tyrou `nte pouwnq@ `ntef,a nennobi nan `ebol.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nأوشية بقية الأرثوذكسيين\nيقول الكاهن\n((أذكر يا رب باقي الأرثوذكسيين الذي في كل موضع من المسكونة))\nيقول الشماس\n((اطلبوا عن باقي الأرثوذكسيين الذين في كل مواضع المسكونة كلها لكي يثبتهم المسيح إلهنا في الإيمان الأرثوذكسي ويحفظهم من كل شر جميع أيام حياتهم ويغفر لنا خطايانا))\nيقول الشعب\nأوشية الموضع\nالقداس الكيرلسي\nالخولاجي\nإوشيه القسوس\n"},{"n":"21- أوشية الموضع","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأذكر يا رب هذا الموضع المقدس الذي لك، وكل المواضع وكل أديرة آبائنا الأرثوذكسيين.\n** Remember, O Lord, this, Your holy place, and every place, and every monastery of our orthodox fathers.\n** `Ari`vmeu`i `P=o=c `mpaitopoc =e=;=u `ntak vai@ nem topoc niben@ nem monactyrion niben `nte nenio] `nor;odoxoc.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن طمأنينة هذا الموضع المقدس، وكل موضع، وكل دير لآبائنا الأرثوذكسيين. البراري، والشيوخ السكان فيها، وطمأنينة العالم أجمع معاً، لكيْ يحفظهم المسيح إلهنا من كل شر، ويغفر لنا خطايانا.\n** Pray for the safety of this holy place and every place, and every monastery of our orthodox fathers. The deserts and the elders who dwell therein, and for the safety of the world altogether, that Christ our God may keep them from every evil, and forgive us our sins.\n** Twbh `ejen `pcemni@ `mpaitopoc =e=;=u vai@ nem topoc niben@ nem monactyrion niben `nte nenio] `nor;odoxoc. Nisafeu nem niqelloi etsop `nqytou@ nem `pcemni `mpikocmoc tyrf eucop@ hina `nte P=,=c penNou] `areh `erwou `ebol ha pethwou niben@ `ntef,a nennobi nan `ebol.\nوكل مدينة، وكل كورة، والقرى، وكل بيوت المؤمنين. واحفظنا كلنا في الإيمان الأرثوذكسي إلى النفس الأخير، لأن هذا وحده هو رجاؤنا.\n** And every city and every region and village, and every house of the faithful. And keep us all in the orthodox faith to the last breath, for this alone is our hope.\n** Nem polic niben@ nem ,wra niben@ nem ni]mi@ nem yi niben `nte nipictoc. `Areh de `eron tyren qen pinah] `nor;odoxoc sa pinifi `nqa`e@ vai gar `mmauatf pe tenhelpic.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nاوشيه الموضع\nيقول الكاهن\n((إذكر يا رب هذا الموضع المقدس الذي لكل كل المواضع وكل ديارات آباءنا الأرثوذكسيين))\nيقول الشماس:\n((أطلبوا عن طمأنينة هذا الموضع المقدس وكل موضع وكل دير لآبائنا الأرثوذكسيين والبراري والشيوخ السكان فيها وطمأنينية العالم أجمع معًا لكي يحفظهم المسيح إلهنا من كل شر ويغفر لنا خطايانا))\n(وكل مدينة وكل إقليم والقري وكل بيوت المؤمنين إحفظنا كلنا في الإيمان الأرثوذكسي إلى النفس الأخير لأن هذا هو رجاؤنا)\nيقول الشعب\nاوشية القيام ها هنا\nالقداس الكيرلسي\nالخولاجي\nأوشية بقيه الارثوذكسيين\n"},{"n":"22- أوشية القيام ههنا","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأذكر يا رب القيام ههنا، والمشاركين لنا في الطلبة.\n** Remember, O Lord, those who are standing in this place and who are participating with us in prayer.\n** `Ari`vmeu`i `P=o=c `nnyet`ohi `eratou `mpaima ouoh etoi `n`svyr `ntwbh neman.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن القيام في هذا الموضع، والمشتركين في الطلبة معنا، لكيْ يحفظهم المسيح إلهنا ويحرسهم، ويقبل إليه طلباتهم ويرحمهم، ويغفر لنا خطايانا.\n** Pray for those who are standing in this place and who are participating with us in prayer, that Christ our God may keep them and guard them, receive their prayers to Himself, and have mercy upon them, and forgive us our sins.\n** Twbh `ejen nyet`ohi `eratou `mpaima ouoh etoi `n`svyr `ntwbh neman@ hina `nte P=,=c penNou] `areh `erwou@ `ntefrwic `erwou@ `ntefswp `erof `nnoutwbh@ ouoh `ntefnai nwou@ `ntef,a nennobi nan `ebol.\nآبائنا وإخوتنا وبقية الذين في كل موضع من المسكونة. إحفظهم، وإيانا بمعسكر القوات المقدسة. ونجنا من سهام إبليس المتقدة ناراً. وكل المصائد الشيطانية، ومن فخ المجد الباطل.\n** Our fathers and our brethren, and the rest who are in every place of the world. And keep them with us by the host of the holy powers. And save us from the flaming darts of the Devil. From every diabolic wile, and from the snare of false justification.\n** Nenio] nem nen`cnyou@ nem `pcwjp `nnyetqen mai niben `nte ]oikoumeny. `Areh de `erwou neman qen hanparemboly `nte hanjom euouab. Ouoh nahmen `ebol ha nico;nef et[eryout `n`,rwm `nte piDiaboloc. Nem jorjc niben `ndiabolikon@ nem pivas `nte pi`;maio `nnouj.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nأوشية القيام\nيقول الكاهن\nيقول الشماس\n(اطلبوا عن القيام في هذا الموضع والمشتركين في الطلبة معنا لكي يحفظهم المسيح إلهنا ويحرسهم ويقبل إليه طلباتهم ويغفر لنا خطايانا))\n(آباءنا وأخوتنا وبقية الذين في كل موضع المسكونة إحفظهم وإيانا بمعسكر القوات المقدسة ونجنا من سهام إبليس المتقدة نارًا وكل المصايد الشيطانية ومن فخ التزكية الكاذبة))\nيقول الشعب\nالقداس الكيرلسي\nالخولاجي\nأوشية تذكار الذين أوصونا\nأوشية الموضع\n"},{"n":"23- أوشية تذكار الموصيين (الذين أوصونا أن نذكرهم)","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأذكر يا رب كل الذين أوصونا أن نذكرهم.\n** Remember, O Lord, all those who have bidden us to remember them.\n** `Ari`vmeu`i `P=o=c `nouon niben `etauhonhen nan je `aripenmeu`i.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن كل الذين أوصونا أن نذكرهم في سؤالاتنا، وطلباتنا، كل أحد بإسمه، لكي المسيح إلهنا يذكرهم بالخير في كل حين، ويغفر لنا خطايانا.\n** Pray for those who have bidden us to remember them in our supplications and prayers, each one according to his name, that Christ our God may remember them in goodness at all times, and forgive us our sins.\n** Twbh `ejen ouon niben `etafhonhen nan `eerpoumeu`i qen nen]ho nem nentwbh piouai piouai kata pefran@ hina `nte P=,=c penNou] erpoumeu`i `epi`aga;on `ncyou niben `ntef,a nennobi nan `ebol.\nفي صلواتنا وطلباتنا التي نصنعها إليك أيها الرب إلهنا. كهذا الوقت الذي لهذا القداس الطاهر. الذين نذكرهم كل حين، والذين في فكر كل واحد منا.\n** In our prayers and supplications which we offer up unto You, O Lord our God. At this time of this holy liturgy. Those whom we remember at all times, those in the memory of each one of us.\n** Qen nen]ho nem nentwbh `eten`iri `mmwou `e`pswi harok `P=o=c penNou]. Nem kata paicyou vai `nte tai`anavora =e=;=u. Ny`eten`iri `mpoumeu`i `ncyou niben@ nem nyetqen `vmeu`i `mpiouai piouai `mmon.\nوتذكارهم الذي صار الآن، فليكن لهم مثل سور ثابت غالب لكل مضرات الشياطين، ومؤامرة الناس الأشرار.\n** And their memorial which has now taken place, may it be for them like a steadfast fortress, overcoming every harm of the demons and the counsel of wicked men.\n** Ouoh pouer`vmeu`i `etafswpi ]nou marefswpi nwou `n`tsebiw `noucobt eftajryout@ ouoh ef[ryout `e`blaby niben `nte nidemwn@ nem `pco[ni `nte nirwmi ethwou.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nاسجدوا لله بخوف ورعدة.\n** Worship God in fear and trembling.\n** Ouwst `m`V] qen ouho] nem ou`c;erter.\nيقول الكاهن\n((أذكر يا رب كل الذين أوعزوا إلينا ان أذكرونا))\nيقول الشماس\n((أطلبوا عن كل الذين أوصونا ان نذكرهم في سشؤالاتنا وطلباتنا كل أحد بإسمه لكي يذكرهم المسيح إلهنا بالخير في كل حين ويغفر لنا خطايانا))\n((في صلواتنا وطلباتنا التي نصنعها إليك أيها الرب إلهنا وكهذا الوقت الذي لهذا القداس الطاهر، الذين نذكرهم كل حين والذين في فكر واحد منا وتذكارهم الذي صار الآن فليكن لهم عوضًا سور ثابت غالب لكل مضرات الشياطين ومؤامرة الناس الأشرار))\nيقول الشعب\nاوشية الكاهن الخديم\nالقداس الكيرلسي\nالخولاجي\nاوشية القيام ها هنا\n"},{"n":"24- أوشية الكاهن الخديم","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\n(اذكر يا رب نفسي الضعيفة الشقية. وامنحني أن أفهم ما هو عظم قيامي أمام مذبحك المقدس. واقطع عني كل لذات الجهل والصبا. لكي لا يكون لي هذا ثقلاً في جواب يوم الدينونة المرهوبة.\n** (Remember, O Lord, my weak and wretched soul. Give me to understand the greatness of my standing before Your holy altar. Cut away from me all the passions of ignorance and of youth. That they might not be a burden to me at the answer of that fearful Judgment Day.\n** `Ari`vmeu`i `P=o=c `ntajwbi ouoh `ntalepwroc `m'u,y. Ouoh myic nyi `ntaka] je ou pe ]metnis] `nte pajinohi `erat `epek;uciactyrion =e=;=u. Ouoh jwji `ebolharoi `nhudony niben `nte ]metat`emi nem na ]met`alou. Hina `ntef`stemswpi nyi `nje vai `nouetvw@ qen ]`apologia `nte pi`Ehoou `nte pihap etoi `nho] `ete `mmau.\nونجني من كل أفعال القوات المضادة. ولا تهلكني بآثامي، ولا تغضب إلي الأبد فتحفظ لي شروري. بل أرني أنا أيضاً صلاحك في، ونجني أنا غير المستحق ككثرة رحمتك عليَّ.) (سراً)\n** Save me from all the work of the adverse powers. Destroy me not with my iniquities. Be not angry forever, by reserving my evils against me. But rather show in me Your goodness also, and save me - even I, the unworthy according to the multitude of Your mercy upon me.) (Inaudibly)\n** Ouoh nahmet `ebol ha `energia niben `nte ]jom `nantikimenoc. Ouoh `mpertakoi nem na`anomia@ oude `nnek`mbon sa `eneh@ `ntek`areh en`apethwou nyi. Alla matamoi hw `etekmet`aga;oc `nqyt@ ouoh nahmet qa piat`m`psa@ kata peknai etos `e`hryi `ejwi.\n(بلحن العتيقة)\nلكي أباركك كل حين جميع أيام حياتي.\n** (In Moses tune)\n** That I may bless You at all times, all the days of my life.\n** (Qen pibwhem `n]`apac `nte Me`ucyc)\n** Hina `nta`cmou `erok `ncyou niben@ `nni`ehoou tyrou `nte pawnq.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nاوشية الخديم\nيقول الكاهن هذه الصلاة سرًا بسكون\n((أذكر يا رب نفسي الضعيفة الشقية وإمنحني ان أفهم ما هو عظم قيامي امام مذبحك المقدس وإقطع عني كل لذات الجهل والصبا لكي لا يكون لي هذا ثقيلًا في جواب يوم الدين المرهوب ونجني من كل أفعال القوات المضادة ولا تهلكني بآثامي ولا تغضب إلى الأبد فتحفظ لي شروري بل أرني أنا أيضًا أرني انا أيضًا صلاحك في ونجني انا غير المستحق ككثرة رحمتك على (يصيح هنا قائلًا بلحن العتيقة لموسي) لكي أباركك كل حين جميع ايام حياتي\nيقول الشعب:\nأوشية الكهنوت\nالقداس الكيرلسي\nالخولاجي\nأوشية تذكار الذين أوصونا\n"},{"n":"25- أوشية الكهنوت","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nاذكر يا رب هذا الكهنوت المقدس، الذي لك.\n** Remember, O Lord, this, Your holy priesthood.\n** `Ari`vmeu`i `P=o=c `mpaikei`eratikon =e=;=u `ntak vai.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن هذا الكهنوت المقدس، وكل الرتب الكهنوتية الأرثوذكسية، لكيْ يستجيب لهم المسيح إلهنا، ويحرسهم ويقويهم ويرحمهم، ويغفر لنا خطايانا.\n** Pray for this holy priesthood and all the orthodox holy orders, that Christ our God may hearken unto them, guard them, strengthen them, have mercy on them, and forgive us our sins.\n** Twbh `ejen paikei`eratikon =e=;=u vai nem tagma niben `ni`eratikon `nor;odoxoc@ hina `nte P=,=c penNou] cwtem `erwou@ `ntefrwic `erwou@ ouoh `ntef]jom nwou@ `ntefnai nwou@ `ntef,a nennobi nan `ebol.\nوكل الرتب الكهنوتية الأرثوذكسية، وكل شعبك الواقف أمامك. اذكرنا نحن أيضاً يا رب. يا رب بالمراحم والرأفات، وامح آثامنا كصالح ومحب البشر. أللهم شاركنا الحلول معنا لنخدم اسمك القدوس.\n** And all the orthodox holy orders, and all Your people who are standing before You. Remember us also, O Lord. O Lord, in mercies and compassions, and blot out our iniquities as a good One and Lover of mankind. O God, be a partner with us that we may serve Your holy name.\n** Nem tagma niben ni`eratikon `nor;odoxoc@ nem peklaoc tyrf et`ohi `eratf nahrak. `Aripenmeu`i hwn `P=o=c. `P=o=c qen hannai nem hanmetsenhyt@ ouoh cwlj `nnen`anomia hwc `Aga;oc ouoh `mMairwmi. `V] `ari`svyr `nswpi neman@ `esemsi `mpekran =e=;=u.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nاوشية الكهنوت\nيقول الكاهن\nيقول الشماس\n((أطلبوا عن هذا الكهنوت المقدس وكل الرتب الكهنوتية الأرثوذكسية لكي يستجيب المسيح إلهنا لهم ويحرسهم ويقويهم ويرحمهم ويغفر لنا خطايانا))\n(وكل الرتب الكهنوتية الأرثوذكسية وكل شعبك الواقف أمامك أذكرنا نحن أيضًا يا رب بالمراحم والرأفات وإمح آثامنا كصالح ومحب البشر اللهم شاركنا الحلول معنا لنخدم إسمك القدوس))\nيقول الشعب\nاوشيه الأجتماعات\nالقداس الكيرلسي\nالخولاجي\nاوشية الكاهن الخديم\n"},{"n":"26- أوشية الأجتماعات","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nإجتماعاتنا، باركها.\n** Our assemblies, bless them.\n** Nenjin;wou]@ `cmou `erwou.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاطلبوا عن إجتماعنا هذا، وعن كل إجتماع الشعوب الأرثوذكسيين، لكيْ يباركها المسيح إلهنا ويكملها بسلام، ويغفر لنا خطايانا.\n** Pray for this assembly of ours, and for every assembly of the orthodox, that Christ our God may bless them and perfect them in peace, and forgive us our sins.\n** Twbh `ejen penjin;wou] `eqoun vai nem jin;wou] `eqoun niben `nte nilaoc `nor;odoxoc@ hina `nte P=,=c penNou] `cmou `erwou@ `ntefjokou `ebol qen ouhiryny@ `ntef,a nennobi nan `ebol.\nاوشية الاجتماعات\nيرشم الكاهن الشعب ويقول\n((أطلبوا عن اجتماعاتنا هذه وعن كل اجتماع الشعوب الأرثوذكسيين لكي يباركها المسيح إلهنا ويكملها بسلام ويغفر لنا خطايانا))\nالقداس الكيرلسي\nالخولاجي\nعباده الاوثان / قم ايها الرب\nأوشية الكهنوت\n"},{"n":"27- عبادة الأوثان إقلعها / قم أيها الرب الإله","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nعبادة الأوثان بتمامها، اقلعها من العالم. الشيطان وكل قواته الشريرة، اسحقهم وأذلهم تحت أقدامنا سريعاً.\n** The worship of idols, utterly uproot from the world. Satan and all his evil powers, trample and humiliate under our feet speedily.\n** }metsamse `idwlon qen oujwk fojc `ebolqen pikocmoc. `Pcatanac nem jom niben ethwou `ntafqemqwmou ouoh ma;ebiwou capecyt `nnen[alauj `n,wlem.\nالشكوك وفاعلوها ابطلهم، ولينقض افتراق فساد البدع. أعداء كنيستك المقدسة يا رب، مثل كل زمان، الآن أيضاً أذلهم. حل تعاظمهم، عرفهم ضعفهم سريعاً.\n** All offenses and their instigators, abolish. May all dissensions of corrupt heresies cease. The enemies of Your holy Church, O Lord, as at all times, now also humiliate. Strip their vanity, show them their weakness speedily.\n** Ni`ckandalon nem nyet`iri `mmwou korfou@ maroukyn `nje nivwrj `m`ptako `nte niherecic. Nijaji `nte Tekekklycia =e=;=u `P=o=c@ `m`vry] `ncyou niben nem ]nou ma;ebiwou. Bwl `ntoumet[acihyt `ebol@ matamwou `etoumetjwb `n,wlem.\nابطل حسدهم، وسعايتهم، وجنونهم، وشرهم، ونميمتهم التي يصنعونها فينا.\n** Bring to naught their envy, their intrigues, their madness, their wickedness, and their slander, which they commit against us.\n** Kwrf `nnou`v;onoc `nou`epiboly `noumankania `noukakourgia `noukatalalia `etou`iri `mmwou qaron.\nيا رب اجعلهم كلهم كلا شئ، وبدد مشورتهم يا الله الذي بدد مشورة أخيتوفل.\n** O Lord, bring them all to no avail. Disperse their counsel, O God, who dispersed the counsel of Ahithophel.\n** `P=o=c `aritou tyrou `naprakton@ ouoh jwr `ebol `mpouco[ni@ `V] vy `etafjwr `ebol `m`pco[ni `n`A,itovel.\nالشعب:\n** People:\n** Pilaoc@\nآمين. يا ربُ إرحم.\n** Amen. Lord have mercy.\n** `Amyn. Kurie `ele`ycon.\nقم أيها الرب الإله. وليتفرق جميع أعدائك. وليهرب من قدام وجهك كل مبغضي إسمك القدوس.\n** Arise, O Lord God, let all Your enemies be scattered, and let all who hate Your holy name flee before Your face.\n** Twnk `P=o=c `V]@ maroujwr `ebol `nje nekjaji tyrou@ marouvwt `ebol qa`thy `mpekho `nje ouon niben e;moc] `mpekran =e=;=u.\nوأما شعبك فليكن بالبركة، ألوف ألوف وربوات ربوات، يصنعون إرادَتك.\n** But let Your people be in blessing, thousands of thousands and ten thousand times ten thousand doing Your will.\n** Peklaoc de marefswpi qen pi`cmou `ehananso `nso@ nem han`;ba `n`;ba@ eu`iri `mpekouws.\nالشماس:\n** Deacon:\n** Pidiakwn@\nأيها الجلوس قفوا.\n** You who are seated, stand.\n** `I ka;ymeni `anac;yte.\nهنا يأخذ الكاهن المجمرة في يده ثم يقول:\n((عبادة الأوثان بالكمال إقلعها من العالم الشيطان وكل قواتها الشريرة إسحقهم وأذلهم تحت أقدامنا سريعًا الشكوك وفاعليها أبطلهم ولينقض إفتراق فساد البدع أعداء بيعتك المقدسة يا رب كما في كل زمان والآن أذلهم حل تعاظمهم عرفهم ضعفهم سريعًا أبطل حسدهم وسعايتهم وجنونهم وشرهم ونميمتهم التي يصنعونها فينا يا رب إجعلهم كلهم كلا شيء وبدد مشورتهم (هنا يقول بلحن العتيقة) يا الله الذي بدد مشورة أخيتوفل))\nيقول الشعب\nيا رب إرحم\nهنا يرفع الكاهن البخور من فوق الصينية ويقول:\nقم أيها الرب الإله ولتتفرق جميع اعدائك وليهرب من قدام وجهك كل مبغضي إسمك القدوس (هنا يلتفت الكاهن إلى الغرب ويعطي البخور للشعب قائلًا) وأما شعبك فليكن بالبركة ألوف ألوف وربوات ربوات يصنعون إرادتك)\nيقول الشماس: (أيها الجلوس قفوا)\nالطلبه (حل المربوطين)\nالقداس الكيرلسي\nالخولاجي\nاوشيه الأجتماعات\n"},{"n":"28- الطلبة (حل المربوطين)","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nحِلَّ المربوطين. خلِّص الذين في الشدائد.\n** Loose the bound. Save those who are in distress.\n** Bwl `nnyetcwnh `ebol. Nohem `nnyetqen ni`anagky.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nالجياع أشبعهم. صغيري القلوب عزهم.\n** Satisfy the hungry. Comfort the faint-hearted.\n** Nyethoker matciwou. Nyetoi `nkouji `nhyt manom] nwou.\nالساقطين أقِمهم. القيام ثبتهم.\n** Raise the fallen. Confirm the upright.\n** Ny`etauhei matahwou `eratou. Nyet`ohi `eratou matajrwou.\nالضالين ردهم. أدخلهم جميعاً إلى طريق خلاصك.\n** Return those who have strayed. Bring them all into the way of Your salvation.\n** Ny`etaucwrem matac;wou. `Anitou tyrou `eqoun `e`vmwit `nte pekoujai.\nعدَّهم مع شعبك. ونحن أيضاً أنقذنا من خطايانا.\n** Count them with Your people. And we too, redeem us from our sins.\n** `Opou nem peklaoc. `Anon de hwn cotten `ebolqen nennobi.\nصائراً حارساً وساتراً علينا في كل شئ.\n** Guard us and cover us in all things.\n** Ekoi `nrefrwic nem ref`ckepy `ejwn kata hwb niben.\nالشماس:\n** Deacon:\n** Pidiakwn@\nوإلى الشرق أنظروا.\n** Look towards the east.\n** Ic `anatolac `ble'ate.\nيقول الكاهن\nعدهم مع شعبك\nونحن أيضًا إنقذنا من خطايانا\nكن حارسًا وساترًا علينا في كل شيء.))\nيقول الشماس\nإلى الشرق انظروا\nالقداس الكيرلسي\nالخولاجي\nانت فوق كل رئاسه\nعباده الاوثان / قم ايها الرب\n"},{"n":"29- أنت فوق كل رئاسة","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nلأنك أنت هو الله الذي فوق كل رئاسة وكل سلطان وكل قوة وكل سيادة وكل إسم يُسمى ليس في هذا الدهر فقط بل وفي الأتي.\n** For You are God, who are above every principality and every authority, and every power and every dominion, and every name that is named, not only in this age, but also in that which is to come.\n** `N;ok gar pe `V] etca`pswi `nar,y niben@ nem exoucia niben nem jom niben nem met=o=c niben@ nem ran niben `etou`eronomazin `mmwou oumonon qen pai`eneh alla nem qen pe;nyou.\nأنت الذي يقف أمامك ألوف ألوف، وربوات ربوات الملائكة، ورؤساء الملائكة، القدسين يخدمونك.\n** You are He before whom stand thousands of thousands and ten thousand times ten thousand of holy angels and archangels, serving You.\n** `N;ok gar `etou`ohi `eratou nahrak `nje ni`ana`nso `nso nem ni`ana`n;ba `n;ba@ `nte niaggeloc nem niar,yaggeloc =e=;=u eusemsi nak.\nأنت الذي يقوم أمامك كائناك الكريمان جداً، ذوا الستة الأجنحة، الكثيرة الأعين، السيرافيم والشاروبيم.\n** You are He before whom stand Your two most honored creatures, with their six wings and many eyes, the Seraphim and the Cherubim.\n** `N;ok gar pe `etou`ohi `eratou nahrak `nje pezwon `cnau (=b) ettaiyout `emasw@ na picoou (^) `ntenh ouoh etos `mbal@ `nCeravim ouoh `n<eroubim.\nفبجناحين يغطون وجوههم من أجل لاهوتك الذي لا يستطاع النظر إليه ولا التفكر فيه، وبإثنين يغطون أرجلهم، ويطيرون بالإثنين الأخرين.\n** With two wings they cover their faces on account of Your divinity that cannot be seen or comprehended, and with two they cover their feet, and with the other two they fly.\n** Qen `cnau (=b) men `ntenh euhwc `nnouho@ e;be tekme;nou] `nat`ser;e`wrin `mmoc ouoh `nat`smokmek `eroc@ qen `cnau de euhwc `nnou[lauj@ euhyl de qen pike`cnau.\nلأن في كل زمان يقدسك كل أحد. لكن مع كل من يقدسك، إقبل تقديسنا منا نحن أيضاً يا رب، إذ نسبحك معهم قائلين:\n** For at all times, every one of them hallows You. But with every one that hallows You, receive from us, we too, our hallowing O Lord, as we praise You with them saying:\n** `Ncyou men gar niben ceer`agiazin `mmok `nje en,ai niben. Alla nem ouon niben eter`agiazen `mmok@ [i `mpen`agiacmoc `ntoten hwn `P=o=c@ enhwc `erok nemwou enjw `mmoc.\nالشماس:\n** Deacon:\n** Pidiakwn@\nفلننصت.\n** Let us attend.\n** `Proc,wmen.\nالشعب:\n** People:\n** Pilaoc@\nقدوس قدوس قدوس، رب الصاباؤت، السماء والأرض، مملوءتان من مجدك الأقدس.\n** Holy holy holy, Lord of hosts, heaven and earth, are full of Your holy glory.\n** `Agioc `agioc `agioc@ Kurioc cabaw;@ `plyryc `o ouranoc ke `y gy@ tyc `agiac cou doxyc.\nيقول الكاهن\n((أنك أنت هو الله الذي فوق كل رئاسة وكل سلطان وكل قوة وكل سيادة وكل إسم يسمي ليس في هذا الدهر فقط بل وفي الآتي انت الذي يقوم أمامك ألوف ألوف وربوات ربوات الملائكة ورؤساء الملائكة المقدسين يخدمونك انت الذي يقوم امامك حيواناك الكريمان جدًا ذوو الستة الجنحة الكثيرا الأعين: السارافيم والشاروبيم فبجناحين يغطون وجوههم من أجل لاهوتك الذي لا يستطاع النظر إليه ولا التفكير فيه وبإثنين يغطون أرجلهم ويطيرون بالإثنين الآخرين (ثم يصيح الكاهن ويقول) لأن في كل زمان يقدسك كل احد لكن مع كل من يقدسك إقبل منا نحن أيضًا يا رب تقديسنا إذ نسبحك معهم قائلين:\nيقول الشماس\nإبروس خومين\nيقول الشعب\nقدوس قدوس قدوس رب الصاباؤوت السماء والأرض مملوئتان من مجدك الأقدس\nالقداس الكيرلسي\nالخولاجي\nتعالوا الى المائده\nالطلبه (حل المربوطين)\n"},{"n":"30- تعالوا إلى المائدة","t":"او يقول الشعب هذا الاسبسمس او غيره قبل آجيوس السابقة:\n(تعالوا إلى المائدة نبارك الله مع الملائكة ورؤساء الملائكة صارخين قائلين: قدوس قدوس قدوس انت يا رب الليلويا المجد للآب والإبن والروح القدس الآن وكل اوان وإلى دهر الداهرين آمين)\nتجد باقي هذا الأسبسمس وغيره من الأسبسمات في قداس القديس باسيليوس\nوأثناء ما تقدم يغسل الكاهن يديه وهو يقول:\n(تنضح على بزوفاك فأطهر تغسلني فأبيض أكثر من الثلج تسمعني سرورًا وفرحًا فتبتهج عظامي المتواضعة أغسل يدي بالنقاوة واطوف حول مذبحك يا رب كي أسمع صوت تسبيحتك)\nاجيوس / قدوس\nالقداس الكيرلسي\nالخولاجي\nانت فوق كل رئاسه\n"},{"n":"31- آجيوس / قدوس","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأجيوس، أجيوس أجيوس.\n** Agios, agios, agios.\n** `Agioc `agioc `agioc.\nقدوس رب الجنود. السماء والأرض مملوءتان من مجدك الأقدس. أيها الرب إلهنا. بالحقيقة السماء والأرض مملوءتان من مجدك الأقدس.\n** Holy, O Lord of hosts, heaven and earth are full of Your holy glory, O Lord our God. Truly, heaven and earth are full of Your holy glory.\n** `<ouab `P=o=c cabaw;@ `tve nem `pkahi meh `ebolqen pek`wou =e=;=u `P=o=c penNou]. `Aly;wc `tve nem `pkahi meh `ebolqen pek`wou =e=;=u.\nمن قِبَل إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا يسوع المسيح. إملأ هذه الصعيدة التي لك يا رب بالبركة التي من قبلك. بحلول روحك القدوس عليها.\n** Through Your only-begotten Son, our Lord, God, Savior, and King of us all, Jesus Christ. Fill this, Your sacrifice, O Lord, with the blessing which is from You. By the coming down upon it of Your Holy Spirit.\n** Hiten pekmonogenyc `nSyri pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c. Mah taike;ucia `ntak ;ai `P=o=c qen pi`cmou. Pi`ebol hitotk hiten `pjin`i `e`qryi `ejwc `nte Pek`pneuma =e=;=u.\nالشعب:\n** People:\n** Pilaoc@\nآمين.\n** Amen.\n** `Amyn.\nوبالبركة بارك.\n** And with blessing, bless.\n** Ouoh qen ou`cmou ek`e`cmou.\nوبالتقديس قدس.\n** And with sanctification, sanctify.\n** Ouoh qen outoubo ek`etoubo.\nثم يأخذ اللفافة التي على الكأس على يده اليمني وعندما يقول الشعب (آجيوس) يرشم ثلاثة رشوم الأول على نفسه والثاني على الخدام والثالث على الشعب والكاهن الشريك يدور بالمجمرة ثم يقول الكاهن:\nقدوس رب الجنود السماء والأرض مملوءتان من مجدك المقدس أيها الرب إلهنا بالحقيقة السماء والأرض مملوئتان من مجدك المقدس من قبل إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح إملأ هذه الصعيدة التي لك يا رب البركة (هنا يرشم الكاهن على الصينية والكأس معًا رشمًا واحدًا ويقول:) التي من قبلك بحلول روحك القدوس عليها)\nيقول الشعب\nآمين\nتقديس الخبز\nالقداس الكيرلسي\nالخولاجي\nتعالوا الى المائده\n"},{"n":"32- تقديس الخبز","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nقرابينك هذه المكرمة التي بدأنا بوضعها أمامك، هذا الخبز وهذه الكأس.\n** Your precious gifts which have been set forth before You, this bread and this cup.\n** `Nnaidwron `ntak ettaiyout@ etersorp `n,y `e`qryi `mpek`m;o@ paiwik nem pai`avot.\nلأن إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح. في الليلة التي أسلم ذاته فيها ليتألم عن خطايانا. والموت الذي قبله بذاته بإرادته وحده عنا كلنا.\n** For Your only-begotten Son, our Lord, God, Savior, and King of us all, Jesus Christ. In the night in which He gave Himself up that He might suffer for our sins. And death, which He accepted by His own will for us all.\n** Je `n;of pekmonogenyc `nSyri pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c. Qen pi`ejwrh `etenatyif `nqytf `esep`mkah `e`hryi `ejen nennobi. Nem pimou `etafsopf `erof `ebol hitotf qen pefouws `mmin `mmof `e`hryi `ejwn tyren.\nالشعب:\n** People:\n** Pilaoc@\nنؤمن.\n** We believe.\n** `Aly;oc picteu`omen.\nأخذ خبزاً على يديه الطاهرتين، اللتين بلا عيب ولا دنس، الطوباويتين المحييتين.\n** He took bread into His holy hands, which are without spot or blemish, blessed, and life-giving.\n** Af[i `nouwik `ejen nefjij =e=;=u@ `nata[ni ouoh `nat;wleb@ ouoh `mmakarion@ ouoh `nreftanqo.\nنؤمن أن هذا هو بالحقيقة. آمين.\n** We believe that this is true. Amen.\n** Tennah] je vai pe qen oume;myi. `Amyn.\nونظر إلي فوق نحو السماء، إليك يا الله أباه وسيد كل أحد.\n** He looked up toward heaven to You, O God, who are His Father and Master of everyone.\n** Afjoust `e`pswi `e`tve harok@ vy`ete vwf `nIwt `V] ouoh `vNyb `nte ouon niben.\nوشكر.\n** And when He had given thanks.\n** `Etafsep`hmot.\nآمين.\n** Amen.\n** `Amyn.\nوباركه.\n** He blessed it.\n** Af`cmou `erof.\nوقدسه.\n** He sanctified it.\n** Afer`agiazin `mmof.\nنؤمن ونعترف ونمجد.\n** We believe, we confess, and we glorify.\n** Picteu`omen ke `omologoumen ke doxazomen.\nوقسمه، وأعطاه لتلاميذه القديسين ورسله الأطهار قائلاً:\n** He broke it, and gave it to His own holy disciples and saintly apostles, saying,\n** Afvasf aftyif `nny`ete nouf `n`agioc `mma;ytyc@ ouoh `n`apoctoloc =e=;=u efjw `mmoc.\n\"خذوا كلوا منه كلكم. لأن هذا هو جسدي الذي يقسم عنكم وعن كثيرين، يُعطى لمغفرة الخطايا. هذا إصنعوه لذكري.\"\n** \"Take, eat of it, all of you. For this is My Body, which is broken for you and for many, to be given for the remission of sins. This do in remembrance of Me.\"\n** Je [i ouwm `ebol `nqytf tyrou. Vai gar pe Pacwma `etounavasf `ejen ;ynou nem hankemys@ `ncetyif `e`p,w `ebol `nte ninobi. Vai `aritf `epaer`vmeu`i.\nهذا هو بالحقيقة. آمين.\n** This is true. Amen.\n** Vai pe qen oume;myi. `Amyn.\nيشير الكاهن إلى الخبز والخمر بيده ويقول:\n(قرابينك هذه المكرمة المبدوء بوضعها أمامك هذا الخبز وهذه الكأس لأن إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا يسوع المسيح)\nيقول الشعب\nأمين\nهنا يمسك المعلقة باللفافة ويرشم بها على درج البخور رشمًا واحدًا ويضع بها البخور في المجمرة ثم يبخر بيديه على المجمرة ثلاث دفعات كالعادة ويقول (في الليلة التي أسلم ذاته فيها ليتألم عن خطايانا والموت الذي قبله بذاته بإراداته وحده عنا كلنا)\nيأخذ الكاهن الخبز على يديه وهو يقول:\n(أخذ خبزًا على يديه المقدسيتين بلا عيب ولا دنس الطوباويتين)\nيقول الكاهن\n(ونظر إلى فوق السماء نحوك يا الله أباه وسيد كل أحد وشكر)\nيقول الشعب: أمين\nيقول الكاهن: وباركه\nيقول الكاهن: وقدسه\nيقول الشعب: آمين نؤمن ونعترف ونمجد\n(وقسمه (ينفخ نفخة الروح المقدس) وأعطاه لتلاميذه الكرام القديسين ورسله الأطهار قائلًا \" خذوا كلوا منه كلكم لأن هذا هو جسدي الذي يقسم عنكم وعن كثيرين يعطي لمغفرة الخطايا هذا أصنعوه لذكري)\nتقديس الكاس\nالقداس الكيرلسي\nالخولاجي\nاجيوس / قدوس\n"},{"n":"33- تقديس الكأس","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nهكذا الكأس أيضاً، بعد العشاء، مزجها من خمر وماء.\n** Likewise also, the cup, after supper, He mixed it of wine and water.\n** Pairy] on pike`avot menenca pidipnon@ af;otf `ebolqen ouyrp nem oumwou.\nوشكر.\n** And when He had given thanks.\n** `Etafsep`hmot.\nالشعب:\n** People:\n** Pilaoc@\nآمين.\n** Amen.\n** `Amyn.\nوباركه.\n** He blessed it.\n** Af`cmou `erof.\nوقدسه.\n** He sanctified it.\n** Afer`agiazin `mmof.\nآمين. وأيضاً نؤمن ونعترف ونمجد.\n** Amen. Again, we believe, we confess, and we glorify.\n** `Amyn. Ke palin picteu`omen ke `omologoumen ke doxazomen.\nوذاق، وأعطاها أيضاً لتلاميذه القديسين ورسله الأطهار قائلاً:\n** He tasted, and gave it also to His own holy disciples and saintly apostles, saying:\n** Afjem]pi aftyif on `nny`ete nouf `n`agioc `mma;ytyc@ ouoh `n`apoctoloc =e=;=u efjw `mmoc.\n\"خذوا اشربوا منه كلكم. لأن هذا هو دمي الذي للعهد الجديد، الذي يُسفَك عنكم وعن كثيرين، يُعطى لمغفرة الخطايا. هذا إصنعوه لذكري.\n** \"Take, drink of it all of you. For this is My Blood of the new covenant which is shed for you and for many, to be given for the remission of sins. This do in remembrance of Me.\"\n** Je [i cw `ebol `nqytf tyrou. Vai gar pe Pa`cnof `nte ]dia;yky `mberi@ `etounavonf `ebol `ejen ;ynou nem hankemys@ `ncetyif `e`p,w `ebol `nte ninobi. Vai `aritf `epaer`vmeu`i.\nهذا هو أيضاً بالحقيقة. آمين.\n** This is also true. Amen.\n** Vai on pe qen oume;myi. `Amyn.\nيقول الكاهن\n(هكذا الكأس ايضًا من بعد العشاء مزجها من خمر وماء وشكر)\nيقول الشعب\nآمين\nوباركها\nوقدسها\nآمين وأيضًا نؤمن ونعترف ونمجد\n(وذاق (ينفخ نفخة الروح القدس) وأعطاها أيضًا لتلاميذه الكرام القديسيين ورسله الطهار قائلًا: خذوا أشربوا منها كلكم لأن هذا هو دمي الذي لعهد الجديد الذي يسفك عنكم وعن كثيرين يعطي لمغفرة الخطايا هذا أصنعوه لذكري)\nوهذا أيضا هو بالحقيقة آمين\nالقداس الكيرلسي\nالخولاجي\nفى كل مره تأكلون / بموتك يا رب نبشر\nتقديس الخبز\n"},{"n":"34- لأن في كل مرة تاكلون / بموتك يا رب نبشر","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\n\"لأن كل مرة تأكلون من هذا الخبز، وتشربون من هذه الكأس، تبشرون بموتي وتعترفون بقيامتي، وتذكروني إلى أن أجئ.\"\n** \"For every time you shall eat of this bread and drink of this cup, you proclaim My Death, confess My Resurrection, and remember Me till I come.\"\n** Cop gar niben `etetennaouwm `ebolqen paiwik vai@ ouoh `ntetencw `ebolqen pai`avot vai@ `eretenhiwis `mPamou@ `eretener`omologin `nTa`anactacic@ `ereten`iri `mpameu`i sa]`i.\nالشعب:\n** People:\n** Pilaoc@\nآمين آمين آمين. بموتك يا رب نبشر، وبقيامتك المقدسة وصعودك إلى السموات، نعترف. نسبحك، نباركك، نشكرك يا رب ونتضرع إليك يا إلهنا.\n** Amen Amen Amen. Your Death O Lord, we proclaim. Your holy Resurrection and Ascension into the heavens, we confess. We praise You, we bless You, we thank You O Lord, and we entreat You, O our God.\n** `Amyn `amyn `amyn. Ton :anaton cou Kurie kataggelomen ke tyn `agian cou `Anactacin ke tyn `Analy'in cou `ntyc ouranic ce `omologoumen. Ce `enoumen ce eulogoumen ci eu,arictoumen Kurie@ ke de`ome;a cou `o :eoc `ymwn.\nفالآن يا الله الآب ضابط الكل، فيما نحن نبشر بموت إبنك الوحيد، ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح. ونعترف بقيامته المقدسة، وصعوده إلى السموات، وجلوسه عن يمينك أيها الأب.\n** Therefore now, O God, the Father, the Pantocrator, as we proclaim the death of Your only-begotten Son, our Lord, God, Savior, and King of us all, Jesus Christ. And confess His holy Resurrection, His Ascension into the heavens, His sitting at Your right hand, O Father.\n** }nou oun `V] `vIwt piPantokratwr@ enhiwis `m`vmou `mpekmonogenyc `nSyri pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c. Enermologin `nTef`anactacic =e=;=u@ nem Pefjinse `e`pswi `enivyou`i@ nem Pefjinhemci catekou`inam `vIwt.\nوننتظر ظهوره الثاني الآتي من السموات، المخوف المملوء مجداً في إنقضاء هذا الدهر. هذا الذي يأتي فيه ليدين المسكونة بالعدل. ويعطي كل واحد كأعماله، إن كان خيراً وإن كان شراً.\n** And look for His Second Coming from the heavens, awesome and full of glory at the end of this age. Wherein He shall come to judge the world in righteousness. And give each one according to his deeds, whether they be good or evil.\n** Enjoust `ebol qa`thy `ntefmah`cnou] `mparoucia@ e;nyou `ebolqen nivyou`i@ etoi `nho] ouoh e;meh `n`wou@ qen ]cuntelia `nte pai`ewn. :ai `etefnyou `nqytc `e]hap `e]oikoumeny qen oume;myi. Nem `e] `mpiouai piouai kata nef`hbyou`i@ `ite oupe;nanef `ite oupethwou.\nكرحمتك يا رب، وليس كخطايانا.\n** According to Your mercy O Lord, and not according to our sins.\n** Kata to `eleoc cou Kurie@ ke my kata tac `amartiac `ymwn.\nويطوف الكاهن الشريك الهيكل بالمجمرة وأما الكاهن الخديم فيشير إلى الجسد والدم قائلًا:\n(لأن كل مرة تأكلون من هذا الخبز وتشربون من هذه الكأس تبشرون بموتي وتعترفون بقيامتي وتذكرونني إلى أن آجئ)\nيقول الشعب:\nيقول الكاهن\n(فالآن يا الله الآب ضابط الكل فيما نحن نبشر بموت إبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح ونعترف بقيامته المقدسة وصعوده إسموات وجلوسه عن يمينك أيها الآب وننتظر ظهوره الثاني الآتي من السموات المخوف المملوء مجدًا في إنقضاء هذا الدهر هذا الذي ياتي فيه ليدين المسكونة بالعدل ويعطي كل واحد كأعماله إن كان خيرًا وإن كان شرًا)\nكرحمتك يا رب ولا كخطاياك\nالقداس الكيرلسي\nالخولاجي\nنسال ونطلب من صلاحك\nتقديس الكاس\n"},{"n":"35- نسأل و نطلب من صلاحك يا محب البشر","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nأنت الذي وضعنا أمام مجدك القدوس قرابينك مما لك يا أبانا القدوس.\n** You are He before whose holy glory we have put Your gifts, from what is Your own, O our holy Father.\n** `N;ok pe `etan,w `mpe`m;o `mpekwou =e=;=u@ `nny`ete nouk `ndwron `ebolqen ny`ete nouk penIwt =e=;=u.\nالشماس:\n** Deacon:\n** Pidiakwn@\nاسجدوا لله بخوف.\n** Worship God in fear.\n** `Klinate :e`w meta vobou.\nالكاهن (سراً):\n** Priest Inaudibly:\nنسأل ونطلب من صلاحك يا محب البشر، لا تخزنا بالخِزيْ الأبدي، ولا تطرحنا نحن عبيدك. ولا تصرفنا عن وجهك ولا تقل لنا \"إنني لست أعرفكم.\"\n** We ask and entreat Your goodness, O Lover of mankind, put us not to everlasting shame nor cast us away, we Your servants. Drive us not away from Your face, neither say to us, \"I know you not.\"\n** Ten]ho ouoh tentwbh `ntekmet`aga;oc piMairwmi `mper]sipi nan qen pisini `n`eneh@ oude `mperhitten `ebol qa nek`ebiaik. `Mperberbwrten `ebolha pekho@ oude `mperjoc nan je ]cwoun `mmwten an.\nبل أعط ماء لرؤوسنا، وينابيع دموع لأعيننا، لكيْ نبكي نهاراً وليلاً أمامك على زلاتنا. لأننا نحن شعبك وخراف قطيعك. تجاوز عن آثامنا، وأصفح عن زلاتنا.\n** But rather give water for our heads and fountains of tears for our eyes that we may weep day and night before You on account of our transgressions. For we are Your people, the sheep of Your flock.Remit our iniquities and forgive our transgressions.\n** Alla moi `noumwou `nnen`avyou`i@ nem hanmoumi `nermy `nnenbal@ hopwc `ntenrimi `mpi`ehoou nem pi`ejwrh `mpek`m;o `e`hryi `ejen nenparaptwma. Je `anon pe peklaoc nem ni`ecwou `nte pek`ohi. Cini `nnen`anomia@ `aricun,wrin `nnenparaptwma.\nالتي صنعناها بمشيئتنا والتي صنعناها بغير مشيئتنا، التي صنعناها بمعرفة والتي صنعناها بغير معرفة، الخفية والظاهرة.\n** Which we have committed willingly and which we have committed unwillingly, which we have committed knowingly and which we have committed unknowingly, the hidden and the manifest.\n** Ny`etanaitou qen penouws@ nem ny`etanaitou qen penouws an@ ny`etanaitou qen ou`emi@ nem ny`etanaitou qen oumetat`emi@ nyethyp nye;ouwnh `ebol.\nالتي سبق إظهارها والتي نسيناها، هذه هي التي يعرفها إسمك القدوس. إسمع يا رب طلبة شعبك، وإلتفت إلى تنهد عبيدك.\n** Those which are manifest beforehand and those which we have forgotten. Those which are known before Your holy name. Hearken, O Lord, to the prayer of Your people, and be mindful of the groaning of Your servants.\n** Ny`etauersorp `nouonhou `ebol nem ny`etanwbs `erwou@ nai `etefcwoun `mmwou `nje pekran =e=;=u. Cwtem `P=o=c `e`ptwbh `nte peklaoc@ ma`h;yk `epifiahom `nte nek`ebiaik.\nومن أجل خطاياي خاصة ونجاسات قلبي لا تحرم شعبك من حلول روحك القدوس.\n** Because of my own sins and the abominations of my heart, deprive not Your people of the coming down of Your Holy Spirit.\n** Ouoh e;be nanobi nou`i nem nicwf `nte pahyt@ `mperfej peklaoc `m`pjin`i `e`qryi `nte Pek`pneuma =e=;=u.\nالشعب:\n** People:\n** Pilaoc@\nأرحمنا يا الله الآب ضابط الكل. (3 مرات)\n** Have mercy upon us, O God, the Father, the Pantocrator. [3 times]\n** `Ele`ycon `ymac `o :eoc `o Patyr `o Pantokratwr. (=g)\nيقول الكاهن\nيقول الشماس\nيقول الكاهن سرًا\n(نسأل ونطلب من صلاحك يا محب البشر لا تخزنا بالخزي الأبدي ولا تطرحنا نحن عبيدك ولا تصرفنا عن وجهك ولا تقل لنا أنني لست أعرفكم بل أعط ماءًا لرؤوسنا وينابيع دموع لأعيننا لكي نبكي نهارًا وليلًا أمامك على زلاتنا لأننا نحن شعبك وخراف قطيعك تجاوز عن آثامنا وإصفح عن زلاتنا التي صنعناها بمشيئتنا والتي صنعناها بغير مشيئتنا التي صنعناها بعلم والتي صنعناها بغير علم الخفية والظاهرة التي سبق إظهارها والتي نسيناها هذه التي يعرفها إسمك القدوس إسمع يا رب طلبة شعبك وألتفت إلى تنهد عبدك ومن أجل خطاياي خاصة ونجاسات قلبي لا تحرم شعبك حلول روحك القدوس)\nيقول الشعب\nيا رب إرحم\nشعبك وبيعتك يطلبون اليك أرحمنا\nالقداس الكيرلسي\nالخولاجي\nفى كل مره تأكلون / بموتك يا رب نبشر\n"},{"n":"36- شعبك و بيعتك يطلبون إليك قائلين ارحمنا يا الله","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nلأن شعبك وبيعتك يطلبون إليك قائلين:\n** For Your people and Your Church entreat You, saying,\n** Peklaoc gar nem Tekekklycia cetwbh `mmok eujw `mmoc.\n\"أرحمنا يا الله الآب ضابط الكل.\" (3 مرات)\n** \"Have mercy upon us, O God, the Father, the Pantocrator.\" [3 times]\n** Je nai nan `V] `vIwt piPantokratwr. (=g)\nالشماس:\n** Deacon:\n** Pidiakwn@\nإسجدوا لله الآب ضابط الكل.\n** Worship God, the Father, the Pantocrator.\n** Ouwst `m`V] `vIwt piPantokratwr.\nالكاهن (سراً):\n** Priest Inaudibly:\nوإرسل إلى أسفل من علوَك المقدس، ومن مسكنك المستعد، ومن حضنك غير المحصور، ومن عرش مملكة مجدك.\n** And send down from Your holy highest, and from Your prepared mansion, and from Your boundless bosom, and from the throne of the kingdom of Your glory.\n** Ouoh ouwrp `epecyt `ebolqen pek[ici =e=;=u@ nem `ebolqen pekma`nswpi etcebtwt `ebolqen piatsorff `eqoun `ekenf `ntak@ `ebolqen pi`;ronoc `nte `;metouro `mpek`wou.\nالبارقليط، روحك القدوس، الأقنوم غير المستحيل، ولا متغير، الرب المحيي. الناطق في الناموس والأنبياء والرسل.\n** The Paraclete, Your Holy Spirit who is a hypostasis, the Immutable, the Unchangeable, the Lord, the Giver of life. Who spoke in the Law, the prophets, and the Apostles.\n** `N;of piParaklytoc Pek`pneuma =e=;=u vyetsop qen ouhupoctacic@ piAtvwnh piAtsib]@ vyetoi `n=o=c piReftanqo. Vy`etafcaji qen piNomoc nem ni`provytyc nem ni`apoctoloc.\nالحال في كل مكان، المالئ كل مكان ولا يحويه مكان. واهب القداسة بسلطة بمسرتك للذين أحبهم وليس كالخادم.\n** Who is in every place and who fills every place, yet no place can contain. Who, by His own glory, according to Your goodwill, works sanctification upon those whom He loves, not as servants.\n** Vyetsop qen mai niben ouoh e;moh `mmai niben@ ouoh `mmon ma swp `mmof. Ouoh eferenergin audoxoucioc qen pek]ma] `mpitoubo `e`hryi `ejen ny`etefou`asou@ kata oumetrefsemsi an.\nالبسيط في طبيعته، الكثير الأنواع في فعله، ينبوع النعم الإلهية. المساوي لك، المنبثق منك. شريك عرش مملكة مجدك، وإبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح.\n** Who is single in His nature and man fold in His working, the fountain of divine graces. Who is of one essence with You, who proceeds from You, the companion of the throne of the kingdom of Your glory, with Your only-begotten Son, our Lord, God, Savior, and King of us all, Jesus Christ.\n** Piaploun qen tefvucic vyetoi `nou;o `nry] qen tefenergia@ ]moumi `nte ni`hmot `nnou]. Vyetoi `n`omooucioc nemak@ vye;nyou `ebol `nqytk. Pi`svyr `n`;ronoc `nte `;metouro `mpek`wou nem pekmonogenyc `nSyri pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c.\nعلينا نحن عبيدك وعلى هذه القرابين التي لك المكرمة السابق وضعها أمامك.\n** Upon us, we Your servants, and upon these precious gills which have been set forth before You.\n** `E`hryi `ejwn qa nek`ebiaik@ nem `ejen naidwron `ntak ettaiyout@ `etersorp `n,y `e`qryi `mpe`m;o.\nعلى هذا الخبز وعلى هذه الكأس، لكي يتطهرا وينتقلا.\n** Upon this bread and this cup, that they may be sanctified and changed.\n** `Ejen paiwik vai nem `ejen pai`avot vai@ hina `ntoutoubou ouoh `ntouou`wteb.\nننصت. آمين.\n** Let us attend. Amen.\n** `Proc,wmen. `Amyn.\nالشعب:\n** People:\n** Pilaoc@\nآمين.\n** Amen.\n** `Amyn.\nوهذا الخبز يجعله جسداً مقدساً للمسيح.\n** And this bread He makes into His holy Body of Christ.\n** Ouoh paiwik men `ntefaif `nCwma =e=;=u `nte P=,=c.\nوهذه الكأس أيضاً دماً كريماً للعهد الجديد الذي له.\n** And this cup also, the precious Blood of His new covenant.\n** Ouoh pai`avot de on `n`Cnof eftaiyout `nte ]dia;yky `mberi `ntaf.\nربنا وإلهنا ومخلصنا يسوع المسيح.\n** Our Lord, God, and Savior, and King of us all, Jesus Christ.\n** Pen=o=c ouoh penNou] ouoh penCwtyr ouoh penOuro tyren I=y=c P=,=c.\nهنا ياخذ الكاهن اللفافة على يده ويلتفت إلى الشعب ويشير إليهم بيده ثم يلتفت إلى الشرق ويصرخ ويقول\n(لأن شعبك وبيعتك يطلبون إليك قائلين إرحمنا يا الله الآب ضابط الكل)\nيقول الشعب (ثلاث مرات)\nإرحمنا يا الله الآب ضابط الكل\nيقول الشماس\nيقول الكاهن سرًا:\n(وأرسل إلى أسفل من علوك المقدس ومن مسكنك المستعد ومن حضنك غير المحصور ومن كرسي مملكة مجدك الباراقليط روحك الكائن بالأقنوم غير المستحيل ولا متغير الرب المحيي الناطق في الناموس والأنبياء والرسل والحال في كل مكان المالئ كل مكان ولا يحويه مكان الفاعل بسلطة مسرتك الطهر للذين أحبهم وليس كالخادم البسيط في طبيعته الكثير الأنواع في فعله ينبوع النعم الإلهية المساوي لك المنبثق منك شريك كرسي مملكة مجدك وإبنك الوحيد ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح علينا نحن عبيدك وعلى هذه القرابين التي لك المركة السابق وضعها أمامك (ثم يشير إلى الجسد والدم) على هذا الخبز وعلى هذه الكأس لكي يتطهرا ويتنقلا)\nننصت آمين\nيقول الشعب\nآمين\nيصرخ الكاهن وهو يشير على الجسد ثلاثة رشوم ويقول:\nهنا يرشم الكاهن ثلاثة رشوم على الكأس وهو يقول:\nيقول الكاهن\n(ربنا وإلهنا ومخلصنا وملكنا كلنا يسوع المسيح يعطي مغفرة الخطايا وحياة أبدية لمن يتناوله منه)\nيا رب إرحم يا رب إرحم يا رب إرحم\n** شعبك وكنيستك يطلبون اليك وبك الي الآب معك\n** قائلين إرحمنا يا الله الآب يا ضابط الكل إرحمنا ياالله مخلصنا\n** إرحمنا يا الله ثم ارحمنا يارب ارحم\n** بيك لاؤس غار نيم تيك اككليسيا سى تيهو إيروك أووه إيفول هيطوطك إى\n** إفيوت نيماك إفجو إمموس جي ناى نان إفنوتي إفيوت بى بانطوكراطور\n** جى ناى نان إفنوتي بينسوتير جى ناى نان إفنوتي أووه ناى نان كيريى ليسون\nالطلبات / وأهدنا إلي ملكوتك\nالقداس الكيرلسي\nالخولاجي\nنسال ونطلب من صلاحك\n"},{"n":"37- الطلبات / واهدنا إلى ملكوتك","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nلكيْ يكون لنا نحن جميعاً المتناولين منهما، إيماناً بغير فحص، ومحبة بغير رياء.\n** That they may be unto all of us who partake of them, faith without searching, love without hypocrisy.\n** Hina `ntouswpi nan tyren qa nye;na[i `ebol `mmwou. `Eounah] `natqotqet. `Eou`agapy `natmesobi.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nوصبراً كاملاً، ورجاء ثابتاً.\n** Perfect patience, firm hope.\n** `Eouhoupomony ecjyk `ebol. `Eouhelpic `ctajryout.\nوإيماناً وحراسةً، وعافيةً وفرحاً.\n** Faith and watchfulness, health and joy.\n** `Eounah]@ `eourwic. `Eoutoujo@ `eouounof.\nوتجديداً للنفس والجسد والروح، ومجداً لإسمك القدوس.\n** Renewal for the soul, body, and spirit, glory to Your holy name.\n** `Eoumetberi `nte ]'u,y nem picwma nem pi`pneuma. `Eouwou `mpekran =e=;=u.\nوشركة سعادة الحياة الأبدية، وعدم الفساد، وغفرانا للخطايا.\n** Sharing in the blessedness of eternal life and incorruption, and forgiveness of sins.\n** `Eoumet`svyr `nte oumetmakarioc `nte ouwnq `n`eneh nem oumetattako. `Eou,w `ebol `nte ninobi.\nكما كان وهكذا يكون، من جيل إلى جيل، وإلى دهر الدهور. آمين.\n** As it was and shall be, from generation to generation, and unto all the ages of the ages. Amen.\n** Wcper yn ke ecte ectin `apo geneac ic genean ke pantac touc `e`wnac twn `e`wnwn. `Amyn.\nلكيْ وبهذا كما أيضاً في كل شئ، يتمجد ويتبارك ويرتفع إسمك العظيم القدوس في كل شئ كريم ومبارك. مع يسوع المسيح إبنك الحبيب والروح القدس.\n** That as in this, so also in all things, Your great and holy name be glorified, blessed and exalted in everything, honored and blessed. With Jesus Christ, Your beloved Son, and the Holy Spirit.\n** Hina nem qen vai kata `vry] on qen hwb niben `ntef[i`wou ouoh `ntef[i`cmou ouoh `nte[ici@ `nje peknis] `nran =e=;=u@ qen hwb niben ettaiyout ouoh et`cmarwout. Nem I=y=c P=,=c pekmenrit `nSyri nem pi`Pneuma =e=;=u.\nالسلام للجميعكم.\n** Peace be with all.\n** `Iryny paci.\nولروحك أيضاً.\n** And with your spirit.\n** Ke tw `pneumati cou.\nيقول الكاهن الطلبة وفي كل ربع يجاوبه الشعب قائلين:\n(لكي يكون لنا جميعا نحن الآخذين منهما إيمانًا بغير فحص ومحبة بغير رياء)\nوصبرًا كاملًا ورجاءًا ثابتًا\nومشاركة سعادة الحياة الأبدية وعدم الفساد وغفرانًا للخطايا\nيقول الشعب\nكما كان هكذا يكون من جيل إلى جيل وإلى دهر الدهور آمين\nيقول الكاهن\n(وإهدنا إلى ملكوتك لكي وبهذا أيضًا في كل شيء يتمجد ويتبارك ويرتفع إسمك العظيم القدوس في كل شيء كريم ومبارك مع يسوع المسيح إبنك الحبيب والروح القدس السلام للكل)\nالجسد المقدس / بى سوما اثئواب\nالقداس الكيرلسي\nالخولاجي\nشعبك وبيعتك يطلبون اليك أرحمنا\n"},{"n":"38- الجسد المقدس / بي سوما إثؤواب","t":"الكاهن:\n** Priest:\n** Pi`precbuteroc@\nوأيضاً فلنشكر الله ضابط الكل، أبا ربنا وإلهنا ومخلصنا يسوع المسيح.\n** Again, let us give thanks to God the Pantocrator, the Father of our Lord, God, and Savior Jesus Christ.\n** Palin on marensep`hmot `ntotf `m`V] piPantokratwr@ `vIwt `m`P=o=c ouoh penNou] ouoh penCwtyr I=y=c P=,=c.\nلأنه جعلنا أهلاً الآن ان نقف في هذا الموضع المقدس، ونرفع أيدينا إلى فوق، ونخدم إسمه القدوس.\n** For He also has made us worthy now to stand in this holy place, to lift up our hands and to serve His holy name.\n** Je af`;rener`pem`psa on ]nou `e`ohi `eraten qen paima =e=;=u vai@ ouoh `efai `nnenjij `e`pswi@ ouoh `esemsi `mpefran =e=;=u.\nهو أيضاً فلنسأله أن يجعلنا مستحقين لشركة وإصعاد أسراره الإلهية غير المائتة.\n** Let us also ask Him to make us worthy of the communion and partaking of His divine and immortal mysteries.\n** `N;of on maren]ho `erof hopwc `ntefaiten `nem`psa `n]met`svyr nem ]met`alum'ic `nte nefmuctyrion `nnou] ouoh `na;mou.\nالشعب:\n** People:\n** Pilaoc@\nيا ربُ إرحم.\n** Lord have mercy.\n** Kurie `ele`ycon.\nالجسد المقدس.\n** The holy Body.\n** Picwma =e=;=u.\nنسجد لجسدك المقدس.\n** We worship Your holy Body.\n** Tenouwst `mPekcwma =e=;=u.\nوالدم الكريم.\n** And the precious Blood.\n** Nem pi`Cnof ettaiyout.\nولدمك الكريم.\n** And Your precious Blood.\n** Nem Pek`cnof ettaiyout\nاللذين لمسيحه، الضابط الكل الرب إلهنا.\n** Of His Christ, the Pantocrator, the Lord our God.\n** `Nte Pef`,rictoc@ `nje piPantokratwr `P=o=c penNou].\nالشماس:\n** Deacon:\n** Pidiakwn@\nآمين آمين صلوا.\n** Amen, Amen, pray.\n** `Amyn `amyn@ `proceuxac;e.\nالسلام للجميعكم.\n** Peace be with all.\n** `Iryny paci.\nولروحك أيضاً.\n** And with your spirit.\n** Ke tw `pneumati cou.\nيقول الكاهن قبل القسمة\n(وأيضًا فلنشكر الله ضابط الكل ابا ربنا وإلهنا ومخلصنا يسوع المسيح لأنها جلعنا مستحقين أيضًا الان أن نقف في هذا الموضع المقدس ونرفع أيدينا إلي فوق ونخدم إسمه القدوس هو أيضًا فلنسأله أن يجعلنا مستحقين لمشاركه وصعود أسراره الإلهية غير المائتة)\nيقول الشعب\nآمين\nيأخذ الكاهن الجسد على يديه ويقول\nبي سوما إثؤواب\nتين أوؤشت إم بيك سوما إثؤواب\nيقول الكاهن:\nنيم بي إسنوف إتطايوت\nنيم بيك إسنوف أتطايوت\nأنتي بيف إخرستوس إنجي بي بانطوكراطور\nإبشويس بين نوتي\nاللذان لمسيحه الضابط الرب إلهنا\nيقول الشماس:\nآمين. آمين إبروس إف إكساستي.\nآمين آمين صلوا\nكيريى إليسون\nالسلام للكل\nإيريني باسي\nكيتوإبنيفماتي سو\nصلاه القسمه للاب\nالقداس الكيرلسي\nالخولاجي\nالطلبات / وأهدنا إلي ملكوتك\n"},{"n":"39- صلاة القسمة للآب","t":"الشعب:\n** People:\n** Pilaoc@\nأبانا الذي في السموات. ليتقدس إسمك. ليأت ملكوتك. لتكن مشيئتك. كما في السماء كذلك على الأرض. خبزنا كفافنا أعطنا اليوم. وإغفر لنا ذنوبنا.\n** Our Father who art in heaven; hallowed be Thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses.\n** Je penIwt etqen nivyou`i mareftoubo `nje pekran@ marec`i `nje tekmetouro petehnak marefswpi `m`vry] qen `tve nem hijen pikahi@ pen`wik `nte rac] myif nan `mvoou ouoh ,a nyeteron nan `ebol.\nكما نغفر نحن أيضاً للمذنبين إلينا. ولا تدخلنا في تجربة. لكن نجنا من الشرير. بالمسيح يسوع ربنا، لأن لك الملك والقوة والمجد إلى الأبد.آمين.\n** As we forgive those who trespass against us. And lead us not into temptation, but deliver us from the evil one. In Christ Jesus our Lord, for Thine is the kingdom and the power and the glory forever. Amen.\n** `M`vry] hwn `nten,w `ebol `nny`ete ouon `ntan `erwou@ ouoh `mperenten `eqoun `epiracmoc alla nahmen `ebol ha pipethwou. Qen P=,=c I=y=c pen=o=c@ je ;wk te ]metouro nem ]jom nem pi`wou sa `eneh. `Amyn.\nالكاهن (سراً):\n** Priest Inaudibly:\n** Pi`precbuteroc@\nنعم نسألك يا الله الآب ضابط الكل، لا تدخلنا في تجربة لكن نجنا من الشرير.\n** Yea, we ask You, O God, the Father, the Pantocrator, lead us not into temptation, but deliver us from the evil one.\n** Ce ten]ho `erok `V] `vIwt piPantokratwr `mpereten `eqoun `epiracmoc@ alla nahmen `ebolha pipethwou.\nوالأفعال المتنوعة التي لإبليس، إطرحها عنا. والسعايات الكائنة بمشورة الناس الأشرار، إجعلها كلها كلا شئ
