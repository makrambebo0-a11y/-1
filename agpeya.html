  <style>
    #reader {
    --rd-bg:#f3f5fb; --rd-card:#fff; --rd-text:#1b2340; --rd-sub:#5b6585;
    --rd-from:#1e3a8a; --rd-to:#3b5bdb; --rd-gold:#d4a63a; --rd-shadow:0 8px 24px rgba(30,58,138,.12);
    display:block; min-height:100vh; padding:24px 16px 60px;
    background:var(--rd-bg); color:var(--rd-text);
    font-family:"Cairo",sans-serif; direction:rtl; transition:background .3s,color .3s;
  }
  #reader[data-theme="dark"] {
    --rd-bg:#0d1220; --rd-card:#161d33; --rd-text:#e8ecf8; --rd-sub:#a3adcc;
    --rd-from:#2a3f9e; --rd-to:#4a66e0; --rd-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #reader *, #reader *::before, #reader *::after { box-sizing:border-box; }
  #reader .rd-wrap { max-width:820px; margin:0 auto; }

  #reader .rd-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  #reader .rd-tools { display:flex; gap:8px; }
  #reader .rd-btn {
    display:inline-flex; align-items:center; justify-content:center;
    height:44px; min-width:44px; padding:0 16px; border:none; border-radius:22px; cursor:pointer;
    background:var(--rd-card); color:var(--rd-text); box-shadow:var(--rd-shadow);
    font:600 15px "Cairo",sans-serif; text-decoration:none; transition:transform .2s;
  }
  #reader .rd-btn:hover { transform:translateY(-2px); }

  #reader .rd-card { display:block; background:var(--rd-card); border-radius:22px; box-shadow:var(--rd-shadow); overflow:hidden; }
  #reader .rd-title {
    margin:0; padding:26px 20px; text-align:center; color:#fff; font-size:28px; font-weight:900;
    background:linear-gradient(135deg, var(--rd-from), var(--rd-to)); border-bottom:4px solid var(--rd-gold);
  }
  #reader .rd-text {
    display:block; padding:28px; font-size:20px; line-height:2.1; white-space:pre-wrap;
    color:var(--rd-text); word-wrap:break-word;
  }
  #reader .rd-text.rd-missing { text-align:center; color:var(--rd-sub); }

  @media (max-width:520px) { #reader .rd-title { font-size:22px; } #reader .rd-text { padding:20px; } }
    #booksPage {
      --bk-bg:#f3f5fb; --bk-card:#fff; --bk-text:#1b2340; --bk-sub:#5b6585; --bk-soft:#eef1fa;
      --bk-from:#1e3a8a; --bk-to:#3b5bdb; --bk-gold:#d4a63a; --bk-shadow:0 8px 24px rgba(30,58,138,.12);
      display:block; width:100%; min-height:100vh; padding:24px 16px 60px;
      background:var(--bk-bg); color:var(--bk-text);
      font-family:"Cairo",sans-serif; direction:rtl; transition:background .3s,color .3s;
    }
    #booksPage[data-theme="dark"] {
      --bk-bg:#0d1220; --bk-card:#161d33; --bk-text:#e8ecf8; --bk-sub:#a3adcc; --bk-soft:#1f2846;
      --bk-from:#2a3f9e; --bk-to:#4a66e0; --bk-shadow:0 8px 24px rgba(0,0,0,.45);
    }
    #booksPage *, #booksPage *::before, #booksPage *::after { box-sizing:border-box; }
    #booksPage .bk-wrap { display:block; max-width:1100px; margin:0 auto; }

    #booksPage .bk-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    #booksPage .bk-back, #booksPage .bk-theme {
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      height:44px; padding:0 16px; border:none; border-radius:22px; cursor:pointer;
      background:var(--bk-card); color:var(--bk-text); box-shadow:var(--bk-shadow);
      font:600 15px "Cairo",sans-serif; text-decoration:none; transition:transform .2s;
    }
    #booksPage .bk-theme { width:44px; padding:0; font-size:20px; border-radius:50%; }
    #booksPage .bk-back:hover, #booksPage .bk-theme:hover { transform:translateY(-2px); }

    #booksPage .bk-hero {
      display:block; position:relative; z-index:1; width:100%;
      text-align:center; padding:40px 20px; border-radius:24px; color:#fff;
      background:radial-gradient(circle at 20% 20%, rgba(212,166,58,.25), transparent 45%),
                 linear-gradient(135deg, var(--bk-from), var(--bk-to));
      box-shadow:var(--bk-shadow);
    }
    #booksPage .bk-hero h1 { margin:0 0 8px; font-size:34px; font-weight:900; color:#fff; }
    #booksPage .bk-hero h1 span { color:#f3d37a; }
    #booksPage .bk-hero p { margin:0; opacity:.85; font-size:16px; color:#fff; }

    #booksPage .bk-search { max-width:480px; margin:-24px auto 28px; position:relative; z-index:5; padding:0 16px; }
    #booksPage .bk-search input {
      width:100%; height:50px; padding:0 48px 0 18px; border:none; border-radius:25px; outline:none;
      background:var(--bk-card); color:var(--bk-text); box-shadow:var(--bk-shadow);
      font:600 16px "Cairo",sans-serif;
    }
    #booksPage .bk-search input:focus { box-shadow:0 0 0 3px rgba(59,91,219,.35), var(--bk-shadow); }
    #booksPage .bk-search i { position:absolute; right:32px; top:50%; transform:translateY(-50%); font-style:normal; opacity:.6; }

    #booksPage .bk-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:20px; }
    #booksPage .bk-card {
      display:flex; flex-direction:column; gap:10px; padding:22px; border-radius:20px;
      background:var(--bk-card); color:var(--bk-text); text-decoration:none;
      box-shadow:var(--bk-shadow); border-top:4px solid transparent;
      transition:transform .25s, border-color .25s; animation:bkRise .5s ease both;
    }
    #booksPage .bk-card:hover { transform:translateY(-6px); border-top-color:var(--bk-gold); }

    /* مربع الأيقونة / الصورة */
    #booksPage .bk-icon {
      width:60px; height:60px; border-radius:16px; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-size:30px; background:var(--bk-soft);
    }
    #booksPage .bk-icon img { width:100%; height:100%; object-fit:cover; display:block; }

    #booksPage .bk-card h2 { margin:4px 0 0; font-size:20px; font-weight:700; color:var(--bk-text); }
    #booksPage .bk-card p { margin:0; color:var(--bk-sub); font-size:14.5px; line-height:1.8; flex:1; }
    #booksPage .bk-open { color:var(--bk-to); font-weight:700; font-size:14px; }
    #booksPage[data-theme="dark"] .bk-open { color:#8fa5ff; }
    #booksPage .bk-card:hover .bk-open { color:var(--bk-gold); }
    #booksPage .bk-empty { grid-column:1/-1; text-align:center; padding:40px; color:var(--bk-sub); }

    @keyframes bkRise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @media (max-width:520px) { #booksPage .bk-hero h1 { font-size:26px; } #booksPage .bk-grid { grid-template-columns:1fr; } }
  </style>
<script src="settings.js"></script>

<style>

body{--night:#081533;--gold:#d8a94a;--gold-hi:#f4dc92;--ink:#fff;--line:#d8a94a50;--glass:#081533d9}

<!-- 3) في آخر <body> -->
<script>
const $ = (s, r = document) => r.querySelector(s);
const NAV = [
  ["المسيحية", [["الله تبارك اسمه", "main/god.html"], ["لا إله إلا الله: وحدانية الله في المسيحية", "#"], ["ما هو الكتاب المقدس، وأقسامه؟", "#"]]],
  ["الكتاب المقدس", [["العهد القديم", "bible.html"], ["العهد الجديد", "bible1.html"], ["معلومات عن الكتب المقدسة", "#"]]],
  ["كتب", [["الأجبية", "agpeya1.html"], ["مكتبة الكتب", "library.html"]]],
  ["طقس", [["طقس الكنيسة", "main/weather.html"]]],
  ["عقيدة", [["تبسيط الإيمان", "main/Faith.html"]]],
  ["تاريخ", [["تاريخ الكنيسة", "main/history.html"]]],
  ["أسئلة", [["أسئلة على الكنيسة", "main/Questions.html"]]],
  ["خدمة", [["خدمة", "main/service.html"]]]
];
document.getElementById('links').innerHTML = NAV.map(([t, items]) =>
  `<div class="dd"><button type="button" aria-expanded="false">${t}</button><div class="menu">${items.map(([n, h]) => `<a href="${h}">${n}</a>`).join('')}</div></div>`).join('');

const fit = d => requestAnimationFrame(() => {
  const m = d.querySelector('.menu'); m.style.translate = '0px';
  const r = m.getBoundingClientRect(); if (!r.width) return;
  m.style.translate = (r.left < 8 ? 8 - r.left : r.right > innerWidth - 8 ? innerWidth - 8 - r.right : 0) + 'px';
});
document.querySelectorAll('.dd').forEach(d => d.addEventListener('pointerenter', () => fit(d)));
document.addEventListener('click', e => {
  const hit = e.target.closest('.dd > button')?.parentElement;
  document.querySelectorAll('.dd').forEach(d => {
    const open = d === hit && !d.classList.contains('open');
    d.classList.toggle('open', open);
    d.firstElementChild.setAttribute('aria-expanded', open);
    if (open) fit(d);
  });
});

try { document.body.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}
if (/(^|\/)(index\.html)?$/i.test(location.pathname)) document.getElementById('exitBtn').remove();
document.getElementById('theme').onclick = () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
};

/* البحث في كل صفحات الموقع */
{
  const input = $('#q');
  const strip = s => s.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
  const map = s => s.toLowerCase().replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  const norm = s => map(strip(s)).trim();
  const seen = new Set(), PAGES = [];
  const add = (title, href, cat) => {
    if (!href || href === '#' || seen.has(href)) return;
    seen.add(href); PAGES.push({ title, href, cat, text: '', key: '', tkey: map(strip(title + ' ' + cat)) });
  };
  NAV.forEach(([cat, items]) => items.forEach(([t, h]) => add(t, h, cat)));
  add(document.title, 'index.html', 'الرئيسية');

  let ready = false, building;
  const build = () => building ??= Promise.all(PAGES.map(async p => {
    try {
      const r = await fetch(p.href); if (!r.ok) return;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,.dock,.top-navigation-wrapper,.nav-bar-container').forEach(n => n.remove());
      p.text = strip((doc.body?.textContent || '').replace(/\s+/g, ' ').trim()); p.key = map(p.text);
    } catch {}
  })).then(() => { ready = true; render(); });

  const box = document.createElement('div');
  box.id = 'search-results'; box.hidden = true; document.body.append(box);
  const st = document.createElement('style');
  st.textContent = '#search-results{position:fixed;z-index:60;max-height:60vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--night);box-shadow:0 24px 50px #040b1faa}#search-results[hidden]{display:none}#search-results a{display:block;padding:9px 12px;border-radius:8px;color:var(--gold-hi);font:500 17px var(--kufi);text-decoration:none}#search-results a:hover,#search-results a.sel{background:var(--line)}#search-results small{display:block;margin-top:2px;color:var(--mute);font:400 15px/1.7 var(--naskh)}#search-results mark{background:#d8a94a55;color:inherit;border-radius:3px}#search-results .none{padding:10px 12px;color:var(--mute)}';
  document.head.append(st);

  const place = () => {
    const r = input.getBoundingClientRect(), w = Math.max(r.width, 300);
    Object.assign(box.style, { top: r.bottom + 8 + 'px', width: w + 'px', left: Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px' });
  };
  const snippet = (p, terms) => {
    let at = -1;
    for (const t of terms) { const i = p.key.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
    if (at < 0) return null;
    const s = Math.max(0, at - 35), e = Math.min(p.text.length, at + 90), seg = p.text.slice(s, e), kseg = p.key.slice(s, e), ranges = [];
    terms.forEach(t => { let i = kseg.indexOf(t); while (i >= 0) { ranges.push([i, i + t.length]); i = kseg.indexOf(t, i + t.length); } });
    ranges.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    if (s > 0) frag.append('… ');
    for (const [a, b] of ranges) {
      if (a < pos) continue;
      frag.append(seg.slice(pos, a));
      const m = document.createElement('mark'); m.textContent = seg.slice(a, b); frag.append(m); pos = b;
    }
    frag.append(seg.slice(pos)); if (e < p.text.length) frag.append(' …');
    return frag;
  };
  let selected = -1;
  const note = msg => { const d = document.createElement('div'); d.className = 'none'; d.textContent = msg; box.append(d); };
  function render() {
    const terms = norm(input.value).split(/\s+/).filter(Boolean);
    box.textContent = ''; selected = -1;
    if (!terms.length) { box.hidden = true; return; }
    const res = PAGES.map(p => {
      if (!terms.every(t => (p.tkey + ' ' + p.key).includes(t))) return null;
      let score = 0;
      terms.forEach(t => { if (p.tkey.includes(t)) score += 100; score += Math.min(p.key.split(t).length - 1, 50); });
      return { p, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);
    if (!res.length) note(ready ? 'لا توجد نتائج' : 'جارٍ فهرسة الموقع…');
    else {
      res.forEach(({ p }) => {
        const a = document.createElement('a'), s = document.createElement('small'), sn = snippet(p, terms);
        a.href = p.href; a.textContent = p.title; sn ? s.append(sn) : (s.textContent = p.cat); a.append(s); box.append(a);
      });
      if (!ready) note('جارٍ فهرسة باقي الموقع…');
    }
    place(); box.hidden = false;
  }
  input.addEventListener('focus', () => { build(); render(); });
  input.addEventListener('input', () => { build(); render(); });
  input.addEventListener('keydown', e => {
    const items = [...box.querySelectorAll('a')];
    if (e.key === 'Escape') { box.hidden = true; return; }
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); selected = (selected + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === selected));
    } else if (e.key === 'Enter') { e.preventDefault(); location.href = items[Math.max(selected, 0)].href; }
  });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
  addEventListener('resize', place); addEventListener('scroll', place, { passive: true });
}
</script>

    { img:"img/5.png",     title:"دلال أسبوع الآلام",    href:"week.html", desc:"ترتيب وصلوات وقراءات أسبوع الآلام يومًا بيوم." },
    { img:"img/6.png",     title:"صلاة السجدة",          href:"alsajda.html", desc:"صلوات السجدة التي تُقال في عيد العنصرة (يوم الخمسين)." },
    { img:"img/7.png",       title:" طقس الكنيسه",          href:"weather.html", desc:" جميع معلومات الكنيسة " },
    { img:"img/7.png",       title:"صلوات القسم",          href:"salawat.html", desc:"مجموعة صلوات القسم الكنسية." },
    ];

  const grid = document.getElementById("bkGrid");

  function render(list) {
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="bk-empty">لا توجد نتائج</div>'; return; }
    list.forEach((b, i) => {
      const a = document.createElement("a");
      a.className = "bk-card";
      a.href = b.href;
      a.style.animationDelay = (i * 0.06) + "s";

      // صورة لو موجودة، وإلا إيموجي، وإلا 📖
      const pic = b.img ? `<img src="${b.img}" alt="${b.title}">` : (b.icon || "📖");

      a.innerHTML = `<div class="bk-icon">${pic}</div><h2>${b.title}</h2><p>${b.desc}</p><span class="bk-open">فتح الكتاب ←</span>`;
      grid.appendChild(a);
    });
  }
  render(books);

  document.getElementById("bkSearch").addEventListener("input", e => {
    const q = e.target.value.trim();
    render(books.filter(b => b.title.includes(q) || b.desc.includes(q)));
  });

  const root = document.getElementById("booksPage"), btn = document.getElementById("bkTheme");
  function setTheme(t) {
    root.dataset.theme = t; btn.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved === "dark" ? "dark" : "light");
  btn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
})();

/* أيقونة "خيارات" */
if (window.lucide) lucide.createIcons();
</script>
