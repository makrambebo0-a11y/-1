    #copticCal .cc-year { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; }
    #copticCal .cc-month { background: var(--cc-card); border-radius: 18px; box-shadow: var(--cc-shadow); overflow: hidden; transition: transform .25s; animation: ccRise .5s ease both; }
    #copticCal .cc-month:hover { transform: translateY(-4px); }
    #copticCal .cc-month.cc-nasi { grid-column: 2; }
    #copticCal .cc-month h3 { margin: 0; padding: 14px; text-align: center; color: #fff; font-size: 17px; font-weight: 700; background: linear-gradient(135deg, var(--cc-from), var(--cc-to)); border-bottom: 3px solid var(--cc-gold); }

    #copticCal .cc-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--cc-day); color: var(--cc-text) !important; font-weight: 600; font-size: 15px; cursor: pointer; transition: transform .15s, background .15s; }
    #copticCal .cc-day:hover { background: var(--cc-hover); transform: scale(1.12); }
    #copticCal .cc-day.cc-todayCell { background: linear-gradient(135deg, #f3d37a, var(--cc-gold)); color: #3a2a00 !important; font-weight: 700; box-shadow: 0 0 0 3px rgba(212,166,58,.35); }

    @keyframes ccRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (max-width: 800px) { #copticCal .cc-year { grid-template-columns: repeat(2, 1fr); } #copticCal .cc-month.cc-nasi { grid-column: auto; } }

<script>
const $ = (s, r = document) => r.querySelector(s);
const NAV = [
  ["المسيحية", [["الله تبارك اسمه", "main/god.html"], ["لا إله إلا الله: وحدانية الله في المسيحية", "#"], ["ما هو الكتاب المقدس، وأقسامه؟", "#"]]],
  ["الكتاب المقدس", [["العهد القديم", "bible.html"], ["العهد الجديد", "bible1.html"], ["معلومات عن الكتب المقدسة", "#"]]],
  ["كتب", [["الأجبية", "agpeya1.html"], ["مكتبة الكتب", "library.html"]]],
  ["طقس", [["طقس الكنيسة", "main/weather.html"]]],
  ["عقيدة", [["تبسيط الإيمان", "main/Faith.html"]]],
  ["تاريخ", [["تاريخ الكنيسة", "main/history.html"]]],
  ["أسئلة", [["أسئلة على الكنيسة", "main/Questions.html"]]],
  ["خدمة", [["خدمة", "main/service.html"]]]
];
document.getElementById('links').innerHTML = NAV.map(([t, items]) =>
  `<div class="dd"><button type="button" aria-expanded="false">${t}</button><div class="menu">${items.map(([n, h]) => `<a href="${h}">${n}</a>`).join('')}</div></div>`).join('');

const fit = d => requestAnimationFrame(() => {
  const m = d.querySelector('.menu'); m.style.translate = '0px';
  const r = m.getBoundingClientRect(); if (!r.width) return;
  m.style.translate = (r.left < 8 ? 8 - r.left : r.right > innerWidth - 8 ? innerWidth - 8 - r.right : 0) + 'px';
});
document.querySelectorAll('.dd').forEach(d => d.addEventListener('pointerenter', () => fit(d)));
document.addEventListener('click', e => {
  const hit = e.target.closest('.dd > button')?.parentElement;
  document.querySelectorAll('.dd').forEach(d => {
    const open = d === hit && !d.classList.contains('open');
    d.classList.toggle('open', open);
    d.firstElementChild.setAttribute('aria-expanded', open);
    if (open) fit(d);
  });
});

try { document.body.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}
if (/(^|\/)(index\.html)?$/i.test(location.pathname)) document.getElementById('exitBtn').remove();
document.getElementById('theme').onclick = () => {
  const t = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
};

/* البحث في كل صفحات الموقع */
{
  const input = $('#q');
  const strip = s => s.replace(/[\u064B-\u0652\u0670\u0640]/g, '');
  const map = s => s.toLowerCase().replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
  const norm = s => map(strip(s)).trim();
  const seen = new Set(), PAGES = [];
  const add = (title, href, cat) => {
    if (!href || href === '#' || seen.has(href)) return;
    seen.add(href); PAGES.push({ title, href, cat, text: '', key: '', tkey: map(strip(title + ' ' + cat)) });
  };
  NAV.forEach(([cat, items]) => items.forEach(([t, h]) => add(t, h, cat)));
  add(document.title, 'index.html', 'الرئيسية');

  let ready = false, building;
  const build = () => building ??= Promise.all(PAGES.map(async p => {
    try {
      const r = await fetch(p.href); if (!r.ok) return;
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,.dock,.top-navigation-wrapper,.nav-bar-container').forEach(n => n.remove());
      p.text = strip((doc.body?.textContent || '').replace(/\s+/g, ' ').trim()); p.key = map(p.text);
    } catch {}
  })).then(() => { ready = true; render(); });

  const box = document.createElement('div');
  box.id = 'search-results'; box.hidden = true; document.body.append(box);
  const st = document.createElement('style');
  st.textContent = '#search-results{position:fixed;z-index:60;max-height:60vh;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--night);box-shadow:0 24px 50px #040b1faa}#search-results[hidden]{display:none}#search-results a{display:block;padding:9px 12px;border-radius:8px;color:var(--gold-hi);font:500 17px var(--kufi);text-decoration:none}#search-results a:hover,#search-results a.sel{background:var(--line)}#search-results small{display:block;margin-top:2px;color:var(--mute);font:400 15px/1.7 var(--naskh)}#search-results mark{background:#d8a94a55;color:inherit;border-radius:3px}#search-results .none{padding:10px 12px;color:var(--mute)}';
  document.head.append(st);

  const place = () => {
    const r = input.getBoundingClientRect(), w = Math.max(r.width, 300);
    Object.assign(box.style, { top: r.bottom + 8 + 'px', width: w + 'px', left: Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px' });
  };
  const snippet = (p, terms) => {
    let at = -1;
    for (const t of terms) { const i = p.key.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
    if (at < 0) return null;
    const s = Math.max(0, at - 35), e = Math.min(p.text.length, at + 90), seg = p.text.slice(s, e), kseg = p.key.slice(s, e), ranges = [];
    terms.forEach(t => { let i = kseg.indexOf(t); while (i >= 0) { ranges.push([i, i + t.length]); i = kseg.indexOf(t, i + t.length); } });
    ranges.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    if (s > 0) frag.append('… ');
    for (const [a, b] of ranges) {
      if (a < pos) continue;
      frag.append(seg.slice(pos, a));
      const m = document.createElement('mark'); m.textContent = seg.slice(a, b); frag.append(m); pos = b;
    }
    frag.append(seg.slice(pos)); if (e < p.text.length) frag.append(' …');
    return frag;
  };
  let selected = -1;
  const note = msg => { const d = document.createElement('div'); d.className = 'none'; d.textContent = msg; box.append(d); };
  function render() {
    const terms = norm(input.value).split(/\s+/).filter(Boolean);
    box.textContent = ''; selected = -1;
    if (!terms.length) { box.hidden = true; return; }
    const res = PAGES.map(p => {
      if (!terms.every(t => (p.tkey + ' ' + p.key).includes(t))) return null;
      let score = 0;
      terms.forEach(t => { if (p.tkey.includes(t)) score += 100; score += Math.min(p.key.split(t).length - 1, 50); });
      return { p, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);
    if (!res.length) note(ready ? 'لا توجد نتائج' : 'جارٍ فهرسة الموقع…');
    else {
      res.forEach(({ p }) => {
        const a = document.createElement('a'), s = document.createElement('small'), sn = snippet(p, terms);
        a.href = p.href; a.textContent = p.title; sn ? s.append(sn) : (s.textContent = p.cat); a.append(s); box.append(a);
      });
      if (!ready) note('جارٍ فهرسة باقي الموقع…');
    }
    place(); box.hidden = false;
  }
  input.addEventListener('focus', () => { build(); render(); });
  input.addEventListener('input', () => { build(); render(); });
  input.addEventListener('keydown', e => {
    const items = [...box.querySelectorAll('a')];
    if (e.key === 'Escape') { box.hidden = true; return; }
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); selected = (selected + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === selected));
    } else if (e.key === 'Enter') { e.preventDefault(); location.href = items[Math.max(selected, 0)].href; }
  });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
  addEventListener('resize', place); addEventListener('scroll', place, { passive: true });
}
</script>

<!-- ===== السكريبتات: مرة واحدة بس، في آخر الصفحة ===== -->
<script>
(function () {
  const months = ["توت","بابة","هاتور","كيهك","طوبة","أمشير","برمهات","برمودة","بشنس","بؤونة","أبيب","مسرى","نسئ"];

  function toCoptic(date) {
    const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    const jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
                Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    const n = jdn - 1825030, y0 = Math.floor((4 * n + 3) / 1461);
    const doy = n - Math.floor(1461 * y0 / 4);
    return { year: y0 + 1, month: Math.floor(doy / 30) + 1, day: (doy % 30) + 1 };
  }

  const today = toCoptic(new Date());
  document.getElementById("ccTodayLabel").textContent =
    `اليوم: ${today.day} ${months[today.month - 1]} ${today.year}`;

  const yearBox = document.getElementById("ccYear");
  for (let m = 1; m <= 13; m++) {
    const isNasi = m === 13;
    const box = document.createElement("div");
    box.className = "cc-month" + (isNasi ? " cc-nasi" : "");
    box.style.animationDelay = (m * 0.04) + "s";
    box.innerHTML = `<h3><small>${m}-</small>شهر ${months[m - 1]}</h3><div class="cc-days"></div>`;
    const days = box.querySelector(".cc-days");
    for (let d = 1; d <= (isNasi ? 6 : 30); d++) {
      const cell = document.createElement("div");
      cell.className = "cc-day";
      cell.textContent = d;
      if (m === today.month && d === today.day) cell.classList.add("cc-todayCell");
      cell.addEventListener("click", () => { location.href = `day.html?m=${m}&d=${d}`; });
      days.appendChild(cell);
    }
    yearBox.appendChild(box);
  }

  const root = document.getElementById("copticCal"), btn = document.getElementById("ccThemeBtn");
  function setTheme(t) {
    root.dataset.theme = t; btn.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved === "dark" ? "dark" : "light");
  btn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
})();

/* أيقونات lucide (زرار الخيارات) */
if (window.lucide) lucide.createIcons();
</script>

  function currentLang() {

  // تغيير اللغة
  function setLang(lang) {
    var past = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
    if (lang === 'en') {
      document.cookie = 'googtrans=/ar/en;path=/';
      document.cookie = 'googtrans=/ar/en;path=/;domain=' + location.hostname;
    } else {
      document.cookie = 'googtrans=;' + past + ';path=/';

  // ضبط الزر واتجاه الصفحة عند التحميل

    ["تعالوا إليَّ يا جميع المتعبين والثقيلي الأحمال وأنا أريحكم.", "متى 11: 28"],
    ["الرب نوري وخلاصي، ممن أخاف؟ الرب حصن حياتي، ممن أرتعب؟", "مزمور 27: 1"],
    ["أنا هو القيامة والحياة. من آمن بي ولو مات فسيحيا.", "يوحنا 11: 25"],
    ["أنا هو الطريق والحق والحياة. ليس أحد يأتي إلى الآب إلا بي.", "يوحنا 14: 6"],
    ["سلامًا أترك لكم. سلامي أعطيكم. لا تضطرب قلوبكم ولا ترهب.", "يوحنا 14: 27"],
    ["كل ما عملتم فاعملوا من القلب كما للرب ليس للناس.", "كولوسي 3: 23"],
    ["اطلبوا أولًا ملكوت الله وبره، وهذه كلها تزاد لكم.", "متى 6: 33"],
    ["الرب قريب من المنكسري القلوب، ويخلّص المنسحقي الروح.", "مزمور 34: 18"],
    ["افرحوا في الرب كل حين. وأقول أيضًا افرحوا.", "فيلبي 4: 4"],
    ["اسألوا تعطوا. اطلبوا تجدوا. اقرعوا يفتح لكم.", "متى 7: 7"],
    ["الله لنا ملجأ وقوة، عونًا في الضيقات وُجد شديدًا.", "مزمور 46: 1"],
    ["الرب يحفظ خروجك ودخولك من الآن وإلى الدهر.", "مزمور 121: 8"]
  ];

  (function showDailyVerse() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const [text, ref] = VERSES[dayOfYear % VERSES.length];

    document.getElementById("daily-verse").textContent = "\u201C" + text + "\u201D";
    document.getElementById("verse-ref").textContent = "- " + ref;
  })();
</script>
<script>
(function () {
  const input = document.querySelector('#poda .input');
  if (!input) return;

  const strip = s => s.replace(/[\u064B-\u0652\u0670\u0640]/g, '');           // يشيل التشكيل
  const map = s => s.toLowerCase().replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); // 1 لـ 1
  const norm = s => map(strip(s)).trim();

  // ---- تجميع صفحات الموقع من القوائم + الصفحة الحالية ----
  const seen = new Set(), PAGES = [];
  function add(title, href, cat) {
    if (!href || href === '#' || href.startsWith('javascript') || seen.has(href)) return;
    try { if (new URL(href, location.href).origin !== location.origin) return; } catch (e) { return; }
    seen.add(href);
    PAGES.push({ title, href, cat, text: '', key: '', tkey: map(strip(title + ' ' + cat)) });
  }
  document.querySelectorAll('.dropdown-menu a').forEach(a => {
    const cat = a.closest('.dropdown-container').querySelector('.top-nav-item').textContent.trim();
    add(a.textContent.trim().replace(/\s+/g, ' '), a.getAttribute('href'), cat);
  });
  add(document.title || 'الرئيسية', location.pathname.split('/').pop() || 'index.html', 'الرئيسية');

  // ---- بناء الفهرس (مرة واحدة) ----
  let ready = false, building = null;
  function build() {
    if (building) return building;
    building = Promise.all(PAGES.map(async p => {
      try {
        const r = await fetch(p.href);
        if (!r.ok) return;
        const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
        doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,.top-navigation-wrapper,.nav-bar-container')
          .forEach(n => n.remove());
        p.text = strip((doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').trim());
        p.key = map(p.text);
      } catch (e) { /* الصفحة مش متاحة: يفضل البحث في اسمها بس */ }
    })).then(() => { ready = true; render(); });
    return building;
  }

  // ---- صندوق النتائج ----
  const box = document.createElement('div');
  box.id = 'search-results';
  document.body.appendChild(box);

  function place() {
    const r = input.getBoundingClientRect(), w = Math.max(r.width, 300);
    box.style.top = (r.bottom + 8) + 'px';
    box.style.width = w + 'px';
    box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  }

  // مقتطف مع تظليل الكلمات
  function snippet(p, terms) {
    let at = -1;
    for (const t of terms) { const i = p.key.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
    if (at < 0) return null;
    const s = Math.max(0, at - 35), e = Math.min(p.text.length, at + 90);
    const seg = p.text.slice(s, e), kseg = p.key.slice(s, e), ranges = [];
    terms.forEach(t => { let i = kseg.indexOf(t); while (i >= 0) { ranges.push([i, i + t.length]); i = kseg.indexOf(t, i + t.length); } });
    ranges.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment();
    if (s > 0) frag.append('… ');
    let pos = 0;
    ranges.forEach(([a, b]) => {
      if (a < pos) return;
      frag.append(seg.slice(pos, a));
      const m = document.createElement('mark'); m.textContent = seg.slice(a, b); frag.append(m);
      pos = b;
    });
    frag.append(seg.slice(pos));
    if (e < p.text.length) frag.append(' …');
    return frag;
  }

  let selected = -1;
  function render() {
    const terms = norm(input.value).split(/\s+/).filter(Boolean);
    box.textContent = ''; selected = -1;
    if (!terms.length) { box.style.display = 'none'; return; }

    const res = PAGES.map(p => {
      const all = p.tkey + ' ' + p.key;
      if (!terms.every(t => all.includes(t))) return null;
      let score = 0;
      terms.forEach(t => {
        if (p.tkey.includes(t)) score += 100;
        score += Math.min((p.key.split(t).length - 1), 50);
      });
      return { p, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);

    if (!res.length) {
      const d = document.createElement('div'); d.className = 'none';
      d.textContent = ready ? 'لا توجد نتائج' : 'جارٍ فهرسة الموقع…';
      box.appendChild(d);
    } else {
      res.forEach(({ p }) => {
        const a = document.createElement('a'); a.href = p.href;
        a.textContent = p.title;
        const s = document.createElement('small');
        const sn = snippet(p, terms);
        if (sn) s.append(sn); else s.textContent = p.cat;
        a.appendChild(s); box.appendChild(a);
      });
      if (!ready) { const d = document.createElement('div'); d.className = 'none'; d.textContent = 'جارٍ فهرسة باقي الموقع…'; box.appendChild(d); }
    }
    place(); box.style.display = 'block';
  }

  input.addEventListener('focus', () => { build(); render(); });
  input.addEventListener('input', () => { build(); render(); });

  input.addEventListener('keydown', e => {
    const items = [...box.querySelectorAll('a')];
    if (e.key === 'Escape') { box.style.display = 'none'; return; }
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      selected = (selected + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === selected));
    } else if (e.key === 'Enter') {
      e.preventDefault(); location.href = items[selected >= 0 ? selected : 0].href;
    }
  });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== input) box.style.display = 'none'; });
  window.addEventListener('resize', place);
  window.addEventListener('scroll', place, { passive: true });
})();
</script>
</body>
